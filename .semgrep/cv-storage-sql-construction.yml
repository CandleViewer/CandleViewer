rules:
  - id: cv-storage-sql-construction
    languages: [python]
    severity: ERROR
    message: >-
      SQL built by f-string, %-format, .format(), .replace() or concatenation in storage/**,
      in `sa.text(...)` as in `text(...)`.
      Threat: SQL injection into the hot/relational tier (E07 STRIDE, SR-097
      neighbourhood; CONSTITUTION C-12). Use bound parameters or SQLAlchemy Core.
    metadata:
      rule-id: cv-storage-sql-construction
    patterns:
      - pattern-either:
          - pattern: $X.execute(f"...", ...)
          - pattern: $X.execute("..." % ..., ...)
          - pattern: $X.execute("...".format(...), ...)
          - pattern: $X.execute("..." + ..., ...)
          - pattern: $X.fetch(f"...", ...)
          - pattern: $X.fetchrow(f"...", ...)
          - pattern: $X.fetchval(f"...", ...)
          - pattern: $X.fetch("...".format(...), ...)
          - pattern: $X.fetch("..." + ..., ...)
          # `text(...)`: the bare name, and `sqlalchemy.text` resolved through the imports
          # (renamed ones too). A by-name `$SA.text(...)` flagged a non-SQL helper imported as
          # `_text` on `main`. `<... ...>` looks through the argument: an f-string split over
          # literals, or a `.replace(...).replace(...)` chain.
          - pattern: text(<... f"..." ...>)
          - pattern: text("..." + ...)
          - pattern: text("...".format(...))
          - pattern: text("..." % ...)
          - pattern: text(<... "...".replace(...) ...>)
          - pattern: sqlalchemy.text(<... f"..." ...>)
          - pattern: sqlalchemy.text("..." + ...)
          - pattern: sqlalchemy.text("...".format(...))
          - pattern: sqlalchemy.text("..." % ...)
          - pattern: sqlalchemy.text(<... "...".replace(...) ...>)
          # `sa.sql.text`, `sa.sql.expression.text` and renamed imports of them have no call site
          # on `main`: any of these forms, and any `.replace`, is flagged anywhere in the
          # argument.
          - patterns:
              - pattern-either:
                  - pattern: sqlalchemy.sql.text($ARG)
                  - pattern: sqlalchemy.sql.expression.text($ARG)
              - metavariable-pattern:
                  metavariable: $ARG
                  pattern-either:
                    - pattern: f"..."
                    - pattern: '"..." + ...'
                    - pattern: '"..." % ...'
                    - pattern: '"...".format(...)'
                    - pattern: $X.replace(...)
          # A helper's `template.replace("@C@", frag)`: flagged unless every replacement is a
          # literal or an unannotated module constant, as in the reviewed `_sql(template)`
          # helpers (Semgrep's constant propagation skips a `Final` constant).
          - patterns:
              - pattern-either:
                  - pattern: text(<... $X.replace($A, $B, ...) ...>)
                  - pattern: sqlalchemy.text(<... $X.replace($A, $B, ...) ...>)
              - metavariable-pattern:
                  metavariable: $B
                  patterns:
                    - pattern: $Y
                    - pattern-not: '"..."'
    paths:
      include:
        - "services/api/candleviewer/storage/**"
        - "**/cv-storage-sql-construction*"
