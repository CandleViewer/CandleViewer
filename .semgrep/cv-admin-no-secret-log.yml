rules:
  - id: cv-admin-no-secret-log
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      A value made from an invite link, a backup download URL or token, an API secret or a TOTP
      code reaches a log call or the log context (C-12.6, SR-122, E42-X03). Log an opaque id, a
      length or a digest instead: `redact_text`, `len`, `hashlib` and `Secret(...)` clean a value.
      Unlike the auth pack's name-based `no-secret-logging`, this follows the value through
      assignments and f-strings.
    metadata:
      rule-id: cv-admin-no-secret-log
      sr: SR-122
    pattern-sources:
      - pattern: secrets.token_urlsafe(...)
      - pattern: secrets.token_hex(...)
      - pattern: secrets.token_bytes(...)
      - pattern: $X.token
      - pattern: $X.invite_token
      - pattern: $X.invite_url
      - pattern: $X.download_url
      - pattern: $X.api_secret
      - pattern: $X.totp_code
      - pattern: $X.totp_secret
      - pattern: $X.get_secret_value()
      - pattern: $X.reveal()
      # The code of a step-up, MFA, TOTP, OTP or recovery body; an untyped `.code` is an error
      # code. `Otp` counts only as a word of the type's name, so `FootprintBar` is none. `def`
      # matches `async def` too (no bare `async def` pattern: X03-F4).
      - patterns:
          - pattern-inside: |
              def $F(..., $B: $T, ...):
                ...
          - pattern: $B.code
          - metavariable-regex:
              metavariable: $T
              regex: ^(?:(?i:.*(?:step_?up|mfa|totp|recovery).*)|(?:.*[^A-Z])?(?:Otp|OTP)(?:[^a-z].*)?|(?:.*[^A-Za-z])?otp(?:[^a-z].*)?)$
      # A name that holds a link or invite token, wherever it is bound (a route's `{token}` path
      # parameter, an assignment, a loop), and every slice of one, a step slice too: Semgrep's
      # taint stops at a slice, so `token[:4]` is matched here as a source of its own. A slice of
      # anything else is not followed (X03-F8).
      - patterns:
          - pattern-either:
              - pattern: $V
              - pattern: $V[:$E]
              - pattern: $V[$S:]
              - pattern: $V[$S:$E]
              - pattern: $V[:]
              - pattern: $V[::$T]
              - pattern: $V[$S::$T]
              - pattern: $V[:$E:$T]
              - pattern: $V[$S:$E:$T]
          - metavariable-regex:
              metavariable: $V
              regex: ^(token|invite_token|inviteToken|link_token|raw_token)$
      # The token a link issuer hands back, under whatever name it is unpacked into
      # (api/admin_backup_links.py and admin/backups/downloads.py build the download URL from it).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $TOK, $REST = await $I.issue(...)
                  ...
              - pattern-inside: |
                  $TOK, $REST = $I.issue(...)
                  ...
          - pattern: $TOK
    pattern-sinks:
      # A call at a log level, on any receiver: a logger is often an attribute or a parameter.
      - patterns:
          - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(debug|info|warning|warn|error|exception|critical|fatal)$
      # The names that are not a logger's alone (`hmac.new`, `socket.bind`), on a receiver that
      # is a logger by its name.
      - patterns:
          - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(msg|log|bind|new|try_bind)$
          - metavariable-regex:
              metavariable: $L
              regex: (?i)^([\w.]*\.)?(_?log|_?logger|logging|structlog|_?log\(\)|_?logger\(\)|get_?logger\(.*\))$|\.(bind|new)\(.*\)$
      - pattern: structlog.contextvars.bind_contextvars(...)
    pattern-sanitizers:
      - pattern: redact_text(...)
      - pattern: len(...)
      - pattern: hashlib.$H(...)
      - pattern: Secret(...)
      # The ids a verified access token names, not the token: ws/gateway.py's `run_auth` binds
      # the session and user ids that `authenticate(token)` returns to the log context. Bound to
      # that function's exact signature (`def` matches `async def`), so no other `run_auth` under
      # candleviewer/ clears a value this way; a rename or a new signature brings the finding back.
      - patterns:
          - pattern-inside: |
              def run_auth(conn: _Connection, frame: dict[str, Any]) -> None:
                ...
          - pattern: authenticate(...)
    paths:
      include:
        - "services/api/candleviewer/**"
