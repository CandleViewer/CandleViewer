rules:
  - id: cv-obs-no-print
    languages: [python]
    severity: ERROR
    message: >-
      `print()` in an application module bypasses structured logging and the
      redaction filter (SR-120/SR-121, E04-X02). Use `structlog.get_logger`.
    metadata:
      rule-id: cv-obs-no-print
    pattern: print(...)
    paths:
      include:
        - "services/api/candleviewer/**"
        - "services/api/cvdev/**" # #2893 (ADR-0036): the dev-only sibling package
        - ".semgrep/tests/**"
      exclude:
        - "**/migrations/**"
        - "services/**/tests/**"
        - "**/test_*.py"
