rules:
  - id: cv-ws-no-credential-log
    languages: [python]
    severity: ERROR
    message: >-
      A WS gateway logging call takes a value, or a keyword, named like a token, a cookie, a secret or
      an Authorization header (SR-122, E17-X02). A credential is never logged, at any level, nor bound
      to the log context (`bind`, `bind_contextvars`): log an opaque id, `len(x)`, `bool(x)`,
      `x is None` or `Secret(x)` instead. An expiry, a TTL or an ALL-CAPS constant is not a
      credential; any other lookalike name is renamed. `print` is already banned by cv-obs-no-print.
    metadata:
      rule-id: cv-ws-no-credential-log
      sr: SR-122
    patterns:
      - pattern-either:
          # a value: a name, an attribute, a string-keyed subscript or `.get`, at any depth of an argument
          - patterns:
              - pattern-inside: $F(...)
              - pattern-either:
                  - pattern: $V
                  - pattern: $X.$V
                  - pattern: $X["$V"]
                  - pattern: $X.get("$V", ...)
              - metavariable-regex:
                  metavariable: $V
                  regex: '^(?![A-Z][A-Z0-9_]*$)(?!(?i)\w*(?:expir|ttl))(?i)\w*(?:token|authorization|auth_?header|bearer|cookie|secret)\w*$'
          # a keyword with such a name (`token=`, `access_token=`): the key is the label of the value
          - patterns:
              - pattern: $F(..., $K=$ARG, ...)
              - metavariable-regex:
                  metavariable: $K
                  regex: '(?i)^(?:\w+_)?(?:token|authorization|cookie|secret|bearer|auth_header)$'
              - pattern-not: $F(..., $K="...", ...)
              - focus-metavariable: $ARG
      # any method of a logger (log, _log(), ws_log, self.logger, structlog.get_logger(...),
      # logging.getLogger(...), and bind or new chained on one), or a structlog context binder
      - metavariable-regex:
          metavariable: $F
          regex: '(?is)^(?:(?:[\w.]*\.)?(?:\w*_)?(?:log|logger|logging|getlogger)(?:\(.*\))?(?:\.(?:bind|new)\(.*\))*\.\w+|(?:[\w.]*\.)?(?:bind|bound)_contextvars)$'
      # a length, a presence test or a redacting wrapper says nothing of the value
      - pattern-not-inside: len(...)
      - pattern-not-inside: bool(...)
      - pattern-not-inside: not $A
      - pattern-not-inside: $A is None
      - pattern-not-inside: $A is not None
      - pattern-not-inside: $A == $B
      - pattern-not-inside: $A != $B
      - pattern-not-inside: type(...)
      - pattern-not-inside: Secret(...)
      - pattern-not-inside: None
      - pattern-not-inside: "True"
      - pattern-not-inside: "False"
    paths:
      include:
        - "services/api/candleviewer/ws/**"
        - "**/cv-ws-no-credential-log*"
