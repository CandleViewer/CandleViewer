rules:
  - id: cv-ws-no-credential-log-ts
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A WS client logging call takes a value named like a token, a cookie, a secret or an
      Authorization header (SR-122, E17-X02). A credential is never logged, at any level: log an
      opaque id, `x.length`, `Boolean(x)` or `x == null` instead. An expiry, a TTL or an ALL-CAPS
      constant is not a credential; any other lookalike name is renamed.
    metadata:
      rule-id: cv-ws-no-credential-log-ts
      sr: SR-122
    patterns:
      # any console method: count, time and table print what they are given too
      - pattern-inside: console.$M(...)
      # an identifier, a member, a string-keyed subscript or `.get` (a Headers lookup), at any depth
      # of an argument: in a template literal, an object literal or a call
      - pattern-either:
          - pattern: $V
          - pattern: $X.$V
          - pattern: $X["$V"]
          - pattern: $X.get("$V")
      - metavariable-regex:
          metavariable: $V
          regex: '^(?![A-Z][A-Z0-9_]*$)(?!(?i)\w*(?:expir|ttl))(?i)\w*(?:token|authorization|auth_?header|bearer|cookie|secret)\w*$'
      # a length or a presence test says nothing of the value
      - pattern-not-inside: $A.length
      - pattern-not-inside: Boolean(...)
      - pattern-not-inside: "!$A"
      - pattern-not-inside: $A == $B
      - pattern-not-inside: $A != $B
      - pattern-not-inside: $A === $B
      - pattern-not-inside: $A !== $B
      - pattern-not-inside: typeof $A
    paths:
      include:
        - "apps/web/src/lib/ws/**"
        - "**/cv-ws-no-credential-log-ts*"
