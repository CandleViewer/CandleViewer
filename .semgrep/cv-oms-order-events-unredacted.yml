# E29-X02 (#982); OM-I05; SR-E29-08 (threat model §6 items 2 and 4); C-12.6. A write to
# `order_events.payload` that skips `redact_exchange_payload()`, in the ticket's redact-call form:
# `NewOrderEvent.payload` is a plain `Mapping`, so the record-type form has nothing to key on yet.
# What it sees and misses: docs/plan/security/ci-gates-e29.md#cv-oms-order-events-unredacted.
rules:
  - id: cv-oms-order-events-unredacted
    languages: [python]
    severity: ERROR
    message: >-
      A write to `order_events.payload` that does not pass through `redact_exchange_payload()`
      (OM-I05; SR-E29-08, threat model §6; C-12.6): the table is append-only and kept
      indefinitely, so a key, a signature or an `auth` frame stored once cannot be removed. Write
      `"payload": redact_exchange_payload(event.payload)`, as `orders_sqlalchemy._event_values`
      does, through the Core builder, never text SQL. Rule doc:
      docs/plan/security/ci-gates-e29.md#cv-oms-order-events-unredacted.
    metadata:
      rule-id: cv-oms-order-events-unredacted
      threat: [OM-I05]
      sr: [SR-E29-08]
      references:
        - docs/security/threat-models/E29-oms.md §6, OM-I05, SR-E29-08
        - docs/plan/security/ci-gates-e29.md
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from $MODULE import order_events
                  ...
              - pattern-inside: |
                  from $MODULE import order_events as $TABLE
                  ...
          - pattern-either:
              - pattern: '{..., "payload": $VALUE, ...}'
              - pattern: $TARGET["payload"] = $VALUE
              - pattern: $STMT.values(..., payload=$VALUE, ...)
          - pattern-not: '{..., "payload": redact_exchange_payload(...), ...}'
          - pattern-not: '{..., "payload": $REDACTOR.redact_exchange_payload(...), ...}'
          - pattern-not: '{..., "payload": {}, ...}'
          - pattern-not: $TARGET["payload"] = redact_exchange_payload(...)
          - pattern-not: $TARGET["payload"] = $REDACTOR.redact_exchange_payload(...)
          - pattern-not: $STMT.values(..., payload=redact_exchange_payload(...), ...)
          - pattern-not: $STMT.values(..., payload=$REDACTOR.redact_exchange_payload(...), ...)
          - focus-metavariable: $VALUE
      - patterns:
          - pattern-either:
              - pattern: $SA.insert($MODULE.order_events).values(..., payload=$VALUE, ...)
              - pattern: $SA.update($MODULE.order_events).values(..., payload=$VALUE, ...)
          - pattern-not: $SA.$WRITE($MODULE.order_events).values(..., payload=redact_exchange_payload(...), ...)
          - pattern-not: $SA.$WRITE($MODULE.order_events).values(..., payload=$REDACTOR.redact_exchange_payload(...), ...)
          - focus-metavariable: $VALUE
      - pattern-regex: >-
          (?i)\b(?:insert\s+into\s+(?:\w+\.)?"?order_events"?\s*(?:\(|select\b|values\b|default\b)|update\s+(?:only\s+)?(?:\w+\.)?"?order_events"?(?:\s+(?:as\s+)?\w+)?\s+set\b|copy\s+(?:\w+\.)?"?order_events"?\s*(?:\(|from\b))
    paths:
      include:
        - "services/api/candleviewer/**"
      exclude:
        - "services/api/candleviewer/migrations/**"
