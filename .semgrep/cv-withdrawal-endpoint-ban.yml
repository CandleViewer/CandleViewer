rules:
  - id: cv-withdrawal-endpoint-ban
    languages: [python]
    severity: ERROR
    message: >-
      Withdrawal/transfer/funding operations are out of scope of any kind,
      through any code path (CONSTITUTION.md C-1.2 item 5, C-2.7). This
      matches a call that looks like a Bybit asset-transfer/withdrawal
      endpoint invocation, or a call that creates an API key or changes a
      key's permissions (`/v5/user/update-api`, `/v5/user/update-sub-api`,
      `/v5/user/create-sub-api`): such a call could grant the withdrawal
      permission C-2.8 refuses (#2877 ruling R14). Remove it; CandleViewer
      never calls a withdrawal endpoint and never edits a key.
    metadata:
      references:
        - CONSTITUTION.md C-1.2
        - CONSTITUTION.md C-2.7
        - CONSTITUTION.md C-2.8
      rule-id: cv-withdrawal-endpoint-ban
    patterns:
      - pattern-either:
          - pattern: $CLIENT.withdraw(...)
          - pattern: $CLIENT.create_withdrawal(...)
          - pattern: $CLIENT.asset_withdraw(...)
          - pattern: $CLIENT.create_internal_transfer(...)
          - pattern: $CLIENT.create_universal_transfer(...)
          - pattern: $CLIENT.inter_transfer(...)
          - pattern: $CLIENT.universal_transfer(...)
          - pattern-regex: '["'']/v5/asset/withdraw/.*["'']'
          - pattern-regex: '["'']/v5/asset/transfer/.*["'']'
          # #2877 R14: key creation and key-permission changes, master and sub account, in
          # any literal that holds the path (a host before it, a sub-path or query after it).
          - pattern-regex: '["''][^"''\n]*/v5/user/(update-api|update-sub-api|create-sub-api)(?![\w-])'
