# E29-X02 (#982); 24-internal-schemas.md §14.2 rule 3, §17.4 L2; C-2.11; OM-E03. A test of the
# environment against one of its values. A fail-closed `if` whose body only raises, with no call or
# `await` in the raise, stays legal, with `ruleid` fixtures around it; a branch by design carries a
# reviewed `nosemgrep`.
# What it sees and misses: docs/plan/security/ci-gates-e29.md#cv-oms-env-branch.
rules:
  - id: cv-oms-env-branch
    languages: [python]
    severity: ERROR
    message: >-
      An environment conditional in an OMS module (24-internal-schemas.md §14.2 rule 3, §17.4 L2;
      C-2.11; threat model OM-E03): behaviour that differs by venue or environment is read off
      `ExchangeCapabilities` or another record the composition root builds, never branched on
      `env == "live"`, a member such as `Environment.LIVE`, or a set of them. A test whose `if`
      body only raises (a fail-closed self-check, the raise holding no call, `await` or walrus) is
      legal; compare two environments for C-2.11's isolation. A branch by design carries a
      reviewed `nosemgrep: cv-oms-env-branch reason=<token> owner=@<h> review=<date>` on the line
      above it. Rule doc: docs/plan/security/ci-gates-e29.md#cv-oms-env-branch.
    metadata:
      rule-id: cv-oms-env-branch
      threat: [OM-E03]
      references:
        - docs/plan/24-internal-schemas.md §14.2 rule 3, §17.4 L2
        - docs/security/threat-models/E29-oms.md OM-E03
        - docs/plan/security/ci-gates-e29.md
    pattern-either:
      # A comparison with an environment's value. A pattern, not a regex, for the literals: in a file
      # with PEP 695 syntax a string metavariable's text loses its quotes (#3549). Exempt: an `if`
      # whose own condition holds that value and whose body only raises.
      - patterns:
          - pattern-either:
              - pattern: $X == $VALUE
              - pattern: $X != $VALUE
              - pattern: $VALUE == $X
              - pattern: $VALUE != $X
              - pattern: $X is $VALUE
              - pattern: $X is not $VALUE
          - metavariable-pattern:
              metavariable: $VALUE
              pattern-either:
                - pattern: '"live"'
                - pattern: '"demo"'
                - pattern: '"testnet"'
                - patterns:
                    - pattern-either:
                        - pattern: $ENUM.LIVE
                        - pattern: $ENUM.DEMO
                        - pattern: $ENUM.TESTNET
                    - metavariable-regex:
                        metavariable: $ENUM
                        regex: ^(?:\w+\.)*\w*Env\w*$
          - pattern-not-inside: |
              if <... $VALUE ...>:
                  raise ...
      # An environment-named value in a constant (`_NOT_LIVE`) or a literal collection; a map the
      # composition root fills, such as a router's ports by environment, is data.
      - patterns:
          - pattern-either:
              - pattern: $ENV in $SET
              - pattern: $ENV not in $SET
          - metavariable-regex:
              metavariable: $ENV
              regex: ^(?:.*[._])?_?env(?:ironment)?(?:\.value)?$
          - metavariable-regex:
              metavariable: $SET
              regex: (?s)^(?:(?:\w+\.)*_?[A-Z][A-Z0-9_]*$|[\[({]|(?:frozen)?set\()
          - pattern-not-inside: |
              if <... $ENV in $SET ...>:
                  raise ...
          - pattern-not-inside: |
              if <... $ENV not in $SET ...>:
                  raise ...
      # Any value in a literal collection of environment values.
      - patterns:
          - pattern-either:
              - pattern: $X in $SET
              - pattern: $X not in $SET
          - metavariable-regex:
              metavariable: $SET
              regex: (?s)^[\[({]|^(?:frozen)?set\(
          - metavariable-regex:
              metavariable: $SET
              regex: (?s).*(?:["'](?:live|demo|testnet)["']|\w*Env\w*\.(?:LIVE|DEMO|TESTNET))
          - pattern-not-inside: |
              if <... $X in $SET ...>:
                  raise ...
          - pattern-not-inside: |
              if <... $X not in $SET ...>:
                  raise ...
      # Semgrep's `if` pattern above also matches an `if` that has an `else` (or an `elif`), whose
      # other branch is environment-specific behaviour: that `if` is reported on its own line. So
      # is a raise-only `if` that does more than raise: a call or an `await` in the raise's
      # arguments does work for one environment, and a walrus in the condition binds the test
      # for a later branch.
      - patterns:
          - pattern-either:
              - pattern: |
                  if $COND:
                      raise ...
                  else:
                      ...
              - pattern: |
                  if $COND:
                      raise $EXC(..., <... $FN(...) ...>, ...)
              - pattern: |
                  if $COND:
                      raise $EXC(..., $KEY=<... $FN(...) ...>, ...)
              - pattern: |
                  if $COND:
                      raise $EXC(..., <... await $AWAITED ...>, ...)
              - pattern: |
                  if $COND:
                      raise $EXC(..., $KEY=<... await $AWAITED ...>, ...)
              - patterns:
                  - pattern: |
                      if $COND:
                          raise ...
                  - metavariable-pattern:
                      metavariable: $COND
                      pattern: ($WALRUS := $BOUND)
          - metavariable-pattern:
              metavariable: $COND
              pattern-either:
                - pattern: '"live"'
                - pattern: '"demo"'
                - pattern: '"testnet"'
                - patterns:
                    - pattern-either:
                        - pattern: $ENUM.LIVE
                        - pattern: $ENUM.DEMO
                        - pattern: $ENUM.TESTNET
                    - metavariable-regex:
                        metavariable: $ENUM
                        regex: ^(?:\w+\.)*\w*Env\w*$
                - patterns:
                    - pattern-either:
                        - pattern: $ENV in $SET
                        - pattern: $ENV not in $SET
                    - metavariable-regex:
                        metavariable: $ENV
                        regex: ^(?:.*[._])?_?env(?:ironment)?(?:\.value)?$
                    - metavariable-regex:
                        metavariable: $SET
                        regex: (?s)^(?:(?:\w+\.)*_?[A-Z][A-Z0-9_]*$|[\[({]|(?:frozen)?set\()
    paths:
      include:
        - "services/api/candleviewer/oms/**"
        - "services/api/candleviewer/oms_*.py"
