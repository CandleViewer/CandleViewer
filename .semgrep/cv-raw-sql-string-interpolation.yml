rules:
  - id: cv-raw-sql-string-interpolation
    languages: [python]
    severity: ERROR
    message: >-
      Raw SQL built via string interpolation/formatting risks injection.
      Use parameterised queries (SQLAlchemy `text()` or `sa.text()` with bound params, or
      the ORM query builder) — never f-strings, `%`-formatting, `.format()`, `.replace()`
      or string concatenation to build SQL (CONSTITUTION.md §12,
      docs/plan/04-security-program.md).
    metadata:
      rule-id: cv-raw-sql-string-interpolation
    # Limitation: `text(var)` with the SQL assembled elsewhere is out of this rule's view
    # (cv-no-raw-sql-interpolation owns pre-call assembly where it applies, E12).
    patterns:
      - pattern-either:
          - pattern: $CONN.execute(f"...")
          - pattern: $CONN.execute("..." % ...)
          - pattern: $CONN.execute("...".format(...))
          - pattern: $CONN.execute("..." + ... )
          # `text(...)`: the bare name, and `sqlalchemy.text` resolved through the imports
          # (renamed ones too). A by-name `$SA.text(...)` flagged a non-SQL helper imported as
          # `_text` on `main`. `<... ...>` looks through the argument, so a splice in a
          # receiver (`("... %s" % x).strip()`, `dedent("...".format(x))`), an f-string split
          # over literals and a `.replace(...).replace(...)` chain are all seen. Any
          # `.replace(...)` in the argument is flagged: the helpers that spliced constants
          # through one are whole literals now (#4548).
          - pattern: text(<... f"..." ...>)
          - pattern: text(<... "..." + ... ...>)
          - pattern: text(<... "..." % ... ...>)
          - pattern: text(<... "...".format(...) ...>)
          - pattern: text(<... $X.replace(...) ...>)
          - pattern: text(<... $Y + "..." ...>)
          - pattern: text(<... $T % $U ...>)
          - pattern: text(<... $T.format(...) ...>)
          - pattern: sqlalchemy.text(<... f"..." ...>)
          - pattern: sqlalchemy.text(<... "..." + ... ...>)
          - pattern: sqlalchemy.text(<... "..." % ... ...>)
          - pattern: sqlalchemy.text(<... "...".format(...) ...>)
          - pattern: sqlalchemy.text(<... $X.replace(...) ...>)
          - pattern: sqlalchemy.text(<... $Y + "..." ...>)
          - pattern: sqlalchemy.text(<... $T % $U ...>)
          - pattern: sqlalchemy.text(<... $T.format(...) ...>)
          # `sa.sql.text`, `sa.sql.expression.text` and renamed imports of them have no call site
          # on `main`, and nor has the `text=` keyword: any of these forms, anywhere in the
          # argument, is flagged.
          - patterns:
              - pattern-either:
                  - pattern: sqlalchemy.sql.text($ARG)
                  - pattern: sqlalchemy.sql.expression.text($ARG)
                  - pattern: text(text=$ARG)
                  - pattern: sqlalchemy.text(text=$ARG)
                  - pattern: sqlalchemy.sql.text(text=$ARG)
                  - pattern: sqlalchemy.sql.expression.text(text=$ARG)
              - metavariable-pattern:
                  metavariable: $ARG
                  pattern-either:
                    - pattern: <... f"..." ...>
                    - pattern: <... "..." + ... ...>
                    - pattern: <... "..." % ... ...>
                    - pattern: <... "...".format(...) ...>
                    - pattern: <... $X.replace(...) ...>
                    - pattern: <... $Y + "..." ...>
                    - pattern: <... $T % $U ...>
                    - pattern: <... $T.format(...) ...>
    paths:
      exclude:
        # Design and planning tooling under docs/ reads files, never a database; a helper named
        # `text(...)` there matched the SQLAlchemy `text()` arm in the merge group (CI-SEC-001).
        - "docs/**"
