rules:
  - id: cv-adapter-isolation
    languages: [python]
    severity: ERROR
    message: >-
      Bybit-specific identifiers must stay inside
      services/api/candleviewer/exchange/bybit/ (CONSTITUTION.md C-2.2);
      everything else consumes exchange/base/ interfaces and normalised
      domain events. This file is outside that boundary and must not
      reference Bybit-specific nomenclature.
    metadata:
      references:
        - CONSTITUTION.md C-2.2
      rule-id: cv-adapter-isolation
    pattern-regex: '(?i)\bbybit\b'
    paths:
      exclude:
        - "services/api/candleviewer/exchange/bybit/**"
        - "packages/protocol/**"
        # tools/fixtures/ builds and redacts the recorded exchange corpus
        # (E08-T05, #1847); it must speak the wire vocabulary by design,
        # exactly like packages/fixtures/** which holds its output.
        - "tools/fixtures/**"
        # services/api/cvdev/ is the dev-only fixture transport that stands in for the exchange
        # (#2893, ADR-0036 Enforcement): it speaks the venue's vocabulary by design, never ships
        # in the wheel or an image, and only account_fixture_wiring.py may import it.
        - "services/api/cvdev/**"
        - "docs/**"
        - "**/*.md"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.json"
        - "**/*.toml"
        - "**/conftest.py"
        - "**/test_*.py"
        - "**/*_test.py"
