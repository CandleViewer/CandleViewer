rules:
  - id: cv-obs-metric-label-allowlist
    languages: [python]
    severity: ERROR
    message: >-
      Metric label name not on the approved allow-list (SR-125, E04-X02).
      New label names change series cardinality and may leak identifiers:
      add the name to `.semgrep/cv-obs-metric-label-allowlist.yml` in a
      PR reviewed by devsecops, with a bounded-value justification.
    metadata:
      rule-id: cv-obs-metric-label-allowlist
    patterns:
      - pattern-either:
          - pattern: _s($N, $K, $U, (..., "$LABEL", ...), ...)
          - pattern: $R.counter($N, $H, (..., "$LABEL", ...), ...)
          - pattern: $R.gauge($N, $H, (..., "$LABEL", ...), ...)
          - pattern: $R.histogram($N, $H, (..., "$LABEL", ...), ...)
      # trigger_mode (E40-T03, #1015): bounded to the `alert_trigger_mode` enum
      # {once, once_per_bar, every_time}; max_series=3 at the call site; no identifiers.
      # A name on this list is allowed only with a closed value set and a `max_series` cap at
      # each call site; the entries record the existing users. Reusing a name for a new metric
      # needs the same bound, stated in review.
      # #2453: each name below has a closed value set in code and a `max_series` cap in the
      # catalogue; none carries an identifier (user, account, order id, raw path, free text).
      # action (#2914): audit action of a lost outcome record, closed set + `other`; max_series=4.
      # action, also (E42-T04, #965, cv_user_lifecycle_total): {disable}; with `result`,
      #   max_series=10 (`admin/lifecycle_metrics.ACTION_RESULTS`).
      # bucket (E15-T01): workspace-count buckets {1, 2-4, 5-8, 9-16, 17-32}; max_series=5.
      # cause (E42-T02): audit read over budget {budget, pool, statement_timeout}; max_series=3.
      # entity_kind (E17-T08): the closed 23 §6.4 machine kinds (`ws/topics.MACHINE_KINDS`, 13);
      #   max_series=13.
      # filter_class (E42-T02): the audit query's 10 shape classes; max_series=10.
      # operation (E15-T01): the 11 /workspaces router operations; max_series=11.
      # outcome (E42-T04, #965, cv_user_lifecycle_steps_total): {ok, failed} for each cascade
      #   step, the closing record and the role push (E42-T09), `skipped` too for b16_revoke and
      #   invite_revoke, or the grants push's {pushed, timeout, failed}; with `step`,
      #   max_series=21 (`STEP_OUTCOMES`).
      # resource (E15-T01): {workspace, layout}; max_series=2.
      # route (#2421): the matched route TEMPLATE (`scope["route"].path`), never the raw path,
      #   plus `unmatched`; bounded by the app's route table; max_series=1000 as a backstop.
      # rule (E14-T01): drawing write conflicts {version_conflict, target_unavailable,
      #   id_unavailable, idempotency_key_reuse}; max_series=4.
      # status_class (#2421): {1xx, 2xx, 3xx, 4xx, 5xx}.
      # step (E42-T04, #965, cv_user_lifecycle_steps_total): the seven disable cascade steps,
      #   closing record included, grants_push (#2648) and roles_push (E42-T09, #2649); with
      #   `outcome`, max_series=21.
      # tool (E14-T01): the contract's closed drawing-tool enum; max_series=25.
      # flag (E42-T03): only feature-flag registry keys, a closed code-reviewed set (about 16);
      #   unknown keys are refused before any series is touched; max_series=32.
      # result (E42-T03, cv_feature_flag_changes_total): the closed write outcomes {ok,
      #   conflict, store_unavailable, required, kind_mismatch, unknown_user,
      #   overrides_not_allowed, gate_evidence_required, https_required, credential_in_url,
      #   string_too_long}; with `flag`, max_series=256.
      # result, also (E42-T04, #965, cv_user_lifecycle_total): the ten closed results of a
      #   disable; with `action`, max_series=10 (`admin/lifecycle_metrics.ACTION_RESULTS`).
      # role (#2295, auth_enrolment_only_sessions_total): normalise_role -> {owner, manager,
      #   viewer, other}; max_series=4; no identifier.
      # table (E12, #1998): a bars table name, `bars_{kind}` for the six bar kinds {time, tick,
      #   volume, range, renko, delta} (`bars/rows.RETENTION`); max_series=6, or 12 with `reason`.
      # from_source, to_source (E12, SR-E12-10, #1998): bar sources from `bars/rows.SOURCE_RANK`
      #   {tape, parquet, kline}; a refusal needs a lower rank, so only kline -> tape|parquet;
      #   max_series=2.
      # wire (#2787 D2-G2, questdb_pgwire_*): a `LazyPgWire`'s name, a required argument from the
      #   closed `WireName` set {bars, bars_hydrate, budget, replay, retention, rolloff, storage}
      #   (`observability/pgwire_metrics.py`; `storage` is #3874's); max_series=7, or 21 with `reason`.
      # table, also (E29-T01, #845): the five tables the OMS repositories write {orders, order_events,
      #   executions, positions, position_snapshots}, a `Literal` in code; max_series=5.
      # reason (E42-T03, #837 Q5, cv_order_entry_refusals_total): the closed order-entry
      #   `RefusalReason` set (4 values, checked when a refusal is built); max_series=4.
      # kind (E42-T05, #966, cv_backup_last_success_age_seconds): the five `BackupKind` values; a
      #   kind outside them never makes a series (`admin/backups/metrics.KINDS`); max_series=5.
      # result, also (E42-T05, #966, cv_restore_jobs_total): {refused, succeeded, failed,
      #   cancelled}, each bound at import (`admin/backups/metrics.RESTORE_RESULTS`); max_series=4.
      # reason, also (E42-T05, #966, cv_backup_verify_failures_total): the seven `Backup.error`
      #   codes, each bound at import (`storage/repositories/backups.BACKUP_ERROR_CODES`); max_series=7.
      # class, domain, reason, state (ADR-0037 S4a): {reserved, shared}; a registered audit
      #   action's first segment or `other` (36); section 15.6's refusals and `timeout` (14 with
      #   `class`), its anomaly reasons, or {held, stopped}; {open, held, stopped}.
      # tier (E26-T02, #625): a storage tier, never an identifier: the replay read-path series'
      #   {questdb, parquet} (max_series<=16 in the catalogue), and the router's `ServedBy`
      #   {hot, cold, both} on `storage_router_queries_total` (storage/router.py).
      # indicator, where (E13-T02, #426, indicator_compute_seconds): a server kernel id from the
      #   closed `orderflow/indicators/kernels.KERNELS` (10), and where it ran, {server};
      #   max_series=10 together.
      # cap (E13-T02, #426, indicator_cap_rejected_total): the refusing cap, {user, symbol,
      #   process} (SR-E13-03) or {window, recompute} (SR-E13-04); max_series=5.
      # bucket, also (E13-T02, indicator_subscriptions): users by server instances held {1, 2-4,
      #   5-7, 8}; max_series=4. reason, also (indicator_recompute_total): {amended,
      #   param_change, backfill}; max_series=3.
      # state, also (E28-T01, #905, cv_profile_rows): {trading_enabled, trading_disabled}, never
      #   an account; max_series=2. result, also (cv_profile_cache_lookups_total): {hit, miss},
      #   bound in `accounts/profile_cache.py`; max_series=2.
      # from, to, source (E29-T03, #847, oms_state_transitions_total): `from` and `to` are B1's 17
      #   `lifecycle` states, read from the committed chart (`oms/order_machine.Legality`), and a
      #   pair only ever an edge of it; `source` is the five `OrderEventSource` values; max_series=256.
      # builtin (E13-T03, indicator_presets_total): whether the live presets counted are the
      #   seeded built-ins, {true, false}; max_series=2. reason, also
      #   (indicator_preset_denied_total): {not_owner, builtin_immutable}; max_series=2.
      - metavariable-regex:
          metavariable: $LABEL
          regex: "^(?!(action|bucket|builtin|cap|cause|class|domain|endpoint_group|engine|entity_kind|event|filter_class|flag|from|from_source|indicator|kind|method|operation|outcome|permission|reason|resource|result|role|route|rule|rule_id|screen|sha256|socket|source|stage|state|status_class|step|stream|symbol|table|tier|to|to_source|tool|topic|transport|trigger_mode|version|where|wire)$).*$"
    paths:
      include:
        - "services/api/candleviewer/**"
        - "services/api/cvdev/**" # #2893 (ADR-0036): the dev-only sibling package
        - ".semgrep/tests/**"
      exclude:
        - "services/**/tests/**"
