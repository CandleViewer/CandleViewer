rules:
  - id: cv-recorder-fs-write-unvalidated-path
    languages: [python]
    severity: ERROR
    message: >-
      Filesystem write (Parquet writer, open for write, write_bytes/write_text) on a path that is
      not derived from the cold-layout registry (DatasetRegistry / ColdPaths) or the recorder's
      own WAL directory. A write path built from unvalidated components can land outside the
      recording volume (path traversal, SR-097). Build every path from validated components
      through DatasetRegistry.resolve_partition.
    metadata:
      rule-id: cv-recorder-fs-write-unvalidated-path
      ticket: E16-X02
      sr: SR-097
    patterns:
      - pattern-either:
          - pattern: pq.write_table($T, $P, ...)
          - pattern: pyarrow.parquet.write_table($T, $P, ...)
          - pattern: pq.ParquetWriter($P, ...)
          - pattern: pyarrow.parquet.ParquetWriter($P, ...)
          - pattern: AtomicParquetWriter($P, ...)
          - pattern: write_parquet_atomic($P, ...)
          - pattern: $P.write_bytes(...)
          - pattern: $P.write_text(...)
          - patterns:
              - pattern: open($P, "$MODE", ...)
              - metavariable-regex:
                  metavariable: $MODE
                  regex: "^[wax]"
          - patterns:
              - pattern: $P.open("$MODE", ...)
              - metavariable-regex:
                  metavariable: $MODE
                  regex: "^[wax]"
      - metavariable-regex:
          metavariable: $P
          # Allowed path roots: the registry's ColdPaths fields, a registry-resolved target
          # (`dest`/`tmp_path` of the atomic writer), the recorder WAL's own directory members, a
          # temp name next to a registry path, and `self._path(...)` (closed-charset ledger and
          # checkpoint names). A heuristic: the roots are matched as substrings of the path
          # expression, so an unchecked path that merely contains one (`user_dir / "tmp"`) passes;
          # the runtime containment checks and the dynamic review stay the backstop.
          regex: '^(?!.*(paths\.|partition_dir|manifests_dir|\.root\b|registry|wal_dir|runs_dir|replay_path|spill_path|corrupt_dir|_meta\(|self\.tmp_path|self\.dest|self\.path\b|self\._path\b|self\._dir\b|\bdest\b|\btmp\b|staged|sidecar)).*$'
    paths:
      include:
        - "services/api/candleviewer/recorder/**"
        - "services/api/candleviewer/storage/cold/**"
        - "services/api/candleviewer/*wiring.py"
        - "**/cv-recorder-fs-write-unvalidated-path*"
