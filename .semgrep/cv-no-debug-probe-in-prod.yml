rules:
  - id: cv-no-debug-probe-in-prod
    languages: [python]
    severity: ERROR
    message: >-
      SR-E12-16 / BR-26: a diagnostics probe, debug dump or test-clock seam is
      reachable from production backend code. Probe/diagnostics surfaces (the
      SCR-046 diagnostics overlay feed, the E12-Q03 E2E probe, builder debug dumps)
      and clock-freezing seams must live in test-only modules (`tests/**`,
      `conftest.py`) or be registered behind the non-production guard
      (`if settings.environment is not Environment.LIVE:`). A probe route in a live
      build leaks internal state and lets a caller steer bar timing. Fix: move the
      seam to the test tree, or register it inside the environment guard. Rule doc:
      docs/plan/security/ci-gates-e12.md#cv-no-debug-probe-in-prod.
    metadata:
      rule-id: cv-no-debug-probe-in-prod
      sr: SR-E12-16
      references:
        - docs/security/threat-models/E12-bars.md BR-26, AC-12
        - docs/plan/security/ci-gates-e12.md
    patterns:
      - pattern-either:
          # A route whose path is a probe/debug/diagnostics/test seam.
          - patterns:
              - pattern-either:
                  - pattern: |
                      @$R.$VERB($URL, ...)
                      def $F(...): ...
                  - pattern: |
                      @$R.$VERB($URL, ...)
                      async def $F(...): ...
                  - pattern: $R.add_api_route($URL, ...)
              - metavariable-regex:
                  metavariable: $URL
                  regex: '(?i)^["'']?(.*/)?(_*debug|_*probe|_*diag(nostics)?|__test\w*|test-?clock|e2e)(/|\{|["'']?$)'
          # Test-only clock/time-freezing libraries or test-tree imports in production.
          - pattern: import freezegun
          - pattern: import time_machine
          - pattern: from freezegun import $X
          - pattern: from time_machine import $X
          - pattern: from tests.$M import $X
          - pattern: import tests.$M
          # Interactive debugger or a raw debug dump left in a code path.
          - pattern: breakpoint()
          - pattern: import pdb
          - pattern: pdb.set_trace()
      - pattern-not-inside: |
          if $S.environment is not Environment.LIVE:
              ...
      - pattern-not-inside: |
          if $S.environment != Environment.LIVE:
              ...
    paths:
      include:
        - "services/api/candleviewer/**"
        - "services/api/cvdev/**" # #2893 (ADR-0036): the dev-only sibling package
        - "**/cv-no-debug-probe-in-prod*"
      exclude:
        - "**/conftest.py"
        - "**/test_*.py"
