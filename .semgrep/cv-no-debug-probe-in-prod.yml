rules:
  - id: cv-no-debug-probe-in-prod
    languages: [python]
    severity: ERROR
    message: >-
      SR-E12-16 / BR-26: a diagnostics probe, debug dump, perf-only route or test-clock
      seam is reachable from production backend code. Probe/diagnostics surfaces (the
      SCR-046 diagnostics overlay feed, the E12-Q03 E2E probe, builder debug dumps),
      perf-only routes (`/_perf/*`, the #2097 Argon2 parameters route) and clock-freezing
      seams must live in test-only modules (`tests/**`, `conftest.py`) or be registered
      behind the non-production guard (`if settings.environment is not Environment.LIVE:`).
      A perf route may instead sit inside the keyless-testnet perf gate: an `if` on the result
      of `candleviewer.api.auth_perf.auth_perf_enabled(settings)`, called in the `if` or
      assigned once to a local in the same function. The rule checks where that call is
      imported from, not what a flag is named. Neither guard may have an `else:` branch. A
      probe route in a live build leaks internal state and lets a caller steer bar timing.
      Fix: move the seam to the test tree, or register it inside one of those guards. Rule
      doc: docs/plan/security/ci-gates-e12.md#cv-no-debug-probe-in-prod.
    metadata:
      rule-id: cv-no-debug-probe-in-prod
      sr: SR-E12-16
      references:
        - docs/security/threat-models/E12-bars.md BR-26, AC-12
        - docs/plan/security/ci-gates-e12.md
    options:
      # #2755: lets `auth_perf = auth_perf_enabled(settings)` ... `if auth_perf:` match the call
      # form of the perf gate below, and keeps any other assignment (a constant, the raw
      # settings field) from matching it.
      symbolic_propagation: true
    patterns:
      - pattern-either:
          # A route whose path is a probe/debug/diagnostics/perf/test seam.
          - patterns:
              - pattern-either:
                  - pattern: |
                      @$R.$VERB($URL, ...)
                      def $F(...): ...
                  - pattern: |
                      @$R.$VERB($URL, ...)
                      async def $F(...): ...
                  - pattern: $R.add_api_route($URL, ...)
              - metavariable-regex:
                  metavariable: $URL
                  regex: '(?i)^["'']?(.*/)?(_*debug|_*probe|_*perf|_*diag(nostics)?|__test\w*|test-?clock|e2e)(/|\{|["'']?$)'
          # Test-only clock/time-freezing libraries or test-tree imports in production.
          - pattern: import freezegun
          - pattern: import time_machine
          - pattern: from freezegun import $X
          - pattern: from time_machine import $X
          - pattern: from tests.$M import $X
          - pattern: import tests.$M
          # Interactive debugger or a raw debug dump left in a code path.
          - pattern: breakpoint()
          - pattern: import pdb
          - pattern: pdb.set_trace()
      # Guards. Semgrep matches `if X: ...` against an if/else as one block, so a bare
      # `pattern-not-inside: if X: ...` would also exempt a route in the `else:` branch, which
      # runs when the guard is false (LIVE, or the perf switch off). Each guard therefore
      # excludes the form that has an `else:`.
      #
      # The non-production guard, in its two spellings.
      - pattern-not-inside:
          patterns:
            - pattern: |
                if $S.environment is not Environment.LIVE:
                    ...
            - pattern-not: |
                if $S.environment is not Environment.LIVE:
                    ...
                else:
                    ...
      - pattern-not-inside:
          patterns:
            - pattern: |
                if $S.environment != Environment.LIVE:
                    ...
            - pattern-not: |
                if $S.environment != Environment.LIVE:
                    ...
                else:
                    ...
      # #2755: the keyless-testnet perf gate (#2097, the #2086 gate). Only an `if` on the result
      # of the call `candleviewer.api.auth_perf.auth_perf_enabled(...)` counts, in the `if`
      # itself or through a local assigned from it (symbolic_propagation). Semgrep resolves the
      # call through the file's imports, so the rule keys on where the function comes from, not
      # on a name: a same-named helper, the same name imported from another module,
      # `auth_perf = True` and the raw `settings.auth_perf_enabled` field are not the gate.
      - pattern-not-inside:
          patterns:
            - pattern: |
                if candleviewer.api.auth_perf.auth_perf_enabled(...):
                    ...
            - pattern-not: |
                if candleviewer.api.auth_perf.auth_perf_enabled(...):
                    ...
                else:
                    ...
    paths:
      include:
        - "services/api/candleviewer/**"
        - "**/cv-no-debug-probe-in-prod*"
      exclude:
        - "**/conftest.py"
        - "**/test_*.py"
