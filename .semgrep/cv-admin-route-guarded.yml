rules:
  - id: cv-admin-route-guarded
    languages: [python]
    severity: ERROR
    message: >-
      This line serves an /admin route outside the admin guard, or builds that guard without a
      literal permission. Every /admin route sits on a router from `admin_router(Permission.<member>,
      ...)` (candleviewer/admin/http.py), which checks that permission, counts a refusal in
      authz_denied_total and writes admin.area_entered before any handler runs (C-12.4, SR-017,
      SR-125, SR-E42-09). A route with a guard of its own is listed in this rule by its exact
      method and path, with its reason; no other is excepted (E42-X03).
    metadata:
      rule-id: cv-admin-route-guarded
      sr: SR-E42-09
    pattern-either:
      # A route on a router built with an /admin prefix: `admin_router` builds its own inside
      # admin/http.py, so a router assigned here is a plain one. The call matches wherever it
      # stands: as a decorator (no `def` pattern, so PEP 695 files hold too: X03-F4), as that
      # decorator applied by hand, or as a registration; its path is positional or `path=`. A
      # router or app included or mounted on it is served unguarded too.
      - patterns:
          - pattern-inside: |
              $R = APIRouter(..., prefix=$PFX, ...)
              ...
          - pattern-either:
              - pattern: $R.$M($PATH, ...)
              - pattern: $R.$M(..., path=$PATH, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|put|post|delete|options|head|patch|trace|api_route|websocket|route|websocket_route|add_api_route|add_route|add_api_websocket_route|add_websocket_route|include_router|mount)$
          - metavariable-comparison:
              comparison: re.match("^/admin(/|$)", str($PFX))
          # The routes with a guard of their own (E42-X03 §5.1; X03-F1 and X03-F2 record their
          # detection gaps against #2836), each excepted by its exact method, prefix and path.
          # GET /admin/audit, POST /admin/audit/verify, POST /admin/audit/export (api/audit.py):
          # the audit-read guard, role-scoped and budgeted, refusing with `admin.audit_denied`
          # (SR-067, AD-R06, AD-D06); it joins the admin guard once #2836 gives that guard a
          # budget (SR-E42-09). GET /admin/audit/exports/{jobId}, the export's download (#889 S9),
          # is on it too: its refusals fall under the same budget (22 `exportAuditLog`). So is GET
          # /admin/audit/signing-keys (#889 S7): Owner-only and budgeted as verify is (22).
          - metavariable-comparison:
              comparison: not (str($M) == "get" and str($PFX) == "/admin/audit" and str($PATH) == "")
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PFX) == "/admin/audit" and str($PATH) == "/verify")
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PFX) == "/admin/audit" and str($PATH) == "/export")
          - metavariable-comparison:
              comparison: not (str($M) == "get" and str($PFX) == "/admin/audit" and str($PATH) == "/exports/{jobId}")
          - metavariable-comparison:
              comparison: not (str($M) == "get" and str($PFX) == "/admin/audit" and str($PATH) == "/signing-keys")
          # POST /admin/support-bundle and GET /admin/support-bundle/{job_id}
          # (api/support_bundle.py): E04's diagnostics export, which checks `admin:read` itself;
          # the GET refuses with no record or count (X03-F1), and both join the guard with #2836.
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PFX) == "/admin" and str($PATH) == "/support-bundle")
          - metavariable-comparison:
              comparison: not (str($M) == "get" and str($PFX) == "/admin" and str($PATH) == "/support-bundle/{job_id}")
          # PUT /admin/log-level (api/log_level.py): E04's override, which checks `admin:write`
          # itself and answers 501 until a principal resolver is wired (X03-F5).
          - metavariable-comparison:
              comparison: not (str($M) == "put" and str($PFX) == "/admin" and str($PATH) == "/log-level")
          # POST /admin/recorder/import and /compact (api/recorder_admin.py): E16's recorder
          # storage, which checks `recording:write` itself, the Owner's alone since G-04 (#484;
          # 04 §7.2.2 row 51), and records its own refusal; it predates the admin guard (#2836).
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PFX) == "/admin" and str($PATH) == "/recorder/import")
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PFX) == "/admin" and str($PATH) == "/recorder/compact")
          # POST /admin/recorder/purge (api/recorder_purge.py): E16's purge checks RBAC, then
          # Owner-only, then step-up, in that order (04 §7.2.2 row 9a), which one permission
          # cannot express.
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PFX) == "/admin" and str($PATH) == "/recorder/purge")
          # GET /admin/backups/{backupId}/download/{token} (api/admin_backup_download.py): E42-T05
          # BK-11, public in the contract: the single-use link token in the path is the
          # credential, its user must still hold `backups:read` (AC-ADM-26).
          - metavariable-comparison:
              comparison: not (str($M) == "get" and str($PFX) == "/admin" and str($PATH) == "/backups/{backupId}/download/{token}")
      # A literal /admin path on any other router, or on the app itself: a decorated handler or
      # that decorator applied by hand (a bare `.get("/admin...")` may be a dict lookup), or a
      # registration call; its path is positional or `path=`.
      - patterns:
          - pattern-not-inside: |
              $R = admin_router(...)
              ...
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          @$R.$M($PATH, ...)
                          def $F(...):
                            ...
                      - pattern: |
                          @$R.$M(..., path=$PATH, ...)
                          def $F(...):
                            ...
                      - pattern: $R.$M($PATH, ...)($F)
                      - pattern: $R.$M(..., path=$PATH, ...)($F)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(get|put|post|delete|options|head|patch|trace|api_route|websocket|route|websocket_route)$
              - patterns:
                  - pattern-either:
                      - pattern: $R.$M($PATH, ...)
                      - pattern: $R.$M(..., path=$PATH, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(add_api_route|add_route|add_api_websocket_route|add_websocket_route)$
          - metavariable-comparison:
              comparison: re.match("^/admin(/|$)", str($PATH))
          # POST /admin/keys/kek-rewrap (api/admin_kek.py): #2266 decision 2, `enforce` on
          # `keys:manage` then the Owner role, each refusal `rbac.denied`, the body checked first.
          # POST /admin/keys/audit-signing/rotate (api/audit_signing_keys.py): #889 S7, the same.
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PATH) == "/admin/keys/kek-rewrap")
          - metavariable-comparison:
              comparison: not (str($M) == "post" and str($PATH) == "/admin/keys/audit-signing/rotate")
      # A router included, or an app mounted, under /admin.
      - patterns:
          - pattern-either:
              - pattern: $APP.include_router($F, ..., prefix=$PFX, ...)
              - pattern: $APP.mount($PFX, ...)
              - pattern: $APP.mount(..., path=$PFX, ...)
          - metavariable-comparison:
              comparison: re.match("^/admin(/|$)", str($PFX))
      # The admin guard with a permission that is not a literal `Permission` member, passed by
      # position or by keyword, under its own name or an alias of candleviewer.admin.http's.
      - patterns:
          - pattern-either:
              - pattern: admin_router($P, ...)
              - pattern: admin_router(..., permission=$P, ...)
              - pattern: candleviewer.admin.http.admin_router($P, ...)
              - pattern: candleviewer.admin.http.admin_router(..., permission=$P, ...)
          - pattern-not: admin_router(Permission.$X, ...)
          - pattern-not: admin_router(..., permission=Permission.$X, ...)
          - pattern-not: candleviewer.admin.http.admin_router(Permission.$X, ...)
          - pattern-not: candleviewer.admin.http.admin_router(..., permission=Permission.$X, ...)
    paths:
      include:
        - "services/api/candleviewer/**"
