# E29-X02 (#982); R7 data accuracy, OM-T08. A money value made a float in an OMS module; a name
# that ends as a duration does stays legal, as every `float()` there on `main` is a duration, a
# count or a clock. What it sees and misses:
# docs/plan/security/ci-gates-e29.md#cv-oms-no-float-money.
rules:
  - id: cv-oms-no-float-money
    languages: [python]
    severity: ERROR
    message: >-
      `float()` on a money value in an OMS module: a price, quantity, size, notional, fee, PnL,
      balance, equity, margin, leverage, distance, risk or `*_value` figure converted to binary
      floating point, or a float stored under such a name. The OMS computes in `Decimal` end to
      end (AGENTS.md §5.2; 24-internal-schemas.md §8, §14.4 `Px`, `Qty`), as the exchange's decimal
      strings round-trip only as decimals and a float rounds `0.1 + 0.2` (R7 data accuracy, threat
      model OM-T08). Fix: keep the `Decimal` and quantize it to the instrument's tick or step. A
      duration in seconds stays a float. Rule doc:
      docs/plan/security/ci-gates-e29.md#cv-oms-no-float-money.
    metadata:
      rule-id: cv-oms-no-float-money
      threat: [OM-T08]
      references:
        - docs/security/threat-models/E29-oms.md OM-T08
        - AGENTS.md §5.2
        - docs/plan/security/ci-gates-e29.md
    patterns:
      - pattern-either:
          - patterns:
              - pattern: float($ARG)
              - metavariable-regex:
                  metavariable: $ARG
                  regex: '(?s)^(?!.*(?i:_s|_ms|_us|_ns|_secs?|_seconds|timeout|interval|delay|wait|deadline|ttl)\W*$)(?=.*(?:(?<![A-Za-z])|(?<=[a-z])(?=[A-Z]))(?i:price|px|qty|quantity|size|notional|amount|amt|cost|fee|commission|pnl|profit|loss|balance|equity|margin|exposure|collateral|cash|usdt|usd|leverage|mark|risk|sl|tp|distance|trailing)(?:e?s)?(?![a-z])|.*(?:_value|[a-z]Value)s?(?![a-z]))'
          - patterns:
              - pattern-either:
                  - pattern: $NAME = float($ARG)
                  - pattern: "$NAME: $TYPE = float($ARG)"
                  - pattern: $CALL(..., $NAME=float($ARG), ...)
                  - pattern: "{..., $NAME: float($ARG), ...}"
              - focus-metavariable: $ARG
              - metavariable-regex:
                  metavariable: $NAME
                  regex: '(?s)^(?!.*(?i:_s|_ms|_us|_ns|_secs?|_seconds|timeout|interval|delay|wait|deadline|ttl)\W*$)(?=.*(?:(?<![A-Za-z])|(?<=[a-z])(?=[A-Z]))(?i:price|px|qty|quantity|size|notional|amount|amt|cost|fee|commission|pnl|profit|loss|balance|equity|margin|exposure|collateral|cash|usdt|usd|leverage|mark|risk|sl|tp|distance|trailing)(?:e?s)?(?![a-z])|.*(?:_value|[a-z]Value)s?(?![a-z]))'
          - pattern: float(Decimal(...))
          - pattern: float($MOD.Decimal(...))
          - pattern: float($VALUE.quantize(...))
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      def $FN(..., $P: $TYPE, ...):
                          ...
                  - pattern-inside: |
                      def $FN(..., $P: $TYPE = $DEFAULT, ...):
                          ...
                  - pattern-inside: |
                      $P: $TYPE = $INIT
                      ...
              - pattern: float($P)
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: ^(?:Decimal|Px|Qty|Notional|Bps|Amount|Money|Price|Quantity|Figure)(?:\s*\|\s*None)?$
    paths:
      include:
        - "services/api/candleviewer/oms/**"
        - "services/api/candleviewer/oms_*.py"
