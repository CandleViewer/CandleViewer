# RBAC allow/deny expectation matrix (E09-Q03, SR-018). Owned by @CandleViewer/security (CODEOWNERS):
# a widening edit needs a Security review. Do NOT regenerate this file from the app or the contract;
# each outcome is a reviewed expectation that the runner compares against the live behaviour.
#
# actors      owner | manager_with_grant (grant on account A only) | manager_without_grant |
#             viewer | unauthenticated
# outcomes    allow = the authorisation layer passed (the handler may still answer 4xx for the body);
#             401 / 403 = refused. Role permissions follow 22-api-openapi.yaml `x-permissions`
#             (the contract rbac_seed.json is generated from); `audit:read` follows 04 §7.2 / SR-067.
# state       executed       every cell is run against the real app with a real bearer token.
#             not_mounted    declared in the contract, not served by the app yet; the runner fails
#                            as soon as the route appears (so the row must then become `executed`).
#             not_executable served, but authorisation is unreachable in the CI app (identity or
#                            backend not wired / fail-closed stub); `reason` says why. Cells are
#                            asserted by the dedicated tests instead, never silently dropped.
# request     valid-shape inputs for routes that validate before they authorise.
# pending     cell -> issue: expected outcome differs from current behaviour; the cell is
#             xfail(strict=True) so it flips red-to-green when the fix lands.
version: 1
actors: [owner, manager_with_grant, manager_without_grant, viewer, unauthenticated]
