[project]
name = "candleviewer-api"
version = "0.1.0"
description = "CandleViewer backend — Python modular monolith (services/api)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "starlette>=0.38",
  "uvicorn[standard]>=0.54.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "websockets>=17.1",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pyarrow>=17.0",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "orjson>=3.10",
  "msgpack>=1.2.2",
  "xstate-statemachine==0.9.1",
  "jsonschema>=4.23",
  "argon2-cffi>=25.1.0",
  "cryptography>=43.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
  "import-linter>=2.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "datamodel-code-generator>=0.83.0",
  "types-PyYAML>=6.0",
  "types-psutil>=6.0",
  "types-jsonschema>=4.23",
]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.108",
  "testcontainers[postgres]>=4.8",
  "psycopg[binary]>=3.2",
  "asyncpg>=0.29",
  "openapi-spec-validator>=0.9.0",
  "opentelemetry-sdk",
  "opentelemetry-api",
  "psutil",
  "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.build.targets.wheel]
packages = ["candleviewer"]

# #2893 (ADR-0036): the dev-only `cvdev` package ships in no artefact. The wheel above names only
# `candleviewer`; the sdist leaves `cvdev` out as well, so no distribution carries it.
[tool.hatch.build.targets.sdist]
exclude = ["/cvdev"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by scripts/generate_protocol_models.py (E02-T09) — never hand-edit,
# never hand-lint; regenerate instead. Mirrors packages/protocol's generated-code
# exclusion so lint/format never fights the codegen output shape.
extend-exclude = ["**/_generated/**"]
# lint-staged invokes ruff/black with explicit staged file paths; without
# force-exclude, explicit path args bypass extend-exclude above.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]
# Tests exercise assert-heavy patterns and fixtures that legitimately trip S101/S106.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/unit/auth/**" = ["S105", "S106", "RUF059"]
"tests/unit/api/test_auth_router.py" = ["S105", "S106"]
"tests/qa/test_e09_dryrun_group_a.py" = ["S105", "S106"]
"scripts/tests/**" = ["S101"]
"benchmarks/questdb_hot_tier/tests/**" = ["S101"]
# E40-K01 harness: seeded non-crypto RNG is the point (reproducible runs).
"benchmarks/alerts/**" = ["S311"]
"benchmarks/alerts/tests/**" = ["S101"]
# Migration bodies embed raw DDL/seed SQL as triple-quoted strings; wrapping
# generated INSERT/CREATE statements at 100 cols hurts readability without
# improving anything (E-4.16: seed rows come from a generator, not hand-tuning).
"candleviewer/migrations/versions/**" = ["E501"]
# E02-T06 arch-gate negative tests invoke the pinned local toolchain (uv/npx/git)
# with hardcoded argument lists — not untrusted input; S603 is a false positive here.
"tests/unit/architecture/test_negative_arch_violations.py" = ["S101", "S603"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "candleviewer/(api/_generated|ws/_generated)/"
# Same rationale as [tool.ruff] force-exclude: lint-staged passes explicit
# staged file paths, which black's exclude/extend-exclude ignore unless
# force-exclude also matches.
force-exclude = "candleviewer/(api/_generated|ws/_generated)/"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "."
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# duckdb has no inline types / py.typed marker as of 2026-09-27 (duckdb 1.1.x on PyPI).
# Allowlisted 2026-09-27, tracked under issue #91 (E02-T02); re-check at each duckdb bump
# and drop this override once upstream ships types (see PyPI project page / duckdb#…).
module = ["duckdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# asyncpg has no inline types / py.typed marker as of 2026-09-28 (asyncpg
# 0.29.x on PyPI). Allowlisted 2026-09-28 for E03-T10's boot-time advisory
# lock helper (`candleviewer.migrations.boot`); re-check at each asyncpg bump
# and drop this override once upstream ships types.
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow (E07-T04 cold tier) ships no py.typed marker or stubs (mypy:
# "missing library stubs or py.typed marker"). Narrow to import resolution
# only (no ignore_errors); drop once upstream ships types.
module = ["pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# msgpack (#2483, the cv.v1.msgpack client-frame codec) ships no py.typed marker or stubs as of
# 2026-10-15 (msgpack 1.2.2). Narrow to import resolution only; drop once upstream ships types.
module = ["msgpack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: needs the docker compose stack (Postgres/QuestDB)",
  "integration_db: integration test needing the CI Postgres/QuestDB service containers (E03-T03, SR-131)",
  "exchange_smoke: manual-only smoke test against a real exchange host — deselected in CI (E03-T03, SR-140)",
  "flaky: quarantined per Constitution C-9.3 — must link a P1 ticket",
  "sync_parity: informational SyncInterpreter parity (29 §1.7) — never gates; deselected from the xstate-contract gate",
  "chaos: nightly storage chaos scenarios (E07-Q04, C-13.6) - docker-dependent ones skip without the stack",
  "roundtrip: E35-Q02 10 000-document rule IR property run - executed by the rule-roundtrip lane, deselected from the py lane",
  "perf: wall-clock budget assertion (C-13.9) — enforced in CI, deselected by the orchestrator's local verify_pr gate on shared laptops",
  "harness: E12-T04 heavy determinism-harness runs (100k trades, full adversarial matrix) — nightly only (bar-determinism-nightly), deselected from the PR lane",
  "fuzz: E08-X02 long Hypothesis parser-fuzz session — nightly only, deselected from the PR lane",
  "e09_regression: E09 auth/RBAC regression pack (qa/plans/e09-regression-pack.md, #2148), tagged by path in tests/_e09_regression_pack.py, never on perf/fuzz/harness items — run with pytest -m e09_regression",
]
addopts = "-m \"not fuzz and not perf and not harness\" --strict-markers --cov=candleviewer --cov=cvdev --cov-branch --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# #2893 (ADR-0036): the dev-only `cvdev` package is measured too; it never ships, but its guards
# keep fixture traffic away from real keys and hosts, so they are held to the same floor.
source = ["candleviewer", "cvdev"]
# #2424: the `py` CI job combines the data of parallel test lanes; relative paths keep that
# combine independent of where each lane's job checked the repository out.
relative_files = true
# Empty scaffold modules created by E02-T05 (2026-09-27, docs/plan/backlog/
# all-tickets.json) — no real logic yet, so they are excluded from the
# coverage floor. Each entry must be removed by the ticket that implements
# real logic in that module; do not add new entries without a ticket ref.
omit = [
  # bars models/spec/series/schema are implemented by E12-T01 and counted in the floor.
  "candleviewer/bars/service.py",
  "candleviewer/bars/__init__.py",
  "candleviewer/book/service.py",
  "candleviewer/book/__init__.py",
  "candleviewer/exchange/base/service.py",
  # rest.py/mapping.py/errors.py/models.py are implemented and tested by
  # E08-T02 (>=85% required); only the lifecycle scaffold stays omitted.
  "candleviewer/exchange/bybit/service.py",
  "candleviewer/journal/*",
  "candleviewer/main.py",
  "candleviewer/observability/service.py",
  # oms errors/validator/fakes/order_link* (E09-T04, E29-T02) are counted in the floor.
  "candleviewer/oms/__init__.py",
  "candleviewer/oms/models.py",
  "candleviewer/oms/service.py",
  "candleviewer/paper/*",
  "candleviewer/recorder/service.py",  # policy/models/errors: E16-T02, counted
  # replay (M12) is fully counted: E26-T01 (#624) service + E26-T02 read path (#2346).
  "candleviewer/risk/*",
  # candleviewer/rules/ir/* is implemented by E35-T01 and counted in the floor.
  "candleviewer/rules/errors.py",
  "candleviewer/rules/models.py",
  "candleviewer/rules/service.py",
  "candleviewer/ws/service.py",
  # Generated protocol models (E02-T09) — regenerated from docs/plan/22-api-openapi.yaml
  # and docs/plan/ws-schema.json; exercised via determinism/contract tests, not the
  # services/api line-coverage floor.
  "candleviewer/api/_generated/*",
  "candleviewer/ws/_generated/*",
]

[tool.bandit]
exclude_dirs = ["tests"]
