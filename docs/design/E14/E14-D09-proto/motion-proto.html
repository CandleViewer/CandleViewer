<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E14-D09 motion prototype</title>
    <style>
      /* E14-D09 prototype (design evidence only; the prototype is not the engine). Raw WebGL2, 200 drawings
         over a seeded candle series in one instanced batch. Colours are the dark tokens' values at the base:
         color.surface.canvas, color.drawing.default / .selected, TP-13 color.drawing.snap = {color.focus.ring},
         color.candle.*, color.surface.raised / .selected, color.text.*. Every figure it prints is from
         this host's software GL (SwiftShader, the runner's --disable-gpu), below class. */
      :root {
        --canvas: #11151a;
        --raised: #161b22;
        --row-selected: #2e363e;
        --drawing-selected: #f0b441;
        --text: #e8eaed;
        --text-2: #b1bac4;
        --text-3: #8b949e;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font:
          12px/1.4 system-ui,
          sans-serif;
      }
      #out {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 3;
        max-width: 1280px;
        word-break: break-all;
        color: var(--text-2);
      }
      #stage {
        display: flex;
        margin-top: 24px;
      }
      #chart {
        position: relative;
        width: 1280px;
        height: 720px;
      }
      #gl {
        display: block;
        width: 1280px;
        height: 720px;
      }
      #snaptext {
        position: absolute;
        display: none;
        padding: 0 4px;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #tree {
        width: 240px;
        height: 720px;
        overflow: hidden;
        background: var(--raised);
        border-left: 1px solid var(--row-selected);
      }
      .row {
        position: relative;
        height: 24px;
        padding: 0 8px;
        line-height: 24px;
        white-space: nowrap;
        color: var(--text-2);
      }
      .row[aria-selected="true"] {
        background: var(--row-selected);
        outline: 1px solid var(--text-3);
        outline-offset: -1px;
        color: var(--text);
      }
      .row .ov {
        /* the D9-09 tree half (R353 BQ-08 precision): an overlay tinted color.drawing.selected over the
           row's opaque color.surface.selected fill, opacity 0.25 -> 0; never a fill tween */
        position: absolute;
        inset: 0;
        background: var(--drawing-selected);
        opacity: 0;
        pointer-events: none;
      }
      .row .lbl {
        position: relative;
      }
      .row .tag {
        position: relative;
        margin-left: 6px;
        color: var(--text-3);
      }
    </style>
  </head>
  <body>
    <div id="out">
      E14-D09 prototype. Modes: ?play=snap|select|undo, ?motion=reduce, ?form=min, ?drawings=N,
      ?ms=&amp;reps= (measure), ?capture=snap|select|undo&amp;at=start|mid|end. The prototype is not
      the engine; figures from SwiftShader (--disable-gpu) are below class.
    </div>
    <div id="stage">
      <div id="chart">
        <canvas id="gl" width="1280" height="720"></canvas>
        <div id="snaptext" aria-live="polite"></div>
      </div>
      <div id="tree" role="tree" aria-label="Drawings"></div>
    </div>
    <script>
      "use strict";
      // ---- configuration: the query string (the runner passes `ms` and `reps`; see run-proto.mjs) ----------
      const q = new URLSearchParams(location.search);
      const P = (k, d) => (q.has(k) ? q.get(k) : d);
      const CFG = {
        play: P("play", ""),
        capture: P("capture", ""),
        at: P("at", "start"),
        reduce: P("motion", "") === "reduce",
        form: P("form", "full") === "min" ? "min" : "full", // min: section 2's shipping (minimal) forms
        drawings: Math.max(6, Math.min(2000, Math.floor(+P("drawings", 200)) || 200)),
        ms: Math.max(200, +P("ms", 2000) || 2000),
        reps: Math.max(1, Math.floor(+P("reps", 5)) || 5),
        seed: Math.floor(+P("seed", 353)) || 353,
      };
      const MODE = CFG.capture ? "capture" : CFG.play ? "play" : q.has("ms") ? "measure" : "static";
      // ---- tokens (primitives at the base) and the spec's rules (E14-D09 sections 2 and 6) -----------------
      const DUR = { instant: 0, fast: 100, normal: 200, slow: 400 };
      const EASE = {
        standard: [0.2, 0, 0, 1],
        decelerate: [0, 0, 0, 1],
        accelerate: [0.3, 0, 1, 1],
      };
      const HEX = {
        canvas: "#11151A",
        drawing: "#3FBFE0",
        selected: "#F0B441",
        snap: "#6EA1F5",
        up: "#2EBD59",
        down: "#E5484D",
        wick: "#8B949E",
      };
      // ms between starts on one element (HS-1): per element for the halos; the snap ring is one element (the
      // one marker), so for it the same gap is a single global gap
      const HS1_GAP = 500;
      const HS1_CAP = 20; // emphasised objects per frame (HS-1)
      const REGION = [341, 256]; // HS-1b's region
      const AREA_CAP = 21824; // 25 % of 341 x 256 px
      const REGION_STARTS = 3; // halo starts per region per half-open 1 000 ms window (HS-1b's start clause)
      const OVERLAY_PEAK = 0.25; // the tree overlay's peak opacity (R353 BQ-08 precision)
      const BAND = 4; // the halo widens the outline by 4 px (2 px each side)
      const HALO_PEAK = 0.6;
      const RING_R = 5; // the 10 px ring
      const RING_FROM = 1.4; // scale 1.4 -> 1.0 (14 -> 10 px)
      const MAGNET = 12; // px
      const DRAG_THRESHOLD = 4; // px; a press that travels further is a drag
      // the full forms; ?form=min plays section 2's minimal forms (R353 BQ-11): D9-03 is already one property
      // at `fast` (unchanged), the halos of D9-05 and of D9-09's canvas half play over `fast`, the tree half keeps
      // its timing
      const MIN = CFG.form === "min";
      const ENTRY = {
        snap: { row: "D9-03", dur: DUR.fast, ease: "decelerate" },
        select: { row: "D9-05", dur: MIN ? DUR.fast : DUR.normal, ease: "standard" },
        undo: {
          row: "D9-09",
          dur: MIN ? DUR.fast : DUR.slow,
          ease: "standard",
          tree: DUR.normal,
          treeEase: "accelerate",
        },
      };
      // ---- helpers -----------------------------------------------------------------------------------
      function mulberry32(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function bezier([x1, y1, x2, y2]) {
        // CSS cubic-bezier: solve x(t) = p by bisection (robust for the 0-slope ends), return y(t)
        const c = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
        return (p) => {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let lo = 0,
            hi = 1,
            t = p;
          for (let i = 0; i < 30; i++) {
            t = (lo + hi) / 2;
            if (c(x1, x2, t) < p) lo = t;
            else hi = t;
          }
          return c(y1, y2, t);
        };
      }
      const EASING = Object.fromEntries(Object.entries(EASE).map(([k, v]) => [k, bezier(v)]));
      const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
      const fmt = (v) =>
        v.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const pct = (a, p) => {
        if (!a.length) return 0;
        const s = [...a].sort((x, y) => x - y);
        return s[Math.min(s.length - 1, Math.ceil((p / 100) * s.length) - 1)];
      };
      const r2 = (x) => +x.toFixed(2);
      const out = document.getElementById("out");
      // ---- the seeded scene: 160 candles and N drawings ------------------------------------------------
      const W = 1280,
        H = 720,
        BARS = 160,
        BW = W / BARS;
      const rnd = mulberry32(CFG.seed);
      const candles = [];
      {
        let p = 64000;
        for (let i = 0; i < BARS; i++) {
          const o = p,
            c = o + (rnd() - 0.5) * 160,
            hi = Math.max(o, c) + rnd() * 70,
            lo = Math.min(o, c) - rnd() * 70;
          candles.push({ o, h: hi, l: lo, c });
          p = c;
        }
      }
      const pMin = Math.min(...candles.map((k) => k.l)),
        pMax = Math.max(...candles.map((k) => k.h));
      const py = (v) => 40 + ((pMax - v) / (pMax - pMin)) * (H - 80);
      const bx = (i) => i * BW + BW / 2;
      const FIELDS = [
        ["Open", "o"],
        ["High", "h"],
        ["Low", "l"],
        ["Close", "c"],
      ];
      const N = CFG.drawings;
      const drawings = [];
      // three overlapping trendlines at the centre (the pick target of ?play=select), then the seeded rest
      drawings.push({ kind: 0, x0: 500, y0: 300, x1: 780, y1: 420, name: "Trendline" });
      drawings.push({ kind: 0, x0: 500, y0: 400, x1: 780, y1: 320, name: "Trendline" });
      drawings.push({ kind: 1, x0: 590, y0: 330, x1: 700, y1: 400, name: "Rectangle" });
      const DRAG = 3; // the trendline the snap scenario drags (anchor 2 follows the pointer)
      drawings.push({
        kind: 0,
        x0: bx(60),
        y0: py(candles[60].l),
        x1: bx(100),
        y1: py(candles[100].h),
        name: "Trendline",
      });
      while (drawings.length < N) {
        const r = rnd();
        if (r < 0.5) {
          const i = Math.floor(rnd() * (BARS - 20)),
            j = i + 4 + Math.floor(rnd() * 16);
          drawings.push({
            kind: 0,
            x0: bx(i),
            y0: py(candles[i].h),
            x1: bx(j),
            y1: py(candles[j].l),
            name: "Trendline",
          });
        } else if (r < 0.7) {
          const y = py(pMin + rnd() * (pMax - pMin));
          drawings.push({ kind: 0, x0: 0, y0: y, x1: W, y1: y, name: "Horizontal line" });
        } else {
          const x = rnd() * (W - 120),
            y = 40 + rnd() * (H - 160);
          drawings.push({
            kind: 1,
            x0: x,
            y0: y,
            x1: x + 30 + rnd() * 90,
            y1: y + 20 + rnd() * 80,
            name: "Rectangle",
          });
        }
      }
      drawings.forEach((d, i) => {
        d.id = i;
        d.len =
          d.kind === 0
            ? Math.hypot(d.x1 - d.x0, d.y1 - d.y0)
            : 2 * (Math.abs(d.x1 - d.x0) + Math.abs(d.y1 - d.y0));
        d.cx = (d.x0 + d.x1) / 2;
        d.cy = (d.y0 + d.y1) / 2;
      });
      const DRAG_HOME = { x1: drawings[DRAG].x1, y1: drawings[DRAG].y1 };
      // ---- WebGL2: the candle batch and the drawings batch (one instanced draw call each) -------------------
      const canvas = document.getElementById("gl");
      const gl = canvas.getContext("webgl2", {
        antialias: false,
        preserveDrawingBuffer: MODE === "capture",
      });
      if (!gl) {
        out.textContent = 'RESULT{"error":"no WebGL2 context"}';
        throw new Error("no WebGL2");
      }
      function program(vs, fs) {
        const p = gl.createProgram();
        for (const [type, src] of [
          [gl.VERTEX_SHADER, vs],
          [gl.FRAGMENT_SHADER, fs],
        ]) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
          gl.attachShader(p, s);
        }
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
        return p;
      }
      const CORNERS = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
      const CANDLE_VS = `#version 300 es
        layout(location=0) in vec2 a_c; layout(location=1) in vec4 a_rect; layout(location=2) in vec3 a_col;
        uniform vec2 u_res; out vec3 v_col;
        void main() {
          vec2 p = mix(a_rect.xy, a_rect.zw, a_c * 0.5 + 0.5);
          gl_Position = vec4(p.x / u_res.x * 2.0 - 1.0, 1.0 - p.y / u_res.y * 2.0, 0.0, 1.0);
          v_col = a_col;
        }`;
      const CANDLE_FS = `#version 300 es
        precision mediump float; in vec3 v_col; out vec4 o;
        void main() { o = vec4(v_col, 1.0); }`;
      // kind 0 segment, 1 rectangle outline, 2 the snap ring (scaled by u_ring), 3 a filled handle dot
      const DRAW_VS = `#version 300 es
        layout(location=0) in vec2 a_c; layout(location=1) in vec4 a_geo; layout(location=2) in vec4 a_sty;
        layout(location=3) in vec3 a_col; layout(location=4) in float a_alpha;
        uniform vec2 u_res; uniform float u_ring;
        out vec2 v_p; flat out vec4 v_geo; flat out vec4 v_sty; flat out vec4 v_col;
        void main() {
          float k = a_sty.x, hw = a_sty.y * 0.5 + 1.0, r = a_sty.z * (k == 2.0 ? u_ring : 1.0);
          vec2 p;
          if (k == 0.0) {
            vec2 d = a_geo.zw - a_geo.xy; float l = max(length(d), 0.001); vec2 u = d / l, n = vec2(-u.y, u.x);
            p = a_geo.xy + u * ((a_c.x * 0.5 + 0.5) * (l + 2.0) - 1.0) + n * a_c.y * hw;
          } else if (k == 1.0) {
            vec2 lo = min(a_geo.xy, a_geo.zw) - hw, hi = max(a_geo.xy, a_geo.zw) + hw;
            p = mix(lo, hi, a_c * 0.5 + 0.5);
          } else {
            p = a_geo.xy + a_c * (r + hw);
          }
          v_p = p; v_geo = a_geo; v_sty = vec4(k, a_sty.y, r, 0.0); v_col = vec4(a_col, a_alpha);
          gl_Position = a_alpha > 0.0 ? vec4(p.x / u_res.x * 2.0 - 1.0, 1.0 - p.y / u_res.y * 2.0, 0.0, 1.0)
                                      : vec4(2.0, 2.0, 2.0, 1.0);
        }`;
      const DRAW_FS = `#version 300 es
        precision highp float; in vec2 v_p; flat in vec4 v_geo; flat in vec4 v_sty; flat in vec4 v_col; out vec4 o;
        void main() {
          float k = v_sty.x, hw = v_sty.y * 0.5, d;
          if (k == 0.0) {
            vec2 a = v_geo.xy, b = v_geo.zw, pa = v_p - a, ba = b - a;
            float h = clamp(dot(pa, ba) / max(dot(ba, ba), 0.001), 0.0, 1.0);
            d = length(pa - ba * h) - hw;
          } else if (k == 1.0) {
            vec2 c = (v_geo.xy + v_geo.zw) * 0.5, e = abs(v_geo.zw - v_geo.xy) * 0.5, q = abs(v_p - c) - e;
            d = abs(length(max(q, 0.0)) + min(max(q.x, q.y), 0.0)) - hw;
          } else if (k == 2.0) {
            d = abs(length(v_p - v_geo.xy) - v_sty.z) - hw;
          } else {
            d = length(v_p - v_geo.xy) - v_sty.z;
          }
          float cov = clamp(0.5 - d, 0.0, 1.0) * v_col.a;
          if (cov <= 0.0) discard;
          o = vec4(v_col.rgb * cov, cov);
        }`;
      const candleProg = program(CANDLE_VS, CANDLE_FS);
      const drawProg = program(DRAW_VS, DRAW_FS);
      const U = {
        cRes: gl.getUniformLocation(candleProg, "u_res"),
        dRes: gl.getUniformLocation(drawProg, "u_res"),
        ring: gl.getUniformLocation(drawProg, "u_ring"),
      };
      function attrib(loc, data, size, divisor, usage) {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, data, usage || gl.STATIC_DRAW);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(loc, divisor);
        return b;
      }
      // candles: a wick rect and a body rect per bar
      const cRect = new Float32Array(BARS * 2 * 4),
        cCol = new Float32Array(BARS * 2 * 3);
      candles.forEach((k, i) => {
        const x = bx(i),
          up = k.c >= k.o,
          col = rgb(up ? HEX.up : HEX.down),
          wick = rgb(HEX.wick);
        cRect.set([x - 0.5, py(k.h), x + 0.5, py(k.l)], i * 8);
        cRect.set(
          [x - BW * 0.35, py(Math.max(k.o, k.c)), x + BW * 0.35, py(Math.min(k.o, k.c)) + 1],
          i * 8 + 4,
        );
        cCol.set(wick, i * 6);
        cCol.set(col, i * 6 + 3);
      });
      const candleVao = gl.createVertexArray();
      gl.bindVertexArray(candleVao);
      attrib(0, CORNERS, 2, 0);
      attrib(1, cRect, 4, 1);
      attrib(2, cCol, 3, 1);
      // the drawings batch: [halo slots x 20][N drawings][2 handles][the snap ring]
      const HALO0 = 0,
        DRAW0 = HS1_CAP,
        HANDLE0 = DRAW0 + N,
        RING = HANDLE0 + 2,
        COUNT = RING + 1;
      const geo = new Float32Array(COUNT * 4),
        sty = new Float32Array(COUNT * 4),
        col = new Float32Array(COUNT * 3),
        alpha = new Float32Array(COUNT);
      const C = { drawing: rgb(HEX.drawing), selected: rgb(HEX.selected), snap: rgb(HEX.snap) };
      drawings.forEach((d, i) => {
        geo.set([d.x0, d.y0, d.x1, d.y1], (DRAW0 + i) * 4);
        sty.set([d.kind, 1.5, 0, 0], (DRAW0 + i) * 4);
        col.set(C.drawing, (DRAW0 + i) * 3);
        alpha[DRAW0 + i] = 1;
      });
      for (let h = 0; h < 2; h++) {
        sty.set([3, 0, 4, 0], (HANDLE0 + h) * 4); // the 8 px handle dot
        col.set(C.selected, (HANDLE0 + h) * 3);
      }
      sty.set([2, 1.5, RING_R, 0], RING * 4);
      col.set(C.snap, RING * 3);
      const drawVao = gl.createVertexArray();
      gl.bindVertexArray(drawVao);
      attrib(0, CORNERS, 2, 0);
      const B = {
        geo: attrib(1, geo, 4, 1, gl.DYNAMIC_DRAW),
        sty: attrib(2, sty, 4, 1, gl.DYNAMIC_DRAW),
        col: attrib(3, col, 3, 1, gl.DYNAMIC_DRAW),
        alpha: attrib(4, alpha, 1, 1, gl.DYNAMIC_DRAW),
      };
      gl.bindVertexArray(null);
      // ---- upload accounting: the entry's bytes (instance alpha, the ring's scale uniform) vs the cuts' ------
      const F = { draws: 0, entryBytes: 0, cutBytes: 0 };
      function put(buf, arr, index, comps, entry) {
        gl.bindBuffer(gl.ARRAY_BUFFER, B[buf]);
        gl.bufferSubData(gl.ARRAY_BUFFER, index * comps * 4, arr, index * comps, comps);
        if (entry) F.entryBytes += comps * 4;
        else F.cutBytes += comps * 4;
      }
      let ringScale = 1,
        ringSent = 1;
      function render() {
        F.draws = 0;
        gl.viewport(0, 0, W, H);
        const bg = rgb(HEX.canvas);
        gl.clearColor(bg[0], bg[1], bg[2], 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(candleProg);
        gl.uniform2f(U.cRes, W, H);
        gl.bindVertexArray(candleVao);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, BARS * 2);
        F.draws++;
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(drawProg);
        gl.uniform2f(U.dRes, W, H);
        gl.uniform1f(U.ring, ringScale);
        if (ringScale !== ringSent) F.entryBytes += 4; // the scale uniform: one float
        ringSent = ringScale;
        gl.bindVertexArray(drawVao);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, COUNT);
        F.draws++;
        gl.disable(gl.BLEND);
        gl.bindVertexArray(null);
      }
      const px1 = new Uint8Array(4);
      const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px1); // wait for the GPU
      // ---- the tree (CMP-240 stand-in): a DOM sibling of the chart; its D9-09 half is an opacity overlay ----
      const tree = document.getElementById("tree");
      const rowsEl = drawings.map((d) => {
        const r = document.createElement("div");
        r.className = "row";
        r.setAttribute("role", "treeitem");
        r.setAttribute("aria-selected", "false");
        r.innerHTML = '<div class="ov"></div><span class="lbl"></span><span class="tag"></span>';
        r.querySelector(".lbl").textContent = `${d.id + 1}. ${d.name}`;
        tree.appendChild(r);
        return r;
      });
      // ---- the entries (time-based: every state is a function of `now`, so a dropped frame changes nothing) --
      const S = {
        animate: !CFG.reduce, // RenderFlags.animate; reduce = snap to the resting value
        selected: -1,
        halos: [], // { slot, d, t0, dur, ease }
        lastStart: new Map(), // per element (HS-1)
        overlays: [], // the tree halves: { el, anim }
        ring: {
          key: "",
          t0: -1e9,
          last: -1e9,
          wLast: -1e9,
          shown: false,
          settles: 0,
          atRest: 0,
          starts: [],
        },
        regionStarts: new Map(), // region -> halo start times (HS-1b's start clause)
        starts: [], // every start: { el, t, regions } (the play runs' MR-1 and HS-1b counts)
        win: -1e9, // when the entry's window opened, with or without motion (the matched frame population)
        press: null, // a pointer press: { x, y } until it ends or crosses DRAG_THRESHOLD
        deleted: new Set(),
        log: [],
      };
      function setSelected(i) {
        if (S.selected >= 0) {
          col.set(C.drawing, (DRAW0 + S.selected) * 3);
          put("col", col, DRAW0 + S.selected, 3);
          rowsEl[S.selected].setAttribute("aria-selected", "false");
        }
        S.selected = i;
        for (let h = 0; h < 2; h++) {
          if (i >= 0) {
            const d = drawings[i];
            const [x, y] = h ? [d.x1, d.y1] : [d.x0, d.y0];
            geo.set([x, y, x, y], (HANDLE0 + h) * 4);
            put("geo", geo, HANDLE0 + h, 4);
          }

        }

        const cw = 360,
          ch = 200,
          tw = entry === "select" ? 0 : 200,
          cap = 44,
          Z = 3;
        const sx = Math.round(Math.min(W - cw, Math.max(0, focus[0] - cw / 2))),
          sy = Math.round(Math.min(H - ch, Math.max(0, focus[1] - ch / 2)));
        const c2 = document.createElement("canvas");
        c2.width = cw + tw;
        c2.height = ch + cap;
        const x = c2.getContext("2d");
        x.fillStyle = "#000000";
        x.fillRect(0, 0, c2.width, cap);
        x.drawImage(canvas, sx, sy, cw, ch, 0, cap, cw, ch);
        x.font = "11px sans-serif";
        x.textBaseline = "middle";
        x.fillStyle = "#E8EAED";
        const mo = CFG.reduce ? "reduce" : "normal";
        x.fillText(
          `${e.row} ${entry} · ${atWord} ${at} ms · motion ${mo} · form ${CFG.form}`,
          6,
          8,
        );
        x.fillText("the prototype is not the engine", 6, 22);
        x.fillText("SwiftShader, --disable-gpu, below class", 6, 36);
        if (entry === "snap" && S.ring.text)
          x.fillText(S.ring.text, S.ring.at[0] - sx + 10, S.ring.at[1] - sy + cap - 12);
        if (entry === "snap") {
          // the zoom: a 60 x 60 px square around the ring, drawn 3x (180 px) without smoothing
          const zs = 60,
            zx = Math.round(S.ring.at[0] - zs / 2),
            zy = Math.round(S.ring.at[1] - zs / 2);
          x.fillStyle = "#161B22";
          x.fillRect(cw, cap, tw, ch);
          x.imageSmoothingEnabled = false;
          x.drawImage(canvas, zx, zy, zs, zs, cw + 1, cap, zs * Z, zs * Z);
          x.strokeStyle = "#8B949E";
          x.strokeRect(cw + 0.5, cap + 0.5, zs * Z, zs * Z);
          x.strokeRect(zx - sx + 0.5, zy - sy + cap + 0.5, zs, zs);
          x.fillStyle = "#E8EAED";
          x.fillText(`3× zoom · ring scale ${ringScale.toFixed(2)}`, cw + 6, cap + ch - 2);
        } else if (tw) {
          x.fillStyle = "#161B22";
          x.fillRect(cw, cap, tw, ch);
          for (let r = 0; r < 8; r++) {
            const id = Math.max(0, UNDO_PICK - 3) + r,
              y = cap + r * 24,
              sel = id === UNDO_PICK;
            if (sel) {
              x.fillStyle = "#2E363E";
              x.fillRect(cw, y, tw, 24);
              x.strokeStyle = "#8B949E";
              x.strokeRect(cw + 0.5, y + 0.5, tw - 1, 23);
              x.globalAlpha = overlay;
              x.fillStyle = "#F0B441";
              x.fillRect(cw, y, tw, 24);
              x.globalAlpha = 1;
            }
            x.fillStyle = sel ? "#E8EAED" : "#B1BAC4";
            x.fillText(`${id + 1}. ${drawings[id].name}`, cw + 8, y + 12);
            if (sel) {
              x.fillStyle = "#B1BAC4";
              x.fillText(`restored · ${overlay.toFixed(2)}`, cw + 100, y + 12);
            }
          }
        }
        out.textContent =
          "RESULT" +
          JSON.stringify({
            capture: entry,
            at: atWord,
            at_ms: at,
            motion: mo,
            form: CFG.form,
            ring_scale: r2(ringScale),
            halo: S.halos.map((h) => r2(alpha[HALO0 + h.slot])),
            overlay: r2(overlay),
            png: c2.toDataURL("image/png"),
          });
      }
      // a person can try the drag cut too: a press on the chart that travels more than DRAG_THRESHOLD px
      canvas.addEventListener("pointerdown", (ev) => pointerDown(ev.offsetX, ev.offsetY));
      canvas.addEventListener("pointermove", (ev) => {
        if (S.press) pointerMove(ev.offsetX, ev.offsetY);
      });
      canvas.addEventListener("pointerup", () => (S.press = null));
      // ---- boot --------------------------------------------------------------------------------------------
      try {
        if (MODE === "measure") measure();
        else if (MODE === "play") play(CFG.play);
        else if (MODE === "capture") capture(CFG.capture, CFG.at);
        else {
          reset(!CFG.reduce);
          render();
        }
      } catch (err) {
        out.textContent = "RESULT" + JSON.stringify({ error: String(err) });
      }
    </script>
  </body>
</html>
