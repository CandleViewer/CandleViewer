<rect width="720" height="100%" fill="white"/>
<rect x="20" y="20" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="37">FS01 the chart region (SCR-030)</text>
<text x="30" y="53" font-size="11">from: `Ctrl+\`; `Tab`</text>
<rect x="20" y="76" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="93">FS02 the plot: the chart root's cursor, footprint on</text>
<text x="30" y="109" font-size="11">from: FS01; `Esc` from FS03</text>
<rect x="20" y="132" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="149">FS03 the expanded level window (≤ 40 level nodes)</text>
<text x="30" y="165" font-size="11">from: `Enter` on FS02</text>
<rect x="20" y="188" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="205">FS04 the cell-detail drawer (CMP-046, non-modal)</text>
<text x="30" y="221" font-size="11">from: `Enter` on a level in FS03</text>
<rect x="20" y="244" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="261">FS05 the cell menu</text>
<text x="30" y="277" font-size="11">from: `Shift+F10` or the Menu key on a level in FS03 (PROPOSED, G-3)</text>
<rect x="20" y="300" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="317">FS06 SCR-045, the table in place of the plot</text>
<text x="30" y="333" font-size="11">from: `Alt+T` on FS02 or FS03</text>
<rect x="20" y="356" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="373">FS07 SCR-032, the footprint settings dialog, with the CMP-228 </text>
<text x="30" y="389" font-size="11">from: its invoking control (D02 §6.1)</text>
<rect x="20" y="412" width="520" height="40" fill="white" stroke="black"/>
<text x="30" y="429">FS08 SCR-056's E18 rows</text>
<text x="30" y="445" font-size="11">from: `Tab` into its panel</text>
