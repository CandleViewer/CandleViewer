<!doctype html>
<html lang="en" data-theme="dark" data-motion="safe">
  <head>
    <meta charset="utf-8" />
    <title>E09-D08 auth motion bench</title>
    <!-- The shipped theme runtime CSS: under data-motion="reduce" every transition and animation is neutralised. -->
    <link rel="stylesheet" href="../../../../packages/ui/src/theme/theme.css" />
    <style>
      /* Token values resolved from packages/ui/tokens at the base (token name beside each). The built
         tokens.dark.css is a build artefact (pnpm --filter @candleviewer/ui build:tokens), so the
         properties the chassis uses are restated here; no value is invented. */
      :root {
        --motion-duration-fast: 100ms; /* motion.duration.fast */
        --motion-duration-normal: 200ms; /* motion.duration.normal */
        --motion-easing-standard: cubic-bezier(0.2, 0, 0, 1); /* motion.easing.standard */
        --motion-easing-decelerate: cubic-bezier(0, 0, 0, 1); /* motion.easing.decelerate */
        --motion-easing-accelerate: cubic-bezier(0.3, 0, 1, 1); /* motion.easing.accelerate */
        --opacity-scrim: 0.6; /* opacity.scrim */
        --opacity-disabled: 0.45; /* opacity.disabled */
        --color-surface-app: #0b0e11; /* color.surface.app */
        --color-surface-raised: #161b22; /* color.surface.raised */
        --color-surface-overlay: #1c222b; /* color.surface.overlay */
        --color-surface-sunken: #000000; /* color.surface.sunken */
        --color-text-primary: #e8eaed; /* color.text.primary */
        --color-text-secondary: #b1bac4; /* color.text.secondary */
        --color-border-default: #2e363e; /* color.border.default */
        --color-border-strong: #3d4650; /* color.border.strong */
        --color-action-primary-default: #2b6ce8; /* color.action.primary.default */
        --color-status-danger-default: #c93a3f; /* color.status.danger.default */
        --color-status-danger-strong: #f0b441; /* color.status.danger.strong */
        --color-status-warning-strong: #f5c86b; /* color.status.warning.strong */
        --color-candle-up: #2ebd59; /* color.candle.up */
        --color-candle-down: #e5484d; /* color.candle.down */
        --color-candle-wick: #8b949e; /* color.candle.wick */
        --color-grid-line: #1c222b; /* color.grid.line */
        --elevation-1: 0px 1px 2px 0px #00000066; /* elevation.1 */
        --elevation-dialog: 0px 8px 24px 0px #000000b3; /* elevation.dialog = elevation.4 */
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--color-surface-app);
        color: var(--color-text-primary);
        font: 13px system-ui;
      }
      .panel {
        position: absolute;
        width: 220px;
        height: 110px;
        padding: 8px;
        background: var(--color-surface-raised);
        border: 1px solid var(--color-border-default);
      }
      .mask {
        display: none;
        position: absolute;
        inset: 0;
        background: var(--color-surface-raised);
        color: var(--color-text-secondary);
      }
      .locked .mask {
        display: flex;
      }
      .locked .panel button {
        opacity: var(--opacity-disabled);
        pointer-events: none;
      }
      #scrim {
        position: fixed;
        inset: 0;
        opacity: 0;
        background: var(--color-surface-sunken);
        transition: opacity var(--motion-duration-normal) var(--motion-easing-standard);
      }
      #scrim.on {
        opacity: var(--opacity-scrim);
      }
      #scrim.blur {
        backdrop-filter: blur(8px); /* forbidden control */
      }
      .exit {
        opacity: 0 !important;
        transition: opacity var(--motion-duration-fast) var(--motion-easing-accelerate) !important;
      }
      .card {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 420px;
        padding: 20px;
        box-sizing: border-box;
        border: 1px solid var(--color-border-strong);
        background: var(--color-surface-overlay);
        box-shadow: var(--elevation-dialog);
        opacity: 0;
        transform: translate(-50%, -50%) translateY(8px);
        transition:
          opacity var(--motion-duration-normal) var(--motion-easing-standard),
          transform var(--motion-duration-normal) var(--motion-easing-standard);
      }
      .card.scale {
        transform: translate(-50%, -50%) scale(0.96);
      }
      .card.in {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
      .card.shadow {
        box-shadow: var(--elevation-1); /* forbidden control */
        transition: box-shadow var(--motion-duration-normal) var(--motion-easing-standard);
      }
      .card.shadow.in {
        box-shadow: var(--elevation-dialog);
      }
      .card.height {
        height: 0;
        overflow: hidden; /* forbidden control */
        transition: height var(--motion-duration-normal) var(--motion-easing-standard);
      }
      .card.height.in {
        height: 320px;
      }
      .notrans,
      .notrans * {
        transition: none !important;
      }
      #warn {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 360px;
        padding: 14px;
        border-left: 4px solid var(--color-status-warning-strong);
        background: var(--color-surface-overlay);
        box-shadow: var(--elevation-dialog);
        opacity: 0;
        transition: opacity var(--motion-duration-fast) var(--motion-easing-decelerate);
      }
      #warn.slow {
        transition-duration: var(--motion-duration-normal);
      }
      #warn.in {
        opacity: 1;
      }
      .alert {
        padding: 6px 8px;
        border-left: 4px solid var(--color-status-danger-default);
        color: var(--color-status-danger-strong);
      }
      input {
        display: block;
        width: 100%;
        margin: 6px 0 10px;
        padding: 6px;
        box-sizing: border-box;
        border: 1px solid var(--color-border-strong);
        background: var(--color-surface-app);
        color: var(--color-text-primary);
      }
      input.err {
        border-color: var(--color-status-danger-default);
      }
      button {
        min-width: 120px;
        padding: 6px 12px;
        color: #fff;
        border: 0;
        background: var(--color-action-primary-default);
      }
      .spin {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #fff;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      #out {
        position: fixed;
        left: 8px;
        top: 8px;
        font: 11px monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="panels"></div>
    <div id="scrim"></div>
    <div id="card" class="card" role="alertdialog" aria-labelledby="ct" aria-describedby="cd">
      <h2 id="ct">Screen locked</h2>
      <p id="cd">Market data continues. Order entry is disabled. Enter your password to resume.</p>
      <div class="alert" role="alert" id="cerr"></div>
      <label>Password <input id="pw" type="password" /></label>
      <label>Authenticator code <input id="otp" inputmode="numeric" /></label>
      <button>Unlock</button>
    </div>
    <div id="warn" role="alertdialog" aria-label="Session timeout warning">
      Session locks in 60 s. <button>Extend</button>
    </div>
    <div id="auth" class="card">
      <h2 id="at">Sign in</h2>
      <div class="alert" role="alert" id="aerr" tabindex="-1"></div>
      <label>Username <input id="au" /></label>
      <label>Password <input id="ap" type="password" /></label>
      <button id="abtn">Sign in</button>
    </div>
    <div id="out">RUNNING</div>
    <script>
      // E09-D08 measurement prototype (design evidence, not product code). Per frame it records the
      // requestAnimationFrame interval, the backdrop's own draw span and the span of a forced style +
      // layout, for the backdrop alone (control) and during each transition, in both motion modes.
      // A "dropped" frame is an interval > 25 ms (1.5 vsync periods: a missed vsync lands at 33.3 ms);
      // the raw p50 / p95 / p99 / max are kept beside it so the 16.6 ms budget can be read directly.
      const $ = (id) => document.getElementById(id);
      const q = new URLSearchParams(location.search);
      const WIN = +(q.get("ms") || 500);
      const REPS = +(q.get("reps") || 3);
      const PRE = 24; // backdrop-only frames before each transition fires
      const W = innerWidth;
      const H = innerHeight;
      const cv = $("bg");
      const g = cv.getContext("2d");
      cv.width = W;
      cv.height = H;
      const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      let s = 7;
      const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
      const N = Math.ceil(W / 6) + 2;
      const bars = [];
      let p = H / 2;
      for (let i = 0; i < N; i++) {
        const c = p + (rnd() - 0.5) * 24;
        bars.push({ o: p, c, h: Math.max(p, c) + rnd() * 14, l: Math.min(p, c) - rnd() * 14 });
        p = c;
      }
      let t = 0;
      let drawing = true;
      function draw() {
        t++;
        g.fillStyle = css("--color-surface-app");
        g.fillRect(0, 0, W, H);
        g.strokeStyle = css("--color-grid-line");
        for (let y = 0.5; y < H; y += 40) {
          g.beginPath();
          g.moveTo(0, y);
          g.lineTo(W, y);
          g.stroke();
        }
        const up = css("--color-candle-up");
        const dn = css("--color-candle-down");
        g.strokeStyle = css("--color-candle-wick");
        for (let i = 0; i < N; i++) {
          const b = bars[(i + Math.floor(t / 6)) % N];
          const x = i * 6 - (t % 6);
          g.beginPath();
          g.moveTo(x + 2.5, b.l);
          g.lineTo(x + 2.5, b.h);
          g.stroke();
          g.fillStyle = b.c >= b.o ? up : dn;
          g.fillRect(x, Math.min(b.o, b.c), 5, Math.max(1, Math.abs(b.c - b.o)));
        }
        g.fillStyle = up;
        g.fillRect(0, Math.floor(H / 2 + Math.sin(t / 20) * 30), W, 1);
      }
      for (let i = 0; i < 4; i++) {
        const d = document.createElement("div");
        d.className = "panel";
        d.style.left = 24 + i * 250 + "px";
        d.style.top = H - 150 + "px";
        d.innerHTML = `<b>Panel ${i + 1}</b><br />PnL +1,204.50 · 3 orders<br /><button>Submit</button><div class="mask">Hidden while locked</div>`;
        $("panels").appendChild(d);
      }
      const body = document.body;
      const force = () => void body.offsetHeight;
      const instant = (fn) => {
        body.classList.add("notrans");
        fn();
        force();
        body.classList.remove("notrans");
      };
      // Scenario actions, one token each: L± locked body · S+/S-/Sb scrim on / exit / on+blur ·
      // Cv:<variant> card variant · C+/C- card in / exit · K lock shown instantly · A auth card shown
      // instantly · A~ auth card re-faded in · T2/T3 auth title swap · E! failure text + field borders ·
      // Ae login alert text · B! busy label swap · F<id> focus.
      const ACT = {
        "L+": () => body.classList.add("locked"),
        "L-": () => body.classList.remove("locked"),
        "S+": () => ($("scrim").className = "on"),
        "S-": () => ($("scrim").className = "on exit"),
        Sb: () => ($("scrim").className = "on blur"),
        "C+": () => ($("card").className = $("card").className.replace(" in", "") + " in"),
        "C-": () => ($("card").className += " exit"),
        K: () => instant(() => act("L+ S+ C+")),
        A: () => instant(() => ($("auth").className = "card in")),
        "A~": () => {
          $("auth").className = "card";
          force();
          $("auth").className = "card in";
        },
        T2: () => ($("at").textContent = "Two-factor code"),
        T3: () => ($("at").textContent = "Step 2 of 3 — Confirm"),
        "E!": () => {
          $("cerr").textContent = "Invalid password or code.";
          $("pw").className = $("otp").className = "err";
        },
        Ae: () => ($("aerr").textContent = "Username or password is incorrect"),
        "W+": () => ($("warn").className += " in"),
        "W-": () => ($("warn").className += " exit"),
        Ws: () => ($("warn").className = "slow"),
        Wi: () => instant(() => ($("warn").className = "in")),
        "B!": () => ($("abtn").innerHTML = '<span class="spin"></span> Signing in…'),
      };
      function act(str) {
        for (const tok of str.split(" ")) {
          if (!tok) continue;
          if (tok.startsWith("Cv:")) $("card").className = "card " + tok.slice(3);
          else if (tok.startsWith("F")) $(tok.slice(1)).focus();
          else ACT[tok]();
        }
      }
      function reset() {
        instant(() => {
          body.classList.remove("locked");
          $("card").className = "card";
          $("scrim").className = "";
          $("warn").className = "";
          $("auth").className = "card";
          $("cerr").textContent = $("aerr").textContent = "";
          $("pw").className = $("otp").className = "";
          $("at").textContent = "Sign in";
          $("abtn").innerHTML = "Sign in";
        });
      }
      // [name, backdrop animates, window ms (0 = default), pre-state actions, fired actions]. The
      // pre-auth routes carry no chart, so their backdrop is static.
      const SCN = [
        ["control", 1, 0, "", ""],
        ["mask-flip", 1, 200, "", "L+"],
        ["lock-in-translate", 1, 0, "", "L+ S+ C+ Fpw"],
        ["lock-in-scale", 1, 0, "Cv:scale", "L+ S+ C+ Fpw"],
        ["unlock-out", 1, 0, "K", "L- S- C-"],
        ["cmp098-in-fast", 1, 0, "", "W+"],
        ["cmp098-in-normal", 1, 0, "Ws", "W+"],
        ["cmp098-out", 1, 0, "Wi", "W-"],
        ["stepup-open", 1, 0, "", "S+ C+ Fpw"],
        ["stepup-fail", 1, 200, "K", "E!"],
        ["stepup-close", 1, 0, "K", "S- C-"],
        ["route-swap-fast", 0, 0, "A", "T2 A~ Fau"],
        ["route-cut", 0, 200, "A", "T2 Fau"],
        ["wizard-step", 0, 200, "A", "T3 Fap"],
        ["error-region", 0, 200, "A", "Ae Faerr"],
        ["busy", 0, 600, "A", "B!"],
        ["forbid-blur", 1, 0, "", "L+ Sb C+"],
        ["forbid-shadow", 1, 0, "Cv:shadow", "S+ C+"],
        ["forbid-height", 1, 0, "Cv:height", "S+ C+"],
      ];
      const pct = (a, p) =>
        [...a].sort((x, y) => x - y)[Math.min(a.length - 1, Math.floor(a.length * p))];
      const med = (a) => pct(a, 0.5);
      const r2 = (v) => Math.round(v * 100) / 100;
      function run([name, bd, win, pre, fire]) {
        return new Promise((res) => {
          reset();
          act(pre);
          drawing = !!bd;
          win = win || WIN;
          let n = 0;
          let last = 0;
          let t0 = 0;
          const fr = [];
          const dr = [];
          const sl = [];
          function f(now) {
            if (n++ === 0) last = now;
            else {
              if (n === PRE + 2) {
                t0 = now;
                act(fire);
              }
              if (t0) fr.push(now - last);
              last = now;
            }
            const a = performance.now();
            if (drawing) draw();
            const b = performance.now();
            force(); // the DOM cost of this frame is not deferred
            const c = performance.now();
            if (t0) (dr.push(b - a), sl.push(c - b));
            if (t0 && now - t0 >= win) {
              res({
                frames: fr.length,
                p50: r2(med(fr)),
                p95: r2(pct(fr, 0.95)),
                p99: r2(pct(fr, 0.99)),
                max: r2(Math.max(...fr)),
                dropped: fr.filter((x) => x > 25).length,
                drawP95: r2(pct(dr, 0.95)),
                slP95: r2(pct(sl, 0.95)),
                slMax: r2(Math.max(...sl)),
                tail: r2(med(fr.slice(-8))),
              });
              return;
            }
            requestAnimationFrame(f);
          }
          requestAnimationFrame(f);
        });
      }
      (async () => {
        const rows = [];
        for (const mode of ["safe", "reduce"]) {
          document.documentElement.setAttribute("data-motion", mode);
          for (const sc of SCN) {
            const reps = [];
            for (let i = 0; i < REPS; i++) reps.push(await run(sc));
            const k = (key) => reps.map((r) => r[key]);
            rows.push({
              scn: sc[0],
              mode,
              backdrop: !!sc[1],
              win: sc[2] || WIN,
              frames: med(k("frames")),
              p95s: k("p95"),
              medP95: r2(med(k("p95"))),
              medP50: r2(med(k("p50"))),
              p99Max: r2(Math.max(...k("p99"))),
              maxMax: r2(Math.max(...k("max"))),
              dropped: k("dropped"),
              drawMedP95: r2(med(k("drawP95"))),
              slMedP95: r2(med(k("slP95"))),
              slMax: r2(Math.max(...k("slMax"))),
              tailMed: r2(med(k("tail"))),
            });
          }
        }
        let gl = "n/a";
        try {
          const x = document.createElement("canvas").getContext("webgl2");
          const d = x && x.getExtension("WEBGL_debug_renderer_info");
          gl = d ? x.getParameter(d.UNMASKED_RENDERER_WEBGL) : x ? "webgl2" : "none";
        } catch (e) {
          /* reported as n/a */
        }
        const host = {
          ua: navigator.userAgent,
          cores: navigator.hardwareConcurrency,
          gl,
          viewport: W + "x" + H,
          win: WIN,
          reps: REPS,
          pre: PRE,
        };
        $("out").textContent = "RESULT" + JSON.stringify({ host, rows });
      })();
    </script>
  </body>
</html>
