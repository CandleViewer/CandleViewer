                        params:
                          { severity: info, message: "Break-even applied on {{position.symbol}}" }
                    limits: { max_fires_per_hour: 4, cooldown_ms: 60000, once_per: position }
              tapeSpikeGraph:
                summary: Tape-acceleration scale-out, authored in the node editor
                value:
                  name: "Scale out on tape spike"
                  scope: symbol
                  editor: graph
                  bindings: { symbols: ["BTCUSDT"] }
                  ir:
                    ir_version: 1
                    trigger:
                      { type: on_metric_change, metric: tape_acceleration, debounce_ms: 1000 }
                    conditions:
                      node_id: c0
