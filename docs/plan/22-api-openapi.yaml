        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/capacity:
    get:
      tags: [admin]
      operationId: getCapacity
      summary: Ingestion, storage and rate-budget headroom
      description: >
        Projects disk exhaustion from the current recorded-symbol set and retention policy
        (~0.5-0.75 GB/day/symbol at 200-depth) and reports per-UID rate-budget utilisation,
        so the owner can see a limit approaching instead of discovering it at a rejection.
        Read from the backend's own accounting only; never queries Bybit. Same partial-result
        rules as `/admin/overview`: every section carries `AdminSliceStatus` (`rate_budget_status`
        for the `rate_budget` list). The sub-account tier is a recorded fact (`SubaccountCapacity`).
      x-rbac: { permissions: [admin:read], scope: none }
      responses:
        "200":
          description: Capacity report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapacityReport" }
