  # ===========================================================================
  # RULE ENGINE
  # ===========================================================================
  /rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: List rules
      description: |
        Each rule is presented as `getRule` presents it, so listing disarms an armed rule the
        engine must not run, audited and broadcast the same way.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: mode
          in: query
          schema: { $ref: "#/components/schemas/RuleMode" }
        - name: scope
          in: query
          schema: { $ref: "#/components/schemas/RuleScope" }
        - $ref: "#/components/parameters/SymbolQueryOptional"
        - name: tag
          in: query
          schema: { type: string, maxLength: 40 }
      x-rbac: { permissions: [rules:read], scope: granted_accounts }
      responses:
        "200":
          description: Rules page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Rule" } }
              examples:
                breakEven:
                  value:
                    items:
                      - id: "10000000-0000-4000-8000-000000000001"
                        name: "Break-even at +1R"
                        description: "Move the stop to entry + fees once price reaches 1R in favour."
                        mode: armed
                        scope: position
                        editor: form
                        tags: [risk, auto-stop]
                        active_version_id: "11000000-0000-4000-8000-000000000001"
                        version: 3
                        bindings:
                          {
                            exchange_account_ids: ["a1000000-0000-4000-8000-000000000001"],
                            symbols: ["BTCUSDT"],
                          }
                        last_run_at: "2026-09-14T10:30:12Z"
                        last_run_status: ok
                        fire_count_24h: 2
                        created_by: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0001"
                        created_at: "2026-09-05T12:00:00Z"
                        updated_at: "2026-09-12T08:20:00Z"
                    meta: { next_cursor: null, has_more: false, count: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [rules]
      operationId: createRule
      summary: Create a rule
      description: |
        A rule is stored as an **IR** (intermediate representation) — the single executable form
        produced by *both* editors (form/condition-list and node-graph), per owner decision #11.
        `editor` records which editor last authored it, purely so the UI can reopen it in the
        right surface; it never changes execution. `graph_layout` holds node coordinates for the
        node editor and is ignored by the engine.

        Creating a rule always stores it as version 1 in `mode: "disabled"`. Arming is a separate,
        audited call (`PUT /rules/{id}/mode`), and `simulate` mode is the mandatory intermediate
        step in the Definition of Done for any rule that can send orders. No step-up applies: a
        saved version reaches an order only when `setRuleMode` arms the rule, and the step-up
        comes at that arm when the rule's scope includes `live` (`rules:arm_live` and a fresh
        one-shot live-enablement step-up bound to that request).

        **Action budget (SR-104; 04 §7.2.2 row 26).** A `limits.max_fires_per_hour` or
        `limits.max_fires_per_day` above its `RuleLimits` default needs the Owner role: anyone
        else gets `403 forbidden`, whose `errors` name each such `limits.<field>` with `rule:
        owner_only_above_default`, and the refusal is audited (`rules.scope_denied`). A value
        above its hard cap, in `x-cv-limit-caps` on `RuleIr`, is refused for every role with
        `422 rule_ir_invalid` (issue code `schema_error`, class `safety`). Each value is compared
        with its default and its cap, never with an earlier version.
      x-rbac: { permissions: [rules:write], scope: granted_accounts }
      x-idempotency: recommended
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
            examples:
              breakEvenForm:
                summary: Break-even stop, authored in the form editor
                value:
                  name: "Break-even at +1R"
                  description: "Move the stop to entry + fees once price reaches 1R in favour."
                  scope: position
                  editor: form
                  tags: [risk, auto-stop]
                  bindings:
                    {
                      exchange_account_ids: ["a1000000-0000-4000-8000-000000000001"],
                      symbols: ["BTCUSDT"],
                    }
                  ir:
                    ir_version: 1
                    trigger: { type: on_position_update, debounce_ms: 500 }
                    conditions:
                      node_id: c0
                      op: all_of
                      children:
                        - node_id: c1
                          op: gte
                          left: { metric: position_r_multiple }
                          right: { const: 1 }
                        - node_id: c2
                          op: eq
