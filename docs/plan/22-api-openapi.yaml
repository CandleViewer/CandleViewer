  /trade-groups/{tradeGroupId}/cancel:
    parameters: [{ $ref: "#/components/parameters/TradeGroupId" }]
    post:
      tags: [trading]
      operationId: cancelTradeGroup
      summary: Cancel every live order in a trade group
      description: 'Optionally also flattens whatever already filled (`flatten_filled: true`), which issues reduce-only market closes per leg — used by the "abort" button in the ticket.'
      x-rbac: { permissions: [orders:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flatten_filled: { type: boolean, default: false }
                legs:
                  type: array
                  description: Restrict to these leg ids; omit for all legs.
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Per-leg cancel results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkLegResult" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trading/kill-switch:
    get:
      tags: [trading]
      operationId: getKillSwitch
      summary: Current kill-switch state
      x-rbac: { permissions: [orders:read], scope: none }
      responses:
        "200":
          description: Kill-switch state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [trading]
      operationId: setKillSwitch
      summary: Engage or release the kill-switch
      description: |
        Engaging immediately (a) refuses all new order/amend requests with `trading_disabled`,
        (b) optionally cancels all open orders, (c) optionally flattens all positions with
        reduce-only market orders, and (d) disarms every `armed` rule. Scope is `global`
        (whole deployment) or a specific account set.

        Maintenance mode (`maintenance.mode`, set with `PUT /admin/feature-flags/{flagKey}`) is
        narrower: through the shared order-entry gate it refuses every submission that opens or
        increases exposure (`trading_disabled` with `reason: maintenance`), and it cancels only
        running emulated algos, so resting entry orders can still fill. Cancels, flatten,
        quantity-reducing amends and stop-tightening amends stay available under it, and so do
        this switch's own cancel and flatten. Attaching a missing native SL, tightening a stop, or
        re-arming a protective trigger is never gated; "trigger re-armed" means an
        exposure-increasing (entry) trigger. An amend with any risk-increasing component is gated.

        Managers may engage the switch for accounts in their own scope; only the owner may
        engage it globally or **release** it. Bybit's dead-man's-switch
        (`POST /v5/order/disconnected-cancel-all`) is armed separately by the OMS for `inverse`
        only — it is not available for `linear`, so the local kill-switch is the operative
        control here.

        Every transition writes a `critical` audit entry and broadcasts a `system` WS frame.
      x-rbac: { permissions: [killswitch:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetKillSwitchRequest" }
            examples:
              panic:
                value:
                  {
                    engaged: true,
                    scope: global,
                    cancel_open_orders: true,
                    flatten_positions: true,
                    disarm_rules: true,
                    reason: "Exchange behaving abnormally — manual halt",
                  }
              release:
                value: { engaged: false, scope: global, reason: "Incident closed" }
      responses:
        "200":
          description: New kill-switch state plus the actions taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitchResult" }
              examples:
                engaged:
                  value:
                    state:
                      {
                        engaged: true,
                        scope: global,
                        exchange_account_ids: [],
                        engaged_at: "2026-09-14T10:34:00Z",
                        engaged_by: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0001",
                        reason: "Exchange behaving abnormally — manual halt",
                      }
                    actions:
                      orders_cancelled: 7
                      positions_flattened: 3
                      rules_disarmed: 4
                      failures:
                        [
                          {
                            exchange_account_id: "a1000000-0000-4000-8000-000000000003",
                            ok: false,
                            affected: 0,
                            error:
                              {
                                code: exchange_unavailable,
                                message: "REST timeout; retry scheduled",
                              },
                          },
                        ]
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

