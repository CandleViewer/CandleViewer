  /exchange-accounts/{accountId}:
    parameters: [{ $ref: "#/components/parameters/AccountId" }]
    get:
      tags: [exchange-accounts]
      operationId: getExchangeAccount
      summary: Get one exchange account
      x-rbac: { permissions: [accounts:read], scope: granted_accounts }
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeAccount" }
        "403": { $ref: "#/components/responses/AccountScopeDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [exchange-accounts]
      operationId: updateExchangeAccount
      summary: Update label, enabled flag, active profile, position/margin mode
      description: |
        Changing `position_mode` or `margin_mode` proxies to Bybit
        (`POST /v5/position/switch-mode`, `switch-isolated`, `account/set-margin-mode`) and
        fails with `conflict` when the account holds open positions or active orders.

        **Disable** (`enabled: false`, SCR-129): when the account holds open positions, working
        orders or running emulated algos, the request must carry an `open_exposure` choice
        (SR-E27-07). Without it the answer is `409 open_exposure` with the consequence summary,
        and nothing changes. The choices, the `leave_positions` stop-loss refusal, unknown
        exposure and a failed read are defined once, at `components.parameters.OpenExposure`.
        The choice applies only to disabling, never to a mode change.
      x-rbac: { permissions: [accounts:write], scope: granted_accounts }
      x-idempotency: optional
      parameters:
        [
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/CsrfToken" },
          { $ref: "#/components/parameters/OpenExposure" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExchangeAccountRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeAccount" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OpenExposureConflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "502": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [exchange-accounts]
      operationId: deleteExchangeAccount
      summary: Deactivate an exchange account
      description: |
        Revokes its keys locally, stops private streams, and marks it `disabled`.

        An account is never deleted while it holds open positions, working orders or running
        emulated algos (SCR-129, SR-E27-07). Without `open_exposure=flatten_first` such a request
        is refused with `409 open_exposure` and the consequence summary, and nothing changes.
        With it, the account is flattened first (as the `flatten_first` choice of
        `components.parameters.OpenExposure` describes) and deleted only once it is flat.

        An account whose exposure is unknown is never deleted: it is not known to be flat.
        Whatever `open_exposure` the request carries, the answer is `409 exposure_unknown` and
        nothing changes; its `remedy` says whether the account can be disabled instead
        (`updateExchangeAccount` with `enabled: false`, a new request with a new `Idempotency-Key`
        that must carry `open_exposure=leave_positions`) or a key is to be fixed first, and
        `components.parameters.OpenExposure` defines both, and what a failed read is answered with.
      x-rbac: { permissions: [accounts:write], scope: none }
      x-idempotency: optional
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: open_exposure
          in: query
          required: false
          description: >
            `flatten_first` is the only choice: deletion never leaves exposure behind, so
            `leave_positions` is not accepted here. The `Idempotency-Key` replay fingerprint
            covers this value as well as the method, path and body. A `502` or `503` of a failed
            read is never stored for replay (`components.parameters.OpenExposure`).
          schema: { type: string, enum: [flatten_first] }
      responses:
        "204": { description: "Deactivated." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OpenExposureConflict" }
        "502": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /exchange-accounts/{accountId}/keys:
    parameters: [{ $ref: "#/components/parameters/AccountId" }]
    get:
      tags: [exchange-accounts]
      operationId: listApiKeys
      summary: List API keys for an account (metadata only)
      description: "Secrets are never returned. `key_id_masked` shows at most the last 4 characters of the key id (`...` plus `key_id_last4`, SR-E27-03)."
      x-rbac: { permissions: [keys:read], scope: granted_accounts }
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [exchange-accounts]
      operationId: createApiKey
      summary: Attach an API key, verifying permissions before it is accepted
      description: |
        **Mandatory verification pipeline** — the key is only persisted if every check passes.
        The same key gate (SR-E27-04) applies to `rotateApiKey` and to every re-check of a
        stored key:

        1. `GET /v5/user/query-api` with the candidate credentials, sent only to the host of the
           account's environment (`exchange_accounts.env`, US-ACCT-007) and never retried on
           another environment's host. A key that host does not know is refused with
           `validation_failed` / `key_wrong_environment`.
        2. **Permission allow-list** (C-2.8, SR-030a, #2270). The only rights a key may hold are
           `ContractTrade` with `Order` and `Position`, and `Derivatives` with `DerivativesTrade`;
           every other group must be empty or absent, and anything else is refused, fail closed
           (owner decision #5). Withdrawal and transfer rights are checked first: a right whose
           name contains `withdraw` or `transfer` in any letter case, such as `Withdraw`,
           `AccountTransfer`, `SubMemberTransfer` and `SubMemberTransferList`, or a non-empty
           group so named, is rejected with `validation_failed` / `key_withdraw_permission`, as
           the credential broker and the account models already do. Every other right outside
           the allow-list, such as those of the `FiatP2P`, `FiatBitPay`, `FiatConvertBroker` and
           `BitCard` groups, an unknown group or right, or a name that is not plain ASCII or
           carries padding, is rejected with `validation_failed` / `key_permission_not_allowed`.
        3. Write access is read from `readOnly`, never from the permission lists (the reference
           pairs `readOnly: 1` with trading rights). A trade key (`read_only: false`) must report
           `readOnly: 0` and hold `ContractTrade` `Order` and `Position` (`key_missing_scopes`);
           a read-only key (`read_only: true`) must report `readOnly: 1` (`key_not_read_only`).
        4. UTA is read from `uta`, which must be `1`; the deprecated `unified` field is never
           read (`key_not_unified`). The UID must equal `exchange_account.exchange_uid`
           (`key_uid_mismatch`).
        5. The IP whitelist is mandatory in every environment (C-2.8, owner decision #5): `ips`
           must be non-empty, hold no wildcard (`*`) and no range wider than one host, and every
           entry must be the configured deployment egress IP itself (SR-030a). An empty list is
           `key_ip_whitelist_missing`; a wildcard, a range or any other address is
           `key_ip_whitelist_mismatch`. No setting can turn this check off (C-4.14).
        6. Expiry, if set, must be in the future (SR-030a): an expired key, or one the exchange
           itself refuses as expired, is rejected with `validation_failed` / `key_expired`. A key
           that expires within 14 days is accepted, with the `key_expiring_soon` warning.
        7. A signed no-op probe (`GET /v5/account/wallet-balance`) must pass: the exchange answers
           with return code 0 within the `recv_window`, which also validates clock sync
           (`key_probe_failed` when the exchange refuses the probe; a probe it cannot answer in
           time gives no verdict, see **No verdict**).

        The secret is envelope-encrypted (AES-256-GCM DEK, wrapped by the KEK from the OS
        keyring / age-encrypted file) before it touches disk; the plaintext exists only in
        request-scoped memory. The full verification result is stored as
        `permission_snapshot` and re-checked at start-up and hourly (C-12.2).

        **Verdict.** The exchange refusing the key itself ends a check with a verdict whichever
        call it refuses: an unknown key, a missing right, an address the key's whitelist does not
        hold and an expired key are the rules of steps 1, 3, 5 and 6 (`key_wrong_environment`,
        `key_missing_scopes`, `key_ip_whitelist_mismatch`, `key_expired`), and a refused signed
        probe is `key_probe_failed`. Every rejection is a `422` that carries the `verification`
        the pipeline reached (`KeyRejectedProblem`): `passed` is false, `egress_ip` is the
        address to add to the key's IP whitelist at the exchange, and the fields of a check that
        did not run are left out. A key the exchange refuses before its rights are read has no
        check to show (`KeyVerificationNotRead`): `passed` and `egress_ip` only, and never
        `withdraw_enabled`, since a withdrawal check that did not run is not a pass and is not
        sent as `false` (C-2.8). A `422` is stored for replay like any other answer, so the
        resend after the key is put right takes a new `Idempotency-Key`.

        **No verdict.** A signed call can end without saying anything about the key: the exchange
        gave no answer, or answered with an error that is not a refusal of the key (a refused
        signature, a clock outside the `recv_window`, a rate limit, an outage, a reply that
        cannot be read). The pipeline then has no verdict: nothing is stored, no stored key or
        account changes, and the import may be sent again. `transport_error` and `timeout`,
        where the exchange gave no answer, give `503 exchange_unavailable` with `Retry-After`;
        an error answer gives `502 exchange_error`. Neither answer echoes exchange text
        (`KeyExchangeProblem`): `Problem.exchange` holds `ret_code` only (omitted when the
        exchange sent none), never `ret_msg`, `endpoint`, `request_id` or any other exchange
        text, header, URL or request fragment (SR-E27-08). A `502` or `503` of an import is
        never stored for replay: the identical request re-sent with the same `Idempotency-Key`
        is a first submission, which verifies again (no `Idempotency-Replayed`).

        **Other statuses.** `404` is an account that does not exist. `409` is an `Idempotency-Key`
        first used with a different request (`idempotency_key_reuse`) or still being processed
        (`idempotency_in_flight`), or a request that conflicts with stored state (`conflict`).
        The replay fingerprint holds `api_key` only as a server-keyed HMAC, so another key under
        the same `Idempotency-Key` is `idempotency_key_reuse` and never the first key's answer,
        and it never holds `api_secret`, which is not hashed, stored or logged for it
        (SR-E27-20). A `503` also answers when the import cannot be made or recorded, and
        nothing is stored then: `exchange_unavailable` when signing is unavailable,
        `audit_unavailable` when the write-ahead audit record of the import cannot be written
        (C-2.9) and `store_unavailable` when the relational store is unavailable. A KEK that is
        unavailable is refused with `403 kek_unavailable` instead (ADR-0009 Amendment 1).
      x-rbac: { permissions: [keys:manage], scope: none }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
            examples:
              tradeKey:
                value:
                  api_key: "XXXXXXXXXXXXXXXXXXXX"
                  api_secret: "yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
                  label: "main-trade-2026Q3"
                  read_only: false
                  expected_uid: "10234567"
      responses:
        "201":
          description: Key verified and stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyWithVerification" }
              examples:
                verified:
                  value:
                    key:
                      id: "c1000000-0000-4000-8000-00000000000a"
                      exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                      key_id_masked: "...A1b2"
                      label: "main-trade-2026Q3"
                      status: active
                      read_only: false
                      expires_at: "2027-01-01T00:00:00Z"
                      created_at: "2026-09-14T10:35:00Z"
                      last_verified_at: "2026-09-14T10:35:01Z"
                    verification:
                      passed: true
                      uid: "10234567"
                      uta: true
                      read_only: false
                      permissions:
                        { ContractTrade: [Order, Position], Derivatives: [DerivativesTrade] }
                      withdraw_enabled: false
                      ip_whitelist: ["203.0.113.10"]
                      ip_whitelist_matches_egress: true
                      egress_ip: "203.0.113.10"
                      clock_offset_ms: 4
                      probe_ret_code: 0
                      warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/KeyRejected" }
        "502": { $ref: "#/components/responses/KeyExchangeError" }
        "503": { $ref: "#/components/responses/KeyServiceUnavailable" }

  /exchange-accounts/{accountId}/keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/KeyId"
    delete:
      tags: [exchange-accounts]
      operationId: revokeApiKey
      summary: Revoke a stored API key
      description: |
        Local revocation only — CandleViewer never deletes keys on Bybit. The exchange's delete
        endpoints need a transfer or withdrawal right (vendor reference, to be confirmed on demo
        by E27-S04), which the key gate refuses (C-2.8), so a compliant key cannot delete itself
        there: the key stays valid at the exchange until the Owner deletes it in the Bybit
        dashboard (SR-E27-06). Revoking the last active trade key drops the account to
        `key_status: missing` and halts its private streams.

        When no other `active` key remains and the account holds open positions, working orders
        or running emulated algos, the request must carry an `open_exposure` choice (SR-E27-07).
        Without it the answer is `409 open_exposure` with the consequence summary, and nothing
        is revoked. The choices, the `leave_positions` stop-loss refusal, unknown exposure and a
        failed read are defined once, at `components.parameters.OpenExposure`. Every signable
        key of the account counts in that definition, a `rotating` key too: while a `rotating`
        key is usable the account is not dead, whatever the key being revoked answers.
      x-rbac: { permissions: [keys:manage], scope: none }
      x-idempotency: optional
      parameters:
        [
          { $ref: "#/components/parameters/CsrfToken" },
          { $ref: "#/components/parameters/OpenExposure" },
        ]
      responses:
        "204": { description: "Revoked." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OpenExposureConflict" }
        "502": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /exchange-accounts/{accountId}/keys/{keyId}/rotate:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/KeyId"
    post:
      tags: [exchange-accounts]
      operationId: rotateApiKey
      summary: Rotate an API key with zero-downtime overlap
      description: |
        Two-phase rotation: the new credentials go through the same verification pipeline as
        `createApiKey`; on success the old key moves to `rotating` and both remain usable for
        the rotation overlap of **900 s** while in-flight requests drain, then the old key is
        marked `revoked`. The overlap is one fixed value, the `api_key_rotations.grace_seconds`
        of the rotation row (SR-E27-10; US-ACCT-004's 15-minute drain window), and no request
        can change it. A suspected compromise never rotates: it takes the revoke path
        (`revokeApiKey`), which ends the old key at once. Private WS connections are
        re-authenticated with the new key at the start of the overlap. The rotation is recorded
        in `api_key_rotations`.
      x-rbac: { permissions: [keys:manage], scope: none }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateApiKeyRequest" }
      responses:
        "200":
          description: Rotation started/completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotation" }
              examples:
                ok:
                  value:
                    rotation_id: "d1000000-0000-4000-8000-00000000000f"
                    old_key_id: "c1000000-0000-4000-8000-00000000000a"
                    new_key:
                      {
                        id: "c1000000-0000-4000-8000-00000000000b",
                        key_id_masked: "...C3d4",
                        status: active,
                        read_only: false,
                        label: "main-trade-2026Q4",
                        created_at: "2026-09-14T10:40:00Z",
                        exchange_account_id: "a1000000-0000-4000-8000-000000000001",
                        expires_at: null,
                        last_verified_at: "2026-09-14T10:40:01Z",
                      }
                    verification:
                      {
                        passed: true,
                        uid: "10234567",
                        uta: true,
                        read_only: false,
                        withdraw_enabled: false,
                        ip_whitelist: ["203.0.113.10"],
                        ip_whitelist_matches_egress: true,
                        egress_ip: "203.0.113.10",
                        clock_offset_ms: 3,
                        probe_ret_code: 0,
                        permissions: { ContractTrade: [Order, Position] },
                        warnings: [],
                      }
                    overlap_until: "2026-09-14T10:55:01Z"
                    state: overlapping
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /exchange-accounts/{accountId}/keys/{keyId}/test:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/KeyId"
    post:
      tags: [exchange-accounts]
      operationId: testApiKey
      summary: Re-run the verification pipeline against a stored key
      description: |
        Re-runs the verification pipeline against a stored key: diagnostics that change nothing at
        the exchange, used by the Admin - Accounts screen "Test connection" button and by the
        start-up and hourly self-check (C-12.2). Runs signed probes for REST (`wallet-balance`,
        `query-api`) and, if `include_ws` is set, opens a throwaway private WS connection and
        asserts `auth` succeeds.
        Never places orders. A failed probe reports a `KeyProbeError` code and the verification
        reports `KeyVerificationWarning` codes: no exchange error text, header, URL or request
        fragment is ever echoed (SR-E27-08).

        **Enforcement.** The REST verdict is enforced as the hourly self-check enforces its own: a
        pass refreshes the key's `last_verified_at`, and a verdict that fails the key gate (a rule
        of `createApiKey`) latches the process read-only and force-disables trading on the
        account, so a withdrawal right found on demand never waits for the next scheduled check
        (C-2.8). A probe that gives no verdict (`createApiKey`, **No verdict**) changes nothing
        and carries no `verification`: an outage never reads as a pass (SR-E27-18). The WebSocket
        half is diagnostic only: its failure sets `passed: false` and never disables anything.
        Without `include_ws` that half does not run: `websocket` is omitted, never `ok: true`.

        **Audit.** A verdict writes `account.tested` ahead of the key-row writes it covers
        (`last_error_*`, the refreshed columns), with the acting Owner as actor, the rule codes
        and the verified permission facts, never the egress IP, the whitelist or an exchange UID
        (Viewers read the audit log, C-12.4); a verdict that disarms the account also writes
        `account.disabled_by_policy`, once the disarm is made. The audit sink is no gate on
        enforcement (C-2.8 before C-2.9): a failing verdict latches the process gate first and
        disables the account whatever the sink does, and the record of the disable is re-sent;
        a pass whose record is refused refreshes nothing. The answer is the test's result either
        way.

        **Throttle.** One test per key per minute (E27-T03, #836): a second inside the minute is
        `429 rate_limited` with `Retry-After`, and nothing is probed. With `include_ws` the
        deployment opens at most 10 throwaway private WS connections per 5 minutes in all, and
        the scheduled self-check opens none (SR-E27-05): once that budget is spent the test
        answers `200` with `websocket` `{ ok: false, error: rate_limited }`, and no connection is
        opened.

        **Not signable.** Only an `active` or `rotating` key is signed with (`KeyStatus`): one
        that is `pending`, `revoked`, `invalid` or `expired` is refused with `409 conflict`, and
        nothing is probed.

        An exchange failure never fails the request: it is reported in `rest.error` or
        `websocket.error` of a `200`. A `503` means nothing could be probed: `exchange_unavailable`
        when signing is unavailable, `store_unavailable` when the relational store is. A KEK that
        is unavailable is refused with `403 kek_unavailable` (ADR-0009 Amendment 1).
      x-rbac: { permissions: [keys:read], scope: granted_accounts }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                include_ws: { type: boolean, default: true }
      responses:
        "200":
          description: "Test result (a failed probe is still a 200 with `passed: false`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyTestResult" }
              examples:
                degraded:
                  value:
                    passed: false
                    checked_at: "2026-09-14T10:41:12Z"
                    rest: { ok: true, latency_ms: 118, ret_code: 0 }
                    websocket: { ok: false, error: timeout }
                    verification:
                      {
                        passed: true,
                        uid: "10234567",
                        uta: true,
                        read_only: false,
                        withdraw_enabled: false,
                        ip_whitelist: ["203.0.113.10"],
