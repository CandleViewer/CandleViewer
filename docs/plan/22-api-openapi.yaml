  /market/profile:
    get:
      tags: [market-data]
      operationId: getProfile
      summary: Volume / delta / TPO profile for a period
      description: |
        Builds a price histogram over the requested window. `kind=volume` sums traded volume,
        `kind=delta` sums signed volume, `kind=tpo` counts discrete time periods touching each
        price (classic 30-minute letters, `tpo_period_minutes` configurable).

        Value area uses the single-step expansion algorithm (expand toward the heavier adjacent
        row until the target percentage is reached) — documented as an accepted approximation of
        the textbook two-row TPO expansion (digest 08 §4, open question #9).

        `split=session|composite|fixed` controls whether one profile or one profile per
        sub-period is returned; `naked_poc` marks prior-period POCs that have not been retraded.
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [volume, delta, tpo] }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: split
          in: query
          schema: { type: string, enum: [composite, session, fixed], default: composite }
        - name: session_anchor
          in: query
          description: "Session boundary for `split=session`; crypto has no natural session (digest 08 §5)."
          schema: { type: string, enum: [utc_day, funding_8h, custom], default: utc_day }
        - name: session_anchor_time
          in: query
          description: "`HH:MM` UTC start when `session_anchor=custom`."
          schema: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        - name: fixed_duration_minutes
          in: query
          schema: { type: integer, minimum: 1, maximum: 10080 }
        - name: price_grouping
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: value_area_pct
          in: query
          schema: { type: number, minimum: 50, maximum: 95, default: 70 }
        - name: tpo_period_minutes
          in: query
          schema: { type: integer, minimum: 1, maximum: 240, default: 30 }
        - name: include_hvn_lvn
          in: query
          description: Detect high/low volume nodes (local maxima/minima of the histogram).
          schema: { type: boolean, default: true }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileResponse" }
              examples:
                sessionVolume:
                  value:
                    symbol: BTCUSDT
                    kind: volume
                    split: session
                    profiles:
                      - period_start: "2026-09-14T00:00:00Z"
                        period_end: "2026-09-15T00:00:00Z"
                        total_volume: "48122.331"
                        poc_price: "63020.00"
                        value_area_high: "63480.00"
                        value_area_low: "62410.00"
                        naked_poc: false
                        rows:
                          - {
                              price: "63020.00",
                              volume: "1204.118",
                              buy_volume: "640.220",
                              sell_volume: "563.898",
                              delta: "76.322",
                              tpo_count: 12,
                            }
                          - {
                              price: "63010.00",
                              volume: "980.004",
                              buy_volume: "410.110",
                              sell_volume: "569.894",
                              delta: "-159.784",
                              tpo_count: 9,
                            }
                        hvn: ["63020.00"]
                        lvn: ["62700.00"]
                    meta:
                      {
                        count: 1,
                        sources: [questdb, parquet],
                        recording_started_at: "2026-09-01T00:00:00Z",
                        generated_at: "2026-09-14T10:31:02.600Z",
                        has_more: false,
                        next_cursor: null,
                      }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /market/trades:
    get:
      tags: [market-data]
      operationId: getTrades
      summary: Historical time & sales (recorded tape), optionally clustered
      description: |
        Raw recorded prints, newest-first. `cluster_window_ms` merges same-side same-price
        (±`cluster_tolerance_ticks`) prints inside the window into one display print — the
        split-fill aggregation of digest 08 §12.2, deliberately distinct from resting-side
        iceberg detection. `min_size` implements the big-trade filter used by the tape widget.
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: side
          in: query
          schema: { type: string, enum: [buy, sell] }
        - name: min_size
          in: query
          schema: { $ref: "#/components/schemas/Decimal" }
        - name: cluster_window_ms
          in: query
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
        - name: cluster_tolerance_ticks
          in: query
          schema: { type: integer, minimum: 0, maximum: 20, default: 0 }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Trades page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/PublicTrade" } }
              examples:
                tape:
                  value:
                    items:
                      - {
                          id: "2290000000123",
                          ts: "2026-09-14T10:31:01.884Z",
                          price: "63120.50",
                          size: "2.311",
                          side: buy,
                          is_block_trade: false,
                          cluster_size: 1,
                          tick_direction: PlusTick,
                        }
                      - {
                          id: "2290000000122",
                          ts: "2026-09-14T10:31:01.802Z",
                          price: "63120.40",
                          size: "0.045",
                          side: sell,
                          is_block_trade: false,
                          cluster_size: 1,
                          tick_direction: MinusTick,
                        }
                    meta: { next_cursor: "eyJ0cyI6MTc4OH0", has_more: true, count: 2 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /market/orderbook:
    get:
      tags: [market-data]
      operationId: getOrderbookSnapshot
      summary: Current order-book snapshot (bootstrap for the DOM)
      description: |
        Returns the backend's maintained book at the requested depth with its
        sequence numbers (`u`, `seq`). The client uses this to seed the DOM and then follows
        `book.{symbol}.{depth}` deltas on the WS; on any sequence gap it re-calls this endpoint
        (arch P5 — no checksum exists on Bybit, resync is drop-and-rebuild).
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: depth
          in: query
          description: "Levels per side. Mirrors Bybit's supported tiers for `linear`."
          schema: { type: integer, enum: [1, 50, 200, 500], default: 50 }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Book snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderbookSnapshot" }
              examples:
                depth50:
                  value:
                    symbol: BTCUSDT
                    depth: 50
                    u: 884120113
                    seq: 77120044901
                    ts: "2026-09-14T10:31:02.104Z"
                    bids: [["63120.40", "12.501"], ["63120.30", "4.220"]]
                    asks: [["63120.60", "9.870"], ["63120.70", "18.004"]]
                    stale: false
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /market/heatmap:
    get:
      tags: [market-data]
      operationId: getHeatmap
      summary: Historical DOM liquidity heatmap (resting size by price over time)
      description: |
        Reconstructs resting liquidity from recorded book deltas into a time × price grid.
        `time_bucket_ms` and `price_grouping` control the grid; the response is a dense matrix
        plus its axes so the WebGL engine can upload it as a texture in one step.
        Colour convention is a client concern (green = bid, red = ask by owner decision #10).
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: time_bucket_ms
          in: query
          schema: { type: integer, enum: [100, 250, 500, 1000, 5000, 60000], default: 1000 }
        - name: price_grouping
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: depth
          in: query
          schema: { type: integer, enum: [50, 200, 500], default: 200 }
        - name: normalize
          in: query
          description: "Scale cells to 0..1 per column (`column`), over the whole window (`window`), or not at all."
          schema: { type: string, enum: [none, column, window], default: window }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Heatmap matrix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeatmapResponse" }
              examples:
                small:
                  value:
                    symbol: BTCUSDT
                    from: "2026-09-14T10:30:00Z"
                    to: "2026-09-14T10:30:03Z"
                    time_bucket_ms: 1000
                    price_grouping: 1
                    times: ["2026-09-14T10:30:00Z", "2026-09-14T10:30:01Z", "2026-09-14T10:30:02Z"]
                    prices: ["63120.40", "63120.50", "63120.60"]
                    bid_matrix: [[12.5, 12.1, 0], [4.2, 4.2, 4.2], [0, 0, 0]]
                    ask_matrix: [[0, 0, 0], [0, 0, 0], [9.8, 10.2, 11.0]]
                    max_value: 12.5
                    normalize: window
                    estimated: false
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /market/metrics:
    get:
      tags: [market-data]
      operationId: getMetrics
      summary: Derived order-flow & regime metrics time series
      description: |
        One endpoint for every scalar derived series, selected by the repeated `metric` query
        parameter. Each series is returned with its own parameter echo so charts are
        reproducible. Metrics whose computation is heuristic carry `estimated: "true` at the"
        series level (arch P10).

        Supported metrics and their defaults (digest 08):
        `cvd` (anchor=session), `delta`, `min_max_delta`, `trades_per_sec` / `volume_per_sec` /
        `book_updates_per_sec` (windows 1 s/5 s/30 s), `tape_acceleration` (1 s vs 300 s
        baseline, alert >3×), `imbalance_ratio`, `absorption` (min_volume, max_price_move 1
        tick), `exhaustion` (lookback 5 bars), `iceberg` (min_reload_count 3,
        size_tolerance_pct 0.2, **estimated**), `stop_run` (max_bars_to_reverse 3,
        reversal_pct 0.5, **estimated**), `adx` (14), `atr` (14), `hurst` (R/S window 256),
        `regime` (combined ADX/Hurst classification), `vwap` (+1σ/2σ bands),
        `open_interest_delta`, `funding_basis`, `liquidation_intensity`.
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: metric
          in: query
          required: true
          explode: true
          description: Repeatable. One series per value.
          schema:
            type: array
            minItems: 1
            maxItems: 12
            items: { $ref: "#/components/schemas/MetricCode" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: bar_type
          in: query
          description: Bar grid the metric is sampled on (metrics that are bar-scoped).
          schema: { $ref: "#/components/schemas/BarType" }
        - name: param
          in: query
          schema: { type: string, maxLength: 24 }
        - name: params
          in: query
          description: 'JSON object of per-metric overrides, e.g. `{"adx":{"period":21},"cvd":{"anchor":"utc_day"}}`.'
          schema: { type: string, maxLength: 2048 }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Metric series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }
              examples:
                cvdAdx:
                  value:
                    symbol: BTCUSDT
                    bar_type: time
                    param: "1"
                    series:
                      - metric: cvd
                        estimated: false
                        params: { anchor: session, session_anchor: utc_day }
                        unit: base_volume
                        points:
                          [
                            { t: "2026-09-14T10:28:00Z", v: "-441.118" },
                            { t: "2026-09-14T10:29:00Z", v: "-453.122" },
                          ]
                      - metric: adx
                        estimated: false
                        params: { period: 14 }
                        unit: index
                        points:
                          [
                            { t: "2026-09-14T10:28:00Z", v: "27.44" },
                            { t: "2026-09-14T10:29:00Z", v: "28.10" },
                          ]
                      - metric: iceberg
                        estimated: true
                        params: { min_reload_count: 3, size_tolerance_pct: 0.2 }
                        unit: confidence
                        points:
                          [
                            {
                              t: "2026-09-14T10:29:00Z",
                              v: "0.62",
                              meta: { price: "63118.00", side: bid, reloads: 4 },
                            },
                          ]
                    meta:
                      {
                        count: 3,
                        sources: [questdb],
                        recording_started_at: "2026-09-01T00:00:00Z",
                        generated_at: "2026-09-14T10:31:02.700Z",
                        has_more: false,
                        next_cursor: null,
                      }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

