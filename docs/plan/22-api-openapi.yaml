  /trade-groups:
    get:
      tags: [trading]
      operationId: listTradeGroups
      summary: List trade groups (multi-account fan-outs)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SymbolQueryOptional"
        - name: status
          in: query
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/TradeGroupStatus" } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      x-rbac: { permissions: [orders:read], scope: granted_accounts }
      responses:
        "200":
          description: Trade groups page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/TradeGroup" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [trading]
      operationId: createTradeGroup
      summary: Place one ticket across N accounts (fan-out) with per-leg overrides
      description: |
        The core multi-account primitive (owner decision #5). One intent → one leg per targeted
        account, each sized and bracketed by **that account's** profile, with optional per-leg
        overrides.

        **Resolution order per leg** (later wins): account profile → request-level defaults →
        `legs[].overrides`. The server returns the fully resolved parameters per leg in the
        response so the UI can show exactly what will be sent *before* fills arrive.

        **Execution semantics**
        * `atomicity: best_effort` (default) — every leg is attempted; failures are reported
          per leg and the group ends `partially_open`.
        * `atomicity: all_or_none` — legs are pre-validated (risk caps, balances, instrument
          filters, rate budget) and the group is abandoned without sending anything if any leg
          fails validation. True cross-account atomicity is impossible once orders are sent, so
          a post-send failure triggers `compensate: "flatten_filled` when requested."
        * Fan-out is scheduled against a **per-UID** rate budget (Bybit limits are per-UID and
          shared across keys, digest 06 §13); `max_concurrent_legs` bounds parallelism, default 5.
        * Every leg carries a native exchange-side stop (arch P4). A leg whose resolved
          parameters would have no stop is rejected at validation, never sent.

        **Algo orders.** `algo` selects an emulated execution strategy — Bybit exposes none of
        these through the public API (digest 09 §2/§6): `oco` (race two orders, cancel the loser
        on the WS fill notice), `iceberg` (client-side slicing; `orderType=Iceberg` does not
        exist on `/v5/order/create`), `twap` (timed slices), `chase` (repeated cancel/replace to
        stay at the touch), `scaled` (ladder of N limits, equal/linear/geometric distribution).
        Child orders are created with `intent: "algo_child` and linked to the leg."
      x-rbac: { permissions: [orders:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTradeGroupRequest" }
            examples:
              threeAccountFanout:
                summary: Market long on 3 accounts, one leg overrides size and stop
                value:
                  symbol: BTCUSDT
                  side: buy
                  order_type: market
                  intent: entry
                  atomicity: best_effort
                  max_concurrent_legs: 5
                  defaults:
                    sizing: { mode: profile }
                    stop_loss: { unit: ticks, value: "200" }
                    take_profit: { unit: r_multiple, value: "2" }
                    tpsl_mode: Full
                  legs:
                    - exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                    - exchange_account_id: "a1000000-0000-4000-8000-000000000002"
                      overrides:
                        sizing: { mode: fixed_qty, qty: "0.100" }
                        stop_loss: { unit: percent, value: "0.4" }
                    - exchange_account_id: "a1000000-0000-4000-8000-000000000003"
                      overrides:
                        profile_id: "b1000000-0000-4000-8000-0000000000a3"
                  arm_token: "<opaque arm token — example placeholder>"
                  note: "Range-high breakout, 15m"
              scaledEntry:
                summary: Scaled limit entry, geometric ladder, single account
                value:
                  symbol: ETHUSDT
                  side: buy
                  order_type: limit
                  intent: entry
                  defaults:
                    sizing: { mode: fixed_notional, notional_usd: "30000" }
                    stop_loss: { unit: ticks, value: "150" }
                  algo:
                    kind: scaled
                    scaled:
                      {
                        levels: 5,
                        from_price: "3120.00",
                        to_price: "3090.00",
                        distribution: geometric,
                        skew: "1.6",
                      }
                  legs: [{ exchange_account_id: "a1000000-0000-4000-8000-000000000001" }]
              twapExit:
                summary: TWAP reduce-only exit over 10 minutes
                value:
                  symbol: BTCUSDT
                  side: sell
                  order_type: limit
                  intent: scale_out
                  reduce_only: true
                  defaults: { sizing: { mode: pct_position, pct: "50" } }
                  algo:
                    {
                      kind: twap,
                      twap:
                        {
                          duration_seconds: 600,
                          slices: 20,
                          randomize_pct: 15,
                          limit_offset_ticks: 1,
                        },
                    }
                  legs: [{ exchange_account_id: "a1000000-0000-4000-8000-000000000001" }]
      responses:
        "202":
          description: Trade group accepted; legs are submitting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeGroup" }
              examples:
                accepted:
                  value:
                    id: "0c000000-0000-4000-8000-000000000001"
                    client_group_ref: "cv-0c000000"
                    symbol: BTCUSDT
                    side: buy
                    intent: entry
                    status: submitting
                    atomicity: best_effort
                    algo: { kind: none }
                    created_by: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0001"
                    created_at: "2026-09-14T10:33:00Z"
                    note: "Range-high breakout, 15m"
                    legs:
                      - id: "0b000000-0000-4000-8000-000000000001"
                        exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                        profile_id: "b1000000-0000-4000-8000-0000000000a1"
                        status: submitted
                        resolved:
                          qty: "0.396"
                          leverage: "10"
                          stop_loss_price: "62900.00"
                          take_profit_price: "63600.00"
                          notional_usd: "25000.00"
