      summary: Compile an editor model into canonical rule IR
      description: >
        Accepts either editor's native model and returns canonical IR plus its `ir_hash`.
        Compiling the form model and the graph model of the same rule MUST produce an
        identical hash; that equality is the round-trip guarantee asserted by the contract
        tests in 24-internal-schemas.md section 11.4.
      x-rbac: { permissions: [rules:read], scope: granted_accounts }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
