# =============================================================================
# CandleViewer — REST API contract (OpenAPI 3.1)
# File: docs/plan/22-api-openapi.yaml
# Status: Baseline, approved for build planning. Date 2026-09-14. Owner: basiltt.
# Scope guard: web app only (React + custom WebGL engine + Electron shell);
#              owner/admin screens live INSIDE the web app behind RBAC;
#              NO Android client, NO separate admin app; Bybit USDT linear perps only.
# Upstream:  docs/plan/00-planning-brief.md, docs/research/24-owner-decisions.md,
#            docs/plan/20-architecture.md, docs/plan/21-database-schema.md
# Downstream: docs/plan/23-ws-protocol.md, docs/plan/24-internal-schemas.md
#
# Conventions (binding, enforced by contract tests — see 03-testing-strategy.md):
#  C1  Base path is /api/v1. Breaking changes bump to /api/v2; additive changes never break v1.
#  C2  All errors are RFC 9457 application/problem+json (see components.schemas.Problem
#      and the x-error-codes catalogue below). No bare strings, ever.
#  C3  All list endpoints are cursor-paginated (components.parameters.Cursor/Limit) and
#      return components.schemas.PageMeta in `meta`.
#  C4  All state-changing endpoints (POST/PATCH/DELETE) accept `Idempotency-Key`;
#      it is REQUIRED on every order/position mutating endpoint (x-idempotency: required).
#  C5  Every operation declares `x-rbac` (required permission codes + account-scope rule).
#      Server-side authority: the client is never trusted for account scope (arch P8).
#  C6  Money/size/price fields are decimal STRINGS (never JSON numbers) to avoid IEEE-754 loss.
#  C7  Timestamps are RFC 3339 UTC strings; exchange-native epoch-millis fields are suffixed `_ms`.
#  C8  Market-data reads served from the LOCAL store (QuestDB/Parquet), never proxied live to
#      Bybit on the request path; streaming lives in the WS protocol (23-ws-protocol.md).
#  C9  `environment` (live|demo|testnet) is structural: it selects hosts, keys, storage
#      namespace and code paths. It is always explicit, never inferred (arch P9).
#  C10 Derived/heuristic values carry `estimated: true` (arch P10).
# =============================================================================
openapi: 3.1.0

info:
  title: CandleViewer API
  version: 1.0.0
  summary: Self-hosted trading terminal API — market data, order flow, execution, rules, admin.
  description: |
    REST contract for the CandleViewer backend (Python 3.12 / FastAPI modular monolith).

    ### Transport & access
    * Bound to `127.0.0.1` / WSL-internal only; reachable exclusively over Tailscale (arch P11).
    * TLS terminated by the local reverse proxy; plaintext HTTP is refused outside loopback.
    * Real-time data is **not** polled here — subscribe over the WebSocket protocol documented
      in `docs/plan/23-ws-protocol.md`. REST is for bootstrap, history, configuration and commands.

    ### Authentication
    Short-lived access JWT (10 min) in `Authorization: "Bearer`, plus an opaque refresh token"
    stored in an `HttpOnly; Secure; SameSite=Strict` cookie (`cv_refresh`) and rotated on every
    use. Login is two-legged when MFA is enabled: `POST /auth/login` returns an `mfa_required`
    challenge, `POST /auth/mfa/verify` exchanges it for tokens.

    ### Enrolment-only session (#2295, #2344)
    TOTP is mandatory for every user (C-12.2, SR-020). A user who has `mfa_required` set and no
    confirmed MFA method (`user.mfa_enabled` false) must enrol one before doing anything else, so
    every session of that user is **enrolment-only**. The restriction is derived from the user's
    state on every request; the session carries no flag. It holds for a user who has never
    enrolled and for one left without a confirmed method by an owner TOTP reset (which also sets
    `mfa_required`) or by any recovery sign-in. It ends when `POST /auth/mfa/enroll/confirm`
    succeeds, and that call revokes every other session of the user, so no session minted on the
    password alone outlives the enrolment.

    * **Minting.** For such a user, `POST /auth/login` with the right password answers
      `200 AuthenticatedResponse` with the `cv_refresh` and `__Host-cv_csrf` cookies instead of an
      MFA challenge, and the session is enrolment-only; its `auth.session_created` audit record
      carries `enrolment_only: true`. `POST /auth/mfa/recovery` puts the user in this state and
      answers the same way: it first revokes every MFA method and every other session of the
      user. Every `user` object in an `AuthenticatedResponse` or a `SessionInfo` carries both
      `mfa_required` and `mfa_enabled`. The client treats the session as enrolment-only exactly
      when `user.mfa_required` is true and `user.mfa_enabled` is false, and then opens TOTP
      enrolment (R-006 `/login/2fa/enroll`, SCR-003), which has no skip.
    * **Allowed operations.** Only `POST /auth/mfa/enroll`, `POST /auth/mfa/enroll/confirm`,
      `GET /auth/session`, `POST /auth/refresh` and `POST /auth/logout`. Every other operation
      that needs a session answers `403 mfa_enrollment_required` and changes nothing. The refusal
      is audited as `auth.mfa_enrollment_required`, up to a per-user budget (beyond it, or while
      the audit writer is saturated: the same `403` and no audit record; the metric
      `auth_enrolment_refused_total` counts every refusal). A session that cannot be checked
      answers `503 store_unavailable` (fail closed). One past its 15 minutes, or whose expiry lies
      further ahead or that proved a second factor (it was not minted as one), answers `401` as an
      expired token does (`refresh_token_invalid` on `POST /auth/refresh`), except on
      `POST /auth/logout`. The WebSocket refuses the session at `auth` (`23-ws-protocol.md` section
      4.3), audited the same way.
    * **Lifetime.** A session minted enrolment-only lives at most 15 minutes from sign-in.
      `POST /auth/refresh` rotates it as usual, but the successor keeps the same absolute expiry,
      so refresh never extends it; `refresh_expires_in` and the cookies' `Max-Age` count down to
      that expiry. After it the user signs in again.
    * **Completion.** `POST /auth/mfa/enroll/confirm` activates the new TOTP method, revokes every
      other TOTP method of the user and replaces the user's recovery codes with 10 new ones, as one
      step: the old method and codes stop working at the instant the new ones start. Only the
      method created by the user's latest `POST /auth/mfa/enroll` can be confirmed, once; a method
      that a recovery sign-in or an owner reset revoked never can. The call also revokes every
      other session of the user (revoke-all on a TOTP change, ADR-0010 decision 2). It then
      rotates the session (SR-013): the enrolment-only session is revoked, so its access and
      refresh tokens stop working at once, and a full session with new tokens and cookies
      replaces it.
    * **Users without `mfa_required`.** C-12.2 forbids them (TOTP is mandatory for every user),
      and #965 refuses `mfa_required: false`. The state is outside v1 and fails closed:
      `POST /auth/login` mints no session for such a user without a confirmed method, and
      `POST /auth/mfa/recovery` mints none and consumes nothing.

    ### CSRF (SR-041, double-submit cookie)
    Every state-changing operation (`POST`/`PUT`/`PATCH`/`DELETE`) requires an `X-CSRF-Token`
    header (`components.parameters.CsrfToken`), regardless of the auth scheme. There is **no
    bearer exemption**: non-browser clients also receive the `__Host-cv_csrf` cookie and echo it.

    * **Cookie.** `__Host-cv_csrf`, `Secure; SameSite=Strict; Path=/`, no `Domain`, **not**
      `HttpOnly` (the client must read it). `Max-Age` equals the refresh-token lifetime
      (`refresh_expires_in`, the same as `cv_refresh`), so a browser restart never strands
      `/auth/refresh` or `/auth/logout`. The attributes match `cv_refresh` and the
      deployment model: TLS via Tailscale or the Electron shell, and `http://127.0.0.1` /
      `localhost` is a secure context, so `Secure` cookies work in local development.
    * **Token.** `<nonce>.<mac>`. The nonce has at least 128 bits from a CSPRNG.
      `mac = HMAC-SHA256(csrf_key, len(session_id) || session_id || nonce)` (length-prefixed
      session id). `csrf_key` is a dedicated, rotatable server key, separate from the access-JWT
      and refresh signing keys. `session_id` is the server-side session id (`sid`), **never** the
      refresh token.
    * **Validation.** The server requires the header to be present and equal to the cookie,
      **and** recomputes the MAC against the session id that it resolves itself (the access
      token's `sid`; for `/auth/refresh`, and for a `POST /auth/logout` or `POST /auth/unlock`
      identified by the `cv_refresh` cookie (see "Idle lock"), the session bound to the
      presented `cv_refresh`). Header/cookie equality alone is never sufficient. Every
      comparison is constant time.
    * **Issue, rotate and re-issue.** `POST /auth/login` (when `status=authenticated`),
      `POST /auth/mfa/verify`, `POST /auth/mfa/recovery` and `POST /auth/mfa/enroll/confirm`
      (which rotates the session) issue a token for the new session.
      `POST /auth/refresh` validates the presented token against the session bound to
      `cv_refresh`, then rotates both cookies. A successful `POST /auth/step-up` rotates the
      session (SR-013) and both cookies with it. `GET /auth/session` re-issues the cookie for
      the current session when it is absent or does not verify (the bootstrap recovery path).
      `POST /auth/logout` expires it.
    * **Multi-tab.** After a rotation in another tab, a request carrying the old token may get
      `403 csrf_token_invalid`. The client then re-reads the cookie and retries the request
      **once**; a second refusal is surfaced to the user.
    * **Exempt.** The pre-session operations that run before any session exists
      (`POST /auth/login`, `/auth/mfa/verify`, `/auth/mfa/recovery`,
      `/invites/{inviteToken}`, `/invites/{inviteToken}/confirm`) and the safe methods
      (`GET`/`HEAD`/`OPTIONS`). `SameSite=Strict` and the SR-042 `Origin` check are
      additional controls, never the only one.
    * **Refusal.** A missing, mismatched or session-unbound token yields `403`
      `csrf_token_invalid` and an `auth.csrf_refused` audit record, up to a per-session /
      per-source budget (beyond it: the same `403` with an optional `Retry-After` and no audit
      record). The problem `detail` never echoes token or cookie values.

    ### Idle lock (E09-D06, #2300)
    A session with no activity passes `session.idle_deadline` (`last_seen_at + idle_timeout_s`)
    and becomes **idle-locked**. It is locked, not revoked: WS frames keep flowing (ADR-0020
    section 4). Only `POST /auth/unlock`, `POST /auth/logout` and `GET /auth/session` are
    allowed while locked, and logout ends only the calling session (SCR-005 "Sign out
    instead"): `all_sessions: true` from a locked session answers `401 session_idle_locked`
    and revokes nothing. Whoever is at a locked terminal has not proved who they are, so they
    must not sign the user out of other sessions (#2290 ruling, rule 3b). Every other
    authenticated operation answers a request from a locked session with
    `401 session_idle_locked` (problem field `idle_locked_at`) instead of `unauthenticated`,
    and changes nothing; an expired access token is still `unauthenticated`.
    `POST /auth/refresh` answers a locked session the same way instead of
    `refresh_token_invalid`, and rotates nothing. The client then shows the unlock screen
    (SCR-005), not sign-in.

    A locked session can always be unlocked or signed out. The access token is memory-only and
    lasts 12 minutes (ADR-0020 decisions 1 and 3), and refresh is refused while locked, so a long
    lock or a reload leaves the client without one. The three operations allowed while locked
    therefore accept either credential (`bearerAuth` or `refreshCookie`): an access token inside
    its lifetime identifies the session, else the `cv_refresh` cookie does, but only while it is
    that session's current refresh token. A rotated-away or never-issued cookie is
    `401 unauthenticated` and changes no session (the family revocation of reuse detection stays
    with `POST /auth/refresh`); it is counted and, within a budget, audited
    (`auth.refresh_reuse_detected` with outcome `denied` for a rotated-away cookie,
    `auth.session_fixation_attempt` for a never-issued one). A revoked or expired session
    answers as it would to its access token. A cookie-identified
    `POST /auth/logout` or `POST /auth/unlock` gets the SR-042 `Origin` check and the SR-041
    CSRF check of `POST /auth/refresh`; `GET /auth/session` stays a safe read. No other
    operation accepts the cookie, and none, unlock included, accepts an expired access token.
    "Sign out instead" therefore works for the whole lock and after a reload: it revokes the
    session, clears both cookies and writes `auth.logout` and `auth.session_revoked`.

    Step-up elevation never survives the lock (#2290 ruling, rule 4d: a one-factor unlock must
    never inherit a two-factor grace). Step-up grants are cleared at lock: from the moment the
    session locks, every grace window, one-shot grant and pending challenge of the session is
    void and authorizes nothing, and while locked `GET /auth/session` reports
    `step_up_expires_at: null`. The synchronous step-up check enforces this from the session
    row, not B16 alone (C-2.21: B16 only records it), and the server deletes the grants from the
    row no later than the write that lifts the lock. A password-only `POST /auth/unlock`
    therefore never carries elevation: after an unlock every dangerous action answers
    `403 step_up_required` until a fresh password + TOTP `POST /auth/step-up`. A read-only
    downgrade survives lock and unlock.

    Activity is explicit. Only `POST /auth/session/extend` and a successful `POST /auth/unlock`
    record activity (`REQUEST` for extend and `UNLOCK_OK` for unlock, on B16, re-stamp
    `last_seen_at`), so only they move `session.idle_deadline`. No other operation moves it,
    whatever it reads or writes, and neither does client-side input or WS traffic.
    `POST /auth/refresh` is not activity: the
    rotated session inherits `last_seen_at` (as it inherits `expires_at`), so
    `session.idle_deadline` is unchanged and a client that refreshes on the
    `23-ws-protocol.md` section 4.3 schedule still locks on time. `GET /auth/session` is
    read-only. Extend is refused once locked; only `POST /auth/unlock` lifts a lock.
    `session_revoked` is answered only by `POST /auth/unlock`; every other operation keeps the
    uniform `unauthenticated` for a revoked or expired session, so no other route works as a
    session oracle.

    ### View-as session (read-only, #3085)
    An Owner can see the app as another user sees it without acting as them (SCR-124; finding
    AD-F03 of the E42 threat model, #890). `POST /admin/view-as` starts a **view-as context**
    on the caller's session, and `GET` and `DELETE /auth/session/view-as` read and end it there,
    as self-service operations apart from the administrative start (SR-026). The session's own
    user is the **viewer**; the user viewed as is the **target**. The context is held on the
    server and bound to that one session: the viewer's other sessions are unaffected, and a
    refresh rotation (`POST /auth/refresh`) carries it to the successor session unchanged. A
    session holds at most one context. Synchronous server code enforces every rule below from
    the session's server-side state; the client never does, and no statechart does (C-12.4,
    C-2.21). No flag, setting, role or header turns any of them off (C-4.14).

    * **The viewer's own operations.** `POST /admin/view-as`, `GET` and
      `DELETE /auth/session/view-as`, `GET /auth/session`, `POST /auth/refresh`,
      `POST /auth/logout`, `POST /auth/session/extend` and `POST /auth/unlock` act on the
      viewer's own session, as the viewer, and `POST /telemetry/frontend` carries only bucket
      counts. None of the rules below applies to them, so leaving view-as is one call that
      nothing refuses.
    * **Read-only.** Every other state-changing request, except the protective writes below,
      answers `403 view_as_read_only` and changes nothing. State-changing means the method
      (`POST`, `PUT`, `PATCH`, `DELETE`), not the effect, so view-as refuses all writes and fails
      closed: the write-method operations that need only a `*:read` permission
      (`previewTradeGroup`, `validateRule`, `compileRule`, `testApiKey`, `verifyAuditChain` and
      `createSupportBundle`) are refused too. Except on the operations the protective writes
      below pass to their handlers, the refusal is decided after authentication, the CSRF check
      (SR-041) and the session state (enrolment-only, the idle lock, `session_read_only`), and
      before authorisation, request validation and the step-up gate, so it is never a step-up
      challenge and binds no idempotency key. A cross-site page cannot cause a refusal.
    * **Protective writes (C-2.6).** Neither the read-only rule nor the hold refuses the
      writes the C-2.6 carve-out of the `Forbidden` response names, or engaging the kill switch
      on an account set (`setKillSwitch` with `engaged: true`, `scope: accounts`; releasing it
      and `scope: global` stay refused: the viewer leaves view-as first). Both pass
      `setKillSwitch`, `amendOrder`, `amendTradeGroup` and `setPositionTpSl` (the `trading-stop`
      write) to their handlers, which decide after validation by the classification of
      24-internal-schemas.md section 8.10: a request with any non-protective component is
      refused `view_as_read_only` (or `view_as_expired`) there, before any effect, binds no key
      and writes its refusal record. A protective write runs as the viewer, is audited with the
      viewer as the actor, and is admitted only when both the viewer's own RBAC and the target's
      `x-rbac` allow it; in the hold it runs in the viewer's own scope.
    * **Scope.** Every other read answers as it would answer the target: the target's role
      permissions (`x-permissions`) and account grants decide `x-rbac`, and a `scope: self` read
      returns the target's own data. The viewer's role adds nothing, so no owner-only
      permission, flag or datum is reachable, and an operation the target may not call answers
      `403 forbidden`. The WebSocket follows the same scope (23-ws-protocol.md section 9.6).
    * **Expiry and the hold.** The server sets `expires_at` to `started_at` plus 30 minutes;
      the client cannot set or extend it, and no activity, refresh or re-authentication does.
      At `expires_at` the context ends on the server's clock, whether or not a request arrives.
      The server also ends it at once when the viewer's session no longer holds `users:write`,
      or when the target becomes an Owner or is disabled. A context the server ended stays
      **held** on the session: it grants nothing, and until `DELETE /auth/session/view-as`
      clears it, every operation except the viewer's own ones and the protective writes answers
      `403 view_as_expired`, whatever its method, and changes nothing, reads included. A client
      still showing the target's view never receives the viewer's own data in it.
    * **Audit (C-2.9).** Every audit record written for a request or a WebSocket frame of a
      session that holds a context names the viewer and the viewer's session as the actor. The
      target is only ever the object, never the actor. `startViewAs` and `endViewAs` define the
      view-as records. An end, by the server or by `endViewAs`, never waits on its
      `admin.view_as_ended`: one that cannot be written then stays pending on the session row
      until its record is written, late (`recorded_late`), once the audit writer takes records
      again. The start's record, written ahead, already bounds the window to `expires_at`.
    * **Refusal records (AD-D06; requirement 1, #2836).** Each `view_as_read_only` or
      `view_as_expired` refusal, each refused start and each refused WebSocket action frame
      writes one `admin.view_as_refused` ahead of its answer (a WebSocket frame gets one record,
      as in 23-ws-protocol.md section 5.2). They are counted per user by the mechanism of
      "Audit budget" in `queryAuditLog`, with its `suppressed` count, under their own hourly cap,
      `view_as_refusal_budget_per_hour` (default 120), and never use a slot of the `/admin/audit*`
      budget. Each refusal is also counted in `auth_view_as_refused_total{reason}`. A due record
      that cannot be written turns a REST refusal into `503 audit_unavailable`, and nothing
      changes. A refusal under the target's scope is recorded as any authorisation refusal is.

    ### RBAC
    Roles `owner` | `manager` | `viewer` map to permission codes (`orders:write`,
    `keys:manage`, …). Each operation lists them in `x-rbac.permissions`. In addition,
    `x-rbac.scope` states how the request is narrowed to the caller's granted
    `exchange_account` set (`user_account_access`); a manager never sees another manager's
    accounts, and the server re-derives scope from the token on every call.

    ### Idempotency
    `Idempotency-Key` (client-generated UUIDv4) is stored with the request fingerprint for 24 h.
    Replay with the same key + same body returns the original response and
    `Idempotency-Replayed: true`. Same key + different body → `409` with code
    `idempotency_key_reuse`. Exception (E42-T05): any answer but a `2xx` with which
    `createBackup` or `restoreBackup` refuses to start (a precondition, another backup or restore
    still running, the hourly limit, a dependency that is unavailable, or a backup engine that
    is not wired or is invalid) is not stored under the key, so the same key and body are
    evaluated afresh once the cause clears.

    **Binding point (#2304).** On every operation that requires the key (parameter
    `IdempotencyKeyRequired`, which every `x-idempotency: required` operation takes) the key is
    recorded only after the request has passed every admission check: authentication and CSRF,
    the session state (`session_read_only`, the idle lock of #2300, and a view-as context's
    `view_as_read_only` and `view_as_expired` of #3085) and authorisation (RBAC, account scope
    and `step_up_required`). A request refused by any of them stores no
    idempotency record and executes nothing; only the refusal's own effects remain (such as its
    audit record, where that refusal is audited, and for `step_up_required` the challenge it
    issues). The identical request re-sent with the same key once the cause is cleared (after an
    unlock or a successful step-up) is therefore a first submission: it executes once and is not
    answered from the idempotency store (no `Idempotency-Replayed`). This is what lets a client
    hold a request refused with `step_up_required` and re-send it unchanged
    (`POST /auth/step-up`, C-2.10).

    ### Rate limiting
    Per-user token bucket (default 600 req/min, 60 req/s burst) plus a per-UID *exchange*
    budget mirroring Bybit's per-UID limits. Responses carry `RateLimit-Limit`,
    `RateLimit-Remaining`, `RateLimit-Reset`; exceeding yields `429` + `Retry-After`.
