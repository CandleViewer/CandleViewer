  /market/footprint:
    get:
      tags: [market-data]
      operationId: getFootprint
      summary: Footprint (bid/ask volume per price level per bar) with imbalance analysis
      description: |
        Returns one `cells` array per bar, keyed by tick-rounded price, plus per-bar POC/value
        area and the detected diagonal/stacked imbalances and unfinished auctions.

        Defaults follow digest 08 §3: diagonal imbalance ratio 300 %, minimum stack 3,
        value area 70 %. Cells are aggregated from `publicTrade` using the taker side `S`
        directly — no aggressor reconstruction is needed on Bybit.

        Response size is bounded: `bars × price_levels` must be ≤ 200 000 cells, else `400`
        with `validation_failed` / `footprint_window_too_large`. The UI paginates by bar.
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: bar_type
          in: query
          required: true
          schema: { $ref: "#/components/schemas/BarType" }
        - name: param
          in: query
          required: true
          schema: { type: string, maxLength: 24 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/BarLimit"
        - name: price_grouping
          in: query
          description: Merge N ticks per footprint row (1 = native tick resolution).
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: imbalance_ratio
          in: query
          description: Diagonal imbalance threshold as a ratio (3 = 300 %).
          schema: { type: number, minimum: 1.5, maximum: 20, default: 3 }
        - name: min_stack
          in: query
          schema: { type: integer, minimum: 2, maximum: 10, default: 3 }
        - name: min_imbalance_volume
          in: query
          description: Ignore imbalances whose larger side is below this base-asset volume.
          schema: { $ref: "#/components/schemas/Decimal" }
        - name: value_area_pct
          in: query
          schema: { type: number, minimum: 50, maximum: 95, default: 70 }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Footprint bars.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FootprintResponse" }
              examples:
                oneBar:
                  value:
                    symbol: BTCUSDT
                    bar_type: time
                    param: "5"
                    tick_size: "0.10"
                    price_grouping: 1
                    bars:
                      - t: "2026-09-14T10:25:00Z"
