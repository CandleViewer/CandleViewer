# -----------------------------------------------------------------------------
# Global security: every operation requires a bearer token unless it opts out
# with `security: []` (login, refresh, health probes).
# -----------------------------------------------------------------------------
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login, MFA, refresh, logout, session introspection.
  - name: users
    description: User CRUD, role assignment, per-account access grants (owner only).
  - name: exchange-accounts
    description: Bybit main/sub accounts, API keys (create/verify/rotate/test), per-account profiles.
  - name: instruments
    description: Symbol catalogue, instrument metadata, tick/lot filters, fee rates.
  - name: market-data
    description: Local-store reads — klines, alternative bar types, footprint, profiles, metrics, OI/funding/liquidations.
  - name: recording
    description: Recorded-symbol list, recording sessions, retention, storage budget.
  - name: replay
    description: Deterministic tick replay sessions over recorded data.
  - name: trading
    description: Order placement (single + trade-group fan-out), amend, cancel, cancel-all, kill-switch.
  - name: positions
    description: Position list, TP/SL, close, reverse, leverage & margin mode.
  - name: executions
    description: Fill-level history and closed PnL.
  - name: rules
    description: Rule engine — CRUD, versions, validate, simulate, enable/disable, runs.
  - name: alerts
    description: Alert definitions, deliveries, acknowledgement.
  - name: journal
    description: Trade journal entries, tags, notes, analytics.
  - name: workspaces
    description: Workspaces, layouts, chart templates, drawings, indicator presets.
  - name: settings
    description: User settings and hotkey profiles.
  - name: admin
    description: Audit log query, health, feature flags, backups (owner-gated).
  - name: perf
    description: Perf instrumentation for the k6 load profiles (#2097). Mounted only while `CV_AUTH_PERF_ENABLED` is on, which `Settings` refuses unless the environment is testnet with no exchange key; never in live or demo.

# -----------------------------------------------------------------------------
# x-error-codes — the closed catalogue of `type` slugs used in problem+json.
# Contract tests assert that no service emits a code outside this list.
#
# CANONICITY: this file is the SINGLE canonical registry of error-code slugs for the
# whole product. The WebSocket catalogue in 23-ws-protocol.md §10.2 is a *partition* of
# the same registry, not a second list: WS-only transport codes are enumerated below in
# `x-error-codes-ws` and the seven dual-surface codes are marked `surface: [rest, ws]`.
# The generator `tools/errorcodes/generate.py` emits Python + TypeScript enums from this
# file alone; the WS document is asserted against it by contract test
# `error_registry_single_source` (§x-contract-validation.gates).
# -----------------------------------------------------------------------------
x-error-codes:
  # --- 400 family --------------------------------------------------------
  - code: validation_failed
    status: 400
    title: Request body or parameters failed schema validation
    retryable: false
  - code: unsupported_category
    status: 400
    title: Only Bybit USDT linear perpetuals are supported in v1
    retryable: false
  - code: tick_size_violation
    status: 400
    title: Price is not a multiple of the instrument tick size
    retryable: false
  - code: lot_size_violation
    status: 400
    title: Quantity violates the instrument qty step / min / max
    retryable: false
  - code: invalid_cursor
    status: 400
    title: Pagination cursor is malformed or expired
    retryable: false
  - code: invalid_time_range
    status: 400
    title: from/to range is inverted or exceeds the allowed window
    retryable: false
  # --- 401 / 403 ---------------------------------------------------------
  - code: unauthenticated
    status: 401
    title: Missing, malformed or expired access token
    retryable: false
  - code: mfa_required
    status: 401
    title: Multi-factor authentication challenge must be completed
    retryable: false
  - code: mfa_invalid
    status: 401
    title: MFA code rejected
    retryable: false
  - code: refresh_token_invalid
    status: 401
    title: Refresh token unknown, rotated away, or revoked (possible reuse attack)
    retryable: false
  - code: session_idle_locked
    status: 401
    title: Session is idle-locked; unlock it with the password (POST /auth/unlock)
    retryable: false
  - code: unlock_invalid
    status: 401
    title: Unlock password rejected
    retryable: false
  - code: session_revoked
    status: 401
    title: Session revoked or past its absolute lifetime; sign in again
    retryable: false
  - code: step_up_required
    status: 403
    title: A dangerous action needs a live step-up elevation for its action class
    retryable: false
  - code: session_read_only
    status: 403
    title: Session is read-only for 5 minutes after three invalid step-up codes
    retryable: false
  - code: mfa_enrollment_required
    status: 403
    title: Session is enrolment-only; enrol and confirm a TOTP method first
    retryable: false
  - code: positions_unknown
    status: 409
    title: Open-position state is unavailable; resend with acknowledge_unknown_positions=true
    retryable: false
  - code: forbidden
    status: 403
    title: Authenticated but lacking the required permission
    retryable: false
    surface: [rest, ws] # same slug, same meaning on the WS (23-ws-protocol.md §10.2)
  - code: csrf_token_invalid
    status: 403
    title: CSRF token missing, not matching the __Host-cv_csrf cookie, or not bound to this session (SR-041)
    retryable: false
  - code: account_scope_denied
    status: 403
    title: Caller has no granted access to the targeted exchange account
    retryable: false
    surface: [rest, ws] # same slug, same meaning on the WS (23-ws-protocol.md §10.2)
  - code: kek_unavailable
    status: 403
    title: The credential key is unavailable; operations that need it are refused
    retryable: false
  - code: trading_disabled
    status: 403
    title: Order entry refused
    retryable: false
  - code: risk_limit_breached
    status: 403
    title: Per-account profile risk cap (daily loss, max position, allowed symbols) would be exceeded
    retryable: false
  - code: view_as_read_only
    status: 403
    title: Session is viewing as another user, read-only; end view-as to make changes
    retryable: false
    surface: [rest, ws] # same slug, same meaning on the WS (23-ws-protocol.md §10.2)
  - code: view_as_expired
    status: 403
    title: View-as context ended by the server; clear it with DELETE /auth/session/view-as
    retryable: false
  - code: view_as_self_target
    status: 403
    title: A session cannot view as its own user
    retryable: false
  - code: view_as_owner_target
    status: 403
    title: An Owner is never viewed as
    retryable: false
  # --- 404 / 409 / 410 / 412 / 422 ---------------------------------------
  - code: not_found
    status: 404
    title: Resource does not exist or is out of the caller's scope
    retryable: false
  - code: conflict
    status: 409
    title: Concurrent modification or state conflict
    retryable: false
  - code: view_as_active
    status: 409
    title: Session already holds a view-as context; end it with DELETE /auth/session/view-as
    retryable: false
  - code: idempotency_key_reuse
    status: 409
    title: Idempotency-Key reused with a different request payload
    retryable: false
  - code: idempotency_in_flight
    status: 409
    title: A request with this Idempotency-Key is still being processed
    retryable: true
  - code: open_exposure
    status: 409
    title: The account holds open positions, working orders or running algos that the request does not resolve; resend with an open_exposure choice
    retryable: false
  - code: exposure_unknown
    status: 409
    title: The account's open exposure cannot be read because none of its keys can be used to read it
    retryable: false
  - code: kek_rotation_not_staged
    status: 409
    title: No KEK rotation is staged as the request states (previous KEK not loaded, or another environment or version)
    retryable: false
  - code: kek_rotation_in_progress
    status: 409
    title: A KEK re-wrap run is already in progress for this environment
    retryable: true
  - code: version_conflict
    status: 412
    title: If-Match / ETag precondition failed
    retryable: false
  - code: payload_too_large
    status: 413
    title: Request body or batch exceeds the operation's size ceiling
    retryable: false
  - code: gone
    status: 410
    title: Resource existed but was purged by retention, or a one-time link that expired or was used
    retryable: false
  - code: order_not_amendable
    status: 422
    title: Order is in a terminal or transitional state and cannot be amended
    retryable: false
  - code: rule_ir_invalid
    status: 422
    title: Rule intermediate representation failed semantic validation
    retryable: false
  - code: insufficient_balance
    status: 422
    title: Exchange rejected the order for insufficient margin
    retryable: false
  - code: no_data_recorded
    status: 422
    title: Requested window predates the start of recording for this symbol
    retryable: false
    surface: [rest, ws] # same slug, same meaning on the WS (23-ws-protocol.md §10.2)
  - code: bar_window_too_large
    status: 422
    title: Bar window exceeds the hard cap (400 d time / 31 d or 250 000 bars non-time)
    retryable: false
  - code: response_too_large
    status: 422
    title: Bar page would exceed the response size ceiling; request a smaller `limit`
    retryable: false
  # --- 429 / 5xx ---------------------------------------------------------
  - code: rate_limited
    status: 429
    title: Per-user API rate limit exceeded
    retryable: true
  - code: exchange_rate_limited
    status: 429
    title: Bybit per-UID rate budget exhausted (10006/10018) — request shed locally
    retryable: true
  # --- 500 family ---------------------------------------------------------
  - code: internal_error
    status: 500
    title: "Unhandled server error (correlation id in `instance`)"
    retryable: true
    surface: [rest, ws] # same slug, same meaning on the WS (23-ws-protocol.md §10.2)
  - code: not_implemented
    status: 501
    title: Operation declared but its backing provider is not wired yet; nothing was done
    retryable: false
  - code: exchange_error
    status: 502
    title: Bybit returned a non-zero exchange refusal code
    retryable: true
  - code: exchange_unavailable
    status: 503
    title: Exchange connectivity lost (WS down and REST failing)
    retryable: true
    surface: [rest, ws] # same slug, same meaning on the WS (23-ws-protocol.md §10.2)
  - code: store_unavailable
    status: 503
    title: QuestDB / Postgres / Parquet tier unavailable
    retryable: true
  - code: audit_unavailable
    status: 503
    title: Write-ahead audit record could not be written (or no audit backend is wired); refused, fail closed (C-2.9)
    retryable: true
  - code: backup_engine_invalid
    status: 503
    title: The backup engine plans a run that is not encrypted; refused, fail closed, until its configuration is fixed
    retryable: false
  - code: degraded_data
    status: 503
    title: Local store is behind the exchange beyond the freshness SLO
    retryable: true
    surface: [rest, ws] # same slug, same meaning on the WS (23-ws-protocol.md §10.2)
  - code: auth_unavailable
    status: 503
    title: Second factor temporarily unavailable
    retryable: true
  - code: timeout
    status: 504
    title: Upstream exchange call exceeded the deadline
    retryable: true

# -----------------------------------------------------------------------------
# x-error-codes-ws — the WebSocket-only partition of the same canonical registry.
# These slugs never appear in an HTTP problem+json body (they describe frame/stream
# faults that have no REST analogue), but they live here so that ONE file defines every
# error slug the product can emit. 23-ws-protocol.md §10.2 is generated/asserted from
# the union of `x-error-codes` (entries with `ws` in `surface`) and this block.
# `close_code` is the RFC 6455 close code used when `close: true`.
# -----------------------------------------------------------------------------
x-error-codes-ws:
  - code: protocol_violation
    scope: connection
    retryable: false
    close_code: 1002
    title: Frame out of order or malformed envelope
  - code: frame_malformed
    scope: connection
    retryable: false
    close_code: 1002
    title: Binary body inconsistent with its header
  - code: unsupported_protocol
    scope: connection
    retryable: false
    close_code: 1002
    title: No mutually supported subprotocol offered
  - code: not_authenticated
    scope: connection
    retryable: false
    close_code: 4401
    title: Frame sent before auth_ok
    rest_analogue: unauthenticated
  - code: auth_failed
    scope: connection
    retryable: false
    close_code: 4401
    title: Token invalid or signature rejected
    rest_analogue: unauthenticated
  - code: auth_timeout
    scope: connection
    retryable: false
    close_code: 4401
    title: No auth frame within 10 s of open
  - code: token_expired
    scope: connection
    retryable: true
    close_code: 4401
    title: Access token expired; refresh over REST and re-auth
    rest_analogue: unauthenticated
  - code: unknown_topic
    scope: topic
    retryable: false
    title: Topic name not in the catalogue, or bars.* while the bars feature is off
    rest_analogue: not_found
  - code: invalid_topic_format
    scope: topic
    retryable: false
    title: Malformed topic string, or a bar spec the server cannot build or bound
    rest_analogue: validation_failed
  - code: unsupported_symbol
    scope: topic
    retryable: false
    title: Not a Bybit USDT linear perpetual, or unknown instrument
    rest_analogue: unsupported_category
  - code: invalid_options
    scope: topic
    retryable: false
    title: Subscription option out of range, of the wrong type, or an unknown key
    rest_analogue: validation_failed
  - code: encoding_unsupported
    scope: topic
    retryable: false
    title: Binary encoding requested on a structured-only topic
  - code: subscription_limit
    scope: topic
    retryable: true
    title: Subscription ceiling reached (200 subscriptions, 40 symbols or 16 bars.* per connection) or a bar spec cap
    rest_analogue: rate_limited
  - code: too_many_topics
    scope: request
    retryable: true
    title: More than 50 topics in one sub frame
    rest_analogue: rate_limited
  - code: duplicate_subscription
    scope: topic
    retryable: false
    title: Already subscribed; retune with ctl
    rest_analogue: conflict
  - code: not_subscribed
    scope: topic
    retryable: false
    title: ctl/resync on a topic with no subscription
    rest_analogue: not_found
  - code: resync_rate_limited
    scope: topic
    retryable: true
    title: Snapshot rebuild budget spent; request refused, and a resync loop revokes the subscription
    rest_analogue: rate_limited
  - code: client_rate_limited
    scope: connection
    retryable: true
    close_code: 4429
    title: Inbound frame rate or per-user connect rate exceeded
    rest_analogue: rate_limited
  - code: slow_consumer
    scope: connection
    retryable: true
    close_code: 4429
    title: Outbound queue overflow; connection closed
  - code: replay_session_not_found
    scope: topic
    retryable: false
    title: Unknown or destroyed replay_session_id
    rest_analogue: not_found
  - code: replay_session_ended
    scope: topic
    retryable: false
    title: Replay finished or was destroyed; subscription revoked
    rest_analogue: gone
  - code: user_disabled
    scope: connection
    retryable: false
    close_code: 4403
    title: Account disabled mid-session
    rest_analogue: forbidden

# -----------------------------------------------------------------------------
# x-contract-validation — the machine gates that protect this document.
# Referenced by 03-testing-strategy.md §5 (contract testing). Every gate below is a
# blocking CI check; a PR that touches this file, 21-database-schema.md or
# 23-ws-protocol.md runs all of them.
# -----------------------------------------------------------------------------
x-contract-validation:
  ci_job: contracts
  workflow: .github/workflows/contracts.yml
  blocking: true
  triggers:
    - docs/plan/22-api-openapi.yaml
    - docs/plan/23-ws-protocol.md
    - docs/plan/21-database-schema.md
    - backend/app/api/**
    - backend/app/ws/**
  gates:
    - id: openapi_structural
      tool: "redocly lint docs/plan/22-api-openapi.yaml --extends recommended"
      asserts: |
        Document is structurally valid OpenAPI 3.1.0. Ruleset additions on top of
        `recommended`: `operation-operationId` (error), `operation-summary` (error),
        `no-unresolved-refs` (error), `no-unused-components` (error),
        `operation-4xx-response` (error), `spec-strict-refs` (error).
      status: passing
    - id: openapi_jsonschema
      tool: "python -m openapi_spec_validator docs/plan/22-api-openapi.yaml"
      asserts: >
        Second, independent validator (different implementation from redocly) — catches
        JSON-Schema-2020-12 keyword misuse that a linter's own resolver may tolerate.
        Notably guards the YAML-1.1 `on:`/`off:`/`yes:`/`no:` boolean-coercion trap that
        silently turns a `required: [on]` entry into `required: [true]`.
      status: passing
    - id: ref_closure
      tool: tools/contracts/check_refs.py
      asserts: >
        Every `$ref` in the document resolves to an existing node; every component under
        components.{schemas,parameters,responses,headers,requestBodies} is referenced at
        least once (no orphans); no `$ref` crosses a file boundary.
      status: passing
    - id: rbac_coverage
      tool: tools/contracts/check_rbac.py
      asserts: >
        Every operation declares `x-rbac` with at least one permission code, and every
        code used appears in `x-permissions`. Every mutating order/position operation
        declares `x-idempotency: required`.
      status: passing
    - id: enum_parity_db
      tool: tools/contracts/check_enum_parity.py
      asserts: |
        For every schema carrying `x-db-enum: <pg_type>`, the schema's `enum` set minus its
        declared `x-db-enum-superset` equals the value set of that Postgres enum type as
        introspected from a migrated test database. Any enum that names a DB type and
        drifts — in either direction — fails the build. Documented supersets today:
        `SizingMode` (+pct_position, +profile) and `OffsetUnit` (+price); both are
        request-time sugar resolved before persistence.
      covers:
        - { schema: UserStatus, pg_type: user_status }
        - { schema: RoleName, pg_type: role_name }
        - { schema: MfaMethodKind, pg_type: mfa_method_kind }
        - { schema: ExchangeCode, pg_type: exchange_code }
        - { schema: Environment, pg_type: exchange_env }
        - { schema: AccountKind, pg_type: account_kind }
        - { schema: KeyStatus, pg_type: key_status }
        - { schema: SizingMode, pg_type: sizing_mode, superset: [pct_position, profile] }
        - { schema: OffsetUnit, pg_type: offset_unit, superset: [price] }
        - { schema: TradeGroupStatus, pg_type: trade_group_status }
        - { schema: LegStatus, pg_type: leg_status }
        - { schema: OrderIntent, pg_type: order_intent }
        - { schema: OrderState, pg_type: order_state }
        - { schema: OrderEventKind, pg_type: order_event_kind }
        - { schema: AlgoKind, pg_type: algo_kind }
        - { schema: RuleScope, pg_type: rule_scope }
        - { schema: RuleMode, pg_type: rule_mode }
        - { schema: RuleRunStatus, pg_type: rule_run_status }
        - { schema: AlertChannel, pg_type: alert_channel }
        - { schema: DeliveryStatus, pg_type: delivery_status }
        - { schema: RecordingState, pg_type: recording_state }
        - { schema: RecordReason, pg_type: record_reason }
        - { schema: StreamKind, pg_type: stream_kind }
        - { schema: RetentionAction, pg_type: retention_action }
        - { schema: ReplayState, pg_type: replay_state }
        - { schema: JournalSide, pg_type: journal_side }
        - { schema: FlagKind, pg_type: flag_kind }
        - { schema: AuditOutcome, pg_type: audit_outcome }
        - { schema: Severity, pg_type: severity }
        - { schema: BackupKind, pg_type: backup_kind }
        - { schema: BackupStatus, pg_type: backup_status }
      status: passing
    - id: error_registry_single_source
      tool: tools/contracts/check_error_registry.py
      asserts: |
        1. The code column of the §10.2 table in `23-ws-protocol.md` equals
           `{x-error-codes-ws[].code} ∪ {x-error-codes[] where "ws" in surface}` — exactly,
           no extras, no omissions.
        2. Every `rest_analogue` in `x-error-codes-ws` resolves to a code in `x-error-codes`.
        3. Every slug appearing in any example in either document is in the registry.
        4. The generated `error_codes.py` / `errorCodes.ts` enums are byte-identical to a
           fresh regeneration (regenerate-and-diff).
      status: passing
    - id: ws_message_schemas
      tool: "python tools/contracts/validate_ws_schemas.py --draft 2020-12"
      asserts: >
        Every fenced ```json schema block in 23-ws-protocol.md §13–§15 is itself a valid
        JSON Schema 2020-12 document (meta-schema validation), all internal `$ref`s
        resolve inside the bundled `ws-schemas.json`, and every example frame in §12
        validates against its declared schema.
      status: passing
    - id: schemathesis_fuzz
      tool: "schemathesis run --checks all http://api:8000/api/v1/openapi.json"
      asserts: >
        Every operation is exercised against a live instance; responses conform to the
        declared schemas and status codes; all error bodies validate against `Problem`.
      status: passing
    - id: runtime_spec_parity
      tool: tools/contracts/check_spec_drift.py
      asserts: >
        The spec FastAPI generates at runtime is semantically equal to this hand-authored
        document (path set, operationIds, request/response schema shapes). This file is the
        source of truth; the code must move to match it, not the reverse.
      status: passing

