                    results:
                      - {
                          exchange_account_id: "a1000000-0000-4000-8000-000000000001",
                          ok: true,
                          affected: 4,
                          error: null,
                        }
                      - {
                          exchange_account_id: "a1000000-0000-4000-8000-000000000002",
                          ok: false,
                          affected: 0,
                          error:
                            {
                              code: exchange_rate_limited,
                              message: "Bybit 10006 — per-UID budget exhausted, retry in 1200 ms",
                            },
