paths:
  # ===========================================================================
  # AUTH
  # ===========================================================================
  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Authenticate with username/email + password
      description: |
        Step 1 of login. If the user has a confirmed MFA method (`totp` or `webauthn`) the
        response is `200` with `status: mfa_required` and a short-lived (`5 min`) `mfa_token`;
        no session is created yet.

        If the user has `mfa_required` set and no confirmed MFA method (never enrolled, or after
        an owner TOTP reset or a recovery sign-in), the response is `200` with
        `status: authenticated` and the `cv_refresh` and `__Host-cv_csrf` cookies are set, but
        the session is **enrolment-only** (see "Enrolment-only session" above): it may only enrol
        and confirm a TOTP method, and it lives at most 15 minutes. Its `auth.session_created`
        audit record carries `enrolment_only: true`, so a sign-in on the password alone stands
        out in the audit log. For a user with `mfa_required` false and no confirmed method the
        login fails closed and mints no session (C-12.2 forbids such a user; see "Enrolment-only
        session").

        Failures are deliberately uniform (`unauthenticated`) whether the user is unknown,
        the password is wrong, or the account is disabled — no user enumeration.
        Five consecutive failures lock the account for 15 minutes (`user_status = locked`).
      security: []
      x-rbac: { permissions: [], scope: none }
      x-idempotency: ignored
      x-rate-limit: 10 requests / minute / source IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              owner:
                summary: Owner login
                value:
                  {
                    identifier: "basiltt",
                    password: "correct-horse-battery-staple",
                    device_name: "Electron shell — WIN-DESK",
                  }
      responses:
        "200":
          description: Authenticated, or an MFA challenge was issued.
          headers:
            Set-Cookie:
              description: "`cv_refresh` and `__Host-cv_csrf` (SR-041) cookies; present only when `status=authenticated`."
              schema: { type: string }
            Server-Timing:
              description: "#2097 (SR-011 measurement): `argon2;dur=<ms>`, the wall time of this login's one Argon2id verification in milliseconds with one decimal. Present only when `status=mfa_required` and `CV_AUTH_PERF_ENABLED` is on (keyless testnet, never live or demo). No refusal ever carries it, so it cannot tell an unknown user from a wrong password (SR-014)."
              schema: { type: string, pattern: "^argon2;dur=[0-9]+\\.[0-9]$" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              examples:
                mfaChallenge:
                  value:
                    status: mfa_required
                    mfa_token: "<opaque mfa token — example placeholder>"
                    methods: [totp, recovery_code]
                    expires_in: 300
                enrolmentOnly:
                  summary: No confirmed MFA method; the session is enrolment-only (15 min)
                  value:
                    status: authenticated
                    tokens:
                      access_token: "<JWT — example placeholder>"
                      token_type: Bearer
                      expires_in: 600
                      refresh_expires_in: 900
                    user:
                      {
                        id: "11111111-2222-3333-4444-555555555555",
                        username: "viewer.alice",
                        email: "alice@example.com",
                        roles: [viewer],
                        status: active,
                        mfa_enabled: false,
                        mfa_required: true,
                      }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: >
            A dependency is unavailable or data is degraded. This keeps every meaning of
            `ServiceUnavailable` (such as `store_unavailable`), whose examples apply unchanged. For
            a user with a confirmed MFA method it can also be `code: auth_unavailable` (see
            `AuthUnavailable`), answered only after the password verified, in place of the
            `mfa_required` challenge.
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                mfaUnavailable:
                  value:
                    {
                      type: "https://candleviewer.local/errors/auth_unavailable",
                      title: "Second factor temporarily unavailable",
                      status: 503,
                      detail: "Two-factor authentication is temporarily unavailable; try again later.",
                      instance: "urn:cv:req:0193f2bb-5031",
                      code: auth_unavailable,
                      retry_after_seconds: 30,
                    }

  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: authMfaVerify
      summary: Complete the MFA challenge and obtain tokens
      description: |
        Step 2 of login. Accepts a TOTP code, a WebAuthn assertion, or a single-use recovery
        code. Six failed attempts invalidate the `mfa_token`. Recovery-code use is written to
        the audit log with severity `warning` and raises an in-app alert.
      security: []
      x-rbac: { permissions: [], scope: none }
      x-idempotency: ignored
      x-rate-limit: 10 requests / minute / mfa_token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
            examples:
              totp:
                {
                  value:
                    {
                      mfa_token: "<opaque mfa token — example placeholder>",
                      method: totp,
                      code: "481920",
                    },
                }
      responses:
        "200":
          description: MFA accepted; session created.
          headers:
            Set-Cookie:
              {
                description: "`cv_refresh` cookie and a fresh `__Host-cv_csrf` cookie (SR-041)",
                schema: { type: string },
              }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /auth/mfa/enroll:
    post:
      tags: [auth]
      operationId: authMfaEnroll
      summary: Begin enrolment of a new MFA method for the current user
      description: |
        Returns a TOTP provisioning URI + QR payload, or a WebAuthn creation challenge.
        The method stays `pending` until confirmed via `POST /auth/mfa/enroll/confirm`, which
        is also where the recovery codes are issued; this response never carries them. Each
        call supersedes the user's earlier pending methods: they are revoked, so at most one
        method is pending and only the latest can be confirmed.

        Every role may enrol its own method: no permission is needed, and the route takes no
        target user (SR-026). An enrolment-only session may call it (see "Enrolment-only
        session") with `method: totp` only; any other method answers `422` and nothing changes.
        If the caller's user already has a confirmed MFA method the answer is `409 conflict` and
        nothing changes: voluntary re-enrolment is not specified yet. `Idempotency-Key` is
        ignored: the response carries the TOTP provisioning secret, which is never stored for a
        replay.
      x-rbac: { permissions: [], scope: self }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaEnrollRequest" }
      responses:
        "201":
          description: Enrolment started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResponse" }
              examples:
                totp:
                  value:
                    method_id: "5c3f9a10-6d21-4f0a-9a2f-70a1b2c3d4e5"
                    method: totp
                    otpauth_uri: "otpauth://totp/CandleViewer:basiltt?secret=JBSWY3DPEHPK3PXP&issuer=CandleViewer&algorithm=SHA1&digits=6&period=30"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /auth/mfa/enroll/confirm:
    post:
      tags: [auth]
      operationId: authMfaEnrollConfirm
      summary: Confirm a pending MFA enrolment and rotate to a full session
      description: |
        Activates the pending method once its code verifies. Only the user's pending method can
        be confirmed: the one their latest `POST /auth/mfa/enroll` created, never confirmed and
        not revoked. Any other `method_id`, such as a method that a recovery sign-in or an owner
        reset revoked, answers `422` and nothing changes. In the same step the server revokes
        every other TOTP method of the user and replaces the user's recovery codes with 10 new
        ones: the old method and the old codes stop working at the instant the new ones start
        (SR-022). It also revokes every other session of the user (revoke-all on a TOTP change,
        ADR-0010 decision 2), so no session minted on the password alone becomes a full one;
        their sockets close as for any revoked session (`23-ws-protocol.md` section 4.3). It then
        rotates the session (SR-013): the calling session, enrolment-only until now (see
        "Enrolment-only session"), is revoked, so its access and refresh tokens stop working at
        once, and a full session replaces it with the lifetimes of a `POST /auth/mfa/verify`
        sign-in. The `200` sets the rotated `cv_refresh` and `__Host-cv_csrf` cookies, bound to
        the new session (SR-041). It carries the new access token in `tokens` (the refresh token
        travels only in the cookie, so `refresh_token` is null), the user (`mfa_enabled` is now
        true), the activated method and the 10 recovery codes, which are shown exactly once.
        Audited (C-2.9): `auth.mfa_enrolled`, `auth.recovery_codes_regenerated`, one
        `auth.session_revoked` per revoked session, and the rotation as `auth.session_revoked`
        and `auth.session_created`.

        Every role may confirm its own enrolment: no permission is needed, and the route takes
        no target user (SR-026). If the caller's user already has a confirmed MFA method the
        answer is `409 conflict` and nothing changes. `Idempotency-Key` is ignored: the response
        holds tokens and recovery codes, which are never stored for a replay.
      x-rbac: { permissions: [], scope: self }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaEnrollConfirmRequest" }
      responses:
        "200":
          description: Method activated; the session was rotated to a full session.
          headers:
            Set-Cookie:
              {
                description: "Rotated `cv_refresh` cookie and a rotated `__Host-cv_csrf` cookie bound to the new session (SR-041)",
                schema: { type: string },
              }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollConfirmResponse" }
              examples:
                rotated:
                  value:
                    status: authenticated
                    tokens:
                      access_token: "<JWT — example placeholder>"
                      token_type: Bearer
                      expires_in: 600
                      refresh_expires_in: 2592000
                      refresh_token: null
                    user:
                      {
                        id: "11111111-2222-3333-4444-555555555555",
                        username: "viewer.alice",
                        email: "alice@example.com",
                        roles: [viewer],
                        status: active,
                        mfa_enabled: true,
                        mfa_required: true,
                      }
                    mfa_method:
                      {
                        id: "5c3f9a10-6d21-4f0a-9a2f-70a1b2c3d4e5",
                        kind: totp,
                        label: "Phone",
                        active: true,
                        created_at: "2026-10-15T20:01:12Z",
                        last_used_at: null,
                      }
                    recovery_codes:
                      [
                        "<recovery code 1 — example placeholder>",
                        "<recovery code 2 — example placeholder>",
                        "<recovery code 3 — example placeholder>",
                        "<recovery code 4 — example placeholder>",
                        "<recovery code 5 — example placeholder>",
                        "<recovery code 6 — example placeholder>",
                        "<recovery code 7 — example placeholder>",
                        "<recovery code 8 — example placeholder>",
                        "<recovery code 9 — example placeholder>",
                        "<recovery code 10 — example placeholder>",
                      ]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /auth/mfa/methods/{methodId}:
    parameters:
      - $ref: "#/components/parameters/MethodId"
    delete:
      tags: [auth]
      operationId: authMfaDeleteMethod
      summary: Remove an MFA method
      description: "Requires a fresh password re-authentication header `X-Reauth-Password`. The last remaining method cannot be removed while `mfa_required` is set on the user."
      x-rbac: { permissions: [settings:write], scope: self }
      x-idempotency: optional
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: X-Reauth-Password
          in: header
          required: true
          description: Current password, re-supplied to authorise the destructive change.
          schema: { type: string, format: password }
      responses:
        "204": { description: "Removed." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate the refresh token and mint a new access token
      description: |
        Reads the opaque refresh token from the `cv_refresh` cookie (browser/Electron) or from
        the JSON body (non-browser clients — kept so a future mobile client works unchanged,
        arch P1). Tokens are single-use: presenting a token that has already been rotated
        revokes the **entire session family** and returns `refresh_token_invalid` (reuse
        detection), logging a `critical` audit entry. A token whose session is idle-locked gets
        `401 session_idle_locked`: nothing is rotated or revoked, no `auth.session_refreshed`
        record is written, and the same token refreshes again after `POST /auth/unlock`.
        Refresh is not activity: the rotated session inherits `last_seen_at` as well as
        `expires_at`, so `session.idle_deadline` is unchanged (see "Idle lock"); only
        `POST /auth/session/extend` and `POST /auth/unlock` move it.
      security:
        - refreshCookie: []
        - {}
      x-rbac: { permissions: [], scope: none }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: >
            New token bundle issued. An enrolment-only session's successor keeps the session's
            absolute expiry, so refresh never extends it (see "Enrolment-only session").
          headers:
            Set-Cookie:
              {
                description: "Rotated `cv_refresh` cookie and a rotated `__Host-cv_csrf` cookie bound to the new session (SR-041)",
                schema: { type: string },
              }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke the current session (or all sessions)
      description: |
        Ends the calling session, or with `all_sessions: true` every session of the user. The
        session is identified as in "Idle lock" (access token, else the `cv_refresh` cookie), so
        the calling session can always be ended, locked or not, and after a reload too.

        Allowed while the session is idle-locked, for the calling session only (SCR-005
        "Sign out instead"). From a locked session, `all_sessions: true` answers
        `401 session_idle_locked` and revokes nothing: every session, the calling one included,
        stays as it was, no cookie is cleared, and no `auth.logout` or `auth.session_revoked`
        record is written. Signing the user out of every session needs an unlocked session and
        an access token. With only the cookie, `all_sessions: true` is refused and revokes
        nothing: `401 session_idle_locked` if the session is locked, otherwise
        `401 unauthenticated`.

        On `503` (the audit sink is not active or refused the record, or the session backend is
        not wired) nothing was revoked and no cookie was cleared (C-2.9): the sign-out is
        recorded before anything is revoked.
      security:
        - bearerAuth: []
        - refreshCookie: []
      x-rbac: { permissions: [], scope: self }
      x-idempotency: optional
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                all_sessions:
                  type: boolean
                  default: false
                  description: >
                    Revoke every session of the current user, not just this one. Refused from
                    an idle-locked session (`401 session_idle_locked`; nothing is revoked), and
                    when only the `cv_refresh` cookie identifies the session.
      responses:
        "204":
          description: "Session(s) revoked; `cv_refresh` cleared."
          headers:
            Set-Cookie:
              {
                description: "Expired `cv_refresh` and `__Host-cv_csrf` cookies",
                schema: { type: string },
              }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/session:
    get:
      tags: [auth]
      operationId: authGetSession
      summary: Introspect the current session
      description: |
        Returns the caller identity, effective permissions, granted account scope, kill-switch
        state, server time and the session's deadlines and lock state (`session`). The web app
        makes this bootstrap call on load. It is read-only introspection and never counts as
        activity: polling it never moves `session.idle_deadline`. While the session is
        idle-locked it still answers `200` with `session.locked: true` and
        `step_up_expires_at: null`, so the lock screen can read the session it unlocks, also
        after a reload: without an access token the `cv_refresh` cookie identifies the session
        (see "Idle lock"). Time the CMP-098 warning from `session.idle_deadline` and
        `server_time`, never from a client clock.
      security:
        - bearerAuth: []
        - refreshCookie: []
      x-rbac: { permissions: [], scope: self }
      responses:
        "200":
          description: >
            Current session. For an enrolment-only session (see "Enrolment-only session")
            `permissions`, `account_scope` and `allowed_environments` are empty and `kill_switch`
            is omitted: the session may use nothing they describe.
          headers:
            Set-Cookie:
              description: "`__Host-cv_csrf` re-issued for the current session when absent or not verifying (SR-041 recovery path); otherwise absent."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
              examples:
                manager:
                  value:
                    user:
                      {
                        id: "11111111-2222-3333-4444-555555555555",
                        username: "viewer.alice",
                        email: "alice@example.com",
                        roles: [manager],
                        status: active,
                        mfa_enabled: true,
                        mfa_required: true,
                      }
                    permissions:
                      [
                        accounts:read,
                        marketdata:read,
                        orders:write,
                        positions:write,
                        killswitch:write,
                      ]
                    account_scope: ["a1000000-0000-4000-8000-000000000002"]
                    kill_switch:
                      {
                        engaged: false,
                        scope: global,
                        engaged_at: null,
                        engaged_by: null,
                        reason: "null",
                      }
                    server_time: "2026-09-14T10:31:02.114Z"
                    clock_offset_ms: 4
                    api_version: "1.0.0"
                    session:
                      {
                        id: "5b1f0c3e-7d2a-4c11-9e8f-0a1b2c3d4e5f",
                        issued_at: "2026-09-14T10:24:00Z",
                        expires_at: "2026-09-14T20:05:00Z",
                        idle_deadline: "2026-09-14T10:46:02Z",
                        idle_timeout_s: 900,
                        locked: false,
                      }
                locked:
                  summary: Idle-locked session read by the lock screen (SCR-005); no elevation
                  value:
                    user:
                      id: "11111111-2222-3333-4444-555555555555"
                      username: "viewer.alice"
                      email: "alice@example.com"
                      roles: [manager]
                      status: active
                      mfa_enabled: true
                      mfa_required: true
                    permissions: [accounts:read, marketdata:read, orders:write, killswitch:write]
                    account_scope: ["a1000000-0000-4000-8000-000000000002"]
                    server_time: "2026-09-14T10:52:40.002Z"
                    step_up_expires_at: null
                    session:
                      id: "5b1f0c3e-7d2a-4c11-9e8f-0a1b2c3d4e5f"
                      issued_at: "2026-09-14T10:24:00Z"
                      expires_at: "2026-09-14T20:05:00Z"
                      idle_deadline: "2026-09-14T10:46:02Z"
                      idle_timeout_s: 900
                      locked: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/session/extend:
    post:
      tags: [auth]
      operationId: authExtendSession
      summary: Record activity and move the idle deadline (CMP-098 Extend)
      description: |
        The explicit activity call behind the CMP-098 "Extend" control; with a successful
        `POST /auth/unlock` it is the only operation that records activity (see "Idle lock").
        It re-stamps `last_seen_at` (`REQUEST` on B16) and returns the new
        `session.idle_deadline` with `server_time`. It never moves `expires_at` (the 12 h
        absolute lifetime). Once the session is idle-locked it is refused with
        `401 session_idle_locked`, so Extend can never lift a lock: only `POST /auth/unlock` does.
        Audited write-ahead as `auth.session_extended` (extend is not a token rotation, so it is
        not `auth.session_refreshed`); if the audit sink is down the answer is `503` and the
        deadline does not move.
      x-rbac: { permissions: [], scope: self }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Idle deadline moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionExtendResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/session/view-as:
    get:
      tags: [auth]
      operationId: getViewAs
      summary: Read the calling session's view-as context
      description: >
        Returns the calling session's view-as context, live or held, or `204` when it holds none
        (see "View-as session" in `info.description`). It reads only the caller's own session,
        as the viewer, so it needs no permission, and neither the read-only rule nor the hold
        refuses it. A context the server ended is returned with `state: expired` until
        `DELETE /auth/session/view-as` clears it. A window reads it when it opens, and again after a
        WebSocket `bye` with reason `view_as_changed` or `view_as_expired` (23-ws-protocol.md
        section 9.6), before it mounts any control: the banner, the countdown to `expires_at`
        and the read-only state come from the server, never from client state.
      x-rbac: { permissions: [], scope: self }
      responses:
        "200":
          description: The session's view-as context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewAsContext" }
              examples:
                live:
                  value:
                    target_user_id: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0002"
                    target_username: alex
                    target_display_name: "Alex M."
                    started_at: "2026-09-14T10:00:00Z"
                    expires_at: "2026-09-14T10:30:00Z"
                    read_only: true
                    state: active
                held:
                  summary: Ended by the server at expires_at; held until it is cleared
                  value:
                    target_user_id: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0002"
                    target_username: alex
                    target_display_name: null
                    started_at: "2026-09-14T10:00:00Z"
                    expires_at: "2026-09-14T10:30:00Z"
                    read_only: true
                    state: expired
        "204": { description: The session holds no view-as context. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [auth]
      operationId: endViewAs
      summary: End the calling session's view-as context
      description: >
        Ends the calling session's live view-as context, or clears a held one, and answers
        `204`. On a session that holds none it changes nothing and still answers `204`, so
        ending is idempotent (see "View-as session" in `info.description`). It acts only on the
        caller's own session, as the viewer: it needs no permission and no step-up, and neither
        the read-only rule nor the hold refuses it, so a viewer can always leave, even after the
        session lost `users:write` or its step-up grace lapsed.

        Each context gets exactly one `admin.view_as_ended` record, written when it ends:
        outcome `success`, severity `warning`, actor the viewer and the viewer's session, object
        `user` (the target), `before_state` `{target_user_id, started_at, expires_at}`,
        `after_state` `{ended_at}` (plus `recorded_late: true`, only when late), and reason
        `ended` (this operation), `expired` (at `expires_at`), `viewer_ineligible` (the session
        lost `users:write`), `target_ineligible` (the target became an Owner or was disabled) or
        `session_ended` (logout, or the revocation or expiry of the session). Leaving never fails
        on that record (see "Audit" in "View-as session"): the context ends even when the record
        cannot be written then, and the record follows late. A `503` means only that the session
        store could not be reached, and then nothing changed. Clearing a held context writes no
        record of its own, and neither does a call on a session that holds none.

        When a live context ends here, every socket authenticated on the session ends with
        `bye` `view_as_changed`, and reconnects into the viewer's own scope (23-ws-protocol.md
        section 9.6).
      x-rbac: { permissions: [], scope: self }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: "Ended, cleared, or nothing to end." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/unlock:
    post:
      tags: [auth]
      operationId: authUnlock
      summary: Lift the idle lock with the password only
      description: |
        Lifts the idle lock (SCR-005) with the **password only**. No TOTP is asked while the
        session is inside its 12 h absolute lifetime (US-ONB-004, E09-S03). On success
        `last_seen_at` is re-stamped (`UNLOCK_OK` on B16), `session.idle_deadline` moves forward,
        `session.locked` is `false`, and the body is the same `SessionInfo` as
        `GET /auth/session`.

        Unlock restores no step-up elevation ("Idle lock"; #2290 ruling, rule 4d): every
        pre-lock grant is cleared from the session row, the `200` has `step_up_expires_at: null`,
        and the next dangerous action answers `403 step_up_required` until a fresh step-up.

        The password is checked only while the session is idle-locked. A live session that is
        not locked gets `409 conflict`: no password is checked, no failure is counted, no
        activity is recorded and nothing is audited; the client re-reads `GET /auth/session`.
        Unlock is therefore never a password check on an unlocked session.

        An access token inside its lifetime identifies the session, else the `cv_refresh` cookie
        does ("Idle lock"). An expired access token is never accepted: after a long lock or a
        reload the client unlocks with the cookie, then calls `POST /auth/refresh`.

        * A wrong password is `401 unlock_invalid`, with the same generic `detail` every time.
        * The fifth consecutive wrong password (`MAX_UNLOCK_ATTEMPTS`) revokes the session:
          `401 session_revoked` with `revoked_reason: unlock_attempts_exceeded`, and its sockets
          get the revocation frame (#2272). Every later unlock is `401 session_revoked`.
          Failures are counted per session by the server process: a locked session cannot
          rotate, so refreshing cannot reset the count, but a server restart does. A failure
          counts even if its audit record cannot be written.
        * If the absolute lifetime elapsed while locked, the answer is `401 session_revoked`
          with `revoked_reason: expired`; the client falls back to a full sign-in (SCR-001).
        * An access token or cookie of a session that a refresh rotated away, or one this server
          never issued, gets the uniform `401 unauthenticated`, never `session_revoked`.

        If the audit sink is down the answer is `503` and no password is checked. Throttled like
        login, per source IP: a throttled attempt is `429` and checks no password. The password
        is verified on the same Argon2id path and lockout counters as login and `/auth/step-up`
        (SR-015, SR-016): a wrong unlock password counts toward the account lockout, and a locked
        account fails like a wrong password. Audited write-ahead: `auth.session_unlocked` on
        success and `auth.unlock_failed` on every wrong password; the revoking failure also
        writes `auth.session_revoked`, and the wrong password that locks the account (SR-016)
        writes `auth.account_locked`. The password is never logged, audited or echoed.
      security:
        - bearerAuth: []
        - refreshCookie: []
      x-rbac: { permissions: [], scope: self }
      x-idempotency: ignored
      x-rate-limit: 10 requests / minute / source IP
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlockRequest" }
      responses:
        "200":
          description: Unlocked; the session is active again, with no step-up elevation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
              examples:
                unlocked:
                  summary: Lock lifted; no step-up elevation from before the lock survives
                  value:
                    user:
                      id: "11111111-2222-3333-4444-555555555555"
                      username: "viewer.alice"
                      email: "alice@example.com"
                      roles: [manager]
                      status: active
                      mfa_enabled: true
                      mfa_required: true
                    permissions: [accounts:read, marketdata:read, orders:write, killswitch:write]
                    account_scope: ["a1000000-0000-4000-8000-000000000002"]
                    server_time: "2026-09-14T10:53:10.418Z"
                    step_up_expires_at: null
                    session:
                      id: "5b1f0c3e-7d2a-4c11-9e8f-0a1b2c3d4e5f"
                      issued_at: "2026-09-14T10:24:00Z"
                      expires_at: "2026-09-14T20:05:00Z"
                      idle_deadline: "2026-09-14T11:08:10Z"
                      idle_timeout_s: 900
                      locked: false
        "401":
          description: >
            `unlock_invalid` (wrong password); `session_revoked` (the session was revoked, by the
            fifth wrong password or otherwise, or is past its absolute lifetime: sign in again);
            or `unauthenticated` (no access token inside its lifetime and no current
            `cv_refresh` cookie, or a credential of a session that a refresh rotated away or
            that this server never issued).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                wrongPassword:
                  value:
                    {
                      type: "https://candleviewer.local/errors/unlock_invalid",
                      title: "Unlock password rejected",
                      status: 401,
                      detail: "The password is incorrect.",
                      instance: "urn:cv:req:0193f2bb-1113",
                      code: unlock_invalid,
                    }
                expired:
                  value:
                    {
                      type: "https://candleviewer.local/errors/session_revoked",
                      title: "Session revoked or past its absolute lifetime; sign in again",
                      status: 401,
                      detail: "Your session expired. Sign in again.",
                      instance: "urn:cv:req:0193f2bb-1114",
                      code: session_revoked,
                      revoked_reason: expired,
                    }
                noCredential:
                  summary: No live access token and no current `cv_refresh` cookie
                  value:
                    {
                      type: "https://candleviewer.local/errors/unauthenticated",
                      title: "Missing, malformed or expired access token",
                      status: 401,
                      detail: "Sign in to continue.",
                      instance: "urn:cv:req:0193f2bb-1116",
                      code: unauthenticated,
                    }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "409":
          description: >
            `conflict`: the session is live but not idle-locked. No password was checked and
            nothing changed or was audited; re-read `GET /auth/session`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                notLocked:
                  value:
                    {
                      type: "https://candleviewer.local/errors/conflict",
                      title: "Concurrent modification or state conflict",
                      status: 409,
                      detail: "The session is not locked.",
                      instance: "urn:cv:req:0193f2bb-1115",
                      code: conflict,
                    }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/sessions:
    get:
      tags: [auth]
      operationId: authListSessions
      summary: List active sessions for the current user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      x-rbac: { permissions: [], scope: self }
      responses:
        "200":
          description: Sessions page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/UserSession" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/password:
    put:
      tags: [auth]
      operationId: authChangePassword
      summary: Change the current user's password
      description: Revokes all other sessions on success. Argon2id, minimum 12 characters, checked against a local breached-password list.
      x-rbac: { permissions: [], scope: self }
      x-idempotency: optional
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: "Password changed." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/_perf/argon2-params:
    get:
      tags: [perf]
      operationId: authGetArgon2Params
      summary: Active Argon2id parameters (perf instrumentation, keyless testnet only)
      description: |
        #2097 (E09-Q05): the Argon2id parameters that new password hashes and rehash-on-login
        use, so the k6 auth profile can assert the SR-011 floor (`m` ≥ 65536 KiB, `t` ≥ 3,
        `p` ≥ 4). Mounted only while `CV_AUTH_PERF_ENABLED` is on; `Settings` refuses that switch
        unless `CV_ENVIRONMENT=testnet` with no exchange key configured, so live and demo never
        serve this route. Read-only, so it writes no audit record. The parameters are not
        secret: every stored hash embeds them.
      x-rbac: { permissions: [admin:read], scope: none }
      responses:
        "200":
          description: The active parameters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Argon2Params" }
              examples:
                default:
                  value: { m: 65536, t: 3, p: 4 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`CV_AUTH_PERF_ENABLED` is off (always so in live and demo): the route is not mounted."
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ===========================================================================
  # USERS & ROLES  (owner-gated admin screens inside the web app)
  # ===========================================================================
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/RoleName" }
        - name: q
          in: query
          description: Case-insensitive substring match on username or email.
          schema: { type: string, maxLength: 120 }
      x-rbac: { permissions: [users:read], scope: none }
      responses:
        "200":
          description: Users page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [users]
      operationId: createUser
      summary: Invite a user
      description: "Creates a user in `invited` state and returns a one-time invite link valid for 72 h. No password is set by the owner."
      x-rbac: { permissions: [users:write], scope: none }
      x-idempotency: recommended
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
            examples:
              viewer:
                value:
                  username: "viewer.alice"
                  email: "alice@example.com"
                  roles: [viewer]
                  mfa_required: true
                  account_access:
                    [{ exchange_account_id: "a1000000-0000-4000-8000-000000000002", level: trade }]
      responses:
        "201":
          description: User invited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithInvite" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /users/{userId}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      description: "`ETag` versions the whole representation, roles included; send it as `If-Match` on `PATCH`."
      x-rbac: { permissions: [users:read], scope: none }
      responses:
        "200":
          description: User.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user (status, roles, MFA requirement, display name)
      description: >
        Requires step-up `users`. A change to the caller's own roles or status is refused
        (`403 forbidden`), and the last active `owner` is protected (`409 conflict`). `status`
        moves only between `active` and `disabled`. Setting `disabled` runs the same cascade as
        `DELETE /users/{userId}`: within 5 seconds every session of the user is invalid (REST
        answers `401 unauthenticated`; sockets get `bye` with `user_disabled` and close `4403`,
        23-ws-protocol.md section 9.5), every account grant is soft-revoked, the user's rules
        are disarmed and an open invite is revoked. Positions and orders are never flattened or
        cancelled, and the change is audited as `users.disable` with `positions_decision: leave`;
        while the user's open-position state is unavailable a disable must carry
        `acknowledge_unknown_positions=true`, otherwise `409 positions_unknown`. Enabling never
        restores grants or sessions and cancels a pending purge. `mfa_required: false` is
        refused (`400 validation_failed`, C-12.2). A stale `If-Match` is
        `412 version_conflict`. Audited write-ahead; when the audit record cannot be written
        nothing changes (`503 audit_unavailable`). A call refused for a forbidden role or a
        self-target is audited too.
      x-rbac: { permissions: [users:write], scope: none }
      x-idempotency: optional
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AcknowledgeUnknownPositions"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Disable a user (soft delete)
      description: >
        Requires step-up `users`. Sets `status=disabled` and, within 5 seconds, every session of
        the user is invalid (REST answers `401 unauthenticated`; sockets get `bye` with
        `user_disabled` and close `4403`, 23-ws-protocol.md section 9.5). Every account grant
        is soft-revoked (freeze state and risk caps are kept), the user's rules are disarmed and
        an open invite is revoked. Rows are never hard-deleted — the audit log and journal
        reference them. Positions and orders are never flattened or cancelled: the audit record
        carries `positions_decision: leave` and the open-position count, and while that count
        is unavailable the request must carry `acknowledge_unknown_positions=true`, otherwise
        `409 positions_unknown`. The caller's own account is refused (`403 forbidden`) and so is
        the last active owner (`409 conflict`). Audited write-ahead as `users.disable` with one
        `auth.session_revoked` per session; when the audit record cannot be written nothing
        changes (`503 audit_unavailable`). Disabling a disabled user is a no-op `204` with no
        new audit record. A call refused for a forbidden role or a self-target is audited too.
        Passing `?purge=true` additionally anonymises PII after the 90-day retention window.
        A query parameter this operation does not declare is refused with
        `422 validation_failed`, never ignored, and nothing is read or changed.
        Without a live `users` step-up an authenticated caller first gets `403 step_up_required`,
        whatever their role and target; the refusals above and their audit records follow it.
      x-rbac: { permissions: [users:write], scope: none }
      x-idempotency: optional
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AcknowledgeUnknownPositions"
        - name: purge
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: "Disabled." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /users/{userId}/roles:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    put:
      tags: [users]
      operationId: setUserRoles
      summary: Replace a user's role set
      description: >
        Requires step-up `users`. The caller's own roles cannot be changed (`403 forbidden`),
        and the last active `owner` cannot be demoted (`409 conflict`, re-checked under a lock
        on the owner rows). Audited as `roles.grant` / `roles.revoke`; when the audit record
        cannot be written nothing changes (`503 audit_unavailable`). A call refused for a
        forbidden role or a self-target is audited too. Live sockets of the user are
        re-evaluated (23-ws-protocol.md section 9.5).
      x-rbac: { permissions: [users:write], scope: none }
      x-idempotency: optional
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/RoleName" }
      responses:
        "200":
          description: Roles replaced; the body carries only the user id and the new role set.
          content:
            application/json:
              schema:
                type: object
                required: [id, roles]
                properties:
                  id: { type: string, format: uuid }
                  roles: { type: array, items: { $ref: "#/components/schemas/RoleName" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /users/{userId}/account-access:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    get:
      tags: [users]
      operationId: listUserAccountAccess
      summary: List the exchange accounts a user may see/trade
      description: >
        A call refused for a forbidden role is audited (`rbac.denied`, naming the target user);
        when that record cannot be written the refusal is answered `503 audit_unavailable`, not
        `403`, and nothing is looked up. `503 store_unavailable` when the grants cannot be read.
        Both carry `Retry-After`.
      x-rbac: { permissions: [users:read], scope: none }
      responses:
        "200":
          description: Grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AccountAccessGrant" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [users]
      operationId: setUserAccountAccess
      summary: Replace a user's account-access grants
      description: >
        This is the isolation boundary between managers. Requires step-up `users`. Changes take
        effect on the next request. A removed account is soft-revoked, so its freeze state and
        risk caps survive a later re-grant. Within 2 seconds every live WS subscription that
        depended on a removed account ends with a `revoked` frame (`reason:
        account_scope_changed`, 23-ws-protocol.md section 9.5), and resubscribing is refused
        with `account_scope_denied`. Removing an account never flattens positions or cancels
        orders. While the user's open-position state is unavailable, every request that removes
        a live grant (omits an account the user holds today), not only the last one, must carry
        `acknowledge_unknown_positions=true`, otherwise `409 positions_unknown`. The caller's
        own grants cannot be changed (`403 forbidden`), and a user that is not `active` answers
        `409 conflict`. An `exchange_account_id` that does not exist is `404 not_found`.
        Audited write-ahead as `users.access_change`; when the audit record cannot be written
        nothing changes (`503 audit_unavailable`). A call refused for a forbidden role or a
        self-target is audited too.
      x-rbac: { permissions: [users:write], scope: none }
      x-idempotency: optional
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AcknowledgeUnknownPositions"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grants]
              properties:
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/AccountAccessGrantInput" }
            examples:
              twoAccounts:
                value:
                  grants:
                    - { exchange_account_id: "a1000000-0000-4000-8000-000000000002", level: trade }
                    - { exchange_account_id: "a1000000-0000-4000-8000-000000000003", level: read }
      responses:
        "200":
          description: Grants replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AccountAccessGrant" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /users/{userId}/sessions:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    get:
      tags: [users]
      operationId: listUserSessions
      summary: List a user's active sessions (the owner's view of `/me/sessions`)
      description: >
        Same items as `listMySessions`; no token material is ever returned. Read-only: unlike
        revoking a session, listing needs no step-up (04-security-program.md section 7.2.2,
        row 40a).
      x-rbac: { permissions: [users:read], scope: none }
      responses:
        "200":
          description: Active sessions of the user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UserSession" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /users/{userId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [users]
      operationId: revokeUserSession
      summary: Revoke one of a user's sessions
      description: >
        Requires step-up `users`. Only an active session of `userId` is addressable; an unknown
        or ended session, or another user's session, is `404 not_found`. Audited write-ahead as
        `auth.session_revoked`; when the audit record cannot be written nothing changes
        (`503 audit_unavailable`). A call refused for a forbidden role is audited too. Within
        5 seconds a REST call on the session answers `401 unauthenticated` and its sockets
        close `4401` (23-ws-protocol.md section 9.5).
      x-rbac: { permissions: [users:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /roles:
    get:
      tags: [users]
      operationId: listRoles
      summary: List roles and their permission codes
      x-rbac: { permissions: [users:read], scope: none }
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Role" } }
              examples:
                default:
                  value:
                    items:
                      - {
                          id: "c0000000-0000-4000-8000-000000000001",
                          name: owner,
                          description: "Full control incl. keys, users, flags, backups",
                          permissions: ["*"],
                          user_count: 1,
                        }
                      - {
                          id: "c0000000-0000-4000-8000-000000000002",
                          name: manager,
                          description: "Trades granted accounts",
                          permissions: [orders:write, positions:write, marketdata:read],
                          user_count: 2,
                        }
                      - {
                          id: "c0000000-0000-4000-8000-000000000003",
                          name: viewer,
                          description: "Read-only across permitted accounts",
                          permissions: [marketdata:read, orders:read],
                          user_count: 1,
                        }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /permissions:
    get:
      tags: [users]
      operationId: listPermissions
      summary: List every permission code the server recognises
      description: "Used by the admin UI to render the role matrix; the list is static per release and matches `x-permissions` in this document."
      x-rbac: { permissions: [users:read], scope: none }
      responses:
        "200":
          description: Permission catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, examples: [orders:write] }
                        description: { type: string }
                        category: { type: string, examples: [trading] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  # ===========================================================================
  # EXCHANGE ACCOUNTS, API KEYS, PER-ACCOUNT PROFILES
  # ===========================================================================
  /exchange-accounts:
    get:
      tags: [exchange-accounts]
      operationId: listExchangeAccounts
      summary: List exchange accounts visible to the caller
      description: |
        Owners see every account; managers and viewers see only accounts granted through
        `user_account_access`. Balances are served from the cached wallet snapshot maintained
        by the private-WS `wallet` stream; `balance_stale` is `true` when the snapshot is
        older than 10 s (`balance_stale_since` says since when). After 60 s of stream silence a
        REST reconciliation refreshes it; if that fails too, risk-based sizing is unavailable.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/EnvironmentQuery"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/AccountKind" }
        - name: include_balance
          in: query
          description: Include the cached wallet snapshot in each item.
          schema: { type: boolean, default: true }
      x-rbac: { permissions: [accounts:read], scope: granted_accounts }
      responses:
        "200":
          description: Accounts page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        { type: array, items: { $ref: "#/components/schemas/ExchangeAccount" } }
              examples:
                twoAccounts:
                  value:
                    items:
                      - id: "a1000000-0000-4000-8000-000000000001"
                        exchange: bybit
                        environment: live
                        kind: main
                        label: "Main — UTA"
                        exchange_uid: "10234567"
                        parent_account_id: null
                        connection_state: connected
                        key_status: active
                        position_mode: one_way
                        margin_mode: cross
                        active_profile_id: "b1000000-0000-4000-8000-0000000000a1"
                        balance:
                          coin: USDT
                          equity: "51234.9100"
                          wallet_balance: "50120.0000"
                          available_balance: "41000.2500"
                          unrealised_pnl: "1114.9100"
                          account_im_rate: "0.1821"
                          account_mm_rate: "0.0410"
                          updated_at: "2026-09-14T10:31:01.880Z"
                        balance_stale: false
                        health:
                          state: healthy
                          reason: ws_heartbeat
                          heartbeat_age_ms: 2140
                          rest_only: false
