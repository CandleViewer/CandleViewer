    IndicatorDescriptor:
      type: object
      required: [id, name, pane, compute, params_schema]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [trend, momentum, volatility, volume, orderflow] }
        pane: { type: string, enum: [price, sub, both] }
        compute:
          type: string
          enum: [client_worker, server]
          description: >
            `server` indicators are read from `orderflow_metrics` and require recorded
            history; `client_worker` indicators are computed from bars already in the client.
        estimated:
          type: boolean
          default: false
          description: True for heuristic signals that infer unobservable intent.
        params_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for this indicator's parameters; the settings form renders from it.
        defaults: { type: object, additionalProperties: true }

    LayoutPreset:
      type: object
      description: "Response object. Readers must ignore unknown properties (C-6.3); the embedded `layout` is a closed `LayoutInput`."
      required: [id, name, description, is_builtin, pane_count, layout]
      properties:
        id:
          { type: string, format: uuid, description: "Stable for the life of the catalogue entry." }
        name: { type: string }
        description: { type: ["string", "null"] }
        is_builtin:
          type: boolean
          description: "Always `true`: the catalogue is static. User-saved presets are layouts with a `hotkey_slot`."
        pane_count: { type: integer, minimum: 0, maximum: 16 }
        layout: { $ref: "#/components/schemas/LayoutInput" }

    WorkspaceBundle:
      type: object
      required: [schema_version, workspace, layouts]
      description: >
        Portable, credential-free export of presentation state only.
      properties:
        schema_version: { type: string }
        exported_at: { type: string, format: date-time }
        workspace: { $ref: "#/components/schemas/WorkspaceInput" }
        layouts: { type: array, items: { $ref: "#/components/schemas/LayoutInput" } }
        chart_templates: { type: array, items: { $ref: "#/components/schemas/ChartTemplateInput" } }
        drawings: { type: array, items: { $ref: "#/components/schemas/DrawingInput" } }
        indicator_presets:
          { type: array, items: { $ref: "#/components/schemas/IndicatorPresetInput" } }

    OrderDiagnostics:
      type: object
      required: [order, events]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        events: { type: array, items: { $ref: "#/components/schemas/OrderEvent" } }
        exchange_calls:
          type: array
          description: Request/response pairs with credentials, signatures and headers redacted.
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              endpoint: { type: string }
              http_status: { type: integer }
              ret_code: { type: ["integer", "null"] }
              ret_msg: { type: ["string", "null"] }
              latency_ms: { type: integer }
              request_redacted: { type: object, additionalProperties: true }
              response_redacted: { type: object, additionalProperties: true }
        reconciliation:
          type: object
          properties:
            last_checked_at: { type: ["string", "null"], format: date-time }
            verdict: { type: string, enum: [in_sync, drifted, repaired, unresolvable] }
            detail: { type: ["string", "null"] }

    TradeGroupPreview:
      type: object
      required: [legs, totals]
      description: >
        What `POST /trade-groups` would do, without doing it. Mirrors the resolved leg shape
        used in `TradeGroup.legs` so the ticket renders the preview and the result with one
        component.
      properties:
        legs:
          type: array
          items:
            type: object
            required: [exchange_account_id, would_submit]
            properties:
              exchange_account_id: { type: string, format: uuid }
              account_label: { type: string }
              account_profile_id: { type: ["string", "null"], format: uuid }
              would_submit: { type: boolean }
              resolved: { $ref: "#/components/schemas/ResolvedLegParams" }
              estimated_margin_usd: { $ref: "#/components/schemas/Decimal" }
              estimated_risk_usd: { $ref: "#/components/schemas/Decimal" }
              rejection:
                type: ["object", "null"]
                properties:
                  code:
                    type: string
                    enum:
                      [
                        cap_breached,
                        symbol_not_allowed,
                        insufficient_margin,
                        rate_budget_exhausted,
                        account_locked,
                        key_invalid,
                        leverage_unavailable,
                        kill_switch_engaged,
                      ]
                  message: { type: string }
        totals:
          type: object
          properties:
            accounts_targeted: { type: integer }
            accounts_submittable: { type: integer }
            total_qty: { $ref: "#/components/schemas/Decimal" }
            total_notional_usd: { $ref: "#/components/schemas/Decimal" }
            total_risk_usd: { $ref: "#/components/schemas/Decimal" }

    RiskSummary:
      type: object
      required: [scope, accounts]
      properties:
        scope: { type: string, enum: [global, accounts] }
        environment: { $ref: "#/components/schemas/Environment" }
        kill_switch: { $ref: "#/components/schemas/KillSwitch" }
        totals:
          type: object
          properties:
            equity_usd: { $ref: "#/components/schemas/Decimal" }
            unrealised_pnl_usd: { $ref: "#/components/schemas/Decimal" }
            realised_pnl_today_usd: { $ref: "#/components/schemas/Decimal" }
            open_positions: { type: integer }
            gross_notional_usd: { $ref: "#/components/schemas/Decimal" }
            positions_without_native_stop:
              type: integer
              description: >
                MUST be zero in steady state; any non-zero value is a violation of the
                native-stop safety invariant and is surfaced as a critical banner.
        accounts:
          type: array
          items:
            type: object
            properties:
              exchange_account_id: { type: string, format: uuid }
              label: { type: string }
              equity_usd: { $ref: "#/components/schemas/Decimal" }
              unrealised_pnl_usd: { $ref: "#/components/schemas/Decimal" }
              realised_pnl_today_usd: { $ref: "#/components/schemas/Decimal" }
              daily_loss_cap_usd: { $ref: "#/components/schemas/Decimal" }
              cap_utilisation_pct: { type: number, minimum: 0 }
              open_positions: { type: integer }
              frozen: { type: boolean }
              lockout:
                type: ["object", "null"]
                properties:
                  reason:
                    { type: string, enum: [daily_loss, consecutive_losses, max_positions, manual] }
                  since: { type: string, format: date-time }
                  until: { type: ["string", "null"], format: date-time }

    DetectorConfig:
      type: object
      description: >
        Thresholds for the estimated detectors. Every detector here is a heuristic over
        anonymous public data; changing a threshold changes sensitivity, never correctness.
      additionalProperties: false
      properties:
        iceberg:
          type: object
          properties:
            enabled: { type: boolean, default: true }
            min_reloads: { type: integer, minimum: 2, maximum: 50, default: 3 }
            price_tolerance_ticks: { type: integer, minimum: 0, maximum: 10, default: 0 }
            window_ms: { type: integer, minimum: 200, maximum: 60000, default: 5000 }
        stop_run:
          type: object
          properties:
            enabled: { type: boolean, default: true }
            lookback_bars: { type: integer, minimum: 2, maximum: 500, default: 20 }
            penetration_ticks: { type: integer, minimum: 1, maximum: 100, default: 2 }
            reversal_pct: { type: number, minimum: 0, maximum: 100, default: 60 }
        absorption:
          type: object
          properties:
            enabled: { type: boolean, default: true }
            min_volume_multiple: { type: number, minimum: 1, maximum: 50, default: 3 }
            max_price_move_ticks: { type: integer, minimum: 0, maximum: 50, default: 1 }
        exhaustion:
          type: object
          properties:
            enabled: { type: boolean, default: true }
            min_delta_divergence: { type: number, minimum: 0, default: 0.5 }
        big_trade:
          type: object
          properties:
            mode: { type: string, enum: [absolute_usd, percentile], default: percentile }
            absolute_usd: { $ref: "#/components/schemas/Decimal" }
            percentile: { type: number, minimum: 50, maximum: 99.99, default: 99 }

    DetectorMethodology:
      type: object
      required: [detector, inputs, assumption, false_positive_modes]
      properties:
        detector:
          { type: string, enum: [iceberg, stop_run, absorption, exhaustion, big_trade, regime] }
        display_name: { type: string }
        inputs: { type: array, items: { type: string } }
        assumption:
          type: string
          description: The inference being made, stated plainly.
        false_positive_modes: { type: array, items: { type: string } }
        confidence_basis: { type: ["string", "null"] }

    RegimeExplanation:
      type: object
      required: [symbol, regime, signals]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        regime:
          {
            type: string,
            enum: [trending_up, trending_down, ranging, volatile_expansion, compression],
          }
        confidence: { type: number, minimum: 0, maximum: 1 }
        as_of: { type: string, format: date-time }
        signals:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: number }
              weight: { type: number }
              contribution: { type: number }
              direction: { type: string, enum: [supports, opposes, neutral] }

    RuleVocabulary:
      type: object
      required: [signals, operators, actions, guards]
      description: >
        The closed vocabulary shared by the form editor, the node-graph editor and the rule
        engine. Anything absent from this response is not expressible in the IR.
      properties:
        ir_version: { type: string }
        signals:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id: { type: string }
              display_name: { type: string }
              type: { type: string, enum: [number, boolean, price, quantity, duration, enum] }
              unit: { type: ["string", "null"] }
              enum_values: { type: array, items: { type: string } }
              params_schema: { type: object, additionalProperties: true }
              requires_recording: { type: boolean, default: false }
              estimated: { type: boolean, default: false }
              description: { type: string }
              valid_range: { type: ["string", "null"] }
              warmup_bars: { type: integer }
              deterministic: { type: boolean }
              confidence: { type: string, enum: [exact, estimated] }
              dependencies: { type: array, items: { type: string } }
              when_unavailable: { type: string }
              available: { type: boolean, default: true }
              unavailable_reason: { type: string }
              missing_dependency: { type: object, additionalProperties: true }
              recorder_action: { type: object, additionalProperties: true }
        operators:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              arity: { type: integer, minimum: 1, maximum: 3 }
              operand_types: { type: array, items: { type: string } }
              result_type: { type: string }
        actions:
          type: array
          items:
            type: object
            required: [id, required_permissions]
            properties:
              id: { type: string }
              display_name: { type: string }
              params_schema: { type: object, additionalProperties: true }
              required_permissions: { type: array, items: { type: string } }
              requires_step_up: { type: boolean, default: false }
              idempotent: { type: boolean }
              guarded: { type: boolean }
              targets: { type: object, additionalProperties: { type: string } }
              available: { type: boolean, default: true }
              simulate_only: { type: boolean, default: false }
              restriction: { type: string }
              notes: { type: string }
              loosens_risk:
                type: boolean
                default: false
                description: >
                  Actions that can widen or remove a stop are flagged so the editors can
                  warn and the engine can gate them behind the owner-only permission.
        guards:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              params_schema: { type: object, additionalProperties: true }
        triggers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              description: { type: string }
              required_fields: { type: array, items: { type: string } }
        vocabulary_version: { type: integer }
        arm_live_permission: { type: string }

    JournalTradeContext:
      type: object
      required: [journal_trade_id, symbol, from, to, coverage]
      properties:
        journal_trade_id: { type: string, format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bars: { type: array, items: { $ref: "#/components/schemas/Bar" } }
        footprint: { type: array, items: { $ref: "#/components/schemas/FootprintBar" } }
        executions: { type: array, items: { $ref: "#/components/schemas/Execution" } }
        markers:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              kind:
                { type: string, enum: [entry, exit, stop_moved, scale_in, scale_out, rule_fired] }
              price: { $ref: "#/components/schemas/Decimal" }
              label: { type: string }
        coverage: { $ref: "#/components/schemas/DataCoverage" }

    BuildInfo:
      type: object
      required: [version, commit, built_at]
      properties:
        version: { type: string }
        commit: { type: string }
        built_at: { type: string, format: date-time }
        api_version: { type: string }
        ws_protocol_version: { type: string }
        electron_version: { type: ["string", "null"] }

    AdminSliceStatus:
      type: object
      description: >
        One admin read-model slice (E42-T01); servers always populate `status` and `generated_at`.
        `ok`: every field read. `error`: a source timed out (300 ms budget) or failed.
        `unavailable`: no provider wired yet. Unread fields are omitted, read ones still returned.
        `detail` is a non-empty fixed reason naming the source iff `status` is not `ok` (else
        `null` or omitted), never an exception message, connection string or key material.
      properties:
        status:
          type: string
          enum: [ok, error, unavailable]
          description: >
            **Open-ended for readers:** clients must tolerate values they do not know, so adding an
            outcome is an additive change (C-6.3).
        detail: { type: ["string", "null"], maxLength: 200 }
        generated_at:
          type: string
          format: date-time
          description: When the slice was read; at most 5 s older than the response (slice cache).

    AdminOverview:
      type: object
      description: >
        Partial-result roll-up (E42-T01): every slice carries `AdminSliceStatus`; `generated_at`
        is when it was assembled; `incidents_open` mirrors `incidents.open` (omitted if not `ok`).
      properties:
        generated_at: { type: string, format: date-time }
        users:
          type: object
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            total: { type: integer }
            active: { type: integer }
            without_mfa: { type: integer }
        accounts:
          type: object
          description: Counts are scoped to the serving environment (C-2.11), never demo and live together.
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            total: { type: integer }
            enabled: { type: integer }
            keys_expiring_30d: { type: integer }
            keys_invalid: { type: integer }
        recorder:
          type: object
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            symbols_recording: { type: integer }
            symbols_degraded: { type: integer }
            lag_seconds_p99: { type: number }
        storage:
          type: object
          description: "`days_until_full` is `0` when the disk has no headroom left; otherwise it is `null` unless growth is measured. The estimated fallback exists only in `CapacityReport.storage`."
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            used_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
            days_until_full: { type: ["number", "null"] }
        trading:
          type: object
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            live_enabled: { type: boolean }
            kill_switch_engaged: { type: boolean }
            open_positions: { type: integer }
        incidents_open: { type: integer }
        incidents:
          type: object
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            open: { type: integer }

    CapacityReport:
      type: object
      description: >
        Partial-result capacity read model (E42-T01): every section carries `AdminSliceStatus`,
        and `rate_budget_status` covers the `rate_budget` list. `generated_at` is when the
        response was assembled.
      properties:
        generated_at: { type: string, format: date-time }
        storage:
          type: object
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            used_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
            daily_growth_bytes: { type: integer, format: int64 }
            days_until_full: { type: ["number", "null"] }
            per_symbol:
              type: array
              items:
                type: object
                properties:
                  symbol: { $ref: "#/components/schemas/Symbol" }
                  used_bytes: { type: integer, format: int64 }
                  daily_growth_bytes: { type: integer, format: int64 }
                  pinned: { type: boolean }
                  retention_days: { type: ["integer", "null"] }
            projection_basis:
              type: string
              enum: [measured, estimated, nothing_recorded]
              description: >
                Source of `daily_growth_bytes`. `measured`: the recorder's DiskBudget fit.
                `estimated`: no measurement yet, so 0.75 GB/day per recorded symbol (7.5e8 bytes,
                upper bound of the 0.5-0.75 band at 200-depth); `estimated` is `true` (convention
                C10). `nothing_recorded`: no symbol recorded, so growth is `0` by fact and
                `days_until_full` is `null`, or `0` when the disk has no headroom left (as for
                every basis). **Open-ended for readers:** clients must tolerate
                values they do not know, so adding a basis is an additive change (C-6.3).
            estimated:
              type: boolean
              description: "`true` iff `projection_basis` is `estimated`; otherwise `false` or omitted."
        ingestion:
          type: object
          allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
          properties:
            messages_per_sec: { type: number }
            queue_depth: { type: integer }
            dropped_last_hour: { type: integer }
        rate_budget:
          type: array
          items:
            type: object
            properties:
              exchange_account_id: { type: string, format: uuid }
              label: { type: string }
              limit_per_minute: { type: integer }
              peak_used_per_minute: { type: integer }
              utilisation_pct: { type: number }
        rate_budget_status: { $ref: "#/components/schemas/AdminSliceStatus" }
        subaccounts: { $ref: "#/components/schemas/SubaccountCapacity" }

    SubaccountCapacity:
      type: object
      description: >
        Bybit sub-account capacity (US-ADMIN-014). The tier is a recorded fact (setting
        `accounts.subaccount_tier`, `21-database-schema.md` §3.9), never inferred from counts or
        `max_sub_accounts_hint`; `tier` and `cap` are `null` iff `tier_source` is `unrecorded`.
        If the tier read itself fails, the slice status is not `ok` and the four tier fields
        (`tier`, `cap`, `tier_source`, `recorded_at`) are omitted, never defaulted.
      allOf: [{ $ref: "#/components/schemas/AdminSliceStatus" }]
      properties:
        tier:
          type: ["string", "null"]
          enum: [regular, business_kyc, null]
          description: >
            **Open-ended for readers:** clients must tolerate values they do not know, so adding a
            tier is an additive change (C-6.3).
        cap:
          type: ["integer", "null"]
          description: 5 for `regular`, 20 for `business_kyc`, `null` while unrecorded.
        used:
          type: integer
          minimum: 0
          description: >
            Most non-deleted sub-accounts in the process environment (live in production; C-2.11)
            under any one main account (`exchange_accounts.kind = sub`): the cap binds exchange
            UIDs, per main. The process environment is `CV_ENV`, the process-scope key
            (`20-architecture.md` §7.2), not the per-session `/session/environment` switch.
        tier_source:
          type: string
          enum: [recorded, unrecorded]
          description: Deliberately closed; readers may rely on these two values.
        recorded_at:
          type: ["string", "null"]
          format: date-time
          description: When the tier was recorded (the setting's `updated_at`); `null` if never.

    Incident:
      type: object
      required: [id, component, severity, status, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        component: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { type: string, enum: [open, acknowledged, resolved] }
        title: { type: string, maxLength: 200 }
        detail: { type: ["string", "null"], maxLength: 2000 }
        occurrences: { type: integer, minimum: 1 }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        acknowledged_by: { type: ["string", "null"], format: uuid }
        resolved_at: { type: ["string", "null"], format: date-time }
        runbook_ref: { type: ["string", "null"] }
        acknowledged_at: { type: ["string", "null"], format: date-time }
        signature:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: >
            Stable grouping key (E42-T05): a hash of the component, the error class and the
            normalised message. Equal signatures in one component are the same fault.

    StatechartMachine:
      type: object
      description: >
        One live machine (E42-T07), read from its persisted quiescent snapshot and the
        `cv_machine_*` metric families, never from a live interpreter.
      required:
        [
          machine_key,
          machine_kind,
          environment,
          state,
          machine_hash,
          lock_matches,
          chain_trips,
          degraded,
          deferred_depth,
          updated_at,
        ]
      properties:
        machine_key: { type: string, description: "The `machineKey` of this machine." }
        machine_kind: { type: string, description: "Catalogue id (`28-statechart-catalogue.md`)." }
        environment: { $ref: "#/components/schemas/Environment" }
        state:
          type: string
          description: >
            The published state as on the `machines.{entity}.state` topic: the active direct
            child of the chart root (the first region's, for a parallel chart).
        machine_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The snapshot's chart hash (sha256 of the canonical chart JSON).
        lock_matches:
          type: boolean
          description: Whether `machine_hash` equals the committed `machine_hashes.lock` entry.
        chain_trips:
          type: integer
          minimum: 0
          description: The snapshot's `chain_trips` count; above 0 the machine is latched degraded.
        degraded: { type: boolean, description: "`chain_trips > 0`; cleared only by an operator." }
        deferred_depth:
          type: ["integer", "null"]
          minimum: 0
          description: >
            Deferred events held in the snapshot (`onUnhandled: defer`); `null` if it carries no
            deferred list.
        updated_at:
          { type: string, format: date-time, description: "When the snapshot was written." }
    StatechartMachineDetail:
      type: object
      description: >
        `getStatechart` (E42-T07). `snapshots` and `events` give each source's outcome; machine
        fields are present only when `snapshots.status` is `ok`.
      required: [snapshots]
      properties:
        snapshots: { $ref: "#/components/schemas/AdminSliceStatus" }
        events: { $ref: "#/components/schemas/AdminSliceStatus" }
        machine: { $ref: "#/components/schemas/StatechartMachine" }
        context_summary:
          type: object
          additionalProperties: { type: ["string", "number", "boolean", "null"] }
          description: Redacted scalar context; only the keys allowed for the kind.
        configuration:
          type: array
          items: { type: string }
          description: Every active state id, ancestors included, sorted.
        config:
          type: object
          additionalProperties: true
          description: The chart JSON registered for the kind (`statechart/machines/*.machine.json`).
        recent_events:
          type: array
          maxItems: 50
          description: The latest `machine_events` rows, newest first, without payloads.
          items:
            type: object
            required: [event_type, phase, occurred_at]
            properties:
              event_type: { type: string }
              phase: { type: string, enum: [ahead, commit, fault] }
              from_states: { type: array, items: { type: string } }
              to_states: { type: array, items: { type: string } }
              faulted: { type: boolean }
              occurred_at: { type: string, format: date-time }
    StatechartExport:
      type: object
      required: [machine_kind, machine_hash, stately]
      properties:
        machine_kind: { type: string }
        machine_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: sha256 of the registered chart's canonical JSON (`registry.machine_hash`).
        stately:
          type: object
          additionalProperties: true
          description: The chart without the six CV policy keys, importable into Stately Studio.
    StatechartKindSummary:
      type: object
      description: >
        Counters for one machine kind in one environment (E42-T07), with no entity id. Every live
        machine of the kind is counted, including the kinds without a public id (B8, B9, B13,
        B15) and the machines no row is shown for.
      required:
        [
          machine_kind,
          environment,
          machines,
          by_state,
          chain_trips,
          degraded_machines,
          dropped_receipts,
        ]
      properties:
        machine_kind: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        machines: { type: integer, minimum: 1 }
        by_state:
          type: object
          additionalProperties: { type: integer }
          description: Live machines per published `state`; a state with none is left out.
        chain_trips: { type: integer, minimum: 0, description: "Sum over the machines." }
        degraded_machines:
          { type: integer, minimum: 0, description: "Machines whose `chain_trips` latch is set." }
        dropped_receipts:
          type: ["integer", "null"]
          minimum: 0
          description: >
            `cv_machine_dropped_receipts_total` for the kind since process start (the library
            counts per interpreter and never persists it); `null` when the metric cannot be read.

    StartViewAsRequest:
      type: object
      additionalProperties: false
      required: [target_user_id, reason]
      properties:
        target_user_id: { type: string, format: uuid, description: "The `User.id` to view as." }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "[^\\s\\u00AD\\u034F\\u061C\\u115F\\u1160\\u17B4\\u17B5\\u180B-\\u180F\\u200B-\\u200F\\u2028-\\u202F\\u2060-\\u206F\\u2800\\u3164\\uFE00-\\uFE0F\\uFEFF\\uFFA0\\uFFF9-\\uFFFB]"
          description: >
            Why the viewer needs this view; mandatory (SCR-124). It is recorded in the
            `admin.view_as_started` record only: never shown to the target, never part of a
            step-up `action_summary` and never written to a log line.
    ViewAsContext:
      type: object
      description: A session's view-as context ("View-as session" in `info.description`).
      required:
        - target_user_id
        - target_username
        - target_display_name
        - started_at
        - expires_at
        - read_only
        - state
      properties:
        target_user_id: { type: string, format: uuid, description: "The target's `User.id`." }
        target_username:
          { type: string, maxLength: 40, description: "The target's `User.username`." }
        target_display_name:
          type: ["string", "null"]
          maxLength: 80
          description: "The target's `User.display_name`; the banner falls back to the username."
        started_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: "`started_at` plus 30 minutes, set by the server; nothing extends it."
        read_only:
          { type: boolean, const: true, description: "Always true: it never allows a change." }
        state:
          type: string
          enum: [active, expired]
          description: >
            `active`: the session views as the target. `expired`: the server ended the context
            (at `expires_at`, or because the viewer or the target stopped being eligible), and it
            is held until `DELETE /auth/session/view-as` clears it. Until then every operation
            but the viewer's own ones and the protective writes answers `403 view_as_expired`.

    SecuritySummary:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        keys:
          type: array
          items:
            type: object
            properties:
              exchange_account_id: { type: string, format: uuid }
              key_id_masked:
                type: string
                pattern: '^\.\.\.[A-Za-z0-9]{4}$'
                description: "At most the last 4 characters of the key id: `...` plus `key_id_last4` (SR-E27-03), as `ApiKey.key_id_masked`."
              status: { $ref: "#/components/schemas/KeyStatus" }
              age_days: { type: integer }
              expires_at: { type: ["string", "null"], format: date-time }
              withdrawal_permission_present:
                type: boolean
                description: MUST be false; true raises a critical finding immediately.
              ip_whitelist_matches_expected: { type: boolean }
              last_verified_at: { type: ["string", "null"], format: date-time }
        auth:
          type: object
          properties:
            users_without_mfa: { type: integer }
            failed_logins_24h: { type: integer }
            denied_requests_24h: { type: integer }
            active_elevated_sessions: { type: integer }
        audit:
          type: object
          properties:
            last_chain_verification_at: { type: ["string", "null"], format: date-time }
            chain_intact: { type: boolean }
            entries_total: { type: integer, format: int64 }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { $ref: "#/components/schemas/Severity" }
              code: { type: string }
              message: { type: string }
    KekRewrapRequest:
      type: object
      additionalProperties: false
      required: [environment, to_version]
      description: >
        `rewrapKek`: confirms the staged rotation boot and chooses nothing. Both members must
        equal what the process booted with, else `409 kek_rotation_not_staged`.
      properties:
        environment: { $ref: "#/components/schemas/Environment" }
        to_version:
          type: integer
          minimum: 2
          maximum: 2147483647
          description: >
            The environment's current KEK version; rows move from `to_version - 1`. The maximum
            is that of the `integer` column `kek_versions.version`.
    KekRewrapResult:
      type: object
      additionalProperties: false
      required:
        [
          run_id,
          environment,
          from_version,
          to_version,
          resumed,
          rewrapped,
          remaining,
          failed,
          complete,
        ]
      description: >
        `rewrapKek`: the counts of one run, never a key id or a key check value (KCV).
      properties:
        run_id:
          type: string
          format: uuid
          description: This run. Every audit record of the run carries it.
        environment: { $ref: "#/components/schemas/Environment" }
        from_version:
          type: integer
          minimum: 1
          maximum: 2147483646
          description: The previous KEK version, `to_version - 1`.
        to_version: { type: integer, minimum: 2, maximum: 2147483647 }
        resumed:
          type: boolean
          description: >
            True when this run opened with `security.kek_rotation_resumed`: an earlier run had
            already moved rows of this rotation and unrevoked API key rows were still left at
            `from_version`. False when it opened with `security.kek_rotation_started`: no earlier
            run had moved a row, or no row was left to move.
        rewrapped:
          type: integer
          minimum: 0
          description: API key rows this run moved to `to_version`.
        remaining:
          type: integer
          minimum: 0
          description: >
            Rows of the environment still at `from_version` after this run: unrevoked API key
            rows, failed rows included, plus auth keyring rows, which only the rotation boot
            moves.
        failed:
          type: integer
          minimum: 0
          description: >
            API key rows this run could not re-wrap. Each stays at `from_version` and is audited
            as `security.kek_rotation_failed`.
        complete:
          type: boolean
          description: >
            True when the run ended with `security.kek_rotated`: no unrevoked API key row and no
            auth keyring row is left at `from_version`, and no row failed. False when it ended
            with `security.kek_rotation_incomplete`.
