          in: query
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/OrderState" } }
        - name: intent
          in: query
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/OrderIntent" } }
        - name: trade_group_id
          in: query
          schema: { type: string, format: uuid }
        - name: open_only
          in: query
          description: Shorthand for the non-terminal state set.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      x-rbac: { permissions: [orders:read], scope: granted_accounts }
      responses:
        "200":
          description: Orders page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Order" } }
              examples:
                openLimit:
                  value:
                    items:
                      - id: "0a000000-0000-4000-8000-000000000001"
                        exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                        trade_group_id: "0c000000-0000-4000-8000-000000000001"
                        trade_group_leg_id: "0b000000-0000-4000-8000-000000000001"
                        order_link_id: "cv-0c000000-1-entry"
                        exchange_order_id: "8a1f0f9c-3d2e-4b11-9f77-1b2c3d4e5f60"
                        symbol: BTCUSDT
                        side: buy
                        order_type: limit
                        intent: entry
                        state: partially_filled
                        qty: "0.500"
                        filled_qty: "0.200"
                        remaining_qty: "0.300"
                        price: "63100.00"
                        avg_fill_price: "63099.80"
                        time_in_force: GTC
                        reduce_only: false
                        close_on_trigger: false
                        position_idx: 0
                        trigger_price: null
                        trigger_by: null
                        trigger_direction: null
                        take_profit: "63600.00"
                        stop_loss: "62900.00"
                        tpsl_mode: Full
                        algo: { kind: none }
                        created_at: "2026-09-14T10:29:44Z"
                        updated_at: "2026-09-14T10:30:11Z"
                        rejected_reason: null
                        environment: live
                    meta: { next_cursor: null, has_more: false, count: 1 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [trading]
      operationId: placeOrder
      summary: Place an order on a single account
      description: |
        Single-account convenience wrapper over the trade-group machinery: the server creates a
        one-leg trade group internally so that every order — single or fanned-out — shares one
        state machine, one audit trail and one journal linkage.

        **Invariants enforced server-side:**
        * The account's active profile must allow the symbol, otherwise `risk_limit_breached`.
        * Price is snapped/validated against `tick_size`; qty against `qty_step`/min/max
          (`tick_size_violation` / `lot_size_violation`).
        * A native exchange-side stop-loss is mandatory for entry intents
          (`require_native_stop`, arch P4). If the request omits `stop_loss`, the account
          profile's SL offset is applied; if the profile has none either, the request is
          rejected with `validation_failed` / `native_stop_required`.
        * `Idempotency-Key` is REQUIRED. The server derives a deterministic `orderLinkId`
          (≤36 chars) from it, so a retried request can never double-submit.
        * The kill-switch, if engaged for the account or globally, rejects with
          `trading_disabled` before anything reaches the exchange.

        The response is an **acknowledgement of acceptance into the OMS**, not a fill. Terminal
        state arrives on the WS `orders` / `executions` topics.
      x-rbac: { permissions: [orders:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
            examples:
              marketWithBracket:
                summary: Market buy with bracket, risk-based size from the profile
                value:
                  exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                  symbol: BTCUSDT
                  side: buy
                  order_type: market
                  sizing: { mode: profile }
                  stop_loss: { unit: ticks, value: "200" }
                  take_profit: { unit: r_multiple, value: "2" }
                  tpsl_mode: Full
                  arm_token: "<opaque arm token — example placeholder>"
              postOnlyLimit:
                summary: Post-only limit sell, explicit quantity
                value:
                  exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                  symbol: BTCUSDT
                  side: sell
                  order_type: limit
                  price: "63500.00"
                  sizing: { mode: fixed_qty, qty: "0.250" }
                  time_in_force: PostOnly
                  stop_loss: { unit: ticks, value: "300" }
              conditional:
                summary: Conditional stop-market entry above the range high
                value:
                  exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                  symbol: BTCUSDT
                  side: buy
                  order_type: market
                  sizing: { mode: fixed_notional, notional_usd: "25000" }
                  trigger: { price: "63400.00", trigger_by: LastPrice, direction: rise }
                  stop_loss: { unit: atr, value: "1.5", atr_period: 14 }
      responses:
        "202":
          description: Accepted into the OMS; submission to the exchange is in flight.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /orders/{orderId}:
    parameters: [{ $ref: "#/components/parameters/OrderId" }]
    get:
      tags: [trading]
      operationId: getOrder
      summary: Get one order with its event timeline
      x-rbac: { permissions: [orders:read], scope: granted_accounts }
