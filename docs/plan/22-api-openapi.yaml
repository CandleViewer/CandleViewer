    BackupId:
      name: backupId
      in: path
      required: true
      schema: { type: string, format: uuid }

  # ---------------------------------------------------------------------------
  headers:
    RateLimitLimit:
      description: Requests permitted in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    RetryAfter:
      description: Seconds the client should wait before retrying.
      schema: { type: integer }
    ETag:
      description: "Opaque version of the returned representation, for `If-Match`."
      schema: { type: string }
    IdempotencyReplayed:
      description: True when the response was replayed from the idempotency store.
      schema: { type: boolean }

  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            validation:
              value:
                type: "https://candleviewer.local/errors/validation_failed"
                title: "Request body or parameters failed schema validation"
                status: 400
                detail: "2 fields failed validation."
                instance: "urn:cv:req:0193f2bb-9c11-7a3d-88f1-0d2e3f4a5b6c"
                code: validation_failed
                errors:
                  - {
                      field: price,
                      rule: tick_size,
                      message: "63100.05 is not a multiple of tick size 0.10",
                    }
                  - {
                      field: qty,
                      rule: min_order_qty,
                      message: "0.0005 is below min_order_qty 0.001",
                    }
    Unauthorized:
      description: "Not authenticated. `code: session_idle_locked` (with `idle_locked_at`) means the session is valid but idle-locked: unlock it with `POST /auth/unlock` instead of signing in again."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            expired:
              value:
                {
                  type: "https://candleviewer.local/errors/unauthenticated",
                  title: "Missing, malformed or expired access token",
                  status: 401,
                  detail: "Access token expired at 2026-09-14T10:21:00Z.",
                  instance: "urn:cv:req:0193f2bb-1111",
                  code: unauthenticated,
                }
            idleLocked:
              summary: Any authenticated operation on an idle-locked session (#2300)
              value:
                {
                  type: "https://candleviewer.local/errors/session_idle_locked",
                  title: "Session is idle-locked; unlock it with the password (POST /auth/unlock)",
                  status: 401,
                  detail: "Unlock with your password to continue.",
                  instance: "urn:cv:req:0193f2bb-1112",
                  code: session_idle_locked,
                  idle_locked_at: "2026-09-14T10:46:02Z",
                }
    Forbidden:
      description: "Authenticated but not permitted. On state-changing operations this status may also carry `code: csrf_token_invalid` (SR-041; see `CsrfTokenInvalid`). An enrolment-only session gets `code: mfa_enrollment_required` from every operation outside its allow-list (see the Enrolment-only session section of `info.description`). A session that holds a view-as context gets `code: view_as_read_only` from every state-changing operation outside the viewer's own ones, and `code: view_as_expired` from every operation outside them once the server has ended the context (see the View-as session section of `info.description`). Both honour the C-2.6 carve-out below: while viewing, the writes it names and engaging the kill switch on an account set are not refused (see the View-as session section), and leaving view-as is one call that nothing refuses. `detail` never echoes token or cookie values. On a dangerous operation it may carry `code: step_up_required`: that body is a step-up challenge for the refused request (`challenge_id`, `challenge_expires_at`, `action_class`, `action_summary`, `target`; see `POST /auth/step-up`, #2304). On an order submit or amend it may also be the order-entry gate's refusal: `code: trading_disabled` with a `reason` member (`TradingDisabledProblem`, #837 Q5). `reason` appears on gate refusals only: the B18 kill switch (FREEZE) and the live-not-enabled refusal are separate synchronous checks ahead of the gate, and they return `trading_disabled` without a `reason`. Like the gate, they run after authentication, RBAC and account-scope resolution, and the C-2.6 carve-out binds every synchronous refusal, not just the gate: attaching a missing native SL, tightening a stop or re-arming a protective trigger is never refused. `createApiKey` and `testApiKey` answer `code: kek_unavailable` while the credential key (KEK) is unavailable (ADR-0009 Amendment 1)."
      content:
        application/problem+json:
          schema:
            anyOf:
              - { $ref: "#/components/schemas/Problem" }
              - { $ref: "#/components/schemas/TradingDisabledProblem" }
          examples:
            missingPermission:
              value:
                {
                  type: "https://candleviewer.local/errors/forbidden",
                  title: "Authenticated but lacking the required permission",
                  status: 403,
                  detail: "Requires permission 'keys:manage'.",
                  instance: "urn:cv:req:0193f2bb-2222",
                  code: forbidden,
                  required_permissions: [keys:manage],
                }
            csrfTokenInvalid:
              summary: SR-041 refusal on a state-changing operation
              value:
                {
                  type: "https://candleviewer.local/errors/csrf_token_invalid",
                  title: "CSRF token missing, not matching the __Host-cv_csrf cookie, or not bound to this session",
                  status: 403,
                  detail: "X-CSRF-Token header is missing.",
                  instance: "urn:cv:req:0193f2bb-2223",
                  code: csrf_token_invalid,
                }
            kekUnavailable:
              summary: A key operation while the credential key (KEK) is unavailable (ADR-0009 Amendment 1)
              value:
                {
                  type: "https://candleviewer.local/errors/kek_unavailable",
                  title: "The credential key is unavailable; operations that need it are refused",
                  status: 403,
                  detail: "The credential key is unavailable, so keys cannot be added, tested or rotated until the app restarts with it.",
                  instance: "urn:cv:req:0193f2bb-2229",
                  code: kek_unavailable,
                }
            mfaEnrollmentRequired:
              summary: Enrolment-only session calling an operation outside its allow-list
              value:
                {
                  type: "https://candleviewer.local/errors/mfa_enrollment_required",
                  title: "Session is enrolment-only; enrol and confirm a TOTP method first",
                  status: 403,
                  detail: "Set up two-factor authentication to continue.",
                  instance: "urn:cv:req:0193f2bb-2226",
                  code: mfa_enrollment_required,
                }
            viewAsReadOnly:
              summary: A state-changing request from a session that views as another user (#3085)
              value:
                {
                  type: "https://candleviewer.local/errors/view_as_read_only",
                  title: "Session is viewing as another user, read-only; end view-as to make changes",
                  status: 403,
                  detail: "You are viewing as alex. End view-as to make changes.",
                  instance: "urn:cv:req:0193f2bb-2227",
                  code: view_as_read_only,
                }
            viewAsExpired:
              summary: Any request but the viewer's own ones after the server ended the context (#3085)
              value:
                {
                  type: "https://candleviewer.local/errors/view_as_expired",
                  title: "View-as context ended by the server; clear it with DELETE /auth/session/view-as",
                  status: 403,
                  detail: "Viewing as alex ended at 2026-09-14T10:30:00Z.",
                  instance: "urn:cv:req:0193f2bb-2228",
                  code: view_as_expired,
                }
            stepUpRequired:
              summary: Dangerous action without a live elevation; the body is a step-up challenge (#2304)
              value:
                {
                  type: "https://candleviewer.local/errors/step_up_required",
                  title: "A dangerous action needs a live step-up elevation for its action class",
                  status: 403,
                  detail: "Re-enter your password and authenticator code (POST /auth/step-up) to continue.",
                  instance: "urn:cv:req:0193f2bb-2224",
                  code: step_up_required,
                  action_class: killswitch,
                  challenge_id: "6f1d2c3b-4a5e-4f60-8a7b-9c0d1e2f3a4b",
                  challenge_expires_at: "2026-09-14T10:36:02Z",
                  action_summary: "Release kill switch, scope global",
                  target: null,
                }
            stepUpRequiredTypedConfirmation:
              summary: A step-up challenge whose action asks for a typed confirmation of its target (#2304)
              value:
                {
                  type: "https://candleviewer.local/errors/step_up_required",
                  title: "A dangerous action needs a live step-up elevation for its action class",
                  status: 403,
                  detail: "Re-enter your password and authenticator code (POST /auth/step-up) to continue.",
                  instance: "urn:cv:req:0193f2bb-2225",
                  code: step_up_required,
                  action_class: keys,
                  challenge_id: "0c9b8a7d-6e5f-4a3b-9c2d-1e0f9a8b7c6d",
                  challenge_expires_at: "2026-09-14T10:36:02Z",
                  action_summary: "Rotate API key for account 'sub_002' (live, UID 1001234)",
                  target: sub_002,
                }
            tradingDisabled:
              summary: The order-entry gate refused an order submit (maintenance mode is on)
              value:
                {
                  type: "https://candleviewer.local/errors/trading_disabled",
                  title: "Order entry refused",
                  status: 403,
                  detail: "Order entry is paused.",
                  code: trading_disabled,
                  reason: maintenance,
                }
    CsrfTokenInvalid:
      description: "SR-041: `X-CSRF-Token` missing, not equal to the `__Host-cv_csrf` cookie, or not bound to the current session. Audited (`auth.csrf_refused`) up to a per-session / per-source budget; beyond it the response is identical but carries `Retry-After` and writes no audit record. `detail` never echoes token or cookie values; clients re-read the cookie and retry once. An enrolment-only session gets this status with `code: mfa_enrollment_required` instead, from every operation outside its allow-list (see `Forbidden` and the Enrolment-only session section of `info.description`); that refusal is not retryable."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missing:
              value:
                {
                  type: "https://candleviewer.local/errors/csrf_token_invalid",
                  title: "CSRF token missing, not matching the __Host-cv_csrf cookie, or not bound to this session",
                  status: 403,
                  detail: "X-CSRF-Token header is missing.",
                  instance: "urn:cv:req:0193f2bb-2223",
                  code: csrf_token_invalid,
                }
    AccountScopeDenied:
      description: "The targeted exchange account is outside the caller's granted scope. An enrolment-only session gets this status with `code: mfa_enrollment_required` instead (see `Forbidden`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            denied:
              value:
                {
                  type: "https://candleviewer.local/errors/account_scope_denied",
                  title: "Caller has no granted access to the targeted exchange account",
                  status: 403,
                  detail: "Account a1000000-0000-4000-8000-000000000009 is not in your scope.",
                  instance: "urn:cv:req:0193f2bb-3333",
                  code: account_scope_denied,
                }
    NotFound:
      description: Resource not found (or hidden by scope).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missing:
              value:
                {
                  type: "https://candleviewer.local/errors/not_found",
                  title: "Resource does not exist or is out of the caller's scope",
                  status: 404,
                  detail: "No order with id 0a000000-0000-4000-8000-0000000000ff.",
                  instance: "urn:cv:req:0193f2bb-4444",
                  code: not_found,
                }
    Conflict:
      description: State conflict.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            idempotency:
              value:
                {
                  type: "https://candleviewer.local/errors/idempotency_key_reuse",
                  title: "Idempotency-Key reused with a different request payload",
                  status: 409,
                  detail: "Key 4d9f… was first used with a different body fingerprint.",
                  instance: "urn:cv:req:0193f2bb-5555",
                  code: idempotency_key_reuse,
                }
    OpenExposureConflict:
      description: >
        State conflict (`conflict`, `idempotency_key_reuse`), or one of the two exposure
        refusals of SR-E27-07, so the revoke, disable or delete was not carried out.
        `open_exposure`: the account holds open positions, working orders or running emulated
        algos that the request does not resolve, or the request asks for `leave_positions` while
        a position has no native stop-loss; it always carries `consequences`, the summary the
        caller shows before it resends with an `open_exposure` choice. `exposure_unknown`: the
        exposure cannot be read because the exchange refuses every signable key of the account,
        or the account has none (`components.parameters.OpenExposure`); it always carries
        `remedy` and no `consequences`.
        `deleteExchangeAccount` answers it whatever the request carries.
        `updateExchangeAccount` (disable) and `revokeApiKey` answer it when the request carries
        `flatten_first` or no choice, and for `leave_positions` too while a key can still be
        fixed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/OpenExposureProblem" }
          examples:
            openExposure:
              summary: deleteExchangeAccount, updateExchangeAccount and revokeApiKey - exposure the request does not resolve
              value:
                type: "https://candleviewer.local/errors/open_exposure"
                title: "The account holds open positions, working orders or running algos that the request does not resolve; resend with an open_exposure choice"
                status: 409
                detail: "1 open position, 2 working orders and 1 running algo; resend with an open_exposure choice."
                instance: "urn:cv:req:0193f2bb-5656"
                code: open_exposure
                consequences:
                  exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                  open_positions:
                    - id: "e1000000-0000-4000-8000-000000000001"
                      exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                      symbol: BTCUSDT
                      side: long
                      size: "0.250"
                      stop_loss: "61200.0"
                      native_stop_present: true
                  working_orders: 2
                  running_algos: 1
                  assigned_users:
                    - {
                        user_id: "f1000000-0000-4000-8000-000000000002",
                        username: alice,
                        level: trade,
                      }
                  armed_rules:
                    - { rule_id: "91000000-0000-4000-8000-000000000003", name: "BTC breakout long" }
            leavePositionsRefused:
              summary: updateExchangeAccount and revokeApiKey - leave_positions refused, a position has no native stop-loss
              value:
                type: "https://candleviewer.local/errors/open_exposure"
                title: "The account holds open positions, working orders or running algos that the request does not resolve; resend with an open_exposure choice"
                status: 409
                detail: "1 open position has no native stop-loss, so open_exposure=leave_positions is refused; resend with open_exposure=flatten_first."
                instance: "urn:cv:req:0193f2bb-5757"
                code: open_exposure
                consequences:
                  exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                  open_positions:
                    - id: "e1000000-0000-4000-8000-000000000001"
                      exchange_account_id: "a1000000-0000-4000-8000-000000000001"
                      symbol: BTCUSDT
                      side: long
                      size: "0.250"
                      stop_loss: null
                      native_stop_present: false
                  working_orders: 0
                  running_algos: 1
                  assigned_users:
                    - {
                        user_id: "f1000000-0000-4000-8000-000000000002",
                        username: alice,
                        level: trade,
                      }
                  armed_rules:
                    - { rule_id: "91000000-0000-4000-8000-000000000003", name: "BTC breakout long" }
            exposureUnknownDead:
              summary: deleteExchangeAccount, updateExchangeAccount and revokeApiKey - no signable key can read the exposure, remedy leave_positions
              value:
                type: "https://candleviewer.local/errors/exposure_unknown"
                title: "The account's open exposure cannot be read because none of its keys can be used to read it"
                status: 409
                detail: "The account has no signable key, so its positions and orders cannot be read or flattened."
                instance: "urn:cv:req:0193f2bb-5858"
                code: exposure_unknown
                remedy: leave_positions
            exposureUnknownFixable:
              summary: deleteExchangeAccount, updateExchangeAccount and revokeApiKey - the exchange refuses a key that can be put right, remedy fix_key
              value:
                type: "https://candleviewer.local/errors/exposure_unknown"
                title: "The account's open exposure cannot be read because none of its keys can be used to read it"
                status: 409
                detail: "The exchange refuses the key of this account, so its positions and orders cannot be read or flattened until the key is put right."
                instance: "urn:cv:req:0193f2bb-5959"
                code: exposure_unknown
                remedy: fix_key
    KeyRejected:
      description: >
        The verification pipeline refused the key, so nothing was stored (`validation_failed`;
        `errors[].rule` names each failed check). The body also carries `verification`, the
        result as far as the pipeline got, so a client lists the checks and shows `egress_ip`
        to copy (`createApiKey`, SCR-126). A key the exchange refused before its rights were
        read carries `KeyVerificationNotRead`. A request that fails its schema is the same `422`
        with the validation types in `errors` and no `verification`. A call that ends without a
        verdict is a `502` or `503`, never this `422`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/KeyRejectedProblem" }
          examples:
            withdrawEnabled:
              summary: A right that can move funds, checked before every other check (step 2)
              value:
                type: "https://candleviewer.local/errors/validation_failed"
                title: "Request body or parameters failed schema validation"
                status: 422
                detail: "API key has withdrawal permission enabled; CandleViewer refuses to store keys that can withdraw."
                instance: "urn:cv:req:0193f2ba-1f45-7c3e-9a11-2f8e4b1c9d02"
                code: validation_failed
                errors:
                  - field: api_key
                    rule: key_withdraw_permission
                    message: "permissions.Wallet contains 'Withdraw'"
                verification:
                  passed: false
                  uid: "10234567"
                  uta: true
                  read_only: false
                  permissions: { ContractTrade: [Order, Position], Wallet: [Withdraw] }
                  withdraw_enabled: true
                  ip_whitelist: ["203.0.113.10"]
                  egress_ip: "203.0.113.10"
                  warnings: []
            ipWhitelistMismatch:
              summary: The whitelist holds the egress IP and another address (step 5); the exchange answers only from a whitelisted address
              value:
                type: "https://candleviewer.local/errors/validation_failed"
                title: "Request body or parameters failed schema validation"
                status: 422
                detail: "The key's IP whitelist must hold only the egress IP 203.0.113.10; remove the other address in the exchange's key settings."
                instance: "urn:cv:req:0193f2ba-1f45-7c3e-9a11-2f8e4b1c9d03"
                code: validation_failed
                errors:
                  - field: api_key
                    rule: key_ip_whitelist_mismatch
                    message: "the IP whitelist must hold only the egress IP 203.0.113.10"
                verification:
                  passed: false
                  uid: "10234567"
                  uta: true
                  read_only: false
                  permissions: { ContractTrade: [Order, Position] }
                  withdraw_enabled: false
                  ip_whitelist: ["203.0.113.10", "198.51.100.7"]
                  ip_whitelist_matches_egress: false
                  egress_ip: "203.0.113.10"
                  warnings: []
            wrongEnvironment:
              summary: The exchange does not know the key on this environment's host (step 1); no check ran, so only `passed`
              value:
                type: "https://candleviewer.local/errors/validation_failed"
                title: "Request body or parameters failed schema validation"
                status: 422
                detail: "The key does not belong to this environment."
                instance: "urn:cv:req:0193f2ba-1f45-7c3e-9a11-2f8e4b1c9d05"
                code: validation_failed
                errors:
                  - field: api_key
                    rule: key_wrong_environment
                    message: "key does not belong to this environment"
                verification: { passed: false }
            exchangeRefusedIp:
              summary: The exchange refused the egress IP before it reported the key's rights (step 1); `egress_ip` is the address to add at the exchange
              value:
                type: "https://candleviewer.local/errors/validation_failed"
                title: "Request body or parameters failed schema validation"
                status: 422
                detail: "The exchange refused the egress IP 203.0.113.10; add it in the exchange's key settings."
                instance: "urn:cv:req:0193f2ba-1f45-7c3e-9a11-2f8e4b1c9d06"
                code: validation_failed
                errors:
                  - field: api_key
                    rule: key_ip_whitelist_mismatch
                    message: "the exchange refused the egress IP 203.0.113.10; add it to the key's IP whitelist"
                verification: { passed: false, egress_ip: "203.0.113.10" }
            requestInvalid:
              summary: The request fails its schema, so no check ran and there is no `verification`
              value:
                type: "https://candleviewer.local/errors/validation_failed"
                title: "Request body or parameters failed schema validation"
                status: 422
                detail: "1 field failed validation."
                instance: "urn:cv:req:0193f2ba-1f45-7c3e-9a11-2f8e4b1c9d04"
                code: validation_failed
                errors:
                  - field: body.api_secret
                    rule: string_too_short
                    message: "String should have at least 8 characters"
    KeyExchangeError:
      description: >
        An import whose signed call got an error answer that is not a refusal of the key: no
        verdict, nothing stored (`exchange_error`). `exchange` holds `ret_code` only
        (`KeyExchangeProblem`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/KeyExchangeProblem" }
          examples:
            signatureRefused:
              value:
                type: "https://candleviewer.local/errors/exchange_error"
                title: "Bybit returned a non-zero exchange refusal code"
                status: 502
                detail: "The exchange refused the signed call, so the key could not be verified; nothing was stored."
                instance: "urn:cv:req:0193f2bb-c001"
                code: exchange_error
                exchange: { ret_code: 10004 }
    KeyServiceUnavailable:
      description: >
        An import that could not be made or recorded, so nothing was stored (`createApiKey`).
        `exchange` holds `ret_code` only (`KeyExchangeProblem`); the exchange sent none when it
        gave no answer. `audit_unavailable` is the import's alone: a test never fails on its
        audit record.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/KeyExchangeProblem" }
          examples:
            exchangeUnavailable:
              summary: The exchange gave no answer to the import, or signing is unavailable
              value:
                type: "https://candleviewer.local/errors/exchange_unavailable"
                title: "Exchange connectivity lost (WS down and REST failing)"
                status: 503
                detail: "The exchange gave no answer, so the key could not be verified; nothing was stored."
                instance: "urn:cv:req:0193f2bb-d001"
                code: exchange_unavailable
                retry_after_seconds: 5
            auditUnavailable:
              summary: The write-ahead audit record of the import could not be written (`createApiKey`)
              value:
                type: "https://candleviewer.local/errors/audit_unavailable"
                title: "Write-ahead audit record could not be written (or no audit backend is wired); refused, fail closed (C-2.9)"
                status: 503
                detail: "The audit record of the import could not be written; nothing was stored."
                instance: "urn:cv:req:0193f2bb-d002"
                code: audit_unavailable
                retry_after_seconds: 5
    KeyTestThrottled:
      description: >
        One test per key per minute: a second inside the minute is refused and nothing is
        probed (`testApiKey`). An exchange rate limit is reported inside the `200`, never as
        this `429`.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Problem" }
              - type: object
                required: [retry_after_seconds]
                properties:
                  { code: { const: rate_limited }, retry_after_seconds: { type: integer } }
          examples:
            throttled:
              value:
                type: "https://candleviewer.local/errors/rate_limited"
                title: "Per-user API rate limit exceeded"
                status: 429
                detail: "One test per key per minute; retry in 41 s."
                instance: "urn:cv:req:0193f2bb-a001"
                code: rate_limited
                retry_after_seconds: 41
    PreconditionFailed:
      description: ETag precondition failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            stale:
              value:
                {
                  type: "https://candleviewer.local/errors/version_conflict",
                  title: "If-Match / ETag precondition failed",
                  status: 412,
                  detail: "Resource was modified at 2026-09-14T10:30:00Z by another session.",
                  instance: "urn:cv:req:0193f2bb-6666",
                  code: version_conflict,
                }
    PayloadTooLarge:
      description: "The request body or the number of batch operations exceeds the operation's ceiling (`payload_too_large`). Checked before per-item validation."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            batchTooLarge:
              value:
                {
                  type: "https://candleviewer.local/errors/payload_too_large",
                  title: "Request body or batch exceeds the operation's size ceiling",
                  status: 413,
                  detail: "Batch carries 201 operations; the maximum is 200.",
                  instance: "urn:cv:req:0193f2bb-7777",
                  code: payload_too_large,
                }
    UnprocessableEntity:
      description: Semantically invalid request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            nativeStop:
              value:
                type: "https://candleviewer.local/errors/validation_failed"
                title: "Request body or parameters failed schema validation"
                status: 422
                detail: "Entry orders must carry a native exchange-side stop-loss."
                instance: "urn:cv:req:0193f2bb-7777"
                code: validation_failed
                errors:
                  [
                    {
                      field: stop_loss,
                      rule: native_stop_required,
                      message: "No stop_loss supplied and the account profile defines no SL offset.",
                    },
                  ]
            riskCap:
              value:
                {
                  type: "https://candleviewer.local/errors/risk_limit_breached",
                  title: "Per-account profile risk cap would be exceeded",
                  status: 422,
                  detail: "max_daily_loss_usd 1500 already realised (-1522.40).",
                  instance: "urn:cv:req:0193f2bb-8888",
                  code: risk_limit_breached,
                }
    RuleIrInvalid:
      description: Rule IR failed semantic validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            typeMismatch:
              value:
                type: "https://candleviewer.local/errors/rule_ir_invalid"
                title: "Rule intermediate representation failed semantic validation"
                status: 422
                detail: "1 error in the rule IR."
                instance: "urn:cv:req:0193f2bb-9999"
                code: rule_ir_invalid
                errors:
                  [
                    {
                      field: "then[0].params.price",
                      rule: type_mismatch,
                      message: "Expected decimal expression, got boolean.",
                    },
                  ]
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            local:
              value:
                {
                  type: "https://candleviewer.local/errors/rate_limited",
                  title: "Per-user API rate limit exceeded",
                  status: 429,
                  detail: "600 requests/min exceeded; retry in 12 s.",
                  instance: "urn:cv:req:0193f2bb-aaaa",
                  code: rate_limited,
                  retry_after_seconds: 12,
                }
            exchange:
              value:
                {
                  type: "https://candleviewer.local/errors/exchange_rate_limited",
                  title: "Bybit per-UID rate budget exhausted",
                  status: 429,
                  detail: "UID 10234567 budget exhausted (Bybit 10006); shed locally to protect the connection.",
                  instance: "urn:cv:req:0193f2bb-bbbb",
                  code: exchange_rate_limited,
                  retry_after_seconds: 2,
                }
    NotImplemented:
      description: "Declared but not served: the provider behind this operation is not wired (`code: not_implemented`). No data was read or changed, and retrying does not help until it is wired."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            notWired:
              value:
                {
                  type: "https://candleviewer.local/errors/not_implemented",
                  title: "Not implemented",
                  status: 501,
                  instance: "urn:cv:req:0193f2bb-5011",
                  code: not_implemented,
                }
    ExchangeError:
      description: The exchange rejected the request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            bybitReject:
              value:
                type: "https://candleviewer.local/errors/exchange_error"
                title: "Bybit returned a non-zero exchange refusal code"
                status: 502
                detail: "Order rejected: insufficient available balance."
                instance: "urn:cv:req:0193f2bb-cccc"
                code: exchange_error
                exchange:
                  {
                    ret_code: 110007,
                    ret_msg: "ab not enough for new order",
                    endpoint: "POST /v5/order/create",
                    request_id: "5f0c…",
                  }
    ServiceUnavailable:
      description: A dependency is unavailable or data is degraded.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            wsDown:
              value:
                {
                  type: "https://candleviewer.local/errors/exchange_unavailable",
                  title: "Exchange connectivity lost",
                  status: 503,
                  detail: "Public WS disconnected 42 s ago; REST backfill failing.",
                  instance: "urn:cv:req:0193f2bb-dddd",
                  code: exchange_unavailable,
                  retry_after_seconds: 5,
                }
            storeUnavailable:
              value:
                {
                  type: "https://candleviewer.local/errors/store_unavailable",
                  title: "QuestDB / Postgres / Parquet tier unavailable",
                  status: 503,
                  detail: "The relational store is unavailable.",
                  instance: "urn:cv:req:0193f2bb-ffff",
                  code: store_unavailable,
                  retry_after_seconds: 5,
                }
            stale:
              value:
                {
                  type: "https://candleviewer.local/errors/degraded_data",
                  title: "Local store is behind the exchange beyond the freshness SLO",
                  status: 503,
                  detail: "Book lag 3800 ms exceeds the 2000 ms SLO.",
                  instance: "urn:cv:req:0193f2bb-eeee",
                  code: degraded_data,
                  retry_after_seconds: 2,
                }
    AuthUnavailable:
      description: |
        `code: auth_unavailable` (#2152, ADR-0009 Amendment 4). The second factor cannot be
        checked or sealed: the KEK is unavailable (any reason in `docs/plan/spikes/e27-kek.md`
        section 6), this environment's auth keyring is missing, mismatched or stranded, or the
        user's TOTP method is sealed under a key this process does not hold. MFA then fails
        closed on exactly eight operations: `POST /auth/login`, `POST /auth/mfa/verify`,
        `POST /auth/mfa/recovery`, `POST /auth/mfa/enroll`, `POST /auth/mfa/enroll/confirm`,
        `POST /auth/step-up`, `POST /invites/{inviteToken}` and
        `POST /invites/{inviteToken}/confirm`. `POST /auth/login` answers it only for a user with
        a confirmed MFA method and only after the password verified, in place of the
        `mfa_required` challenge; a wrong password is still `401 unauthenticated`. Its `503` also
        keeps every meaning of `ServiceUnavailable`.

        The answer counts, consumes and changes nothing: no session or `mfa_token` is minted,
        nothing is revoked, and no MFA attempt, failed-login count, lockout, recovery-code use,
        invite redemption or enrolment is recorded. It stores no idempotency record either, so an
        `Idempotency-Key` sent with it stays unused: the client may send the same request, with
        the same key, again after `Retry-After`, and that request is a first submission that
        executes once, never a replay of the `503` (no `Idempotency-Replayed`). A method this
        process cannot open never counts as "no method": it never leads to an enrolment-only
        session or a new enrolment. Users without an MFA method still sign in, and existing
        sessions keep working. `title` and `detail` are generic: they name no cause, key, key
        reference or KEK version (the cause is the `secrets` health reason). Audited as
        `auth.mfa_unavailable`.

        **Order of checks.** These refusals come first and keep their answers and counting:
        authentication, CSRF, session state, rate limits, request validation, the `mfa_token` or
        invite token, and the per-operation checks named below. The `503` comes next, before
        anything else is examined: no password is verified except at login, no TOTP code,
        recovery code or recovery-code pool is examined, and no seed is generated, opened or
        sealed. One confirmed TOTP method that this process cannot open is enough: a code is
        never checked against some of the user's methods and then answered `503`.

        - `POST /auth/login` (ruling D4): the user lookup, the lock, the password and the
          disabled state come first, each with its current answer and counting. The `503` then
          replaces the `mfa_required` challenge before anything is written: no `mfa_token`, no
          password rehash, and the failed-login count is neither incremented nor reset. Before
          the password, a `503` would tell an unauthenticated caller which accounts have MFA;
          after it, the `503` says no more than the challenge it replaces.
        - `POST /auth/mfa/verify`: after the `mfa_token` check (unknown, expired or locked is
          still `401`), before the code. The challenge keeps its attempt count and its expiry.
        - `POST /auth/mfa/recovery`: after the `mfa_token` check, before the recovery-code pool
          and the code, so a `503` says nothing about how many codes are left.
        - `POST /auth/mfa/enroll`: after every refusal that needs no auth key, before a seed is
          generated; no method is created.
        - `POST /auth/mfa/enroll/confirm`: after every refusal that needs no auth key, the
          pending method lookup included (an unknown `method_id` keeps its answer), before the
          code. Confirming may issue recovery codes, so it needs the method's TOTP key and the
          recovery key; without either it answers `503` and the method stays pending.
        - `POST /auth/step-up`: after request validation (the `422` and every `400`, the
          `challenge_id` ones included) and `403 session_read_only`, before either factor.
          Whatever password was sent is not verified, so no step-up failure, failed-login count,
          lockout or read-only downgrade is recorded, nothing is elevated and the live challenge
          stays live. This differs from login on purpose. Step-up never reveals which factor
          failed (any wrong factor is the same `401 mfa_invalid`), and a password verified before
          a `503` would turn an outage into a password check for whoever holds the session. The
          lockout counters bound password guesses; a `503` verifies no password, so there is
          nothing to count (ruling D4: nothing counted or consumed), as with the `challenge_id`
          `400`s.
        - `POST /invites/{inviteToken}`: after the rate limit (`429`), the body and role checks
          (`400`, `403`), the token (`404`) and the password policy (`422`), before the password
          is hashed or the token consumed. The invite stays open and no failed attempt is
          recorded for the address.
        - `POST /invites/{inviteToken}/confirm`: after the same rate limit, body and role checks,
          the token and its enrolment state (`404`) and the pending method lookup, before the
          code. It needs the same two keys as `POST /auth/mfa/enroll/confirm`. No failed attempt
          is recorded, and the enrolment window keeps running.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            mfaUnavailable:
              value:
                {
                  type: "https://candleviewer.local/errors/auth_unavailable",
                  title: "Second factor temporarily unavailable",
                  status: 503,
                  detail: "Two-factor authentication is temporarily unavailable; try again later.",
                  instance: "urn:cv:req:0193f2bb-5031",
                  code: auth_unavailable,
                  retry_after_seconds: 30,
                }
  # ---------------------------------------------------------------------------
  schemas:
    # === Primitives & shared ================================================
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Arbitrary-precision decimal transported as a string (convention C6).
      examples: ["63120.50", "-0.0004", "0"]
    Symbol:
      type: string
      pattern: "^[A-Z0-9]{2,20}USDT$"
      description: Bybit USDT linear perpetual symbol. v1 accepts USDT-quoted linear symbols only.
      examples: [BTCUSDT, ETHUSDT, SOLUSDT]
    ExchangeCode:
      type: string
      enum: [bybit]
      default: bybit
      x-db-enum: exchange_code
      description: |
        Exchange identifier. v1 supports Bybit only (locked scope: Bybit USDT linear perpetuals).
        Mirrors the Postgres type `exchange_code`; the adapter abstraction
        (`24-internal-schemas.md`) exists so a second value can be added without a breaking change.
    Environment:
      type: string
      enum: [live, demo, testnet]
      x-db-enum: exchange_env
      description: Structural environment selector (arch P9). Mirrors the Postgres type `exchange_env`.
    TelemetryBucketCounts:
      type: object
      additionalProperties: false
      required: [counts]
      description: Non-cumulative counts per bucket edge plus a trailing `+Inf` slot.
      properties:
        counts:
          type: array
          maxItems: 9
          items: { type: integer, minimum: 0, maximum: 2400 }
    FrontendTelemetry:
      type: object
      additionalProperties: false
      required: [screen, engine_version, fe_frame_time_ms, fe_ws_decode_ms, fe_dropped_frames_total]
      properties:
        screen: { type: string, pattern: "^R-[0-9]{3}$", description: Sitemap route id. }
        engine_version: { type: string, pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,4}$' }
        fe_frame_time_ms:
          allOf: [{ $ref: "#/components/schemas/TelemetryBucketCounts" }]
          description: "Edges ms: 4, 8, 12, 16, 20, 33, 50, 100, +Inf (9 slots)."
        fe_ws_decode_ms:
          allOf: [{ $ref: "#/components/schemas/TelemetryBucketCounts" }]
          description: "Edges ms: 0.1, 0.25, 0.5, 1, 2, 4, 5, 10, +Inf (9 slots)."
        fe_dropped_frames_total: { type: integer, minimum: 0, maximum: 2400 }
        fe_gpu_memory_mb: { type: number, minimum: 0, maximum: 65536 }
    OrderEntryRefusalReason:
      type: string
      enum: [maintenance, account_disabled_by_policy, no_active_key, account_unhealthy]
      description: >
        Why the shared order-entry gate refused an order (#837 Q5; E42-T03 and E27-T04). The
        server's set is closed and listed in `24-internal-schemas.md` 8.10. **Open-ended for
        readers:** clients must tolerate values they do not know, so adding a reason is an
        additive change (C-6.3).
    TradingDisabledProblem:
      description: >
        The `403 trading_disabled` problem the order-entry gate returns when it refuses a
        submission or amend that opens or increases exposure, before any OMS work (C-2.21): the
        problem body plus the gate's `reason`. `detail` is human text and never carries an id or
        a secret. The gate runs after authentication, RBAC and account-scope resolution, so an
        account outside the caller's scope never reaches it and gets a `404`. Cancels, flatten
        and quantity-reducing or stop-tightening amends never pass through the gate. Attaching a
        missing native SL, tightening a stop, or re-arming a protective trigger is never gated;
        "trigger re-armed" means an exposure-increasing (entry) trigger. An amend with any
        risk-increasing component is gated.
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [reason]
          properties:
            code: { const: trading_disabled }
            reason: { $ref: "#/components/schemas/OrderEntryRefusalReason" }
    Problem:
      type: object
      description: "RFC 9457 problem detail. `code` mirrors the `x-error-codes` catalogue."
      required: [type, title, status, code]
      properties:
        type:
          { type: string, format: uri, description: "`https://candleviewer.local/errors/{code}`." }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance:
          {
            type: string,
            description: "Correlation id, `urn:cv:req:{uuid}`; matches the `X-Request-Id` header and the audit entry.",
          }
        code:
          { type: string, description: "Stable machine-readable error code from `x-error-codes`." }
        errors:
          type: array
          description: Field-level validation failures.
          items:
            type: object
            properties:
              field: { type: string }
              rule: { type: string }
              message: { type: string }
        required_permissions: { type: array, items: { type: string } }
        retry_after_seconds: { type: integer }
        idle_locked_at:
          type: string
          format: date-time
          description: "`session_idle_locked` only: when the session idle-locked (its `idle_deadline`)."
        revoked_reason:
          type: string
          enum: [expired, unlock_attempts_exceeded, revoked]
          description: >
            `session_revoked` only. `expired`: the 12 h absolute lifetime elapsed.
            `unlock_attempts_exceeded`: five consecutive wrong unlock passwords. `revoked`: any
            other revocation; the specific cause is not disclosed.
        exchange:
          type: object
          description: Present when the failure originated at Bybit.
          properties:
            ret_code: { type: integer }
            ret_msg: { type: string }
            endpoint: { type: string }
            request_id: { type: string }
        action_class:
          type: string
          description: >
            `step_up_required` only: the step-up class the refused request needs, one of the
            `action_class` values of `POST /auth/step-up`.
        challenge_id:
          type: string
          format: uuid
          description: >
            `step_up_required` only: the challenge this refusal issued (#2304), a random UUIDv4
            scoped to the issuing session, so a value from another session is unknown. One
            challenge is live per session; a newer refusal supersedes it. Send it as
            `challenge_id` to `POST /auth/step-up`; a step-up for a no-grace class must send it.
        challenge_expires_at:
          type: string
          format: date-time
          description: >
            `step_up_required` only: when the challenge expires, 5 minutes after issue (server
            clock). The client drops the held request then, without sending it.
        action_summary:
          type: string
          description: >
            `step_up_required` only: server-composed text naming exactly what the refused request
            would execute, built from the validated request (for example "Release kill switch,
            scope global"). It comes from a fixed per-route template. Request values appear in it
            only as validated enum values (bare) or as identifiers and server-resolved labels
            (quoted, each bounded by its own schema's `maxLength` or `format`), never as free
            text such as a `reason`, and never as key material, a password, a token, a TOTP or
            recovery code or any field the redaction deny-list names (C-12.6). A label alone
            never identifies an account or a rule, because labels can be renamed and need not be
            unique: each account named in it is followed by its `environment` and `exchange_uid`
            and each rule by the environments its scope includes, rendered bare (for example
            "Release kill switch, accounts 'demo-1' (demo, UID 1001234)" or "Arm rule 'Break-even'
            (live)"); an account's `environment` and `exchange_uid` never change after it is
            registered. Naming a rule this way is provisional: two rules can share a label and
            environments, and `rules:write` can rename a rule and change its scope, bindings and
            active version without a step-up, so the route slice of #2304 decides, before any rule
            template ships, whether a rule is also named by its bound accounts and whether the
            grant that arms it is also bound to its active version. Before a label is quoted, an
            apostrophe or a backslash in it is preceded by a backslash, and every character
            outside printable ASCII (U+0020 to U+007E) is written as `\u{`, its code point in
            upper-case hex zero-padded to four digits, and `}` (U+000A becomes `\u{000A}`, U+202E
            becomes `\u{202E}` and U+1F600 becomes `\u{1F600}`). That covers line breaks and
            other control characters, bidi embedding, override and isolate marks and look-alike
            quotation marks, so the quotes bound the label: the label `demo-1' (demo)` is quoted
            as `'demo-1\' (demo)'`. The step-up dialog shows it verbatim as its accessible
            description; a client never composes its own.
        target:
          type: ["string", "null"]
          description: >
            `step_up_required` only: the exact, case-sensitive text a typed confirmation must
            equal when the action asks for one (for example the account name), else null. Like
            `action_summary`, it is an identifier or a server-resolved label of the validated
            request, never free text or credential material. It is a label only when no other
            object of its kind that the caller can see has that label, compared
            case-insensitively, and the label is printable ASCII; otherwise it is the object's
            identifier.
    PageMeta:
      type: object
      required: [has_more, count]
      properties:
        next_cursor: { type: ["string", "null"] }
        has_more: { type: boolean }
        count:
          {
            type: integer,
            description: "Items in this page (not the total, which is never computed for unbounded sets).",
          }
        total:
          {
            type: ["integer", "null"],
            description: "Present only where a cheap exact count exists.",
          }
    Page:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: {} }
        meta: { $ref: "#/components/schemas/PageMeta" }
    InstrumentsPageMeta:
      description: >-
        `PageMeta` extended with instrument-cache freshness so clients can show a stale banner.
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [cache_age_s, stale_since]
          properties:
            cache_age_s:
              {
                type: number,
                description: "Seconds since this snapshot was last fetched from Bybit.",
              }
            stale_since:
              {
                type: ["string", "null"],
                format: date-time,
                description: "When the cache started missing its refresh cadence; null if fresh.",
              }
    DataMeta:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            sources:
              type: array
              description: >-
                Tiers whose rows are in this response (provenance, 24 §2): `tape` = bars built
                locally from the recorded trade tape; `questdb` = exchange-kline rows in the hot
                tier; `parquet` = cold tier; `exchange_rest` = rows just backfilled from Bybit.
              items:
                { type: string, enum: [questdb, parquet, postgres, exchange_rest, memory, tape] }
            recording_started_at: { type: ["string", "null"], format: date-time }
            generated_at: { type: string, format: date-time }
            coverage_holes:
              type: array
              description: >-
                Requested-range gaps the local cache has no bars for yet (QA defect #1622
                blocker 1 / E08-S06 "Cache hit" scenario — `GET /market/klines` is
                cache-only until a live `KlineFetcher` lands, so it reports holes here
                instead of silently pretending the exchange was consulted).
              items:
                type: object
                required: [start_us, end_us]
                properties:
                  start_us:
                    { type: integer, description: "Gap start, exchange epoch microseconds." }
                  end_us: { type: integer, description: "Gap end, exchange epoch microseconds." }

    # === Enums (mirroring 21-database-schema.md) =============================
    UserStatus: { type: string, enum: [invited, active, disabled, locked], x-db-enum: user_status }
    RoleName: { type: string, enum: [owner, manager, viewer], x-db-enum: role_name }
    MfaMethodKind:
      { type: string, enum: [totp, webauthn, recovery_code], x-db-enum: mfa_method_kind }
    AccountKind: { type: string, enum: [main, sub], x-db-enum: account_kind }
    KeyStatus:
      type: string
      enum: [pending, active, rotating, revoked, expired, invalid]
      x-db-enum: key_status
      description: >
        Only `active` and `rotating` keys are signable (`21-database-schema.md` §3.2.3a).
        `invalid`: the exchange rejected the key's credential (exchange refusal codes `10003` or
        `10004`), which `24-internal-schemas.md` §8.6 answers by marking the key `invalid`; it is
        not signable.
    SizingMode:
      type: string
      enum: [fixed_qty, fixed_notional, pct_equity, risk_based, pct_position, profile]
      x-db-enum: sizing_mode
      x-db-enum-superset: [pct_position, profile]
      description: |
        How a request expresses order size.

        **Persistence contract.** The Postgres type `sizing_mode`
        (`21-database-schema.md` §Enums) holds only the four *resolved* modes
        `fixed_qty | fixed_notional | pct_equity | risk_based`. The two extra API values are
        **request-time sugar that never reaches the database**; the OMS resolves them before
        any row is written, and `orders.requested_qty_mode` / `account_profiles.sizing_mode`
        therefore always contain a resolved value:

        | API value | Resolution | Stored as |
        |---|---|---|
        | `pct_position` | `pct` % of the *current open position* qty on that symbol/account (scale-out, flatten-partial). Rejected with `validation_failed` if no position is open. | `fixed_qty` |
        | `profile` | Inherit the active `AccountProfile.sizing` block verbatim. | whatever the profile's own mode resolves to |

        Contract test `enum_parity_sizing_mode` asserts (a) the DB enum equals this enum minus
        `x-db-enum-superset`, and (b) no persisted row ever holds a superset value.
    OffsetUnit:
      type: string
      enum: [ticks, percent, r_multiple, atr, price]
      x-db-enum: offset_unit
      x-db-enum-superset: [price]
      description: |
        Unit in which a stop/target distance is expressed.

        **Persistence contract.** The Postgres type `offset_unit` holds
        `ticks | percent | r_multiple | atr`. The API additionally accepts `price`, meaning
        "`value` is an absolute price level, not a distance"; the OMS converts it to a
        `ticks` distance from the resolved entry/reference price before persisting, so
        `account_profiles.sl_offset_unit` / `tp_offset_unit` never store `price`.
        Contract test `enum_parity_offset_unit` asserts this.
    TradeGroupStatus:
      {
        type: string,
        enum: [draft, submitting, partially_open, open, closing, closed, failed, cancelled],
        x-db-enum: trade_group_status,
      }
    LegStatus:
      {
        type: string,
        enum:
          [pending, submitted, rejected, open, partially_filled, filled, cancelled, closed, error],
        x-db-enum: leg_status,
      }
    OrderIntent:
      {
        type: string,
        enum: [entry, stop_loss, take_profit, scale_in, scale_out, flatten, reverse, algo_child],
        x-db-enum: order_intent,
      }
    OrderState:
      {
        type: string,
        enum:
          [
            new,
            pending_submit,
            submitted,
            accepted,
            partially_filled,
            filled,
            pending_cancel,
            cancelled,
            pending_amend,
            rejected,
            expired,
            untracked,
          ],
        x-db-enum: order_state,
      }
    OrderType: { type: string, enum: [market, limit] }
    OrderSide: { type: string, enum: [buy, sell] }
    TimeInForce: { type: string, enum: [GTC, IOC, FOK, PostOnly] }
    TriggerBy: { type: string, enum: [LastPrice, MarkPrice, IndexPrice] }
    TpSlMode: { type: string, enum: [Full, Partial] }
    PositionMode: { type: string, enum: [one_way, hedge] }
    MarginMode: { type: string, enum: [cross, isolated, portfolio] }
    AlgoKind:
      {
        type: string,
        enum: [none, oco, iceberg, twap, chase, scaled, bracket],
        x-db-enum: algo_kind,
      }
    RuleScope:
      {
        type: string,
        enum: [global, account, symbol, position, trade_group],
        x-db-enum: rule_scope,
      }
    RuleMode: { type: string, enum: [disabled, simulate, armed], x-db-enum: rule_mode }
    RuleRunStatus:
      { type: string, enum: [running, ok, error, aborted, throttled], x-db-enum: rule_run_status }
    AlertChannel:
      { type: string, enum: [in_app, email, webhook, push, desktop], x-db-enum: alert_channel }
    DeliveryStatus:
      { type: string, enum: [queued, sent, failed, suppressed, acked], x-db-enum: delivery_status }
    RecordingState:
      {
        type: string,
        enum: [idle, starting, recording, degraded, stopping, stopped, error],
        x-db-enum: recording_state,
      }
    RecordReason:
      {
        type: string,
        enum: [manual, chart_open, position_open, rule_dependency, alert_dependency],
        x-db-enum: record_reason,
      }
    StreamKind:
      {
        type: string,
        enum:
          [
            trades,
            orderbook_delta,
            orderbook_snapshot,
            tickers,
            klines,
            liquidations,
            open_interest,
            funding,
          ],
        x-db-enum: stream_kind,
      }
    RetentionAction:
      { type: string, enum: [drop, archive_parquet, downsample, pin], x-db-enum: retention_action }
    ReplayState:
      {
        type: string,
        enum: [created, buffering, playing, paused, finished, error],
        x-db-enum: replay_state,
      }
    JournalSide: { type: string, enum: [long, short], x-db-enum: journal_side }
    FlagKind: { type: string, enum: [boolean, percentage, variant], x-db-enum: flag_kind }
    AuditOutcome: { type: string, enum: [success, failure, denied], x-db-enum: audit_outcome }
    Severity: { type: string, enum: [debug, info, warning, error, critical], x-db-enum: severity }
    BackupKind:
      {
        type: string,
        enum: [pg_basebackup, pg_dump, questdb_snapshot, parquet_sync, config_bundle],
        x-db-enum: backup_kind,
      }
    BackupStatus:
      { type: string, enum: [running, ok, failed, verified, restored], x-db-enum: backup_status }
    ComponentState:
      type: string
      enum: [healthy, degraded, warning, down, not_deployed]
      description: "`not_deployed` = module not built yet; ranks as healthy for `overall`. Rank: down > warning > degraded > healthy."
    KlineInterval:
      type: string
      enum: ["1", "3", "5", "15", "30", "60", "120", "240", "360", "720", "D", "W", "M"]
      description: Bybit-compatible interval codes (minutes, or D/W/M).
    BarType:
      type: string
      enum: [time, tick, volume, range, delta, renko, pnf, heikin_ashi]
    MetricCode:
      type: string
      enum:
        - cvd
        - delta
        - min_max_delta
        - trades_per_sec
        - volume_per_sec
        - book_updates_per_sec
        - tape_acceleration
        - imbalance_ratio
        - absorption
        - exhaustion
        - iceberg
        - stop_run
        - adx
        - atr
        - hurst
        - regime
        - vwap
        - open_interest_delta
        - funding_basis
        - liquidation_intensity

    # === Auth ===============================================================
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          { type: string, minLength: 1, maxLength: 254, description: "Username or email." }
        password: { type: string, format: password, minLength: 1, maxLength: 512 }
        device_name: { type: string, maxLength: 120, description: "Shown in the session list." }
    TokenBundle:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in: { type: integer, description: "Access-token lifetime in seconds (600)." }
        refresh_expires_in:
          type: integer
          description: >
            Refresh-token lifetime in seconds (2592000). For an enrolment-only session it counts
            down to that session's absolute expiry, at most 900 (see "Enrolment-only session").
        refresh_token:
          {
            type: ["string", "null"],
            description: "Returned only to non-cookie clients that set `cookie_auth:false` on login.",
          }
    AuthenticatedResponse:
      type: object
      required: [status, tokens, user]
      properties:
        status: { const: authenticated }
        tokens: { $ref: "#/components/schemas/TokenBundle" }
        user: { $ref: "#/components/schemas/User" }
    MfaChallengeResponse:
      type: object
      required: [status, mfa_token, methods, expires_in]
      properties:
        status: { const: mfa_required }
        mfa_token: { type: string }
        methods: { type: array, items: { $ref: "#/components/schemas/MfaMethodKind" } }
        expires_in: { type: integer }
        webauthn_challenge: { type: ["object", "null"], additionalProperties: true }
    LoginResponse:
      oneOf:
        - $ref: "#/components/schemas/AuthenticatedResponse"
        - $ref: "#/components/schemas/MfaChallengeResponse"
      discriminator:
        propertyName: status
        mapping:
          authenticated: "#/components/schemas/AuthenticatedResponse"
          mfa_required: "#/components/schemas/MfaChallengeResponse"
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [mfa_token, method]
      properties:
        mfa_token: { type: string }
        method: { $ref: "#/components/schemas/MfaMethodKind" }
        code:
          {
            type: string,
            pattern: "^[0-9A-Za-z-]{6,32}$",
            description: "TOTP digits or a recovery code.",
          }
        webauthn_assertion: { type: object, additionalProperties: true }
        remember_device_days: { type: integer, minimum: 0, maximum: 30, default: 0 }
    MfaEnrollRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: { type: string, enum: [totp, webauthn] }
        label: { type: string, maxLength: 60 }
    MfaEnrollResponse:
      type: object
      required: [method_id, method]
      description: >
        Carries no recovery codes: `POST /auth/mfa/enroll/confirm` issues them once the method
        is confirmed (`MfaEnrollConfirmResponse`).
      properties:
        method_id: { type: string, format: uuid }
        method: { $ref: "#/components/schemas/MfaMethodKind" }
        otpauth_uri: { type: ["string", "null"] }
        webauthn_creation_options: { type: ["object", "null"], additionalProperties: true }
    MfaEnrollConfirmRequest:
      type: object
      additionalProperties: false
      required: [method_id]
      properties:
        method_id: { type: string, format: uuid }
        code: { type: string }
        webauthn_attestation: { type: object, additionalProperties: true }
    MfaEnrollConfirmResponse:
      description: >
        `POST /auth/mfa/enroll/confirm` `200`: the `AuthenticatedResponse` of the rotated, full
        session, plus the activated method and the user's new recovery codes.
      allOf:
        - $ref: "#/components/schemas/AuthenticatedResponse"
        - type: object
          required: [mfa_method, recovery_codes]
          properties:
            mfa_method: { $ref: "#/components/schemas/MfaMethod" }
            recovery_codes:
              type: array
              minItems: 10
              maxItems: 10
              items: { type: string }
              description: >
                The user's 10 new single-use recovery codes (SR-022), shown exactly once. The
                previous set stopped working when these were issued.
    MfaMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/MfaMethodKind" }
        label: { type: ["string", "null"] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: ["string", "null"], format: date-time }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string, description: "Only for clients that cannot use cookies." }
    Argon2Params:
      type: object
      additionalProperties: false
      required: [m, t, p]
      description: "#2097: the Argon2id parameters new password hashes use (SR-011 floor: m ≥ 65536, t ≥ 3, p ≥ 4). Not secret: every stored hash embeds them."
      properties:
        m: { type: integer, minimum: 1, description: "Memory cost in KiB (65536 = 64 MiB)." }
        t: { type: integer, minimum: 1, description: "Time cost (passes over memory)." }
        p: { type: integer, minimum: 1, description: "Parallelism (lanes)." }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12, maxLength: 512 }
    UnlockRequest:
      type: object
      additionalProperties: false
      required: [password]
      description: Password only; unlock never asks for TOTP (US-ONB-004).
      properties:
        password: { type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true }
    SessionInfo:
      type: object
      required: [user, permissions, account_scope, server_time, session]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions: { type: array, items: { type: string } }
        account_scope: { type: array, items: { type: string, format: uuid } }
        allowed_environments: { type: array, items: { $ref: "#/components/schemas/Environment" } }
        kill_switch: { $ref: "#/components/schemas/KillSwitch" }
        server_time: { type: string, format: date-time }
        step_up_expires_at:
          type: ["string", "null"]
          format: date-time
          description: >
            Latest live step-up grace-window expiry on this session (E09-S04); null if none.
            Always null while the session is idle-locked and in the `POST /auth/unlock` response:
            no elevation survives the lock (see "Idle lock").
        clock_offset_ms:
          {
            type: integer,
            description: "Backend clock minus Bybit server time; |offset| > 1000 ms is an incident.",
          }
        api_version: { type: string }
        feature_flags:
          { type: object, additionalProperties: true, description: "Flags resolved for this user." }
        session: { $ref: "#/components/schemas/SessionState" }
    SessionState:
      type: object
      description: >
        Server truth for the caller's session lifetime and idle lock (E09-D06, #2300). Clients
        time the CMP-098 warning and the SCR-005 lock from these values and `server_time`,
        never from a client clock.
      required: [id, issued_at, expires_at, idle_deadline, idle_timeout_s, locked]
      properties:
        id:
          type: string
          format: uuid
          description: Server-side session id (`sid`); `POST /auth/refresh` rotates it.
        issued_at:
          type: string
          format: date-time
          description: When this session id was issued (sign-in, or the refresh that rotated it).
        expires_at:
          type: string
          format: date-time
          description: End of the 12 h absolute lifetime. Refresh, extend and unlock never move it.
        idle_deadline:
          type: string
          format: date-time
          description: >
            When the idle lock engages unless activity is recorded first
            (`last_seen_at + idle_timeout_s`). Only `POST /auth/session/extend` and
            `POST /auth/unlock` move it; `POST /auth/refresh` carries it over unchanged. Once
            `locked`, the moment it locked.
        idle_timeout_s:
          type: integer
          minimum: 300
          maximum: 3600
          description: Idle timeout of this session in seconds (per user, 5 to 60 minutes).
        locked:
          type: boolean
          description: True once `idle_deadline` has passed; only `POST /auth/unlock` clears it.
    SessionExtendResponse:
      type: object
      required: [session, server_time]
      properties:
        session: { $ref: "#/components/schemas/SessionState" }
        server_time: { type: string, format: date-time }
    UserSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_name: { type: ["string", "null"] }
        ip: { type: ["string", "null"] }
        user_agent: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }

    # === Users / roles ======================================================
    User:
      type: object
      required: [id, username, email, roles, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email:
          type: string
          pattern: "^[^@]+@"
          description: >
            The address as stored, not a verified mailbox. The pattern is the database check
            `users_email_fmt` (`position('@' in email) > 1`): an `@` that is not the first
            character, and nothing about the rest. A special-use domain such as `.local` is
            accepted (an operator-set address like `owner@candleviewer.local` is valid data), so
            this is a pattern and not `format: email`.
        display_name: { type: ["string", "null"] }
        roles: { type: array, items: { $ref: "#/components/schemas/RoleName" } }
        status: { $ref: "#/components/schemas/UserStatus" }
        mfa_enabled:
          type: boolean
          description: >
            The user has at least one confirmed, unrevoked MFA method. Always present in
            `AuthenticatedResponse` and `SessionInfo`.
        mfa_required:
          type: boolean
          description: >
            MFA is mandatory for this user; C-12.2 requires it for every user. Always present in
            `AuthenticatedResponse` and `SessionInfo`. While `mfa_enabled` is false, every
            session of the user is enrolment-only (see "Enrolment-only session"): clients test
            exactly `mfa_required === true && mfa_enabled === false`.
        last_login_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserWithInvite:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            invite_url: { type: string, description: "One-time link, valid 72 h. Shown once." }
            invite_expires_at: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, email, roles]
      properties:
        username: { type: string, minLength: 3, maxLength: 40, pattern: "^[a-zA-Z0-9._-]+$" }
        email: { type: string, format: email }
        display_name: { type: string, maxLength: 80 }
        roles:
          type: array
          minItems: 1
          maxItems: 1
          description: "Invites grant `viewer` only (#2109); the owner promotes after activation."
          items: { type: string, enum: [viewer] }
        mfa_required: { type: boolean, default: true }
        account_access:
          { type: array, items: { $ref: "#/components/schemas/AccountAccessGrantInput" } }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: ["string", "null"], maxLength: 80 }
        status:
          type: string
          enum: [active, disabled]
          description: "`invited` and `locked` are not settable (`400 validation_failed`)."
        roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RoleName" } }
        mfa_required:
          type: boolean
          enum: [true]
          description: "TOTP is mandatory for every user (C-12.2); `false` is `400 validation_failed`."
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/RoleName" }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
        user_count: { type: integer }
    AccountAccessGrantInput:
      type: object
      additionalProperties: false
      required: [exchange_account_id, level]
      properties:
        exchange_account_id: { type: string, format: uuid }
        level: { type: string, enum: [read, trade], description: "`trade` implies `read`." }
    # Not an `allOf` over the closed input above: a closed branch rejects the read-only fields.
    AccountAccessGrant:
      type: object
      required: [exchange_account_id, level]
      properties:
        exchange_account_id: { type: string, format: uuid }
        level: { type: string, enum: [read, trade], description: "`trade` implies `read`." }
        account_label: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        granted_at: { type: string, format: date-time }
        granted_by: { type: string, format: uuid }

    # === Exchange accounts / keys / profiles ================================
    ExchangeAccount:
      type: object
      required: [id, exchange, environment, kind, label, exchange_uid]
      properties:
        id: { type: string, format: uuid }
        exchange: { $ref: "#/components/schemas/ExchangeCode" }
        environment: { $ref: "#/components/schemas/Environment" }
        kind: { $ref: "#/components/schemas/AccountKind" }
        label: { type: string, maxLength: 80 }
        exchange_uid: { type: string }
        parent_account_id: { type: ["string", "null"], format: uuid }
        connection_state:
          { type: string, enum: [pending, connected, degraded, disconnected, disabled] }
        key_status: { type: string, enum: [missing, pending, active, rotating, expired, invalid] }
        position_mode: { $ref: "#/components/schemas/PositionMode" }
        margin_mode: { $ref: "#/components/schemas/MarginMode" }
        active_profile_id: { type: ["string", "null"], format: uuid }
        balance: { oneOf: [{ $ref: "#/components/schemas/WalletBalance" }, { type: "null" }] }
        balance_stale: { type: boolean }
        balance_stale_since:
          type: ["string", "null"]
          format: date-time
          description: Last refresh plus the 10 s threshold while `balance_stale` is true, else `null`.
        health:
          oneOf: [{ $ref: "#/components/schemas/AccountHealth" }, { type: "null" }]
          description: "`null` until the account is monitored."
        enabled: { type: boolean, default: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountHealth:
      type: object
      description: >
        Per-account connection health (US-ACCT-010), from positive evidence only (an authenticated
        private-WS heartbeat or a REST success); it decays on silence. `healthy`, `degraded` and
        `down` set `connection_state` to `connected`, `degraded` and `disconnected`. Order entry
        for the account is refused while it is `down`. The server derives every field from the
        evidence when it serves it, so a lapse shows without waiting for a scheduled re-check.
      required: [state, reason, heartbeat_age_ms, rest_only, changed_at]
      properties:
        state: { type: string, enum: [healthy, degraded, down] }
        reason:
          type: string
          enum: [ws_heartbeat, rest_only, ws_silent, no_success, never_connected]
          description: >
            Closed set of machine codes the client renders as text, never exchange-supplied text:
            `ws_heartbeat`, `rest_only` (REST polling replaced the private WS), `ws_silent` (the
            WS heartbeat lapsed and there has been no REST success within the down window
            either), `no_success` (nothing for the 30 s down window), `never_connected`.
        heartbeat_age_ms:
          type: ["integer", "null"]
          minimum: 0
          description: Milliseconds since the last authenticated private-WS heartbeat; `null` before the first.
        rest_only:
          type: boolean
          description: True while `degraded`; rule actions that need sub-second reaction are flagged.
        changed_at:
          type: string
          format: date-time
          description: When `state` last changed; a new value marks a discrete transition to announce.
    WalletBalance:
      type: object
      properties:
        is_paper:
          {
            type: boolean,
            default: false,
            description: "True when the paper matcher produced this record rather than the exchange. Orthogonal to `environment` (24-internal-schemas.md section 1.2).",
          }
        coin: { type: string, examples: [USDT] }
        equity: { $ref: "#/components/schemas/Decimal" }
        wallet_balance: { $ref: "#/components/schemas/Decimal" }
        available_balance: { $ref: "#/components/schemas/Decimal" }
        unrealised_pnl: { $ref: "#/components/schemas/Decimal" }
        account_im_rate: { $ref: "#/components/schemas/Decimal" }
        account_mm_rate: { $ref: "#/components/schemas/Decimal" }
        updated_at: { type: string, format: date-time }
    CreateExchangeAccountRequest:
      type: object
      additionalProperties: false
      required: [exchange, environment, kind, label, exchange_uid]
      properties:
        exchange: { $ref: "#/components/schemas/ExchangeCode" }
        environment: { $ref: "#/components/schemas/Environment" }
        kind: { $ref: "#/components/schemas/AccountKind" }
        label: { type: string, minLength: 1, maxLength: 80 }
        exchange_uid: { type: string, pattern: "^[0-9]{4,20}$" }
        parent_account_id:
          { type: ["string", "null"], format: uuid, description: "Required when `kind=sub`." }
    UpdateExchangeAccountRequest:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 80 }
        enabled:
          {
            type: boolean,
            description: "`false` disables the account; with open exposure it needs the `open_exposure` query choice.",
          }
        active_profile_id: { type: ["string", "null"], format: uuid }
        position_mode: { $ref: "#/components/schemas/PositionMode" }
        margin_mode: { $ref: "#/components/schemas/MarginMode" }
    OpenExposureChoice:
      type: string
      enum: [leave_positions, flatten_first]
      description: "How an action that ends CandleViewer's management of an account treats its open exposure (SR-E27-07); see `components.parameters.OpenExposure`."
    AccountConsequenceSummary:
      type: object
      additionalProperties: false
      description: >
        What revoking an account's last active key, disabling the account or deleting it would
        affect (SR-E27-07, SCR-129), read in one server-side query so no partial picture is
        shown. Confidential: served only under the operation's own permission and scope. This
        contract serves it only in the `409 open_exposure` answer. SCR-129 fetches it before the
        dialog renders, which needs a side-effect-free read: E27-S04 (#898) adds that operation
        in its own interface-first PR (C-6.1) before it mounts these routes.
      required:
        [
          exchange_account_id,
          open_positions,
          working_orders,
          running_algos,
          assigned_users,
          armed_rules,
        ]
      properties:
        exchange_account_id: { type: string, format: uuid }
        open_positions:
          type: array
          description: Every open position, with its native stop-loss state.
          items: { $ref: "#/components/schemas/Position" }
        working_orders:
          { type: integer, minimum: 0, description: "Orders working on the exchange." }
        running_algos: { type: integer, minimum: 0, description: "Emulated algos still running." }
        assigned_users:
          type: array
          description: Users granted this account through `user_account_access`.
          items:
            type: object
            additionalProperties: false
            required: [user_id, username, level]
            properties:
              user_id: { type: string, format: uuid }
              username: { type: string }
              level: { type: string, enum: [read, trade] }
        armed_rules:
          type: array
          description: Armed rules scoped to the account, listed by name; the action disarms them.
          items:
            type: object
            additionalProperties: false
            required: [rule_id, name]
            properties:
              rule_id: { type: string, format: uuid }
              name: { type: string }
    ExposureRemedy:
      type: string
      enum: [leave_positions, fix_key]
      description: >
        What the client does after `409 exposure_unknown`; `components.parameters.OpenExposure`
        says which applies. `leave_positions`: send the disable or the revoke again with
        `open_exposure=leave_positions`; a delete is not sent again, the account is disabled
        instead (`updateExchangeAccount` with `enabled: false`) and never deleted, and that
        disable must carry `open_exposure=leave_positions`: without a choice it is
        `409 exposure_unknown` again. `fix_key`: put the key right at the exchange, then send the
        request again; until then no choice proceeds. The resend is a new request with a new
        `Idempotency-Key`: under the same key the identical request replays the stored `409` for
        24 h, and a request with another `open_exposure` is `409 idempotency_key_reuse` (the
        Idempotency rule of `info.description`). It advises the SCR-129 dialog: the choice stays
        the Owner's (SR-E27-07), and a client never sends it on its own. Closed: a new value is a
        breaking change (C-6.3).
    OpenExposureProblem:
      description: >
        The `409` problem of the revoke, disable and delete operations. `consequences` is present
        exactly when `code` is `open_exposure`, and `remedy` exactly when `code` is
        `exposure_unknown`, which carries no `consequences` because the exposure cannot be read.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            consequences: { $ref: "#/components/schemas/AccountConsequenceSummary" }
            remedy: { $ref: "#/components/schemas/ExposureRemedy" }
          allOf:
            - if: { required: [code], properties: { code: { const: open_exposure } } }
              then: { required: [consequences] }
              else: { not: { required: [consequences] } }
            - if: { required: [code], properties: { code: { const: exposure_unknown } } }
              then: { required: [remedy] }
              else: { not: { required: [remedy] } }
    ApiKey:
      type: object
      required: [id, exchange_account_id, key_id_masked, status]
      properties:
        id: { type: string, format: uuid }
        exchange_account_id: { type: string, format: uuid }
        key_id_masked:
          type: string
          pattern: '^\.\.\.[A-Za-z0-9]{4}$'
          description: "At most the last 4 characters of the key id: `...` plus `key_id_last4` (SR-E27-03). The rest is never stored in clear."
        label: { type: ["string", "null"], maxLength: 80 }
        status: { $ref: "#/components/schemas/KeyStatus" }
        read_only: { type: boolean }
        expires_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
        last_verified_at: { type: ["string", "null"], format: date-time }
        rotation_due_at:
          type: ["string", "null"]
          format: date-time
          description: >
            `created_at` plus the deployment's key-rotation policy (default 90 days), never the
            exchange-reported `expires_at`; `null` unless the key is `active`.
        rotation_state:
          type: ["string", "null"]
          enum: [ok, warn, overdue, null]
          description: >
            `warn` inside the warning window (default 14 days), `overdue` past `rotation_due_at`.
            Age alone never disables a key. `null` unless the key is `active`.
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [api_key, api_secret]
      properties:
        api_key: { type: string, minLength: 8, maxLength: 128, format: password }
        api_secret: { type: string, minLength: 8, maxLength: 256, format: password }
        label: { type: string, maxLength: 80 }
        read_only: { type: boolean, default: false }
        expected_uid:
          {
            type: string,
            description: "Must equal the account's `exchange_uid`; mismatch is rejected.",
          }
    KeyVerification:
      type: object
      required: [passed, withdraw_enabled]
      properties:
        passed: { type: boolean }
        uid: { type: ["string", "null"] }
        uta:
          {
            type: boolean,
            description: "From the key-info `uta` field; the deprecated `unified` field is never read.",
          }
        read_only:
          {
            type: boolean,
            description: "From the key-info `readOnly` field, which alone decides write access.",
          }
        permissions:
          type: object
          description: >
            As reported. Every right must be on the `createApiKey` allow-list (step 2). A group
            or right whose name is not a plain identifier is left out of the display, though the
            right is still refused.
          maxProperties: 32
          # `then` holds what the generated model cannot take: a `propertyNames` pattern becomes a
          # `constr` key, which `mypy --strict` refuses, and a bounded nested list becomes an alias.
          if: true
          then:
            propertyNames: { pattern: "^[A-Za-z][A-Za-z0-9]{0,63}$" }
            additionalProperties: { maxItems: 32 }
          additionalProperties:
            type: array
            items: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]{0,63}$" }
        withdraw_enabled:
          {
            type: boolean,
            description: "Must be false; a true value causes rejection. Sent only once the key's rights were read, never as a default (`KeyVerificationNotRead`).",
          }
        ip_whitelist:
          type: array
          description: >
            At most 20 entries, each an address, a range or `*`: any other entry is left out of the
            display.
          maxItems: 20
          items:
            { type: string, maxLength: 49, pattern: "^([*]|[0-9A-Fa-f:.]{2,45}(/[0-9]{1,3})?)$" }
        ip_whitelist_matches_egress:
          {
            type: boolean,
            description: "True only when the whitelist is non-empty and every entry is the configured egress IP itself (no wildcard, no range).",
          }
        egress_ip: { $ref: "#/components/schemas/EgressIp" }
        clock_offset_ms: { type: integer }
        probe_ret_code: { type: ["integer", "null"] }
        warnings: { type: array, items: { $ref: "#/components/schemas/KeyVerificationWarning" } }
    EgressIp:
      description: >
        The deployment's configured egress IP (`CV_EGRESS_IP`), the one address a key's IP
        whitelist may hold; `null` while none is configured. It comes from configuration, never
        from a request header. It is the address the Owner adds to the key's whitelist at the
        exchange when the exchange refused the egress IP or `ip_whitelist_matches_egress` is
        false (US-ACCT-003). Confidential: served only to a caller holding `keys:manage` or
        `keys:read`, and never written to an audit record or used as a metric label.
      anyOf:
        - { type: "null" }
        - { type: string, format: ipv4 }
        - { type: string, format: ipv6 }
    KeyVerificationNotRead:
      type: object
      additionalProperties: false
      required: [passed]
      description: >
        The verification of a key whose rights were never read: the exchange refused the key-info
        call (step 1 of `createApiKey`: an unknown key, the egress IP, a right or an expiry), so
        no check of steps 2 to 7 ran. It carries `passed: false` and `egress_ip` only, never
        `withdraw_enabled`: a withdrawal check that did not run is not a pass, so no `false` is
        sent for it (C-2.8), and a client shows each check as not checked, never as ok. The rule
        that failed is in `errors` (`createApiKey`) or `rest.error` (`testApiKey`). It is never the
        verification of a stored key (`KeyVerificationPassed`).
      properties:
        passed: { const: false }
        egress_ip: { $ref: "#/components/schemas/EgressIp" }
    KeyVerificationWarning:
      type: string
      enum: [key_expiring_soon, clock_skew]
      description: >
        Closed vocabulary (SR-E27-08). `key_expiring_soon`: the key expires within 14 days
        (`createApiKey` step 6). `clock_skew`: the probe measured a `clock_offset_ms` whose
        absolute value is above 500 ms, the exchange clock guard's warning threshold
        (`24-internal-schemas.md` §14.2 item 9).
    KeyProbeError:
      type: string
      enum:
        [
          auth_error,
          permission_denied,
          ip_not_allowed,
          clock_drift,
          rate_limited,
          service_unavailable,
          transport_error,
          timeout,
          exchange_unknown,
        ]
      description: >
        Closed vocabulary for a failed probe (SR-E27-08), named after the internal exchange-error
        taxonomy (`24-internal-schemas.md` §8.6). `auth_error`: key or signature refused
        (`10003`, `10004`) or the private WS refused `auth`. `permission_denied`: `10005`.
        `ip_not_allowed`: `10010` or HTTP 403. `clock_drift`: `10002`. `rate_limited`: `10006`,
        `10018`, `10429` or HTTP 429; in `KeyTestResult.websocket` it is also the deployment's own
        budget of private WS connections opened for tests being spent (SR-E27-05), when no
        connection is opened at all. `service_unavailable`: `10016`, `10019` or HTTP 5xx.
        `transport_error`: the connection failed or was reset. `timeout`, which refines §8.6's
        `TRANSPORT_ERROR`: no answer before the probe deadline. `exchange_unknown`: any other
        non-zero exchange refusal code (the code itself is in `ret_code`). The probe has its own
        translation table, owned and tested by E27-T03 (#836); it does not reuse the adapter's
        general mapping of exchange refusal codes (`map_ret_code`), which folds `10005` and
        `10010` into an auth error and `10016` and `10019` into a rate-limit error. No exchange
        error text, header, URL or request fragment is echoed.
    ApiKeyWithVerification:
      type: object
      description: >
        The `201` of `createApiKey`: the key is stored only if every check passes, so both members
        are always present and `verification` is the full `KeyVerification` with `passed: true`.
        A key that fails a check is a `422`, never this body.
      required: [key, verification]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        verification: { $ref: "#/components/schemas/KeyVerificationPassed" }
    KeyVerificationPassed:
      description: >
        A `KeyVerification` of a key that passed every check: the one verification a stored key
        has, and the only one a `201` carries (`ApiKeyWithVerification`). A failed check is never
        shown in it.
      allOf:
        - { $ref: "#/components/schemas/KeyVerification" }
        - type: object
          properties: { passed: { const: true } }
    KeyRejectedProblem:
      description: >
        The `422` problem of a key operation (`createApiKey`; `rotateApiKey` can reuse it): the
        problem body plus, when the verification pipeline refused the key, the `verification` it
        reached. Exactly then `errors` names a rule of the pipeline (`key_*`), `verification` is
        required and `verification.passed` is false, and otherwise it is not allowed. A request
        that fails its schema is the same problem with the validation types in `errors` and no
        `verification`. The fields of a check that did not run are left out of `verification`,
        and no exchange text is echoed (SR-E27-08).
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          properties:
            code: { const: validation_failed }
            verification:
              oneOf:
                - { $ref: "#/components/schemas/KeyVerification" }
                - { $ref: "#/components/schemas/KeyVerificationNotRead" }
          if:
            required: [errors]
            properties:
              errors:
                contains:
                  type: object
                  required: [rule]
                  properties: { rule: { type: string, pattern: "^key_" } }
          then:
            required: [verification]
            properties: { verification: { properties: { passed: { const: false } } } }
          else:
            not: { required: [verification] }
    KeyExchangeProblem:
      description: >
        The `502` and `503` problems of a key operation: the problem body whose `exchange` member
        holds the exchange's return code only, never `ret_msg`, `endpoint`, `request_id` or any
        other exchange text (SR-E27-08): the text of a refused signature can echo the signed
        request, key id included. This schema alone refuses the other members: the generated
        Python class re-declares `exchange` with the type of `Problem`, which also admits
        `ret_msg`, `endpoint` and `request_id`, so a body built from that class type-checks while
        it leaks exchange text. A route builds `exchange` from the return code alone, and its
        provider test validates the real `502` and `503` against this schema.
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          properties:
            exchange:
              type: object
              additionalProperties: false
              properties: { ret_code: { type: integer } }
    RotateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [api_key, api_secret]
      description: "No overlap field: the rotation overlap is one fixed value (`rotateApiKey`, SR-E27-10)."
      properties:
        api_key: { type: string, format: password }
        api_secret: { type: string, format: password }
        label: { type: string, maxLength: 80 }
    ApiKeyRotation:
      type: object
      properties:
        rotation_id: { type: string, format: uuid }
        old_key_id: { type: string, format: uuid }
        new_key: { $ref: "#/components/schemas/ApiKey" }
        verification: { $ref: "#/components/schemas/KeyVerification" }
        overlap_until: { type: string, format: date-time }
        state: { type: string, enum: [overlapping, completed, failed] }
    KeyTestResult:
      type: object
      properties:
        passed:
          type: boolean
          description: >
            True only when the verification passed, the REST probe succeeded and, with
            `include_ws`, the private WS `auth` succeeded.
        checked_at: { type: string, format: date-time }
        rest:
          type: object
          properties:
            ok: { type: boolean }
            latency_ms: { type: integer }
            ret_code: { type: ["integer", "null"] }
            error: { oneOf: [{ $ref: "#/components/schemas/KeyProbeError" }, { type: "null" }] }
        websocket:
          type: object
          description: >
            Omitted when `include_ws` is false: that half did not run, and no `ok: true` is sent
            for it.
          properties:
            ok: { type: boolean }
            latency_ms: { type: ["integer", "null"] }
            error: { oneOf: [{ $ref: "#/components/schemas/KeyProbeError" }, { type: "null" }] }
        verification:
          description: >
            The verification as far as the pipeline got. Omitted when the REST half reached no
            verdict (a timeout, an outage, a refused signature, a clock outside the `recv_window`
            or a rate limit): an earlier check's standing result is never shown in its place,
            because an outage must not read as a pass (SR-E27-18). A key the exchange refused
            before its rights were read is `KeyVerificationNotRead`.
          oneOf:
            - { $ref: "#/components/schemas/KeyVerification" }
            - { $ref: "#/components/schemas/KeyVerificationNotRead" }
    Offset:
      type: object
      description: A distance expressed in one of several units; resolved server-side to a price.
      additionalProperties: false
      required: [unit, value]
      properties:
        unit: { $ref: "#/components/schemas/OffsetUnit" }
        value: { $ref: "#/components/schemas/Decimal" }
        atr_period:
          {
            type: integer,
            minimum: 2,
            maximum: 200,
            default: 14,
            description: "Used when `unit=atr`.",
          }
        atr_bar_type: { $ref: "#/components/schemas/BarType" }
        atr_param: { type: string, maxLength: 24 }
    Sizing:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/SizingMode" }
        qty: { $ref: "#/components/schemas/Decimal" }
        notional_usd: { $ref: "#/components/schemas/Decimal" }
        pct:
          {
            $ref: "#/components/schemas/Decimal",
            description: "Percent of equity (`pct_equity`) or of the position (`pct_position`).",
          }
        risk_per_trade_usd: { $ref: "#/components/schemas/Decimal" }
        risk_per_trade_pct: { $ref: "#/components/schemas/Decimal" }
        max_notional_usd: { $ref: "#/components/schemas/Decimal" }
        round_to_lot: { type: boolean, default: true }
      examples:
        - {
            mode: risk_based,
            risk_per_trade_usd: "250",
            max_notional_usd: "50000",
            round_to_lot: true,
          }
    RiskCaps:
      type: object
      additionalProperties: false
      properties:
        max_daily_loss_usd: { $ref: "#/components/schemas/Decimal" }
        max_daily_loss_pct: { $ref: "#/components/schemas/Decimal" }
        max_open_positions: { type: integer, minimum: 0, maximum: 100 }
        max_position_notional_usd: { $ref: "#/components/schemas/Decimal" }
        max_orders_per_minute: { type: integer, minimum: 1, maximum: 600 }
        max_consecutive_losses: { type: integer, minimum: 1, maximum: 50 }
        lockout_minutes_after_breach: { type: integer, minimum: 0, maximum: 1440, default: 60 }
    AccountProfileInput:
      type: object
      required: [name, leverage, sizing]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        leverage: { $ref: "#/components/schemas/Decimal" }
        sizing: { $ref: "#/components/schemas/Sizing" }
        stop_loss: { $ref: "#/components/schemas/Offset" }
        take_profit: { $ref: "#/components/schemas/Offset" }
        trailing_stop: { $ref: "#/components/schemas/Offset" }
        risk_caps: { $ref: "#/components/schemas/RiskCaps" }
        allowed_symbols:
          type: array
          description: Empty means "all instruments permitted by the deployment".
          items: { $ref: "#/components/schemas/Symbol" }
        require_native_stop:
          type: boolean
          const: true
          default: true
          description: Always true; the safety invariant cannot be disabled (arch P4).
        default_time_in_force: { $ref: "#/components/schemas/TimeInForce" }
        default_tpsl_mode: { $ref: "#/components/schemas/TpSlMode" }
    AccountProfile:
      allOf:
        - $ref: "#/components/schemas/AccountProfileInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            exchange_account_id: { type: string, format: uuid }
            is_active: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    # === Instruments / market data ==========================================
    Instrument:
      type: object
      required: [symbol, category, tick_size, qty_step]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        category: { const: linear }
        base_coin: { type: string }
        quote_coin: { type: string }
        settle_coin: { type: string }
        contract_type: { type: string, examples: [LinearPerpetual] }
        status: { type: string, enum: [Trading, PreLaunch, Delivering, Closed] }
        tick_size: { $ref: "#/components/schemas/Decimal" }
        price_scale: { type: integer }
        qty_step: { $ref: "#/components/schemas/Decimal" }
        min_order_qty: { $ref: "#/components/schemas/Decimal" }
        max_order_qty: { $ref: "#/components/schemas/Decimal" }
        min_notional_value: { $ref: "#/components/schemas/Decimal" }
        max_leverage: { $ref: "#/components/schemas/Decimal" }
        leverage_step: { $ref: "#/components/schemas/Decimal" }
        funding_interval_minutes: { type: integer }
        launch_time: { type: string, format: date-time }
        copy_trading: { type: boolean }
        revision:
          {
            type: integer,
            description: "Increments whenever Bybit changes the instrument metadata.",
          }
        updated_at: { type: string, format: date-time }
        delisted:
          {
            type: boolean,
            description: "Derived: true when `status` is not `Trading` or `PreLaunch`.",
          }
        status_reason:
          {
            type: ["string", "null"],
            description: "Human-readable explanation of `status`, for screen readers (#182).",
          }
    InstrumentDetail:
      allOf:
        - $ref: "#/components/schemas/Instrument"
        - type: object
          properties:
            risk_limit_tiers:
              type: array
              items:
                type: object
                properties:
                  tier: { type: integer }
                  risk_limit_value: { $ref: "#/components/schemas/Decimal" }
                  initial_margin: { $ref: "#/components/schemas/Decimal" }
                  maintenance_margin: { $ref: "#/components/schemas/Decimal" }
                  max_leverage: { $ref: "#/components/schemas/Decimal" }
            recorded: { type: boolean }
            recording_started_at: { type: ["string", "null"], format: date-time }
            stale_since:
              {
                type: ["string", "null"],
                format: date-time,
                description: "When this instrument's cache entry started missing refresh cadence.",
              }
    Ticker:
      type: object
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        last_price: { $ref: "#/components/schemas/Decimal" }
        mark_price: { $ref: "#/components/schemas/Decimal" }
        index_price: { $ref: "#/components/schemas/Decimal" }
        bid1_price: { $ref: "#/components/schemas/Decimal" }
        bid1_size: { $ref: "#/components/schemas/Decimal" }
        ask1_price: { $ref: "#/components/schemas/Decimal" }
        ask1_size: { $ref: "#/components/schemas/Decimal" }
        price_change_pct_24h: { $ref: "#/components/schemas/Decimal" }
        high_24h: { $ref: "#/components/schemas/Decimal" }
        low_24h: { $ref: "#/components/schemas/Decimal" }
        volume_24h: { $ref: "#/components/schemas/Decimal" }
        turnover_24h: { $ref: "#/components/schemas/Decimal" }
        open_interest: { $ref: "#/components/schemas/Decimal" }
        open_interest_value: { $ref: "#/components/schemas/Decimal" }
        funding_rate: { $ref: "#/components/schemas/Decimal" }
        next_funding_time: { type: string, format: date-time }
        ts: { type: string, format: date-time }
        stale: { type: boolean }
    Bar:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        index:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: "Bar index, strictly increasing within (series, generation) (24 §3.1). Always present on /market/bars; `t` may repeat for non-time bars (#2014).",
          }
        generation:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: "ADR-0033 series generation (= epoch): an opaque id that a builder cold start or a rebuild replaces, normally with a higher one; index restarts inside it. Compare for equality only: a change in either direction is a new epoch. Never read it as a time. Always present on /market/bars.",
          }
        t:
          {
            type: string,
            format: date-time,
            description: "Bar open time; not unique for non-time bars.",
          }
        close_time: { type: string, format: date-time, description: "Present for non-time bars." }
        o: { $ref: "#/components/schemas/Decimal" }
        h: { $ref: "#/components/schemas/Decimal" }
        l: { $ref: "#/components/schemas/Decimal" }
        c: { $ref: "#/components/schemas/Decimal" }
        v: { $ref: "#/components/schemas/Decimal" }
        turnover: { $ref: "#/components/schemas/Decimal" }
        trades: { type: integer }
