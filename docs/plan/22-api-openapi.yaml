  # ===========================================================================
  # REPLAY
  # ===========================================================================
  /replay/sessions:
    get:
      tags: [replay]
      operationId: listReplaySessions
      summary: List the caller's replay sessions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ReplayState" }
      x-rbac: { permissions: [replay:read], scope: self }
      responses:
        "200":
          description: Replay sessions page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ReplaySession" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [replay]
      operationId: createReplaySession
      summary: Create a tick-replay session over recorded data
      description: |
        Replay injects recorded events into the *same* normalizer → book → bar → order-flow
        chain as live ingestion (arch P2), so every derived view is bit-identical to what was
        seen live. The session is addressed by its `id` on the WS: subscribing with
        `replay_session_id` set routes market-data topics from the replay clock instead of the
        live clock.

        `speed` is a multiplier (0.1–100) or `step` for manual frame-stepping. `paper_account_id`
        optionally attaches the paper matcher so orders can be practised against the replayed
        book; fills are simulated locally and never reach Bybit.

        A window lacking recorded coverage is rejected with `no_data_recorded` (422) —
        `GET /market/data-coverage` tells the UI in advance.
      x-rbac: { permissions: [replay:write], scope: self }
      x-idempotency: recommended
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReplaySessionRequest" }
            examples:
              btcMorning:
                value:
                  symbols: [BTCUSDT]
                  from: "2026-09-10T13:00:00Z"
                  to: "2026-09-10T15:00:00Z"
                  speed: 1
                  streams: [trades, orderbook_delta, tickers, liquidations]
                  depth: 200
                  paper_account_id: "a1000000-0000-4000-8000-000000000002"
                  autostart: true
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplaySession" }
              examples:
                created:
                  value:
                    id: "bb000000-0000-4000-8000-000000000001"
                    state: buffering
                    symbols: [BTCUSDT]
                    from: "2026-09-10T13:00:00Z"
                    to: "2026-09-10T15:00:00Z"
                    cursor_ts: "2026-09-10T13:00:00Z"
                    speed: 1
                    streams: [trades, orderbook_delta, tickers, liquidations]
                    depth: 200
                    paper_account_id: "a1000000-0000-4000-8000-000000000002"
                    created_by: "11111111-2222-3333-4444-555555555555"
                    created_at: "2026-09-14T10:32:00Z"
                    progress_pct: 0
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /replay/sessions/{replayId}:
    parameters: [{ $ref: "#/components/parameters/ReplayId" }]
    get:
      tags: [replay]
      operationId: getReplaySession
      summary: Get a replay session
      x-rbac: { permissions: [replay:read], scope: self }
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplaySession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [replay]
      operationId: deleteReplaySession
      summary: Destroy a replay session and free its buffers
      x-rbac: { permissions: [replay:write], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
