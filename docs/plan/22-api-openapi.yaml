  # ---------------------------------------------------------------------------
  # Session-scoped identity & preferences ("me" surface used by SCR-010..019,
  # SCR-140..149). Added by the cross-doc contract reconciliation pass; these were
  # referenced by 14-screens-catalogue.md but previously absent from this file.
  # ---------------------------------------------------------------------------
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current identity, role, effective permissions and account grants
      description: >
        Single bootstrap call for the app shell. Returns the authenticated user, their
        role, the flattened effective permission set (the same closed vocabulary used by
        `x-rbac.permissions`), and the accounts they may read/trade. The UI uses this to
        decide which affordances to render; it is never the authorisation control itself
        (04-security-program.md section 7.3).

        Self only: the caller is the session's user and nothing else selects whom it describes, so
        any query parameter is refused with `422` (SR-026). `role` is the highest role the user
        holds (`owner`, then `manager`, then `viewer`); `permissions` is the union over every live
        role. `accounts` lists every live account for an owner (mode `trade`) and, for anyone else,
        the live, unfrozen accounts they hold a view grant on (`trade` only with the trade grant).
        `session.environment` is the deployment's environment, `session.elevated_until` the latest
        live step-up grace expiry on the session (`null` when none) and
        `session.one_click_armed_until` is `null` until one-click arming is served.
        `onboarding_complete` is not served yet and is omitted. A user with no live role is
        `403 forbidden`. `503 store_unavailable`: the session backend is not active, or it raised
        `RuntimeError` while the access token was checked; nothing was read.
        `501 not_implemented`: the session backend is active but no identity provider is wired.
        The API wires both or neither, so the fake storage backend (no session backend) answers
        `503` first. A `501` is answered once the access token is accepted; nothing is read or
        served. The response is `Cache-Control: no-store`.
      x-rbac: { permissions: [], scope: self }
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/preferences:
    get:
      tags: [settings]
      operationId: getMyPreferences
      summary: Read own effective settings
      description: >
        Alias of `GET /settings` scoped to the calling user; kept as a distinct operation
        because the app shell fetches it alongside `/me` on boot.

        Self only: any query parameter is refused with `422` (SR-026). Until a store for
        per-user overrides and a deployment default set exist, the effective settings are empty
        (`_meta.overridden` is `[]`) and the client applies its built-in defaults.
        `503 store_unavailable`: the session backend is not active, or it raised `RuntimeError`
        while the access token was checked; nothing was read. `501 not_implemented`: the session
        backend is active but no identity provider is wired. The API wires both or neither, so
        the fake storage backend (no session backend) answers `503` first. A `501` is answered
        once the access token is accepted; nothing is read or served. The response is
        `Cache-Control: no-store`.
      x-rbac: { permissions: [settings:read], scope: self }
      responses:
        "200":
          description: Effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [settings]
      operationId: updateMyPreferences
      summary: Patch own settings
      x-rbac: { permissions: [settings:write], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: List own active sessions
      x-rbac: { permissions: [], scope: self }
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UserSession" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [auth]
      operationId: revokeMySession
      summary: Revoke one of own sessions
      description: >
        Revoking the current session is equivalent to logout. Revocation terminates any
        WebSocket connection bound to that session immediately (23-ws-protocol.md section 9.5).
        On `503` (the audit sink is not active or refused the record, or the session backend is
        not wired) nothing was revoked and no cookie was cleared (C-2.9).
      x-rbac: { permissions: [], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/limits:
    get:
      tags: [settings]
      operationId: getMyLimits
      summary: Effective rate-limit and risk-cap budget for the caller
      description: >
        Per-account rate budget (20-architecture.md section 4.3) and the risk caps that
        currently apply to the caller, so the order ticket can show remaining headroom
        before a submission is attempted.
      x-rbac: { permissions: [settings:read], scope: self }
      responses:
        "200":
          description: Effective limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveLimits" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/keymap:
    get:
      tags: [settings]
      operationId: getMyKeymap
      summary: Resolved hotkey bindings for the active profile
      description: >
        Flattened view of the active `HotkeyProfile`, used by the hotkey cheatsheet
        (SCR-013) and the command palette (SCR-012).

        Self only: any query parameter is refused with `422` (SR-026). While the caller has no
        stored profile, `hotkey_profile_id` is absent and `bindings` is empty, and the client
        applies its built-in keymap. `503 store_unavailable`: the session backend is not active,
        or it raised `RuntimeError` while the access token was checked; nothing was read.
        `501 not_implemented`: the session backend is active but no identity provider is wired.
        The API wires both or neither, so the fake storage backend (no session backend) answers
        `503` first. A `501` is answered once the access token is accepted; nothing is read or
        served. The response is `Cache-Control: no-store`.
      x-rbac: { permissions: [settings:read], scope: self }
      responses:
        "200":
          description: Active keymap.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotkey_profile_id: { type: string, format: uuid }
                  bindings: { type: array, items: { $ref: "#/components/schemas/HotkeyBinding" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/step-up:
    post:
      tags: [auth]
      operationId: authStepUp
      summary: Elevate the current session for one action class with password and TOTP
      description: >
        Requires the caller's **password and a TOTP code** (owner decision #1778 AE). The
        password is verified first (same Argon2id path and lockout counters as login), then the
        code. A missing or empty `password`, or one longer than 512 characters (the cap of
        `LoginRequest.password`, so no longer password exists), is `422`, decided before any
        factor is checked and counting no failure; any wrong factor is the same `401 mfa_invalid`
        and never reveals which one failed.

        **Challenges (#2304).** Every `403 step_up_required` is a challenge for the one request it
        refused. Its problem body carries `challenge_id`, `challenge_expires_at` (5 minutes after
        issue), `action_class`, `action_summary` and `target` (see `Problem`). A challenge is
        issued only to a caller the operation would otherwise admit: authentication, CSRF, session
        state, request validation, RBAC permission and account scope are all decided before the
        step-up gate, and a caller refused by any of them gets that refusal (such as
        `401 unauthenticated`, `403 forbidden`, `403 account_scope_denied` or `404 not_found`),
        never a challenge, so `action_summary` never resolves a label the caller may not read. The
        server composes `action_summary` from the validated request with a fixed per-route
        template, so it names what would execute. Request values appear in it only as validated
        enum values or as identifiers and server-resolved labels, never as free text such as a
        `reason` and never as credential material; the client shows it verbatim and never composes
        its own. A label never identifies an account or a rule on its own: each account named in
        it is followed by its `environment` and `exchange_uid` and each rule by the environments
        its scope includes, rendered bare, and every label is escaped before it is quoted (see
        `Problem`; naming a rule this way is provisional until the route slice of #2304 settles
        it). A session has at most one live challenge. A newer `403 step_up_required`
        supersedes it, and it also ends when a step-up uses it, at `challenge_expires_at`, when
        the session turns read-only and when it idle-locks (#2301). This operation elevates
        against the live challenge: `challenge_id`, when sent, must name it. A step-up for a
        no-grace class (named by the live challenge or by `action_class`) must send it: without
        it, or without a live challenge, the answer is `400`, so `action_class` alone never
        elevates a no-grace class. Audit: `auth.step_up_required` records the `challenge_id`;
        `auth.step_up_granted` records it too, plus the bound request's SHA-256 fingerprint for a
        no-grace class; `auth.step_up_mismatch` records the bound and the refused request's
        fingerprints. No audit record carries `action_summary`, `target`, a request body, the
        password or the code.

        **Binding (no-grace classes).** For each no-grace class the one-shot grant
        is bound to the challenged request: its method, its path including any query string, and
        its canonical JSON body. The fingerprint is the hex SHA-256 of the method, a line feed,
        the raw request target (path and query string exactly as received, with no
        percent-decoding and no trailing-slash or parameter-order normalisation), a line feed,
        and the RFC 8785 (JCS) serialisation of the body as the operation validated it (empty
        when the operation takes no body). The server parses and validates the body once, and
        `action_summary`, the fingerprint and the executed action all come from that one object,
        so number forms, string escapes and duplicate member names cannot make them disagree; no
        Unicode normalisation is applied. Headers, `Idempotency-Key` included, are not part of
        the binding. Only that identical request can use the grant. Any other request of the
        class is refused with `403 step_up_required`, which is a new challenge for that request,
        and audited as `auth.step_up_mismatch`. The refusal does not use up the grant: it stays
        bound to the challenged request until that request uses it or a newer step-up for the
        class replaces it. The grant expires 60 seconds after the step-up, which leaves time only
        for the immediate re-send, and it also ends when the session turns read-only, when it
        idle-locks (#2301) and at logout. For a no-grace class the `200`'s `elevated_until` is
        that expiry, 60 seconds after the step-up, and its `step_up_expires_at` is null. A
        session holds at most one grant per no-grace class. Grace classes keep the unbound
        5-minute window described below.

        **Write-ahead audit and `503` (C-2.9).** The record an answer depends on is written
        before the answer is sent: `auth.step_up_mismatch` before the `403` that refuses a
        swapped request, `auth.step_up_failed` before the `400` of a challenge that cannot be
        answered (while the per-session refusal budget lasts) and `auth.mfa_reset_by_owner` before
        an owner TOTP reset revokes anything. When the audit writer cannot take that record within
        2 seconds (it is down, not started or too slow) the answer is `503 audit_unavailable`
        instead, whatever the refusal would have been: no challenge is issued, no failure is
        counted, nothing is elevated or revoked, and a grant bound to a held request is neither
        used nor ended, so the client sends the same request again once the audit writer
        recovers. An operation that gates a no-grace class lists the same `503` among its
        responses and answers it when the `auth.step_up_mismatch` record of its refusal cannot
        be written; `resetUserMfa` answers it when its own record cannot.

        **Holding the refused request.** The client keeps the refused request unchanged (method,
        path, body and `Idempotency-Key`) and re-sends it as is after a successful step-up. The
        refusal bound no idempotency key (Idempotency, "Binding point"), so the re-send is a
        first submission and executes once. On cancel, at `challenge_expires_at`, on the third
        failure (`session_read_only`), on idle lock and at absolute session expiry the client
        drops the request without sending it and tells the user it was not sent. If the re-send
        gets no answer after a successful step-up (a network error or a timeout), the action may
        have executed: the client never reports it as not sent and never re-sends it on its own,
        and reads the affected state back to learn the outcome.

        Grants a **5-minute** server-side grace for `action_class` on the current session
        (24-internal-schemas.md section 15.2/15.3; the ticket value of 5 minutes supersedes the
        earlier 15). `live_enablement`, `killswitch` and `backups` are no-grace: the response is
        `single_use: true` and no window is opened. Three consecutive invalid codes downgrade the
        session to read-only for 5 minutes (`403 session_read_only` on every write). Endpoints
        that require elevation return `403` with `code: step_up_required` until this
        succeeds. Always audited (`auth.step_up_required`, `auth.step_up_granted`,
        `auth.step_up_failed`, `auth.step_up_mismatch`,
        `auth.session_readonly_downgrade`).

        **Session rotation (SR-013).** A successful step-up also rotates the session, the way
        `POST /auth/refresh` does: the server mints a replacement session with a new id, access
        token and refresh token. The replacement keeps the old session's absolute expiry and
        idle timeout, so rotation never extends the session's lifetime; it carries over the live
        step-up grants, including the one just granted, and drops the pending challenge. The old
        session is revoked as `rotated` and linked into the session family, so its access and
        refresh tokens stop working at once and replaying that refresh token at
        `POST /auth/refresh` revokes the whole family (reuse detection). The `200` carries the
        new access token in `tokens` (the `TokenBundle` of `POST /auth/mfa/verify`; the refresh
        token travels only in the cookie, so `refresh_token` is null) and sets rotated
        `cv_refresh` and `__Host-cv_csrf` cookies bound to the new session (SR-041). The client
        continues with the returned access token. A client that loses the `200` keeps only the
        old tokens: its next `POST /auth/refresh` trips reuse detection, so the user must sign in
        again.
      x-rbac: { permissions: [], scope: self }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
                password:
                  { type: string, minLength: 1, maxLength: 512, format: password, writeOnly: true }
                challenge_id:
                  description: >
                    The `challenge_id` of the `403 step_up_required` being answered (#2304).
                    Required for a no-grace class (`live_enablement`, `killswitch` or `backups`,
                    named by the live challenge or by `action_class`): omitting it is
                    `400 validation_failed` with
                    `errors: [{field: challenge_id, rule: challenge_required}]`. Optional for a
                    grace class: without it the server uses the session's live challenge. This
                    grace-class optionality is transitional and ends with #2725 (the web client
                    sends `challenge_id` on every step-up); from then on it is required whenever
                    the session has a live challenge. A value that does not name the live
                    challenge (expired, superseded, already used or unknown), or that is sent
                    when there is none, gets `400 validation_failed` with
                    `errors: [{field: challenge_id, rule: challenge_expired}]`. Either `400` is
                    decided before the password and code are checked: no factor is verified, no
                    failure is counted and nothing is elevated. The client then drops the held
                    request without sending it.
                  type: string
                  format: uuid
                action_class:
                  description: >
                    Optional cross-check. The server elevates the class its last
                    `403 step_up_required` challenged on this session; a different
                    value is `400`. Without a pending challenge it is required.
                    `audit` gates the audit-log export (`exportAuditLog`) and the download of
                    its file (`downloadAuditExport`); `backups` gates a backup restore
                    or a download-link issue or delete (`restoreBackup`, `issueBackupDownload`,
                    `deleteBackup`), one fresh code per action.
                  type: string
                  enum:
                    [
                      keys,
                      users,
                      live_enablement,
                      killswitch,
                      risk_caps,
                      recorder,
                      flags,
                      audit,
                      backups,
                    ]
      responses:
        "200":
          description: Elevated; the session was rotated.
          headers:
            Set-Cookie:
              {
                description: "Rotated `cv_refresh` cookie and a rotated `__Host-cv_csrf` cookie bound to the new session (SR-041)",
                schema: { type: string },
              }
          content:
            application/json:
              schema:
                type: object
                required: [elevated_until, action_class, single_use, tokens]
                properties:
                  elevated_until: { type: string, format: date-time }
                  action_class: { type: string }
                  single_use: { type: boolean }
                  step_up_expires_at:
                    type: ["string", "null"]
                    format: date-time
                    description: End of the grace window shown in the dialog; null for no-grace classes.
                  tokens: { $ref: "#/components/schemas/TokenBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: >
            A dependency is unavailable or data is degraded. This keeps every meaning of
            `ServiceUnavailable` (such as `store_unavailable`), whose examples apply unchanged. It
            is `code: audit_unavailable` when the audit record an answer is written ahead of cannot
            be written (see "Write-ahead audit and `503`" above), and `code: auth_unavailable` when
            the second factor cannot be checked (see `AuthUnavailable`, whose rules apply to this
            operation unchanged).
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                auditUnavailable:
                  value:
                    {
                      type: "https://candleviewer.local/errors/audit_unavailable",
                      title: "Write-ahead audit record could not be written (or no audit backend is wired); refused, fail closed (C-2.9)",
                      status: 503,
                      detail: "audit unavailable",
                      instance: "urn:cv:req:0193f2bb-5041",
                      code: audit_unavailable,
                    }
                mfaUnavailable:
                  value:
                    {
                      type: "https://candleviewer.local/errors/auth_unavailable",
                      title: "Second factor temporarily unavailable",
                      status: 503,
                      detail: "Two-factor authentication is temporarily unavailable; try again later.",
                      instance: "urn:cv:req:0193f2bb-5031",
                      code: auth_unavailable,
                      retry_after_seconds: 30,
                    }

  /users/{userId}/mfa/reset-preview:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    get:
      tags: [users]
      operationId: previewMfaReset
      summary: Show the target's open-position state before an owner TOTP reset
      x-rbac: { permissions: [users:write], scope: none }
      responses:
        "200":
          description: Preview.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    target_user_id,
                    open_position_count,
                    positions,
                    position_source,
                    requires_acknowledge_unknown_positions,
                    message,
                  ]
                properties:
                  target_user_id: { type: string, format: uuid }
                  open_position_count:
                    type: [integer, "null"]
                    minimum: 0
                    description: Null when the position state is unknown - never a fabricated 0.
                  positions: { type: string, enum: [known, unavailable] }
                  position_source:
                    type: string
                    description: Backing store; `not_deployed` until the OMS position store lands.
                  requires_acknowledge_unknown_positions: { type: boolean }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /users/{userId}/mfa/reset:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    post:
      tags: [users]
      operationId: resetUserMfa
      summary: Owner-initiated TOTP reset (owner, step-up `users`)
      description: >
        Revokes the target's TOTP methods and all their sessions, and sets the target's
        `mfa_required`, so their next sign-in gets an enrolment-only session that must enrol a
        new TOTP method first (see "Enrolment-only session"). Does not cancel orders or
        flatten positions and reveals no secret. Self-reset is refused. Audited as
        `auth.mfa_reset_by_owner`. When the position state is unavailable the request must carry
        `acknowledge_unknown_positions: true`, otherwise `409 positions_unknown`.
      x-rbac: { permissions: [users:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                acknowledge_unknown_positions: { type: boolean, default: false }
      responses:
        "200":
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required: [target_user_id, methods_revoked, sessions_revoked]
                properties:
                  target_user_id: { type: string, format: uuid }
                  methods_revoked: { type: integer }
                  sessions_revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/mfa/recovery:
    post:
      tags: [auth]
      operationId: authMfaRecovery
      summary: Complete an MFA challenge with a single-use recovery code
      description: >
        Completes the `POST /auth/login` challenge with a recovery code instead of the second
        factor. Consumes one `recovery_codes` row. Consumption is audited and raises a
        `security.mfa_recovery_used` system event. Every recovery sign-in forces TOTP
        re-enrolment, however many codes remain. It revokes every MFA method of the user,
        terminally, so no old method can be confirmed again, and every other session of the user
        (revoke-all on a TOTP change, ADR-0010 decision 2; each audited as
        `auth.session_revoked`, and their sockets close). The `200` then mints an
        **enrolment-only** session (see "Enrolment-only session") with the `cv_refresh` and
        `__Host-cv_csrf` cookies. That session may only enrol and confirm a new TOTP method; the
        confirmation issues 10 new recovery codes and invalidates what is left of the old set.
        For a user with `mfa_required` false the call fails closed: no session is minted and
        nothing is consumed (C-12.2 forbids such a user). `Idempotency-Key` is ignored, as on
        `POST /auth/mfa/verify`: the response holds tokens, which are never stored for a replay.
        Runs before any session exists, like `POST /auth/mfa/verify`.
      security: []
      x-rbac: { permissions: [], scope: none }
      x-idempotency: ignored
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, recovery_code]
              additionalProperties: false
              properties:
                mfa_token: { type: string }
                recovery_code: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200":
          description: Authenticated; the session is enrolment-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedResponse" }
          headers:
            Set-Cookie:
              {
                description: "`cv_refresh` cookie and a fresh `__Host-cv_csrf` cookie (SR-041)",
                schema: { type: string },
              }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /onboarding/checklist:
    get:
      tags: [settings]
      operationId: getOnboardingChecklist
      summary: First-run / setup checklist state (E09-S06)
      description: >
        Drives SCR-019. Every step state is evaluated server-side from read-only probes run with
        the caller's own identity (US-ONB-007: no step may be faked client-side). Each probe has
        a 250 ms budget; a probe that times out or fails yields `state=error` for that step only,
        and an owning epic that has not shipped yields `state=pending` with a feature-flag reason.
      x-rbac: { permissions: [], scope: self }
      responses:
        "200":
          description: Checklist state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingChecklist" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /onboarding/checklist/dismiss:
    post:
      tags: [settings]
      operationId: dismissOnboardingChecklist
      summary: Dismiss the completed checklist summary (persisted per user)
      description: >
        Only accepted once every step is `ok`; otherwise 409. Stored server-side so the card
        stays gone on every device.
      x-rbac: { permissions: [], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Dismissed. }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "409": { description: Checklist is not complete. }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /onboarding/complete:
    post:
      tags: [settings]
      operationId: completeOnboarding
      summary: Mark the onboarding wizard finished for the caller
      x-rbac: { permissions: [], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Marked complete. }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /invites/{inviteToken}:
    parameters:
      - name: inviteToken
        in: path
        required: true
        schema: { type: string, minLength: 16, maxLength: 128 }
    get:
      tags: [users]
      operationId: getInvite
      summary: Resolve an invitation token (unauthenticated)
      description: >
        Returns only the minimum needed to render the acceptance form - the invited display
        name and the role being offered. It never reveals whether other users exist, and an
        expired or consumed token is indistinguishable from an unknown one (`404`), per
        04-security-program.md section 7.3.
      x-rbac: { permissions: [], scope: none }
      responses:
        "200":
          description: Invite is valid.
          content:
            application/json:
              schema:
                type: object
                required: [display_name, role, expires_at]
                properties:
                  display_name: { type: string }
                  role: { $ref: "#/components/schemas/RoleName" }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: Too many invalid attempts from this address. }
    post:
      tags: [users]
      operationId: redeemInvite
      summary: Set the password and start TOTP enrolment (unauthenticated)
      description: >
        Consumes the single-use token and parks the password hash; the account stays `invited`
        until `confirmInvite`. The body carries only `password` - a `role`/`roles` field is
        refused with `403` and audited (role immutability). Unknown, expired, redeemed and
        revoked tokens all return the same `404`.
      x-rbac: { permissions: [], scope: none }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 12, maxLength: 512 }
      responses:
        "200":
          description: TOTP enrolment started.
          content:
            application/json:
              schema:
                type: object
                required: [method_id, otpauth_uri, secret_base32]
                properties:
                  method_id: { type: string }
                  otpauth_uri: { type: string }
                  secret_base32: { type: string }
        "403": { description: A role field was supplied; the invited role cannot be changed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Password violates the policy. }
        "429": { description: Too many invalid attempts from this address. }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /invites/{inviteToken}/confirm:
    parameters:
      - name: inviteToken
        in: path
        required: true
        schema: { type: string, minLength: 16, maxLength: 128 }
    post:
      tags: [users]
      operationId: confirmInvite
      summary: Verify the first TOTP code and activate the account (unauthenticated)
      description: >
        Activates the account and returns the one-time recovery codes. No session is minted.
      x-rbac: { permissions: [], scope: none }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method_id, code]
              additionalProperties: false
              properties:
                method_id: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Account active.
          content:
            application/json:
              schema:
                type: object
                required: [status, role, recovery_codes]
                properties:
                  status: { type: string, enum: [active] }
                  role: { $ref: "#/components/schemas/RoleName" }
                  recovery_codes: { type: array, items: { type: string } }
        "403": { description: A role field was supplied. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Invalid TOTP code. }
        "429": { description: Too many invalid attempts from this address. }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /users/invites:
    get:
      tags: [users]
      operationId: listPendingInvites
      summary: List pending invitations
      x-rbac: { permissions: [users:write], scope: none }
      responses:
        "200":
          description: Pending invitations (no tokens).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /users/{userId}/invite:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [users]
      operationId: reissueInvite
      summary: Revoke open invites and mint a new link (shown once)
      x-rbac: { permissions: [users:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "201": { description: New invitation with one-time link. }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [users]
      operationId: revokeInvite
      summary: Revoke the pending invitation
      x-rbac: { permissions: [users:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Revoked. }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /session/environment:
    post:
      tags: [settings]
      operationId: setSessionEnvironment
      summary: Switch the calling session between live and demo
      description: >
        Switching *to* `live` requires an elevated session (`/auth/step-up`) and the
        `live_trading` feature flag to be on; otherwise `403 step_up_required` or
        `403 live_trading_disabled`. The switch is audited and is broadcast on the `system`
        WS topic so every pane re-badges consistently.
      x-rbac: { permissions: [], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              additionalProperties: false
              properties:
                environment: { $ref: "#/components/schemas/Environment" }
      responses:
        "200":
          description: Environment switched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  environment: { $ref: "#/components/schemas/Environment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /notifications:
    get:
      tags: [alerts]
      operationId: listNotifications
      summary: Unified notification history (alerts, rule fires, order events, system)
      description: >
        Read-model union over `alert_deliveries`, `rule_events`, `order_events` and
        `system_events`, filtered to what the caller may see. Live equivalents arrive on the
        `alerts`, `rules`, `orders` and `system` WS topics; this endpoint is the scroll-back
        history behind them.
      x-rbac: { permissions: [], scope: self }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          explode: true
          schema:
            type: array
            items: { type: string, enum: [alert, rule, order, risk, system] }
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notifications, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /watchlists:
    get:
      tags: [workspaces]
      operationId: listWatchlists
      summary: List own watchlists
      x-rbac: { permissions: [workspaces:read], scope: self }
      responses:
        "200":
          description: Watchlists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Watchlist" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [workspaces]
      operationId: createWatchlist
      summary: Create a watchlist
      x-rbac: { permissions: [workspaces:write], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /watchlists/{watchlistId}:
    parameters:
      - name: watchlistId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [workspaces]
      operationId: updateWatchlist
      summary: Replace a watchlist
      x-rbac: { permissions: [workspaces:write], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [workspaces]
      operationId: deleteWatchlist
      summary: Delete a watchlist
      x-rbac: { permissions: [workspaces:write], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /scanner:
    get:
      tags: [market-data]
      operationId: runScanner
      summary: Rank instruments by order-flow and volatility criteria
      description: >
        Evaluates the requested filter set over the most recent values in
        `orderflow_metrics` and `tickers`. Only instruments with active recording can be
        scanned on recorded-history criteria; others are returned with
        `coverage: "live_only"` so the UI can explain the gap rather than show a blank row.
      x-rbac: { permissions: [marketdata:read], scope: none }
      parameters:
        - name: filters
          in: query
          description: Filter expression set, URL-encoded JSON matching `ScannerFilter`.
          schema: { type: string, maxLength: 4000 }
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                volume_24h,
                price_change_pct_24h,
                cvd,
                tape_speed,
                open_interest,
                liquidation_intensity,
              ]
            default: volume_24h
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ranked results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ScannerRow" } }
                  meta: { $ref: "#/components/schemas/DataMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /indicators:
    get:
      tags: [workspaces]
      operationId: listIndicators
      summary: Indicator catalogue with parameter schemas
      description: >
        Machine-readable descriptor per indicator (id, display name, where it renders,
        parameter JSON Schema, whether it is computed client-side in a worker or
        server-side from `orderflow_metrics`, and whether it is `estimated`). The chart
        settings dialogs render their forms from this, so adding an indicator never
        requires a frontend release.
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    { type: array, items: { $ref: "#/components/schemas/IndicatorDescriptor" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /layout-presets:
    get:
      tags: [workspaces]
      operationId: listLayoutPresets
      summary: Built-in layout presets
      description: |
        Static built-in catalogue served from the code (no rows, nothing user-scoped). Each entry
        carries a complete `LayoutInput` for `createLayout`, symbols left for the client to fill
        ("Keep current symbols", SCR-022). User-saved presets are layouts with a `hotkey_slot`
        (`listLayouts`). Ids are stable and new entries are additive. Thumbnails are static client
        assets keyed by `id`; the API never serves markup. `cursor` as on `listWorkspaces`.
      x-rbac: { permissions: [workspaces:read], scope: self }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Presets page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/LayoutPreset" } }
        "400":
          description: "Malformed request. For this operation `code: invalid_cursor` signals a malformed or expired `cursor`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /workspaces/{workspaceId}/export:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspaces]
      operationId: exportWorkspace
      summary: Export a workspace as a portable bundle
      description: >
        The bundle is self-contained and contains no credentials, account identifiers or
        PnL figures - only presentation state - so it is safe to share. Import is
        `POST /workspaces` with `from_bundle`.
      x-rbac: { permissions: [workspaces:read], scope: self }
      responses:
        "200":
          description: Workspace bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBundle" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /orders/{orderId}/diagnostics:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [trading]
      operationId: getOrderDiagnostics
      summary: Full lifecycle trace for one order
      description: >
        Returns the ordered `order_events` chain plus the exchange request/response pairs
        (with credentials and signatures redacted) and the reconciliation verdict. This is
        the "why did my order do that" surface; it is the only place the raw retCode and
        retMsg from Bybit are exposed, and it is audited on read.
      x-rbac: { permissions: [orders:read], scope: granted_accounts }
      responses:
        "200":
          description: Diagnostics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDiagnostics" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trade-groups/preview:
    post:
      tags: [trading]
      operationId: previewTradeGroup
      summary: Dry-run a fan-out - resolved per-account sizing, risk and rejections
      description: >
        Runs the full fan-out pipeline (24-internal-schemas.md section 9.3 sizing, 9.4
        fan-out) **without submitting anything**, returning exactly what each leg would
        send. Legs that would be rejected (cap breach, symbol not allowed, insufficient
        margin, rate budget exhausted) are returned with their reason so the ticket can show
        them before the user commits. Never mutates state and is therefore safe to call on
        every keystroke; it is rate-limited rather than idempotency-keyed.
      x-rbac: { permissions: [orders:read], scope: granted_accounts }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTradeGroupRequest" }
      responses:
        "200":
          description: Resolved preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeGroupPreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /risk/summary:
    get:
      tags: [positions]
      operationId: getRiskSummary
      summary: Aggregate risk, cap utilisation and lockout state
      description: >
        Cross-account risk roll-up. A Manager sees only granted accounts; a Viewer sees the
        aggregate only when granted read on **every** account it covers
        (04-security-program.md section 7.2 row 29), otherwise `403 account_scope_denied` -
        a partial aggregate would be a misleading number, so it is refused rather than
        silently narrowed.
      x-rbac: { permissions: [positions:read], scope: granted_accounts }
      parameters:
        - $ref: "#/components/parameters/AccountIdsQuery"
        - $ref: "#/components/parameters/EnvironmentQuery"
      responses:
        "200":
          description: Risk summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskSummary" }
        "403": { $ref: "#/components/responses/AccountScopeDenied" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /risk/lockouts/{accountId}/override:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [positions]
      operationId: overrideRiskLockout
      summary: Clear a risk lockout on an account (owner, step-up)
      description: >
        Lockouts are set automatically when a `RiskCaps` threshold is breached. Clearing one
        is an owner-only, step-up-gated, always-audited action; the reason is mandatory and
        is written to the audit chain.
      x-rbac: { permissions: [killswitch:write], scope: none }
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 280 }
      responses:
        "200":
          description: Lockout cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /detectors/config:
    get:
      tags: [market-data]
      operationId: getDetectorConfig
      summary: Current thresholds for the estimated detectors
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Detector configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectorConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }
