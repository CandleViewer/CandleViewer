  # ===========================================================================
  # TRADING — orders, trade groups (fan-out), kill-switch
  # ===========================================================================
  /orders:
    get:
      tags: [trading]
      operationId: listOrders
      summary: List orders across the caller's accounts
      description: |
        Reads the local OMS mirror, which is reconciled against Bybit
        (`GET /v5/order/realtime` + `order/history`) and updated live from the private WS
        `order` stream — the WS stream, never the REST ack, is the source of truth for state
        (digest 06 §19).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/AccountIdsQuery"
        - $ref: "#/components/parameters/SymbolQueryOptional"
