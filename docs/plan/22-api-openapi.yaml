          application/json:
            schema:
              type: object
              required: [editor, model]
              additionalProperties: false
              properties:
                editor: { type: string, enum: [form, graph] }
                model: { type: object, additionalProperties: true }
                counterpart_model:
                  type: object
                  additionalProperties: true
                  description: >
                    Optional stored model of the OTHER editor. When present both are compiled and a
                    divergence is reported in `round_trip` (US-RULE-006); the server never reconciles.
      responses:
        "200":
          description: Compiled IR.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ir: { $ref: "#/components/schemas/RuleIr" }
                  ir_hash: { type: string }
