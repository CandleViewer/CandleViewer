  /drawings:
    get:
      tags: [workspaces]
      operationId: listDrawings
      summary: List the caller's drawings for a symbol
      description: |
        Drawings are stored in **chart space** (time + price), never pixels, so they survive
        zoom, bar-type changes and DPI changes. Only the caller's live (not soft-deleted) drawings
        are returned, ordered by `id` ascending, so a cursor walk is stable.

        `symbol` is required. Without `layout_id` the result holds the caller's drawings on that
        symbol in **both** scopes (symbol-global and layout-scoped). With `layout_id` the result is
        narrowed to that layout, and the call returns `404` when the id is not one of the caller's
        live layouts (always the case until layouts ship, E15-T01).

        `limit` is 1..500 (default 100). `cursor` is opaque, bound to the `symbol`/`layout_id`
        scope it was issued for and valid for one hour; a malformed, mismatched or expired cursor
        returns `400 invalid_cursor`.
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: layout_id
          in: query
          description: Narrow to one layout. Must be one of the caller's live layouts, otherwise 404.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      x-rbac: { permissions: [workspaces:read], scope: self }
      responses:
        "200":
          description: Drawings page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Drawing" } }
              examples:
                trendline:
                  value:
                    items:
                      - id: "0193f2bb-9c11-7a3d-88f1-0d2e3f4a5b6c"
                        owner_user_id: "10000000-0000-4000-8000-000000000001"
                        symbol: BTCUSDT
                        tool: trendline
                        layout_id: null
                        geometry:
                          {
                            points:
                              [
                                { t: "2026-09-13T12:00:00Z", p: "61200.00" },
                                { t: "2026-09-14T09:00:00Z", p: "63000.00" },
                              ],
                            extend_right: true,
                          }
                        style: { colour: "#5B8DEF", width: 2, dash: solid }
                        label: "ascending support"
                        locked: false
                        visible: true
                        z_index: 0
                        created_at: "2026-09-13T12:04:00.123456Z"
                        updated_at: "2026-09-13T12:04:00.123456Z"
                    meta: { next_cursor: null, has_more: false, count: 1 }
        "400":
          description: "Malformed request. For this operation `code: invalid_cursor` signals a malformed, scope-mismatched or expired `cursor`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                invalidCursor:
                  value:
                    {
                      type: "https://candleviewer.local/errors/invalid_cursor",
                      title: "Pagination cursor is malformed or expired",
                      status: 400,
                      instance: "urn:cv:req:0193f2bb-8888",
                      code: invalid_cursor,
                    }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [workspaces]
      operationId: createDrawing
      summary: Create a drawing
      description: |
        The server mints a UUIDv7 `id`. The body is limited to 64 KiB (`413 payload_too_large`).
        A non-null `layout_id` must name one of the caller's live layouts, otherwise
        `422` rule `layout_not_found` (every non-null value until layouts ship, E15-T01).
        The `ETag` response header carries the `updated_at` token for later `If-Match` use.

        `Idempotency-Key`: the same key with the same body replays the stored 2xx response with
        `Idempotency-Replayed: true`; the same key with a different body is `409 idempotency_key_reuse`.
        Replay storage is best-effort and bounded; correctness never depends on it.
        The replay cache is in memory and bounded: a retry after the entry was evicted, or after a
        server restart, creates a **duplicate** drawing. Clients that need retry-safe creation
        should use `batchUpsertDrawings` with a client-chosen `id` (a repeat is `409 id_unavailable`).
      x-rbac: { permissions: [workspaces:write], scope: self }
      x-idempotency: recommended
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DrawingInput" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drawing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /drawings/batch:
    post:
      tags: [workspaces]
      operationId: batchUpsertDrawings
      summary: Create/update/delete many drawings in one call
      description: |
        The chart engine batches drawing mutations during a drag with a 500 ms debounce, so a single
        call carries all affected shapes.

        Processing order: (1) the body is limited to 1 MiB and `operations` to 200 items, otherwise
        `413 payload_too_large`, checked before per-operation validation; (2) the whole body is
        validated (`422`, up to 20 field errors such as `operations.3.drawing.tool`; each `id` may
        appear at most once per batch, else rule `duplicate_id`); (3) the operations are applied in
        order inside **one transaction**. The first operation that cannot be applied rolls the
        whole batch back and returns `409 conflict` with `errors[0] = {field: "operations.<i>", rule, message}`,
        where `rule` is one of:

        - `target_unavailable` — an `update`/`delete` target is missing, soft-deleted or owned by
          another user (indistinguishable by design);
        - `version_conflict` — the operation's `if_match` is stale;
        - `id_unavailable` — a `create` id is already used by any row of any owner in any state
          (an id stays unavailable until its row is purged, 90 days after deletion; re-create under a new id).

        `create.id` is optional (client UUIDv7 recommended); `update` and `delete` require `if_match`,
        the `updated_at` token of the version being replaced or removed. The result lists the
        created, updated and deleted ids in operation order.

        `Idempotency-Key` behaves as on `createDrawing`.
      x-rbac: { permissions: [workspaces:write], scope: self }
      x-idempotency: recommended
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DrawingBatchRequest" }
      responses:
        "200":
          description: Batch applied.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrawingBatchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "The batch was rolled back. `errors[0].field` names the failing operation and `rule` is `target_unavailable`, `version_conflict` or `id_unavailable`; a reused `Idempotency-Key` with a different body is `idempotency_key_reuse`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                targetUnavailable:
                  value:
                    {
                      type: "https://candleviewer.local/errors/conflict",
                      title: "Concurrent modification or state conflict",
                      status: 409,
                      instance: "urn:cv:req:0193f2bb-9999",
                      code: conflict,
                      errors:
                        [
                          {
                            field: "operations.3",
                            rule: target_unavailable,
                            message: "The target drawing is not available.",
                          },
                        ],
                    }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /drawings/{drawingId}:
    parameters: [{ $ref: "#/components/parameters/DrawingId" }]
    put:
      tags: [workspaces]
      operationId: updateDrawing
      summary: Replace a drawing
      description: |
        Full replacement. `symbol` and `tool` are immutable (`422` rule `immutable_field`). The body
        is limited to 64 KiB (`413 payload_too_large`).

