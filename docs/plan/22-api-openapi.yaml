          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithEvents" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [trading]
      operationId: amendOrder
      summary: Amend price, quantity, trigger or attached TP/SL
      description: |
        Maps to `POST /v5/order/amend`. Amendment is refused with `order_not_amendable` when the
        order is terminal or already has a cancel/amend in flight. Omitted fields are left
        untouched; sending `null` for `take_profit`/`stop_loss` clears them — except that an
        entry order's stop-loss can never be cleared while the leg is open (arch P4), which
        returns `validation_failed` / `native_stop_required`.

        Amending only one side of a TP/SL pair breaks Bybit's OCO pairing (digest 06 §19); the
        server therefore re-sends both sides whenever either changes, and records the paired
        amend in `order_events`.
      x-rbac: { permissions: [orders:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendOrderRequest" }
            examples:
              reprice: { value: { price: "63080.00" } }
              resize: { value: { qty: "0.750", price: "63080.00" } }
      responses:
        "202":
          description: Amend accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [trading]
      operationId: cancelOrder
      summary: Cancel a single order
      description: "Maps to `POST /v5/order/cancel`. Cancelling an already-terminal order is idempotent and returns `202` with the current state rather than an error."
      x-rbac: { permissions: [orders:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      responses:
        "202":
          description: Cancel accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /orders/cancel-all:
    post:
      tags: [trading]
      operationId: cancelAllOrders
      summary: Cancel all open orders matching a filter
      description: |
        Fans out `POST /v5/order/cancel-all` per account (Bybit rate cost: 1 req/s per account
        for `linear` cancel-all — the fan-out scheduler serialises accordingly). Partial
        success is normal and reported per account; the HTTP status is `207`-style `200` with
        per-account results rather than an all-or-nothing error.
      x-rbac: { permissions: [orders:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
