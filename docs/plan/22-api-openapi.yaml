                    ingestion:
                      status: unavailable
                      detail: "ingestion: no provider wired"
                      generated_at: "2026-10-15T18:00:05Z"
                    rate_budget_status:
                      status: unavailable
                      detail: "rate-limit peak: no provider wired"
                      generated_at: "2026-10-15T18:00:05Z"
