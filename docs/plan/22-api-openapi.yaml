  /positions/{positionId}/tpsl:
    parameters: [{ $ref: "#/components/parameters/PositionId" }]
    put:
      tags: [positions]
      operationId: setPositionTpSl
      summary: Set take-profit / stop-loss / trailing stop on a position
      description: |
        Maps to `POST /v5/position/trading-stop`. Notes that the contract enforces:

        * **Trailing stop is a price distance on Bybit, not a percentage.** A percentage or
          ATR-based request is translated server-side into a price distance using the current
          mark price / ATR, and both the requested unit and the resolved distance are echoed.
        * Sending only one of TP/SL breaks Bybit's OCO pairing, so the server always re-asserts
          both sides; pass `null` explicitly to clear one.
        * `tpsl_mode: Partial` requires `tp_size`/`sl_size` that match the position size rules.
        * The stop-loss cannot be cleared while `require_native_stop` is set on the account
          profile — `validation_failed` / `native_stop_required`.
      x-rbac: { permissions: [positions:write], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTpSlRequest" }
            examples:
              pctTrail:
                summary: 1.2 % trailing stop, armed at +1R
                value:
                  trailing_stop: { unit: percent, value: "1.2" }
                  activation_price: "63300.00"
                  tpsl_mode: Full
              breakEven:
                value:
                  {
                    stop_loss: { unit: price, value: "63099.80" },
                    take_profit: { unit: price, value: "63600.00" },
                    tpsl_mode: Full,
                  }
      responses:
        "200":
          description: Applied, with resolved prices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TpSlResult" }
              examples:
                trail:
                  value:
                    position_id: "0d000000-0000-4000-8000-000000000001"
                    take_profit: "63600.00"
                    stop_loss: "62900.00"
                    trailing_stop_distance: "757.43"
                    trailing_stop_requested: { unit: percent, value: "1.2" }
                    activation_price: "63300.00"
                    tpsl_mode: Full
                    applied_at: "2026-09-14T10:35:00Z"
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

