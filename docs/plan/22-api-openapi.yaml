                              ask_volume: "12.007",
                              delta: "-28.111",
                              total_volume: "52.125",
                              trades: 288,
                            }
                        imbalances:
                          - {
                              price: "63110.00",
                              direction: buy,
                              ratio: "3.35",
                              stacked: true,
