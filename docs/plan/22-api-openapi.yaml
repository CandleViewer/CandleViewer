        (`kill_switch`), else `{kind}:{id}` with a lowercase canonical uuid or a
        `23-ws-protocol.md` §13 `symbol` (`order:0a000000-0000-4000-8000-000000000001`,
        `book:BTCUSDT`). A uuid is always the lowercase canonical form, so a machine has exactly
        one key in its environment.
      schema:
        type: string
        maxLength: 80
