    put:
      tags: [alerts]
      operationId: updateAlert
      summary: Replace an alert
      x-rbac: { permissions: [alerts:write], scope: self }
      parameters:
        [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
