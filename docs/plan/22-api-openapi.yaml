  /market/liquidations:
    get:
      tags: [market-data]
      operationId: getLiquidations
      summary: Recorded liquidation prints and clusters
      description: |
        Sourced from the `allLiquidation.{symbol}` WS topic (the legacy `liquidation` topic is
        retired — digest 06 §9). Bybit batches at most one push per symbol per 500 ms, so
        counts are lower bounds on distinct liquidation events. `cluster_window_ms` groups
        prints into liquidation cascades for the cluster overlay.
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: side
          in: query
          description: "Side of the liquidated position (`buy` = short liquidated / buy-side print)."
          schema: { type: string, enum: [buy, sell] }
        - name: min_notional_usd
          in: query
          schema: { $ref: "#/components/schemas/Decimal" }
        - name: cluster_window_ms
          in: query
          schema: { type: integer, minimum: 0, maximum: 60000, default: 0 }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Liquidations page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Liquidation" } }
              examples:
                liqs:
                  value:
                    items:
                      - {
                          ts: "2026-09-14T10:12:44.120Z",
                          symbol: BTCUSDT,
                          side: sell,
                          price: "62880.00",
                          size: "3.220",
                          notional_usd: "202473.60",
                          cluster_size: 1,
                        }
                    meta: { next_cursor: null, has_more: false, count: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /market/data-coverage:
    get:
      tags: [market-data]
      operationId: getDataCoverage
      summary: What data exists locally for a symbol, per stream and tier
      description: |
        The UI calls this before rendering a historical window so it can grey out ranges that
        were never recorded, rather than showing a misleading empty chart. Returns contiguous
        covered intervals per `stream_kind` with the storage tier that holds them.
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: stream
          in: query
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/StreamKind" }
      x-rbac: { permissions: [marketdata:read], scope: none }
      responses:
        "200":
          description: Coverage report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataCoverage" }
              examples:
                btc:
                  value:
                    symbol: BTCUSDT
                    streams:
                      - stream: trades
                        intervals:
                          - {
                              from: "2026-09-01T00:00:00Z",
                              to: "2026-09-07T00:00:00Z",
                              tier: parquet,
                              rows: 184220113,
                            }
                          - {
                              from: "2026-09-07T00:00:00Z",
                              to: "2026-09-14T10:31:00Z",
                              tier: questdb,
                              rows: 210441200,
                            }
                        gaps:
                          [
                            {
                              from: "2026-09-04T02:11:00Z",
                              to: "2026-09-04T02:14:20Z",
                              reason: "ws_disconnect",
                            },
                          ]
                      - stream: orderbook_delta
                        intervals:
                          [
                            {
                              from: "2026-09-07T00:00:00Z",
                              to: "2026-09-14T10:31:00Z",
                              tier: questdb,
                              rows: 9912004411,
                            },
                          ]
                        gaps: []
                    generated_at: "2026-09-14T10:31:02.800Z"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  # ===========================================================================
  # RECORDING
  # ===========================================================================
  /recording/symbols:
    get:
      tags: [recording]
      operationId: listRecordedSymbols
      summary: List the recorded-symbol list
      description: |
        The list is **empty by default** (owner decision #4). Entries appear either because a
        user added them (`reason: "manual`) or because auto-record triggered on an open chart or"
        an open position. Auto-record entries expire when their trigger disappears, unless
        pinned.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/RecordingState" }
        - name: reason
          in: query
          schema: { $ref: "#/components/schemas/RecordReason" }
        - name: pinned
          in: query
          schema: { type: boolean }
      x-rbac: { permissions: [recording:read], scope: none }
      responses:
        "200":
          description: Recorded symbols page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/RecordedSymbol" } }
              examples:
                two:
                  value:
                    items:
                      - id: "e1000000-0000-4000-8000-000000000001"
                        symbol: BTCUSDT
                        reason: manual
                        pinned: true
                        state: recording
                        streams: [trades, orderbook_delta, tickers, liquidations, klines]
                        depth: 200
                        started_at: "2026-09-01T00:00:00Z"
                        retention_days: null
                        disk_bytes: 812340221100
                        rows_last_hour: 41220118
                        lag_ms: 42
                        added_by: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0001"
                      - id: "e1000000-0000-4000-8000-000000000002"
                        symbol: ETHUSDT
                        reason: chart_open
                        pinned: false
                        state: recording
                        streams: [trades, orderbook_delta, tickers]
                        depth: 50
                        started_at: "2026-09-14T09:58:00Z"
                        retention_days: 30
                        disk_bytes: 1220004410
                        rows_last_hour: 8122004
                        lag_ms: 31
                        added_by: null
                    meta: { next_cursor: null, has_more: false, count: 2 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [recording]
      operationId: addRecordedSymbol
      summary: Add a symbol to the recorded list (start recording)
      description: |
        Starts the ingestion subscriptions for the requested streams. Book depth 200 at 100 ms
        is the default for footprint/heatmap fidelity; depth 500 is allowed but the response
        carries an estimated disk-rate warning (~0.5–0.75 GB/day/symbol compressed at depth 200).
        Adding a symbol already present is idempotent and returns `200` with the existing row.
      x-rbac: { permissions: [recording:write], scope: none }
      x-idempotency: recommended
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddRecordedSymbolRequest" }
            examples:
              manual:
                value:
                  {
                    symbol: SOLUSDT,
                    streams: [trades, orderbook_delta, tickers, liquidations],
                    depth: 200,
                    pinned: false,
                    retention_days: 30,
                  }
      responses:
        "201":
          description: Recording started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordedSymbolWithEstimate" }
        "200":
          description: Already recorded; existing entry returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordedSymbol" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /recording/symbols/{recordedSymbolId}:
    parameters: [{ $ref: "#/components/parameters/RecordedSymbolId" }]
    get:
      tags: [recording]
      operationId: getRecordedSymbol
      summary: Get one recorded-symbol entry
      x-rbac: { permissions: [recording:read], scope: none }
      responses:
        "200":
          description: Entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordedSymbol" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [recording]
      operationId: updateRecordedSymbol
      summary: Change streams, depth, retention or pin state
      description: |
        `pinned: true` means "keep forever" and nulls `retention_days`. Un-pinning restores the
        global default (30 days) unless an explicit value is supplied. Narrowing `streams` stops
        those subscriptions but does **not** delete already-recorded data — use
        `DELETE /recording/symbols/{id}?purge_data=true` for that.
      x-rbac: { permissions: [recording:write], scope: none }
      x-idempotency: optional
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRecordedSymbolRequest" }
            examples:
              pin: { value: { pinned: true } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordedSymbol" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [recording]
      operationId: removeRecordedSymbol
      summary: Stop recording a symbol
      description: |
        Stops subscriptions and closes the open recording session. Data is retained and remains
        replayable unless `purge_data=true`, which schedules an irreversible delete across
        QuestDB and Parquet (audited, owner-only). Removal is refused with `conflict` while an
        auto-record trigger is still active (open chart or open position) unless `force=true`.
      x-rbac: { permissions: [recording:write], scope: none }
      x-idempotency: optional
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: purge_data
          in: query
          schema: { type: boolean, default: false }
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: "Stopped." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /recording/symbols/{recordedSymbolId}/pin:
    parameters: [{ $ref: "#/components/parameters/RecordedSymbolId" }]
    put:
      tags: [recording]
      operationId: pinRecordedSymbol
      summary: Pin (keep forever) or unpin a recorded symbol
      description: "Convenience endpoint for the one-click pin toggle in the Recorder screen; equivalent to PATCH with `{pinned}`."
      x-rbac: { permissions: [recording:write], scope: none }
