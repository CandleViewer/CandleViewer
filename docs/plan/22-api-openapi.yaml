              schema: { $ref: "#/components/schemas/RuleDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /rules/validate:
    post:
      tags: [rules]
      operationId: validateRule
      summary: Validate an IR without saving it
      description: |
        Static analysis used by both editors on every keystroke-debounce. Checks schema
        conformance, variable existence, type compatibility, action-parameter completeness,
        unreachable branches, missing guards, the action-budget hard caps (`x-cv-limit-caps` on
        `RuleIr`), and the `require_native_stop` invariant. Returns errors **and** warnings;
        warnings do not block saving but do block arming.
      x-rbac: { permissions: [rules:read], scope: none }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ir]
              properties:
                ir: { $ref: "#/components/schemas/RuleIr" }
                scope: { $ref: "#/components/schemas/RuleScope" }
      responses:
        "200":
          description: "Validation report (a failing IR is still a 200 with `valid: false`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleValidationResult" }
              examples:
                withWarning:
                  value:
                    valid: true
                    errors: []
                    warnings:
                      - {
                          path: "guards.cooldown_seconds",
                          code: guard_missing,
                          message: "No cooldown set; rule may fire on every position update.",
                        }
                    referenced_variables:
                      ["position.r_multiple", "position.side", "position.stop_loss"]
                    referenced_actions: [set_stop_loss, emit_alert]
                    estimated_evaluations_per_minute: 120
                invalid:
                  value:
                    valid: false
                    errors:
                      - {
                          path: "then[0].params.price",
                          code: type_mismatch,
                          message: "Expected decimal expression, got boolean.",
                        }
                    warnings: []
                    referenced_variables: []
                    referenced_actions: [set_stop_loss]
                    estimated_evaluations_per_minute: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /rules/{ruleId}/simulate:
    parameters: [{ $ref: "#/components/parameters/RuleId" }]
    post:
      tags: [rules]
      operationId: simulateRule
      summary: Dry-run a rule against recorded history or a replay session
      description: |
        Replays the rule over historical data using the same engine and the same IR, emitting
        the actions it *would* have taken without sending anything to the exchange. This is the
        gate a rule must pass before it can be armed (Definition of Done, 02-definition-of-ready-done.md).

        Either `from`/`to` (history window over recorded data) or `replay_session_id` must be
        supplied. Long simulations run asynchronously: "the response is `202` with a `job_id`"
        and results are polled from `GET /rules/{ruleId}/runs`.
      x-rbac: { permissions: [rules:write], scope: granted_accounts }
      x-idempotency: optional
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateRuleRequest" }
            examples:
              window:
                value:
                  {
                    from: "2026-09-10T00:00:00Z",
                    to: "2026-09-11T00:00:00Z",
                    symbols: [BTCUSDT],
                    speed: 0,
                    version_id: "11000000-0000-4000-8000-000000000001",
                  }
      responses:
        "200":
          description: Simulation completed synchronously (short windows).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleSimulationResult" }
              examples:
                result:
                  value:
                    run_id: "12000000-0000-4000-8000-000000000001"
                    rule_id: "10000000-0000-4000-8000-000000000001"
                    version_id: "11000000-0000-4000-8000-000000000001"
                    from: "2026-09-10T00:00:00Z"
                    to: "2026-09-11T00:00:00Z"
                    evaluations: 184220
                    fires: 7
                    suppressed_by_guard: 3
                    actions:
                      - {
                          ts: "2026-09-10T09:14:22.110Z",
                          action: set_stop_loss,
                          params: { price: "62210.40" },
                          would_have_succeeded: true,
                          symbol: BTCUSDT,
                          exchange_account_id: "a1000000-0000-4000-8000-000000000001",
                        }
                    hypothetical_pnl_delta_usd: "412.80"
                    errors: []
                    duration_ms: 8120
        "202":
          description: Simulation scheduled (long windows).
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string, format: uuid }
                  status: { const: running }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /rules/{ruleId}/mode:
    parameters: [{ $ref: "#/components/parameters/RuleId" }]
    put:
      tags: [rules]
      operationId: setRuleMode
      summary: Disable, simulate or arm a rule
      description: |
        `armed` is the only mode that can send orders. Arming requires: a validated active
        version with zero errors, at least one completed simulation run on that exact
        `ir_hash`, no open validation warnings of class `safety`, and — when the rule contains
        order-sending actions — `orders:write` on every bound account. The transition is
        audited and broadcast on the `rules` WS topic. Arming a rule whose scope includes the
        `live` environment additionally needs `rules:arm_live` (dangerous, owner-seeded) and a
        fresh one-shot step-up (`live_enablement`); refusals use `permission_required` /
        `step_up_required`. That step-up is bound to this request (`authStepUp`, "Binding"), so
        a live arm whose body is not I-JSON (RFC 7493: a lone surrogate, an integer beyond 2^53,
        `NaN` or `Infinity`) has no canonical form and is `400 validation_failed`, never a
        challenge.

        **Action budget (SR-104; 04 §7.2.2 row 26).** Arming, the re-arm after a kill included,
        holds the active version to the action budget of `createRule` again. A version whose
        `limits.max_fires_per_hour` or `limits.max_fires_per_day` is above its `RuleLimits`
        default needs the arming actor to be the Owner, whoever saved it: anyone else gets
        `403 forbidden`, whose `errors` name each such `limits.<field>` with
        `rule: owner_only_above_default`. A value above its hard cap (`x-cv-limit-caps` on
        `RuleIr`) is `422 rule_invalid` for every role. Both refusals are audited before they
        are answered. A rule armed above a hard cap before the caps existed is never clamped:
        the evaluator skips it, and it is disarmed, audited with the reason `limits_above_cap`,
        the first time it is read or evaluated.
      x-rbac: { permissions: [rules:write, rules:arm_live], scope: granted_accounts }
      x-idempotency: required
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKeyRequired" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/RuleMode" }
                reason: { type: string, maxLength: 280 }
      responses:
        "200":
          description: Mode changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

