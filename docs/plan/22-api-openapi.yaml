    RuleVersionDetail:
      allOf:
        - $ref: "#/components/schemas/RuleVersion"
        - type: object
          properties:
            ir: { $ref: "#/components/schemas/RuleIr" }
            graph_layout: { type: ["object", "null"], additionalProperties: true }
    RuleValidationIssue:
      type: object
      properties:
        path: { type: string }
        code:
          {
            type: string,
            enum:
              [
                schema_error,
                unknown_variable,
                unknown_function,
                type_mismatch,
                unreachable_branch,
                guard_missing,
                missing_action_param,
                permission_required,
                native_stop_missing,
                unsupported_symbol,
                unknown_metric,
                operator_not_applicable,
                cycle_detected,
                dangling_port,
                orphan_node,
                multiple_sinks,
                feedback_loop,
                native_stop_violation,
                high_frequency,
              ],
