        trade_group_id: { type: ["string", "null"], format: uuid }
        r_multiple: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        updated_at: { type: string, format: date-time }
    AggregatePosition:
      type: object
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        net_size: { $ref: "#/components/schemas/Decimal" }
        gross_size: { $ref: "#/components/schemas/Decimal" }
        weighted_avg_price: { $ref: "#/components/schemas/Decimal" }
        unrealised_pnl: { $ref: "#/components/schemas/Decimal" }
        accounts:
          type: array
          items:
            type: object
            properties:
              exchange_account_id: { type: string, format: uuid }
              size: { $ref: "#/components/schemas/Decimal" }
              side: { type: string, enum: [long, short] }
              unrealised_pnl: { $ref: "#/components/schemas/Decimal" }
    SetTpSlRequest:
      type: object
      additionalProperties: false
      properties:
        take_profit: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        stop_loss: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        trailing_stop: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        activation_price:
          {
            $ref: "#/components/schemas/Decimal",
            description: "Arms the trailing stop only once price reaches this level.",
          }
        tpsl_mode: { $ref: "#/components/schemas/TpSlMode" }
        tp_size: { $ref: "#/components/schemas/Decimal" }
        sl_size: { $ref: "#/components/schemas/Decimal" }
        tp_trigger_by: { $ref: "#/components/schemas/TriggerBy" }
        sl_trigger_by: { $ref: "#/components/schemas/TriggerBy" }
    TpSlResult:
      type: object
      properties:
        position_id: { type: string, format: uuid }
        take_profit: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        stop_loss: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        trailing_stop_distance:
          { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        trailing_stop_requested:
          { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        activation_price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        tpsl_mode: { $ref: "#/components/schemas/TpSlMode" }
        applied_at: { type: string, format: date-time }
    ClosePositionRequest:
      type: object
      additionalProperties: false
      required: [order_type]
      properties:
        order_type: { $ref: "#/components/schemas/OrderType" }
        price: { $ref: "#/components/schemas/Decimal" }
        pct:
          {
            $ref: "#/components/schemas/Decimal",
            description: "0 < pct <= 100. Mutually exclusive with `qty`.",
          }
        qty: { $ref: "#/components/schemas/Decimal" }
        time_in_force: { $ref: "#/components/schemas/TimeInForce" }
        arm_token: { type: ["string", "null"] }
    ReversePositionRequest:
      type: object
      additionalProperties: false
      properties:
        size_mode: { type: string, enum: [same, profile, custom], default: same }
        qty:
          { $ref: "#/components/schemas/Decimal", description: "Required when `size_mode=custom`." }
        order_type: { $ref: "#/components/schemas/OrderType", default: market }
        price: { $ref: "#/components/schemas/Decimal" }
        arm_token: { type: ["string", "null"] }
    Execution:
      type: object
      properties:
        is_paper:
          {
            type: boolean,
            default: false,
            description: "True when the paper matcher produced this record rather than the exchange. Orthogonal to `environment` (24-internal-schemas.md section 1.2).",
          }
        id: { type: string, format: uuid }
        exec_id: { type: string }
        order_id: { type: string, format: uuid }
        exchange_account_id: { type: string, format: uuid }
        trade_group_id: { type: ["string", "null"], format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { $ref: "#/components/schemas/OrderSide" }
        exec_qty: { $ref: "#/components/schemas/Decimal" }
        exec_price: { $ref: "#/components/schemas/Decimal" }
        exec_value: { $ref: "#/components/schemas/Decimal" }
        fee: { $ref: "#/components/schemas/Decimal" }
        fee_rate: { $ref: "#/components/schemas/Decimal" }
        fee_coin: { type: string }
        is_maker: { type: boolean }
        exec_type: { type: string, enum: [Trade, AdlTrade, Funding, BustTrade, Settle] }
        exec_pnl: { $ref: "#/components/schemas/Decimal" }
        ts: { type: string, format: date-time }
    ClosedPnl:
      type: object
      properties:
        id: { type: string, format: uuid }
        exchange_account_id: { type: string, format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { $ref: "#/components/schemas/JournalSide" }
        qty: { $ref: "#/components/schemas/Decimal" }
        avg_entry_price: { $ref: "#/components/schemas/Decimal" }
        avg_exit_price: { $ref: "#/components/schemas/Decimal" }
        closed_pnl: { $ref: "#/components/schemas/Decimal" }
        cum_entry_value: { $ref: "#/components/schemas/Decimal" }
        cum_exit_value: { $ref: "#/components/schemas/Decimal" }
        leverage: { $ref: "#/components/schemas/Decimal" }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
    # === Rules / alerts =====================================================
    # -------------------------------------------------------------------------
    # Rule IR. This is a *projection* of the authoritative pydantic model in
    # 24-internal-schemas.md section 11.2; the JSON Schema published at
    # /api/v1/schemas/rule-ir.json is generated from those models, and contract
    # test `rule_ir_schema_parity` asserts this section matches it. Key names,
    # node shapes and every enum below are identical to the pydantic model - if
    # they diverge, the graph editor and the engine disagree about the same rule.
    # -------------------------------------------------------------------------
    RuleOperand:
      description: |
        A value position in the condition tree. Exactly one form is present:
        a metric reference, a constant, or an arithmetic node.
      oneOf:
        - $ref: "#/components/schemas/RuleMetricRef"
        - type: object
          additionalProperties: false
          required: [const]
          properties:
            const: { oneOf: [{ type: string }, { type: number }, { type: boolean }] }
        - $ref: "#/components/schemas/RuleArithmeticNode"
    RuleMetricRef:
      type: object
      additionalProperties: false
      required: [metric]
      description: >
        Reference to a value in the metric registry (24-internal-schemas.md section 7.2).
        `symbol` and `account_id` default to the rule's scope when null.
      properties:
        metric: { type: string, pattern: "^[a-z][a-z0-9_]{1,48}$" }
        params: { type: object, additionalProperties: true }
        symbol: { oneOf: [{ $ref: "#/components/schemas/Symbol" }, { type: "null" }] }
        account_id: { type: ["string", "null"], format: uuid }
        timeframe: { type: ["string", "null"] }
    RuleArithmeticNode:
      type: object
      additionalProperties: false
      required: [node_id, op, operands]
      properties:
        node_id: { type: string }
        op: { type: string, enum: [add, sub, mul, div, abs, min, max, neg, pct_of] }
        operands:
          {
            type: array,
            minItems: 1,
            maxItems: 8,
            items: { $ref: "#/components/schemas/RuleOperand" },
          }
    RuleCondition:
      description: >
        A node in the boolean DAG: a comparison leaf, a boolean combinator, or a temporal
        window. Every node carries a stable `node_id`, which is what lets the node-graph
        editor attach coordinates in `graph_layout` without putting cosmetics in the IR.
      oneOf:
        - $ref: "#/components/schemas/RuleComparisonNode"
        - $ref: "#/components/schemas/RuleBooleanNode"
        - $ref: "#/components/schemas/RuleTemporalNode"
    RuleComparisonNode:
      type: object
      additionalProperties: false
      required: [node_id, op, left]
      properties:
        node_id: { type: string }
        op:
          type: string
          enum:
            [
              gt,
              gte,
              lt,
              lte,
              eq,
              neq,
              between,
              outside,
              crosses_above,
              crosses_below,
              changed,
              is_true,
              is_false,
              in_set,
              not_in_set,
            ]
        left: { $ref: "#/components/schemas/RuleOperand" }
        right: { $ref: "#/components/schemas/RuleOperand" }
        right2:
          {
            $ref: "#/components/schemas/RuleOperand",
            description: "Upper bound for `between` / `outside`.",
          }
        set_values: { type: array, items: { type: string } }
        tolerance:
          { type: ["number", "null"], description: "Equality tolerance for float comparisons." }
    RuleBooleanNode:
      type: object
      additionalProperties: false
      required: [node_id, op, children]
      properties:
        node_id: { type: string }
        op: { type: string, enum: [all_of, any_of, none_of, n_of] }
        children:
          {
            type: array,
            minItems: 1,
            maxItems: 32,
            items: { $ref: "#/components/schemas/RuleCondition" },
          }
        n: { type: ["integer", "null"], minimum: 1, description: "Required for `n_of`." }
    RuleTemporalNode:
      type: object
      additionalProperties: false
      required: [node_id, op, child, window_ms]
      properties:
        node_id: { type: string }
        op: { type: string, enum: [sustained_for, occurred_within, count_within, stable_for] }
        child: { $ref: "#/components/schemas/RuleCondition" }
        window_ms: { type: integer, minimum: 100, maximum: 86400000 }
        min_count: { type: integer, minimum: 1, default: 1 }
    RuleAction:
      type: object
      additionalProperties: false
      required: [node_id, type, params]
      properties:
        node_id: { type: string }
        type:
          type: string
          enum:
            - place_order
            - modify_stop_loss
            - modify_take_profit
            - cancel_order
            - cancel_all_orders
            - move_to_breakeven
            - scale_out
            - scale_in
            - flatten_position
            - flatten_all_positions
            - reverse_position
            - halt_new_orders
            - resume_new_orders
            - reduce_leverage
            - widen_stop
            - tighten_stop
            - arm_chase_limit
            - start_iceberg_slice
            - start_twap
            - send_notification
            - log_journal_tag
            - set_variable
            - emit_signal
            - pause_rule
            - enable_rule
          description: |
            Order-sending actions (`place_order`, `flatten_*`, `reverse_position`,
            `scale_in`, `scale_out`, `modify_*`, `cancel_*`, `reduce_leverage`,
            `arm_chase_limit`, `start_*`) require the rule to be `armed` and the author to
            hold `orders:write` on every bound account. `widen_stop` additionally requires
            an owner with an elevated session - it is the only action that can increase
            risk, so it is gated separately from the rest.
        params:
          {
            type: object,
            additionalProperties: true,
            description: "Validated against a per-action JSON Schema.",
          }
        on_error:
          { type: string, enum: [abort_remaining, continue, retry_once], default: abort_remaining }
        targets:
          {
            type: string,
            enum: [scope_accounts, originating_account, all_accounts],
            default: scope_accounts,
          }
        dry_run_only: { type: boolean, default: false }
    RuleLimits:
      type: object
      additionalProperties: false
      description: >
        Safety limiters applied by the engine before any action is dispatched. Named
        `limits` in the IR (not `guards`) to match 24-internal-schemas.md section 11.2.
      properties:
        once: { type: boolean, default: false }
        once_per: { type: ["string", "null"], enum: [position, day, group, rule_lifetime, null] }
        cooldown_ms: { type: integer, minimum: 0, default: 1000 }
        max_fires_per_hour: { type: integer, minimum: 1, default: 60 }
        max_fires_per_day: { type: integer, minimum: 1, default: 500 }
        max_actions_per_fire: { type: integer, minimum: 1, maximum: 10, default: 10 }
        max_notional_per_fire:
          { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        max_daily_notional: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        require_confirmation: { type: boolean, default: false }
        evaluation_timeout_ms: { type: integer, minimum: 10, maximum: 5000, default: 250 }
        kill_switch_on_error_count: { type: integer, minimum: 1, default: 5 }
    RuleTrigger:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum:
            [
              on_price_update,
              on_bar_close,
              on_order_fill,
              on_position_open,
              on_position_close,
              on_position_update,
              on_timer,
              on_metric_change,
              on_signal,
              on_schedule,
              pre_trade_check,
              on_book_update,
              on_liquidation,
            ]
        timeframe: { type: ["string", "null"], description: "Required for `on_bar_close`." }
        interval_ms:
          { type: ["integer", "null"], minimum: 100, description: "Required for `on_timer`." }
        cron:
          { type: ["string", "null"], description: "Required for `on_schedule`; 5-field UTC cron." }
        metric: { type: ["string", "null"], description: "Required for `on_metric_change`." }
        debounce_ms: { type: integer, minimum: 0, default: 0 }
      allOf:
        - if: { properties: { type: { const: on_timer } } }
          then: { required: [interval_ms] }
        - if: { properties: { type: { const: on_bar_close } } }
          then: { required: [timeframe] }
        - if: { properties: { type: { const: on_schedule } } }
          then: { required: [cron] }
        - if: { properties: { type: { const: on_metric_change } } }
          then: { required: [metric] }
    RuleIr:
      type: object
      additionalProperties: false
      required: [ir_version, trigger, conditions, actions]
      x-cv-limit-caps: { max_fires_per_hour: 600, max_fires_per_day: 5000 }
      description: |
        The single executable representation produced by **both** the form editor and the
        node-graph editor (owner decision #11). Round-tripping is lossless because
        `graph_layout` (cosmetic node coordinates) is stored on the rule, outside the IR,
        so compiling either editor's model yields a byte-identical IR and therefore an
        identical `ir_hash`.

        This object is the *executable core only*. Rule identity and lifecycle
        (`id`, `name`, `mode`, `scope`, `editor`, `version`) live on `Rule` / `RuleInput`
        and in the `rules` table - they are deliberately not duplicated here, so an IR can
        be validated, hashed and compared without carrying database identity.

        `x-cv-limit-caps` names the hard cap of each capped `limits` field (SR-104); a rule
        saved above one is refused (`createRule`). The server takes the caps from
        `candleviewer.rules.limits`, and a contract test keeps this member equal to them. Alerts
        reuse `RuleLimits` without the caps.
      properties:
        ir_version: { type: integer, enum: [1] }
        trigger: { $ref: "#/components/schemas/RuleTrigger" }
        conditions: { $ref: "#/components/schemas/RuleCondition" }
        actions:
          {
            type: array,
            minItems: 1,
            maxItems: 10,
            items: { $ref: "#/components/schemas/RuleAction" },
          }
        limits: { $ref: "#/components/schemas/RuleLimits" }
        variables:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RuleOperand" }
          description: Named intermediate expressions, evaluated before `conditions`.
    AlertConditionIr:
      type: object
      additionalProperties: false
      required: [ir_version, trigger, conditions]
      description: |
        The condition half of the rule IR, reused by alerts. Alerts have no `actions` block
        - the action is always "notify on the configured channels", so an alert can never
        place an order regardless of what the user authors.
      properties:
        ir_version: { type: integer, enum: [1] }
        trigger: { $ref: "#/components/schemas/RuleTrigger" }
        conditions: { $ref: "#/components/schemas/RuleCondition" }
        variables:
          { type: object, additionalProperties: { $ref: "#/components/schemas/RuleOperand" } }
        limits: { $ref: "#/components/schemas/RuleLimits" }
    RuleBindings:
      type: object
      additionalProperties: false
      properties:
        exchange_account_ids: { type: array, items: { type: string, format: uuid } }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        trade_group_ids: { type: array, items: { type: string, format: uuid } }
    RuleInput:
      type: object
      additionalProperties: false
      required: [name, scope, ir]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        scope: { $ref: "#/components/schemas/RuleScope" }
        editor: { type: string, enum: [form, graph], default: form }
        tags: { type: array, items: { type: string, maxLength: 40 } }
        bindings: { $ref: "#/components/schemas/RuleBindings" }
        ir: { $ref: "#/components/schemas/RuleIr" }
        graph_layout:
          type: object
          additionalProperties: true
          description: Node/edge coordinates for the node-graph editor. Ignored by the engine.
        note: { type: string, maxLength: 280 }
    Rule:
      type: object
      required: [id, name, mode, scope]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: ["string", "null"] }
        mode: { $ref: "#/components/schemas/RuleMode" }
        scope: { $ref: "#/components/schemas/RuleScope" }
        editor: { type: string, enum: [form, graph] }
        tags: { type: array, items: { type: string } }
        active_version_id: { type: ["string", "null"], format: uuid }
        version: { type: integer }
        bindings: { $ref: "#/components/schemas/RuleBindings" }
        last_run_at: { type: ["string", "null"], format: date-time }
        last_run_status:
          { oneOf: [{ $ref: "#/components/schemas/RuleRunStatus" }, { type: "null" }] }
        fire_count_24h: { type: integer }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RuleDetail:
      allOf:
        - $ref: "#/components/schemas/Rule"
        - type: object
          properties:
            ir: { $ref: "#/components/schemas/RuleIr" }
            graph_layout: { type: ["object", "null"], additionalProperties: true }
            ir_hash: { type: string }
            last_simulation:
              type: object
              properties:
                run_id: { type: ["string", "null"], format: uuid }
                ir_hash: { type: ["string", "null"] }
                completed_at: { type: ["string", "null"], format: date-time }
                fires: { type: ["integer", "null"] }
    RuleVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
