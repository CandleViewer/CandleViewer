                items: { $ref: "#/components/schemas/Decimal" },
              },
            description: "[price, size], descending.",
          }
        asks:
          {
            type: array,
            items:
              {
                type: array,
                minItems: 2,
                maxItems: 2,
                items: { $ref: "#/components/schemas/Decimal" },
              },
            description: "[price, size], ascending.",
          }
        stale: { type: boolean }
    HeatmapResponse:
      type: object
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        time_bucket_ms: { type: integer }
        price_grouping: { type: integer }
        times: { type: array, items: { type: string, format: date-time } }
        prices: { type: array, items: { $ref: "#/components/schemas/Decimal" } }
        bid_matrix:
          {
            type: array,
            description: "Row-major [price][time] resting bid size.",
            items: { type: array, items: { type: number } },
          }
        ask_matrix:
          {
            type: array,
            description: "Row-major [price][time] resting ask size.",
            items: { type: array, items: { type: number } },
          }
        max_value: { type: number }
        normalize: { type: string, enum: [none, column, window] }
        estimated: { type: boolean, default: false }
    MetricPoint:
      type: object
      required: [t, v]
      properties:
        t: { type: string, format: date-time }
        v: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        meta:
          {
            type: object,
            additionalProperties: true,
            description: "Per-point detail for event-like metrics (iceberg, stop_run, absorption).",
          }
    MetricSeries:
      type: object
      required: [metric, points]
      properties:
        metric: { $ref: "#/components/schemas/MetricCode" }
        estimated: { type: boolean, description: "True for heuristic metrics (arch P10)." }
        params: { type: object, additionalProperties: true }
        unit: { type: string, examples: [base_volume, index, ratio, confidence, usd, price] }
        points: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
    MetricsResponse:
      type: object
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        bar_type: { $ref: "#/components/schemas/BarType" }
        param: { type: string }
        series: { type: array, items: { $ref: "#/components/schemas/MetricSeries" } }
        meta: { $ref: "#/components/schemas/DataMeta" }
    Liquidation:
      type: object
      properties:
        ts: { type: string, format: date-time }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [buy, sell] }
        price: { $ref: "#/components/schemas/Decimal" }
        size: { $ref: "#/components/schemas/Decimal" }
        notional_usd: { $ref: "#/components/schemas/Decimal" }
        cluster_size: { type: integer }
    DataCoverage:
      type: object
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        streams:
          type: array
          items:
            type: object
            properties:
              stream: { $ref: "#/components/schemas/StreamKind" }
              intervals:
                type: array
                items:
                  type: object
                  properties:
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
                    tier: { type: string, enum: [questdb, parquet] }
                    rows: { type: integer, format: int64 }
              gaps:
                type: array
                items:
                  type: object
                  properties:
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
                    reason:
                      {
                        type: string,
                        enum:
                          [
                            ws_disconnect,
                            backend_restart,
                            retention_purge,
                            never_recorded,
                            exchange_outage,
                          ],
                      }
        generated_at: { type: string, format: date-time }
    # === Recording / replay =================================================
    RecordedSymbol:
      type: object
      required: [id, symbol, reason, state]
      properties:
        id: { type: string, format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        reason: { $ref: "#/components/schemas/RecordReason" }
        pinned: { type: boolean }
        state: { $ref: "#/components/schemas/RecordingState" }
        streams: { type: array, items: { $ref: "#/components/schemas/StreamKind" } }
        depth: { type: integer, enum: [1, 50, 200, 500] }
        started_at: { type: ["string", "null"], format: date-time }
        retention_days: { type: ["integer", "null"] }
        disk_bytes: { type: integer, format: int64 }
        rows_last_hour: { type: integer, format: int64 }
        lag_ms: { type: integer }
        added_by: { type: ["string", "null"], format: uuid }
    RecordedSymbolWithEstimate:
      allOf:
        - $ref: "#/components/schemas/RecordedSymbol"
        - type: object
          properties:
            estimate:
              type: object
              description: Planning estimate, replaced by measured rates once the recorder has run for an hour.
              properties:
                daily_bytes_estimate: { type: integer, format: int64 }
                basis:
                  { type: string, examples: ["~0.5-0.75 GB/day/symbol compressed at depth 200"] }
                warning: { type: ["string", "null"] }
    AddRecordedSymbolRequest:
      type: object
      additionalProperties: false
      required: [symbol]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        streams:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/StreamKind" }
          default: [trades, orderbook_delta, tickers, liquidations]
        depth: { type: integer, enum: [1, 50, 200, 500], default: 200 }
        pinned: { type: boolean, default: false }
        retention_days: { type: ["integer", "null"], minimum: 1, maximum: 3650, default: 30 }
    UpdateRecordedSymbolRequest:
      type: object
      additionalProperties: false
      properties:
        streams: { type: array, minItems: 1, items: { $ref: "#/components/schemas/StreamKind" } }
        depth: { type: integer, enum: [1, 50, 200, 500] }
        pinned: { type: boolean }
        retention_days: { type: ["integer", "null"], minimum: 1, maximum: 3650 }
    RecordingStatus:
      type: object
      properties:
        overall: { $ref: "#/components/schemas/ComponentState" }
        connections:
          type: array
          items:
            type: object
            properties:
              endpoint: { type: string }
              state: { type: string, enum: [connecting, connected, degraded, disconnected] }
              subscribed_topics: { type: integer }
              connected_since: { type: ["string", "null"], format: date-time }
              reconnects_last_hour: { type: integer }
              last_ping_ms: { type: integer }
        symbols:
          type: array
          items:
            type: object
            properties:
              symbol: { $ref: "#/components/schemas/Symbol" }
              state: { $ref: "#/components/schemas/RecordingState" }
              lag_ms: { type: integer }
              rows_last_hour: { type: integer, format: int64 }
              dropped_messages: { type: integer, format: int64 }
              resyncs_last_hour: { type: integer }
              last_event_at: { type: string, format: date-time }
        ingest_rate_msgs_per_sec: { type: integer }
        write_backlog_rows: { type: integer, format: int64 }
        generated_at: { type: string, format: date-time }
    StorageUsage:
      type: object
      properties:
        disk_total_bytes: { type: integer, format: int64 }
        disk_used_bytes: { type: integer, format: int64 }
        disk_free_bytes: { type: integer, format: int64 }
        projected_full_at: { type: ["string", "null"], format: date-time }
        daily_growth_bytes: { type: integer, format: int64 }
        tiers:
          type: array
          items:
            type: object
            properties:
              tier: { type: string, enum: [questdb, parquet, postgres] }
              used_bytes: { type: integer, format: int64 }
              retention_days: { type: ["integer", "null"] }
        symbols:
          type: array
          items:
            type: object
            properties:
              symbol: { $ref: "#/components/schemas/Symbol" }
              used_bytes: { type: integer, format: int64 }
              daily_growth_bytes: { type: integer, format: int64 }
              pinned: { type: boolean }
        generated_at: { type: string, format: date-time }
    RetentionPolicyInput:
      type: object
      required: [stream, retain_days, action]
      properties:
        stream: { $ref: "#/components/schemas/StreamKind" }
        retain_days: { type: integer, minimum: 1, maximum: 3650 }
        action: { $ref: "#/components/schemas/RetentionAction" }
        symbol:
          {
            oneOf: [{ $ref: "#/components/schemas/Symbol" }, { type: "null" }],
            description: "Null = global default.",
          }
        applies_to_pinned: { type: boolean, default: false }
    RetentionPolicy:
      allOf:
        - $ref: "#/components/schemas/RetentionPolicyInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            updated_at: { type: string, format: date-time }
    RecordingSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        recorded_symbol_id: { type: string, format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        state: { $ref: "#/components/schemas/RecordingState" }
        started_at: { type: string, format: date-time }
        ended_at: { type: ["string", "null"], format: date-time }
        streams: { type: array, items: { $ref: "#/components/schemas/StreamKind" } }
        depth: { type: integer }
        rows: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        gap_count: { type: integer }
    CreateReplaySessionRequest:
      type: object
      additionalProperties: false
      required: [symbols, from, to]
      properties:
        symbols:
          { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/Symbol" } }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        speed:
          {
            type: number,
            minimum: 0,
            maximum: 100,
            default: 1,
            description: "0 = as fast as possible (used by rule simulation).",
          }
        streams: { type: array, items: { $ref: "#/components/schemas/StreamKind" } }
        depth: { type: integer, enum: [1, 50, 200, 500], default: 200 }
        paper_account_id: { type: ["string", "null"], format: uuid }
        autostart: { type: boolean, default: false }
    ReplaySession:
      type: object
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/ReplayState" }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        cursor_ts: { type: string, format: date-time }
        speed: { type: number }
        streams: { type: array, items: { $ref: "#/components/schemas/StreamKind" } }
        depth: { type: integer }
        paper_account_id: { type: ["string", "null"], format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        progress_pct: { type: number, minimum: 0, maximum: 100 }
        error: { type: ["string", "null"] }
    ReplayControlRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [play, pause, seek, step, set_speed, restart] }
        speed: { type: number, minimum: 0, maximum: 100 }
        to: { type: string, format: date-time, description: "Required for `seek`." }
        step_events: { type: integer, minimum: 1, maximum: 100000 }
        step_ms: { type: integer, minimum: 1, maximum: 3600000 }

    # === Trading ============================================================
    TriggerSpec:
      type: object
      additionalProperties: false
      required: [price, direction]
      properties:
        price: { $ref: "#/components/schemas/Decimal" }
        trigger_by: { $ref: "#/components/schemas/TriggerBy" }
        direction: { type: string, enum: [rise, fall] }
    AlgoSpec:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        Emulated execution algorithms. None of these exist as native Bybit order types on
        `/v5/order/create`; all are implemented client-of-exchange-side by the OMS (digest 09).
      properties:
        kind: { $ref: "#/components/schemas/AlgoKind" }
        oco:
          type: object
          additionalProperties: false
          properties:
            other_price: { $ref: "#/components/schemas/Decimal" }
            other_trigger: { $ref: "#/components/schemas/TriggerSpec" }
            cancel_timeout_ms:
              {
                type: integer,
                minimum: 100,
                maximum: 60000,
                default: 2000,
                description: "Max time to cancel the loser after the winner's fill notice arrives on the WS.",
              }
        iceberg:
          type: object
          additionalProperties: false
          properties:
            display_qty: { $ref: "#/components/schemas/Decimal" }
            refresh_on_fill_pct: { type: number, minimum: 1, maximum: 100, default: 100 }
            randomize_display_pct: { type: number, minimum: 0, maximum: 50, default: 0 }
        twap:
          type: object
          additionalProperties: false
          properties:
            duration_seconds: { type: integer, minimum: 10, maximum: 86400 }
            slices: { type: integer, minimum: 2, maximum: 500 }
            randomize_pct: { type: number, minimum: 0, maximum: 50, default: 0 }
            limit_offset_ticks:
              { type: integer, minimum: 0, maximum: 1000, description: "Omit for market slices." }
        chase:
          type: object
          additionalProperties: false
          properties:
            offset_ticks: { type: integer, minimum: 0, maximum: 100, default: 0 }
            max_chases: { type: integer, minimum: 1, maximum: 500, default: 20 }
            max_slippage_ticks: { type: integer, minimum: 1, maximum: 10000 }
            repricing_interval_ms: { type: integer, minimum: 50, maximum: 10000, default: 250 }
            fallback_to_market: { type: boolean, default: false }
        scaled:
          type: object
          additionalProperties: false
          properties:
            levels: { type: integer, minimum: 2, maximum: 50 }
            from_price: { $ref: "#/components/schemas/Decimal" }
            to_price: { $ref: "#/components/schemas/Decimal" }
            distribution: { type: string, enum: [equal, linear, geometric] }
            skew:
              {
                $ref: "#/components/schemas/Decimal",
                description: ">1 weights size toward `to_price`.",
              }
        bracket:
          type: object
          additionalProperties: false
          properties:
            take_profit_levels:
              type: array
              maxItems: 10
              items:
                type: object
                properties:
                  offset: { $ref: "#/components/schemas/Offset" }
                  pct_of_position: { $ref: "#/components/schemas/Decimal" }
            move_stop_to_breakeven_at: { $ref: "#/components/schemas/Offset" }
    PlaceOrderRequest:
      type: object
      additionalProperties: false
      required: [exchange_account_id, symbol, side, order_type, sizing]
      properties:
        exchange_account_id: { type: string, format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { $ref: "#/components/schemas/OrderSide" }
        order_type: { $ref: "#/components/schemas/OrderType" }
        intent: { $ref: "#/components/schemas/OrderIntent", default: entry }
        sizing: { $ref: "#/components/schemas/Sizing" }
        price: { $ref: "#/components/schemas/Decimal", description: "Required for `limit`." }
        time_in_force: { $ref: "#/components/schemas/TimeInForce" }
        reduce_only: { type: boolean, default: false }
        close_on_trigger: { type: boolean, default: false }
        position_idx:
          {
            type: integer,
            enum: [0, 1, 2],
            description: "Required in hedge mode (1 = long, 2 = short).",
          }
        trigger: { $ref: "#/components/schemas/TriggerSpec" }
        stop_loss: { $ref: "#/components/schemas/Offset" }
        take_profit: { $ref: "#/components/schemas/Offset" }
        tpsl_mode: { $ref: "#/components/schemas/TpSlMode" }
        algo: { $ref: "#/components/schemas/AlgoSpec" }
        profile_id:
          {
            type: ["string", "null"],
            format: uuid,
            description: "Override the account's active profile for this order.",
          }
        arm_token:
          {
            type: ["string", "null"],
            description: "Required when the request originates from one-click/hotkey entry.",
          }
        note: { type: string, maxLength: 280 }
    AmendOrderRequest:
      type: object
      additionalProperties: false
      properties:
        price: { $ref: "#/components/schemas/Decimal" }
        qty: { $ref: "#/components/schemas/Decimal" }
        trigger_price: { $ref: "#/components/schemas/Decimal" }
        take_profit: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        stop_loss: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
    CancelAllRequest:
      type: object
      additionalProperties: false
      properties:
        exchange_account_ids:
          {
            type: array,
            items: { type: string, format: uuid },
            description: "Empty = every account in scope.",
          }
        symbol: { oneOf: [{ $ref: "#/components/schemas/Symbol" }, { type: "null" }] }
        intents: { type: array, items: { $ref: "#/components/schemas/OrderIntent" } }
        exclude_reduce_only:
          {
            type: boolean,
            default: true,
            description: "Protects TP/SL exits from a blanket cancel.",
          }
    Order:
      type: object
      required: [id, exchange_account_id, symbol, side, order_type, state, qty]
      properties:
        is_paper:
          {
            type: boolean,
            default: false,
            description: "True when the paper matcher produced this record rather than the exchange. Orthogonal to `environment` (24-internal-schemas.md section 1.2).",
          }
        id: { type: string, format: uuid }
        exchange_account_id: { type: string, format: uuid }
        trade_group_id: { type: ["string", "null"], format: uuid }
        trade_group_leg_id: { type: ["string", "null"], format: uuid }
        parent_order_id: { type: ["string", "null"], format: uuid }
        order_link_id:
          {
            type: string,
            maxLength: 36,
            description: "Deterministic, derived from the Idempotency-Key.",
          }
        exchange_order_id: { type: ["string", "null"] }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { $ref: "#/components/schemas/OrderSide" }
        order_type: { $ref: "#/components/schemas/OrderType" }
        intent: { $ref: "#/components/schemas/OrderIntent" }
        state: { $ref: "#/components/schemas/OrderState" }
        qty: { $ref: "#/components/schemas/Decimal" }
        filled_qty: { $ref: "#/components/schemas/Decimal" }
        remaining_qty: { $ref: "#/components/schemas/Decimal" }
        price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        avg_fill_price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        time_in_force: { $ref: "#/components/schemas/TimeInForce" }
        reduce_only: { type: boolean }
        close_on_trigger: { type: boolean }
        position_idx: { type: integer }
        trigger_price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        trigger_by: { oneOf: [{ $ref: "#/components/schemas/TriggerBy" }, { type: "null" }] }
        trigger_direction: { type: ["string", "null"], enum: [rise, fall, null] }
        take_profit: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        stop_loss: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        tpsl_mode: { $ref: "#/components/schemas/TpSlMode" }
        algo: { $ref: "#/components/schemas/AlgoSpec" }
        environment: { $ref: "#/components/schemas/Environment" }
        rejected_reason: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderEventKind:
      type: string
      enum:
        [
          local_create,
          submit_attempt,
          ack,
          reject,
          fill,
          partial_fill,
          amend_request,
          amend_ack,
          cancel_request,
          cancel_ack,
          expire,
          exchange_push,
          reconcile_diff,
          error,
        ]
      x-db-enum: order_event_kind
      description: |
        Append-only OMS event taxonomy. Exact 1:1 mirror of the Postgres type
        `order_event_kind` (`21-database-schema.md`, table `order_events`) — no supersets,
        no omissions; contract test `enum_parity_order_event_kind` asserts set equality.
    OrderEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/OrderEventKind" }
        event_ts: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    OrderWithEvents:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            events: { type: array, items: { $ref: "#/components/schemas/OrderEvent" } }
            executions: { type: array, items: { $ref: "#/components/schemas/Execution" } }
    TradeGroupLegInput:
      type: object
      additionalProperties: false
      required: [exchange_account_id]
      properties:
        exchange_account_id: { type: string, format: uuid }
        overrides:
          type: object
          additionalProperties: false
          description: Per-leg overrides layered on top of the account profile and request defaults.
          properties:
            profile_id: { type: string, format: uuid }
            sizing: { $ref: "#/components/schemas/Sizing" }
            price: { $ref: "#/components/schemas/Decimal" }
            leverage: { $ref: "#/components/schemas/Decimal" }
            stop_loss: { $ref: "#/components/schemas/Offset" }
            take_profit: { $ref: "#/components/schemas/Offset" }
            trailing_stop: { $ref: "#/components/schemas/Offset" }
            time_in_force: { $ref: "#/components/schemas/TimeInForce" }
            tpsl_mode: { $ref: "#/components/schemas/TpSlMode" }
            position_idx: { type: integer, enum: [0, 1, 2] }
            skip:
              {
                type: boolean,
                default: false,
                description: "Keep the leg in the group for auditability but do not send it.",
              }
    CreateTradeGroupRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, order_type, legs]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { $ref: "#/components/schemas/OrderSide" }
        order_type: { $ref: "#/components/schemas/OrderType" }
        intent: { $ref: "#/components/schemas/OrderIntent", default: entry }
        reduce_only: { type: boolean, default: false }
        atomicity: { type: string, enum: [best_effort, all_or_none], default: best_effort }
        compensate:
          {
            type: string,
            enum: [none, flatten_filled],
            default: none,
            description: "Applies when `all_or_none` fails after sending.",
          }
        max_concurrent_legs: { type: integer, minimum: 1, maximum: 20, default: 5 }
        defaults:
          type: object
          additionalProperties: false
          properties:
            sizing: { $ref: "#/components/schemas/Sizing" }
            price: { $ref: "#/components/schemas/Decimal" }
            time_in_force: { $ref: "#/components/schemas/TimeInForce" }
            trigger: { $ref: "#/components/schemas/TriggerSpec" }
            stop_loss: { $ref: "#/components/schemas/Offset" }
            take_profit: { $ref: "#/components/schemas/Offset" }
            trailing_stop: { $ref: "#/components/schemas/Offset" }
            tpsl_mode: { $ref: "#/components/schemas/TpSlMode" }
        algo: { $ref: "#/components/schemas/AlgoSpec" }
        legs:
          {
            type: array,
            minItems: 1,
            maxItems: 25,
            items: { $ref: "#/components/schemas/TradeGroupLegInput" },
          }
        arm_token: { type: ["string", "null"] }
        note: { type: string, maxLength: 280 }
        rule_id:
          {
            type: ["string", "null"],
            format: uuid,
            description: "Set when the group originates from the rule engine.",
          }
    ResolvedLegParams:
      type: object
      description: >
        The exact parameters the server computed for a leg, echoed for pre-trade
        transparency. `leverage`, `stop_loss_price` and `take_profit_price` persist to the
        `resolved_leverage`, `resolved_sl_price` and `resolved_tp_price` columns on
        `trade_group_legs`; the remaining fields are the derivation shown to the user and
        are captured in the leg's `profile_snapshot` JSONB so a historical fan-out can be
        explained even after the profile is edited.
      properties:
        qty: { $ref: "#/components/schemas/Decimal" }
        price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        leverage:
          { $ref: "#/components/schemas/Decimal", description: "Persisted as `resolved_leverage`." }
        stop_loss_price:
          {
            $ref: "#/components/schemas/Decimal",
            description: "Persisted as `resolved_sl_price`. Never null - the native-stop invariant.",
          }
        take_profit_price:
          {
            oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }],
            description: "Persisted as `resolved_tp_price`.",
          }
        trailing_stop_distance:
          { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        notional_usd: { $ref: "#/components/schemas/Decimal" }
        risk_usd: { $ref: "#/components/schemas/Decimal" }
        estimated_fee_usd: { $ref: "#/components/schemas/Decimal" }
        sizing_explanation:
          {
            type: string,
            description: 'Human-readable derivation, shown in the ticket''s "why this size" tooltip.',
          }
    TradeGroupLeg:
      type: object
      description: >
        One account's share of a fan-out. Field names mirror the `trade_group_legs`
        columns in 21-database-schema.md §3.3.3 one-for-one; the only additions are
        `orders` (the leg's order ids, a join rather than a column) and `resolved`
        (the computed parameters, stored as `resolved_*` columns and the
        `profile_snapshot` JSONB).
      properties:
        id: { type: string, format: uuid }
        trade_group_id: { type: string, format: uuid }
        exchange_account_id: { type: string, format: uuid }
        account_profile_id:
          type: ["string", "null"]
          format: uuid
          description: The profile that produced `resolved`. Null when the ticket overrode the profile entirely.
        status: { $ref: "#/components/schemas/LegStatus" }
        sequence_no:
          type: integer
          description: Deterministic submission order within the group, so a partial fan-out is reproducible.
        resolved: { oneOf: [{ $ref: "#/components/schemas/ResolvedLegParams" }, { type: "null" }] }
        orders: { type: array, items: { type: string, format: uuid } }
        target_qty: { $ref: "#/components/schemas/Decimal" }
        filled_qty: { $ref: "#/components/schemas/Decimal" }
        avg_entry_price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        avg_exit_price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        native_sl_confirmed:
          type: boolean
          description: >
            True once the exchange has acknowledged a native stop-loss on this leg. The
            safety invariant (arch P4) requires this to become true for every filled leg;
            a filled leg with `false` is an alertable condition, not a cosmetic gap.
        native_sl_confirmed_at: { type: ["string", "null"], format: date-time }
        risk_usd: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        realised_pnl: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        fees_paid: { $ref: "#/components/schemas/Decimal" }
        error: { oneOf: [{ $ref: "#/components/schemas/LegError" }, { type: "null" }] }
        submitted_at: { type: ["string", "null"], format: date-time }
        closed_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LegError:
      type: object
      description: >
        Serialised form of the `rejection_code` / `rejection_message` columns on
        `trade_group_legs`.
      properties:
        code:
          {
            type: string,
            description: "One of the `x-error-codes` slugs; persisted as `rejection_code`.",
          }
        message: { type: string, description: "Persisted as `rejection_message`." }
        exchange_ret_code: { type: ["integer", "null"] }
        retryable: { type: boolean }
    TradeGroup:
      type: object
      required: [id, symbol, side, status, legs]
      properties:
        is_paper:
          {
            type: boolean,
            default: false,
            description: "True when the paper matcher produced this record rather than the exchange. Orthogonal to `environment` (24-internal-schemas.md section 1.2).",
          }
        id: { type: string, format: uuid }
        client_group_ref: { type: string }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { $ref: "#/components/schemas/OrderSide" }
        intent: { $ref: "#/components/schemas/OrderIntent" }
        status: { $ref: "#/components/schemas/TradeGroupStatus" }
        atomicity: { type: string, enum: [best_effort, all_or_none] }
        algo: { $ref: "#/components/schemas/AlgoSpec" }
        rule_id: { type: ["string", "null"], format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: ["string", "null"], format: date-time }
        note: { type: ["string", "null"] }
        legs: { type: array, items: { $ref: "#/components/schemas/TradeGroupLeg" } }
        totals:
          type: object
          properties:
            requested_legs: { type: integer }
            submitted_legs: { type: integer }
            rejected_legs: { type: integer }
            filled_qty: { $ref: "#/components/schemas/Decimal" }
            target_qty: { $ref: "#/components/schemas/Decimal" }
            realised_pnl: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
    AmendTradeGroupRequest:
      type: object
      additionalProperties: false
      properties:
        price: { $ref: "#/components/schemas/Decimal" }
        stop_loss: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        take_profit: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        trailing_stop: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
        legs:
          type: array
          description: Per-leg amendments; when present, the top-level fields are ignored for those legs.
          items:
            type: object
            additionalProperties: false
            required: [leg_id]
            properties:
              leg_id: { type: string, format: uuid }
              price: { $ref: "#/components/schemas/Decimal" }
              qty: { $ref: "#/components/schemas/Decimal" }
              stop_loss: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
              take_profit: { oneOf: [{ $ref: "#/components/schemas/Offset" }, { type: "null" }] }
    BulkAccountResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              exchange_account_id: { type: string, format: uuid }
              ok: { type: boolean }
              affected: { type: integer }
              error: { oneOf: [{ $ref: "#/components/schemas/LegError" }, { type: "null" }] }
        requested: { type: integer }
        succeeded: { type: integer }
    BulkLegResult:
      type: object
      properties:
        trade_group_id: { type: string, format: uuid }
        results:
          type: array
          items:
            type: object
            properties:
              leg_id: { type: string, format: uuid }
              exchange_account_id: { type: string, format: uuid }
              ok: { type: boolean }
              affected: { type: integer }
              error: { oneOf: [{ $ref: "#/components/schemas/LegError" }, { type: "null" }] }
        requested: { type: integer }
        succeeded: { type: integer }
    KillSwitch:
      type: object
      required: [engaged, scope]
      properties:
        engaged: { type: boolean }
        scope: { type: string, enum: [global, accounts] }
        exchange_account_ids: { type: array, items: { type: string, format: uuid } }
        engaged_at: { type: ["string", "null"], format: date-time }
        engaged_by: { type: ["string", "null"], format: uuid }
        reason: { type: ["string", "null"] }
    SetKillSwitchRequest:
      type: object
      additionalProperties: false
      required: [engaged, scope, reason]
      properties:
        engaged: { type: boolean }
        scope: { type: string, enum: [global, accounts] }
        exchange_account_ids: { type: array, items: { type: string, format: uuid } }
        cancel_open_orders: { type: boolean, default: true }
        flatten_positions: { type: boolean, default: false }
        disarm_rules: { type: boolean, default: true }
        reason: { type: string, minLength: 3, maxLength: 280 }
    KillSwitchResult:
      type: object
      properties:
        state: { $ref: "#/components/schemas/KillSwitch" }
        actions:
          type: object
          properties:
            orders_cancelled: { type: integer }
            positions_flattened: { type: integer }
            rules_disarmed: { type: integer }
            failures: { type: array, items: { type: object, additionalProperties: true } }

    # === Positions / executions ============================================
    Position:
      type: object
      required: [id, exchange_account_id, symbol, side, size]
      properties:
        is_paper:
          {
            type: boolean,
            default: false,
            description: "True when the paper matcher produced this record rather than the exchange. Orthogonal to `environment` (24-internal-schemas.md section 1.2).",
          }
        id: { type: string, format: uuid }
        exchange_account_id: { type: string, format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [long, short, flat] }
        position_idx: { type: integer, enum: [0, 1, 2] }
        size: { $ref: "#/components/schemas/Decimal" }
        avg_price: { $ref: "#/components/schemas/Decimal" }
        mark_price: { $ref: "#/components/schemas/Decimal" }
        position_value: { $ref: "#/components/schemas/Decimal" }
        leverage: { $ref: "#/components/schemas/Decimal" }
        margin_mode: { $ref: "#/components/schemas/MarginMode" }
        unrealised_pnl: { $ref: "#/components/schemas/Decimal" }
        realised_pnl_session: { $ref: "#/components/schemas/Decimal" }
        liq_price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        bust_price: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        take_profit: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        stop_loss: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        trailing_stop:
          {
            $ref: "#/components/schemas/Decimal",
