      summary: Play, pause, seek, step or change speed
      description: |
        `step` advances by `step_events` events or `step_ms` of replay time (exactly one of the
        two). `seek` repositions `cursor_ts`; the engine rebuilds book state from the nearest
        preceding snapshot, so a seek is never cheaper than a snapshot interval (60 s).
      x-rbac: { permissions: [replay:write], scope: self }
