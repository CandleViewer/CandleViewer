  /admin/recorder/import:
    post:
      tags: [recording]
      operationId: importTradeArchive
      summary: Import public trade archives into the cold tier (E16-T10)
      description: >
        Downloads the exchange's public daily trade archives for `symbol` over
        `[from, to]` (inclusive UTC dates, at most 366 days), verifies each file,
        and writes trades to the Parquet cold tier. Recorded data wins: rows inside a
        recorded window are discarded and reported. Imported windows are labelled
        archive-derived and cover `trades` only. Resumable and idempotent per day: a
        re-run skips finished days. Asynchronous; poll `GET /admin/jobs/{jobId}`
        (`kind: archive_import`); `result` carries the import summary. One import at a
        time (409 `job_running`). Audited as `recorder.import`.
      x-rbac: { permissions: [recording:write], scope: none }
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, from, to]
              additionalProperties: false
              properties:
                symbol: { $ref: "#/components/schemas/Symbol" }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "202":
          description: Import accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "409":
          description: An import job is already running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Idempotency-Key reused with a different body, or invalid range (`import_range_invalid`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/recorder/purge:
    post:
      tags: [recording]
      operationId: purgeRecordedData
      summary: Irreversibly delete recorded data (owner, step-up)
      description: >
        Destructive and irreversible. Requires an elevated session, a mandatory reason, and
        an explicit `confirm_symbol` echo that must equal the symbol being purged. Pinned
        symbols are refused unless `include_pinned` is set. Always audited with the exact
        window deleted.
        Elevation is the `recorder` step-up class (403 `step_up_required` with
        `action_class: recorder` until `POST /auth/step-up`; the ticket's
        `purge_requires_elevation`), checked after RBAC and before the body is parsed. 422 codes: `purge_confirmation_mismatch` (echo differs),
        `retention_pinned_refused` (pinned without `include_pinned`), `validation_failed`,
        `idempotency_key_reused`. 409 `job_running` while a purge is queued or running.
        The audit record (`retention.purge`, exact window, partition count, rows, bytes) is
        written BEFORE the job exists; if it cannot be written the answer is 503 and no job
        starts. `before` (default: now) bounds the window `[earliest, before)`; QuestDB DAY
        partitions shared with other symbols are left to the nightly roll-off.
      x-rbac: { permissions: [recording:write], scope: none }
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, confirm_symbol, reason]
              additionalProperties: false
              properties:
                symbol: { $ref: "#/components/schemas/Symbol" }
                confirm_symbol: { $ref: "#/components/schemas/Symbol" }
                reason: { type: string, minLength: 3, maxLength: 280 }
                before: { type: string, format: date-time }
                include_pinned: { type: boolean, default: false }
      responses:
        "202":
          description: Purge accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/backups/{backupId}/restore:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    post:
      tags: [admin]
      operationId: restoreBackup
      summary: Restore from a backup (owner, step-up `backups`)
      description: >
        Restores into the running deployment. Trading is force-disabled for the duration and
        must be re-enabled explicitly afterwards, so a restore can never silently resume
        order flow against stale OMS state (21-database-schema.md section 8.2).
        Asynchronous. `backups` is a no-grace step-up class: each restore spends a fresh code,
        and without one the route answers `403 step_up_required` with `action_class` set to
        `backups`.
        Preconditions (E42-T05), enforced in the backup service rather than the router so every
        caller inherits them, never trusted from the client, and checked in this order: maintenance
        mode (`maintenance.mode`) must be on, else `409 conflict` with rule
        `maintenance_mode_required`; no backup or restore may be running, else `409 conflict` with
        rule `backup_or_restore_running`; the backup's `status` must be `ok`, `verified` or
        `restored`, else `409 conflict` with rule `backup_not_usable`; if the open-position state
        cannot be read, the request must carry `acknowledge_unknown_positions: true`, else `409
        positions_unknown`; if positions are open, it must carry `acknowledge_open_positions: true`,
        else `409 conflict` with rule `open_positions_unacknowledged`. The two flags are separate;
        neither implies the other. A refusal creates no job and is not stored under the
        `Idempotency-Key`, so the same key and body can be retried once the cause clears. It has
        already spent the step-up code: the guard spends the one-shot `backups` grant when it admits
        the request, before the service checks preconditions, so the operator steps up again before
        retrying. Every attempt that passes RBAC and the step-up is audited as `backup.restore` at
        severity `error` before the response: a refusal with `outcome: failure` and the refusing
        rule (or `positions_unknown`) as `reason`, an accepted restore (a `backup_restore` job) with
        `outcome: success`. `critical` stays reserved for security events such as refresh-token
        reuse.
      x-rbac: { permissions: [backups:write], scope: none }
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_backup_id, reason]
              additionalProperties: false
              properties:
                confirm_backup_id: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 280 }
                components:
                  type: array
                  items: { type: string, enum: [postgres, questdb, parquet, config] }
                acknowledge_open_positions:
                  type: boolean
                  default: false
                  description: Explicit acknowledgement that positions are open (E42-T05).
                acknowledge_unknown_positions:
                  type: boolean
                  default: false
                  description: Accepts an unreadable open-position state (as on `resetUserMfa`).
      responses:
        "202":
          description: Restore accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            A restore precondition is not met (no job was created; `positions_unknown` when the
            open-position state could not be read), or the `Idempotency-Key` was reused with another
            body (`idempotency_key_reuse`) or is still in flight (`idempotency_in_flight`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                maintenanceOff:
                  value:
                    type: "https://candleviewer.local/errors/conflict"
                    title: "Concurrent modification or state conflict"
                    status: 409
                    code: conflict
                    detail: "Restore requires maintenance mode to be on."
                    errors:
                      - field: maintenance.mode
                        rule: maintenance_mode_required
                        message: "maintenance mode is off"
                positionsOpen:
                  value:
                    type: "https://candleviewer.local/errors/conflict"
                    title: "Concurrent modification or state conflict"
                    status: 409
                    code: conflict
                    detail: "2 positions are open; acknowledge them to restore."
                    errors:
                      - field: acknowledge_open_positions
                        rule: open_positions_unacknowledged
                        message: "2 open positions must be acknowledged"
                positionsUnknown:
                  value:
                    type: "https://candleviewer.local/errors/positions_unknown"
                    title: >-
                      Open-position state is unavailable; resend with
                      acknowledge_unknown_positions=true
                    status: 409
                    code: positions_unknown
                    detail: "The open-position state could not be read; acknowledge it to restore."
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Ed25519-signed JWT, 10-minute lifetime. Claims: `sub` (user id), `sid` (session id),
        `roles`, `perms` (permission codes), `scope` (granted exchange-account ids), `env`
        (allowed environments), `iat`, `exp`, `jti`. The server re-derives `perms`/`scope` from
        the database on every request; token claims are a cache, never the authority (arch P8).
    refreshCookie:
      type: apiKey
      in: cookie
      name: cv_refresh
      description: >
        Opaque, single-use, rotated refresh token. `HttpOnly; Secure; SameSite=Strict;
        Path=/api/v1/auth`. Also identifies the session for `POST /auth/unlock`,
        `POST /auth/logout` and `GET /auth/session` without a live access token ("Idle lock").
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Host-cv_csrf
      description: |
        SR-041 double-submit CSRF token, `<nonce>.<mac>` (rules in the CSRF section of
        `info.description`). `Secure; SameSite=Strict; Path=/`, no `Domain`, `Max-Age` equal to
        the `cv_refresh` lifetime, deliberately **not** `HttpOnly` so the client can echo it in
        `X-CSRF-Token`. Issued at login/MFA completion, rotated on every `/auth/refresh` and on a
        successful `/auth/step-up`, re-issued by `GET /auth/session`, expired on logout. It is not
        an authentication credential on its own and is listed here only to document the cookie.
        Enforcement is per operation via `components.parameters.CsrfToken`.

  # ---------------------------------------------------------------------------
  parameters:
    Cursor:
      name: cursor
      in: query
      description: "Opaque forward cursor from `meta.next_cursor`. Cursors expire after 1 hour."
      schema: { type: string, maxLength: 512 }
    MarketCursor:
      name: cursor
      in: query
      description: >-
        The single cursor statement for `/market/klines` and `/market/bars`: an opaque,
        server-issued cursor from `meta.next_cursor`. Ordering and the cursor are by
        `(generation, index)` for non-time bars (the cursor carries the last position's `t`,
        `generation` and `index`, #2017); `/market/klines` and time bars use a `t` position
        (open time is unique there). Clients must treat the
        cursor as opaque and never parse it, so the switch is non-breaking. Malformed, expired
        or foreign -> `invalid_cursor`. A cursor is bound to the request that issued it (route,
        symbol, interval or `bar_type`+`param`); replaying it on a different request is
        `invalid_cursor`. Uncursored requests are served as the first page (see the route text).
      schema: { type: string, maxLength: 128 }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    BarLimit:
      name: limit
      in: query
      description: Maximum number of bars returned in one page.
      schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
    From:
      name: from
      in: query
      description: Inclusive start of the time window (RFC 3339 UTC).
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Exclusive end of the time window (RFC 3339 UTC). Defaults to now.
      schema: { type: string, format: date-time }
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    SymbolQueryOptional:
      name: symbol
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Symbol" }
    SymbolPath:
      name: symbol
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    EnvironmentQuery:
      name: environment
      in: query
      schema: { $ref: "#/components/schemas/Environment" }
    AccountIdsQuery:
      name: exchange_account_ids
      in: query
      explode: true
      description: Restrict to these accounts. Omit for every account in the caller's scope.
      schema: { type: array, items: { type: string, format: uuid }, maxItems: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Client-generated UUIDv4. Replays return the original response with `Idempotency-Replayed: true`."
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated UUIDv4. REQUIRED on this operation; also seeds the deterministic exchange
        `orderLinkId`. Recorded only after authentication, CSRF, session state and authorisation
        all pass (Idempotency, "Binding point", #2304): a refused request binds nothing, so its
        identical re-send with the same key is a first submission.
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        SR-041 double-submit token. Must equal the `__Host-cv_csrf` cookie, and its MAC must verify
        against the session id the server resolves itself (not merely header == cookie). All
        comparisons are constant time. Sent by every client, browser or not. Required on every state-changing operation except
        the pre-session ones (see the CSRF section of `info.description`). Missing, mismatched or
        unbound → `403 csrf_token_invalid`.
      schema: { type: string, minLength: 1, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the version the client believes it is editing. Omitting it accepts last-write-wins.
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AcknowledgeUnknownPositions:
      name: acknowledge_unknown_positions
      in: query
      required: false
      description: >
        Must be `true` when the request disables the user, or removes any live account grant
        (every removal, not only the last one), while the user's open-position state is
        unavailable: the owner accepts that positions stay open, uncounted (US-ADMIN-002).
        Otherwise `409 positions_unknown`. It is a query parameter on purpose, unlike the body
        field of `resetUserMfa`: `DELETE` carries no body, and the disable and unbind routes
        share one parameter (decisions O2 on #965 and Q2 on #2648).
      schema: { type: boolean, default: false }
    MethodId:
      name: methodId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OpenExposure:
      name: open_exposure
      in: query
      required: false
      description: |
        The explicit choice SR-E27-07 requires before revoking an account's last active key or
        disabling the account while it holds open positions, working orders or running emulated
        algos. This is the one definition of the choice, of the stop-loss refusal, of unknown
        exposure, of its remedy and of a failed read: `updateExchangeAccount`, `revokeApiKey` and
        `deleteExchangeAccount` point here and add only what is specific to them.

        `leave_positions`: act now; positions and orders stay on the exchange untouched, each
        position keeps the native stop-loss it carries (C-2.6), and
        `consequences.open_positions[].native_stop_present` shows any that has none, while the
        account's emulated algos stop and its rules are disarmed. It is refused with
        `409 open_exposure` while any open position has no native stop-loss
        (`native_stop_present: false`): once the last key is revoked or the account is disabled
        nothing can re-assert a missing stop, so that position would stay unprotected (C-2.6),
        and the caller resends with `flatten_first`. The Owner's confirmation of this refusal is
        tracked on #2903; relaxing it later is non-breaking.

        `flatten_first`: flatten the account first (cancel its working orders, stop its algos,
        close its positions reduce-only), then act; if the account is still not flat, the action
        is not carried out and the answer is `409 open_exposure` with what remains. Without the
        parameter such a request is `409 open_exposure` with the consequence summary, and
        nothing changes. Ignored when the account holds no exposure.

        **Unknown exposure.** The exposure is read from the exchange for each request with the
        account's signable keys, `active` and `rotating` (`21-database-schema.md` §3.2.3a),
        whatever the exchange last said about them; a `pending`, `expired`, `invalid` or
        `revoked` key is never used to read it (`KeyStatus`). An account with no signable key
        cannot read its exposure: it is unknown and counts as dead (disabled with
        `leave_positions`, never deleted). An account that never had a key is disable-only on
        purpose: nothing can show that it holds no exposure, and "no key" is never taken for "no
        exposure". While a signable key can read it, the choices work as above. When the exchange
        refuses every signable key of the account (`auth_error`, `ip_not_allowed` or
        `permission_denied` in `KeyProbeError`), its positions and orders cannot be read and
        nothing can be flattened, so its exposure is unknown, not none. Whether the Owner can fix
        the refusal decides the answer, and the `409 exposure_unknown` says which in `remedy`
        (`ExposureRemedy`, a closed set, always present on it and on no other problem):

        - **Dead.** Only a credential the exchange no longer accepts (`auth_error`) makes a key
          dead, and an account is dead when every one of its signable keys is dead, or when it has
          none. `flatten_first`, or no choice, is then `409 exposure_unknown` with
          `remedy: leave_positions`, and nothing changes. The resend is a new request with a new
          `Idempotency-Key`: under the old key a request with `leave_positions` is
          `409 idempotency_key_reuse`, the replay fingerprint covering the choice.
          `leave_positions` is carried out: it is how a dead account is disabled or its last key
          revoked, and the stop-loss refusal is lifted only for a dead account, because no stop
          can be re-asserted there and `flatten_first` cannot run. The audit record of that
          disable or revoke (`account.disabled` of `24-internal-schemas.md` §15.5 for the
          disable, `api_key.revoke` of `audit/actions.py` for the revoke, written ahead of the
          change, C-2.9) carries the code `exposure_unknown`, the `KeyProbeError` of each
          signable key (none for an account without one) and that the stop-loss refusal was
          lifted. A dead account is disabled, never deleted.
        - **Fixable.** `ip_not_allowed` (the egress IP drifted from the key's whitelist, SR-033)
          and `permission_denied` are put right at the Bybit dashboard, so such a key is not
          dead. While every signable key is refused and any answers one of them, revoke,
          disable and delete answer `409 exposure_unknown` with `remedy: fix_key` for every
          `open_exposure` choice, `leave_positions` included, and nothing changes: fix the key
          first, then the OMS re-asserts the stop and `flatten_first` can run. The resend is a new
          request with a new `Idempotency-Key`: the identical request under the same key replays
          the stored `409` for 24 h (the Idempotency rule of `info.description`), whether or not
          the key has been fixed since.

        `deleteExchangeAccount` takes only `flatten_first`, so in both cases it answers
        `409 exposure_unknown`, whatever it carries; there `remedy: leave_positions` means
        disabling the account instead (`updateExchangeAccount` with `enabled: false`), a new
        request with a new `Idempotency-Key` that must carry `open_exposure=leave_positions`:
        without a choice that disable is `409 exposure_unknown` again.

        `exposure_unknown` is not the `409 positions_unknown` of the user lifecycle (E42), whose
        remedy is to resend with `acknowledge_unknown_positions=true`: these operations have no
        acknowledge parameter and delete never proceeds, so that remedy does not exist here.

        **A failed read.** A transient failure to read the exposure is never "no exposure" and
        never "dead". Every other `KeyProbeError` is a failed read: it says nothing about the
        key, so an account is not dead while any of its signable keys answers one of them. Such
        an answer is not a refusal, so while any signable key gives one neither the dead nor the
        fixable rule applies. When no signable key reads the exposure, the request fails closed:
        nothing is revoked, disabled or deleted, and the answer is a retryable error of its own,
        decided by the error of the key. `timeout` and `transport_error`, where the exchange gave
        no answer, give `503 exchange_unavailable` with `Retry-After` (a `timeout` is a `503`
        here, not the registry's `504 timeout`, because these operations declare `502` and `503`
        only). `clock_drift`, `rate_limited`, `service_unavailable` and `exchange_unknown`, where
        it answered with an error, give `502 exchange_error`. Keys that fail both ways give the
        `503`. Neither answer echoes exchange text: `Problem.exchange` holds `ret_code` only
        (omitted when the exchange sent none), never `ret_msg`, `endpoint`, `request_id` or any
        other exchange text, header, URL or request fragment (SR-E27-08). A failed read has no
        `remedy`: the caller retries.

        **Order.** When the signable keys of one request answer differently, the first of these
        decides: (1) a signable key reads the exposure, and the choices work as above, whatever
        another key answers; (2) else any signable key gives a failed read, and the request
        fails closed (**A failed read**); (3) else any signable key answers a fixable refusal
        (**Fixable**); (4) else the account is dead (**Dead**).

        The `Idempotency-Key` replay fingerprint covers this value as well as the method, path
        and body, so the same key with another choice, or with none, is
        `409 idempotency_key_reuse`. A `502` or `503` of a failed read is never stored for
        replay: the identical request re-sent with the same `Idempotency-Key` is a first
        submission, which reads the exposure again and is not answered from the idempotency
        store (no `Idempotency-Replayed`).
      schema: { $ref: "#/components/schemas/OpenExposureChoice" }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordedSymbolId:
