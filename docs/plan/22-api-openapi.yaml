        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ===========================================================================
  # ALERTS
  # ===========================================================================
  /alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alert definitions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: enabled
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/SymbolQueryOptional"
      x-rbac: { permissions: [alerts:read], scope: self }
      responses:
        "200":
          description: Alerts page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [alerts]
      operationId: createAlert
      summary: Create an alert
      description: |
        Alerts reuse the rule IR condition language but may only use notification actions —
        an alert can never place an order. `trigger_mode` is `once` (fire and disable),
        `every_time`, or `once_per_bar`. Channels are `in_app`, `desktop`, `email`, `webhook`.
      x-rbac: { permissions: [alerts:write], scope: self }
      x-idempotency: recommended
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertInput" }
            examples:
              priceCross:
                value:
                  name: "BTC reclaims 64k"
                  symbol: BTCUSDT
                  trigger_mode: once
                  channels: [in_app, desktop]
                  condition_ir:
                    ir_version: 1
                    trigger: { type: on_price_update, debounce_ms: 250 }
                    conditions:
                      node_id: c1
                      op: crosses_above
                      left: { metric: last_price }
                      right: { const: 64000 }
                  message_template: "BTCUSDT crossed 64000 (last {{market.last_price}})"
                  expires_at: "2026-09-21T00:00:00Z"
              stackedImbalance:
                value:
                  name: "Stacked sell imbalance on BTC 5m"
                  symbol: BTCUSDT
                  trigger_mode: once_per_bar
                  channels: [in_app]
                  condition_ir:
                    ir_version: 1
                    trigger: { type: on_bar_close, timeframe: "5m" }
                    conditions:
                      node_id: c1
                      op: gte
                      left: { metric: sell_stack_size, timeframe: "5m" }
                      right: { const: 3 }
                  message_template: "Stacked sell imbalance ({{footprint.sell_stack_size}}) at {{footprint.stack_price}}"
      responses:
        "201":
          description: Alert created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "422": { $ref: "#/components/responses/RuleIrInvalid" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /alerts/{alertId}:
    parameters: [{ $ref: "#/components/parameters/AlertId" }]
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Get an alert
      x-rbac: { permissions: [alerts:read], scope: self }
      responses:
        "200":
          description: Alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
