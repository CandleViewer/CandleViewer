  /admin/capacity/subaccount-tier:
    put:
      tags: [admin]
      operationId: setSubaccountTier
      summary: Record the Bybit sub-account tier as a fact (never inferred)
      description: |
        Records the system-scope setting `accounts.subaccount_tier` (21-database-schema.md 3.9)
        that `GET /admin/capacity` reports as `SubaccountCapacity`: cap 5 for `regular`, 20 for
        `business_kyc`. Owner-only (`admin:write`). Every successful call is audited as
        `settings.change` with the before and after tier, written ahead of the response; a denied
        attempt is audited too. The tier cannot be cleared here, and nothing else ever sets it.

        The tier is committed and audited before capacity is read. If the `used` source then
        fails, the call still returns `200` with `status: error`, and `tier`, `cap`, `tier_source`
        and `recorded_at` are populated. `503 store_unavailable` when storage fails: the tier is
        unchanged and no `settings.change` row is written. Its `detail` is a fixed reason, never
        the driver error. A successful write invalidates the cached `subaccounts` slice, so the
        next `GET /admin/capacity` shows the new tier at once (E42-T01 AC3).

        `Idempotency-Key` is not used: a repeat with the same tier returns `200` and is still
        audited (before == after). No step-up: `admin:write` is not an SR-025 action class, and a
        higher tier only widens a local cap on `createExchangeAccount`, which SR-E27-02 requires
        to be step-up gated; its accounts are inert until keys are attached via the step-up-gated
        key routes (SR-025).
      x-rbac: { permissions: [admin:write], scope: none }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tier]
              properties:
                tier: { type: string, enum: [regular, business_kyc] }
            examples:
              businessKyc: { value: { tier: business_kyc } }
      responses:
        "200":
          description: Tier recorded; the resulting sub-account capacity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubaccountCapacity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/incidents:
    get:
      tags: [admin]
      operationId: listIncidents
      summary: Open and recent operational incidents
      description: >
        Read-model over `system_events` at `error` and `critical` severity, grouped into
        incidents with first/last occurrence and affected component.
        Grouping (E42-T05): one incident per `(component, signature)`, where `signature` is the
        first 16 hex characters of a sha256 over the component, the error class
        (`system_events.kind`) and the message normalised by stripping ids, timestamps, numbers
        and symbols, so one fault never fragments into thousands of incidents. The grouping is a
        materialised read model refreshed whenever a grouped event is written or resolved, never
        aggregated per request. `occurrences` counts the grouped events; `severity` is the worst
        of them.
        Redaction: `title` (the normalised message) and `detail` (the latest event's message)
        pass through `candleviewer.observability.redaction.redact_text` before they are stored
        and are cut to their `maxLength`; when redaction fails, `detail` is `null`.
        Lifecycle: an incident is `resolved` once every grouped event is resolved
        (`system_events.resolved_at`); there is no resolve action, and acknowledging never
        resolves. A new occurrence reopens a `resolved` incident as `open` and clears
        `resolved_at`, `acknowledged_by` and `acknowledged_at` (the earlier acknowledgement stays
        in the audit log). On an `open` or `acknowledged` incident, a new occurrence at the same
        severity keeps the status, and one that raises `severity` from `error` to `critical`
        clears the acknowledgement (`status: open`), so the escalation alerts again. Duration is
        derived (`resolved_at`, or `last_seen_at` while unresolved, minus `first_seen_at`); there
        is no resolution text, since an incident resolves when its condition clears. A
        `resolved` incident is kept 24 months after `last_seen_at`.
        Ordered by `last_seen_at` descending; `status` filters.
      x-rbac: { permissions: [admin:read], scope: none }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { type: string, enum: [open, acknowledged, resolved] }
      responses:
        "200":
          description: Incidents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Incident" } }
              examples:
                grouped:
                  summary: Forty identical recorder write errors are one incident
                  value:
                    items:
                      - id: "1a000000-0000-4000-8000-000000000001"
                        component: recorder
                        severity: error
                        status: open
                        title: "parquet write failed for <symbol> segment <n>"
                        detail: "parquet write failed for BTCUSDT segment 41"
                        occurrences: 40
                        first_seen_at: "2026-10-15T08:00:00Z"
                        last_seen_at: "2026-10-15T08:39:00Z"
                        acknowledged_by: null
                        acknowledged_at: null
                        resolved_at: null
                        runbook_ref: null
                        signature: "5f0c2d9e4b7a1c3e"
                    meta: { next_cursor: null, has_more: false, count: 1 }
        "400":
          description: "Malformed request. For this operation `code: invalid_cursor` signals a malformed, foreign or expired `cursor` (one issued for a different `status` filter)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/incidents/{incidentId}/acknowledge:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      operationId: acknowledgeIncident
      summary: Acknowledge an open incident
      description: >
        Moves an `open` incident to `acknowledged` (E42-T05) and records who acknowledged it
        (`acknowledged_by`, `acknowledged_at`). The `incident.acknowledged` audit entry names the
        actor and is written ahead of the response; a denied attempt is audited as well.
        Acknowledging an already acknowledged incident returns it unchanged and writes no second
        entry. A `resolved` incident is `409 conflict`; an unknown id is `404 not_found`. A
        reopen or a severity escalation clears the acknowledgement (`listIncidents`).
        An `incident.acknowledged` record that cannot be written leaves the incident `open` and
        answers `503 audit_unavailable`.
      x-rbac: { permissions: [admin:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: The incident after the transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/statecharts:
    get:
      tags: [admin]
      operationId: listStatecharts
      summary: Statechart inspector - live machines and their supervision counters
      description: >
        Read model for the statechart inspector (E42-T07). One row per live machine of a kind
        that has a public entity id (the `machines.{entity}.state` grammar of E17-T08: B8, B9,
        B13 and B15 have none yet, so they get no row). Rows come from the persisted quiescent
        snapshots and the `cv_machine_*` metric families; the read path never holds, builds or
        queries an `Interpreter` (MUSTNOT-03).
        Per-entity visibility follows the `machines.{entity}.state` topic: the Owner sees every
        entity of an account-scoped or unscoped kind, while `alert`, `replay` and `session` stay
        self-scoped for every role, so only the caller's own appear. A row the caller may not see
        is omitted, never redacted. `kinds` adds one counters-only summary per kind and
        environment with no entity id, every live machine counted, so a latched machine without a
        row (a B8 `position_protection`, another user's `session`) still shows. `kinds` is the same
        on every page, and `kind` and `environment` narrow it as they narrow `items` (`degraded`
        does not).
        Machines are per environment (`machine_snapshots` is keyed by kind, entity and `env`): the
        singletons `kill_switch` and `live_gate` run once per environment, and a `machine_key` is
        unique within one environment. `environment` filters; each row carries its own. Rows are
        ordered by `machine_kind`, `machine_key`, then `environment`, ascending.
        Each snapshot's HMAC envelope is verified (`persistence.open_sealed`, CV-C53) before its
        `state`, `chain_trips` or `degraded` is shown. A snapshot that fails is left out of `items`
        and `kinds`, and `snapshots` is `error` with the fixed reason "snapshot seal did not
        verify". A failed seal also writes a `system_events` row (component `statechart`, severity
        `critical`, a fixed message), once per machine, environment and snapshot `updated_at`, not
        once per read, so it shows in `listIncidents`. `statechart` is not yet in the `se_component`
        CHECK (migration 0008, `21-database-schema.md` §3.10.2), so the route slice widens it in a
        new migration before it writes that row. When the snapshot store cannot be read, `items` and
        `kinds` are empty and `snapshots` says why (`AdminSliceStatus`); the response is still
        `200`.
      x-rbac: { permissions: [admin:read], scope: none }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EnvironmentQuery"
