      responses:
        "200":
          description: Pin state updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordedSymbol" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

