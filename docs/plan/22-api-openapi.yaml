  /telemetry/frontend:
    post:
      tags: [admin]
      operationId: postFrontendTelemetry
      summary: Push one aggregated frontend performance sample (E04-T06)
      description: |
        ADR-0014 §2 field telemetry. One pre-bucketed payload per 10 s per session (never raw samples);
        the server adds bucket counts into `fe_*` histograms labelled only by `screen`, a sitemap route id
        (closed `R-nnn` pattern, capped at 8 series). Bodies over 4096 bytes, unknown fields and wrong types are
        rejected with 400; more than one push per 10 s (burst 2) per session is rejected with 429. Every
        rejection increments `telemetry_rejected_total{reason}` and is never logged verbatim. No symbol,
        account or free-form string is accepted (threat A-17).
      x-rbac: { permissions: [], scope: self }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FrontendTelemetry" }
      responses:
        "204": { description: Accepted and aggregated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/feature-flags:
    get:
      tags: [admin]
      operationId: listFeatureFlags
      summary: List feature flags with their resolved values
      description: |
        Flags gate risky or incomplete surfaces (live trading enablement, node-graph rule editor,
        WS order entry, Tauri shell, heatmap v2). Kinds: `boolean`, `percentage` (rollout),
        `variant` (string choice). Per-user overrides are supported for staged rollout to the
        owner before managers.
        Resolution (E42-T03) is server-side only, per caller: user override, then role override,
        then percentage rollout (`hash(user_id || flag_key)`), then the deployment default
        (`21-database-schema.md` 3.9). Flag definitions are code (a reviewed registry), never
        configuration: a flag may gate a UI surface or an incomplete feature, never
        authentication, RBAC enforcement, audit writing, the native-SL invariant, withdrawal
        permission or rate limiting (C-4.14), and the service refuses to start with a definition
        that declares one of them. Each definition must declare its `visibility`, which has no
        default: `all_roles`, or `owner_only` for a flag no manager or viewer session ever learns
        (`21-database-schema.md` 10.7 gives each flag's; `23-ws-protocol.md` 15.9).
        `trading.live_enabled` and the kill-switch-class flags (`maintenance.mode`,
        `killswitch.*`) resolve from the deployment value only: user and role overrides for them
        are ignored at resolution, not merely refused on write, so an override row that reached
        the store another way (a seed, a migration, a direct database change) changes nothing.
        Kill-switch-class flags are re-read at least every 5 s and never served from the 30 s
        cache. `trading.live_enabled` is not kill-switch-class, so the 30 s cache applies to it:
        the fast stop is the kill switch, at 5 s or less. Override values on a `percentage` flag
        are booleans that pin a user in (`true`) or out (`false`) of the rollout.

        The flag store is unreachable when its read fails or exceeds its read budget, the system
        setting `flags.read_budget_ms` (default 500 ms, tunable from 50 to 2000 ms, so never more
        than the 2 s push bound; an out-of-range configured value refuses startup). Every flag
        then resolves to its fail-closed value: the restrictive one for the safety-relevant flags
        (`maintenance.mode` and `killswitch.order_entry` engaged, so an unknown state refuses new
        orders through the shared order-entry gate; `trading.live_enabled` off) and the registry
        default for every other flag. `killswitch.ingestion` is outside that restrictive set: it
        fails closed to its default, so an unreachable store never stops ingestion. The answer is
        still `200`, with `resolution: fail_closed`, and every flag omits `default_value`,
        `overrides`, `updated_at` and `updated_by`, so the console can say these are fail-closed
        values, not the current ones. `resolution` is always sent.

        A single unreadable stored row (malformed, or a kind mismatch) is not an outage. That
        flag alone resolves to its fail-closed value and is marked `unreadable: true`; it omits
        `default_value` (the stored value it cannot read) and `updated_by`, while every other flag
        resolves normally and `resolution` stays `stored`. The flag stays writable: its
        `updated_at` is still served, so a `PUT` with a valid value and that `expected_updated_at`
        repairs it. An unreadable override row for a non-safety flag is ignored for that user,
        and a metric counts it.
      x-rbac: { permissions: [flags:read], scope: none }
      responses:
        "200":
          description: Flags.
          content:
            application/json:
              schema:
                type: object
                required: [resolution]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FeatureFlag" } }
                  resolution: { $ref: "#/components/schemas/FeatureFlagResolution" }
              examples:
                flags:
                  value:
                    resolution: stored
                    items:
                      - {
                          key: trading.live_enabled,
                          kind: boolean,
                          description: "Master switch for live-environment order entry; stays off until the pen-test passes (R4 gate).",
                          value: false,
                          default_value: false,
                          overrides: [],
                          updated_by: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0001",
                          updated_at: "2026-09-14T08:00:00Z",
                        }
                      - {
                          key: rules.graph_editor,
                          kind: boolean,
                          description: "Node-graph rule editor surface.",
                          value: true,
                          default_value: false,
                          overrides:
                            [{ user_id: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0001", value: true }],
                          updated_by: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0001",
                          updated_at: "2026-09-12T10:00:00Z",
                        }
                      - {
                          key: killswitch.order_entry,
                          kind: boolean,
                          description: "Order-entry kill switch. Its stored row is unreadable, so it alone resolves engaged.",
                          value: true,
                          overrides: [],
                          updated_at: "2026-09-15T09:30:00Z",
                          unreadable: true,
                        }
                storeUnreachable:
                  summary: The flag store is unreachable, so every flag shows its fail-closed value
                  value:
                    resolution: fail_closed
                    items:
                      - key: trading.live_enabled
                        kind: boolean
                        description: "Master switch for live-environment order entry; stays off until the pen-test passes (R4 gate)."
                        value: false
                      - key: maintenance.mode
                        kind: boolean
                        description: "Maintenance mode: new orders are refused on submit paths."
                        value: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/feature-flags/{flagKey}:
    parameters:
      - name: flagKey
        in: path
        required: true
        schema: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(\.[a-z0-9_]+)+$' }
    put:
      tags: [admin]
      operationId: setFeatureFlag
      summary: Set a feature flag's value and overrides
      description: |
        `trading.live_enabled` is special-cased: enabling it requires `reason` and a recorded
        pen-test reference (`evidence_url`), per the R4 release gate in `07-release-and-prr.md`.
        Without `reason` the call fails `422 validation_failed` with rule `required`; without
        `evidence_url`, with rule `gate_evidence_required`.

        Write rules (E42-T03), all enforced server-side:
        - Every write carries `reason` and `expected_updated_at` (the `updated_at` the caller last
          read). Without either the call fails `422 validation_failed` (rule `required`).
        - `value` must match the flag's kind: a boolean on a `boolean` flag, an integer 0-100 on
          a `percentage` flag (its rollout), one of the flag's variants on a `variant` flag. An
          override value is a boolean on `boolean` and `percentage` flags (on a `percentage` flag
          it pins the user in or out of the rollout) and one of the flag's variants on a
          `variant` flag. Anything else is `422 validation_failed` (rule `kind_mismatch`). An
          unknown `flagKey` is `404 not_found`.
        - An omitted `overrides` keeps the flag's existing overrides; `overrides: []` clears
          them. An `overrides[].user_id` that names no user is `422 validation_failed` (rule
          `unknown_user`).
        - `reason` and every other string value of the request (`evidence_url`,
          `expected_updated_at`, an override's `user_id`, and `value` and an override's `value`
          on a `variant` flag), and every object member name in it, refuse control, zero-width
          and bidirectional formatting characters, line and paragraph separators, tag characters
          and lone surrogates, so that a recorded text cannot render as other text: U+0000 to
          U+001F (`\t`, `\n` and `\r` included, so a multi-line `reason` is refused), U+007F to
          U+009F (DEL and the C1 controls), U+061C (the Arabic letter mark), U+200B to U+200F
          (ZWNJ and ZWJ included, so an emoji ZWJ sequence is refused), U+2028 and U+2029,
          U+202A to U+202E, U+2066 to U+2069, U+D800 to U+DFFF, U+FEFF (the byte order mark) and
          U+E0000 to U+E007F (the Tags block). The call fails `422 validation_failed` (rule
          `invalid_character`) and nothing is written, also for a member name the request does
          not define (never `extra_forbidden`).
        - Decision order: authentication; RBAC and scope, before any validation that needs a
          lookup, so a caller without `flags:write` learns nothing from a `422`; request
          validation; then, under the row lock, the step-up gate, the precondition and the write.
        - `flags:write` is a dangerous permission. Every write needs exactly one fresh step-up
          elevation, chosen by key and by the stored value read under the row lock that
          `expected_updated_at` is checked against, never the cached value. An unreadable row
          counts as its fail-closed value (engaged for a kill-switch-class flag, off for
          `trading.live_enabled`): releasing a kill-switch-class flag (`true` to `false`) needs
          `killswitch`, writing `true` to `trading.live_enabled` needs `live_enablement` whatever
          is stored (both no-grace, single use), and every other write needs `flags` (5-minute
          grace). So repairing an `unreadable` kill-switch-class flag to `false` is a release
          (`killswitch`). Without that elevation the call is `403 step_up_required`. This console
          is not the emergency control: engaging a kill switch here needs only `flags`, and the
          code-free emergency engage stays `POST /trading/kill-switch`.
        - `trading.live_enabled` and the kill-switch-class flags take no overrides: any override
          on them is `422 validation_failed` (rule `overrides_not_allowed`), and resolution
          ignores any override row they hold (`GET /admin/feature-flags`).
        - The write locks the flag row and compares `expected_updated_at` with the stored
          `updated_at`. A mismatch is `409 conflict` carrying the current flag in `current`; it is
          never last-write-wins. No `Idempotency-Key` is accepted: the precondition already makes
          a retry safe, so a `409` here is always `conflict` with `current`.
        - `trading.live_enabled: true` without `evidence_url` is `422` (rule
          `gate_evidence_required`) and nothing is written. `evidence_url` must be an `https` URL
          (rule `https_required`) of at most 2048 characters (rule `string_too_long`). The audit
          records it, so the write rejects userinfo and any query or fragment parameter named on a
          token deny-list (rule `credential_in_url`); a path token is an accepted residual. The
          service validates it (the generated model checks only the URI format), never
          dereferences it and only enforces the precondition; E44-T04 owns the evidence binding.
        - If the flag store is unreachable (as `GET /admin/feature-flags` defines it), the write
          is `503 store_unavailable` and nothing is written. An unreadable stored row is not an
          outage: a write with a valid value repairs it.
        - Every attempt past authentication and RBAC is audited as `flags.change` with the key,
          before, after, `reason` and `evidence_url`, including refused and conflicting ones and
          every `422` (such as `gate_evidence_required`, `kind_mismatch`, `unknown_user` and
          `overrides_not_allowed`); a `step_up_required` challenge writes `auth.step_up_required`
          and no `flags.change`, and one that refuses a no-grace grant bound to another request
          also writes `auth.step_up_mismatch`, ahead of its `403`. The `flags.change` record is
          durable before the flag write commits, or the write is refused (write-ahead, C-2.9). A
          `503 store_unavailable` (no row can be read) is logged instead, with only the key and
          correlation id, plus a metric (SR-125). An unreadable row's `before` is `unreadable`,
          never its raw value. Toggling `maintenance.mode` is also audited as
          `maintenance.enabled` or `maintenance.disabled`.
        - A successful write pushes a `SystemUpdate` of kind `feature_flags`, carrying only the
          changed key, to every session the flag's `visibility` admits (`23-ws-protocol.md` 15.9).

        `maintenance.mode` is a kill-switch-class flag. While it is on, the shared order-entry
        gate refuses every submission that opens or increases exposure, before any OMS work, with
        `403 trading_disabled` and `reason: maintenance` (`24-internal-schemas.md` 8.10 lists the
        submit paths and amends it covers). Cancels, `closePosition` and `closeAllPositions`
        (flatten), quantity-reducing and stop-tightening amends stay available, and so does the
        kill switch's own flatten; native exchange stop-losses are never touched. Attaching a
        missing native SL, tightening a stop, or re-arming a protective trigger is never gated;
        "trigger re-armed" means an exposure-increasing (entry) trigger. An amend with any
        risk-increasing component is gated. Turning it on cancels only running emulated algos, so
        resting entry orders can still fill, and sends every session a `notice`; the recorder
        keeps running unless `maintenance.keep_recorder` is `false`. The algo cancels, the notice
        and the `maintenance.*` audit happen only on a stored value actually read as `true`, at
        the transition of the stored value, never on a transient store failure or an unreadable
        row: a fail-closed engagement only refuses submissions. A boot that finds a stored `true`
        counts as a transition from unknown, so its side effects run.
      x-rbac: { permissions: [flags:write], scope: none }
      x-idempotency: ignored
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetFeatureFlagRequest" }
            examples:
              enableLive:
                value:
                  {
                    value: true,
                    reason: "Pen-test PT-2026-11 closed with no highs/criticals",
                    evidence_url: "https://github.com/basiltt/CandleViewer/issues/412",
                    expected_updated_at: "2026-09-14T08:00:00Z",
                  }
      responses:
        "200":
          description: Flag updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            The flag changed after the caller read it (`expected_updated_at` no longer matches).
            `code: conflict`; `current` is the flag as it stands now, resolved for the caller.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/FeatureFlagConflict" }
              examples:
                staleRead:
                  value:
                    type: "https://candleviewer.local/errors/conflict"
                    title: "Concurrent modification or state conflict"
                    status: 409
                    code: conflict
                    detail: "rules.graph_editor changed since 2026-09-12T10:00:00Z."
                    current:
                      key: rules.graph_editor
                      kind: boolean
                      description: "Node-graph rule editor surface."
                      value: false
                      default_value: false
                      overrides: []
                      updated_by: "9f1c2b4e-0a1d-4f2b-9e3a-11c0ffee0002"
                      updated_at: "2026-09-12T10:00:03Z"
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/backups:
    get:
      tags: [admin]
      operationId: listBackups
      summary: List backup runs
      description: >
        The backup catalogue (the `backups` table, E42-T05), newest first: ordered by
        `started_at` descending with `id` descending as the tie-break, behind an opaque keyset
        cursor bound to the `kind` and `status` filters it was issued for and valid for one hour.
        `location` is the artefact's path on the backup volume and `error` a stable code; the
        encryption key alias is never returned. A backup whose artefact was deleted is listed with
        `deleted_at` set. Until a backup engine records runs in the catalogue the operation
        answers `501 not_implemented`, never an empty page that would read as "no backups"; a
        catalogue that cannot be read within its budget is `503 store_unavailable`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/BackupKind" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BackupStatus" }
      x-rbac: { permissions: [backups:read], scope: none }
      responses:
        "200":
          description: Backups page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
              examples:
                nightly:
                  value:
                    items:
                      - {
                          id: "18000000-0000-4000-8000-000000000001",
                          kind: pg_dump,
                          status: verified,
                          started_at: "2026-09-14T03:00:00Z",
                          finished_at: "2026-09-14T03:04:12Z",
                          size_bytes: 1421000000,
                          location: "/backups/pg/2026-09-14.dump.age",
                          checksum_sha256: "a1b2c3…",
                          encrypted: true,
                          retention_until: "2026-12-13T03:00:00Z",
                          verified_at: "2026-09-14T03:10:00Z",
                          error: null,
                        }
                      - {
                          id: "18000000-0000-4000-8000-000000000002",
                          kind: config_bundle,
                          status: ok,
                          started_at: "2026-09-14T03:05:00Z",
                          finished_at: "2026-09-14T03:05:03Z",
                          size_bytes: 184000,
                          location: "/backups/config/2026-09-14.tar.age",
                          checksum_sha256: "d4e5f6…",
                          encrypted: true,
                          retention_until: "2027-09-14T03:05:00Z",
                          verified_at: null,
                          error: null,
                        }
                    meta: { next_cursor: null, has_more: false, count: 2 }
        "400":
          description: "Malformed request. For this operation `code: invalid_cursor` signals a malformed, foreign or expired `cursor` (one issued for different `kind` or `status` filters)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [admin]
      operationId: createBackup
      summary: Trigger a backup run
      description: |
        Backups are always encrypted at rest (age/AES-256) and never contain plaintext API
        secrets — the key material is exported only as its wrapped form, so a restore on a host
        without the KEK cannot trade. `verify: true` (the default) schedules an automatic
        restore-into-scratch verification after the dump completes.
        A run is a `backup` job whose id is the `Backup.id` of the `202` body (E42-T05): poll
        `GET /admin/jobs/{Backup.id}`, which reports `kind: backup`. When the run's
        `stage: finished` record cannot be written, the row ends `failed` with
        `error: audit_unavailable`, and the job may read `succeeded` only if its `result` then also
        carries `audit: "unavailable"`: the row is the truth. A client takes a run's outcome from
        its row (`getBackup`), not from the job's `status`: a `succeeded` job is final only once
        the row has left `running`. The run is audited as `backup.run` ahead of the response.
        While a backup or a restore is running, a new run is
        `409 conflict` with rule `backup_or_restore_running` and starts nothing. A run that
        cannot take the backups admission lock (`deleteBackup`) within its wait is
        `503 store_unavailable` with `Retry-After`, before any record, and starts nothing.
        Order (E42-T05): the first of these that applies answers, and no record is written before
        the plan: no backup engine wired, `501 not_implemented`; the hourly limit,
        `429 rate_limited` (checked before the lock and again once it is held, so it still comes
        ahead of the `409`); the backups admission lock, `503 store_unavailable`; a running backup
        or restore, `409 conflict`; the engine's plan, `503 backup_engine_invalid` when it is not
        encrypted under a key alias, whatever else it breaks, or `503 store_unavailable` when the
        engine cannot plan the run; then the `requested` record and the start.
        Records (E42-T05): `backup.run` is written with `after_state.stage: requested` before the
        `202` (when it cannot be written the answer is `503 audit_unavailable` and nothing
        starts) and again with `stage: finished` when the run ends, carrying the outcome,
        `size_bytes` and `checksum_sha256`; the catalogue row becomes `ok` only after that record
        is written, so the digest of every single-file artefact is bound in the append-only log,
        and `verifyBackup` and `restoreBackup` check the artefact against it. `note` is kept in the
        `requested` record's `reason` and nowhere else; the row records `triggered_by: manual` and
        the caller. A run whose backup engine plan (what the engine reports for the run: the
        artefact's location, whether it is encrypted and under which key alias) is not encrypted
        under a key alias (`encrypted: false`, or no alias named) breaks the rule that backups are
        always encrypted, so it is refused fail closed: its failure record (`backup.run`,
        `stage: refused`, `outcome: failure`) is written first, then the answer is
        `503 backup_engine_invalid`, nothing starts, and runs stay refused this way until the engine
        configuration is fixed. A run refused as `backup_engine_invalid` writes one record, with
        `stage: refused`, instead of the `requested` and `finished` ones. When that failure record
        cannot be written, the answer is `503 audit_unavailable` and nothing starts. A user may
        start at most
        4 runs in a rolling hour, else `429 rate_limited` with `Retry-After`. A run refused as
        `backup_engine_invalid` counts as a start, once its record is written, and the limit is
        checked before the plan, so past it the answer is `429 rate_limited`, not
        `503 backup_engine_invalid`. Until a backup engine is wired the operation answers
        `501 not_implemented`, writes no record and starts nothing.
      x-rbac: { permissions: [backups:write], scope: none }
      x-idempotency: recommended
      parameters:
        [
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { $ref: "#/components/schemas/BackupKind" }
                verify: { type: boolean, default: true }
                note: { type: string, maxLength: 280 }
      responses:
        "202":
          description: Backup started; `id` is also the id of its `backup` job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/backups/{backupId}:
    parameters: [{ $ref: "#/components/parameters/BackupId" }]
    get:
      tags: [admin]
      operationId: getBackup
      summary: Get a backup run
      description: >
        One catalogue row (E42-T05) as `listBackups` serves it, a deleted artefact's row included
        (`deleted_at` set). `501 not_implemented` and `503 store_unavailable` as on `listBackups`.
      x-rbac: { permissions: [backups:read], scope: none }
      responses:
        "200":
          description: Backup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [admin]
      operationId: deleteBackup
      summary: Delete a backup artefact
      description: >
        Needs a fresh `backups` step-up elevation (E42-T05). `backups` is a no-grace class, so
        each delete spends one code; without one the route answers `403 step_up_required` with
        `action_class` set to `backups`. Audited as `backup.deleted` (actor, backup id,
        `before_state.status`) ahead of the `204`; an attempt refused after RBAC and step-up is
        audited with `outcome: failure`.
        Effect (E42-T05): the artefact is removed from the backup volume and the catalogue row is
        kept, since the catalogue is kept forever (`21-database-schema.md` section 7): the row
        gains `deleted_at` and records who deleted it (not exposed), its `status` is unchanged,
        and a later verify, link or restore of it is `409 conflict` with rule
        `backup_not_usable`. An unknown backup is `404` before any challenge. After the grant is
        spent, and in this order, a backup already deleted is `409 conflict` with rule
        `backup_deleted`; one that is `running`, or that a running verification or restore uses,
        is `409 conflict` with rule `backup_in_use`; and the last backup of its `kind` that is
        verified and not deleted (`status` `verified` or `restored` with `verified_at` set, no
        `deleted_at`) is `409 conflict` with rule `last_usable_backup`, so no kind loses its last
        verified backup; this rule counts only a verified backup as usable, a narrower sense than
        in `backup_not_usable`, which also admits an `ok` backup that was never verified. The
        three conflicts are evaluated and the row marked under the backups admission lock, one
        delete at a time. The backups admission lock is the one process-wide lock that admits a
        run, a verification, a restore, a delete and a download-link issue one at a time (#966
        Q6; BK-7 builds it).
        An admission that cannot take that lock within its wait is `503 store_unavailable` with
        `Retry-After`. A run or a verification then writes no record and starts nothing; a delete
        or a restore is refused after its grant is spent, so the grant is gone, its failure record
        (`backup.deleted` or `backup.restore`, `outcome: failure`) is written ahead of the `503`,
        and the operator steps up again to retry. A download-link issue is refused the same way
        after its grant is spent, with a record of its own (`issueBackupDownload`). When a delete's
        failure record cannot be written, for this `503` or for any `409 conflict` after the grant
        is spent, the answer is `503 audit_unavailable` and the grant stays spent.
        The challenge's `action_summary` template is
        `Delete the artefact of backup '<backupId>' (<kind>)` and `target` is null; the
        `backup.deleted` record names the `challenge_id` of the grant it spent. If the artefact
        cannot be removed after the record is written, a second `backup.deleted` record with
        `outcome: failure` follows, the row is unchanged, and the answer is
        `503 store_unavailable`, a code that here also covers the backup volume. Until an
        artefact remover is wired the operation answers `501 not_implemented` before any
        challenge.
      x-rbac: { permissions: [backups:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/backups/{backupId}/verify:
    parameters: [{ $ref: "#/components/parameters/BackupId" }]
    post:
      tags: [admin]
      operationId: verifyBackup
      summary: Verify a backup by restoring it into a scratch namespace
      description: >
        Restores into an isolated scratch database/namespace, runs integrity assertions (row counts,
        hash-chain verification, migration version) and discards it. Never touches live data.
        Outcome (E42-T05): the `backup_verify` job (`GET /admin/jobs/{jobId}`) ends `succeeded` and
        sets `status: verified` and `verified_at` and clears `error`, whatever the status was
        before (`restored` included: the latest outcome wins), or ends `failed` with a stable
        `error` code (`checksum_mismatch` when the stored digest does not match) and records the
        failed verification on the backup row (`status: failed`, `error`), except for
        `store_unavailable`, which leaves the row unchanged. A failed re-verify leaves
        `verified_at` at the last successful verification. Either outcome is audited as
        `backup.verified`.
        Integrity first (E42-T05): when the backup's kind produces a single-file artefact, the job
        hashes that file and compares its SHA-256 with `checksum_sha256` and with the digest the
        run's `backup.run` record bound, before anything is decrypted or restored. A mismatch is
        `checksum_mismatch`, no bound record is `checksum_unbound`, and an artefact that is
        missing or whose `location` does not resolve, without following a symbolic link, to a
        regular file inside the backup root is `artefact_missing`. A directory or repository
        artefact (such as a QuestDB snapshot or a restic repository) is checked by the backup
        engine's own verifier instead. A failed scratch-restore assertion is `verify_failed`. An
        artefact that exists but cannot be read (for instance an I/O error on the backup volume) is
        `store_unavailable`: the job ends `failed` and `backup.verified` (`stage: finished`,
        `outcome: failure`, `error: store_unavailable`) is still written, but the row keeps its
        `status`, `error` and `verified_at`, since an unreadable store makes the verification
        inconclusive, not evidence against the backup.
        `backup.verified` is written with `after_state.stage: requested` before the `202` (when
        it cannot be written the answer is `503 audit_unavailable` and nothing is scheduled), and
        with `stage: finished`, the outcome and the `error` code when the job ends, before the row
        changes. A backup whose `status` is `running`, whose artefact was deleted or that is
        recorded with `encrypted: false` is `409 conflict` with rule `backup_not_usable`. One
        verification runs at a time: while another is running a new one is `409 conflict` with
        rule `verify_running`, and while a restore is running, with rule
        `backup_or_restore_running`. A verification that cannot take the backups admission lock
        (`deleteBackup`) within its wait is `503 store_unavailable` with `Retry-After`, before any
        record, and schedules nothing. A user may start at most 12 verifications in a rolling hour,
        else `429 rate_limited` with `Retry-After`. Until a verifier is wired the operation
        answers `501 not_implemented` and schedules nothing.
      x-rbac: { permissions: [backups:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "202":
          description: Verification scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/backups/{backupId}/download:
    parameters: [{ $ref: "#/components/parameters/BackupId" }]
    post:
      tags: [admin]
      operationId: issueBackupDownload
      summary: Issue a single-use, five-minute download link for a backup artefact
      description: >
        Backup artefacts are secret-bearing (they hold envelope-encrypted key material), so a
        download is a link that works once and expires 5 minutes after issue (E42-T05). Issuing
        needs a fresh `backups` step-up elevation. `backups` is a no-grace class
        (`NO_GRACE_ACTION_CLASSES` in `auth/step_up.py` and `statechart/bindings/b16_session.py`,
        kept equal by `tests/xstate_contract/test_b16.py`), so each link
        spends one code; without one the route answers `403 step_up_required` with `action_class`
        set to `backups`. Issuing is audited as `backup.downloaded` with `after_state.stage: issued`
        at severity `error` before the response; when that record cannot be written, the link is
        never sent: the answer is `503 audit_unavailable` and the grant stays spent. The link
        appears only in this response body: access
        logs, traces, metrics labels and audit fields record the route template, never the link or
        its token. It carries a one-time token, and fetching it is a `GET` that the token itself
        authenticates, served as the issuing user (`downloadBackup`). Only a backup with `status` `ok`,
        `verified` or `restored` can be downloaded; any other status is `409 conflict` with rule
        `backup_not_usable`. A user may issue at most 10 links per hour, after which the call is
        `429 rate_limited` with `Retry-After`.
        Order (E42-T05): an unknown backup (`404`) and the hourly limit (`429`) are decided before
        any challenge, and `backup_not_usable` after the grant is spent, as on `restoreBackup`; a
        backup whose artefact was deleted, that is recorded with `encrypted: false`, or whose
        artefact is not a single file is not usable. A refusal after the grant is spent is audited
        as `backup.downloaded` with `stage: issued` and `outcome: failure` and a `reason`:
        `backup_not_usable` for the `409`, `links_full` for a full link store and
        `store_unavailable` for any other `503 store_unavailable` after the spend (the lock wait, or
        a catalogue or artefact store that fails or is too slow); every record names the
        `challenge_id` of the grant it spent, and the record of an issued link also names its
        `after_state.link_id`, an id minted with the link that the fetch's records repeat, never the
        token or its hash. An issue that cannot take the backups admission lock (`deleteBackup`)
        within its wait is `503 store_unavailable` with `Retry-After`, after the grant is spent, so
        the grant is gone, its failure record (`backup.downloaded`, `stage: issued`,
        `outcome: failure`, `reason: store_unavailable`) is written ahead of the `503`, and the
        operator steps up again to retry. A catalogue or artefact store that fails or is too slow
        once the lock is held ends the same way, with the same record. An issue that finds the link
        store full (1024 links live; `downloadBackup` states the bounds) is refused the same way:
        `503 store_unavailable` with `Retry-After`, `reason: links_full`, a code that here also
        covers the in-process link store. When that failure record cannot be written, for any of
        these `503`s or for the `409`, the answer is `503 audit_unavailable` and the grant stays
        spent. The challenge's `action_summary` template is
        `Issue a 5-minute download link for backup '<backupId>' (<kind>)` and `target` is null.
        The token carries 256 bits from a CSPRNG (43 base64url characters) and is the only
        credential the fetch needs: `downloadBackup` needs no `Authorization` header, so a
        browser can save the artefact from a plain link. The link is bound to the session that
        issued it and to that session's user, and follows that session across the rotations a
        refresh or a step-up makes, into its successors (its family): a rotation does not end the
        link. The link ends with the events that end the grant that minted it, not with the
        grant's 60-second expiry or its use: after the family's session logged out, idle-locked
        or turned read-only, after the family was revoked other than by a rotation or expired, or
        after its user was disabled, a fetch is `410 gone` (`downloadBackup`). The `200` is
        sent with `Cache-Control: no-store`. Until the catalogue and the artefact store are wired
        the operation answers `501 not_implemented` before any challenge.
      x-rbac: { permissions: [backups:write], scope: none }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Link issued.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [download_url, expires_at]
                properties:
                  download_url:
                    type: string
                    description: Relative API URL (`/api/v1/admin/backups/{backupId}/download/{token}`).
                  expires_at: { type: string, format: date-time }
              examples:
                issued:
                  value:
                    download_url: "/api/v1/admin/backups/18000000-0000-4000-8000-000000000001/download/AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8"
                    expires_at: "2026-10-15T10:05:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/backups/{backupId}/download/{token}:
    parameters:
      - $ref: "#/components/parameters/BackupId"
      - name: token
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{22,64}$" }
    get:
      tags: [admin]
      operationId: downloadBackup
      summary: Fetch a backup artefact through a link issued by issueBackupDownload
      description: >
        Streams the artefact once (E42-T05). The token must have been issued for
        this backup less than 5 minutes ago and not used before; it is consumed before the first
        byte is sent. Serving it is audited as `backup.downloaded` with `after_state.stage: served`
        at severity `error`. The token is a credential in the path, so: access logs, traces, metrics
        labels and audit fields record the route template
        `/admin/backups/{backupId}/download/{token}`, never the token value; `Problem.detail` never
        echoes the path; and every response, refusals included, sends `Referrer-Policy: no-referrer`
        and `Cache-Control: no-store`. The token comes from a CSPRNG with at least 128 bits of
        entropy, is stored only as a hash, is compared in constant time, and is single-use and
        short-lived (5 minutes). An expired or already used token is `410 gone` while the link is
        remembered, whether or not the request carries a bearer token, and `404 not_found` when it
        carries another user's; an unknown token is `404 not_found`. Telling a used token from an
        unknown one discloses
        nothing, since a token cannot be guessed (256 bits, `issueBackupDownload`). At most
        10 fetches per user per hour, else `429 rate_limited`.
        Serving (E42-T05): the token is the credential, so the `GET` needs no `Authorization`
        header and a browser can save the file from a plain link; the fetch acts as the user the
        link was issued to. A bearer token that is sent but does not resolve to a usable session
        gets the standard `401` (`unauthenticated`, or `session_idle_locked` for an idle-locked
        session, as everywhere), and nothing is spent. A token matches when it was issued for the
        backup in the path and, when the request does carry a bearer token, to that token's user;
        any other token, a malformed one and a malformed `backupId` are `404 not_found` (never
        `422`), and nothing is spent. Each such miss counts against its source address: past 10
        in a minute, a further miss is `429 rate_limited` with `Retry-After` instead of `404`,
        counted in `cv_backup_download_source_rate_limited_total`, and the first such refusal per
        address and minute is audited as `backup.downloaded` with `stage: served`,
        `outcome: denied` and `reason: rate_limited`, naming the address and no backup or link taken
        from the path. A token cannot be guessed, so this budget only bounds log and audit volume
        and flags a scanner; it never limits a matching token. Matching is a lookup, not a spend. A
        matching token that was spent or has expired is `410 gone` and counts against no limit; the
        first time a spent token is presented again, a `backup.downloaded` record with
        `stage: served`, `outcome: failure` and `reason: link_reused`, naming its
        `after_state.link_id`, precedes the `410`, and no later presentation or expired link writes
        one. The expired link that writes none is one that expired unspent: a token that was spent
        and is first presented again after its 5 minutes writes the record, since the link was spent
        first. When the `link_reused` record or the per-source `rate_limited` record cannot be
        written (write-ahead, C-2.9), the answer is `503 audit_unavailable` instead of the `410` or
        of the per-source `429`, and a record that was not written does not use up the one record
        per link (or per address and minute): the next presentation of that link, or the next
        refused miss from that address in the minute, writes it. A live matching token then meets
        the hourly limit of the user it was issued to, the one check before the spend: over it, the
        answer is `429 rate_limited`, nothing is spent and nothing is recorded. The token is then
        spent, so a refused fetch spends it too. A spent or expired link is remembered for at most 1
        hour after its spend, or after its expiry if it was never spent: while it is remembered, an
        expired or used token is `410 gone` and a spent one presented again for the first time is
        recorded once as `link_reused`, as above; after that its token is unknown, so a fetch is
        `404 not_found` and no `link_reused` record is written. Links are held in the memory of the
        one API process
        (ADR-0004), as jobs are (`getJob`), so a restart forgets every link, live or spent: one
        issued before it is unknown, a fetch is `404 not_found`, and the link shows as an `issued`
        record with no `served` record. At most 1024 links are live at once, every user's together;
        an issue that finds 1024 live is refused (`issueBackupDownload`). The spent or expired ones
        are kept as well, the newest 1024 issued, and the oldest issued are forgotten first, so a
        token can be `404 not_found` with no record before its hour is up. The link follows its
        issuing
        session's family across rotation (`issueBackupDownload`), so a rotation does not end it,
        and it ends with the events that end the grant that minted it, not with the grant's
        60-second expiry or its use: after the family's session logged out, idle-locked or turned
        read-only, after the family was revoked other than by a rotation or expired, or after its
        user was disabled, a fetch is `410 gone`, and neither an unlock nor the end of the
        read-only window revives the link. The user it was issued to must still hold
        `backups:read`, else `403 forbidden`, and the artefact is read from the catalogue's
        `location` only once that path resolves, without following a symbolic link, to a regular
        file inside the configured backup root; otherwise, or when the backup was deleted or is
        no longer `ok`, `verified` or `restored` since the link was issued, the answer is
        `409 conflict` with rule `backup_not_usable`. A fetch refused after the token is spent is
        audited as `backup.downloaded` with `stage: served`, `outcome: failure` and `reason`
        naming the refusal (`user_disabled` if the user was disabled, else `session_ended` for
        those session events; `forbidden`; `backup_not_usable`), before the answer; when that
        record cannot be written the answer is `503 audit_unavailable` and the link stays spent.
        A link whose session rotated and whose family was then revoked other than by a rotation is
        such a refusal: `410 gone`, the link spent, and `reason: session_ended`.
        Every `410` has the same body (the `used` example) whatever its cause, which only the
        record's `reason` names. Every record of a fetch with a matching token names the link by
        its `after_state.link_id`, never the token or its hash, and records in
        `after_state.bearer` whether the request carried the issuing user's bearer token
        (`matched`) or none (`absent`).
        `Content-Disposition` names the file `cv-backup-<kind>-<backupId>.age`, never the stored
        path. Every fetch that spends a token counts towards the hourly limit of the user it was
        issued to, refused ones included, and nothing else does. `backup.downloaded`
        (`stage: served`) is written before the first byte; when it cannot be written the answer
        is `503 audit_unavailable` and the link stays spent. Until the catalogue and the artefact
        store are wired the operation answers `501 not_implemented`.
      x-rbac: { permissions: [backups:read], scope: none }
      x-rate-limit: 10 non-matching fetches / minute / source IP
      security: [{}, { bearerAuth: [] }]
      responses:
        "200":
          description: The artefact bytes, never cached and always saved as a file.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            Content-Disposition:
              { schema: { type: string, pattern: '^attachment; filename="[^"]+"$' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: "The link expired or was already used, or it ended with the events that end the grant that minted it, not with the grant's 60-second expiry or its use: after the family's session logged out, idle-locked or turned read-only, after the family was revoked other than by a rotation or expired, or after its user was disabled (`code: gone`). Every cause gets the same body, the `used` example; only the record's `reason` names it. A link is `410 gone` only while it is remembered (`downloadBackup`); after that its token is unknown and the fetch is `404 not_found`."
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                used:
                  value:
                    type: "https://candleviewer.local/errors/gone"
                    title: >-
                      Resource existed but was purged by retention, or a one-time link that
                      expired or was used
                    status: 410
                    code: gone
                    detail: "This download link has expired or was already used."
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: getJob
      summary: Poll an asynchronous job (refresh, export, backup, verification, simulation)
      description: >-
        Uniform polling surface for every `202`-returning endpoint in this API. An unknown or
        evicted job id is `404 not_found`. `error` carries a stable code, never a message. An
        `audit_export` job is visible only to the user who requested it (anyone else gets
        `404 not_found`); its `result` is an `AuditExportResult` once `status` is `succeeded`. A
        `backup` job's `result` carries `audit: "unavailable"` when the run's `stage: finished`
        record could not be written (`createBackup`), and a run's outcome is its row's
        (`getBackup`), not the job's `status`. Jobs are held in the memory of the one API process
        (ADR-0004), so a restart loses every
        job, finished ones included, while the objects jobs act on persist (a backup run's
        catalogue row, `getBackup`). Every `404` here carries rule `job_unknown` (E42-T05),
        whatever the cause, so it never tells a lost or evicted job from one that was never
        issued or that belongs to another user; a client whose job vanished reads the object it
        acted on instead. Jobs a restart loses are counted by
        `cv_admin_jobs_lost_on_restart_total`. The operation answers `501 not_implemented` while
        no principal resolver is wired, and `503 audit_unavailable` when the admin-area guard
        (E42-T01) cannot write its `admin.area_entered` record.
      x-rbac: { permissions: [admin:read], scope: none }
      responses:
        "200":
