    SettingsPatch:
      type: object
      description: "Deep-merge patch; only present leaves change. `null` resets a leaf to the deployment default."
      additionalProperties: true
    HotkeyBinding:
      type: object
      additionalProperties: false
      required: [action, keys, scope]
      properties:
        action:
          {
            type: string,
            maxLength: 60,
            examples: ["order.buy_market", "position.flatten", "chart.toggle_footprint"],
          }
        keys:
          {
            type: string,
            maxLength: 60,
            description: "Chord notation, e.g. `Ctrl+Shift+F` or a sequence `Esc Esc`.",
          }
        scope: { type: string, enum: [global, chart, dom, tape, orders, positions] }
        requires_arm:
          { type: boolean, default: true, description: "Forced true for order-sending actions." }
        confirm: { type: boolean, default: false }
        params: { type: object, additionalProperties: true }
    HotkeyProfileInput:
      type: object
      required: [name, bindings]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bindings:
          { type: array, maxItems: 200, items: { $ref: "#/components/schemas/HotkeyBinding" } }
    HotkeyBindingAuditInput:
      type: object
      additionalProperties: false
      required: [command_id, before, after, acknowledged_unsafe]
      properties:
        command_id: { type: string, pattern: "^[a-z0-9_]+([.][a-z0-9_]+){1,3}$", maxLength: 64 }
        before: { type: string, maxLength: 64 }
        after: { type: string, maxLength: 64 }
        acknowledged_unsafe: { type: boolean }
    HotkeyProfile:
      allOf:
        - $ref: "#/components/schemas/HotkeyProfileInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            owner_user_id: { type: string, format: uuid }
            is_active: { type: boolean }
            updated_at: { type: string, format: date-time }

    # === Admin ==============================================================
    AuditEntry:
      type: object
      description: >-
        One audit-log entry. `entry_hash` covers the hashed fields listed in
        `21-database-schema.md` §3.10.1; `id`, `subject_label` and `user_agent` are informational
        and not covered by it. In a Manager's projection (SR-067) only `id`, `ts`,
        `actor_user_id`, `actor_username`, `action`, `subject_type`, `subject_id`, `outcome`,
        `severity` and `request_id` keep their values. Every other field, both hashes included, is
        null, and `detail` is `{}`. The hashes are withheld because, with the hashed fields
        known, they would let a caller confirm guesses about the fields its projection hides.
      required:
        - id
        - ts
        - actor_user_id
        - action
        - subject_type
        - subject_id
        - outcome
        - severity
        - detail
        - entry_hash
        - prev_hash
      properties:
        id:
          type: integer
          format: int64
          description: "Chain position (`audit_log.id`); increasing, not contiguous. Informational."
        ts:
          type: string
          format: date-time
          description: "Event time recorded by the audit writer (UTC, microseconds)."
        actor_user_id:
          type: ["string", "null"]
          format: uuid
          description: "Null for system and rule actors."
        actor_username:
          type: ["string", "null"]
          description: "Actor label recorded at write time; survives user deletion."
        action: { type: string }
        subject_type:
          { type: ["string", "null"], description: "Recorded subject kind (`object_kind`)." }
        subject_id: { type: ["string", "null"] }
        subject_label:
          type: ["string", "null"]
          description: "Human name of the subject at the time. Informational."
        outcome: { $ref: "#/components/schemas/AuditOutcome" }
        severity: { $ref: "#/components/schemas/Severity" }
        reason:
          type: ["string", "null"]
          description: >-
            Stable machine-readable code for a denial or failure, for example `owner_only` or
            `missing_permission:audit:read`; never prose.
        environment: { oneOf: [{ $ref: "#/components/schemas/Environment" }, { type: "null" }] }
        session_id: { type: ["string", "null"], format: uuid }
        ip: { type: ["string", "null"], description: "Actor IP address (PII)." }
        user_agent: { type: ["string", "null"], description: "Informational." }
        request_id:
          { type: ["string", "null"], description: "Id of the request that produced the entry." }
        detail:
          type: object
          additionalProperties: true
          description: >-
            The recorded, already-redacted state change: `before` and `after`, each an object or
            null. `{}` in a Manager's projection. A state the server withholds
            (over its size caps for a page, not a JSON object, or nested deeper than 128 levels)
            is `null` and its name is listed in `elided`. A stored `null` state is never listed.
          properties:
            before: { type: ["object", "null"], additionalProperties: true }
            after: { type: ["object", "null"], additionalProperties: true }
            elided:
              type: array
              items: { type: string, enum: [before, after] }
              uniqueItems: true
              maxItems: 2
              description: "States the server withholds (over its size caps for a page, not a JSON object, or nested deeper than 128 levels); absent when none were withheld. A stored `null` state is never listed."
        entry_hash:
          type: ["string", "null"]
          description: "SHA-256 (hex) over the hashed fields and `prev_hash`; null for a Manager."
        prev_hash:
          type: ["string", "null"]
          description: "`entry_hash` of the previous entry (64 zeros for the first); null for a Manager."
    HealthReport:
      type: object
      properties:
        overall: { $ref: "#/components/schemas/ComponentState" }
        version: { type: string }
        git_sha: { type: string }
        environment: { type: string }
        uptime_seconds: { type: integer }
        server_time: { type: string, format: date-time }
        clock_offset_ms:
          {
            type: ["integer", "null"],
            description: "null until exchange time sync (E08) lands; never a fabricated 0.",
          }
        components:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              state: { $ref: "#/components/schemas/ComponentState" }
              latency_ms: { type: integer }
              latency_unit: { type: string, const: ms }
              detail: { type: string }
              last_good_at: { type: ["string", "null"], format: date-time }
        alerts_active: { type: integer }
    FeatureFlag:
      type: object
      properties:
        key: { type: string }
        kind: { $ref: "#/components/schemas/FlagKind" }
        description: { type: string }
        value: { description: "Resolved value for the caller." }
        default_value:
          description: >
            Deployment default: the deployment-wide stored value resolution falls back to
            (`feature_flags.default_value`, E42-T03). A `PUT` writes it on a `boolean` or
            `variant` flag; on a `percentage` flag it writes `rollout_pct` instead. Omitted when
            the list's `resolution` is `fail_closed` or the flag is `unreadable`.
        overrides:
          type: array
          description: Omitted when the list's `resolution` is `fail_closed` (E42-T03).
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              value: {}
        updated_by:
          type: ["string", "null"]
          format: uuid
          description: >
            Omitted when the list's `resolution` is `fail_closed` or the flag is `unreadable`
            (E42-T03).
        updated_at:
          type: string
          format: date-time
          description: >
            Omitted when the list's `resolution` is `fail_closed` (E42-T03). An `unreadable` flag
            keeps it: it is the `expected_updated_at` of the write that repairs the flag.
        unreadable:
          type: boolean
          description: >
            `true` when this flag's stored row is unreadable (malformed, or a kind mismatch): the
            flag alone resolves to its fail-closed value, and a `PUT` with a valid value repairs
            it (E42-T03). Sent only as `true`.
    FeatureFlagResolution:
      type: string
      enum: [stored, fail_closed]
      description: >
        How `GET /admin/feature-flags` resolved its list (E42-T03), a closed set; always sent.
        `stored`: from the flag store. `fail_closed`: the store was unreachable (its read failed
        or exceeded its read budget), so every flag shows its fail-closed value and omits
        `default_value`, `overrides`, `updated_at` and `updated_by`. A single unreadable row is
        not an outage: the list stays `stored` and that flag is marked `unreadable`.
    SetFeatureFlagRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          {
            description: "Boolean, integer 0-100 (percentage) or string (variant), matching the flag kind.",
          }
        overrides:
          type: array
          description: Omitted, the existing overrides stay; `[]` clears them (E42-T03).
          items:
            type: object
            additionalProperties: false
            required: [user_id, value]
            properties:
              user_id: { type: string, format: uuid }
              value: {}
        reason:
          type: string
          maxLength: 280
          description: >
            Why the flag changed; recorded in the `flags.change` audit entry (E42-T03). The server
            refuses a write without it (`422 validation_failed`). It stays optional in the schema
            because C-6.3 classes a newly required field as breaking.
        evidence_url:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: "Required for gated flags such as `trading.live_enabled`. An `https` URL; recorded, never dereferenced.",
          }
        expected_updated_at:
          type: string
          format: date-time
          description: >
            The flag's `updated_at` as the caller last read it (E42-T03). The write is applied
            only if the stored value still matches, else `409 conflict`. The server refuses a
            write without it (`422 validation_failed`); schema-optional for the same reason as
            `reason`.
    FeatureFlagConflict:
      description: >
        `409 conflict` from `PUT /admin/feature-flags/{flagKey}` (E42-T03): the problem body plus
        the flag as it stands now, so the caller can re-read and retry deliberately.
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [current]
          properties:
            current: { $ref: "#/components/schemas/FeatureFlag" }
    Backup:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/BackupKind" }
        status: { $ref: "#/components/schemas/BackupStatus" }
        started_at: { type: string, format: date-time }
        finished_at: { type: ["string", "null"], format: date-time }
        size_bytes: { type: ["integer", "null"], format: int64 }
        location: { type: string }
        checksum_sha256: { type: ["string", "null"] }
        encrypted: { type: boolean }
        retention_until: { type: ["string", "null"], format: date-time }
        verified_at: { type: ["string", "null"], format: date-time }
        error:
          type: ["string", "null"]
          description: >
            Why the run or its latest conclusive verification failed, as a stable code such as
            `checksum_mismatch` (E42-T05), never an exception message, a path or key material. A
            passing verification clears it and an inconclusive one (`store_unavailable`) leaves it
            as it was (`verifyBackup`). Stored in `backups.error_message`; `null` when nothing
            failed.
        deleted_at:
          type: ["string", "null"]
          format: date-time
          description: >
            When the artefact was deleted (`deleteBackup`, E42-T05); the catalogue row is kept.
            `null` while the artefact exists.
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            description:
              "**Open-ended for readers:** clients must tolerate values they do not know, so
              adding a kind is an additive change (C-6.3).",
            enum:
              [
                instrument_refresh,
                audit_export,
                backup,
                backup_verify,
                backup_restore,
                rule_simulation,
                retention_sweep,
                reconciliation,
                archive_import,
                retention_purge,
              ],
          }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress_pct: { type: number, minimum: 0, maximum: 100 }
        started_at: { type: ["string", "null"], format: date-time }
        finished_at: { type: ["string", "null"], format: date-time }
        result:
          description: >-
            Kind-specific outcome once `status` is `succeeded`, otherwise null. For
            `kind: audit_export` it is an `AuditExportResult` or null (enforced by the `if`/`then`
            below); other kinds carry their own object. For `kind: backup` it is `{backup_id}`, plus
            `audit: "unavailable"` when the run's `stage: finished` record could not be written
            (`createBackup`), and for `kind: backup_verify` it is `{backup_id, verify_method}`,
            where `verify_method` is
            `restore_smoke`, `checksum`, `pg_verifybackup` or `duckdb_scan` (the values of
            `backups.verify_method`, E42-T05); a `backup_restore` result is defined with the
            restore contract (#3084).
          anyOf:
            - $ref: "#/components/schemas/AuditExportResult"
            - { type: object, additionalProperties: true }
            - { type: "null" }
        error: { type: ["string", "null"] }
      if:
        required: [kind]
        properties: { kind: { const: audit_export } }
      then:
        properties:
          result: { oneOf: [{ $ref: "#/components/schemas/AuditExportResult" }, { type: "null" }] }
    AuditExportResult:
      type: object
      description: >-
        `Job.result` of a succeeded `audit_export` job. The artefact is NDJSON (gzip when
        `compressed`): a signed header line, then the chain span in id order. `signature` is a
        detached Ed25519 signature over the ASCII bytes `cv.audit.export.v1:` followed by the
        lowercase hex `sha256`. Verify it with the public key the Owner pinned for `key_id`, which
        is published out of band; never trust a key served next to the artefact.
      required:
        - download_url
        - sha256
        - signature
        - signature_alg
        - key_id
        - compressed
        - size_bytes
        - row_count
        - from
        - to
        - expires_at
      properties:
        download_url:
          type: string
          description: >-
            Relative API URL of the artefact. It carries no credential: fetching it is an
            authenticated `GET`, allowed only to the requesting user within the `audit`
            step-up grace window, and audited before any byte is sent (see `exportAuditLog`).
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: "SHA-256 (hex) of the artefact bytes exactly as downloaded."
        signature:
          type: string
          contentEncoding: base64
          pattern: "^[A-Za-z0-9+/]{86}==$"
          description: "Base64 of the 64-byte Ed25519 signature."
        signature_alg: { type: string, enum: [ed25519] }
        key_id:
          type: string
          pattern: "^cv-audit-export-v[0-9]+:[0-9a-f]{16}$"
          description: "Signing key: key version and the first 16 hex of the public key's SHA-256."
        compressed: { type: boolean }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        row_count:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Entry lines in the file: the whole span, including entries flagged as outside the
            window. The header line is not counted.
        from: { type: string, format: date-time, description: "Requested inclusive start." }
        to: { type: string, format: date-time, description: "Requested exclusive end." }
        first_id: { type: ["integer", "null"], format: int64 }
        last_id: { type: ["integer", "null"], format: int64 }
        expires_at:
          type: string
          format: date-time
          description: "The artefact is deleted after this instant."

    # -------------------------------------------------------------------------
    # Schemas added by the cross-doc contract reconciliation pass, backing the
    # endpoints referenced by 14-screens-catalogue.md.
    # -------------------------------------------------------------------------
    Me:
      type: object
      required: [user, role, permissions, accounts]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/RoleName" }
        permissions:
          type: array
          description: >
            Flattened effective permissions, drawn from the same closed vocabulary as
            `x-rbac.permissions` on every operation in this file.
          items: { type: string }
        accounts:
          type: array
          description: Accounts the caller may see, with the granted mode.
          items:
            type: object
            required: [exchange_account_id, mode]
            properties:
              exchange_account_id: { type: string, format: uuid }
              label: { type: string }
              environment: { $ref: "#/components/schemas/Environment" }
              mode: { type: string, enum: [read, trade] }
        session:
          type: object
          properties:
            session_id: { type: string, format: uuid }
            environment: { $ref: "#/components/schemas/Environment" }
            elevated_until: { type: ["string", "null"], format: date-time }
            one_click_armed_until: { type: ["string", "null"], format: date-time }
        onboarding_complete: { type: boolean }

    EffectiveLimits:
      type: object
      properties:
        risk_caps: { $ref: "#/components/schemas/RiskCaps" }
        accounts:
          type: array
          items:
            type: object
            properties:
              exchange_account_id: { type: string, format: uuid }
              orders_per_minute_limit: { type: integer }
              orders_per_minute_used: { type: integer }
              rate_budget_pct_used: { type: number, minimum: 0, maximum: 100 }
              daily_loss_usd: { $ref: "#/components/schemas/Decimal" }
              daily_loss_cap_usd: { $ref: "#/components/schemas/Decimal" }
              open_positions: { type: integer }
              lockout_until: { type: ["string", "null"], format: date-time }

    OnboardingChecklist:
      type: object
      required: [complete, dismissed, items]
      properties:
        complete: { type: boolean }
        dismissed: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [key, state]
            properties:
              key:
                type: string
                enum: [tailscale, totp, sub_account, api_key, profile_limits, demo_session]
              state: { type: string, enum: [ok, pending, blocked, error, not_applicable] }
              reason: { type: ["string", "null"] }
              unblock_at: { type: ["string", "null"], format: date-time }
              action_route: { type: ["string", "null"] }

    Notification:
      type: object
      x-cv-uuid5-namespace: "2def8b5c-e7e2-4686-af54-02c04b8c6a78"
      required: [id, kind, severity, created_at, title]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Deterministic: uuid5(namespace, source_table + source_id), so the same source row always
            maps to the same notification id. The namespace is the fixed constant
            `x-cv-uuid5-namespace` below (24-internal-schemas.md §1.6).
        kind: { type: string, enum: [alert, rule, order, risk, system] }
        severity: { $ref: "#/components/schemas/Severity" }
        title: { type: string }
        body: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        read_at:
          type: ["string", "null"]
          format: date-time
          description: >
            `acked_at` for alert deliveries; always null for rule, order and system rows until their
            owners define read state. `order_events` rows are omitted until E29 lands the table.
        symbol: { type: ["string", "null"] }
        exchange_account_id: { type: ["string", "null"], format: uuid }
        source_id:
          type: ["string", "null"]
          format: uuid
          description: Id of the originating alert delivery, rule event, order or system event.
        route:
          type: ["string", "null"]
          description: Deep link to the screen that explains this notification.

    Watchlist:
      allOf:
        - $ref: "#/components/schemas/WatchlistInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    WatchlistInput:
      type: object
      required: [name, symbols]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        symbols:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Symbol" }
        columns:
          type: array
          description: Column ids shown for this watchlist, in order.
          items: { type: string }

    ScannerRow:
      type: object
      required: [symbol, coverage]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        last_price: { $ref: "#/components/schemas/Decimal" }
        price_change_pct_24h: { $ref: "#/components/schemas/Decimal" }
        volume_24h: { $ref: "#/components/schemas/Decimal" }
        open_interest: { $ref: "#/components/schemas/Decimal" }
        cvd: { $ref: "#/components/schemas/Decimal" }
        tape_speed: { $ref: "#/components/schemas/Decimal" }
        liquidation_intensity: { $ref: "#/components/schemas/Decimal" }
        recording: { type: boolean }
        coverage:
          type: string
          enum: [recorded, live_only]
          description: >
            `live_only` means no local history exists for this symbol, so criteria that need
