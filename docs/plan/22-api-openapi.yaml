  /alerts/deliveries/{deliveryId}/desktop-outcome:
    parameters: [{ $ref: "#/components/parameters/DeliveryId" }]
    post:
      tags: [alerts]
      operationId: reportAlertDesktopOutcome
      summary: Report the outcome of a desktop-channel delivery (Electron shell report-back)
      description: |
        The Electron shell reports what happened when it tried to show a `desktop`-channel alert
        natively: `shown`, `blocked` (OS/user denied or focus-assist suppressed it) or `failed`.
        `permission` carries the OS notification permission state observed by the shell
        (e.g. `granted`, `denied`, `default`). Body is closed (`extra: forbid`): unknown
        properties are rejected with 422. Only the delivery's owner may report (`scope: self`).
        A caller lacking `alerts:write` receives **403** before any ownership check. For an authorised
        caller, a delivery that is unknown or not owned by the caller returns **404** (never 403), so
        existence is not leaked; cross-account reads and reports are refused identically.
      x-rbac: { permissions: [alerts:write], scope: self }
      x-idempotency: optional
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, permission]
              additionalProperties: false
              properties:
                outcome: { type: string, enum: [shown, blocked, failed] }
                permission:
                  type: string
                  enum: [granted, denied, default, unsupported]
                  description: OS notification permission observed by the shell; recorded in audit.
      responses:
        "204": { description: Outcome recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

