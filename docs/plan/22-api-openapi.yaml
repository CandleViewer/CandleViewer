  /rules/{ruleId}/active-version:
    parameters: [{ $ref: "#/components/parameters/RuleId" }]
    put:
      tags: [rules]
      operationId: setActiveRuleVersion
      summary: Activate (or roll back to) a specific rule version
      description: |
        Activating a version is held to the Owner-only part of the action budget of `createRule`:
        a version whose `limits.max_fires_per_hour` or `limits.max_fires_per_day` is above its
        `RuleLimits` default needs the Owner role, and anyone else gets the same audited
        `403 forbidden`.
      x-rbac: { permissions: [rules:write], scope: granted_accounts }
      x-idempotency: optional
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
