    # === Workspaces / layouts / drawings / settings =========================
    WorkspaceIconToken:
      type: string
      enum: [workspace.default]
      description: |
        Design-system icon token for the workspace (a token name, never a URL or markup).
        **Open-ended for readers:** clients must tolerate values they do not know, so adding a token
        is an additive change (C-6.3). Writers must send a listed value; the server keeps the same
        allow-list. `workspace.default` is the only token until the design-system icon registry
        (CMP-019) publishes workspace icons.
    WorkspaceInput:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Writable workspace fields. `PUT` is a full replacement: an omitted field takes its default,
        and an explicit `null` is refused (`422`).

        Observable validation (all `422 validation_failed`): JSON nesting depth must be at most 16;
        `NaN` and `Infinity` are rejected; a string that cannot be encoded as UTF-8 (a lone
        surrogate) is rule `invalid_unicode`. `name` is at most 40 characters as sent (rule
        `string_too_long`), then sanitised: U+0000-U+001F, U+007F-U+009F, U+2028, U+2029, U+061C,
        U+200E, U+200F, U+202A-U+202E and U+2066-U+2069 are removed, then surrounding whitespace is
        trimmed; nothing else is altered. Empty after sanitising is rule `string_too_short`. Reads
        return the sanitised name.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: "At most 40 characters as sent, at least 1 after sanitising (above), SCR-020. Unique per user, case-insensitive, among live workspaces (`409 conflict`, rule `name_taken`)."
        is_default:
          type: boolean
          default: false
          description: "At most one live default per user; `true` clears the previous default in the same transaction."
        icon_token:
          allOf:
            - $ref: "#/components/schemas/WorkspaceIconToken"
          default: workspace.default
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
          default: 0
          description: "Client-defined tab order; ties break by `id`."
    Workspace:
      type: object
      description: "Response object. Readers must ignore unknown properties (C-6.3)."
      required:
        [
          id,
          user_id,
          name,
          is_default,
          icon_token,
          sort_order,
          layout_count,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        is_default: { type: boolean }
        icon_token: { $ref: "#/components/schemas/WorkspaceIconToken" }
        sort_order: { type: integer, minimum: 0, maximum: 32767 }
        layout_count: { type: integer, minimum: 0, maximum: 32, description: "Live layouts." }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: "Concurrency token (also the `ETag`) for the workspace metadata only; layout writes do not change it. Always exactly 6 fractional digits plus `Z` (`YYYY-MM-DDTHH:MM:SS.ffffffZ`) and strictly increasing on every write. Echo it exactly as received; never re-serialise it through a client date type."
    WorkspaceDetail:
      description: "Response object: `Workspace` plus every live layout with its panes, so restore is one request per workspace. Readers must ignore unknown properties (C-6.3)."
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          required: [layouts]
          properties:
            layouts:
              type: array
              maxItems: 32
              description: "Live layouts ordered by `id` ascending."
              items: { $ref: "#/components/schemas/Layout" }
    LayoutGridPreset:
      type: string
      enum: ["1x1", "2x1", "1x2", "2x2", "1+3", "3x3", custom]
      description: |
        Named grid (`lay_preset`, `21-database-schema.md` §3.8.1) or `custom`. A named preset stores
        only its name and fixed cell proportions: `grid_spec` is `null`, and a pane's `slot_index`
        is its cell in row-major reading order (a slot beyond the preset's cells is placed by the
        client, e.g. floating). Any other arrangement, including a named grid whose divider was
        dragged, is saved as `custom` with its tree in `grid_spec`. **Open-ended for readers.**
    LayoutGridSpec:
      type: object
      additionalProperties: false
      required: [version, root]
      description: |
        Dock tree of a `custom` layout (`row` / `column` / `tabset` / `leaf`), checked at the API
        boundary (`422`, field paths under `grid_spec`): depth at most 6 counting the root as 1
        (rule `tree_too_deep`); at most 64 nodes and at most 16 leaves (rule `tree_too_large`);
        every leaf names the `slot_index` of a pane in the same body (rule `unknown_slot`) and no
        slot appears twice (rule `duplicate_leaf`), so the leaf cap also follows from `panes` having
        at most 16 entries; a split's `sizes` has one entry per child (rule `sizes_mismatch`), each
        in (0, 1], summing to 1 within 1e-6 (rule `sizes_sum`); a tabset's `active` indexes one of
        its children (rule `active_out_of_range`). Panes that no leaf names are kept (floating or
        minimised, placed by the client).
      properties:
        version: { type: integer, enum: [1], description: "Tree format version." }
        root: { $ref: "#/components/schemas/LayoutGridNode" }
    LayoutGridNode:
      oneOf:
        - $ref: "#/components/schemas/LayoutGridSplit"
        - $ref: "#/components/schemas/LayoutGridTabset"
        - $ref: "#/components/schemas/LayoutGridLeaf"
      discriminator:
        propertyName: type
        mapping:
          row: "#/components/schemas/LayoutGridSplit"
          column: "#/components/schemas/LayoutGridSplit"
          tabset: "#/components/schemas/LayoutGridTabset"
          leaf: "#/components/schemas/LayoutGridLeaf"
    LayoutGridSplit:
      type: object
      additionalProperties: false
      required: [type, children, sizes]
      description: "`row` lays children out left to right, `column` top to bottom; `sizes` are fractions of the container."
      properties:
        type: { type: string, enum: [row, column] }
        children:
          type: array
          minItems: 2
          maxItems: 16
          items: { $ref: "#/components/schemas/LayoutGridNode" }
        sizes:
          type: array
          minItems: 2
          maxItems: 16
          items: { type: number, exclusiveMinimum: 0, maximum: 1 }
    LayoutGridTabset:
      type: object
      additionalProperties: false
      required: [type, children]
      properties:
        type: { type: string, enum: [tabset] }
        children:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/LayoutGridLeaf" }
        active:
          type: integer
          minimum: 0
          maximum: 15
          default: 0
          description: "Index of the visible tab in `children`."
    LayoutGridLeaf:
      type: object
      additionalProperties: false
      required: [type, slot]
      properties:
        type: { type: string, enum: [leaf] }
        slot:
          {
            type: integer,
            minimum: 0,
            maximum: 15,
            description: "`slot_index` of a pane in the same layout.",
          }
    PaneKind:
      type: string
      enum:
        [
          chart,
          dom,
          tape,
          profile,
          cvd,
          oi,
          deep_stats,
          regime,
          positions,
          journal,
          watchlist,
          alerts,
        ]
      description: |
        Pane kind (`lp_kind`, `21-database-schema.md` §3.8.1). **Open-ended for readers:** clients
        must tolerate values they do not know, so adding a kind is an additive change (C-6.3);
        writers must send a listed value. Market panes (`chart`, `dom`, `tape`, `profile`, `cvd`,
        `oi`, `deep_stats`, `regime`) may bind a `symbol` and `interval_code`; account panes
        (`positions`, `journal`, `watchlist`, `alerts`) show many symbols and carry neither (rule
        `property_not_allowed_for_kind`). A heatmap lives in the `dom` pane and orders in the
        `positions` pane. A footprint is a `chart` pane; until chart templates exist (#2411) it is
        marked by `pane_config.settings.footprint: true`, its options as further flat `footprint_*`
        settings.
    PaneScaleMode:
      type: string
      enum: [auto, linked, manual, log]
      description: "Price-scale behaviour (`lp_scale`). **Open-ended for readers.**"
    PaneIntervalCode:
      type: string
      maxLength: 36
      pattern: "^(time|heikin_ashi):(1|3|5|15|30|60|120|240|360|720|D|W|M)$|^(tick|range):[1-9][0-9]{0,8}$|^(volume|delta):(0|[1-9][0-9]{0,10})(\\.[0-9]{0,11}[1-9])?$|^renko:([1-9][0-9]{0,8}|atr:[1-9][0-9]{0,2})$|^pnf:[1-9][0-9]{0,8}:[1-9][0-9]{0,2}$"
      description: "`<bar_type>:<param>`, exactly the `bar_type` and `param` of `/market/bars` (and of the WS topic `bars.{symbol}.{bar_type}.{param}`): `param` at most 24 characters, no leading zeros, and no trailing zeros in a `volume`/`delta` fraction, so each value has one spelling (`volume:0.5`, never `volume:0.50`), e.g. `time:1`, `time:D`, `tick:500`, `volume:0.5`, `renko:atr:14`, `pnf:10:3`. A `volume` or `delta` threshold must also be greater than 0 (`422` rule `interval_not_positive`)."
      examples: ["time:1", "time:240", "tick:500", "renko:atr:14"]
    PaneSettingValue:
      description: "A flat setting value: a string, an integer or other finite number (each keeps its kind), a boolean, `null`, or an array of at most 32 such strings, numbers or booleans; objects are not allowed. Strings, also inside arrays, are at most 256 characters as sent and are then sanitised like `WorkspaceInput.name` (the name strip set and trimming), except that an empty result is kept; a lone surrogate is rule `invalid_unicode`. Numbers, also inside arrays, lie within ±1e15, so they read back with the same kind and value. A non-zero number must have |x| ≥ 1e-15 (`number_out_of_range`); zero is allowed. `-0.0` is stored as `0.0`."
      anyOf:
        - { type: string, maxLength: 256 }
        - { type: integer, minimum: -1000000000000000, maximum: 1000000000000000 }
        - { type: number, minimum: -1000000000000000, maximum: 1000000000000000 }
        - { type: boolean }
        - { type: "null" }
        - type: array
          maxItems: 32
          items:
            anyOf:
              - { type: string, maxLength: 256 }
              - { type: integer, minimum: -1000000000000000, maximum: 1000000000000000 }
              - { type: number, minimum: -1000000000000000, maximum: 1000000000000000 }
              - { type: boolean }
    PaneConfig:
      type: object
      additionalProperties: false
      description: |
        Per-pane view state with no column of its own, so a pane cannot become a blob store: closed
        (unknown keys are refused, C-6.3; later stories add keys additively), at most 4096 bytes of
        canonical compact UTF-8 JSON measured after sanitising (`422` rule `pane_config_too_large`),
        and never holds credentials, account ids or user ids. Omitted means `{}`.
      properties:
        sync_group:
          type: ["string", "null"]
          enum: [A, B, C, null]
          description: "Cross-pane sync group (SCR-023); `null` or omitted means not synced. The axis defaults live on the layout (`crosshair_sync`, `symbol_sync`, `level_sync`)."
        settings:
          type: object
          maxProperties: 32
          additionalProperties: { $ref: "#/components/schemas/PaneSettingValue" }
          description: "Kind-specific flat settings (for example DOM depth, tape filters, CVD anchor, visible range), at most 32 keys. Every key must match `^[a-z][a-z0-9_]{0,31}$` (`422` rule `invalid_setting_key`); the server enforces this because generators cannot express key patterns. Numbers keep their kind (`1` stays `1`, `1.0` stays `1.0`). Omitted means `{}`."
    LayoutPaneInput:
      type: object
      additionalProperties: false
      required: [slot_index, pane_kind]
      properties:
        slot_index:
          type: integer
          minimum: 0
          maximum: 15
          description: "Unique within the layout (`422` rule `duplicate_slot`)."
        pane_kind: { $ref: "#/components/schemas/PaneKind" }
        symbol:
          type: ["string", "null"]
          pattern: "^[A-Z0-9]{2,16}USDT$"
          default: null
          description: "Bound symbol, market panes only: a Bybit USDT linear perpetual symbol of at most 20 characters (the DB `symbol_code` domain). It is not checked against the instrument catalogue. A non-null symbol on a live layout counts as chart-open for auto-recording."
        interval_code:
          oneOf: [{ $ref: "#/components/schemas/PaneIntervalCode" }, { type: "null" }]
          default: null
          description: "Bar series of a market pane; `null` for panes without one."
        chart_template_id:
          type: ["string", "null"]
          format: uuid
          default: null
          description: "Chart template reference. Every non-null value is refused (`422` rule `chart_template_not_found`) until `chart_templates` ships; then it must name a template the caller may use."
        indicator_preset_ids:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, format: uuid }
          description: "Indicator preset references; omitted means `[]`. A non-empty list is refused (`422` rule `indicator_preset_not_found`) until `indicator_presets` ships (E13-T03); then every id must name a preset the caller may use."
        pane_config: { $ref: "#/components/schemas/PaneConfig" }
        scale_mode:
          allOf:
            - $ref: "#/components/schemas/PaneScaleMode"
          default: auto
    LayoutPane:
      type: object
      description: "Stored pane (response object). Panes have no id of their own: they are addressed by `slot_index` and replaced as a set. Readers must ignore unknown properties (C-6.3)."
      required:
        [
          slot_index,
          pane_kind,
          symbol,
          interval_code,
          chart_template_id,
          indicator_preset_ids,
          pane_config,
          scale_mode,
        ]
      properties:
        slot_index: { type: integer, minimum: 0, maximum: 15 }
        pane_kind: { $ref: "#/components/schemas/PaneKind" }
        symbol: { type: ["string", "null"], pattern: "^[A-Z0-9]{2,16}USDT$" }
        interval_code:
          { oneOf: [{ $ref: "#/components/schemas/PaneIntervalCode" }, { type: "null" }] }
        chart_template_id: { type: ["string", "null"], format: uuid }
        indicator_preset_ids: { type: array, maxItems: 16, items: { type: string, format: uuid } }
        pane_config: { $ref: "#/components/schemas/PaneConfig" }
        scale_mode: { $ref: "#/components/schemas/PaneScaleMode" }
    LayoutInput:
      type: object
      additionalProperties: false
      required: [name, panes]
      description: "Writable layout fields plus the complete pane set. `PUT` is a full replacement: an omitted field takes its default, an explicit `null` on a non-nullable field is refused, and the stored panes are replaced. Observable validation (depth, `NaN`/`Infinity`, `invalid_unicode`, `name` sanitising and rules) is as on `WorkspaceInput`."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: "At most 40 characters as sent, at least 1 after sanitising, as for workspace names. Unique per workspace, case-insensitive, among live layouts (`409 conflict`, rule `name_taken`)."
        grid_preset:
          allOf:
            - $ref: "#/components/schemas/LayoutGridPreset"
          default: "1x1"
        grid_spec:
          oneOf: [{ $ref: "#/components/schemas/LayoutGridSpec" }, { type: "null" }]
          default: null
          description: "Required when `grid_preset` is `custom`, otherwise `null` or omitted."
        crosshair_sync:
          {
            type: boolean,
            default: true,
            description: "Layout default for crosshair sync between panes of one sync group.",
          }
        level_sync:
          { type: boolean, default: false, description: "Layout default for price-level sync." }
        symbol_sync:
          { type: boolean, default: false, description: "Layout default for symbol sync." }
        hotkey_slot:
          type: ["integer", "null"]
          minimum: 1
          maximum: 9
          default: null
          description: "`Ctrl+1..9` binding; unique among the workspace's live layouts (`409 conflict`, rule `hotkey_slot_taken`)."
        is_default:
          type: boolean
          default: false
          description: "At most one live default per workspace; `true` clears the previous default in the same transaction."
        panes:
          type: array
          minItems: 0
          maxItems: 16
          description: "In any order: panes are keyed by `slot_index`, and responses sort by it."
          items: { $ref: "#/components/schemas/LayoutPaneInput" }
    Layout:
      type: object
      description: "Response object. Readers must ignore unknown properties (C-6.3)."
      required:
        [
          id,
          workspace_id,
          name,
          grid_preset,
          grid_spec,
          crosshair_sync,
          level_sync,
          symbol_sync,
          hotkey_slot,
          is_default,
          panes,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        grid_preset: { $ref: "#/components/schemas/LayoutGridPreset" }
        grid_spec: { oneOf: [{ $ref: "#/components/schemas/LayoutGridSpec" }, { type: "null" }] }
        crosshair_sync: { type: boolean }
        level_sync: { type: boolean }
        symbol_sync: { type: boolean }
        hotkey_slot: { type: ["integer", "null"], minimum: 1, maximum: 9 }
        is_default: { type: boolean }
        panes:
          type: array
          maxItems: 16
          description: "Ordered by `slot_index` ascending."
          items: { $ref: "#/components/schemas/LayoutPane" }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: "Concurrency token (also the `ETag`) of the whole layout aggregate, panes included: every write changes it, including a pane-only change and a default switch made by another layout. Always exactly 6 fractional digits plus `Z` (`YYYY-MM-DDTHH:MM:SS.ffffffZ`) and strictly increasing. Echo it exactly as received; never re-serialise it through a client date type."
    ChartTemplateInput:
      type: object
      required: [name, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        shared: { type: boolean, default: false }
        config:
          type: object
          additionalProperties: true
          description: "Chart configuration blob; validated against the chart-engine schema in `26-chart-engine-design.md`."
          properties:
            chart_type:
              {
                type: string,
                enum:
                  [
                    candlestick,
                    hollow_candlestick,
                    bar,
                    line,
                    area,
                    baseline,
                    step_line,
                    equi_volume,
                    delta_volume,
                    heikin_ashi,
                  ],
              }
            bar_type: { $ref: "#/components/schemas/BarType" }
            param: { type: string }
            footprint:
              type: object
              properties:
                cell_type: { type: string, enum: [volume, bid_ask, delta, delta_total] }
                display_mode: { type: string, enum: [profile, box] }
                price_grouping: { type: integer }
                imbalance_ratio: { type: number }
                min_stack: { type: integer }
                show_unfinished_auctions: { type: boolean }
            indicators:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  params: { type: object, additionalProperties: true }
                  pane: { type: string, enum: [main, sub1, sub2, sub3] }
            colours: { type: object, additionalProperties: { type: string } }
            price_scale:
              type: object
              properties:
                mode: { type: string, enum: [linear, logarithmic, percent] }
                auto_fit: { type: boolean }
                right_margin_bars: { type: integer }
    ChartTemplate:
      allOf:
        - $ref: "#/components/schemas/ChartTemplateInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            owner_user_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    DrawingTool:
      type: string
      description: |
        Drawing tool. **Open-ended for readers:** clients must tolerate values they do not know, so
        adding a tool is an additive change (C-6.3). Writers must send one of the listed values.

        Required point count per tool (`geometry.points`):

        - exactly 1: `horizontal_line`, `vertical_line`, `text`, `anchored_vwap`
        - exactly 2: `trendline`, `ray`, `extended_line`, `rectangle`, `ellipse`, `fib_retracement`,
          `fib_timezone`, `gann_fan`, `arrow`, `callout`, `measure`, `price_range`, `date_range`
        - exactly 3: `parallel_channel`, `triangle`, `fib_extension`, `pitchfork`, `long_position`,
          `short_position`
        - 2..500: `brush`; 2..100: `polyline`

        Tool-specific `geometry` keys (any other combination is `422` rule `property_not_allowed_for_tool`):
        `text` is required for `text` and `callout` (rule `text_required`) and forbidden elsewhere;
        `levels` only for `fib_retracement`, `fib_extension`, `fib_timezone`; `bands` only for
        `anchored_vwap`; `extend_left` / `extend_right` are allowed on every tool.
        A horizontal ray is a `horizontal_line` with `extend_left: false` and `extend_right: true`.
      enum:
        - trendline
        - horizontal_line
        - vertical_line
        - ray
        - extended_line
        - parallel_channel
        - rectangle
        - ellipse
        - triangle
        - fib_retracement
        - fib_extension
        - fib_timezone
        - pitchfork
        - gann_fan
        - text
        - arrow
        - callout
        - measure
        - long_position
        - short_position
        - price_range
        - date_range
        - brush
        - polyline
        - anchored_vwap
    DrawingPoint:
      type: object
      additionalProperties: false
      required: [t, p]
      properties:
        t:
          type: string
          description: "RFC 3339 UTC instant with `Z`, at most millisecond precision, years 2000-2099."
          pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\\.[0-9]{1,3})?Z$"
          examples: ["2026-09-13T12:00:00Z", "2026-09-13T12:00:00.250Z"]
        p:
          type: string
          description: "Chart-space price coordinate as a decimal string; may be negative. Stored and returned verbatim, never converted to a float."
          pattern: "^-?(0|[1-9][0-9]{0,14})(\\.[0-9]{1,12})?$"
          examples: ["61200.00", "-12.5"]
    DrawingGeometry:
      type: object
      additionalProperties: false
      required: [points]
      description: |
        Chart-space geometry (time + price, never pixels). Per-tool point counts and key rules: see `DrawingTool`.

        Observable validation (all `422 validation_failed` unless stated): JSON nesting depth must
        be at most 16; `NaN` and `Infinity` are rejected; a string that cannot be encoded as UTF-8
        (a lone surrogate) is rule `invalid_unicode`. `text` is sanitised on write, before the length
        check: U+0000-U+001F except LF (U+000A, kept in `text` only), U+007F-U+009F, U+2028, U+2029,
        U+061C, U+200E, U+200F, U+202A-U+202E and U+2066-U+2069 are removed; nothing else is altered
        (no trim, no normalisation). Text that is empty after sanitising is rule `text_required`.
        Reads return the sanitised text, so it may differ from what was sent.
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/DrawingPoint" }
        extend_left: { type: boolean }
        extend_right: { type: boolean }
        levels:
          type: array
          description: "Fibonacci levels (fib tools only): unique finite numbers; a duplicate is rule `duplicate_level`. Non-zero items must have |x| ≥ 1e-6 (`number_out_of_range`)."
          minItems: 1
          maxItems: 24
          uniqueItems: true
          items:
            type: number
            minimum: -1000
            maximum: 1000
            description: "A non-zero number must have |x| ≥ 1e-6 (`number_out_of_range`); zero is allowed. `-0.0` is stored as `0.0`."
        bands:
          type: array
          description: "Standard-deviation bands (`anchored_vwap` only)."
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: integer, enum: [1, 2, 3] }
        text:
          type: string
          description: "Text content (`text` and `callout` only), 1..1000 code points after control-character stripping (LF is kept)."
          minLength: 1
          maxLength: 1000
    DrawingStyle:
      type: object
      additionalProperties: false
      properties:
        colour: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        fill_colour: { type: ["string", "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        fill_opacity:
          type: number
          minimum: 0
          maximum: 1
          description: "A non-zero number must have |x| ≥ 1e-6 (`number_out_of_range`); zero is allowed. `-0.0` is stored as `0.0`."
        width: { type: integer, minimum: 1, maximum: 8 }
        dash: { type: string, enum: [solid, dashed, dotted] }
        font_size: { type: integer, minimum: 8, maximum: 48 }
    DrawingInput:
      type: object
      additionalProperties: false
      description: |
        Write payload. Strings are sanitised on write exactly as described on `DrawingGeometry`
        (for `label` LF is removed too; an empty result is rule `string_too_short`), and a read
        returns the sanitised value. The nesting-depth, `NaN`/`Infinity` and `invalid_unicode`
        rules there apply to the whole body.
      required: [symbol, tool, geometry]
      properties:
        symbol:
          type: string
          pattern: "^[A-Z0-9]{2,16}USDT$"
          description: "Bybit USDT linear perpetual symbol, at most 20 characters (the DB symbol_code domain)."
          examples: [BTCUSDT, ETHUSDT]
        tool: { $ref: "#/components/schemas/DrawingTool" }
        layout_id:
          type: ["string", "null"]
          format: uuid
          default: null
          description: "Layout scope. A non-null value must be one of the caller's live layouts, else 422 rule `layout_not_found`; every non-null value is refused until layouts ship (E15-T01)."
        geometry: { $ref: "#/components/schemas/DrawingGeometry" }
        style:
          allOf:
            - $ref: "#/components/schemas/DrawingStyle"
          description: "Optional; omitted means no style overrides (stored as `{}`, returned as `{}`)."
        label:
          type: ["string", "null"]
          default: null
          minLength: 1
          maxLength: 120
          description: "Display label, 1..120 code points after control-character stripping."
        locked: { type: boolean, default: false }
        visible: { type: boolean, default: true }
        z_index: { type: integer, minimum: -32768, maximum: 32767, default: 0 }
    Drawing:
      type: object
      description: "Response object. Readers must ignore unknown properties (C-6.3)."
      required:
        [
          id,
          owner_user_id,
          symbol,
          tool,
          layout_id,
          geometry,
          style,
          label,
          locked,
          visible,
          z_index,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        symbol: { $ref: "#/components/schemas/Symbol" }
        tool: { $ref: "#/components/schemas/DrawingTool" }
        layout_id: { type: ["string", "null"], format: uuid }
        geometry: { $ref: "#/components/schemas/DrawingGeometry" }
        style: { $ref: "#/components/schemas/DrawingStyle" }
        label: { type: ["string", "null"] }
        locked: { type: boolean }
        visible: { type: boolean }
        z_index: { type: integer, minimum: -32768, maximum: 32767 }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: "Concurrency token (also the `ETag`). Always exactly 6 fractional digits plus `Z` (`YYYY-MM-DDTHH:MM:SS.ffffffZ`) and strictly increasing on every write. Echo it exactly as received; never re-serialise it through a client date type."
    DrawingBatchCreateOp:
      type: object
      additionalProperties: false
      required: [op, drawing]
      properties:
        op: { type: string, enum: [create] }
        id:
          {
            type: string,
            format: uuid,
            description: "Optional client-chosen id (UUIDv7 recommended); taken ids are `409 id_unavailable`.",
          }
        drawing: { $ref: "#/components/schemas/DrawingInput" }
    DrawingBatchUpdateOp:
      type: object
      additionalProperties: false
      required: [op, id, if_match, drawing]
      properties:
        op: { type: string, enum: [update] }
        id: { type: string, format: uuid }
        if_match:
          {
            type: string,
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{6}Z$",
            description: "`updated_at` of the version being replaced: echo it exactly as received (6 fractional digits plus `Z`); never re-serialise it through a client date type. A token that does not match is a 422 on `operations.N.if_match`.",
          }
        drawing: { $ref: "#/components/schemas/DrawingInput" }
    DrawingBatchDeleteOp:
      type: object
      additionalProperties: false
      required: [op, id, if_match]
      properties:
        op: { type: string, enum: [delete] }
        id: { type: string, format: uuid }
        if_match:
          {
            type: string,
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{6}Z$",
            description: "`updated_at` of the version being deleted: echo it exactly as received (6 fractional digits plus `Z`); never re-serialise it through a client date type. A token that does not match is a 422 on `operations.N.if_match`.",
          }
    DrawingBatchRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 200
          description: "Applied in order. More than 200 items is `413 payload_too_large`."
          items:
            oneOf:
              - $ref: "#/components/schemas/DrawingBatchCreateOp"
              - $ref: "#/components/schemas/DrawingBatchUpdateOp"
              - $ref: "#/components/schemas/DrawingBatchDeleteOp"
            discriminator:
              propertyName: op
              mapping:
                create: "#/components/schemas/DrawingBatchCreateOp"
                update: "#/components/schemas/DrawingBatchUpdateOp"
                delete: "#/components/schemas/DrawingBatchDeleteOp"
    DrawingBatchResult:
      type: object
      description: "Response object. Readers must ignore unknown properties (C-6.3)."
      required: [created, updated, deleted]
      properties:
        created: { type: array, items: { $ref: "#/components/schemas/Drawing" } }
        updated: { type: array, items: { $ref: "#/components/schemas/Drawing" } }
        deleted: { type: array, items: { type: string, format: uuid } }
    IndicatorPresetInput:
      type: object
      required: [name, indicator_code, params]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        indicator_code: { type: string, maxLength: 40 }
        params: { type: object, additionalProperties: true }
        is_default: { type: boolean, default: false }
    IndicatorPreset:
      allOf:
        - $ref: "#/components/schemas/IndicatorPresetInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            owner_user_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Settings:
      type: object
      description: Effective settings — deployment defaults overlaid with user overrides.
      properties:
        appearance:
          type: object
          properties:
            theme: { type: string, enum: [dark, light, system] }
            density: { type: string, enum: [compact, comfortable, spacious] }
            font_scale: { type: number, minimum: 0.75, maximum: 2 }
            reduce_motion: { type: boolean }
            high_contrast: { type: boolean }
        accessibility:
          type: object
          description: SCR-117 preferences (E47-S07); closed enums, presentation-only.
          properties:
            reduced_motion: { type: string, enum: [system, "on", "off"] }
            increased_contrast: { type: string, enum: [system, "on", "off"] }
            disable_canvas_animation: { type: boolean }
            always_show_tables: { type: boolean }
            thick_focus_ring: { type: boolean }
            announce_prices: { type: string, enum: ["off", significant, always] }
            verbosity: { type: string, enum: [low, normal, high] }
            keyboard_only: { type: boolean }
        chart:
          type: object
          properties:
            default_bar_type: { $ref: "#/components/schemas/BarType" }
            default_param: { type: string }
            crosshair_sync: { type: boolean }
            bar_close_countdown: { type: boolean }
            price_scale_mode: { type: string, enum: [linear, logarithmic, percent] }
        orderflow:
          type: object
          properties:
            heatmap_bid_colour: { type: string }
            heatmap_ask_colour: { type: string }
            imbalance_ratio: { type: number }
            min_stack: { type: integer }
            value_area_pct: { type: number }
            big_trade_threshold_mode: { type: string, enum: [absolute, relative, zscore] }
            big_trade_k: { type: number }
        trading:
          type: object
          properties:
            one_click_armed: { type: boolean, readOnly: true }
            arm_timeout_seconds: { type: integer }
            confirm_market_orders: { type: boolean }
            confirm_flatten: { type: boolean }
            default_environment: { $ref: "#/components/schemas/Environment" }
