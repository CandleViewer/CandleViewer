                        value_area_low: "63088.00"
                        unfinished_auction: { high: false, low: true }
                        cells:
                          - {
                              price: "63110.00",
                              bid_volume: "18.220",
                              ask_volume: "61.004",
                              delta: "42.784",
                              total_volume: "79.224",
                              trades: 412,
                            }
                          - {
                              price: "63109.90",
