      responses:
        "201":
          description: Rule created (disabled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/RuleIrInvalid" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /rules/{ruleId}:
    parameters: [{ $ref: "#/components/parameters/RuleId" }]
    get:
      tags: [rules]
      operationId: getRule
      summary: Get a rule with its active IR
      description: |
        Reading an armed rule the engine must not run disarms it first: one whose stored IR is
        unreadable (quarantined), or whose action budget is above a hard cap (`x-cv-limit-caps`
        on `RuleIr`). The disarm is audited with the reason `quarantined` or
        `limits_above_cap`, is broadcast on the `rules` WS topic, and the rule is returned
        disabled.
      x-rbac: { permissions: [rules:read], scope: granted_accounts }
      responses:
        "200":
          description: Rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [rules]
      operationId: updateRule
      summary: Update a rule, creating a new version
      description: |
        Every save creates an immutable new `rule_versions` row (`version = previous + 1`) with
        a SHA-256 `ir_hash`. An **armed** rule keeps executing its previously active version
        until the new version is explicitly activated via `PUT /rules/{id}/active-version`,
        so saving can never silently change live behaviour. No step-up applies: a saved version
        reaches an order only when `setRuleMode` arms the rule, and the step-up comes at that arm
        when the rule's scope includes `live` (`rules:arm_live` and a fresh one-shot
        live-enablement step-up bound to that request). Activating a different version of an
        armed rule returns it to `simulate`; it acts again only after `setRuleMode` arms it, with
        the live step-up where the scope includes `live`. Every save is held to the action budget
        of `createRule`, also a save that matches an existing version.
      x-rbac: { permissions: [rules:write], scope: granted_accounts }
      x-idempotency: optional
      parameters:
        [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
      responses:
        "200":
          description: New version created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/RuleIrInvalid" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [rules]
      operationId: deleteRule
      summary: Delete a rule
      description: "Refused with `conflict` while the rule is `armed`; disarm first. Versions and run history are retained for audit."
      x-rbac: { permissions: [rules:write], scope: granted_accounts }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: "Deleted." }
        "403": { $ref: "#/components/responses/CsrfTokenInvalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

