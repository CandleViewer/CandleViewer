# Machine-readable mirror of CONSTITUTION.md §3 (module boundaries).
#
# This file is the single source of truth *for machines* (import-linter,
# dependency-cruiser, the drift test in
# `services/api/tests/unit/architecture/test_module_contracts_drift.py`).
# `CONSTITUTION.md` §3 remains the source of truth *for humans*. The two must
# never diverge — that is what the drift test enforces (C-16.5).
#
# Do not hand-edit the `allowed` lists without also editing the §3 table in
# the same PR, and vice versa. Adding a module or an edge needs an ADR
# (C-3.4).
#
# `path` is the Python dotted import path rooted at `candleviewer` (a root of
# `services/api/.importlinter`; the other, the dev-only `cvdev`, is not an
# M-module and has no entry here, ADR-0036). `allowed` lists the
# dotted paths (not numbers) this module may import, transcribed from the
# "May depend on" column of §3.

