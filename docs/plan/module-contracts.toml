# Cross-cutting forbidden-import rules (C-3.2, C-3.3) not expressible as a
# simple per-module `allowed` list, because they restrict *who may import
# this module* rather than *what this module may import*.
[cross_cutting]

[cross_cutting.c32_importers]
# C-3.2: M2 (secrets) is importable only by M4 (exchange.bybit) and M21
# (admin, metadata only).
rule = "C-3.2"
module = "candleviewer.secrets"
only_importable_by = ["candleviewer.exchange.bybit", "candleviewer.admin"]

[cross_cutting.audit_read_importers]
# C-3.3: M19 (audit) is write-only for every module except M21 (admin) and
# M23 (api) read paths.
rule = "C-3.3"
module = "candleviewer.audit"
only_importable_by = ["candleviewer.admin", "candleviewer.api", "candleviewer.ws"]

[cross_cutting.storage_driver_imports]
# ADR-0003 / E07-T01 acceptance criterion 2: "all storage access goes
# through repository interfaces in candleviewer.storage (M10). No module
# issues SQL or ILP directly." Every module other than M10 itself (and the
# non-Python `backend.db.*` layout referenced by the ticket, which does not
# exist yet) is forbidden from importing any of the underlying storage
# engine driver packages directly.
rule = "ADR-0003"
forbidden_packages = ["asyncpg", "psycopg", "sqlalchemy", "duckdb", "pyarrow", "questdb"]
exempt_modules = ["candleviewer.storage"]

[cross_cutting.metrics_facade]
# E04-T03 / ADR-0014 section 1: modules use the `candleviewer.observability.metrics`
# facade, never `prometheus_client` directly.
rule = "E04-T03"
forbidden_packages = ["prometheus_client"]
exempt_modules = ["candleviewer.observability"]

[cross_cutting.hotpath_statechart]
# C-2.20 / CV-LINT-HOTPATH: hot-path modules (book deltas, bar builders,
# footprint aggregation) never import the statechart runtime, directly or
# indirectly. B14 supervision is injected from a non-hot module.
rule = "C-2.20"
source_modules = ["candleviewer.book", "candleviewer.bars", "candleviewer.orderflow", "candleviewer.orderbook_wiring"]
forbidden_modules = ["candleviewer.statechart", "xstate_statemachine"]

[cross_cutting.ws_statechart]
# C-2.20 / ADR-0016 / 23-ws-protocol.md §6.4: the WS gateway answers `machines.{entity}.state`
# only from what the publisher recorded. It never imports the statechart factory or persistence,
# nor the runtime, so it can never build, restore or query an `Interpreter`.
rule = "C-2.20"
source_modules = ["candleviewer.ws"]
forbidden_modules = ["candleviewer.statechart.factory", "candleviewer.statechart.persistence", "xstate_statemachine"]

# Frontend module boundaries (§3 "Frontend module boundaries" table).
# dependency-cruiser (`.dependency-cruiser.js`) reads this table; there is no
# frontend import-linter equivalent, so this section is descriptive only —
# the `.dependency-cruiser.js` rules are the enforcement mechanism and must
# be kept in sync by hand (checked by the same drift test's frontend half).
[[frontend_package]]
name = "packages/chart-engine"
rule = "C-2.16"
forbidden_deps = ["react", "react-dom"]
forbidden_identifiers = ["fetch", "XMLHttpRequest", "bybit"]

[[frontend_package]]
name = "packages/protocol"
forbidden_deps = ["packages/ui", "apps/*"]

[[frontend_package]]
name = "packages/ui"
allowed_deps = ["packages/protocol", "packages/chart-engine"]

[[frontend_package]]
name = "apps/web"
allowed_deps = ["packages/*"]
forbidden_deps = ["apps/desktop"]

[[frontend_package]]
name = "apps/desktop"
rule = "no business logic — windows, GPU flags, updater, deep links only"
forbidden_deps = ["apps/web"]
