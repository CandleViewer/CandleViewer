packages:
  - "apps/*"
  - "packages/*"

# Install policy (C-12.3). pnpm 12 reads these settings here and ignores them in .npmrc, where they
# had no effect until #3277; scripts/tests/test_pnpm_effective_policy.py runs pnpm to prove each one.
# - ignoreScripts: `pnpm install` runs no lifecycle script, whether a dependency's, a workspace
#   package's or the root's. Husky's `prepare` is therefore the explicit `pnpm run prepare`
#   (CONTRIBUTING.md). `pnpm rebuild` obeys the setting too, so tools/ci/run-allowed-postinstall.mjs,
#   the one deliberate build path (allowlist: tools/ci/allowed-postinstall.json), passes
#   --no-ignore-scripts.
# - frozenLockfile: a plain `pnpm install` refuses a lockfile that no longer matches the manifests
#   (`pnpm add` and --no-frozen-lockfile still change it); CI passes the flag as well.
# - saveExact: `pnpm add` records an exact version, not a ^range.
# - strictPeerDependencies: false keeps a peer-dependency mismatch a warning.
# engine-strict is not carried over from .npmrc: applied, pnpm refuses the pinned Node 20, because
# dependencies (Electron 45, @testing-library/jest-dom) declare Node 22 or later; .nvmrc and the root
# "engines" pin Node (CI-JS-001).
ignoreScripts: true
frozenLockfile: true
saveExact: true
strictPeerDependencies: false

# esbuild (a transitive dev-dependency of vitest and vite, and since #3422 a
# direct devDependency of @candleviewer/ui) ships a legitimate, widely audited
# postinstall script that fetches its platform binary; it is approved here so
# the runner's `pnpm rebuild --no-ignore-scripts esbuild` may run it, rather
# than turning ignoreScripts off repo-wide. electron
# (E02-T04, apps/desktop) has shipped no install script since Electron 42, so
# its entry runs nothing; it stays to mirror tools/ci/allowed-postinstall.json,
# whose runner fetches the binary through electron's own install-electron bin
# (#1819). Any future addition to this list needs the same review note.
allowBuilds:
  electron: true
  esbuild: true
  # electron-builder 26 > electron-winstaller: 7z arch selector for Squirrel.Windows;
  # not used by CI or the portable/NSIS targets, so explicitly denied (E43-T05).
  electron-winstaller: false

# E43-T05 (SR-130/SR-156): force patched transitive `tar` (electron-builder >
# app-builder-lib, build-time only) past GHSA-23hp-3jrh-7fpw and the other
# tar advisories. Remove once electron-builder ships tar>=7.5.21 itself.
# #3494 (35-dependency-freeze-policy.md §8.4): each floor is the first patched release.
# - source-map-js (postcss and magicast, build/test-time) past GHSA-68fv-2mgg-jv7q (High).
#   Both already accept 1.2.2, so this is a floor: without it, a lockfile that pins 1.2.1
#   keeps it. Remove once both require >=1.2.2.
overrides:
  tar: ">=7.5.21"
  http-cache-semantics: ">=4.3.0 <5"
  source-map-js: ">=1.2.2 <2"
