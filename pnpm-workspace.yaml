packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening (C-12.3): .npmrc sets ignore-scripts=true globally.
# esbuild (a transitive dev-dependency of vitest and vite, and since #3422 a
# direct devDependency of @candleviewer/ui) ships a legitimate, widely audited
# postinstall script that fetches its platform binary; it is explicitly
# allowlisted here rather than disabling ignore-scripts repo-wide. electron
# (E02-T04, apps/desktop) has shipped no install script since Electron 42, so
# its entry runs nothing; it stays to mirror tools/ci/allowed-postinstall.json,
# whose runner fetches the binary through electron's own install-electron bin
# (#1819). Any future addition to this list needs the same review note.
allowBuilds:
  electron: true
  esbuild: true
  # electron-builder 26 > electron-winstaller: 7z arch selector for Squirrel.Windows;
  # not used by CI or the portable/NSIS targets, so explicitly denied (E43-T05).
  electron-winstaller: false

# E43-T05 (SR-130/SR-156): force patched transitive `tar` (electron-builder >
# app-builder-lib, build-time only) past GHSA-23hp-3jrh-7fpw and the other
# tar advisories. Remove once electron-builder ships tar>=7.5.21 itself.
# #3494 (35-dependency-freeze-policy.md §8.4): each floor is the first patched release.
# - source-map-js (postcss and magicast, build/test-time) past GHSA-68fv-2mgg-jv7q (High).
#   Both already accept 1.2.2, so this is a floor: without it, a lockfile that pins 1.2.1
#   keeps it. Remove once both require >=1.2.2.
overrides:
  tar: ">=7.5.21"
  http-cache-semantics: ">=4.3.0 <5"
  source-map-js: ">=1.2.2 <2"
