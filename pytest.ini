# C-9.3: a quarantined (@pytest.mark.flaky) test runs in no lane. pytest reads the nearest config
# at or above the paths it is given, so this file is the config of every suite outside
# services/api (pyproject.toml) and scripts (pytest.ini), such as tests/lint_statecharts. All three
# deselect flaky; scripts/tests/test_workflow_pytest_markers.py pins every pytest config.
[pytest]
addopts = -m "not flaky"
markers =
    flaky: C-9.3 quarantine, deselected by addopts (run it with -m flaky while fixing it)
