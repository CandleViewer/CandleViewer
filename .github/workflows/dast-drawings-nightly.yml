name: dast-drawings-nightly

# E14-X03 (#549, AC4): the nightly (never per-PR) OWASP ZAP scan of /drawings* (plan:
# .zap/e14-drawings.yaml), authenticated as a synthetic Manager (a Viewer cannot write drawings,
# DR38) on a throwaway stack (_dast-low-priv.yml, #3991). A synthetic Owner's drawings
# (.zap/e14-drawings-seed.json) stand on that stack with fixed ids: after the scan the Manager's own
# writes to them must be refused, and they must be unchanged and unlisted for the Manager
# (security/zap/drawings_isolation.py; DR12, DR20, DR21).
# Gate: the scan stays signed in, no High/Medium alert outside .zap/e14-drawings-baseline.json
# (security/zap/baseline_gate.py), and that check. Nightly and by hand, never per-PR; never a live
# exchange; no repository secret.
# E14-X02 (#474): `abuse-packs` re-runs the drawings abuse-case packs
# (services/api/tests/drawings/test_drawings_abuse_*.py, recorded fixtures and in-memory fakes, no
# network) so a regression is caught the night it lands even where no PR touched the drawings
# paths. They also run per-PR in `py`; findings: qa/security/e14-abuse-cases.md.
on:
  schedule:
    - cron: "57 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap-drawings:
    uses: ./.github/workflows/_dast-low-priv.yml
    with:
      profile: drawings
      report: drawings-manager
      baseline: .zap/e14-drawings-baseline.json
      artifact: zap-drawings
      role: manager
      fixture: .zap/e14-drawings-seed.json

  abuse-packs:
    name: drawings-abuse-packs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"
      - name: uv sync --frozen
        working-directory: services/api
        run: uv sync --frozen --all-groups
      - name: E14-X02 drawings abuse packs (IDOR, mass assignment, exhaustion, stored XSS, signals)
        working-directory: services/api
        run: uv run pytest tests/drawings/test_drawings_abuse_*.py --no-cov -p no:cacheprovider
