name: _job-migrations

# E03-T10: Alembic migration job — single-head, drift, expand/contract lint,
# `IF NOT EXISTS` ban, greenfield + previous-release upgrade paths, and the
# concurrent-boot advisory-lock integration test. Applicable when the
# `migrations` path filter is true (`docs/plan/21-database-schema.md` §9,
# ADR-0013 rule 9). Also called from a future release workflow before the
# deploy stage (E03-T09 dependency) so a bad migration never reaches a
# running environment — that call site is added by E03-T09 itself; this
# file only defines the reusable job.
#
# CV-ERR codes: CI-MIG-001 multiple heads, CI-MIG-002 drift, CI-MIG-003
# destructive without annotation, CI-MIG-004 upgrade-path failure,
# CI-MIG-005 `IF NOT EXISTS` used.
#
# Bugfix #1556 (parent E07-T02, issue #168) adds, on top of the E03-T10
# steps above, the pieces #1556's QA re-verification found missing:
# lockfile integrity (rule 9 — forward-only in production), the
# cv_owner/cv_app/cv_ro role bootstrap plus the `cv_app` DDL-refusal
# integration suite, a 60s upgrade-timing budget (§9.3 rule 11), and a
# byte-identical-modulo-timestamps schema dump assertion around the
# round-trip.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    services:
      postgres:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_USER: cv
          POSTGRES_PASSWORD: cv
          POSTGRES_DB: candleviewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv -d candleviewer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen (fails if pyproject.toml drifted from uv.lock)
        run: uv sync --frozen --all-groups

      - name: Migration lockfile integrity (#1556, rule 9 — forward-only in production)
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --project services/api python tools/ci/verify_migration_lockfile.py --base-ref "origin/$BASE_REF"

      - name: Bootstrap cv_owner/cv_app/cv_ro roles and privileges (#1556)
        working-directory: .
        run: |
          PGPASSWORD=cv psql -h localhost -U cv -d candleviewer \
            -v ON_ERROR_STOP=1 \
            -v owner_pw=cv_owner_ci_pw -v app_pw=cv_app_ci_pw -v ro_pw=cv_ro_ci_pw \
            -f infra/scripts/pg_bootstrap.sql

      - name: CV_PG_DSN as cv_owner (migrations run as cv_owner, 21-database-schema.md Sec.1.1/L2875)
        run: echo "CV_PG_DSN=postgresql+asyncpg://cv_owner:cv_owner_ci_pw@localhost:5432/candleviewer" >> "$GITHUB_ENV"

      - name: alembic heads — single linear history (CI-MIG-001)
        run: |
          heads="$(uv run alembic heads)"
          count="$(printf '%s\n' "$heads" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "CI-MIG-001: expected 1 head, found $count:"
            printf '%s\n' "$heads"
            exit 1
          fi
          echo "single head: $heads"

      - name: Expand/contract lint — destructive ops need cv:contract-phase (CI-MIG-003)
        run: uv run python ../../tools/ci/migration_lint.py --versions-dir candleviewer/migrations/versions

      - name: alembic upgrade head — greenfield (empty database, budget 60s, #1556)
        run: |
          start=$(date +%s)
          uv run alembic upgrade head
          elapsed=$(( $(date +%s) - start ))
          echo "upgrade head took ${elapsed}s"
          if [ "$elapsed" -ge 60 ]; then
            echo "CI-MIG-TIMING-001: migration exceeded the 60s budget (${elapsed}s)" >&2
            exit 1
          fi

      # `alembic check` compares models.py against the *live* schema at head, so
      # it must run after `upgrade head` — on an empty database it always fails
      # with "Target database is not up to date" regardless of models.py.
      - name: alembic check — drift between models.py and head (CI-MIG-002)
        run: uv run alembic check

      - name: Schema dump before round-trip (#1556)
        working-directory: .
        run: pg_dump -h localhost -U cv -d candleviewer --schema-only --no-owner --no-privileges > /tmp/schema_before.sql
        env:
          PGPASSWORD: cv

      - name: alembic downgrade to base then upgrade head again (round-trip sanity)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Schema dump after round-trip (#1556)
        working-directory: .
        run: pg_dump -h localhost -U cv -d candleviewer --schema-only --no-owner --no-privileges > /tmp/schema_after.sql
        env:
          PGPASSWORD: cv

      - name: Assert schema dumps are byte-identical modulo timestamps (#1556)
        working-directory: .
        run: |
          norm() { sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9:.+-]+//g; /^\\(restrict|unrestrict) /d' "$1"; }
          diff <(norm /tmp/schema_before.sql) <(norm /tmp/schema_after.sql)

      - name: Upgrade path from the previous release tag's schema (CI-MIG-004)
        run: python ../../tools/ci/run_previous_release_upgrade.py --root . --dsn "$CV_PG_DSN"

      - name: Concurrent-boot advisory-lock integration test
        run: uv run pytest -p no:cacheprovider -m integration tests/integration/migrations/test_boot_advisory_lock_integration.py --no-cov

      - name: cv_app has no DDL privilege (integration, testcontainers, #1556)
        run: uv run pytest -p no:cacheprovider -m integration tests/integration/auth tests/integration/storage --no-cov
