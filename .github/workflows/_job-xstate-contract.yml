name: _job-xstate-contract

# E50-T31: the BLOCKING statechart contract gate
# (docs/plan/29-statechart-adoption-plan.md §1.7). Runs every committed
# `machines/*.machine.json` through `cv.statechart.factory` on the library
# runtime: every declared arm on both service spellings (`async def` and
# `def` -> coroutine), persist -> restore at every quiescence point,
# envelope refusal (wrong machine_hash / bad HMAC / version < 3),
# guard-denied / unhandled audit, chain-trip latch across restore, and the
# §Bn.7 invariant ledger. A chart without a contract module fails
# collection. `-W error::RuntimeWarning` turns a dropped action coroutine
# (CV-C67) into a failure.
#
# The run is tools/statechart/run_xstate_contract.sh, its single definition:
# pr.yml's `gates` job runs the same script as its `xstate-contract` step, so
# xstate-contract-nightly.yml is this workflow's only caller (#3104). The
# informational sync-engine parity job (`xstate-sync-parity`) never gates:
# `continue-on-error: true` and it is not listed in ci-required; PR runs skip
# it since #3076 and the nightly runs it.

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  xstate-contract:
    name: xstate-contract
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      # uv sync, the blocking pytest run, event-name coverage (E50-T05) and the suite budget (E50-T06).
      - name: Contract suite, event-name coverage and suite budget (blocking)
        run: bash tools/statechart/run_xstate_contract.sh

  xstate-sync-parity:
    name: xstate-sync-parity (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: SyncInterpreter parity (never gates, MUSTNOT-06)
        working-directory: services/api
        run: uv run pytest tests/xstate_contract -q --no-cov -m sync_parity
