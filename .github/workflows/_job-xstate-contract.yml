name: _job-xstate-contract

# E50-T31: the BLOCKING statechart contract gate
# (docs/plan/29-statechart-adoption-plan.md §1.7). Runs every committed
# `machines/*.machine.json` through `cv.statechart.factory` on the library
# runtime: every declared arm on both service spellings (`async def` and
# `def` -> coroutine), persist -> restore at every quiescence point,
# envelope refusal (wrong machine_hash / bad HMAC / version < 3),
# guard-denied / unhandled audit, chain-trip latch across restore, and the
# §Bn.7 invariant ledger. A chart without a contract module fails
# collection. `-W error::RuntimeWarning` turns a dropped action coroutine
# (CV-C67) into a failure.
#
# The informational sync-engine parity job (`xstate-sync-parity`) never
# gates: `continue-on-error: true` and it is not listed in ci-required.
# pr.yml passes `sync_parity: false`; the nightly runs it (#3076).

on:
  workflow_call:
    inputs:
      sync_parity:
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  xstate-contract:
    name: xstate-contract
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: pytest tests/xstate_contract -W error::RuntimeWarning (blocking)
        working-directory: services/api
        run: >
          uv run pytest tests/xstate_contract tests/xstate_upstream -q --no-cov -m "not sync_parity"
          -W error::RuntimeWarning --durations=10 --junitxml=xstate-contract-junit.xml

      - name: Event-name coverage over every Gateway.send site (E50-T05, MUST-10)
        working-directory: services/api
        run: >
          uv run python ../../tools/statechart/event_coverage.py &&
          uv run pytest ../../scripts/tests/test_event_coverage.py -q --no-cov
          -W error::RuntimeWarning

      - name: Suite budget < 60 s + per-machine throughput (E50-T06)
        run: >
          python tools/statechart/suite_budget.py
          services/api/xstate-contract-junit.xml

  xstate-sync-parity:
    name: xstate-sync-parity (informational)
    if: ${{ inputs.sync_parity }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: SyncInterpreter parity (never gates, MUSTNOT-06)
        working-directory: services/api
        run: uv run pytest tests/xstate_contract -q --no-cov -m sync_parity
