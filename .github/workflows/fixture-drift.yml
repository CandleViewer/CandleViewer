name: fixture-drift

# E08-T05 (risk R6 "feed rot"): nightly payload-drift early warning.
# Captures a small fresh sample from Bybit's PUBLIC stream (no credentials,
# no secrets referenced) with tools/fixtures/capture_fixture.py, compares its
# field presence + JSON types to packages/fixtures/bybit/<date>/schema_expectations.json
# and reports the stream and field on drift: a comment on the open fixture-drift issue, or a
# new one (_nightly-issue.yml, #1849). Scheduled/manual only: never runs on pull_request and is
# not a required check (C-9.1 unchanged). No workflow-level concurrency group (#3449): it would let
# a manual run replace a pending scheduled one; the report job has a per-signal group instead.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  drift:
    name: fixture-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      report: ${{ steps.handoff.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          python-version: "3.12"

      - name: uv sync --frozen
        working-directory: services/api
        run: uv sync --frozen

      - name: Capture a fresh public sample
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sample/ws"
          for topic in publicTrade.BTCUSDT tickers.BTCUSDT orderbook.50.BTCUSDT; do
            uv run --project services/api python tools/fixtures/capture_fixture.py \
              --topic "$topic" --frames 20 --out "$RUNNER_TEMP/sample/ws/$topic.jsonl"
          done
          rm -f "$RUNNER_TEMP"/sample/ws/*.manifest.json

      - name: Drift check
        id: drift
        run: >
          uv run --project services/api python tools/fixtures/drift_check.py
          --sample "$RUNNER_TEMP/sample" --report "$RUNNER_TEMP/drift.txt"

      - name: Hand the drift report to the issue job (R6)
        id: handoff
        if: failure()
        env:
          REPORT: ${{ runner.temp }}/drift.txt
        run: |
          set -euo pipefail
          eof=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          { echo "report<<$eof"; head -c 60000 "$REPORT" 2>/dev/null || echo "(no report produced)"
            echo; echo "$eof"; } >> "$GITHUB_OUTPUT"

  drift-issue:
    needs: drift
    # always(): runs after the red drift job, capture and network failures included, as before.
    if: ${{ always() && needs.drift.result == 'failure' }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-issue.yml
    with:
      signal: fixture-drift
      title-prefix: "fixture-drift: Bybit payload drift"
      labels: area/ingestion,priority/p1
      body: |
        Bybit payload drift (or the drift job itself failed). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        ```
        ${{ needs.drift.outputs.report }}
        ```
