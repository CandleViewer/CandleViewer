name: _job-py

# E03-T03: Python CI lane for services/api (and any Python tooling under
# scripts/**, tools/ci/**), invoked from pr.yml when the `py` path filter is
# true. Pipeline shape per ADR-0013 ("[py] lint (ruff) - typecheck (mypy
# --strict on modules) - unit (pytest) - build"):
#
#   checkout -> setup-uv (cache keyed on uv.lock) -> uv sync --frozen
#   -> ruff check + ruff format --check -> mypy --strict
#   -> import-linter architecture contract (its own `architecture` check)
#   -> pytest -m "not exchange_smoke" --cov (network-guarded, ADR-0012/SR-140)
#   -> uv build -> upload coverage artifact (consumed by E03-T04's threshold
#   gate; this job does not itself gate on the number).
#   `py-perf` (parallel): pytest -m perf --no-cov, the C-13.9 wall-clock budgets.
#
# Out of scope (per ticket): coverage threshold enforcement (E03-T04),
# Bandit/pip-audit (E03-T07), Alembic migration checks (E03-T10), contract
# and integration pipeline suites (E03-T06). Postgres/QuestDB service
# containers for `integration_db`-marked tests are added by whichever
# ticket lands the first such test (none exist yet); the network guard
# already honours `CV_CI_ALLOWED_HOSTS` for when that lands.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  # SR-140: CI never holds production Bybit credentials. Loopback is always
  # allowed by the guard; this var stays empty until a ticket adds
  # `integration_db`-marked tests with digest-pinned service containers.
  CV_CI_ALLOWED_HOSTS: ""

jobs:
  py:
    name: py
    runs-on: ubuntu-latest
    # 30 min default (#2185): the unit suite alone now takes 18-19.5 min on a shared runner, so a
    # 20 min budget cancelled green runs during `uv build`. Splitting the job is the follow-up.
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 30) }}
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen (fails if pyproject.toml drifted from uv.lock)
        run: uv sync --frozen --all-groups

      - name: ruff check
        run: uv run ruff check . ../../docs/research/xstate/gate/_paths.py ../../docs/research/xstate/gate/run_gate.py ../../tools/statechart/nightly_gate.py

      - name: ruff format --check
        run: uv run ruff format --check . ../../docs/research/xstate/gate/_paths.py ../../docs/research/xstate/gate/run_gate.py ../../tools/statechart/nightly_gate.py

      - name: mypy --strict
        # #1964: explicit gate-module paths only; the research scripts under
        # docs/research/xstate/gate/issues/** stay out of the lint lane.
        run: uv run mypy --strict candleviewer ../../docs/research/xstate/gate/_paths.py ../../docs/research/xstate/gate/run_gate.py ../../tools/statechart/nightly_gate.py

      # E35-T01 follow-up: the committed rule IR JSON Schema
      # (candleviewer/rules/ir/rule-ir.json) is generated from the pydantic
      # models; a model change without regenerating it must fail CI. Lives in
      # this lane (not `_job-gen.yml`) because the generator needs the synced
      # backend environment, and every IR model edit is under services/api/**.
      - name: Rule IR JSON Schema drift check (E35-T01)
        run: uv run python scripts/generate_rule_ir_schema.py --check

      - name: Alert rule runbook-link gate (E04-T05)
        working-directory: .
        run: python infra/alertmanager/check_alert_rules.py

      - name: promtool check rules + rule unit tests, amtool check-config (E04-T05)
        working-directory: .
        run: |
          # Digests mirror infra/compose/docker-compose.yml (C-12.3)
          P=prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/p:ro" $P check rules $(cd infra/prometheus && printf "/p/%s " alerts/*.yml)
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/p:ro" $P test rules /p/tests/system_alerts.test.yml /p/tests/ingestion_alerts.test.yml
          A=prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
          AM="docker run --rm --entrypoint amtool -v $PWD/infra/alertmanager:/etc/alertmanager:ro $A"
          $AM check-config /etc/alertmanager/alertmanager.yml
          for r in "page severity=page" "ticket severity=ticket" "deadman alertname=Watchdog" "ticket severity=ticket component=auth"; do
            set -- $r; recv=$1; shift
            $AM config routes test --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=$recv "$@"
          done
          # Notification body render: occurrence count + required fields (E04-T05 AC grouping/page content)
          out=$($AM template render --template.glob='/etc/alertmanager/templates/*.tmpl' --template.data=/etc/alertmanager/tests/data/grouped_page.json --template.text='{{ template "cv.title" . }} | {{ template "cv.body" . }}')
          echo "$out"
          for want in "[PAGE]" "Alert: OmsUnknownOrders" "Component: oms" "Env: dev" "Occurrences: 3" "Runbook: docs/plan/07-release-and-prr.md#alert-omsunknownorders"; do
            printf '%s' "$out" | grep -qF -- "$want" || { echo "rendered notification missing: $want" >&2; exit 1; }
          done

      - name: Grafana dashboard lint (E04-S01 AC3, metric names vs catalogue)
        working-directory: .
        run: python infra/grafana/lint_dashboards.py --strict

      - name: Architecture contract (import-linter, ADR-0004)
        id: architecture
        run: uv run lint-imports

      - name: pytest (unit + non-exchange_smoke, network-guarded)
        env:
          HYPOTHESIS_PROFILE: ci
        run: >
          uv run pytest -p no:cacheprovider -m "not exchange_smoke and not (chaos and integration) and not roundtrip and not fuzz and not harness and not perf"
          --durations=10
          --cov --cov-report=xml:coverage.xml --cov-report=term

      - name: uv build
        run: uv build

      - name: Upload coverage report (for E03-T04's threshold gate)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: py-coverage
          path: services/api/coverage.xml
          retention-days: 14

  # C-13.9 wall-clock budgets run in their own parallel job (#2185 follow-up): measured inside the
  # covered run they failed on shared runners (test_create_app_under_200ms read 766 ms vs 200 ms on
  # four unrelated PRs, passing alone every time), and as a trailing step they pushed the `py` job
  # past its 20-minute default timeout once the unit suite reached ~17 min (8094 passed, then
  # cancelled at 20m01 on #2182). Same selection, same flags, still blocking: `ci-required` in
  # pr.yml depends on `py`, whose reusable-workflow conclusion aggregates every job in this file.
  py-perf:
    name: py-perf
    runs-on: ubuntu-latest
    # Fixed, not CV_CI_TIMEOUT_MINUTES: the perf set takes ~2.5 min; a run that needs more than 10
    # is itself a C-13.9 budget failure and should be cancelled rather than waited for.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        run: uv sync --frozen --all-groups

      - name: pytest perf budgets (C-13.9, no coverage tracing, isolated)
        run: uv run pytest -m perf --no-cov -p no:cacheprovider -p no:randomly --durations=0

  architecture:
    # Reported as its own required check named `architecture` per the
    # ticket's Definition of Done — mirrors the `py` job's result so
    # `ci-required` (pr.yml) and any future required-check config can depend
    # on `architecture` directly without re-running import-linter.
    name: architecture
    needs: py
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reflect the py job's architecture-contract step outcome
        run: |
          if [ "${{ needs.py.result }}" != "success" ]; then
            echo "py job (which runs the import-linter architecture contract) did not succeed"
            exit 1
          fi
          echo "architecture contract passed (see the 'py' job's 'Architecture contract' step)"
