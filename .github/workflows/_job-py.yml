name: _job-py

# E03-T03: Python CI lane for services/api (and any Python tooling under
# scripts/**, tools/ci/**), invoked from pr.yml when the `py` path filter is
# true. Pipeline shape per ADR-0013 ("[py] lint (ruff) - typecheck (mypy
# --strict on modules) - unit (pytest) - build"), split into parallel jobs so
# the lane stays under ADR-0013's 15-minute PR-feedback p90 (#2424):
#
#   py-checks: checkout -> setup-uv (cache keyed on uv.lock) -> uv sync --frozen
#     -> ruff check + ruff format --check -> mypy --strict -> rule IR schema
#     drift -> alert rules, promtool, amtool -> Grafana dashboard lint
#     -> import-linter architecture contract (its own `architecture` check)
#   py-tests: one job per lane of tools/ci/py-test-lanes.json, all at once (sixteen since #3881:
#     the four heavy matrices sharded; docs/ci-runbook.md section 10 has the measured lane times):
#     pytest -m "not exchange_smoke ..." --cov on the lane's paths
#     (network-guarded, ADR-0012/SR-140) -> upload the lane's raw coverage data
#   py (after both): coverage combine -> coverage.xml + term report -> the
#     addopts --cov-fail-under floor on the combined data -> uv build -> upload
#     the `py-coverage` artifact (E03-T04's threshold gate owns the per-package
#     floors) -> fail unless py-checks and every lane succeeded.
#   `py-perf (N/3)` (parallel): pytest -m "perf and not flaky" --no-cov, the C-13.9
#     wall-clock budgets, DB-backed ones included (testcontainers); `flaky`
#     tests are quarantined per C-9.3. Three shards of the committed perf index
#     (tools/ci/py-perf-index.json, #5193), so no shard collects the whole suite;
#     `py-perf-index` checks the index against a live collection.
#
# Out of scope (per ticket): coverage threshold enforcement (E03-T04),
# Bandit/pip-audit (E03-T07), Alembic migration checks (E03-T10), contract
# and integration pipeline suites (E03-T06). Postgres/QuestDB service
# containers for `integration_db`-marked tests are added by whichever
# ticket lands the first such test (none exist yet); the network guard
# already honours `CV_CI_ALLOWED_HOSTS` for when that lands.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # #4301: no reaper image is pulled mid-job; hosted runners are discarded after the job.
  TESTCONTAINERS_RYUK_DISABLED: "true"
  PYTHONIOENCODING: utf-8
  # SR-140: CI never holds production Bybit credentials. Loopback is always
  # allowed by the guard; this var stays empty until a ticket adds
  # `integration_db`-marked tests with digest-pinned service containers.
  CV_CI_ALLOWED_HOSTS: ""

jobs:
  py-checks:
    name: py-checks
    runs-on: ubuntu-latest
    # Under a minute on a warm uv cache (mypy is the long step); the shared lane budget is ample.
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen (fails if pyproject.toml drifted from uv.lock)
        run: uv sync --frozen --all-groups

      - name: ruff check
        run: uv run ruff check . ../../docs/research/xstate/gate/_paths.py ../../docs/research/xstate/gate/run_gate.py ../../tools/statechart/nightly_gate.py

      - name: ruff format --check
        run: uv run ruff format --check . ../../docs/research/xstate/gate/_paths.py ../../docs/research/xstate/gate/run_gate.py ../../tools/statechart/nightly_gate.py

      - name: mypy --strict
        # #1964: explicit gate-module paths only; the research scripts under
        # docs/research/xstate/gate/issues/** stay out of the lint lane.
        # #2893: cvdev is the dev-only sibling package (never packaged, never in an image); it is
        # held to the same strict typing as the app it plugs into.
        run: uv run mypy --strict candleviewer cvdev ../../docs/research/xstate/gate/_paths.py ../../docs/research/xstate/gate/run_gate.py ../../tools/statechart/nightly_gate.py

      # E35-T01 follow-up: the committed rule IR JSON Schema
      # (candleviewer/rules/ir/rule-ir.json) is generated from the pydantic
      # models; a model change without regenerating it must fail CI. Lives in
      # this lane (not pr.yml's `gen` step) because the generator needs the synced
      # backend environment, and every IR model edit is under services/api/**.
      - name: Rule IR JSON Schema drift check (E35-T01)
        run: uv run python scripts/generate_rule_ir_schema.py --check

      - name: Alert rule runbook-link gate (E04-T05)
        working-directory: .
        run: python infra/alertmanager/check_alert_rules.py

      - name: promtool check rules + rule unit tests, amtool check-config (E04-T05)
        working-directory: .
        run: |
          # Digests mirror infra/compose/docker-compose.yml (C-12.3)
          P=prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/p:ro" $P check rules $(cd infra/prometheus && printf "/p/%s " alerts/*.yml)
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/p:ro" $P test rules /p/tests/system_alerts.test.yml /p/tests/ingestion_alerts.test.yml /p/tests/ws_alerts.test.yml
          A=prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
          AM="docker run --rm --entrypoint amtool -v $PWD/infra/alertmanager:/etc/alertmanager:ro $A"
          $AM check-config /etc/alertmanager/alertmanager.yml
          # page_event (#2931): check-config accepts a receiver no route uses, so only these cases
          # fail the build if the event route is deleted, listed below the generic page route or
          # shadowed by a route above it. One per event page (a rule labelled `resolves: window`),
          # with the labels its rule carries; infra/alertmanager/tests pins that the list has them.
          for r in \
            "page severity=page" \
            "page alertname=ApiDown severity=page component=api" \
            "page_event severity=page resolves=window" \
            "page_event alertname=AuditChainVerificationFailed severity=page component=audit resolves=window" \
            "page_event alertname=AuthAuditOutcomesLostBurst severity=page component=auth_audit resolves=window" \
            "page_event alertname=AuthBreakGlassAttempted severity=page component=auth_break_glass_attempt resolves=window" \
            "page_event alertname=AuthBreakGlassUsed severity=page component=auth_break_glass resolves=window" \
            "page_event alertname=AuthOwnerBootstrapped severity=page component=auth_owner_bootstrap resolves=window" \
            "page_event alertname=AuthRecoveryCodeUsed severity=page component=auth_recovery resolves=window" \
            "page_event alertname=IngestionTradeGapUnrecovered severity=page component=ingestion resolves=window" \
            "ticket severity=ticket" \
            "deadman alertname=Watchdog" \
            "ticket severity=ticket component=auth"; do
            set -- $r; recv=$1; shift
            $AM config routes test --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=$recv "$@"
          done
          # Notification body render: occurrence count + required fields (E04-T05 AC grouping/page content)
          out=$($AM template render --template.glob='/etc/alertmanager/templates/*.tmpl' --template.data=/etc/alertmanager/tests/data/grouped_page.json --template.text='{{ template "cv.title" . }} | {{ template "cv.body" . }}')
          echo "$out"
          for want in "[PAGE]" "Alert: OmsUnknownOrders" "Component: oms" "Env: dev" "Occurrences: 3" "Runbook: docs/plan/07-release-and-prr.md#alert-omsunknownorders"; do
            printf '%s' "$out" | grep -qF -- "$want" || { echo "rendered notification missing: $want" >&2; exit 1; }
          done

      - name: Grafana dashboard lint (E04-S01 AC3, metric names vs catalogue)
        working-directory: .
        run: python infra/grafana/lint_dashboards.py --strict

      - name: Architecture contract (import-linter, ADR-0004)
        id: architecture
        run: uv run lint-imports

  py-tests:
    name: py-tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # The py-only variable (#2185, #2426), so tuning the shared CV_CI_TIMEOUT_MINUTES for other
    # lanes cannot shrink it. A lane is about a sixteenth of the suite since #3881, against about
    # a quarter with four lanes (13-16 min on a slow shared runner, #3751) and 24-30 min when one
    # job ran it all (ADR-0013's Validation): the default stays a ceiling, not an expectation.
    timeout-minutes: ${{ fromJSON(vars.CV_CI_PY_TIMEOUT_MINUTES || 30) }}
    strategy:
      # Every lane runs to the end, so one red lane never hides another lane's failures.
      fail-fast: false
      matrix:
        # The lanes of tools/ci/py-test-lanes.json, rest last: a heavy matrix is sharded into
        # `<name>-<k>` lanes (#3881). scripts/tests/test_py_test_lanes.py fails when this list and
        # the manifest differ. Each lane writes its own coverage data, and `py` combines them all.
        lane:
          - unit-heavy-1
          - unit-heavy-2
          - unit-heavy-3
          - unit-heavy-4
          - db-chaos-1
          - db-chaos-2
          - db-chaos-3
          - db-chaos-4
          - db-chaos-5
          - contract-security-1
          - contract-security-2
          - contract-security-3
          - rest-heavy-1
          - rest-heavy-2
          - rest-heavy-3
          - rest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        run: uv sync --frozen --all-groups

      # #4301: the tests construct PostgresContainer("postgres:16-alpine"), and testcontainers pulls it
      # when the daemon lacks it, a cold pull mid-test. Pull it here, with retries and a pinned mirror.
      - name: Pre-pull postgres:16-alpine (CI-INFRA-001)
        # Only the lanes that collect a Postgres module (scripts/tests/test_prepull_images.py pins this).
        if: ${{ startsWith(matrix.lane, 'db-chaos') || matrix.lane == 'contract-security-3' }}
        working-directory: ${{ github.workspace }}
        run: tools/ci/prepull_images.sh postgres

      - name: pytest (unit + non-exchange_smoke, network-guarded)
        env:
          HYPOTHESIS_PROFILE: ci
          LANE: ${{ matrix.lane }}
        # The selection and flags of the single job, on this lane's paths only. A lane covers part
        # of the code, so it turns the addopts --cov-fail-under off and writes no report: `py`
        # applies the floor to the combined data and writes the reports. A red run keeps its data,
        # so a failing test does not also turn the coverage gate into a missing-artifact failure.
        # `not flaky`: a test quarantined per C-9.3 runs in no lane, as addopts says (#3091).
        run: |
          lane_args=$(python ../../tools/ci/py_test_lanes.py pytest-args "$LANE")
          read -ra lane_paths <<< "$lane_args"
          status=0
          uv run pytest -p no:cacheprovider -m "not exchange_smoke and not (chaos and integration) and not roundtrip and not fuzz and not harness and not perf and not flaky" \
            --durations=10 --cov --cov-report= --cov-fail-under=0 "${lane_paths[@]}" || status=$?
          if [ -f .coverage ]; then mv .coverage "py-lane-$LANE.coverage"; fi
          exit "$status"

      - name: Upload this lane's raw coverage data (the py job combines every lane)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: py-lane-cov-${{ matrix.lane }}
          path: services/api/py-lane-${{ matrix.lane }}.coverage
          if-no-files-found: error
          # A re-run of this lane replaces the data of the attempt it repeats. Kept 5 days: C-4.3
          # has a branch older than 5 days rebased daily (a new run), so "Re-run failed jobs" finds
          # the green lanes' data; past that, "Re-run all jobs" (docs/ci-runbook.md CI-COV-003).
          overwrite: true
          retention-days: 5

  py:
    name: py
    needs: [py-checks, py-tests]
    # Runs after a red lane too: when every lane left its data the coverage gate still gets the
    # suite's real number, as it did when one job ran everything. The last step fails `py` unless
    # py-checks and every lane succeeded, so `architecture` (pr.yml) keeps reflecting all of it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Fixed: downloading, combining, reporting and building take about a minute.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        run: uv sync --frozen --all-groups

      - name: Download every lane's raw coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: py-lane-cov-*
          path: services/api/lane-coverage
          merge-multiple: true

      - name: coverage combine (one data file per lane or none, CI-COV-003)
        run: |
          listing=$(python ../../tools/ci/py_test_lanes.py data-files lane-coverage)
          mapfile -t lane_data <<< "$listing"
          uv run coverage combine "${lane_data[@]}"

      - name: coverage.xml, term report and the addopts --cov-fail-under floor (combined data)
        run: |
          floor=$(python ../../tools/ci/py_test_lanes.py fail-under)
          uv run coverage xml -o coverage.xml
          uv run coverage report --fail-under="$floor"

      - name: uv build
        run: uv build

      - name: Upload coverage report (for E03-T04's threshold gate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: py-coverage
          path: services/api/coverage.xml
          retention-days: 14
          # A re-run of `py` replaces the report of the attempt it repeats.
          overwrite: true

      - name: Fail unless py-checks and every py-tests lane succeeded
        if: ${{ !cancelled() }}
        env:
          CHECKS_RESULT: ${{ needs.py-checks.result }}
          TESTS_RESULT: ${{ needs.py-tests.result }}
        run: |
          echo "py-checks: $CHECKS_RESULT; py-tests (every lane): $TESTS_RESULT"
          [ "$CHECKS_RESULT" = success ] && [ "$TESTS_RESULT" = success ]

  # C-13.9 wall-clock budgets run in their own parallel job (#2185 follow-up): measured inside the
  # covered run they failed on shared runners (test_create_app_under_200ms read 766 ms vs 200 ms on
  # four unrelated PRs, passing alone every time), and as a trailing step they pushed the `py` job
  # past its then-20-minute default timeout once the unit suite reached ~17 min (8094 passed, then
  # cancelled at 20m01 on #2182). Same selection, same flags, still blocking: `ci-required` in
  # pr.yml depends on `py`, whose reusable-workflow conclusion aggregates every job in this file.
  py-perf:
    # #5193: one job ran the whole set, 16.5-18.9 min a run on hosted runners (#5171, #5186): about
    # 5 min to collect the 68,000-test suite to select the perf tests, then about 12.7 min of tests.
    # Now three shards of tools/ci/py-perf-index.json (153 tests on 2026-10-31; `py-perf-index`
    # below fails when the index drifts from a live collection), split by whole test file with the
    # file weights of CI job 124449801043 (run 41171217151, the slowest of #5186's four: 759 s of
    # tests), about 253 s of tests a shard. Each shard imports only its own files: locally 7-17 s
    # of collection against 505 s for the whole suite. Expected a shard, at that slowest pace:
    # 60 s of set-up and pre-pull, 30 s of collection and 253 s of tests, about 5.7 min (`python
    # tools/ci/py_perf_index.py plan 3`). The job name carries the shard; `ci-required` still
    # judges the `py` workflow's conclusion, which aggregates every job here (C-9.1 unchanged).
    name: py-perf (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # Fixed, not CV_CI_TIMEOUT_MINUTES: a hang guard, not a budget (the per-test C-13.9 budgets gate
    # inside the tests). 16 is the larger of 1.5x a shard's expected 343 s (8.6 min) and that plus
    # the pre-pull's 580 s worst case (15.4 min), rounded up; scripts/tests/test_py_perf_index.py
    # recomputes it from the index's weights. Raise it with the measurement, never to hide a hang.
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3] # keep in sync with the shard list above (a pin test checks it)
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        run: uv sync --frozen --all-groups

      # #4301: the tests construct PostgresContainer("postgres:16-alpine"), and testcontainers pulls it
      # when the daemon lacks it, a cold pull mid-test. Pull it here, with retries and a pinned mirror.
      - name: Pre-pull postgres:16-alpine (CI-INFRA-001)
        working-directory: ${{ github.workspace }}
        env:
          # 8 pulls x 45 s + 220 s of waits = 580 s, inside this job's 16-minute timeout.
          PREPULL_PULL_TIMEOUT: "45"
        run: tools/ci/prepull_images.sh postgres

      # The shard's node ids, then the lane's selection on them: `-m` still applies, so the index
      # can only narrow what the marker selects, and a listed id that no longer exists fails here.
      - name: pytest perf budgets, one shard of the index (C-13.9, no coverage tracing, isolated)
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          set -euo pipefail
          listing=$(python ../../tools/ci/py_perf_index.py shard "$SHARD" "$TOTAL")
          mapfile -t ids <<< "$listing"
          uv run pytest "${ids[@]}" -m "perf and not flaky" --no-cov -p no:cacheprovider -p no:randomly --durations=0

  # #5193: the shards run the committed index, so a perf test the index misses would run nowhere.
  # This job collects the whole suite the way the single job did (about 5 min on a hosted runner,
  # beside the shards) and fails, naming the tests and the regeneration command, when the index
  # differs from it.
  py-perf-index:
    name: py-perf-index
    runs-on: ubuntu-latest
    # About 6 min (1 min of set-up and the 5-min collection); 1.5x is 9, rounded up to 10.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        run: uv sync --frozen --all-groups

      - name: The perf index equals a live perf collection (#5193)
        run: uv run python ../../tools/ci/py_perf_index.py check
