name: chaos-bars-nightly

# E12-Q06 (#529): the bars chaos suite (services/api/tests/chaos/bars, catalogue in its
# SCENARIOS.md: C-13.6 #1 and #12 mid-bar, #3 gap and out-of-order, #5 backfill rate limit, #6 clock
# skew, #10 store outage, plus the delisted-symbol extension), every night on main and on demand.
# Additive to the PR lane: _job-py.yml's db-chaos shards run the suite (marker `chaos`, no docker);
# this run repeats it, picks up any `chaos` test that also carries `harness`, and is the signal
# C-13.6 asks for. Fakes and the virtual clock only; the one test that needs QuestDB
# (test_s05b_questdb_container.py, `chaos` and `integration`) skips here and runs in
# _job-integration.yml's storage chaos step, which brings the stack up.
# Not a required check (C-9.1 is unchanged), but a red night blocks the next release (C-9.2,
# C-13.6). One pytest call; its own `-m` replaces addopts', so `not flaky` repeats the C-9.3
# quarantine. No retries: a flaky test is quarantined, never re-run until green. `--no-cov`, as
# chaos-ws-nightly.yml. A red night comments on, or opens, the `chaos-bars` signal's issue
# (_nightly-issue.yml, #1849); it pages no one. No workflow-level concurrency group (#3449).
# Offline: no exchange egress (C-13.5).
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  chaos-bars:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the step caps (3 + 3 + 5 + 10 + 3) plus 1 for set-up and post steps
    env:
      CV_ENV: test
      CV_CI_ALLOWED_HOSTS: "" # SR-140: loopback only (the network guard reads this)
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false # nothing here pushes or fetches
      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        timeout-minutes: 3
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"
      - name: uv sync --frozen (fails if pyproject.toml drifted from uv.lock)
        timeout-minutes: 5
        run: uv sync --frozen --all-groups
      - name: Bars chaos suite (the PR lane's tests and the harness-marked ones)
        # This limit ends a hang as a failed step, which the report job files; the job's own
        # limit would cancel the job, which it does not file.
        timeout-minutes: 10
        run: |
          uv run pytest tests/chaos/bars -m "chaos and not flaky" --no-cov -p no:randomly \
            -p no:cacheprovider -rA --durations=20 --junitxml=chaos-bars-junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 3
        with:
          name: chaos-bars-junit
          path: services/api/chaos-bars-junit.xml
          if-no-files-found: warn
          retention-days: 14

  chaos-bars-issue:
    needs: chaos-bars
    if: ${{ always() && needs.chaos-bars.result == 'failure' }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-issue.yml
    with:
      signal: chaos-bars
      title-prefix: "chaos: bars nightly failed"
      labels: qa,area/ingestion,priority/p1
      body: "chaos-bars-nightly (E12-Q06, #529: the bars chaos suite, C-13.6 #1, #3, #5, #6, #10 and #12) failed, and a red night blocks the next release (C-9.2). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Artifact: chaos-bars-junit. Catalogue: services/api/tests/chaos/bars/SCENARIOS.md. Triage: docs/ci-runbook.md section 2, Nightly bars chaos. Quarantine a flaky test per C-9.3; never re-run until green."
