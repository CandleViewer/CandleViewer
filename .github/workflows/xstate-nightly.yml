name: xstate-nightly

# E50-T04 (29-statechart-adoption-plan.md §1.7 Nightly, P3-G6).
#  * pinned   - docs/research/xstate/gate/run_gate.py --with-bench against the
#               hash-locked xstate-statemachine==0.9.1 wheel (uv sync --frozen).
#               GATES: a blocking check failing that is neither in the committed
#               baseline (result-v0.9.1.json) nor a documented delta in
#               tools/statechart/nightly_gate.py, or BENCH-6 p99 > 100 ms at 500
#               busy machines, turns the run red.
#  * notify   - on a red pinned run, comments on the open E50-C17 tracker issue
#               (files one only when none is open). The only job that can write.
#  * upstream - the same gate against the latest PyPI release. Informational:
#               continue-on-error, never gates, only publishes a note.
# BENCH-6 must be measured on target hardware: set the repo variable
# CV_TARGET_HW_RUNNER to a JSON runner label (e.g. '["self-hosted","target-hw"]');
# it falls back to ubuntu-latest until that runner exists.
# Reports land in artifacts/xstate-gate/<date>.md (uploaded as an artifact).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  UPSTREAM_REPO: basiltt/xstate-statemachine
  BASELINE: docs/research/xstate/gate/result-v0.9.1.json

jobs:
  pinned:
    name: xstate-nightly-pinned
    runs-on: ${{ fromJSON(vars.CV_TARGET_HW_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      verdict-rc: ${{ steps.verdict.outputs.rc }}
      regressions: ${{ steps.verdict.outputs.regressions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: Verify the pin (exact, hash-locked)
        run: python tools/ci/check_pin.py

      - name: uv sync --frozen (hash-verified pinned wheel)
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: Checkout upstream tag v0.9.1 (BENCH-6 scenario source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: v0.9.1
          path: _upstream
          persist-credentials: false

      - name: Upstream dev venvs for the env rows (pinned wheel, hash-locked)
        # #579: 13 rows need _upstream/.venv-main (pytest + upstream's own suite) or
        # _upstream/.venv-gate (library only) and were SKIP-ENV here. Both venvs get the
        # PINNED wheel with its sha256 from services/api/uv.lock (the single source that
        # check_pin.py verified above); .venv-main adds upstream's `test` group from the
        # tag's own uv.lock. --require-hashes and --no-build: nothing unpinned, no sdist.
        run: |
          pin="$RUNNER_TEMP/xstate-pin.txt"
          (cd services/api && uv export --frozen --no-emit-project --format requirements-txt) \
            | awk '/^xstate-statemachine==/ {p = 1} p {print} p && !/\\$/ {p = 0}' > "$pin"
          grep -q '^xstate-statemachine==' "$pin"
          (cd _upstream && uv export --frozen --no-dev --group test --no-emit-project \
            --format requirements-txt) > "$RUNNER_TEMP/upstream-test.txt"
          uv venv _upstream/.venv-gate
          uv venv _upstream/.venv-main
          uv pip install --python _upstream/.venv-gate/bin/python \
            --require-hashes --no-deps --no-build -r "$pin"
          uv pip install --python _upstream/.venv-main/bin/python \
            --require-hashes --no-build -r "$RUNNER_TEMP/upstream-test.txt" -r "$pin"

      - name: run_gate.py (pinned, with benchmarks)
        id: gate
        continue-on-error: true
        working-directory: services/api
        run: >
          uv run python ../../docs/research/xstate/gate/run_gate.py
          --with-bench --json "$GITHUB_WORKSPACE/gate-result.json"

      - name: BENCH-6 (bench_c_timers_v2.py)
        working-directory: services/api
        run: >
          uv run python ../../docs/research/xstate/bench/bench_c_timers_v2.py
          --repo "$GITHUB_WORKSPACE/_upstream" > "$GITHUB_WORKSPACE/bench6.json"

      - name: Verdict + report
        id: verdict
        run: |
          day=$(date -u +%F)
          report="artifacts/xstate-gate/$day.md"
          rc=0
          python tools/statechart/nightly_gate.py --mode pinned \
            --result gate-result.json --baseline "$BASELINE" --bench bench6.json \
            --date "$day" --out "$report" || rc=$?
          regressions=$(awk '/^## Regressions/ {f = 1; next} /^## / {f = 0}
            f && /^- / {sub(/^- /, ""); printf "%s%s", sep, $0; sep = ", "}' "$report" || true)
          { echo "rc=$rc"; echo "regressions=$regressions"; } >> "$GITHUB_OUTPUT"
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xstate-gate-pinned
          path: |
            artifacts/xstate-gate/
            gate-result.json
            bench6.json
          retention-days: 30

  notify:
    name: xstate-nightly-notify (E50-C17 tracker)
    needs: pinned
    if: ${{ !cancelled() && needs.pinned.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Comment on the open tracker issue (file one only if none is open)
        # #579: one tracker instead of a new issue every night. No checkout and no
        # third-party code runs in this job; it only calls the preinstalled gh CLI.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRACKER_TITLE: "xstate-nightly: pinned 0.9.1 gate regression"
          VERDICT_RC: ${{ needs.pinned.outputs.verdict-rc }}
          REGRESSIONS: ${{ needs.pinned.outputs.regressions }}
        run: |
          day=$(date -u +%F)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$VERDICT_RC" = "1" ]; then
            what="the pinned gate is red. Regressions: ${REGRESSIONS:-none listed, see BENCH-6}"
          else
            what="the pinned job failed (nightly_gate exit: ${VERDICT_RC:-not reached})"
          fi
          body="E50-C17 (upstream liaison), $day: $what. Run: $run_url (artifact xstate-gate-pinned)."
          num=$(gh issue list --state open --search "in:title \"$TRACKER_TITLE\"" --limit 50 \
            --json number,title \
            --jq '[.[] | select(.title | startswith(env.TRACKER_TITLE))] | max_by(.number) | .number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$TRACKER_TITLE $day" --label "area/backend-platform" \
              --label "priority/p1" --body "$body"
          fi

  upstream:
    name: xstate-nightly-upstream (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          python-version: "3.12"

      - name: Latest upstream release in a throwaway venv (not the pin)
        run: |
          uv venv "$RUNNER_TEMP/up"
          uv pip install --python "$RUNNER_TEMP/up/bin/python" --upgrade xstate-statemachine

      - name: run_gate.py (latest upstream, no benchmarks)
        continue-on-error: true
        run: >
          "$RUNNER_TEMP/up/bin/python" docs/research/xstate/gate/run_gate.py
          --json "$GITHUB_WORKSPACE/gate-result.json"

      - name: Informational note
        run: >
          python tools/statechart/nightly_gate.py --mode upstream
          --result gate-result.json --baseline "$BASELINE"
          --date "$(date -u +%F)" --out "artifacts/xstate-gate/$(date -u +%F)-upstream.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xstate-gate-upstream
          path: artifacts/xstate-gate/
          retention-days: 30
