name: design-qa-ledger-export

# E49-T02: push design_qa_findings_open{severity} to the pushgateway when the ledger changes
# on main, and hourly. Reads one repo file; the only secret is the (tailnet) pushgateway URL.
# A scheduled or dispatched run whose ledger is absent (E49-D01, #1330, has not committed it yet)
# only notes that and succeeds; a push run, which only a change to the ledger triggers, still fails.
on:
  push:
    branches: [main]
    paths:
      - docs/plan/backlog/artifacts/e49-design-qa-ledger.csv
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-qa-ledger-export
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'CandleViewer/CandleViewer'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Push ledger counts
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          LEDGER: docs/plan/backlog/artifacts/e49-design-qa-ledger.csv
        run: |
          if [ ! -f "$LEDGER" ] && [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "::notice::$LEDGER not found (E49-D01, #1330, opens it); nothing pushed"
            exit 0
          fi
          python -m tools.ga_defects.run ledger --path "$LEDGER" --require-push
