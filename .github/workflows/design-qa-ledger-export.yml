name: design-qa-ledger-export

# E49-T02: push design_qa_findings_open{severity} to the pushgateway when the ledger changes
# on main, and hourly. Reads one repo file; the only secret is the (tailnet) pushgateway URL.
on:
  push:
    branches: [main]
    paths:
      - docs/plan/backlog/artifacts/e49-design-qa-ledger.csv
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-qa-ledger-export
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'basiltt/CandleViewer'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Push ledger counts
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: python -m tools.ga_defects.run ledger --require-push
