name: defect-triage

# E49-T01: DoR validation on bug open/edit, daily SLA sweep + digest, and the
# regression-guard check. Logic lives in tools/triage (unit-tested offline).
# Never uses pull_request_target and never checks out untrusted PR code with a
# write token in scope (SR-132; docs/plan/04-security-program.md).
# Secrets: TRIAGE_TOKEN (fine-grained, this repo + project only), TRIAGE_DIGEST_WEBHOOK.

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: "0 8 * * 1-5" # business-day digest, 08:00 UTC
    - cron: "0 7 * * 1" # E49-T02 weekly GA defect snapshot + log append, Monday 07:00 UTC
    - cron: "23 * * * *" # E49-T02 hourly GA defect metric push (2 h freshness gate, same cadence as ledger export)
  workflow_dispatch:
    inputs:
      sweep:
        description: "Run the one-time existing-debt sweep (re-grade open bugs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: defect-triage-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  dor:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'type/bug')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: Validate bug DoR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m tools.triage.run dor --number "${{ github.event.issue.number }}"

  sla:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5') || (github.event_name == 'workflow_dispatch' && !inputs.sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: SLA sweep and digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRIAGE_CALENDAR_PATH: tools/triage/calendar.yml
          TRIAGE_DIGEST_WEBHOOK: ${{ secrets.TRIAGE_DIGEST_WEBHOOK }}
          TRIAGE_PROJECT_ID: ${{ secrets.TRIAGE_PROJECT_ID }}
        run: python -m tools.triage.run sla

  sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: One-time debt sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m tools.triage.run sweep

  # E49-T02: weekly snapshot appended to e49-triage-log.md. main is protected (C-4.1), so the
  # appended log is published as an artifact for the ritual owner to commit via PR. The log
  # append always runs; the metrics push is skipped with a ::notice when PUSHGATEWAY_URL (a
  # tailnet address, never public) is unset, and --require-push turns that into a red run.
  ga-snapshot:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1') || (github.event_name == 'workflow_dispatch' && !inputs.sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: Snapshot, append to triage log, push metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: python -m tools.ga_defects.run snapshot --require-push
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e49-triage-log
          path: docs/plan/backlog/artifacts/e49-triage-log.md

  # E49-T02: hourly metric push only (no log append) so the 2 h pushgateway freshness gate
  # on the dashboard and GA defect alerts holds. Misconfigured push fails the run (--require-push).
  ga-metrics:
    if: github.event_name == 'schedule' && github.event.schedule == '23 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: Push GA defect metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: python -m tools.ga_defects.run defects --require-push
