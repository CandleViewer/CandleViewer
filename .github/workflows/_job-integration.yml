name: _job-integration

# E03-T06: integration lane (ADR-0013 pipeline shape "[integration] fixture-driven
# pipeline + OMS fake-exchange suite", CONSTITUTION §9 check 7).
#
# Two suites:
#   1. Fixture-driven pipeline (`services/api/tests/integration/pipeline/`):
#      fixture manifest + checksum verification (CI-INT-001/002) then the
#      recorded-fixture -> normalised-events replay. Runs with outbound
#      network denied except loopback (`_ci_network_guard.py`, autouse).
#   2. `-m integration` suites needing Postgres/QuestDB (currently the
#      identity/RBAC migration round-trip, `tests/integration/auth/`) —
#      these spin their own service container via testcontainers, which
#      needs Docker; `services=docker` is available on GitHub-hosted
#      ubuntu runners.
#      `perf` wall-clock budgets run once, in `py-perf` (_job-py.yml), which
#      has Docker too. Tests marked `flaky` are quarantined (C-9.3) and run
#      in no lane: addopts deselects them and every workflow -m repeats
#      `not flaky` (scripts/tests/test_workflow_pytest_markers.py); each
#      carries its P1 ticket and quarantine date.
#
# The OMS fake-exchange suite (per ADR-0012's table) has no product logic
# to exercise yet — `oms/service.py` is an R0 scaffold with no order
# lifecycle implemented (ticket "Out of scope": "product E2E specs,
# contract fixtures ... for features that do not exist yet"). The lane
# exists and is wired here; it activates automatically as `unit/exchange`
# and `oms` gain real logic under the existing `-m integration` marker.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  CV_CI_ALLOWED_HOSTS: ""

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen --all-groups
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: Verify fixture manifest (CI-INT-001 fixture unavailable, CI-INT-002 checksum mismatch)
        run: python tools/ci/verify_fixture_manifest.py --manifest tests/fixtures/MANIFEST.sha256 --repo-root .

      - name: Fixture-driven pipeline suite (network denied except loopback)
        working-directory: services/api
        run: uv run pytest tests/integration/pipeline -m "not integration and not fuzz and not perf and not harness and not flaky" --no-cov

      - name: Postgres/QuestDB-backed integration suite (testcontainers, needs Docker)
        working-directory: services/api
        run: uv run pytest tests/integration -m "integration and not perf and not flaky" --no-cov -rA

      - name: Upload restore-drill report (E07-X02 SR-093)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-report
          path: services/api/build/reports/restore-drill.json
          if-no-files-found: error

      - name: SR-047 runtime listener probe on the compose data stores (E07-X02)
        env:
          # CI-only throwaway; the stores hold no data and bind loopback only.
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
          GF_SECURITY_ADMIN_PASSWORD: ci-only-${{ github.run_id }}
          MINIO_ROOT_PASSWORD: ci-only-${{ github.run_id }}
          CV_ALERT_PAGE_WEBHOOK_URL: http://127.0.0.1:1/unused
          CV_ALERT_TICKET_WEBHOOK_URL: http://127.0.0.1:1/unused
          CV_ALERT_DEADMAN_URL: http://127.0.0.1:1/unused
          CV_LISTENER_PROBE: "1"
          COMPOSE_PROFILES: core
        run: |
          # --wait honours both compose healthchecks (questdb's is a bash /dev/tcp probe, #276).
          docker compose -f infra/compose/docker-compose.yml --profile core up -d --wait postgres questdb
          docker compose -f infra/compose/docker-compose.yml --profile core ps
          cd services/api
          uv run pytest tests/integration/security/test_sr047_listener_probe.py -m "integration and not flaky" --no-cov -s -p no:cacheprovider

      - name: Stop compose data stores
        if: always()
        env:
          POSTGRES_PASSWORD: unused
          GF_SECURITY_ADMIN_PASSWORD: unused
          MINIO_ROOT_PASSWORD: unused
        run: docker compose -f infra/compose/docker-compose.yml --profile core down -v || true

      - name: Storage chaos stack up (E07-Q04 scenarios 1/2/3b/8, C-13.6)
        env:
          POSTGRES_PASSWORD: cv-chaos-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
        run: |
          # Pinned images come from the compose file itself (verified by pin-check).
          # --wait blocks until both compose healthchecks pass (questdb: bash /dev/tcp probe, #276)
          # and fails the step if either container goes unhealthy, so no port-poll loop is needed.
          docker compose -f infra/compose/docker-compose.yml up -d --wait postgres questdb
          docker compose -f infra/compose/docker-compose.yml ps
          # Fixed-size loopback image for scenario 3b: never the runner's real volume.
          truncate -s 64M /tmp/cv-chaos-cold.img
          mkfs.ext4 -q -F -m 0 /tmp/cv-chaos-cold.img
          sudo mkdir -p /mnt/cv-chaos-cold
          sudo mount -o loop /tmp/cv-chaos-cold.img /mnt/cv-chaos-cold
          sudo chown "$(id -u):$(id -g)" /mnt/cv-chaos-cold
          cd services/api
          CV_PG_DSN=postgresql+asyncpg://cv:cv-chaos-ci@127.0.0.1:5432/candleviewer uv run alembic upgrade head

      - name: Storage chaos scenarios (pytest -m "chaos and integration and not flaky")
        working-directory: services/api
        env:
          POSTGRES_PASSWORD: cv-chaos-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
          CV_CHAOS_LOOPBACK_DIR: /mnt/cv-chaos-cold
        run: uv run pytest tests/chaos -m "chaos and integration and not flaky" --no-cov -v -p no:randomly

      # GH-3087 regression check. S2 stops Postgres and starts it again; S3b and S8 then need it up.
      # `docker compose start` once exited 0 without starting it (S2 timed out, S3b and S8 got
      # connection refused), a race that hit one attempt in two. Repeating the three scenarios
      # makes a recurrence likely to show on the PR that causes it, not on an unrelated one.
      - name: Storage chaos S2, S3b and S8 repeated x5 (GH-3087 regression check)
        working-directory: services/api
        env:
          POSTGRES_PASSWORD: cv-chaos-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
          CV_CHAOS_LOOPBACK_DIR: /mnt/cv-chaos-cold
        run: |
          set -e  # stop at the first failing pass; not left to the runner's default `bash -e`
          for n in 1 2 3 4 5; do
            echo "== S2 -> S3b -> S8, pass ${n} of 5 =="
            uv run pytest tests/chaos/storage/test_stack_scenarios.py -m "chaos and integration and not flaky" \
              -k "test_s2_ or test_s3b_ or test_s8_" --no-cov -v -p no:randomly
          done

      - name: Storage chaos stack down
        if: always()
        env:
          POSTGRES_PASSWORD: unused-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
        run: |
          docker compose -f infra/compose/docker-compose.yml ps -a || true
          docker compose -f infra/compose/docker-compose.yml logs --tail 50 postgres questdb || true
          docker compose -f infra/compose/docker-compose.yml down -v || true
          sudo umount /mnt/cv-chaos-cold || true

      - name: Grafana live render suite (E04-S01 AC1/AC2)
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: ci-only-${{ github.run_id }}
          GRAFANA_URL: http://127.0.0.1:3001
          PROM_STUB_PORT: "9090"
          GRAFANA_CONTAINER: cv-grafana
        run: |
          # Image + digest copied from infra/compose/docker-compose.yml (verified by pin-check).
          IMG=$(grep -m1 'image: grafana/grafana' infra/compose/docker-compose.yml | awk '{print $2}')
          # Host network so Grafana's datasource proxy reaches the stub Prometheus on loopback.
          # Provisioning + dashboards are mounted; "prometheus" resolves to loopback where the stub listens.
          docker run -d --name cv-grafana --network host --add-host prometheus:127.0.0.1             -e GF_SERVER_HTTP_PORT=3001 -e GF_SECURITY_ADMIN_USER -e GF_SECURITY_ADMIN_PASSWORD             -v "$PWD/infra/grafana/provisioning:/etc/grafana/provisioning:ro"             -v "$PWD/infra/grafana/dashboards:/var/lib/grafana/dashboards:ro" "$IMG"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs cv-grafana; echo "Grafana never became healthy"; exit 1; fi
          cd services/api
          uv run pytest ../../infra/grafana/tests/test_live_render.py -m "integration and not flaky" --no-cov -p no:cacheprovider

      - name: Remove Grafana container
        if: always()
        run: docker rm -f cv-grafana || true

      - name: Upload storage perf report (E07-Q03)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-perf
          path: services/api/build/reports/storage-perf.json
          if-no-files-found: warn
          retention-days: 30

      - name: Assert no live-exchange egress occurred
        if: always()
        run: |
          echo "Network guard (services/api/tests/_ci_network_guard.py) denies any non-loopback"
          echo "connect() for the whole run; a test reaching api.bybit.com raises NetworkGuardViolation"
          echo "and fails this job rather than silently succeeding."

  # E42-K01 (#888) audit query-plan spike: 10 M synthetic audit_log rows on a
  # testcontainers Postgres 16, EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) per index
  # candidate, 10k-row write batches, GIN CREATE INDEX CONCURRENTLY. Long-running,
  # so it is opt-in: only on PRs labelled `run-audit-spike` (or manual dispatch).
  # Not a required check; it publishes the numbers the spike/ADR-0025 cite.
  audit-query-plan:
    name: audit-query-plan
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-audit-spike') }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen --all-groups
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: Audit query-plan measurement (10 M rows)
        working-directory: services/api
        env:
          CV_AUDIT_SPIKE: "1"
          CV_AUDIT_SPIKE_ROWS: "10000000"
        run: uv run pytest tests/integration/audit/test_query_plan_spike.py -m "integration and perf and not flaky" --no-cov -rA -s -p no:randomly

      - name: Upload audit query-plan report (E42-K01)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-query-plan-report
          path: services/api/build/reports/audit-query-plan.json
          if-no-files-found: error
