name: _job-integration

# E03-T06: integration lane (ADR-0013 pipeline shape "[integration] fixture-driven
# pipeline + OMS fake-exchange suite", CONSTITUTION §9 check 7).
#
# Two suites:
#   1. Fixture-driven pipeline (`services/api/tests/integration/pipeline/`):
#      fixture manifest + checksum verification (CI-INT-001/002) then the
#      recorded-fixture -> normalised-events replay. Runs with outbound
#      network denied except loopback (`_ci_network_guard.py`, autouse).
#   2. `-m integration` suites needing Postgres/QuestDB (`tests/integration/`,
#      sharded since #4605, see below) —
#      these spin their own service container via testcontainers, which
#      needs Docker; `services=docker` is available on GitHub-hosted
#      ubuntu runners.
#      `perf` wall-clock budgets run once, in `py-perf` (_job-py.yml), which
#      has Docker too. Tests marked `flaky` are quarantined (C-9.3) and run
#      in no lane: addopts deselects them and every workflow -m repeats
#      `not flaky` (scripts/tests/test_workflow_pytest_markers.py); each
#      carries its P1 ticket and quarantine date.
#
# The OMS fake-exchange suite (per ADR-0012's table) has no product logic
# to exercise yet — `oms/service.py` is an R0 scaffold with no order
# lifecycle implemented (ticket "Out of scope": "product E2E specs,
# contract fixtures ... for features that do not exist yet"). The lane
# exists and is wired here; it activates automatically as `unit/exchange`
# and `oms` gain real logic under the existing `-m integration` marker.
#
# #3881: the integration jobs run on the merge queue's merge group and on a merge train, never on
# a pull request's own run: they are the slowest part of the gate, and the queue runs them on
# every merge into `main` before `ci-required` lets the group through. The resolver reads the
# lane's `skipped` on a pull request as "runs on the merge group" (scripts/ci_gate_resolver.mjs);
# change the jobs' `if:` and that rule together. `audit-query-plan` is unchanged: opt-in on a PR.
#
# #4605: the suite step had grown to 18-28 minutes against the 30-minute hang guard (run
# 40309420588 was cancelled at 30:00 and its PR ejected from the queue). Three job definitions now:
#   - `integration-shard`: a matrix of four shards of suite 2, split by measured per-file duration
#     (tools/ci/integration_shards.py: median seconds over five merge-group runs, pinned report
#     files, a default weight so a new file still lands in exactly one shard). Each writes its
#     pytest and job time to its summary; shard 1 uploads restore-drill-report and storage-perf.
#   - `integration-stack`: what runs once, in parallel with the shards: suite 1, the SR-047
#     probe, the storage chaos scenarios and the Grafana render suite on their compose stores.
#   - `integration`: the check `ci-required` judges (same name as before); it tabulates every
#     shard's duration and fails unless every shard and the stack job passed.
# Each job sets its own timeout-minutes (measured duration plus 10), not vars.CV_CI_TIMEOUT_MINUTES.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # #4301: no reaper image is pulled mid-job; hosted runners are discarded after the job.
  TESTCONTAINERS_RYUK_DISABLED: "true"
  PYTHONIOENCODING: utf-8
  CV_CI_ALLOWED_HOSTS: ""

jobs:
  integration-shard:
    # #4605: the Postgres/QuestDB suite in four shards of about equal measured duration
    # (tools/ci/integration_shards.py; five merge-group runs: 18-27 min in one job, 4.4-7.0 min a
    # shard). `total` is the one place the shard count is set; the job name, the split script
    # call and the summary read it. timeout-minutes is the heaviest shard at the slowest measured
    # pace plus 90 s of job overhead (about 9 min in all) plus 10, not
    # vars.CV_CI_TIMEOUT_MINUTES; a pin test recomputes it from the weight table
    # (scripts/tests/test_integration_shards.py).
    name: integration-shard (${{ matrix.shard }}/${{ matrix.total }})
    # Not on a pull request (#3881, see the header); the merge group and a merge train run it.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4] # keep in sync with the shard list above (a pin test checks it)
    steps:
      - name: Record the job's start time (#4605 per-shard durations)
        id: start
        run: echo "start_s=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen --all-groups
        working-directory: services/api
        run: uv sync --frozen --all-groups

      # #4301: testcontainers pulls postgres:16-alpine (and postgres:16.4, QuestDB) mid-test when the
      # daemon lacks them. Pull them here, with retries; Postgres also has a pinned mirror
      # (tools/ci/prepull_images.sh, infra/images/prepull.txt).
      - name: Pre-pull postgres, compose postgres and questdb images (CI-INFRA-001)
        run: tools/ci/prepull_images.sh postgres postgres-compose questdb

      - name: Postgres/QuestDB-backed integration suite, one shard (testcontainers, needs Docker)
        id: pytest
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          set -euo pipefail
          listing=$(python tools/ci/integration_shards.py "$SHARD" "$TOTAL")
          mapfile -t files <<< "$listing"
          cd services/api
          # The pytest wall time and file count go to the job summary (last steps), so growth
          # shows before a shard nears its timeout; a failing run still reports them.
          pytest_start_s=$(date +%s)
          status=0
          uv run pytest "${files[@]}" -m "integration and not perf and not flaky" --no-cov -rA || status=$?
          {
            echo "pytest_s=$(( $(date +%s) - pytest_start_s ))"
            echo "test_files=${#files[@]}"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      # The report files' tests are pinned to shard 1 (PINNED in tools/ci/integration_shards.py).
      - name: Upload restore-drill report (E07-X02 SR-093)
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-report
          overwrite: true # a re-run of shard 1 replaces the earlier attempt's report
          path: services/api/build/reports/restore-drill.json
          if-no-files-found: error

      - name: Upload storage perf report (E07-Q03)
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-perf
          overwrite: true # a re-run of shard 1 replaces the earlier attempt's report
          path: services/api/build/reports/storage-perf.json
          if-no-files-found: warn
          retention-days: 30

      - name: Shard duration (job summary; the integration job tabulates every shard)
        if: always()
        env:
          START_S: ${{ steps.start.outputs.start_s }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          PYTEST_S: ${{ steps.pytest.outputs.pytest_s }}
          TEST_FILES: ${{ steps.pytest.outputs.test_files }}
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          mkdir -p shard-timing
          row="| ${SHARD}/${TOTAL} | $(( $(date +%s) - START_S )) | ${PYTEST_S:-n/a} | ${TEST_FILES:-n/a} | ${OUTCOME} |"
          echo "$row" > "shard-timing/shard-${SHARD}.md"
          {
            echo "### integration-shard ${SHARD}/${TOTAL} duration"
            echo "| shard | job (s) | pytest (s) | test files | suite step |"
            echo "|---|---|---|---|---|"
            echo "$row"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-shard-timing-${{ matrix.shard }}
          path: shard-timing/shard-${{ matrix.shard }}.md
          if-no-files-found: error
          # A re-run of this shard replaces the attempt it repeats (the `_job-py.yml` lane precedent);
          # without it the re-run's upload fails with "an artifact with this name already exists".
          overwrite: true
          retention-days: 5 # a later "Re-run failed jobs" of `integration` still finds every shard

  integration-stack:
    # #4605: everything that runs once, beside the shards (about 3 minutes, so never the critical
    # path, and shard 1 stays as long as the others): the fixture-driven pipeline, the SR-047
    # probe, the storage chaos scenarios and the Grafana render suite, each on its own compose
    # stores. timeout-minutes: about 3 minutes measured (run 40314689824) plus 10.
    name: integration-stack
    # Not on a pull request (#3881, see the header); the merge group and a merge train run it.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen --all-groups
        working-directory: services/api
        run: uv sync --frozen --all-groups

      # #4301: the compose steps below pull QuestDB, Grafana and postgres:16.4; pull them here,
      # with retries (tools/ci/prepull_images.sh, infra/images/prepull.txt).
      - name: Pre-pull compose postgres, questdb and grafana images (CI-INFRA-001)
        run: tools/ci/prepull_images.sh postgres-compose questdb grafana

      - name: Verify fixture manifest (CI-INT-001 fixture unavailable, CI-INT-002 checksum mismatch)
        run: python tools/ci/verify_fixture_manifest.py --manifest tests/fixtures/MANIFEST.sha256 --repo-root .

      - name: Fixture-driven pipeline suite (network denied except loopback)
        working-directory: services/api
        run: uv run pytest tests/integration/pipeline -m "not integration and not fuzz and not perf and not harness and not flaky" --no-cov

      - name: SR-047 runtime listener probe on the compose data stores (E07-X02)
        env:
          # CI-only throwaway; the stores hold no data and bind loopback only.
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
          GF_SECURITY_ADMIN_PASSWORD: ci-only-${{ github.run_id }}
          MINIO_ROOT_PASSWORD: ci-only-${{ github.run_id }}
          CV_ALERT_PAGE_WEBHOOK_URL: http://127.0.0.1:1/unused
          CV_ALERT_TICKET_WEBHOOK_URL: http://127.0.0.1:1/unused
          CV_ALERT_DEADMAN_URL: http://127.0.0.1:1/unused
          CV_LISTENER_PROBE: "1"
          COMPOSE_PROFILES: core
        run: |
          # --wait honours both compose healthchecks (questdb's is a bash /dev/tcp probe, #276).
          docker compose -f infra/compose/docker-compose.yml --profile core up -d --wait postgres questdb
          docker compose -f infra/compose/docker-compose.yml --profile core ps
          cd services/api
          uv run pytest tests/integration/security/test_sr047_listener_probe.py -m "integration and not flaky" --no-cov -s -p no:cacheprovider

      - name: Stop compose data stores
        if: always()
        env:
          POSTGRES_PASSWORD: unused
          GF_SECURITY_ADMIN_PASSWORD: unused
          MINIO_ROOT_PASSWORD: unused
        run: docker compose -f infra/compose/docker-compose.yml --profile core down -v || true

      - name: Storage chaos stack up (E07-Q04 scenarios 1/2/3b/8, C-13.6)
        env:
          POSTGRES_PASSWORD: cv-chaos-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
        run: |
          # Pinned images come from the compose file itself (verified by pin-check).
          # --wait blocks until both compose healthchecks pass (questdb: bash /dev/tcp probe, #276)
          # and fails the step if either container goes unhealthy, so no port-poll loop is needed.
          docker compose -f infra/compose/docker-compose.yml up -d --wait postgres questdb
          docker compose -f infra/compose/docker-compose.yml ps
          # Fixed-size loopback image for scenario 3b: never the runner's real volume.
          truncate -s 64M /tmp/cv-chaos-cold.img
          mkfs.ext4 -q -F -m 0 /tmp/cv-chaos-cold.img
          sudo mkdir -p /mnt/cv-chaos-cold
          sudo mount -o loop /tmp/cv-chaos-cold.img /mnt/cv-chaos-cold
          sudo chown "$(id -u):$(id -g)" /mnt/cv-chaos-cold
          cd services/api
          CV_PG_DSN=postgresql+asyncpg://cv:cv-chaos-ci@127.0.0.1:5432/candleviewer uv run alembic upgrade head

      - name: Storage chaos scenarios (pytest -m "chaos and integration and not flaky")
        working-directory: services/api
        env:
          POSTGRES_PASSWORD: cv-chaos-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
          CV_CHAOS_LOOPBACK_DIR: /mnt/cv-chaos-cold
        run: uv run pytest tests/chaos -m "chaos and integration and not flaky" --no-cov -v -p no:randomly

      # GH-3087 regression check. S2 stops Postgres and starts it again; S3b and S8 then need it up.
      # `docker compose start` once exited 0 without starting it (S2 timed out, S3b and S8 got
      # connection refused), a race that hit one attempt in two. Repeating the three scenarios
      # makes a recurrence likely to show on the PR that causes it, not on an unrelated one.
      - name: Storage chaos S2, S3b and S8 repeated x5 (GH-3087 regression check)
        working-directory: services/api
        env:
          POSTGRES_PASSWORD: cv-chaos-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
          CV_CHAOS_LOOPBACK_DIR: /mnt/cv-chaos-cold
        run: |
          set -e  # stop at the first failing pass; not left to the runner's default `bash -e`
          for n in 1 2 3 4 5; do
            echo "== S2 -> S3b -> S8, pass ${n} of 5 =="
            uv run pytest tests/chaos/storage/test_stack_scenarios.py -m "chaos and integration and not flaky" \
              -k "test_s2_ or test_s3b_ or test_s8_" --no-cov -v -p no:randomly
          done

      - name: Storage chaos stack down
        if: always()
        env:
          POSTGRES_PASSWORD: unused-ci
          GF_SECURITY_ADMIN_PASSWORD: unused-ci
          MINIO_ROOT_PASSWORD: unused-ci
        run: |
          docker compose -f infra/compose/docker-compose.yml ps -a || true
          docker compose -f infra/compose/docker-compose.yml logs --tail 50 postgres questdb || true
          docker compose -f infra/compose/docker-compose.yml down -v || true
          sudo umount /mnt/cv-chaos-cold || true

      - name: Grafana live render suite (E04-S01 AC1/AC2)
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: ci-only-${{ github.run_id }}
          GRAFANA_URL: http://127.0.0.1:3001
          PROM_STUB_PORT: "9090"
          GRAFANA_CONTAINER: cv-grafana
        run: |
          # Image + digest copied from infra/compose/docker-compose.yml (verified by pin-check).
          IMG=$(grep -m1 'image: grafana/grafana' infra/compose/docker-compose.yml | awk '{print $2}')
          # Host network so Grafana's datasource proxy reaches the stub Prometheus on loopback.
          # Provisioning + dashboards are mounted; "prometheus" resolves to loopback where the stub listens.
          docker run -d --name cv-grafana --network host --add-host prometheus:127.0.0.1             -e GF_SERVER_HTTP_PORT=3001 -e GF_SECURITY_ADMIN_USER -e GF_SECURITY_ADMIN_PASSWORD             -v "$PWD/infra/grafana/provisioning:/etc/grafana/provisioning:ro"             -v "$PWD/infra/grafana/dashboards:/var/lib/grafana/dashboards:ro" "$IMG"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs cv-grafana; echo "Grafana never became healthy"; exit 1; fi
          cd services/api
          uv run pytest ../../infra/grafana/tests/test_live_render.py -m "integration and not flaky" --no-cov -p no:cacheprovider

      - name: Remove Grafana container
        if: always()
        run: docker rm -f cv-grafana || true

  integration:
    # The check `ci-required` reads (lane `integration`, CONSTITUTION.md §9 check 7): green only
    # when every shard and the stack job passed; a failing, cancelled or timed-out one fails it.
    # Its own `if:` keeps the #3881 skip on a pull request (all three jobs skip there, so the
    # lane's result is `skipped`, which the resolver reads as deferred to the merge group).
    name: integration
    needs: [integration-shard, integration-stack]
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integration-shard-timing-*
          merge-multiple: true
          path: ${{ runner.temp }}/shard-timing

      - name: Per-shard durations (job summary)
        if: always()
        env:
          TIMING_DIR: ${{ runner.temp }}/shard-timing
        run: |
          {
            echo "### integration shards"
            echo "| shard | job (s) | pytest (s) | test files | suite step |"
            echo "|---|---|---|---|---|"
            cat "$TIMING_DIR"/shard-*.md 2>/dev/null || echo "| none reported | | | | |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Every shard and the stack job passed
        if: always()
        env:
          SHARDS: ${{ needs.integration-shard.result }}
          STACK: ${{ needs.integration-stack.result }}
        run: |
          echo "integration-shard (all shards): $SHARDS; integration-stack: $STACK"
          [ "$SHARDS" = success ] && [ "$STACK" = success ]

      # Informational only: this job runs no tests. The guard acts in the jobs that do.
      - name: Assert no live-exchange egress occurred
        if: always()
        run: |
          echo "Network guard (services/api/tests/_ci_network_guard.py) denies any non-loopback"
          echo "connect() in every integration-shard and integration-stack test; a test reaching"
          echo "api.bybit.com raises NetworkGuardViolation and fails the shard or stack job that ran"
          echo "it, so the verdict step above fails this job rather than silently succeeding."

  # E42-K01 (#888) audit query-plan spike: 10 M synthetic audit_log rows on a
  # testcontainers Postgres 16, EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) per index
  # candidate, 10k-row write batches, GIN CREATE INDEX CONCURRENTLY. Long-running,
  # so it is opt-in: only on PRs labelled `run-audit-spike`. No dispatch arm: pr.yml's one
  # dispatch is a merge train (#3783), which must not start a 200-minute spike.
  # Not a required check; it publishes the numbers the spike/ADR-0025 cite.
  audit-query-plan:
    name: audit-query-plan
    if: ${{ contains(github.event.pull_request.labels.*.name, 'run-audit-spike') }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen --all-groups
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: Pre-pull postgres image (CI-INFRA-001)
        run: tools/ci/prepull_images.sh postgres

      - name: Audit query-plan measurement (10 M rows)
        working-directory: services/api
        env:
          CV_AUDIT_SPIKE: "1"
          CV_AUDIT_SPIKE_ROWS: "10000000"
        run: uv run pytest tests/integration/audit/test_query_plan_spike.py -m "integration and perf and not flaky" --no-cov -rA -s -p no:randomly

      - name: Upload audit query-plan report (E42-K01)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-query-plan-report
          path: services/api/build/reports/audit-query-plan.json
          if-no-files-found: error
