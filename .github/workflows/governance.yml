name: governance

# The "governance" check (E01-T08). Branch protection requires only `ci-required`; the merge
# procedure (AGENTS.md §4) requires this one green as well. It runs the GOV-00x structural
# checks plus:
#   - a canary self-test (--self-test) proving each checker still fails
#     against a deliberately-broken fixture (scripts/gov_self_test.py),
#   - a >=85% line coverage gate on scripts/** (CONSTITUTION.md §9 #3),
#   - job-duration measurement against the 90 s budget, recorded as a
#     GitHub Actions annotation.
# Owning ticket: E01-Q02. #3789: parallel jobs instead of one. `governance-checks` runs the
# checks, the canary and the reports; the `governance-tests` shards run the unit tests
# (tools/ci/governance_shards.py splits the files by measured duration; #4365, #4588: five shards,
# because two ran at the 90 s budget); `governance` needs all of them, combines the shards'
# coverage, applies the 85% gate and fails unless every job passed, so the `governance` check
# still means the whole set. Each job checks its own duration.

on:
  pull_request:
  # Not on push-to-main: the merged PR already ran this exact check on the
  # same tree (squash merges only). Saves one full run per merge.

concurrency:
  group: governance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-checks:
    name: governance-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Record job start time (perf budget <=90s, E01-Q02)"
        id: gov_start
        run: echo "start_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify_migration_lockfile needs merge-base
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install check dependencies (PyYAML for GOV-004, pytest(-cov) for unit tests)
        run: python -m pip install --quiet -r scripts/requirements-ci.txt

      - name: Create artefact output directory
        run: mkdir -p gov-artifacts

      - name: Rule-reference link check (GOV-002)
        run: python scripts/check_rule_refs.py

      - name: Keymap conflict, reserved-key and catalogue-drift lint (E49-T04)
        run: python scripts/keymap_lint.py --check-docs

      - name: Single-source-of-truth duplication check (GOV-003)
        # known pre-existing GOV-003 finding on docs/plan/04-security-program.md
        # predates this ticket (E01-T08) and is out of its scope to fix;
        # tracked as a follow-up (#1439) so this required check stays
        # informative without blocking merges on an unrelated defect.
        continue-on-error: true
        run: python scripts/check_sot_duplication.py

      - name: CODEOWNERS coverage check (GOV-001)
        id: gov001
        # Also writes the ownership-report artefact from the same scan, so the
        # repo is matched once, not twice (#2557).
        run: python scripts/check_codeowners_coverage.py --report-file gov-artifacts/codeowners-ownership-report.txt

      - name: Issue form structural check (GOV-004)
        run: python scripts/check_issue_forms.py

      - name: Backlog validation (semantic/report tool)
        # --check writes nothing and fails on any backlog twin that is not byte-identical to
        # what validate.py writes, reading CRLF line endings as LF (#3454); validate.py is the
        # twins' formatter, not prettier (#3362). pr.yml's backlog-twin-eol gate fails a twin
        # blob committed with CRLF (#3495).
        run: python docs/plan/backlog/_tools/validate.py --check

      - name: Backlog schema validation (GOV-004)
        run: python scripts/validate-backlog.py --quiet

      - name: Required-check reconciliation (GOV-005)
        run: python scripts/check_required_check_reconciliation.py

      - name: Markdownlint + relative-link resolution over governance docs (GOV-006)
        run: python scripts/check_markdown_governance_docs.py

      - name: Owned docs untouched by tooling; turbo agentGuidance opted out (GOV-007, #1907)
        run: python scripts/check_owned_docs_untouched.py

      - name: Every epic ticket appears in its threat model ticket map (GOV-008, #1922)
        run: python scripts/check_threat_model_ticket_map.py

      - name: CI runbook completeness check (CI-DOC-001, E03-T15)
        run: python scripts/check_runbook_completeness.py

      - name: Branch-protection bypass register check (CI-PROT-004, E03-T13)
        run: python scripts/check_bypass_register.py

      - name: Accepted-risk expiry check (C-12.3, E49-T03)
        # Fails on any expired acceptance (yaml / register Accepted rows /
        # in-source nosemgrep review dates); warns <30 days. Also runs weekly
        # in accepted-risk-expiry-weekly.yml so an expiry that passes with no
        # PR open is still caught.
        run: python tools/ci/check_accepted_risk_expiry.py --report "$RUNNER_TEMP/accepted-risk-report.md"

      - name: Publish accepted-risk report (live count; not pinned in the inventory doc, #1984)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-risk-report
          path: ${{ runner.temp }}/accepted-risk-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Canary self-test (deliberately-broken fixtures must fail)
        # The guard against a green check that no longer checks anything
        # (E01-Q02 acceptance scenario "the job proves it can still fail").
        run: python scripts/gov_self_test.py --self-test

      - name: Generate CODEOWNERS ownership report (artefact, only if GOV-001 did not run)
        if: ${{ always() && steps.gov001.outcome == 'skipped' }}
        run: python scripts/check_codeowners_coverage.py --report > gov-artifacts/codeowners-ownership-report.txt
        continue-on-error: true

      - name: Generate backlog per-epic summary (artefact)
        if: always()
        run: python scripts/validate-backlog.py --summary > gov-artifacts/backlog-summary.txt
        continue-on-error: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: governance-reports
          path: gov-artifacts/
          retention-days: 90

      - name: Job duration budget (<=BUDGET_MS, E01-Q02)
        if: always()
        continue-on-error: false
        env:
          BUDGET_MS: "90000"
          START_NS: ${{ steps.gov_start.outputs.start_ns }}
        run: |
          end_ns=$(date +%s%N)
          duration_ms=$(( (end_ns - START_NS) / 1000000 ))
          echo "$GITHUB_JOB job duration: ${duration_ms}ms (budget ${BUDGET_MS}ms)"
          {
            echo "### $GITHUB_JOB duration"
            echo "| metric | ms |"
            echo "|---|---|"
            echo "| wall time | ${duration_ms} |"
            echo "| budget | ${BUDGET_MS} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$GITHUB_JOB job duration::${duration_ms}ms (budget ${BUDGET_MS}ms)"
          if [ "$duration_ms" -gt "$BUDGET_MS" ]; then
            echo "::error title=$GITHUB_JOB job over budget::${duration_ms}ms exceeds ${BUDGET_MS}ms (docs/plan/backlog/testplans/E01-governance-charter.md, E01-Q02)"
            exit 1
          fi

  governance-tests:
    # The unit tests, in five shards of about equal measured duration (#3789, #4365, #4588): one job ran
    # them in 55-69 s of a 90 s budget, two shards then sat at the budget as the suite grew. Each
    # shard writes raw coverage data only; `governance` combines it. `total` is the one place the
    # shard count is set; the job name, the split script call and the summary all read it.
    name: governance-tests (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        total: [5] # keep in sync with the shard list above (a pin test checks it)
    steps:
      - name: "Record job start time (perf budget <=90s, E01-Q02)"
        id: gov_start
        run: echo "start_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # some tests read the history (merge-base)
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      # scripts/tests/test_pnpm_effective_policy.py (#3277) runs the pinned pnpm offline and fails
      # without it; node-version "20" resolves a corepack that unpacks pnpm 12 (test_workflow_corepack).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      # pnpm 12 downloads its native binary on first use and the cases run with corepack's network
      # off, so the one `pnpm --version` here, with network access, fetches it.
      - name: Enable the pinned pnpm for the install-policy tests
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate && pnpm --version

      - name: Install check dependencies (PyYAML for GOV-004, pytest(-cov) for unit tests)
        run: python -m pip install --quiet -r scripts/requirements-ci.txt

      - name: Governance script unit tests, one shard (coverage data for the 85% gate)
        id: pytest
        env:
          # Line coverage only (no branch config anywhere), so coverage.py can
          # measure with sys.monitoring on 3.13: identical per-file results,
          # about 2x faster than the default ctrace core, which pays a trace
          # call per frame even in unmeasured code (the ast/YAML-heavy tests).
          # If branch coverage is ever enabled, coverage.py warns and falls
          # back to ctrace: slower, never weaker (#2557).
          COVERAGE_CORE: sysmon
          COVERAGE_FILE: coverage-shard-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          set -euo pipefail
          listing=$(python tools/ci/governance_shards.py "$SHARD" "$TOTAL")
          mapfile -t files <<< "$listing"
          # The pytest wall time and file count go to the job summary (budget step below), so
          # growth shows before a shard misses the budget; a failing run still reports them.
          pytest_start_ns=$(date +%s%N)
          status=0
          python -m pytest "${files[@]}" -q -n auto --dist worksteal \
            --cov=scripts --cov-report= --cov-fail-under=0 || status=$?
          pytest_end_ns=$(date +%s%N)
          {
            echo "pytest_ms=$(( (pytest_end_ns - pytest_start_ns) / 1000000 ))"
            echo "test_files=${#files[@]}"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: governance-coverage-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 5 # a later "Re-run failed jobs" of `governance` still finds every shard

      - name: Job duration budget (<=BUDGET_MS, E01-Q02)
        if: always()
        continue-on-error: false
        env:
          BUDGET_MS: "90000"
          START_NS: ${{ steps.gov_start.outputs.start_ns }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          PYTEST_MS: ${{ steps.pytest.outputs.pytest_ms }}
          TEST_FILES: ${{ steps.pytest.outputs.test_files }}
        run: |
          end_ns=$(date +%s%N)
          duration_ms=$(( (end_ns - START_NS) / 1000000 ))
          echo "$GITHUB_JOB shard ${SHARD}/${TOTAL} job duration: ${duration_ms}ms (budget ${BUDGET_MS}ms)"
          {
            echo "### $GITHUB_JOB shard ${SHARD}/${TOTAL} duration"
            echo "| metric | value |"
            echo "|---|---|"
            echo "| wall time (ms) | ${duration_ms} |"
            echo "| pytest wall time (ms) | ${PYTEST_MS:-n/a} |"
            echo "| test files | ${TEST_FILES:-n/a} |"
            echo "| budget (ms) | ${BUDGET_MS} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$GITHUB_JOB job duration::${duration_ms}ms (budget ${BUDGET_MS}ms)"
          if [ "$duration_ms" -gt "$BUDGET_MS" ]; then
            echo "::error title=$GITHUB_JOB job over budget::${duration_ms}ms exceeds ${BUDGET_MS}ms (docs/plan/backlog/testplans/E01-governance-charter.md, E01-Q02)"
            exit 1
          fi

  governance:
    # The check people and tools read: green only when the checks and every test shard passed
    # and the shards' combined coverage of scripts/** is at least 85% (CONSTITUTION.md §9 #3).
    name: governance
    needs: [governance-checks, governance-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Record job start time (perf budget <=90s, E01-Q02)"
        id: gov_start
        run: echo "start_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # coverage report reads the sources only
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install check dependencies (PyYAML for GOV-004, pytest(-cov) for unit tests)
        run: python -m pip install --quiet -r scripts/requirements-ci.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: governance-coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/gov-coverage

      - name: Combined coverage of scripts/** (>=85% gate)
        env:
          COV_DIR: ${{ runner.temp }}/gov-coverage
        run: |
          set -euo pipefail
          # The combine reads only the downloaded shard files, and all five must be there.
          shopt -s nullglob
          files=("$COV_DIR"/coverage-shard-*)
          [ "${#files[@]}" -eq 5 ] || {
            echo "::error::expected 5 shard coverage files in $COV_DIR, found ${#files[@]}"
            exit 1
          }
          python -m coverage combine "${files[@]}"
          python -m coverage report -m --fail-under=85

      - name: Every governance job passed
        if: ${{ !cancelled() }}
        env:
          CHECKS: ${{ needs.governance-checks.result }}
          TESTS: ${{ needs.governance-tests.result }}
        run: |
          echo "governance-checks: $CHECKS; governance-tests (all shards): $TESTS"
          [ "$CHECKS" = success ] && [ "$TESTS" = success ]

      - name: Job duration budget (<=BUDGET_MS, E01-Q02)
        if: always()
        continue-on-error: false
        env:
          BUDGET_MS: "90000"
          START_NS: ${{ steps.gov_start.outputs.start_ns }}
        run: |
          end_ns=$(date +%s%N)
          duration_ms=$(( (end_ns - START_NS) / 1000000 ))
          echo "$GITHUB_JOB job duration: ${duration_ms}ms (budget ${BUDGET_MS}ms)"
          {
            echo "### $GITHUB_JOB duration"
            echo "| metric | ms |"
            echo "|---|---|"
            echo "| wall time | ${duration_ms} |"
            echo "| budget | ${BUDGET_MS} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$GITHUB_JOB job duration::${duration_ms}ms (budget ${BUDGET_MS}ms)"
          if [ "$duration_ms" -gt "$BUDGET_MS" ]; then
            echo "::error title=$GITHUB_JOB job over budget::${duration_ms}ms exceeds ${BUDGET_MS}ms (docs/plan/backlog/testplans/E01-governance-charter.md, E01-Q02)"
            exit 1
          fi
