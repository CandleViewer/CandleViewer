name: governance-drift

# GOV-005: weekly branch-protection drift check (CONSTITUTION.md C-9.1,
# docs/plan/01-sdlc-and-branching.md §6.1). Never triggered by pull_request —
# the apply/drift credential is repository-administration scoped and must
# never be reachable from a PR-triggered workflow (see the E01-T08 break-glass
# runbook in CONTRIBUTING.md).

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  governance-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Required-check reconciliation (GOV-005)
        run: python scripts/check_required_check_reconciliation.py

      - name: Register staleness (CI-PROT-004)
        # Runs here too (not just in the PR-triggered governance.yml) so a
        # review date that expires with no PR open is still caught, on the
        # weekly schedule rather than only when a PR happens to touch this
        # file.
        run: python scripts/check_bypass_register.py

      - name: Branch protection drift check (GOV-005)
        id: drift
        env:
          GH_BRANCH_PROTECTION_TOKEN: ${{ secrets.GH_BRANCH_PROTECTION_TOKEN }}
        run: |
          set +e
          python scripts/check_branch_protection_drift.py \
            --repo "${{ github.repository }}" \
            --json > drift-findings.json
          status=$?
          cat drift-findings.json
          exit $status

      - name: Open issue on drift
        if: ${{ failure() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body = 'GOV-005: branch protection drift detected on `main`.\n\n';
            try {
              body += '```json\n' + fs.readFileSync('drift-findings.json', 'utf8') + '\n```\n';
            } catch (e) {
              body += 'See workflow run logs for details.\n';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'GOV-005: branch protection drift on main',
              body,
              labels: ['priority/p1-high', 'security'],
            });
