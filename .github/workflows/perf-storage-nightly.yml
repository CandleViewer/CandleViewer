name: perf-storage-nightly
# Recorded-not-gating in R0 (30-release-roadmap 4.4): runs nightly, never on PRs.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  storage-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CV_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - id: sync
        run: uv sync --project services/api
      - name: Proxy harness (DuckDB shapes, regression gate)
        id: proxy
        # Exit 1 is the harness's regression gate (a warm p95 over baseline). The exit code is
        # recorded as the step output `rc` for the ticket step below, and the step fails with it.
        run: |
          rc=0
          uv run --project services/api python tests/perf/storage/harness.py \
            --out results.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Real-engine harness (QuestDB 8.1.1 via testcontainers; docker is preinstalled on ubuntu-latest)
        id: real
        working-directory: services/api
        # --no-cov: the perf assertions are this step's check; the normal lanes measure coverage.
        # services/api's addopts add --cov-fail-under=85 for the whole package; four perf tests
        # cannot reach it, so every night ended in a coverage failure (exit 1) with all four passed
        # and filed a false regression ticket (#3429). Without the floor, exit 1 is a failed test.
        run: |
          rc=0
          uv run pytest tests/integration/storage/test_storage_perf_harness.py \
            -m "integration and perf and not flaky" --no-cov -p no:randomly || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Open ticket on >20% regression
        # Opens an issue only for a perf-gate exit, as each harness step recorded it in `rc`: 1 from
        # the proxy harness (a warm p95 over baseline) or 1 from the real-engine pytest run (a perf
        # test failed), after a `uv sync` that succeeded. Any other exit fails the job without a
        # ticket: pytest's 2 (interrupted or collection error), 3 (internal), 4 (usage) or 5
        # (nothing collected), a kill signal, a failed `uv sync`. Exit 1 is also what an uncaught
        # harness error or a fixture error (docker not reachable) gives: those open one too.
        if: failure() && (steps.proxy.outputs.rc == '1' || steps.real.outputs.rc == '1') && steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "perf: storage nightly regression >20% ($(date -u +%F))"             --label perf --label area/backend-platform             --body "storage-perf-nightly failed the 20% baseline gate. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Artifact: storage-perf-results."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: storage-perf-results
          path: |
            results.json
            services/api/build/reports/storage-perf.json
