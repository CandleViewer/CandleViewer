name: _job-e2e

# E03-T06: e2e + a11y lane (ADR-0013 pipeline shape "[e2e] Playwright web/electron
# + axe-core a11y", CONSTITUTION §9 checks 8/9).
#
# Four sub-jobs, each its own required-check name once GitHub Actions exposes
# reusable-workflow job names (precedent: `_job-py.yml`'s `architecture` job):
#   - `e2e-web`      : Playwright web suite, sharded 4x, every PR.
#   - `e2e-electron` : Electron suite on every call (E10-Q02: C-9.1 #8 puts the Electron
#                      main-window smoke in the e2e gate), the unpacked `dist/` plus one
#                      smoke on the `electron-builder --dir` package.
#   - `a11y-axe`     : axe-core assertions over the E2E web routes (subset of
#                      `e2e-web`'s own specs, e.g. smoke.spec.ts) plus this repo's
#                      `vitest-axe` component suite (apps/web unit tests already
#                      cover this per E02-T04; re-asserted here as the blocking gate).
#   - `e2e-staging`  : `@demo-rest-only`-tagged specs only, against demo REST
#                      endpoints. Zero real order specs exist in R0 (ticket's
#                      "Out of scope"), so `demo-rest-only.spec.ts` is the sole
#                      placeholder spec; `check_demo_rest_only_tag.mjs` fails this
#                      job loudly if the tag itself ever resolves to 0 specs,
#                      instead of the job silently going green on nothing.
#
# Flake handling: Playwright's own `retries: 1` in CI (see playwright.config.ts)
# gives one automatic retry; a failure that still fails after the retry is
# CI-E2E-001. A pass on retry is counted from the JSON report into the job summary
# (E10-Q02), and `@flaky` tests are quarantined by each config's grepInvert (C-9.3).

on:
  workflow_call:
    inputs:
      # #3383: the caller asked for the Electron smoke. Since E10-Q02 e2e-electron runs on every
      # call (C-9.1 #8); the input stays so callers that pass it (e2e-nightly.yml) are unchanged.
      electron:
        description: "Kept for callers; e2e-electron now runs on every call (E10-Q02)"
        type: boolean
        default: false
      # E10-Q02 (C-9.3): the quarantine leg. e2e-nightly.yml sets it, so each `@flaky` test still
      # runs every night in the configs' `flaky-nightly` project; pr.yml leaves it off.
      quarantine:
        description: "Also run the @flaky (quarantined) tests, reported in the job summary"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  e2e-web:
    name: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches (#3449)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vite resolves `@candleviewer/ui/theme.css` and the token CSS to packages/ui's built files,
      # and this job runs pnpm directly, so turbo's `^build` does not build them first (#3272).
      - name: Build the workspace packages apps/web depends on
        run: pnpm --filter "@candleviewer/web^..." run build

      - name: "Guard: the packages apps/web imports are built (fails fast, CI-BUILD-001)"
        run: node tools/ci/check_built_exports.mjs packages/ui packages/chart-engine packages/protocol

      - name: Build web app (Playwright's webServer runs the built `dist/` via vite preview)
        working-directory: apps/web
        run: pnpm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Playwright web suite (shard ${{ matrix.shard }}/4, CI-E2E-001 on post-retry failure)
        working-directory: apps/web
        run: npx playwright test -c e2e/playwright.config.ts --grep-invert "@demo-rest-only" --shard=${{ matrix.shard }}/4 --retries=1

      - name: Flaky count to the job summary (passed only on retry, C-9.3)
        if: always()
        working-directory: apps/web
        env:
          CV_LANE: e2e-web shard ${{ matrix.shard }}
        run: node ../../packages/fixtures/bin/flaky-summary.mjs

      # The quarantine leg (nightly only): a known-flaky test reports here without turning the
      # release-blocking nightly red; its P1 ticket tracks the fix (C-9.3).
      - name: Quarantined @flaky tests (flaky-nightly project, shard ${{ matrix.shard }}/4)
        if: ${{ always() && inputs.quarantine }}
        continue-on-error: true
        working-directory: apps/web
        env:
          CV_E2E_QUARANTINE: "1"
        run: npx playwright test -c e2e/playwright.config.ts --grep-invert "@demo-rest-only" --shard=${{ matrix.shard }}/4 --retries=1 --pass-with-no-tests

      - name: Quarantine count to the job summary
        if: ${{ always() && inputs.quarantine }}
        working-directory: apps/web
        env:
          CV_LANE: e2e-web shard ${{ matrix.shard }} quarantine (@flaky)
        run: node ../../packages/fixtures/bin/flaky-summary.mjs

      - name: Upload failure artifacts (traces/videos/screenshots — failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-failure-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7 # E10-Q02 (ticket Security notes); stub values only, no real session

      # E10-Q02 screenshot corpus (capture.spec.ts): uploaded on every run, no committed baseline.
      - name: Upload the screenshot corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-corpus-shard-${{ matrix.shard }}
          path: apps/web/test-results/*/corpus/*.png
          if-no-files-found: ignore
          retention-days: 7

  e2e-staging:
    name: e2e-staging
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches (#3449)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vite resolves `@candleviewer/ui/theme.css` and the token CSS to packages/ui's built files,
      # and this job runs pnpm directly, so turbo's `^build` does not build them first (#3272).
      - name: Build the workspace packages apps/web depends on
        run: pnpm --filter "@candleviewer/web^..." run build

      - name: "Guard: the packages apps/web imports are built (fails fast, CI-BUILD-001)"
        run: node tools/ci/check_built_exports.mjs packages/ui packages/chart-engine packages/protocol

      - name: Build web app (Playwright's webServer runs the built `dist/` via vite preview)
        working-directory: apps/web
        run: pnpm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Assert the @demo-rest-only tag still resolves (fails loudly, not silently, if removed)
        run: node tools/ci/check_demo_rest_only_tag.mjs

      - name: Demo REST-only order-entry suite (asserts no WS order-entry frames)
        working-directory: apps/web
        run: npx playwright test -c e2e/playwright.config.ts --grep "@demo-rest-only" --retries=1

  a11y-axe:
    name: a11y-axe
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches (#3449)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web's tests may import built artefacts of its workspace dependencies (packages/ui's
      # CSS exports, #3189); turbo's `^build` builds them first, but this job runs pnpm directly
      # (#3244).
      - name: Build the workspace packages apps/web depends on
        run: pnpm --filter "@candleviewer/web^..." run build

      - name: "Guard: the packages apps/web imports are built (fails fast, CI-BUILD-001)"
        run: node tools/ci/check_built_exports.mjs packages/ui packages/chart-engine packages/protocol

      - name: vitest-axe component suite (apps/web, packages/ui)
        run: pnpm --filter @candleviewer/web --filter @candleviewer/ui test

      - name: Build web app (Playwright's webServer runs the built `dist/` via vite preview)
        working-directory: apps/web
        run: pnpm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: axe-core route assertions (CI-A11Y-001 on new serious/critical violation)
        working-directory: apps/web
        run: npx playwright test -c e2e/playwright.config.ts smoke.spec.ts --retries=1

  e2e-electron:
    name: e2e-electron
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches (#3449)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 42 and later ship no postinstall, so the install leaves no binary: the SR-138
      # runner fetches it through electron's own install-electron bin before any launch (#1819).
      - name: Fetch the Electron binary (SR-138 allowlist runner)
        run: node tools/ci/run-allowed-postinstall.mjs

      # vite resolves `@candleviewer/ui/theme.css` and the token CSS to packages/ui's built files,
      # and this job runs pnpm directly, so turbo's `^build` does not build them first (#3272).
      - name: Build the workspace packages apps/web depends on
        run: pnpm --filter "@candleviewer/web^..." run build

      - name: "Guard: the packages apps/web imports are built (fails fast, CI-BUILD-001)"
        run: node tools/ci/check_built_exports.mjs packages/ui packages/chart-engine packages/protocol

      - name: Build web app (the shell loads `dist/`; Playwright's webServer serves it via vite preview)
        working-directory: apps/web
        run: pnpm run build

      - name: Build the Electron shell (the specs launch `dist/main/index.js`)
        working-directory: apps/desktop
        run: pnpm run build

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      # E10-Q02 (BQ-07): the shell as it ships, unpacked (no installer, no signing), from the
      # Electron binary already fetched above, so packaging downloads no second copy.
      - name: Package the shell (electron-builder --dir)
        working-directory: apps/desktop
        run: |
          pkg="$(node -p "require('path').dirname(require.resolve('electron/package.json'))")"
          pnpm exec electron-builder --config electron-builder.yml --linux --dir \
            -c.electronDist="$pkg/dist" -c.linux.executableName=candleviewer
          echo "CV_PACKAGED_EXECUTABLE=$PWD/release/linux-unpacked/candleviewer" >> "$GITHUB_ENV"

      # As perf-engine-matrix.yml (#4975; ADR-0011 "Decision — 2026-10-29"): the hosted image blocks
      # unprivileged user namespaces, so Chromium's sandbox needs its SUID helper, root-owned and
      # 4755, for the unpacked and the packaged shell alike. `--no-sandbox` would test a shell the
      # product never ships; shell-smoke.spec.ts asserts the renderers are sandboxed.
      - name: Make Electron's sandbox helpers setuid root
        working-directory: apps/desktop
        run: |
          pkg="$(node -p "require('path').dirname(require.resolve('electron/package.json'))")"
          for sandbox in "$pkg/dist/chrome-sandbox" release/linux-unpacked/chrome-sandbox; do
            if ! { test -f "$sandbox" && ! test -L "$sandbox"; }; then
              echo "::error::$sandbox is missing or a symlink"; exit 1
            fi
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          done

      # Electron needs an X display: the runner image ships xvfb, which the `build` job's
      # Electron-hardening gate (_job-js.yml) uses the same way.
      - name: Electron suite (unpacked dist/ and the packaged smoke)
        working-directory: apps/desktop
        run: xvfb-run -a pnpm run e2e --retries=1

      - name: Flaky count to the job summary (passed only on retry, C-9.3)
        if: always()
        working-directory: apps/desktop
        env:
          CV_LANE: e2e-electron
        run: node ../../packages/fixtures/bin/flaky-summary.mjs

      - name: Quarantined @flaky tests (flaky-nightly project)
        if: ${{ always() && inputs.quarantine }}
        continue-on-error: true
        working-directory: apps/desktop
        env:
          CV_E2E_QUARANTINE: "1"
        run: xvfb-run -a pnpm run e2e --retries=1 --pass-with-no-tests

      - name: Quarantine count to the job summary
        if: ${{ always() && inputs.quarantine }}
        working-directory: apps/desktop
        env:
          CV_LANE: e2e-electron quarantine (@flaky)
        run: node ../../packages/fixtures/bin/flaky-summary.mjs

      - name: Upload failure artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-electron-failure
          path: apps/desktop/test-results/
          retention-days: 7 # E10-Q02 (ticket Security notes); stub values only, no real session
