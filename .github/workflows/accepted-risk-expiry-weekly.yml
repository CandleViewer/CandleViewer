name: accepted-risk-expiry-weekly

# E49-T03: weekly accepted-risk expiry sweep (C-12.3, 32-risk-register.md §1.3).
# Mirrors governance-drift.yml: scheduled/dispatch only, read-only token plus
# issues:write. Opens (or comments on) one tracking issue when an acceptance
# has expired or is inside the 30-day window.

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  accepted-risk-expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install check dependencies (PyYAML)
        run: python -m pip install --quiet -r scripts/requirements-ci.txt

      - name: Accepted-risk expiry check (fail on expired, warn <30d)
        id: expiry
        run: |
          set +e
          python tools/ci/check_accepted_risk_expiry.py --fail-on-warn --report expiry-report.md
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # exit 2 = warnings only: report via issue, but do not fail the job.
          if [ "$status" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Open or update tracking issue
        if: ${{ failure() || steps.expiry.outputs.status == '2' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const title = 'Accepted-risk expiry: action needed';
            let body = fs.existsSync('expiry-report.md')
              ? fs.readFileSync('expiry-report.md', 'utf8')
              : 'See workflow run logs for details.\n';
            body += '\nOwning role per register entry; re-decide, never bare-extend '
              + '(docs/plan/32-risk-register.md §1.3).\n';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security', per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['priority/p1-high', 'security'],
              });
            }
