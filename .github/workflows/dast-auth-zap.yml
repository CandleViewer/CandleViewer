name: dast-auth-zap
# E09-X03: ZAP baseline per PR to main (passive); full authenticated active scan weekly
# and on workflow_dispatch (release gate). Needs the compose stack (docker) and CI secrets
# ZAP_FIXTURE_USER / ZAP_FIXTURE_PASSWORD (+ optional ZAP_FIXTURE_TOTP_SECRET) (never in the repo).
# Compose credentials are generated per run (random, masked, never echoed).
on:
  pull_request:
    branches: [main]
    paths:
      ["security/zap/**", "services/api/candleviewer/auth/**", "services/api/candleviewer/api/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
# #3751: a push replaces the PR's previous run; scheduled and dispatched runs share one group
# per ref and are never cancelled.
concurrency:
  group: dast-auth-zap-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  zap:
    name: zap-auth
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZAP_TARGET: http://localhost:8000
      ZAP_MODE: ${{ github.event_name == 'pull_request' && 'baseline' || 'full' }}
      ZAP_FIXTURE_USER: ${{ secrets.ZAP_FIXTURE_USER }}
      ZAP_FIXTURE_PASSWORD: ${{ secrets.ZAP_FIXTURE_PASSWORD }}
      ZAP_FIXTURE_TOTP_SECRET: ${{ secrets.ZAP_FIXTURE_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check fixture credentials present
        id: gate
        run: |
          if [ -z "${ZAP_FIXTURE_USER}" ] || [ -z "${ZAP_FIXTURE_PASSWORD}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::notice title=zap-auth skipped::ZAP_FIXTURE_USER/ZAP_FIXTURE_PASSWORD secrets are not set; PR baseline skipped (owner-pending, #1778 D)."
              echo "present=false" >> "$GITHUB_OUTPUT"
            else
              # Release gate / weekly: a scan that cannot authenticate is a failed scan, not a clean one.
              echo "::error title=zap-auth::fixture secrets missing on ${GITHUB_EVENT_NAME}; refusing to report an unauthenticated scan as clean."
              exit 1
            fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate ephemeral compose env
        if: steps.gate.outputs.present == 'true'
        run: |
          set -euo pipefail
          umask 077
          out=infra/compose/.env
          : > "$out"
          # Every *PASSWORD*/*SECRET*/*KEY* value is replaced by a fresh random value;
          # the file is gitignored, lives only on this runner and is never printed.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              \#*|"") echo "$line" >> "$out"; continue ;;
            esac
            k=${line%%=*}
            if [[ "$k" =~ (PASSWORD|SECRET|KEY) ]]; then
              v=$(openssl rand -hex 24)
              echo "::add-mask::$v"
              echo "$k=$v" >> "$out"
            else
              echo "$line" >> "$out"
            fi
          done < infra/compose/.env.example
          # The DSN embeds the postgres password: rebuild it from the generated value.
          pw=$(grep '^POSTGRES_PASSWORD=' "$out" | cut -d= -f2)
          sed -i "s#^CV_PG_DSN=.*#CV_PG_DSN=postgresql+asyncpg://cv:${pw}@postgres:5432/candleviewer#" "$out"
          if grep -qi "change_me" "$out"; then echo "::error::placeholder credential left in generated env"; exit 1; fi
      - name: Start stack
        if: steps.gate.outputs.present == 'true'
        run: docker compose -f infra/docker-compose.dev.yml up -d --wait
      - name: Seed ZAP fixture user (shared seeder, testnet-only)
        if: steps.gate.outputs.present == 'true'
        env:
          CV_ENVIRONMENT: testnet
          CV_SEED_USERNAME: ${{ secrets.ZAP_FIXTURE_USER }}
          CV_SEED_PASSWORD: ${{ secrets.ZAP_FIXTURE_PASSWORD }}
        run: |
          set -euo pipefail
          pw=$(grep '^POSTGRES_PASSWORD=' infra/compose/.env | cut -d= -f2)
          export CV_PG_DSN="postgresql+asyncpg://cv:${pw}@127.0.0.1:5432/candleviewer"
          pip install uv==0.12.19 >/dev/null
          cd services/api && uv sync --frozen -q
          uv run alembic upgrade head
          uv run python scripts/seed_fixture_user.py --allow-no-mfa
      - name: Run ZAP automation plan
        if: steps.gate.outputs.present == 'true'
        run: |
          set -euo pipefail
          # baseline: drop the activeScan job; full: keep it.
          cp security/zap/auth-context.yaml plan.yaml
          if [ "$ZAP_MODE" = baseline ]; then
            python -c "import yaml;p=yaml.safe_load(open('plan.yaml'));p['jobs']=[j for j in p['jobs'] if j['type']!='activeScan'];yaml.safe_dump(p,open('plan.yaml','w'))"
          fi
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            -e ZAP_TARGET -e ZAP_FIXTURE_USER -e ZAP_FIXTURE_PASSWORD -e ZAP_FIXTURE_TOTP_SECRET \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef zap.sh -cmd -autorun /zap/wrk/plan.yaml 2>&1 | tee zap-run.log
      - name: Fail if the scan lost authentication (logged-in indicator)
        if: steps.gate.outputs.present == 'true'
        run: |
          # Independent of ZAP's exit code: the run log must show both /v1/auth/me requestor
          # jobs finished without error, and the report must exist and contain the
          # authenticated /v1/auth/me response (never a 401 for it).
          python security/zap/check_liveness.py zap-run.log zap-report/zap.json
      - name: Block on new medium+ alerts
        if: steps.gate.outputs.present == 'true'
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open("zap-report/zap.json"))
          bad=[a["name"] for s in d.get("site",[]) for a in s.get("alerts",[]) if int(a.get("riskcode",0))>=2]
          print("medium+ alerts:",bad)
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.present == 'true'
        with:
          name: zap-report
          path: zap-report/
          retention-days: 14
