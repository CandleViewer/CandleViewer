name: _job-a11y

# E47-T02: the accessibility gate set (05-accessibility-standard.md section 9),
# run as the single lane that the accessibility CI requirement refers to. Decision logic lives in
# tools/a11y/gates.py: exit 1 = violation (A11Y-G0xx), exit 3 = infrastructure
# error (A11Y-INFRA). Break-glass: CV_A11Y_INFRA_WAIVER_UNTIL (repo variable,
# ISO-8601 UTC, max 24h ahead) waives infra errors only, never violations.
# E05-T03 (#269): the `storybook` job runs beside it and fails the same check: play functions and
# axe per story (CI-A11Y-002), a fail-closed fixture (CI-A11Y-003), a 10 min budget (CI-A11Y-004).
# storybook-nightly.yml sets `storybook_only` to run that job alone on `main` every night; pr.yml
# keeps the default and runs both.

on:
  workflow_call:
    inputs:
      storybook_only:
        description: "Skip the a11y job and run the storybook job alone (storybook-nightly.yml)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  a11y:
    name: a11y
    if: ${{ !inputs.storybook_only }}
    runs-on: ubuntu-latest
    # Two numbers: the 12 min (720 s) PR budget (AC) is MEASURED by the in-step budget
    # gate from after install/build. timeout-minutes is only a backstop above it, since
    # checkout/install/build/browsers also count toward the job clock (#2054).
    # Nightly sweep: a11y-nightly.yml (20 min).
    timeout-minutes: 18
    env:
      CV_A11Y_INFRA_WAIVER_UNTIL: ${{ vars.CV_A11Y_INFRA_WAIVER_UNTIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # #3449: `pnpm install` below runs dependency lifecycle scripts, and no step pushes or
          # fetches: the baseline step reads the PR base's copy from the checkout before it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # #3449: actions/checkout reads the base's copy with the job's token and keeps none, so the
      # step below runs no git and works whether the repository is public or private. Cone mode:
      # the root files and tools/a11y/ only; the step removes the copy before `pnpm install`.
      - name: Check out the PR base's accessibility baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .a11y-base
          sparse-checkout: tools/a11y
          persist-credentials: false

      - name: Baseline changes must cite finding id in PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # First introduction: the baseline file does not exist on base yet -> empty base.
          if [ -f .a11y-base/tools/a11y/axe-baseline.json ]; then
            cp .a11y-base/tools/a11y/axe-baseline.json "$RUNNER_TEMP/base-baseline.json"
          else
            echo '{"entries": []}' > "$RUNNER_TEMP/base-baseline.json"
          fi
          rm -rf .a11y-base
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python -m tools.a11y.gates baseline-pr "$RUNNER_TEMP/base-baseline.json" tools/a11y/axe-baseline.json "$RUNNER_TEMP/pr-body.txt"

      - name: Gate logic meta-tests (injected defect fails, clean passes)
        run: pip install pytest && python -m pytest scripts/tests/test_a11y_gates.py -q

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contrast-token linter (A11Y-C001..C003)
        run: pnpm --filter @candleviewer/ui run contrast:gate

      # vite resolves `@candleviewer/ui/theme.css` and the token CSS to packages/ui's built files,
      # and this job runs pnpm directly, so turbo's `^build` does not build them first (#3272).
      - name: Build the workspace packages apps/web depends on
        run: pnpm --filter "@candleviewer/web^..." run build

      - name: "Guard: the packages apps/web imports are built (fails fast, CI-BUILD-001)"
        run: node tools/ci/check_built_exports.mjs packages/ui packages/chart-engine packages/protocol

      - name: Build web app
        run: pnpm --filter @candleviewer/web run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Collect axe + keyboard + tree + flash (Playwright)
        # Collectors emit JSON/text under reports/a11y/. They fail only when
        # they cannot collect; gates.py decides pass/fail on the content.
        working-directory: apps/web
        run: |
          date +%s > "$RUNNER_TEMP/a11y-start"
          npx playwright test -c e2e/playwright.a11y.config.ts

      - name: Collect Lighthouse scores
        working-directory: apps/web
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          VP=$!
          for _ in $(seq 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 2; done
          node e2e/a11y/lighthouse.collect.mjs || true
          kill $VP

      - name: Evaluate gates (absent collector output = infra error, never green)
        run: |
          set +e
          for g in "axe reports/a11y/axe.json" "lighthouse reports/a11y/lighthouse.json"                    "keyboard reports/a11y/keyboard.json" "flash reports/a11y/flash.json"                    "tree reports/a11y/trees"; do
            set -- $g
            python -m tools.a11y.gates $g | tee -a "$GITHUB_STEP_SUMMARY"
            rc=${PIPESTATUS[0]}
            [ "$rc" -ne 0 ] && fail=$rc
          done
          python -m tools.a11y.gates flash reports/a11y/flash-canvas.json | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${PIPESTATUS[0]}" -ne 0 ] && fail=1
          # Negative fixture: the strobing scene MUST trip the gate, else the gate is blind.
          python -m tools.a11y.gates flash reports/a11y/flash-negative.json > /dev/null
          if [ $? -ne 1 ]; then echo "A11Y-INFRA negative strobe fixture did not trip the flash gate"; fail=1; fi
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/a11y-start") ))
          python -m tools.a11y.gates budget "$elapsed" --limit 720 | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${PIPESTATUS[0]}" -ne 0 ] && fail=1
          exit ${fail:-0}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11y-reports
          path: reports/a11y/
          retention-days: 14

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    # The 10 min (600 s) budget (AC) is measured over the whole job by its last step; timeout-minutes
    # is only the backstop above it. No secret and no write scope (E05 STRIDE B1, B6).
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Start the budget clock
        run: date +%s > "$RUNNER_TEMP/storybook-start"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step after the checkout pushes or fetches, so it keeps no git credentials (#3449).
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the design tokens, then the static Storybook
        run: |
          pnpm --filter @candleviewer/ui run build:tokens
          pnpm --filter @candleviewer/ui run storybook:build

      # packages/ui's playwright is apps/web's (one in the lockfile): the lanes' browser build.
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run play functions and axe on every story (CI-A11Y-002)
        # bash adds pipefail: a summary that cannot read the report, or counts no passed story,
        # sets rc as a red run does.
        shell: bash
        run: |
          report="$GITHUB_WORKSPACE/reports/storybook-a11y"
          set +e
          pnpm --filter @candleviewer/ui run storybook:test --reporter=default --reporter=json \
            --outputFile.json="$report/results.json"
          rc=$?
          set -e
          node packages/ui/scripts/storybook-a11y.mjs summary "$report/results.json" | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          if [ "$rc" -ne 0 ]; then
            echo "::error::CI-A11Y-002 a play function failed or a story has a serious or critical axe violation (the log names the story, the rule and the element), or no story passed: the run broke before any story or skipped them all (docs/ci-runbook.md)"
            exit 1
          fi

      # Fail closed: on `.storybook/__fixtures__/` alone, a 2:1-contrast button must fail the gate.
      - name: "Self-test: the gate fails closed on its fixture (CI-A11Y-003)"
        run: |
          report="$GITHUB_WORKSPACE/reports/storybook-a11y"
          set +e
          CV_STORYBOOK_A11Y_FIXTURES=1 pnpm --filter @candleviewer/ui run storybook:test \
            --reporter=default --reporter=json --outputFile.json="$report/fixtures.json"
          rc=$?
          set -e
          if ! node packages/ui/scripts/storybook-a11y.mjs selftest "$report/fixtures.json" "$rc"; then
            echo "::error::CI-A11Y-003 the a11y gate passed or misreported its low-contrast fixture: it is blind (docs/ci-runbook.md)"
            exit 1
          fi
          echo "- Self-test: the gate failed closed on its 2:1-contrast fixture" >> "$GITHUB_STEP_SUMMARY"

      - name: "Budget: the job finishes within 10 minutes (CI-A11Y-004)"
        run: |
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/storybook-start") ))
          echo "- Storybook job: $elapsed s of its 600 s budget" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 600 ]; then
            echo "::error::CI-A11Y-004 the Storybook job took $elapsed s, over its 600 s budget (docs/ci-runbook.md)"
            exit 1
          fi

      # The a11y report only (each story's axe results). Publishing the static build is not yet
      # scheduled: the E05 threat model's accepted A4 residual (E05-X01, #215).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: storybook-a11y-report
          path: reports/storybook-a11y/
          retention-days: 14
