name: pr

# E03-T01: entry-point workflow for every pull request into `main`.
# ADR-0013-ci-pipeline.md binding rules 1, 2, 5, 6, 7. This workflow only
# computes the change-path filters, runs the always-on and sub-minute gates
# as steps of one `gates` job (#3076), calls the (still-stub) reusable per-lane
# workflows, and resolves the final `ci-required` conclusion. Lane *contents*
# are out of scope here (T02 js, T03 py, T06 contract, T07 security,
# T14 engine-bench) — each reusable workflow below is a `workflow_call` stub
# until its owning ticket fills it in.
#
# CV-ERR codes surfaced by the resolver: CI-GATE-001 (applicable lane not
# successful), CI-GATE-002 (gate misconfiguration: applicable lane skipped),
# CI-GATE-003 (unpinned action / pull_request_target — tools/ci/check_action_pins.py).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changed-paths:
    name: changed-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.filter.outputs.js }}
      py: ${{ steps.filter.outputs.py }}
      engine: ${{ steps.filter.outputs.engine }}
      protocol: ${{ steps.filter.outputs.protocol }}
      infra: ${{ steps.filter.outputs.infra }}
      image: ${{ steps.filter.outputs.image }}
      docs: ${{ steps.filter.outputs.docs }}
      e2e: ${{ steps.filter.outputs.e2e }}
      migrations: ${{ steps.filter.outputs.migrations }}
      rules: ${{ steps.filter.outputs.rules }}
      semgrep: ${{ steps.filter.outputs.semgrep }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            js:
              - 'apps/web/**'
              - 'apps/desktop/**'
              - 'packages/ui/**'
              # Every workspace package the js lane lints, type-checks or tests; security and
              # coverage-thresholds follow js, so these start them too (#3230).
              - 'packages/chart-engine/**'
              - 'packages/protocol/**'
              - 'tools/contrast/**'
              - 'packages/config/**'
              - 'packages/fixtures/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              # packages/ui's token build and token-build tests import these formats (#3182).
              # Turbo's `...[origin/main]` selects no package for them, so those tests skip (#3367).
              - 'tools/style-dictionary/**'
              # The lane's own workflow, Node version (CI-JS-001), its steps' scripts and the
              # postinstall allow-list one of them reads (#3182).
              - '.github/workflows/_job-js.yml'
              - '.nvmrc'
              - '.npmrc' # pnpm's config: every pnpm install reads it
              - 'tools/ci/check-node-version.mjs'
              - 'tools/ci/run-allowed-postinstall.mjs'
              - 'tools/ci/allowed-postinstall.json'
              - 'tools/ci/mark-audit-handoff.mjs'
              - 'tools/ci/turbo-affected-packages.mjs'
              - 'tools/ci/write-turbo-summary.mjs'
              - 'tools/ci/check_built_exports.mjs'
              - 'tools/ci/electron_hardening_gate.py'
              - 'tools/ci/electron_hardening_checks.py'
            py:
              - 'services/api/**'
              # Repo-level Python suites (xstate_contract, perf, load, chaos) are scanned by
              # the same Semgrep/Bandit lane; #1910 slipped past the gate because this
              # filter did not cover them.
              - 'tests/**'
              - 'tools/ci/**'
              - 'scripts/**/*.py'
              - 'infra/grafana/**'
              - 'infra/prometheus/**'
              - 'infra/alertmanager/**'
              # The integration lane boots infra/compose/docker-compose.yml (SR-047 probe,
              # E07-Q04 chaos stack); a compose/healthcheck change must run it (#276).
              - 'infra/compose/**'
              - '.github/workflows/_job-integration.yml'
              # The lint lane (#1964) checks the xstate gate modules; editing them or the
              # py job itself must run the lane (PR #2007 merged with `py` skipped otherwise).
              - '.github/workflows/_job-py.yml'
              - 'docs/research/xstate/gate/run_gate.py'
              - 'docs/research/xstate/gate/_paths.py'
              # The `gates` steps on this filter run tools/statechart/ (xstate-contract's script, event
              # coverage, the suite budget, the machine-hash lock): editing one starts them (#3104).
              - 'tools/statechart/**'
              # The tests that pin xstate-nightly.yml (#2807) run in this lane; a PR that edits
              # only the workflow must run them (#2963).
              - '.github/workflows/xstate-nightly.yml'
              # The statechart-lint step's script, the a11y gate logic the security lane scans, the
              # corpora and account pack the suites and cvdev read, and coverage-thresholds' job
              # (its gate scripts are under tools/ci/**) (#3182).
              - 'tools/lint_statecharts.py'
              - 'tools/a11y/**/*.py'
              - 'packages/fixtures/**'
              - '.github/workflows/_job-coverage.yml'
            engine:
              - 'packages/chart-engine/**'
              # The engine-bench job, its Node version, install script and allow-list (#3182).
              - '.github/workflows/_job-engine-bench.yml'
              - '.nvmrc'
              - 'tools/ci/run-allowed-postinstall.mjs'
              - 'tools/ci/allowed-postinstall.json'
            protocol:
              - 'packages/protocol/**'
              - 'docs/plan/22-api-openapi.yaml'
              - 'docs/plan/23-ws-protocol.md'
              # The contract job, its `make contracts` recipe and the recipe's scripts (#3182).
              - '.github/workflows/_job-contract.yml'
              - '.npmrc' # pnpm's config: every pnpm install reads it
              - 'Makefile'
              - 'tools/contracts/**'
              - 'tools/errorcodes/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'
              - 'docker-compose*.yml'
              - 'Dockerfile*'
              # The scripts the pin-check gates step runs (#3182).
              - 'tools/ci/check_action_pins.py'
              - 'tools/ci/resolve_image_digests.py'
              # The CodeQL config the security lane hands codeql-action/init (#3182).
              - '.github/codeql/**'
            image:
              - 'infra/images/**'
              - 'services/api/pyproject.toml'
              - 'services/api/uv.lock'
              - '.github/workflows/_job-security.yml'
              # #2893: the dev-only fence and its image check (ADR-0036), so a PR that touches
              # either runs the boot smoke before merge, not only main.yml's check before the push.
              # settings.py holds the fixture gate and app.py calls the wiring: the probe boots both.
              - 'services/api/cvdev/**'
              - 'services/api/candleviewer/account_fixture_wiring.py'
              - 'services/api/candleviewer/settings.py'
              - 'services/api/candleviewer/app.py'
              - 'tools/ci/check_image_no_dev_modules.py'
            docs:
              - 'docs/**'
              - '**/*.md'
            e2e:
              - 'apps/web/**'
              - 'apps/desktop/**'
              - 'packages/chart-engine/**'
              - 'packages/protocol/**'
              # The a11y job runs on this filter too: the design system (its Storybook included),
              # the contrast gate and its token formats, the axe baseline and gates, the job and its
              # meta-tests (#3175).
              - 'packages/ui/**'
              - 'tools/contrast/**'
              - 'tools/style-dictionary/**'
              - 'tools/a11y/**'
              - '.github/workflows/_job-a11y.yml'
              - 'scripts/tests/test_a11y_gates.py'
              # The e2e job and the guards its steps run (#3182). Dependency manifests stay out:
              # the nightly a11y sweep is their accepted control (docs/ci-runbook.md section 2).
              - '.github/workflows/_job-e2e.yml'
              - '.npmrc' # pnpm's config: every pnpm install reads it
              - 'tools/ci/check_demo_rest_only_tag.mjs'
              - 'tools/ci/check_built_exports.mjs'
            rules:
              - 'services/api/candleviewer/rules/ir/**'
              - 'services/api/candleviewer/rules/compiler/**'
              - 'services/api/candleviewer/rules/errors.py'
              - 'services/api/tests/rules/roundtrip/**'
              - 'services/api/tests/fixtures/rule_corpus/**'
              - '.github/workflows/_job-rule-roundtrip.yml'
            migrations:
              - 'services/api/candleviewer/migrations/**'
              - 'services/api/candleviewer/db/**'
              - 'services/api/**/models.py'
              - 'services/api/alembic.ini'
              - 'tools/ci/verify_migration_lockfile.py'
              - 'tools/ci/migration_lint.py'
              - 'tools/ci/security-sensitive-tables.txt' # migration_lint.py's CI-MIG-006 list
              - 'tools/ci/run_previous_release_upgrade.py'
              - 'infra/scripts/pg_bootstrap.sql'
              - '.github/workflows/_job-migrations.yml'
            semgrep:
              # What the Semgrep rule-test checker and the product scan read: a PR that edits
              # only a rule, a fixture or the ignore file must still run `security` (#2915).
              - '.semgrep/**'
              - '.semgrep-fixtures/**'
              - '.semgrepignore'
              - 'security/semgrep/**'
              - 'tools/ci/check_semgrep_rule_tests.py'
              # The other security jobs' inputs: gitleaks and trufflehog configs, risk register,
              # freeze manifest, the dev-env files the hygiene gate checks, pip pins (#3182).
              - '.gitleaks.toml'
              - '.trufflehog-exclude'
              - 'security/accepted-risks.yaml'
              - 'security/freeze-manifest.sha256'
              - '.gitignore'
              - '.env.example'
              - 'scripts/requirements-ci.txt'

  # --- Gates (#3076): one step per always-on or sub-minute gate. A step's id is its
  # `ci-required` lane and `gates` exports its outcome under it, so each gate is judged as its
  # old job was. Tree-reading gates run first; installers (PR build/lifecycle scripts) last.
  gates:
    name: gates
    needs: changed-paths
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45 # under the steps' sum: a hang cancels later gates, failing their lanes
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
    outputs:
      spike-containment: ${{ steps.spike-containment.outcome }}
      changelog-fragment: ${{ steps.changelog-fragment.outcome }}
      licence-header: ${{ steps.licence-header.outcome }}
      docs-link-check: ${{ steps.docs-link-check.outcome }}
      pin-check: ${{ steps.pin-check.outcome }}
      statechart-lint: ${{ steps.statechart-lint.outcome }}
      event-coverage: ${{ steps.event-coverage.outcome }}
      xstate-pin-attestation: ${{ steps.xstate-pin-attestation.outcome }}
      machine-hash-lock: ${{ steps.machine-hash-lock.outcome }}
      xstate-contract: ${{ steps.xstate-contract.outcome }}
      commitlint: ${{ steps.commitlint.outcome }}
      gen: ${{ steps.gen.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint and docs-link-check read history
          persist-credentials: false # no gate pushes or fetches after checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: spike-containment (E06-X02, CI-SPIKE-001/002)
        id: spike-containment
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python tools/ci/check_spike_containment.py --root .
      - name: changelog-fragment (E03-T11, CI-REL-001)
        id: changelog-fragment
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/ci/check_changelog_fragment.py --title "$PR_TITLE" --body "$PR_BODY"
      - name: licence-header
        id: licence-header
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/check_licence_headers.py
      - name: docs-link-check (GOV-002)
        id: docs-link-check
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/check_rule_refs.py
      - name: pin-check (SR-132; CI-GATE-003, CI-IMG-002)
        id: pin-check
        if: ${{ !cancelled() && needs.changed-paths.outputs.infra == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python tools/ci/check_action_pins.py .github/workflows
          python tools/ci/resolve_image_digests.py --check
      - name: statechart-lint (E50-T11; the CV lint set, then the fixtures proving each rule fires)
        id: statechart-lint
        if: ${{ !cancelled() && needs.changed-paths.outputs.py == 'true' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
        run: |
          python -m pip install --quiet pytest
          python -m py_compile tools/lint_statecharts.py
          python tools/lint_statecharts.py
          python -m pytest tests/lint_statecharts -q
      - name: event-coverage (E50-T05, MUST-10)
        id: event-coverage
        if: ${{ !cancelled() && needs.changed-paths.outputs.py == 'true' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
        run: |
          python -m pip install --quiet pytest
          python tools/statechart/event_coverage.py
          python -m pytest scripts/tests/test_event_coverage.py -q -W error::RuntimeWarning
      - name: xstate-pin-attestation (E50-T57; exact pin, wheel sha256, PEP 740 attestation)
        id: xstate-pin-attestation
        if: ${{ !cancelled() && needs.changed-paths.outputs.py == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          XSTATE_VERSION: "0.9.1"
          XSTATE_WHEEL: "xstate_statemachine-0.9.1-py3-none-any.whl"
          XSTATE_WHEEL_SHA256: "d832d4d9a17b7b8003f61fa0714a8e57eaff316bcd5dd699d81d410362687162"
          XSTATE_REPO: "basiltt/xstate-statemachine"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/ci/check_pin.py --root .
          python -m pip download --no-deps "xstate-statemachine==${XSTATE_VERSION}" -d /tmp/xstate-pin
          (cd /tmp/xstate-pin && echo "${XSTATE_WHEEL_SHA256}  ${XSTATE_WHEEL}" > expected.sha256 && sha256sum -c expected.sha256)
          python -m pip install --quiet pypi-attestations && python -m pypi_attestations verify pypi --repository "https://github.com/${XSTATE_REPO}" "pypi:${XSTATE_WHEEL}" ||
            gh attestation verify "/tmp/xstate-pin/${XSTATE_WHEEL}" --repo "${XSTATE_REPO}" # fallback
      - name: Install uv (cache keyed on uv.lock)
        if: ${{ !cancelled() && needs.changed-paths.outputs.py == 'true' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"
      - name: machine-hash-lock (E50-T02; the registry imports the runtime, so uv sync is part of it)
        id: machine-hash-lock
        if: ${{ !cancelled() && needs.changed-paths.outputs.py == 'true' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
        run: |
          (cd services/api && uv sync --frozen --all-groups)
          uv run --project services/api python tools/statechart/check_machine_hash_lock.py
          cd services/api && uv run pytest tests/xstate_contract/test_golden_upcaster.py -q --no-cov -W error::RuntimeWarning
      # E50-T31's blocking contract gate (29 §1.7). The script is its single definition and also
      # runs nightly through _job-xstate-contract.yml; Python 3.12 from the setup-uv step above.
      - name: xstate-contract (E50-T31; tools/statechart/run_xstate_contract.sh, as the nightly)
        id: xstate-contract
        if: ${{ !cancelled() && needs.changed-paths.outputs.py == 'true' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
        run: bash tools/statechart/run_xstate_contract.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: "20"
      - name: commitlint (Conventional Commits, 01-sdlc-and-branching.md §6)
        id: commitlint
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate
          pnpm install --frozen-lockfile --filter . --prod=false
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      # E03-T05: generated-code freshness (ADR-0013 rule 3), last: its full install runs the PR's
      # build scripts. Clean as its old job: no pnpm or turbo cache, and no earlier step writes a
      # generated path. Its venv keeps `pnpm generate` on a bare 3.13 + PyYAML (py gates install
      # pytest and pypi-attestations into setup-python's interpreter).
      - name: gen (E03-T05; tools/ci/check_gen_freshness.py, CI-GEN-001..004)
        id: gen
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.5.1 --activate
          pnpm install --frozen-lockfile
          python -m venv "$RUNNER_TEMP/gen-venv"
          export PATH="$RUNNER_TEMP/gen-venv/bin:$PATH"
          python -m pip install --quiet -c scripts/requirements-ci.txt PyYAML
          python tools/ci/check_gen_freshness.py || {
            {
              echo "### Generated-code freshness gate failed"
              echo ""
              echo "Reproduce locally:"
              echo '```'
              echo "make gen"
              echo "git diff -- packages/protocol"
              echo "git status --porcelain -- packages/protocol"
              echo '```'
              echo ""
              echo "See the \`gen\` step log of the \`gates\` job for the CI-GEN-* code and diff."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      # `ci-required` reads each gate's own outcome; this keeps the gates job's own result honest.
      - name: Verdict (every gate succeeded or was skipped)
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        shell: python
        run: |
          import json, os
          outcomes = {gate: step["outcome"] for gate, step in json.loads(os.environ["OUTCOMES"]).items()}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("| gate | outcome |\n| --- | --- |\n")
              summary.writelines(f"| {gate} | {outcome} |\n" for gate, outcome in outcomes.items())
          failed = [gate for gate, outcome in outcomes.items() if outcome not in ("success", "skipped")]
          raise SystemExit(f"gates not successful: {', '.join(failed)}" if failed else 0)

  # --- Path-filtered lanes ---------------------------------------------------
  # Each callee is a `workflow_call` stub in this Task (echoes a placeholder
  # conclusion); its owning ticket replaces the body without changing this
  # call site or its `if:` condition. `secrets: inherit` is intentionally
  # omitted (ADR-0013 rule 6): PR workflows receive no secrets.

  js:
    name: js
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.js == 'true' }}
    uses: ./.github/workflows/_job-js.yml

  py:
    name: py
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.py == 'true' }}
    uses: ./.github/workflows/_job-py.yml

  # Mirrors the `py` lane (import-linter runs in py-checks), beside coverage-thresholds (#3076).
  architecture:
    name: architecture
    needs: [changed-paths, py]
    if: ${{ always() && needs.changed-paths.outputs.py == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reflect the py lane's result (its py-checks job runs the architecture contract)
        run: |
          [ "${{ needs.py.result }}" = "success" ] || { echo "py lane (it runs the import-linter architecture contract) did not succeed"; exit 1; }

  # E35-Q02: rule IR round-trip gate (corpus goldens + mutation check + 10 000-doc property run).
  rule-roundtrip:
    name: rule-roundtrip
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.rules == 'true' }}
    uses: ./.github/workflows/_job-rule-roundtrip.yml

  contract:
    name: contract
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.protocol == 'true' }}
    uses: ./.github/workflows/_job-contract.yml

  integration:
    name: integration
    needs: changed-paths
    # Integration exercises services/api's fixture-driven pipeline + OMS suite;
    # applicable whenever backend code, tooling or fixtures change.
    if: ${{ needs.changed-paths.outputs.py == 'true' }}
    uses: ./.github/workflows/_job-integration.yml
  migrations:
    name: migrations
    needs: changed-paths
    # E03-T10 base gate (single-head/drift/expand-contract/upgrade-path) plus
    # bugfix #1556 (E07-T02 / #168 defect 1) additions: timing budget,
    # lockfile integrity, cv_app privilege matrix. Applicable whenever a
    # migration revision file, models.py or the migration tooling changes.
    if: ${{ needs.changed-paths.outputs.migrations == 'true' }}
    uses: ./.github/workflows/_job-migrations.yml

  security:
    name: security
    needs: changed-paths
    # Security scanning applies to any code/infra change, not just one lane, and to a change that
    # touches only the Semgrep rules, fixtures or ignore file the scan reads (#2915). The
    # `ci-required` resolver below restates this condition: change both together.
    if: ${{ needs.changed-paths.outputs.js == 'true' || needs.changed-paths.outputs.py == 'true' || needs.changed-paths.outputs.infra == 'true' || needs.changed-paths.outputs.semgrep == 'true' }}
    with:
      image_changed: ${{ needs.changed-paths.outputs.image == 'true' }}
    # A called reusable workflow may only use permissions its caller job grants.
    # _job-security.yml uploads SARIF (security-events: write); granting it here
    # keeps the workflow-level default at contents: read for every other lane.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_job-security.yml

  e2e:
    name: e2e
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.e2e == 'true' }}
    uses: ./.github/workflows/_job-e2e.yml

  a11y:
    name: a11y
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.e2e == 'true' }}
    uses: ./.github/workflows/_job-a11y.yml

  engine-bench:
    name: engine-bench
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.engine == 'true' || needs.changed-paths.outputs.protocol == 'true' }}
    uses: ./.github/workflows/_job-engine-bench.yml

  coverage-thresholds:
    name: coverage-thresholds
    # E03-T04: runs whenever any lane that produces a coverage artifact ran,
    # so the gate sees every report that could have changed (a py-only PR
    # still needs its services/api number checked; a js-only PR its
    # frontend/engine packages).
    needs: [changed-paths, js, py]
    if: ${{ always() && (needs.changed-paths.outputs.js == 'true' || needs.changed-paths.outputs.py == 'true') }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_job-coverage.yml
    with:
      # Only lanes that actually ran can have produced an artifact; the gate
      # marks the others N/A instead of failing on a missing report.
      ran_lanes: ${{ format('{0}{1}', needs.changed-paths.outputs.py == 'true' && 'py,' || '', needs.changed-paths.outputs.js == 'true' && 'js' || '') }}

  # --- Gate resolver (ADR-0013 binding rule 2) -------------------------------

  ci-required:
    name: ci-required
    if: always()
    needs:
      - changed-paths
      - gates
      - js
      - py
      - architecture
      - rule-roundtrip
      - contract
      - integration
      - migrations
      - security
      - e2e
      - a11y
      - engine-bench
      - coverage-thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Resolve ci-required conclusion
        env:
          FILTER_JS: ${{ needs.changed-paths.outputs.js }}
          FILTER_PY: ${{ needs.changed-paths.outputs.py }}
          FILTER_MIGRATIONS: ${{ needs.changed-paths.outputs.migrations }}
          FILTER_PROTOCOL: ${{ needs.changed-paths.outputs.protocol }}
          FILTER_INFRA: ${{ needs.changed-paths.outputs.infra }}
          FILTER_E2E: ${{ needs.changed-paths.outputs.e2e }}
          FILTER_ENGINE: ${{ needs.changed-paths.outputs.engine }}
          FILTER_RULES: ${{ needs.changed-paths.outputs.rules }}
          FILTER_SEMGREP: ${{ needs.changed-paths.outputs.semgrep }}
          RESULT_CHANGED_PATHS: ${{ needs.changed-paths.result }}
          RESULT_GATES: ${{ needs.gates.result }}
          RESULT_PIN_CHECK: ${{ needs.gates.outputs.pin-check }}
          RESULT_SPIKE_CONTAINMENT: ${{ needs.gates.outputs.spike-containment }}
          RESULT_COMMITLINT: ${{ needs.gates.outputs.commitlint }}
          RESULT_CHANGELOG_FRAGMENT: ${{ needs.gates.outputs.changelog-fragment }}
          RESULT_LICENCE_HEADER: ${{ needs.gates.outputs.licence-header }}
          RESULT_DOCS_LINK_CHECK: ${{ needs.gates.outputs.docs-link-check }}
          RESULT_GEN: ${{ needs.gates.outputs.gen }}
          RESULT_JS: ${{ needs.js.result }}
          RESULT_PY: ${{ needs.py.result }}
          RESULT_ARCHITECTURE: ${{ needs.architecture.result }}
          RESULT_RULE_ROUNDTRIP: ${{ needs.rule-roundtrip.result }}
          RESULT_STATECHART_LINT: ${{ needs.gates.outputs.statechart-lint }}
          RESULT_MACHINE_HASH_LOCK: ${{ needs.gates.outputs.machine-hash-lock }}
          RESULT_XSTATE_CONTRACT: ${{ needs.gates.outputs.xstate-contract }}
          RESULT_EVENT_COVERAGE: ${{ needs.gates.outputs.event-coverage }}
          RESULT_XSTATE_PIN_ATTESTATION: ${{ needs.gates.outputs.xstate-pin-attestation }}
          RESULT_CONTRACT: ${{ needs.contract.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          RESULT_MIGRATIONS: ${{ needs.migrations.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
          RESULT_A11Y: ${{ needs.a11y.result }}
          RESULT_ENGINE_BENCH: ${{ needs.engine-bench.result }}
          RESULT_COVERAGE_THRESHOLDS: ${{ needs.coverage-thresholds.result }}
        run: |
          node scripts/ci_gate_resolver.mjs "$(node -e '
            const isTrue = (v) => v === "true";
            const lanes = {
              "changed-paths": { applicable: true, result: process.env.RESULT_CHANGED_PATHS },
              gates: { applicable: true, result: process.env.RESULT_GATES },
              "pin-check": { applicable: isTrue(process.env.FILTER_INFRA), result: process.env.RESULT_PIN_CHECK },
              "spike-containment": { applicable: true, result: process.env.RESULT_SPIKE_CONTAINMENT },
              commitlint: { applicable: true, result: process.env.RESULT_COMMITLINT },
              "changelog-fragment": { applicable: true, result: process.env.RESULT_CHANGELOG_FRAGMENT },
              "licence-header": { applicable: true, result: process.env.RESULT_LICENCE_HEADER },
              "docs-link-check": { applicable: true, result: process.env.RESULT_DOCS_LINK_CHECK },
              gen: { applicable: true, result: process.env.RESULT_GEN },
              js: { applicable: isTrue(process.env.FILTER_JS), result: process.env.RESULT_JS },
              py: { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_PY },
              architecture: { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_ARCHITECTURE },
              "rule-roundtrip": { applicable: isTrue(process.env.FILTER_RULES), result: process.env.RESULT_RULE_ROUNDTRIP },
              "statechart-lint": { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_STATECHART_LINT },
              "machine-hash-lock": { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_MACHINE_HASH_LOCK },
              "xstate-contract": { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_XSTATE_CONTRACT },
              "event-coverage": { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_EVENT_COVERAGE },
              "xstate-pin-attestation": { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_XSTATE_PIN_ATTESTATION },
              contract: { applicable: isTrue(process.env.FILTER_PROTOCOL), result: process.env.RESULT_CONTRACT },
              integration: { applicable: isTrue(process.env.FILTER_PY), result: process.env.RESULT_INTEGRATION },
              migrations: { applicable: isTrue(process.env.FILTER_MIGRATIONS), result: process.env.RESULT_MIGRATIONS },
              security: {
                applicable: isTrue(process.env.FILTER_JS) || isTrue(process.env.FILTER_PY) || isTrue(process.env.FILTER_INFRA) || isTrue(process.env.FILTER_SEMGREP),
                result: process.env.RESULT_SECURITY,
              },
              e2e: { applicable: isTrue(process.env.FILTER_E2E), result: process.env.RESULT_E2E },
              a11y: { applicable: isTrue(process.env.FILTER_E2E), result: process.env.RESULT_A11Y },
              "engine-bench": { applicable: isTrue(process.env.FILTER_ENGINE) || isTrue(process.env.FILTER_PROTOCOL), result: process.env.RESULT_ENGINE_BENCH },
              "coverage-thresholds": {
                applicable: isTrue(process.env.FILTER_JS) || isTrue(process.env.FILTER_PY),
                result: process.env.RESULT_COVERAGE_THRESHOLDS,
              },
            };
            console.log(JSON.stringify(lanes));
          ')"
