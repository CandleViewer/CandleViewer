name: dast-rules-nightly

# E35-X02: the nightly low-privilege OWASP ZAP scan of the /rules* surface (plan:
# .zap/rules-low-priv.yaml), authenticated as a synthetic rules:read-only Viewer on a throwaway
# stack (_dast-low-priv.yml, #3991). Gate: the scan stays signed in, and no High/Medium alert
# outside .zap/rules-low-priv-baseline.json. Nightly and by hand, never per-PR; never a live
# exchange; no repository secret.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap-rules:
    uses: ./.github/workflows/_dast-low-priv.yml
    with:
      profile: rules
      report: rules-viewer
      baseline: .zap/rules-low-priv-baseline.json
      artifact: zap-rules-low-priv
