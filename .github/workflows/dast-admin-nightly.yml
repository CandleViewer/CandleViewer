name: dast-admin-nightly

# E42-X03 (#1026, AC5): the ZAP admin profile, nightly at 03:27 UTC and on dispatch, never on a
# pull request. A synthetic user signs in only with CV_STORAGE_BACKEND=real (app.build_auth_service),
# which boots since #3915 (#3874) composed the real Postgres, QuestDB and Parquet clients into
# StorageService.
# It scans the admin surface authenticated as a synthetic Manager and a synthetic Viewer, each
# with a real TOTP method and no MFA exception, against a throwaway stack on this runner (a run
# against real staging needs the owner's runner, environment and users: the PR's Deviations).
# Phase A sends each role one request per /admin* and /users* operation matrix.yaml refuses it;
# "Every refusal planned and in the audit log" (check_admin_denials.py) requires the planned
# status and the request's own denial record, and fails on any CSRF refusal. The Owner, signed in
# with no step-up, sends phase A's fixed purge refusals (security/zap/owner-purge-denials.yaml,
# E16-X02): each a 403 with its own `retention.purge` denial record. Phase B is the
# passive and active scan; "The scans stayed signed in, and no new medium+ alert" requires the
# session to stay authenticated (check_liveness.py) and no alert outside the baseline
# (baseline_gate.py). Every role runs before a phase fails. The zap-admin-surface artefact holds
# the plans, ZAP's logs and reports and the API's log, uploaded only if no session value of the
# run, and none of the passwords, keys and TOTP secrets it generated, reached them
# (check_artefact_secrets.py).
# Every credential is made here, per run, masked and never echoed: no repository secret is read,
# and the target is loopback, never an input (admin_requests.py and mint_sessions.py refuse any
# other). A red run on main comments on, or opens, the signal's issue (_nightly-issue.yml, #1849);
# a dispatch on a branch files nothing.
on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# No workflow-level concurrency group (#3449): the report job's per-signal group serialises filing.
jobs:
  zap-admin:
    name: zap-admin
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ZAP_TARGET: http://127.0.0.1:8000
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
      WORK: zap-work
      # Compose checks every service's variables on each command; these stores never start here.
      GF_SECURITY_ADMIN_PASSWORD: unused-ci
      MINIO_ROOT_PASSWORD: unused-ci
      CV_ALERT_PAGE_WEBHOOK_URL: http://127.0.0.1:1/unused
      CV_ALERT_TICKET_WEBHOOK_URL: http://127.0.0.1:1/unused
      CV_ALERT_DEADMAN_URL: http://127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: Make this run's synthetic credentials (masked, never echoed)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK" "$RUNNER_TEMP/cv" "$RUNNER_TEMP/cv-lane"
          secret() { v=$(openssl rand -hex 32); echo "::add-mask::$v"; echo "$1=$v" >> "$GITHUB_ENV"; }
          for name in POSTGRES_PASSWORD CV_AUTH_PEPPER CV_AUTH_TOTP_KEY_HEX \
            CV_AUTH_RECOVERY_HMAC_KEY_HEX CV_AUTH_CSRF_KEY_HEX ZAP_OWNER_PASSWORD \
            ZAP_MANAGER_PASSWORD ZAP_VIEWER_PASSWORD; do secret "$name"; done
          suffix=$(openssl rand -hex 4)
          for role in owner manager viewer; do echo "ZAP_${role^^}_USER=zap-$role-$suffix" >> "$GITHUB_ENV"; done
          # The audit lane key (ADR-0037 decision 6): 64 hex digits in a file of mode 0400, in a
          # directory of its own: the settings refuse a backup root in, or around, the key's directory.
          (umask 277 && openssl rand -hex 32 > "$RUNNER_TEMP/cv-lane/lane.key")

      - name: Start Postgres and QuestDB (the compose data stores, loopback only)
        run: docker compose -f infra/compose/docker-compose.yml --profile core up -d --wait postgres questdb

      - name: Migrate, then seed the Owner the owner floor needs and the two synthetic users (testnet)
        working-directory: services/api
        env:
          CV_ENVIRONMENT: testnet
        run: |
          set -euo pipefail
          export CV_PG_DSN="postgresql+asyncpg://cv:${POSTGRES_PASSWORD}@127.0.0.1:5432/candleviewer"
          uv sync --frozen
          uv run --frozen alembic upgrade head
          # The owner floor refuses a user while no active Owner exists. This one signs in, with
          # TOTP and no step-up, only for phase A's fixed purge refusals; it never scans.
          CV_SEED_USERNAME="$ZAP_OWNER_USER" CV_SEED_PASSWORD="$ZAP_OWNER_PASSWORD" \
            uv run --frozen python scripts/seed_fixture_user.py \
            --totp-secret-out "$RUNNER_TEMP/cv/owner.totp"
          for role in manager viewer; do
            user="ZAP_${role^^}_USER" password="ZAP_${role^^}_PASSWORD"
            CV_SEED_USERNAME="${!user}" CV_SEED_PASSWORD="${!password}" \
              uv run --frozen python scripts/seed_fixture_user.py --role "$role" \
              --totp-secret-out "$RUNNER_TEMP/cv/$role.totp"
          done

      - name: Start the API (testnet, real storage backend, loopback)
        working-directory: services/api
        env:
          CV_ENVIRONMENT: testnet
          CV_STORAGE_BACKEND: real
          CV_FEED: synthetic
          # The API runs on the host, outside the compose network: QuestDB is its loopback ports.
          CV_QUESTDB_PG: 127.0.0.1:8812
          CV_QUESTDB_ILP: 127.0.0.1:9009
          CV_BIND_HOST: 127.0.0.1
          CV_BIND_PORT: "8000"
          CV_METRICS_BIND: 127.0.0.1:9108
        run: |
          set -euo pipefail
          export CV_PG_DSN="postgresql+asyncpg://cv:${POSTGRES_PASSWORD}@127.0.0.1:5432/candleviewer"
          export CV_AUDIT_LANE_KEY_FILE="$RUNNER_TEMP/cv-lane/lane.key"
          export CV_AUDIT_WAL_PATH="$RUNNER_TEMP/cv/audit/audit.wal"
          export CV_PARQUET_ROOT="$RUNNER_TEMP/cv/data/parquet" CV_BACKUP_ROOT="$RUNNER_TEMP/cv/data/backups"
          # The cold tier and the recorder need the Parquet root to exist and be writable at boot.
          mkdir -p -m 700 "$RUNNER_TEMP/cv/audit" "$RUNNER_TEMP/cv/data" "$CV_PARQUET_ROOT" "$CV_BACKUP_ROOT"
          # A native crash leaves no Python traceback: the fault handler prints one.
          PYTHONFAULTHANDLER=1 nohup uv run --frozen python -m candleviewer.server > "$RUNNER_TEMP/cv/api.log" 2>&1 &
          api=$!
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null "$ZAP_TARGET/healthz"; then exit 0; fi
            kill -0 "$api" 2>/dev/null || break # it exited: stop waiting
            sleep 2
          done
          if kill -0 "$api" 2>/dev/null; then
            state="still running, not answering" # it has no exit code to report
          else
            code=0
            wait "$api" || code=$?
            state="exit ${code}"
          fi
          echo "::error title=zap-admin::the API did not answer /healthz (${state}); the last of its log follows"
          tail -n 200 "$RUNNER_TEMP/cv/api.log"
          exit 1

      - name: Plan each role's denials and scan (admin_requests.py, from matrix.yaml)
        run: uv run --frozen --project services/api python security/zap/admin_requests.py --target "$ZAP_TARGET" --out "$WORK"

      - name: Phase A, the denials, as each role
        run: |
          set -uo pipefail
          mkdir -p zap-reports && chmod a+rwx zap-reports "$WORK" # the image runs as its own user
          rc=0
          for role in owner manager viewer; do # every role runs, then the step fails
            user="ZAP_${role^^}_USER" envfile="$RUNNER_TEMP/cv/$role-denials.env"
            { python3 security/zap/mint_sessions.py --target "$ZAP_TARGET" --username "${!user}" \
                --password-env "ZAP_${role^^}_PASSWORD" --totp-secret-file "$RUNNER_TEMP/cv/$role.totp" \
                --out "$envfile" &&
              docker run --rm --network host --env-file "$envfile" -e ZAP_TARGET \
                -v "$PWD:/zap/wrk:rw" "$ZAP_IMAGE" zap.sh -cmd -silent -autorun "/zap/wrk/$WORK/$role-denials.yaml" \
                2>&1 | tee "$WORK/$role-denials.log"; } || rc=1
          done
          exit "$rc"

      - name: Every refusal planned and in the audit log (check_admin_denials.py)
        run: |
          set -euo pipefail
          query="SELECT coalesce(json_agg(json_build_object('username', u.username,
            'request_id', a.request_id, 'action', a.action, 'outcome', a.outcome)), '[]')
            FROM audit_log a JOIN users u ON u.id = a.actor_user_id
            WHERE u.username IN ('$ZAP_OWNER_USER', '$ZAP_MANAGER_USER', '$ZAP_VIEWER_USER')"
          docker compose -f infra/compose/docker-compose.yml --profile core exec -T postgres \
            psql -U cv -d candleviewer -v ON_ERROR_STOP=1 -qAt \
            -c "SET default_transaction_read_only = on" -c "$query" > "$WORK/audit-rows.json"
          python3 security/zap/check_admin_denials.py --dir "$WORK" --audit "$WORK/audit-rows.json" \
            --user "owner=$ZAP_OWNER_USER" --user "manager=$ZAP_MANAGER_USER" \
            --user "viewer=$ZAP_VIEWER_USER" \
            --api-log "$RUNNER_TEMP/cv/api.log"

      - name: Phase B, the passive and active scan, as each role
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          rc=0
          for role in manager viewer; do # a fresh session each: a bearer lives 12 minutes
            user="ZAP_${role^^}_USER" envfile="$RUNNER_TEMP/cv/$role-scan.env"
            { python3 security/zap/mint_sessions.py --target "$ZAP_TARGET" --username "${!user}" \
                --password-env "ZAP_${role^^}_PASSWORD" --totp-secret-file "$RUNNER_TEMP/cv/$role.totp" \
                --out "$envfile" &&
              docker run --name "zap-$role-scan" --network host --env-file "$envfile" -e ZAP_TARGET \
                -v "$PWD:/zap/wrk:rw" "$ZAP_IMAGE" zap.sh -cmd -silent -autorun "/zap/wrk/$WORK/$role-scan.yaml" \
                2>&1 | tee "$WORK/$role-scan.log"; } || rc=1
            # ZAP's own log (its errors and insights), not its session: the scrub checks it too.
            docker cp "zap-$role-scan:/home/zap/.ZAP/zap.log" "$WORK/$role-scan-zap.log" || rc=1
            docker rm -f "zap-$role-scan" > /dev/null || true
          done
          exit "$rc"

      - name: The scans stayed signed in, and no new medium+ alert
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          rc=0
          for role in manager viewer; do # both roles are checked, then the step fails
            # The plan's three requestors ran: the refused-page probe and both GET /me, each with
            # its planned status (no "lost authentication").
            python3 security/zap/check_liveness.py --requestors 3 "$WORK/$role-scan.log" "zap-reports/admin-surface-$role.json" || rc=1
            python3 security/zap/baseline_gate.py "zap-reports/admin-surface-$role.json" .zap/admin-surface-baseline.json || rc=1
          done
          exit "$rc"

      - name: Keep the API's log with the plans and reports
        if: always()
        run: |
          mkdir -p "$WORK"
          if [ -f "$RUNNER_TEMP/cv/api.log" ]; then cp "$RUNNER_TEMP/cv/api.log" "$WORK/api.log"; fi

      - name: No session value in the plans, logs or reports (else nothing is uploaded)
        id: scrub
        if: always()
        # The session values of the env files, then each secret this run made: its passwords,
        # pepper and keys (in $GITHUB_ENV since the first step; only their names are passed), the
        # TOTP seeds seed_fixture_user.py wrote and the audit lane key.
        run: |
          python3 security/zap/check_artefact_secrets.py --env-dir "$RUNNER_TEMP/cv" \
            --env ZAP_OWNER_PASSWORD --env ZAP_MANAGER_PASSWORD --env ZAP_VIEWER_PASSWORD \
            --env POSTGRES_PASSWORD --env CV_AUTH_PEPPER --env CV_AUTH_TOTP_KEY_HEX \
            --env CV_AUTH_RECOVERY_HMAC_KEY_HEX --env CV_AUTH_CSRF_KEY_HEX \
            --secret-file "$RUNNER_TEMP/cv/*.totp" --secret-file "$RUNNER_TEMP/cv-lane/lane.key" \
            "$WORK" zap-reports

      - name: Upload the plans, logs and reports (the sessions in them died with the stack)
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-admin-surface
          path: |
            zap-work/
            zap-reports/
          retention-days: 14

      - name: Tear down
        if: always()
        # A scan container `docker rm` could not remove holds ZAP's session store: it goes too.
        run: |
          docker rm -f zap-manager-scan zap-viewer-scan > /dev/null 2>&1 || true
          docker compose -f infra/compose/docker-compose.yml --profile core down -v || true

  report:
    needs: zap-admin
    # A dispatch on a branch (an experiment) files nothing: only main's nightly is the signal.
    if: ${{ always() && needs.zap-admin.result == 'failure' && github.ref == 'refs/heads/main' }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-issue.yml
    with:
      signal: dast-admin
      title-prefix: "security: dast-admin-nightly failed"
      labels: security,area/accounts-admin
      body: "dast-admin-nightly (E42-X03, the ZAP admin profile) failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Artifact: zap-admin-surface. Triage each finding like any security finding: severity, disposition, remediation."
