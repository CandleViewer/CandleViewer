name: changelog

# Read-only preview of CHANGELOG.md's `## Unreleased` section (07-release-and-prr.md §3,
# job summary). It never commits: `main` is protected (C-4.1), and the old bot push to `main`
# failed with GH006 on 288+ runs from 2026-10-01 (#2341). CHANGELOG.md changes only through
# reviewed PRs (sync command: AGENTS.md §4). Supersedes E03-T11 scenario 1 and the E03-T13
# bypass note. On a PR it previews the base history against the PR's CHANGELOG.md. Read-only
# contents, no secrets and no artefact, so no ref guard.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - CHANGELOG.md
      - .github/workflows/changelog.yml
      - tools/ci/changelog_lib.py
      - tools/ci/update_changelog.py
      - tools/ci/finalize_changelog.py
      - tools/ci/collect_commits.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-preview:
    name: changelog-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Preview the Unreleased section (writes nothing)
        env:
          REV: ${{ github.event.pull_request.base.sha || github.sha }}
        run: >-
          python tools/ci/update_changelog.py --since-last-tag --rev "$REV"
          --preview --summary "$GITHUB_STEP_SUMMARY"
