name: changelog

# Read-only preview of CHANGELOG.md's `## Unreleased` section (07-release-and-prr.md §3,
# job summary). It never commits: `main` is protected (C-4.1), and the old bot push to `main`
# failed with GH006 on 288+ runs from 2026-10-01 (#2341). CHANGELOG.md changes only through
# reviewed PRs (sync command: AGENTS.md §4). Supersedes E03-T11 scenario 1 and the E03-T13
# bypass note. On a PR it previews the base history against the PR's CHANGELOG.md. Read-only
# contents, no secrets and no artefact, so no ref guard.
# #3099/#3098: the merged PRs' labels route security fixes (--pr-labels-json), so the job reads
# pull requests. It runs only the base ref's committed tools (checked out to `base/`) against the
# PR's checkout (`pr/`); the token lives only in the `gh pr list` step, which runs no repo code.
# #3099 (release contract (3)): a PR titled as a release-prep PR, or changing version.txt, gets
# the release verification as an advisory check (warnings, never a failure; the release run's
# verify is the gate), and the summary names an untagged candidate: a topmost version section no
# final tag carries yet.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - CHANGELOG.md
      - .github/workflows/changelog.yml
      - tools/ci/changelog_lib.py
      - tools/ci/update_changelog.py
      - tools/ci/finalize_changelog.py
      - tools/ci/collect_commits.py
      - tools/ci/prepare_release.py
      - tools/ci/release_run.py
      - version.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-preview:
    name: changelog-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the PR (data only; none of its code runs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the base ref's tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Fetch the merged PRs' labels (no repo code runs here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 10000
          --json number,labels > "$RUNNER_TEMP/pr-labels.json"

      # The base's tools may predate #3099; both steps skip until they exist there.
      - name: Advisory release verification of a release-prep PR (warnings only)
        if: github.event_name == 'pull_request'
        working-directory: pr
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          [ -f ../base/tools/ci/prepare_release.py ] || exit 0
          prep='^chore\(infra-devops\): prepare release [0-9]+\.[0-9]+\.[0-9]+$'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$prep" \
            && ! git diff --name-only HEAD^1 HEAD | grep -qx version.txt; then
            exit 0
          fi
          rc=0
          python ../base/tools/ci/prepare_release.py --verify --rev HEAD --main-ref HEAD \
            > "$RUNNER_TEMP/verify.out" || rc=$?
          sed 's/^::error::/::warning::/' "$RUNNER_TEMP/verify.out"
          echo "release verification (advisory): exit $rc" >> "$GITHUB_STEP_SUMMARY"

      - name: Name an untagged candidate in the summary
        working-directory: pr
        run: |
          set -euo pipefail
          [ -f ../base/tools/ci/release_run.py ] || exit 0
          python ../base/tools/ci/release_run.py untagged --repo . --changelog CHANGELOG.md \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Preview the Unreleased section (writes nothing)
        working-directory: pr
        env:
          REV: ${{ github.event.pull_request.base.sha || github.sha }}
        run: >-
          python ../base/tools/ci/update_changelog.py --since-last-tag --rev "$REV"
          --pr-labels-json "$RUNNER_TEMP/pr-labels.json"
          --preview --summary "$GITHUB_STEP_SUMMARY"
