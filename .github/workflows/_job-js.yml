name: _job-js

# E03-T02: the JS/TS CI lane (ADR-0013 pipeline shape `[js] lint (eslint) ·
# typecheck (tsc) · unit (vitest) · build`, binding rule 5 caching). Called
# by `pr.yml` (`js:` job) only when the `js` path filter is true; that call
# site passes no `secrets:`, so PR runs never get Turborepo cache write
# access (ADR-0013 rule 6). Job outputs are split (`lint`, `typecheck`,
# `unit-frontend`, `unit-engine`) so branch protection can require each one
# individually per `04-security-program.md` §12.3. Coverage *thresholds* are
# E03-T04's scope; this lane runs the suites and uploads coverage/JUnit
# artifacts only. E2E execution is E03-T06 (this lane only provisions the
# Playwright browser cache); npm audit / licence scanning is E03-T07 (this
# lane emits a hand-off marker artifact only).

on:
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false

permissions:
  contents: read

env:
  # PR runs pass no `secrets:` at the `pr.yml` call site, so `TURBO_TOKEN` is
  # empty here and the Turborepo client reads from remote cache read-only (if
  # `TURBO_API`/`TURBO_TEAM` vars are configured) or falls back to the job's
  # local cache. A future `main`-branch workflow can call this reusable
  # workflow with `secrets: { TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }} }` to
  # get write access (ADR-0013 rule 6: write token scoped to `main` only).
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  node-version-check:
    name: node-version-check (CI-JS-001)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert .nvmrc matches package.json#engines (CI-JS-001)
        run: node tools/ci/check-node-version.mjs

  install:
    name: install
    needs: node-version-check
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Enable pnpm via corepack
        run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - name: Cache Playwright browsers (keyed on the pinned version, provisioned for E03-T06)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
      - name: Install (frozen lockfile, no lifecycle scripts — SR-130, SR-138)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install allowlisted postinstall builds (SR-138 exception list)
        run: node tools/ci/run-allowed-postinstall.mjs
      - name: pnpm dedupe --check (no redundant duplicate deps, SR-138 companion gate)
        run: pnpm dedupe --check
      - name: pnpm audit hand-off marker (audit gate itself runs in the security lane — E03-T07)
        run: pnpm audit --audit-level=high --json > pnpm-audit.json || node tools/ci/mark-audit-handoff.mjs pnpm-audit.json
      - name: Upload pnpm audit hand-off artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-audit-handoff
          path: pnpm-audit.json
          retention-days: 14

  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/ci/run-allowed-postinstall.mjs
      - name: Turbo lint --filter=...[origin/main]
        run: pnpm turbo run lint --filter='...[origin/main]' --summarize
      - name: Record lane duration in job summary
        if: always()
        run: node tools/ci/write-turbo-summary.mjs lint >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/ci/run-allowed-postinstall.mjs
      - name: Turbo typecheck --filter=...[origin/main] (tsc annotates errors inline)
        run: pnpm turbo run typecheck --filter='...[origin/main]' --summarize
      - name: Record lane duration in job summary
        if: always()
        run: node tools/ci/write-turbo-summary.mjs typecheck >> "$GITHUB_STEP_SUMMARY"

  unit-frontend:
    name: unit-frontend
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/ci/run-allowed-postinstall.mjs
      - name: Turbo test:cov (ui, app-web, app-electron) --filter=...[origin/main]
        run: >
          pnpm turbo run test:cov
          --filter='@candleviewer/ui...[origin/main]'
          --filter='@candleviewer/web...[origin/main]'
          --filter='@candleviewer/desktop...[origin/main]'
          --summarize
      - name: Record which packages turbo scheduled (coverage gate N/A vs CI-COV-003)
        if: always()
        run: >
          node tools/ci/turbo-affected-packages.mjs affected-packages.txt --
          --filter='@candleviewer/ui...[origin/main]'
          --filter='@candleviewer/web...[origin/main]'
          --filter='@candleviewer/desktop...[origin/main]'
      - name: Record lane duration in job summary
        if: always()
        run: node tools/ci/write-turbo-summary.mjs unit-frontend >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage (unit-frontend) for E03-T04
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-frontend
          path: |
            affected-packages.txt
            apps/web/coverage/lcov.info
            apps/desktop/coverage/lcov.info
            packages/ui/coverage/lcov.info
            apps/web/junit.xml
            apps/desktop/junit.xml
            packages/ui/junit.xml
          retention-days: 14
          if-no-files-found: warn

  unit-engine:
    name: unit-engine
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/ci/run-allowed-postinstall.mjs
      - name: Turbo test:cov (chart-engine, protocol) --filter=...[origin/main]
        run: >
          pnpm turbo run test:cov
          --filter='@candleviewer/chart-engine...[origin/main]'
          --filter='@candleviewer/protocol...[origin/main]'
          --summarize
      - name: Record which packages turbo scheduled (coverage gate N/A vs CI-COV-003)
        if: always()
        run: >
          node tools/ci/turbo-affected-packages.mjs affected-packages.txt --
          --filter='@candleviewer/chart-engine...[origin/main]'
          --filter='@candleviewer/protocol...[origin/main]'
      - name: Record lane duration in job summary
        if: always()
        run: node tools/ci/write-turbo-summary.mjs unit-engine >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage (unit-engine) for E03-T04
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-engine
          path: |
            affected-packages.txt
            packages/chart-engine/coverage/lcov.info
            packages/protocol/coverage/lcov.info
            packages/chart-engine/junit.xml
            packages/protocol/junit.xml
          retention-days: 14
          if-no-files-found: warn

  build:
    name: build
    needs: [lint, typecheck, unit-frontend, unit-engine]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/ci/run-allowed-postinstall.mjs
      - name: Turbo build --filter=...[origin/main] (generated-code freshness is E03-T06's gate)
        run: pnpm turbo run build --filter='...[origin/main]' --summarize
      - name: Record lane duration in job summary
        if: always()
        run: node tools/ci/write-turbo-summary.mjs build >> "$GITHUB_STEP_SUMMARY"
      - name: Electron-hardening gate (E10-X02, SR-110..SR-119) - packaged build, weakened fixture must fail
        run: |
          set -euo pipefail
          pnpm --filter @candleviewer/web --filter @candleviewer/desktop build
          xvfb-run -a node apps/desktop/scripts/collect-hardening-facts.mjs hardening-facts.json
          python tools/ci/electron_hardening_gate.py --desktop-dist apps/desktop/dist             --web-dist apps/web/dist --builder-config apps/desktop/electron-builder.yml             --facts hardening-facts.json --require-runtime
      - name: Contrast-matrix gate (E05-T05, A11Y-C001/002/003 over packages/ui/tokens/**)
        run: pnpm --filter @candleviewer/ui contrast:gate
      - name: Upload contrast-matrix report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contrast-matrix
          path: |
            packages/ui/build/reports/contrast-matrix.json
            packages/ui/build/reports/contrast-matrix.md
          retention-days: 14
          if-no-files-found: warn
