name: dast-market-nightly

# E12-X03: the nightly (never per-PR) low-privilege OWASP ZAP scan of the market-data read surface
# (/market/klines, /market/bars; plan: .zap/market-data.yaml), authenticated as a synthetic
# marketdata:read Viewer on a throwaway stack (_dast-low-priv.yml, #3991). Gate: the scan stays
# signed in, and any High/Medium alert not in .zap/market-data-baseline.json fails the job
# (security/zap/baseline_gate.py); expected 400/422 problem responses are tuned out in the plan,
# never in this file. Never a live exchange; no repository secret.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap-market:
    uses: ./.github/workflows/_dast-low-priv.yml
    with:
      profile: market
      report: market-viewer
      baseline: .zap/market-data-baseline.json
      artifact: zap-market-data
