name: _job-rule-roundtrip

# E35-Q02: the rule IR round-trip gate (R3 exit criterion 5, US-RULE-001/006 NFRs).
# Runs on any PR touching the rule IR, the compilers or canonicalisation:
#   1. corpus gate   - 30 hand-authored rules vs golden canonical hashes (< 30 s budget)
#   2. mutation job  - injects an unsorted-keys canonicalisation defect; the suite must fail
#                      and shrink to a minimal reproducer within 60 s
#   3. property run  - >= 10 000 generated documents across the full hop chain (< 4 min budget),
#                      seed printed; the Hypothesis example database is cached so a failure found
#                      once is replayed on every later run.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  rule-roundtrip:
    name: rule-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: Restore the Hypothesis example database (replays past failures)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/api/.hypothesis/roundtrip
          key: rule-roundtrip-db-${{ github.run_id }}
          restore-keys: rule-roundtrip-db-

      - name: Corpus gate + mutation sanity check (blocking)
        working-directory: services/api
        run: >
          uv run pytest tests/rules/roundtrip -q --no-cov -s -p no:randomly
          -m "not roundtrip" --durations=5

      - name: Property suite, >= 10 000 documents (blocking)
        working-directory: services/api
        env:
          CV_ROUNDTRIP_EXAMPLES: "10000"
        run: >
          uv run pytest tests/rules/roundtrip -q --no-cov -s -p no:randomly
          -m roundtrip --durations=5
