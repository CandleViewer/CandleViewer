name: perf-ws-load
# E17-Q03 (#568): the recorded k6 WS load profiles (A, B, C), the W5 phases and the self-check, on the
# self-hosted bench runner cv-bench-01 (labels self-hosted, Linux, X64, bench; 8 vCores, 32 GiB).
# Dispatch only: never on a PR or a schedule (a self-hosted runner never runs a PR's code), and not a
# required check (C-9.2). Nothing reads its result but whoever dispatches it: a run's artefacts are
# the evidence the Results PR for #568 cites, and no release gate consults it.
# The VPS-class profile (4 vCPU, 8 GiB) is reproduced on that machine: the backend on cpus 0-3 (and
# in a systemd scope with CPUQuota=400% and MemoryMax=8G where the runner has a user manager), k6 on
# 4-7, so the two never share a CPU. The backend is the loopback fixture (services/api/bench/ws) fed
# from the recorded corpus: it binds loopback only and constructs no exchange or other outbound
# client, and its sessions are minted in process, so no credential exists (C-13.5, C-12.9). The
# runner itself has egress (k6 is downloaded here): that is not what this guarantee rests on.
#
# Never overlap a 24 h soak on the same runner: the ingestion soak (perf-ingestion-nightly.yml, job
# perf-pack-full) or a bars-soak memory leg (perf-bars-memdiag.yml, job leg, up to 23 h; until that
# workflow is on main the API answers 404 for it, read as none running; any other API error fails
# the step). The first step is a guard that REFUSES TO START while either job is queued or running,
# rather than a shared concurrency group. Why: GitHub keeps one pending run per group and cancels
# the older pending one, so a group shared with the soak could cancel a pending 24 h soak dispatch
# (and needs an edit to the soak's workflow); the runner runs one job at a time, so a ws-load job
# queued behind a 24-35 h soak would only wait out GitHub's 24 h queue limit and fail; and the guard
# names the cause. A soak dispatched after this job starts queues behind it on the runner. The own
# group below only keeps two ws-load runs from queueing over each other.
#
# C-13.9: the regression gate is 5 % on the median of 3 runs, so `runs` defaults to 3 and the
# `gate` step compares them with the baseline. k6 v2.3.0 is fetched by `gh release download` and
# checked against the sha256 pinned here and the release's checksums file. Needs gh, tar and
# coreutils on the runner; every input reaches a script through env and is validated first.
# Steps run under the runner's `bash -e`, so the load step clears it (`set +e`): every run is wanted
# even after a red one, and its exit code is the worst of them. The checkout drops its token
# (nothing here pushes or fetches again), as on every other workflow; the machine profile is named,
# as the soak names its own, so a baseline's key does not depend on the runner's CPU count.
# The `feeder` input (#571) moves the bench feeder out of the backend's process (`proc`: a child
# on k6's cpus 4-7, inside the backend's systemd scope and its quota), so the backend's CPU and loop
# are the gateway's alone; `inproc` (the default) is the feeder on the backend's loop, as before.
# Runs and baselines of one mode are never gated against the other.
# The `instrumentation` input (#571) runs the same build with E17-T06's hot-path series stood in by
# no-ops (`off`, profiles smoke, A, B and C only): the uninstrumented half of the overhead pair that
# `bench.ws.runner overhead` compares with an `on` dispatch of the same profile and feeder.
# The backend always runs the WS outbound pipeline: #2409 removed CV_WS_BACKPRESSURE_ENABLED and the
# `flag` input that set it.
# Such runs are judged in overhead mode (no budget #6), never gated and never a baseline, so the
# gate step is skipped for them.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "smoke (2 min), A, B (1 h each), C (30 min), W5 (10 phases) or selfcheck (inflated fan-out must fail)"
        type: choice
        options: [smoke, A, B, C, W5, selfcheck]
        default: smoke
      runs:
        description: "Runs of the profile; the gate and the reproducibility check need 3 (A, B, C, smoke only)"
        type: choice
        options: ["1", "2", "3"]
        default: "3"
      duration_s:
        description: "Steady window in seconds (empty: the profile's own; W5: every phase's, and the phases keep their own warm-ups, so 30 is a dry run of about 14 minutes; a shorter run is never a baseline)"
        type: string
        default: ""
      ws_path:
        description: "Where the fixture serves the gateway and k6 connects: /ws, or a prefix and /ws such as /api/v1/ws"
        type: string
        default: "/ws"
      feeder:
        description: "The bench feeder on the backend's loop (inproc, as before) or in a child process on k6's cpus (proc: the backend's numbers are the gateway's alone)"
        type: choice
        options: [inproc, proc]
        default: inproc
      instrumentation:
        description: "E17-T06's WS series as built (on) or stood in by no-ops (off: the uninstrumented half of #571's overhead pair; smoke, A, B, C only)"
        type: choice
        options: ["on", "off"]
        default: "on"
permissions:
  actions: read # the guard lists the soak's jobs
  contents: read
concurrency:
  group: perf-ws-load
  cancel-in-progress: false
jobs:
  ws-load:
    runs-on: [self-hosted, Linux, X64, bench]
    timeout-minutes: 720
    env:
      CV_ENV: test
      CV_BENCH_MACHINE_PROFILE: bench-runner
      K6_VERSION: v2.3.0
      # sha256 of k6-v2.3.0-linux-amd64.tar.gz (the release asset's digest)
      K6_SHA256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
      K6_NO_USAGE_REPORT: "true"
      K6_AUTO_EXTENSION_RESOLUTION: "false"
    steps:
      - name: Refuse to start while a 24 h soak (ingestion pack or bars memory leg) is queued or running on the bench runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo "gh is not installed on this runner" >&2; exit 1; }
          err=$(mktemp)
          trap 'rm -f "$err"' EXIT
          busy=""
          for soak in perf-ingestion-nightly.yml:perf-pack-full perf-bars-memdiag.yml:leg; do
            wf=${soak%%:*} job=${soak#*:} n=0
            for status in in_progress queued; do
              if ! ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?status=${status}&per_page=50" --paginate --jq '.workflow_runs[].id' 2>"$err"); then
                # the memory legs' workflow is not on main until its PR merges: only its 404 means none runs.
                # Remove this allowance once perf-bars-memdiag.yml is on main: a 404 then fails closed too.
                if [ "$wf" = perf-bars-memdiag.yml ] && grep -qxF 'gh: Not Found (HTTP 404)' "$err"; then
                  echo "${wf}: not on this repository yet (HTTP 404), so no run of it holds the runner"
                  break
                fi
                cat "$err" >&2
                exit 1
              fi
              for id in $ids; do
                c=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" --jq "[.jobs[] | select(.name == \"${job}\" and (.status == \"in_progress\" or .status == \"queued\"))] | length")
                n=$((n + c))
              done
            done
            [ "$n" -eq 0 ] || busy="${busy:+$busy, }${wf} (job ${job})"
          done
          if [ -n "$busy" ]; then
            echo "::error::refusing to start: a 24 h soak is queued or running on the bench runner: ${busy}; dispatch again when it has finished" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - id: sync
        run: uv sync --project services/api
      - name: Install the pinned k6 (sha256 verified twice)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/k6"
          mkdir -p "$dir"
          cd "$dir"
          tarball="k6-${K6_VERSION}-linux-amd64.tar.gz"
          gh release download "$K6_VERSION" -R grafana/k6 -p "$tarball" -p "k6-${K6_VERSION}-checksums.txt" --clobber
          echo "${K6_SHA256}  ${tarball}" | sha256sum -c -
          grep " ${tarball}\$" "k6-${K6_VERSION}-checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
          ./k6 version | grep -F "k6 ${K6_VERSION} "
          echo "K6_BIN=$dir/k6" >> "$GITHUB_ENV"
      - name: WS load run (${{ inputs.profile }}, ${{ inputs.runs }} run(s), feeder ${{ inputs.feeder }}, instrumentation ${{ inputs.instrumentation }})
        id: load
        working-directory: services/api
        env:
          PROFILE: ${{ inputs.profile }}
          RUNS: ${{ inputs.runs }}
          DURATION: ${{ inputs.duration_s }}
          WS_PATH: ${{ inputs.ws_path }}
          FEEDER: ${{ inputs.feeder }}
          INSTRUMENTATION: ${{ inputs.instrumentation }}
        run: |
          set -uo pipefail
          set +e # the runner's bash -e would end the step at the first red run
          [[ "$RUNS" =~ ^[1-3]$ ]] || { echo "runs must be 1, 2 or 3" >&2; exit 2; }
          [[ "$WS_PATH" =~ ^(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)*/ws$ ]] || { echo "ws_path must be /ws or a prefix and /ws" >&2; exit 2; }
          [[ "$FEEDER" =~ ^(inproc|proc)$ ]] || { echo "feeder must be inproc or proc" >&2; exit 2; }
          [[ "$INSTRUMENTATION" =~ ^(on|off)$ ]] || { echo "instrumentation must be on or off" >&2; exit 2; }
          extra=(--feeder "$FEEDER" --ws-path "$WS_PATH")
          if [ -n "$DURATION" ]; then
            [[ "$DURATION" =~ ^[0-9]+$ ]] || { echo "duration_s must be whole seconds" >&2; exit 2; }
            extra+=(--duration-s "$DURATION")
          fi
          staging=(--backend-cpus 0-3 --k6-cpus 4-7)
          if systemd-run --user --scope --quiet true 2>/dev/null; then staging+=(--staging); fi
          case "$PROFILE" in
            selfcheck | W5) [ "$INSTRUMENTATION" = on ] || { echo "instrumentation off is for smoke, A, B and C only" >&2; exit 2; } ;;&
            selfcheck) cmd=(selfcheck); RUNS=1 ;;
            W5) cmd=(w5); RUNS=1 ;;
            smoke | A | B | C) cmd=(run "$PROFILE" --instrumentation "$INSTRUMENTATION") ;;
            *) echo "unknown profile" >&2; exit 2 ;;
          esac
          out="$GITHUB_WORKSPACE/ws-load"
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
          worst=0
          for i in $(seq 1 "$RUNS"); do
            dir="$out/run-$i"
            if [ "$RUNS" -eq 1 ]; then dir="$out"; fi
            uv run python -m bench.ws.runner "${cmd[@]}" "${staging[@]}" --out-dir "$dir" "${extra[@]}"
            code=$?
            [ "$code" -gt "$worst" ] && worst=$code
          done
          exit "$worst"
      - name: Regression gate (5 % on the median of 3 runs, C-13.9)
        if: ${{ !cancelled() && steps.load.outputs.runs == '3' && inputs.instrumentation == 'on' && contains(fromJSON('["smoke","A","B","C"]'), inputs.profile) }}
        working-directory: services/api
        run: uv run python -m bench.ws.runner gate "$GITHUB_WORKSPACE"/ws-load/run-1 "$GITHUB_WORKSPACE"/ws-load/run-2 "$GITHUB_WORKSPACE"/ws-load/run-3
      - name: Reproducibility (AC 5, within 15 % or a named variance source)
        if: ${{ !cancelled() && contains(fromJSON('["2","3"]'), steps.load.outputs.runs) && contains(fromJSON('["smoke","A","B","C"]'), inputs.profile) }}
        working-directory: services/api
        run: uv run python -m bench.ws.runner repro "$GITHUB_WORKSPACE"/ws-load/run-1 "$GITHUB_WORKSPACE"/ws-load/run-2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ws-load-${{ inputs.profile }}
          # tokens.json holds opaque session handles valid only inside the run's own process; never kept
          path: |
            ws-load/
            !ws-load/**/tokens.json
            !ws-load/**/bars/**
          if-no-files-found: ignore
