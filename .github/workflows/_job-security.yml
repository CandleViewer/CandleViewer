name: _job-security

# E03-T07: SAST, SCA, secrets, licence and container scanning lane.
# ADR-0013 pipeline shape (Amendment 2); 04-security-program.md §6.13/§6.14/§12.1/§12.3;
# CONSTITUTION §9 checks #10-#14 (sast, sca, secrets-scan, container-scan,
# license-check). E03-T07 gave each tool its own job, so branch protection could
# name each one and a flaky scanner could not mask the others. #3104 folds the
# jobs that hold the same permissions: protection requires only `ci-required`,
# which judges this whole workflow as the one `security` lane, and every job
# costs a runner slot and its own setup.
# - `read-only-scans` (contents: read, and vulnerability-alerts: read for the
#   alert gate): security-auth, pip-audit, dependabot-alerts, npm-audit and
#   license-scan;
# - `semgrep-bandit` (security-events: write, for their SARIF uploads).
# Each scan is a step with an `id`, `continue-on-error` and its old job's
# time budget, so a red scan neither stops nor hides another. The last step, the
# verdict, writes every scan's outcome to the job summary and fails the job
# unless each one succeeded or was skipped. Uploads have no `id`, so an upload
# outage never gates. codeql, gitleaks and trivy stay separate jobs: folding
# codeql would make SAST serial, gitleaks must scan a tree and history that no
# install has touched, and trivy builds and boots the image.
#
# Error codes (tools/ci/security_gate.py): CI-SEC-001 blocking finding,
# CI-SEC-002 licence violation, CI-SEC-003 LGPL needs approval,
# CI-SEC-004 accepted risk expired, CI-SEC-005 scanner infrastructure
# failure (never pass-by-default — every scan below fails, not skips, on a
# scanner error).
#
# Out of scope here (ticket "Out of scope"): image signing/SBOM (E03-T08),
# ZAP DAST (E03-X04, deferred), the STRIDE model itself (E03-X01), authoring
# the cv-* Semgrep rules (E03-X02; the rules already in `.semgrep/`,
# such as cv-unpinned-action, run in `semgrep-bandit` with no workflow
# change), pen-test (R4/E43).

on:
  workflow_call:
    inputs:
      image_changed:
        description: "true when infra/images/**, services/api/pyproject.toml or uv.lock changed (gates the trivy image build)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  # 3.12: the hash-pinned installs (tools/ci/requirements-semgrep.txt and
  # requirements-security-gate.txt) pin CPython 3.12 wheels.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------
  # codeql — CONSTITUTION §9 #10 (sast)
  # ---------------------------------------------------------------------
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write # required to upload SARIF to code scanning
    env:
      # The one language list: init analyses these and the gate needs a SARIF for each (#3261).
      # CV_, not CODEQL_: every step sees it, and CODEQL_* belongs to the CodeQL action and CLI.
      CV_CODEQL_LANGUAGES: javascript-typescript,python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ env.CV_CODEQL_LANGUAGES }}
          config-file: ./.github/codeql/codeql-config.yml

      # analyze writes one <language>.sarif per language under runner.temp, which the job starts
      # empty and no commit can reach, so only SARIF from this run counts. Its own outcome does
      # not gate: the gate step below fails CI-SEC-005 for each configured language without a
      # SARIF (a crash after the first language's file never passes) and judges every one.
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        continue-on-error: true
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: false # gate on our normalised policy first, then upload

      # #3337: installed only after analyze, so nothing a PR names is installed before init or
      # analyze. Code run here could still reach the SARIF before the gate and the upload, so this
      # takes only the wheel whose sha256 the file pins: no build step, no other package. -I
      # (isolated mode, #3372): neither the checkout's files nor PYTHON* variables can stand in
      # for pip. always(): the gate below always runs, and with its module it fails closed with a
      # message.
      - name: Install gate helper deps (hash-pinned PyYAML wheel for security_gate.py)
        if: always()
        run: >-
          python -I -m pip install --require-hashes --only-binary=:all: --no-deps
          -r tools/ci/requirements-security-gate.txt

      # security_gate.py reads `security-severity` / `level` from the rule
      # descriptor when the result omits them (CodeQL always does) — see the
      # parse_sarif docstring. Before that fix every CodeQL High was bucketed
      # MEDIUM and this step passed PRs that GitHub's own "CodeQL" check
      # (fed by the upload below) flagged red (#1715, #1691).
      - name: Evaluate CodeQL findings (security_gate.py, CI-SEC-001/004)
        if: always()
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/codeql-results"
          if ! [[ "${CV_CODEQL_LANGUAGES:-}" =~ ^[a-z-]+(,[a-z-]+)*$ ]]; then
            echo "CI-SEC-005: CV_CODEQL_LANGUAGES='${CV_CODEQL_LANGUAGES:-}' is not a language list" >&2
            exit 1
          fi
          IFS=, read -ra langs <<< "$CV_CODEQL_LANGUAGES"
          status=0
          for lang in "${langs[@]}"; do
            # analyze names the file after the CodeQL language (javascript-typescript is analysed
            # as javascript, run 39070557384); any other alias expects a file that never appears,
            # so it fails closed until it is mapped here.
            case "$lang" in javascript-typescript) name=javascript ;; *) name="$lang" ;; esac
            if [ ! -f "$dir/$name.sarif" ]; then
              echo "CI-SEC-005: codeql produced no SARIF for $lang ($dir/$name.sarif) — scanner infrastructure failure" >&2
              status=1
            fi
          done
          # Judge every SARIF the upload sends: it walks the whole tree, dot-entries included.
          shopt -s globstar nullglob dotglob
          for f in "$dir"/**/*.sarif; do
            python tools/ci/security_gate.py --tool codeql --report "$f" || status=1
          done
          exit "$status"

      # hashFiles() sees only the workspace, so this step tells the upload whether analyze wrote
      # any SARIF. It never gates: continue-on-error, and the gate above has already decided.
      - name: Find the CodeQL SARIF for the upload
        id: sarif
        if: always()
        continue-on-error: true
        run: |
          shopt -s globstar nullglob dotglob
          files=("$RUNNER_TEMP/codeql-results/"**/*.sarif)
          if [ "${#files[@]}" -gt 0 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # Gate decided above. The upload feeds GitHub's informational "CodeQL"
        # check run (github-advanced-security app; PR-scoped alerts, not a
        # C-9.1 required check) — it must agree with the gate, never replace
        # it, and an upload outage must never mask the gate result.
        if: always() && steps.sarif.outputs.found == 'true'
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: codeql

  # ---------------------------------------------------------------------
  # semgrep-bandit — CONSTITUTION §9 #10 (sast); one job since #3104, as both
  # upload SARIF. Semgrep: registry packs per 12.2 plus the cv-* custom rules in
  # `.semgrep/` (incl. cv-unpinned-action, SR-132). Bandit: services/api only
  # (12.1 table: "High/Medium confidence+severity blocks; `# nosec` requires an
  # inline justification and security approval").
  # ---------------------------------------------------------------------
  semgrep-bandit:
    name: semgrep-bandit
    runs-on: ubuntu-latest
    timeout-minutes: 30 # semgrep 15 + bandit 10 + 5 for setup
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Semgrep first: it scans the whole tree, so no other tool's report may sit in it yet.
      # Each scanner gets its own venv, so one tool's install never re-resolves another's pins;
      # semgrep installs only by hash, from tools/ci/requirements-semgrep.txt (#3549).
      - name: semgrep (custom-rule fixture tests, then registry packs + .semgrep/ rules)
        id: semgrep
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          export PATH="$RUNNER_TEMP/semgrep-venv/bin:$PATH"
          pip install --require-hashes --only-binary=:all: -r tools/ci/requirements-semgrep.txt
          python tools/ci/check_semgrep_rule_tests.py # incl. the E10-X02 electron rules
          CONFIGS="p/python p/typescript p/react p/electron-desktop-app p/docker p/github-actions \
                   p/secrets p/owasp-top-ten p/sql-injection p/jwt p/insecure-transport"
          # Rule files only (glob); YAML fixtures live in .semgrep-fixtures/.
          if [ -d .semgrep ]; then CONFIGS="$CONFIGS $(ls .semgrep/cv-*.yml)"; fi
          CONFIG_ARGS=""
          for c in $CONFIGS; do CONFIG_ARGS="$CONFIG_ARGS --config $c"; done
          # --error makes semgrep exit non-zero on findings AND on engine errors;
          # security_gate.py is what decides pass/fail on findings, so we only
          # want to swallow the "findings present" exit code (1), never a
          # genuine engine/config failure (>1) — CI-SEC-005 must not pass-by-default.
          # The SARIF does not say which targets a rule did not analyse and still reads as a
          # complete scan. The JSON report does: its errors, and with --verbose the targets
          # Semgrep skipped (one over the size limit, say). The gate fails on them (#3549).
          set +e
          semgrep scan $CONFIG_ARGS --verbose --sarif --output semgrep.sarif --json-output semgrep.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "CI-SEC-005: semgrep exited $status (engine/config error) — scanner infrastructure failure" >&2
            exit "$status"
          fi
          python tools/ci/security_gate.py --tool semgrep --report semgrep.sarif --semgrep-json semgrep.json

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # Upload only when the scanner wrote a report; the semgrep step (not this upload)
        # decides pass/fail. Code scanning is on: run 39041114804 posted the Semgrep OSS and
        # Bandit check runs. continue-on-error and no `id` keep an upload outage out of the verdict.
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: bandit (services/api, SARIF)
        id: bandit
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        # -c: honour [tool.bandit] (exclude_dirs=tests; assert/subprocess in tests are not
        # production findings). Production-code noqa markers are ruff-style; bandit
        # needs its own `# nosec` — the two guard sites carry both. `cvdev` is the dev-only
        # sibling package (#2893, ADR-0036): never shipped, but it runs in a dev stack.
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/bandit-venv"
          export PATH="$RUNNER_TEMP/bandit-venv/bin:$PATH"
          pip install -r scripts/requirements-ci.txt "bandit[sarif]==1.8.6"
          bandit -c services/api/pyproject.toml -r services/api/candleviewer services/api/cvdev -f sarif -o bandit.sarif -ll || true
          python tools/ci/security_gate.py --tool bandit --report bandit.sarif

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # As the semgrep upload above: the bandit step decides, the upload never gates.
        if: ${{ !cancelled() && hashFiles('bandit.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit

      # `ci-required` judges this job's result (the `security` lane); this keeps it honest per scan.
      - name: Verdict (every scan succeeded or was skipped)
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        shell: python
        run: |
          import json, os
          outcomes = {scan: step["outcome"] for scan, step in json.loads(os.environ["OUTCOMES"]).items()}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("| scan | outcome |\n| --- | --- |\n")
              summary.writelines(f"| {scan} | {outcome} |\n" for scan, outcome in outcomes.items())
          failed = [scan for scan, outcome in outcomes.items() if outcome not in ("success", "skipped")]
          raise SystemExit(f"scans not successful: {', '.join(failed)}" if failed else 0)

  # ---------------------------------------------------------------------
  # gitleaks — CONSTITUTION §9 #12 (secrets-scan). Any finding blocks; a
  # gitleaks finding can never be exception-listed in accepted-risks.yaml
  # (security_gate.py enforces this at load time). Full-history nightly
  # scan is configured separately by E03-T12 (deferred); this PR-scoped
  # job diffs only the PR's commit range.
  # ---------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks-action needs `pull-requests: read` (crashes with "Resource not
      # accessible by integration" without it). The gate below reads the pinned
      # gitleaks binary's own JSON report, which needs no GitHub API access at
      # all, so the action is not used; the scan covers the checked-out tree.
      - name: Run gitleaks (pinned binary, redacted JSON report)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact -f json -r /repo/gitleaks.json || true
        continue-on-error: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install gate helper deps (PyYAML for security_gate.py)
        run: pip install -r scripts/requirements-ci.txt

      - name: Evaluate gitleaks findings (security_gate.py, CI-SEC-001 — no exceptions ever)
        run: python tools/ci/security_gate.py --tool gitleaks --report gitleaks.json

      - name: IR-02 annotation on committed secret
        if: failure()
        run: echo "::error title=Committed secret blocks merge::Rotate first per SECURITY.md / runbook IR-02 (docs/ci-runbook.md)."

      # E43-T06: full-history sweep (git mode, all refs) + second-opinion scanner.
      - name: Full-history gitleaks sweep (git mode, all refs)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --log-opts="--all" --config=/repo/.gitleaks.toml --redact \
            -f json -r /repo/gitleaks-history.json || true
          python -c "import json;print('gitleaks history findings:',len(json.load(open('gitleaks-history.json'))))"

      - name: trufflehog second opinion (filesystem + git history, pinned digest)
        run: |
          set -euo pipefail
          TH=trufflesecurity/trufflehog:3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
          docker run --rm -v "$PWD:/repo" "$TH" filesystem /repo --no-update --json --exclude-paths=/repo/.trufflehog-exclude > "$RUNNER_TEMP/trufflehog-fs.log" || true
          docker run --rm -v "$PWD:/repo" "$TH" git file:///repo --no-update --json --exclude-paths=/repo/.trufflehog-exclude > "$RUNNER_TEMP/trufflehog-git.log" || true
          # Field projection only (detector, file:line, commit, verified) — Raw/Redacted
          # are never printed; raw logs live in $RUNNER_TEMP (never self-scanned, never uploaded).
          for m in fs git; do
            echo "trufflehog $m findings:"
            jq -rc 'select(.DetectorName) | (.SourceMetadata.Data.Filesystem // .SourceMetadata.Data.Git) as $s
              | "TH \(.DetectorName) \($s.file):\($s.line) commit=\($s.commit // "-") verified=\(.Verified)"' \
              "$RUNNER_TEMP/trufflehog-$m.log" || true
          done
          rm -f "$RUNNER_TEMP"/trufflehog-*.log

      # E43-T06 (SR-140..146): credential hygiene + scan of this job's log/artefact
      # outputs (the scanner reports that get uploaded) for secret shapes.
      - name: Credential hygiene gate (fixtures, dev env, workflows)
        run: python scripts/check_secrets_hygiene.py all

      - name: Scan job log/artefact outputs for secrets (SR-146)
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.json *.log *.sarif)
          if [ ${#files[@]} -gt 0 ]; then
            python scripts/check_secrets_hygiene.py logs "${files[@]}"
          fi

  # ---------------------------------------------------------------------
  # read-only-scans — the contents: read scans, one step each (#3104):
  # - security-auth — E09-X03 (SR-011/012/017/025/026/051/112/122). Proves every
  #   auth Semgrep rule on its fixtures (missing fixture = fail), scans the auth
  #   surface with the pack (any finding blocks; triage path in
  #   docs/security/auth-security-gates.md), and polices suppressions. The gate
  #   fails the scan on a target or rule it did not analyse (#3549).
  # - pip-audit, npm-audit — CONSTITUTION §9 #11 (sca), Python and JS/TS advisories.
  # - dependabot-alerts — §9 #11's Dependabot alert gate (#3558): the open alerts on `main`.
  # - license-scan — CONSTITUTION §9 #14 (license-check), SR-136 policy, after its
  #   backend install and package-scope check (license-scope) and the freeze check.
  # The tree readers (security-auth, pip-audit, dependabot-alerts) run before the pnpm and uv
  # installs.
  # ---------------------------------------------------------------------
  read-only-scans:
    name: read-only-scans
    runs-on: ubuntu-latest
    timeout-minutes: 47 # four scans of 10, the alert gate's 2, + 5 for setup
    permissions:
      contents: read
      # dependabot-alerts lists the open alerts with the job token and GitHub's read-only
      # `vulnerability-alerts` permission, so no new secret:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # dependabot-alerts reads HEAD's merge base with origin/main
          persist-credentials: false # nothing here pushes or fetches

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install gate helper deps (PyYAML for security_gate.py)
        run: pip install -r scripts/requirements-ci.txt

      # Scanners get their own venvs, so one tool's install never re-resolves another's pins;
      # semgrep installs only by hash, from tools/ci/requirements-semgrep.txt (#3549).
      - name: security-auth (auth rule fixtures + suppression policy, then the auth pack scan)
        id: security-auth
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/security-auth-venv"
          export PATH="$RUNNER_TEMP/security-auth-venv/bin:$PATH"
          pip install --require-hashes --only-binary=:all: -r tools/ci/requirements-semgrep.txt
          python tools/ci/check_auth_semgrep.py
          # --error fails the step on any finding. The gate reads the JSON report as it does the
          # main scan's, with every auth rule counted like a cv-* rule (#3549).
          semgrep scan --config security/semgrep/auth --error --metrics=off --verbose \
            --json-output "$RUNNER_TEMP/semgrep-auth.json" \
            --exclude fixtures services/api/candleviewer apps packages/ui
          python tools/ci/security_gate.py --tool semgrep-auth --report "$RUNNER_TEMP/semgrep-auth.json"

      - name: pip-audit (services/api dependencies)
        id: pip-audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          export PATH="$RUNNER_TEMP/pip-audit-venv/bin:$PATH"
          pip install -r scripts/requirements-ci.txt "pip-audit==2.7.3" "uv==0.12.19"
          # Audit exactly what ships: the uv lockfile (all groups), exported as
          # pinned requirements. Auditing the runner's own site-packages mixed
          # CI tooling (scripts/requirements-ci.txt) into the product SBOM.
          # --no-emit-project: the editable `file://` self-reference is not a third-party dependency.
          uv export --frozen --no-hashes --all-groups --no-emit-project --project services/api -o "$RUNNER_TEMP/api-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/api-requirements.txt" --no-deps --format json --output pip-audit.json --progress-spinner off || true
          python tools/ci/security_gate.py --tool pip-audit --report pip-audit.json

      # The open alerts describe `main`. A High or Critical one blocks unless this tree changes the
      # package's resolved versions in its lockfile since the merge base with main (the fix: the
      # audit steps judge the new versions) or an unexpired entry accepts it (High only; #3558).
      # A failed API call fails closed (CI-SEC-005), never passes as "no alerts" (runbook).
      - name: dependabot-alerts (open Dependabot alerts on main, judged on this tree)
        id: dependabot-alerts
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "CI-SEC-005: dependabot: $*" >&2; exit 1; }
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open&per_page=100" > dependabot-alerts.json ||
            fail "the alerts API call failed (gh's error above): a token without vulnerability-alerts: read (GitHub may withhold it from a fork's pull request) or an API outage"
          base=$(git merge-base HEAD origin/main) || fail "this checkout has no merge base with origin/main"
          python tools/ci/security_gate.py --tool dependabot --report dependabot-alerts.json --base "$base"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm via corepack
        if: ${{ !cancelled() }}
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies (ignore-scripts, C-12.3)
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      # security_gate.py reads pnpm's own report (`advisories` + `metadata`, not npm's schema;
      # #3494). `|| true`: pnpm audit exits 1 on any advisory, so the gate decides. When pnpm
      # fails it writes nothing to stdout, and the gate fails an empty or unrecognised report
      # (CI-SEC-005). continue-on-error only lets the later scans run: the verdict step fails
      # the job on this step's outcome (test_security_lane.py, test_verdict_fails_on_any_red_scan_*).
      - name: npm-audit (pnpm audit, JSON)
        id: npm-audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pnpm audit --json > npm-audit.json || true
          python tools/ci/security_gate.py --tool npm-audit --report npm-audit.json

      - name: license-scope (the locked backend environment, then the internal package scope, STRIDE R2)
        id: license-scope
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        # The install comes first: freeze and license-scan need it, so a scope violation
        # stays this step's failure alone.
        run: |
          set -euo pipefail
          pip install "uv==0.12.19" --quiet
          uv sync --frozen --all-groups --project services/api
          python tools/ci/check_internal_package_scope.py --root .

      - name: freeze (dependency graph matches security/freeze-manifest.sha256; E43-T05, SR-130)
        id: freeze
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        # Byte-identical check of pnpm-lock.yaml + uv.lock + resolved graphs after the frozen
        # installs above. Does not depend on any pentest-freeze-* tag existing.
        # `--propose` (35-dependency-freeze-policy.md §2.1): on mismatch the regenerated
        # manifest + diff land in the step summary and the artifact below — never in the
        # branch. The step still fails; a reviewer commits the proposal if the bump is approved.
        run: python tools/ci/check_freeze_manifest.py --propose freeze-manifest-proposal

      - name: Upload freeze-manifest proposal for the reviewer (Dependabot / dependencies PRs)
        # Dependabot cannot run --write itself (policy §2.1). Only on a mismatch, and only for
        # dependency-bump PRs, so ordinary red runs do not grow an artifact. Keyed on the freeze
        # step's outcome: continue-on-error leaves the job status at success when that step fails.
        if: >-
          ${{ !cancelled() && steps.freeze.outcome == 'failure' &&
          (github.actor == 'dependabot[bot]' ||
          contains(github.event.pull_request.labels.*.name, 'dependencies')) }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freeze-manifest-proposal
          path: freeze-manifest-proposal/
          retention-days: 14
          if-no-files-found: error

      - name: license-scan (licences against the allowlist; CI-SEC-002/003/004, SR-136)
        id: license-scan
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # license-checker does not understand pnpm workspaces ("No packages found").
          # pnpm licenses is workspace-aware and reads the lockfile CI just installed.
          pnpm licenses list --json --prod > pnpm-licenses.json
          # Python licences are read from the uv venv via importlib.metadata
          # (PEP 639 License-Expression first) — pip-licenses 5.x reports UNKNOWN
          # for urllib3/uvicorn/websockets that only carry License-Expression.
          services/api/.venv/bin/python tools/ci/collect_licenses.py \
            --python-env \
            --pnpm-licenses pnpm-licenses.json \
            --out licenses.json
          python tools/ci/security_gate.py --tool license-scan --report licenses.json

      # `ci-required` judges this job's result (the `security` lane); this keeps it honest per scan.
      - name: Verdict (every scan succeeded or was skipped)
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        shell: python
        run: |
          import json, os
          outcomes = {scan: step["outcome"] for scan, step in json.loads(os.environ["OUTCOMES"]).items()}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("| scan | outcome |\n| --- | --- |\n")
              summary.writelines(f"| {scan} | {outcome} |\n" for scan, outcome in outcomes.items())
          failed = [scan for scan, outcome in outcomes.items() if outcome not in ("success", "skipped")]
          raise SystemExit(f"scans not successful: {', '.join(failed)}" if failed else 0)

  # ---------------------------------------------------------------------
  # trivy — CONSTITUTION §9 #13 (container-scan). Scoped to the one
  # Dockerfile that exists today (infra/images/Dockerfile.api); add more
  # `matrix` entries here as further images land (never a second job).
  # ---------------------------------------------------------------------
  trivy:
    name: trivy
    # The image is built from infra/images/Dockerfile.api + the locked Python
    # deps; scanning it on PRs that touch neither is ~10 runner-minutes for a
    # result identical to main's. The nightly (E03-T12) rescans main daily.
    if: ${{ inputs.image_changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image under test (not pushed)
        run: docker build -f infra/images/Dockerfile.api -t candleviewer-api:ci .

      # #2555: the image ships the package without docs/plan. This imports the ENTRYPOINT
      # module (candleviewer.server) and the ASGI app it serves (candleviewer.main, what uvicorn
      # loads), which runs Settings(), configure_logging() and create_app() without entering
      # the lifespan (Postgres, network). Plain `python -c` from WORKDIR /app finds the package
      # as `python -m candleviewer.server` does; `-I` would drop /app from sys.path (the venv's
      # editable .pth names the builder's /build). Only the image just built (--pull never),
      # no network, no env or secrets beyond the image's own, read-only root as compose runs it.
      - name: Boot smoke - build the app inside the image
        timeout-minutes: 2
        run: >-
          docker run --rm --pull never --network none --read-only --tmpfs /tmp
          --entrypoint python candleviewer-api:ci
          -c 'import candleviewer.server, candleviewer.main as m;
          print("boot smoke OK:", len(m.app.routes), "routes")'

      # #2893 (ADR-0036): the same image, run the same way: `cvdev` cannot be imported, and a boot
      # with CV_ACCOUNT_FIXTURE set stops with the package-absent refusal. A PR-time early
      # warning; main.yml runs the binding copy before every image push.
      - name: Boot smoke - no dev-only package in the image (CI-IMG-006)
        timeout-minutes: 5
        run: python tools/ci/check_image_no_dev_modules.py --image candleviewer-api:ci

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candleviewer-api:ci
          format: sarif
          output: trivy.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"
          # Debian base-image CVEs with no upstream fix yet cannot be remediated
          # by us (the Dockerfile already applies apt security upgrades); they
          # would otherwise block every PR forever. Unfixed = tracked by the
          # weekly image rebuild (C-12.3); fixed-but-present = a real finding.
          ignore-unfixed: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install gate helper deps (PyYAML for security_gate.py)
        run: pip install -r scripts/requirements-ci.txt

      - name: Evaluate Trivy findings (security_gate.py, CI-SEC-001/004)
        run: python tools/ci/security_gate.py --tool trivy --report trivy.sarif

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # Upload only when the scanner wrote a report; the gate step above (not
        # this upload) decides pass/fail. Code scanning is on: run 39045664778 posted
        # the Trivy check run. continue-on-error: an upload outage must never mask the gate.
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy
