name: e2e-nightly

# #3383 (C-9.2, the nightly full Playwright matrix): calls the PR lane's own _job-e2e.yml on `main`,
# so the four e2e-web shards, e2e-staging, a11y-axe and e2e-electron run every night, including
# after changes that pr.yml's `e2e` filter leaves out on purpose, such as the root dependency
# manifests (docs/ci-runbook.md section 2). Since E10-Q02 e2e-electron runs on every call; the
# `electron` input stays. The `quarantine` input adds the leg that runs the `@flaky` tests (C-9.3). It is green since #3393: job 117609983250
# (e2e / e2e-electron) passed in run 39105058132, a proof run whose other jobs were cancelled.
# Not a required check (C-9.1 unchanged), but a red nightly blocks the next release (C-9.2): the
# release checklist needs a green run on the tip it cuts (docs/plan/07-release-and-prr.md §4.1).
# A red scheduled run comments on the one tracker issue that the repository variable
# CV_E2E_NIGHTLY_TRACKER_ISSUE names (#3449; named, never searched for, as in xstate-nightly.yml),
# or opens a P1 issue while the variable is unset, as the bar-determinism, perf and fixture-drift
# nightlies do. Only the `report` job can write; it runs no checkout and no action.
# No concurrency group (#3449), as in most nightlies: no run waits in a pending slot that a later
# one can take. A group shared with manual runs let two dispatches drop the scheduled run.
# Cost: seven jobs of about 1 to 1.5 minutes each (pr.yml medians), plus the short read-only
# ga-pack-health job (E49-Q01), each capped by CV_CI_TIMEOUT_MINUTES.

on:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e-nightly
    uses: ./.github/workflows/_job-e2e.yml
    with:
      electron: true
      # E10-Q02 (C-9.3): the quarantine leg, the only lane that runs `@flaky` tests.
      quarantine: true

  report:
    name: e2e-nightly-report
    needs: e2e
    # always(), not !cancelled(): a job that hits its timeout ends `cancelled` and must still be
    # reported (as in xstate-nightly.yml). A manual run is watched by whoever started it.
    if: ${{ always() && github.event_name == 'schedule' && needs.e2e.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report the red nightly on the tracker issue, or open one (C-9.2)
        # Only the runner's preinstalled gh CLI runs beside the write token; values reach the
        # script through env. TRACKER_ISSUE has no default: unset, it opens a P1 as before. A set
        # value must be an issue number of this repository, or the job fails and files nothing.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.e2e.result }}
          TRACKER_ISSUE: ${{ vars.CV_E2E_NIGHTLY_TRACKER_ISSUE }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="e2e-nightly (_job-e2e.yml) ended $RESULT on main at $GITHUB_SHA, and a red nightly"
          body+=" blocks the next release (C-9.2). Run: $run_url."
          body+=" Triage: docs/ci-runbook.md section 4 (CI-E2E-*, CI-A11Y-*, CI-BUILD-*)."
          body+=" If an Electron hardening check failed, follow SECURITY.md and keep the analysis"
          body+=" out of this public issue (C-12.13)."
          if [ -z "$TRACKER_ISSUE" ]; then
            gh issue create --title "e2e: nightly Playwright matrix failed ($(date -u +%F))" \
              --label qa --label area/frontend-platform --label priority/p1 \
              --body "$body"
          elif [[ "$TRACKER_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            gh issue comment "$TRACKER_ISSUE" --body "$body"
          else
            echo "::error title=e2e-nightly-report::CV_E2E_NIGHTLY_TRACKER_ISSUE is set but is" \
              "not an issue number, so nothing was filed. Set it to a positive integer or delete" \
              "it (docs/ci-runbook.md section 2)."
            exit 1
          fi

  # E49-Q01 (#1335 BQ-4, BQ-5): the GA pack's health, read-only (the `report` job stays the only
  # writer). It reads this run's jobs and shard reports and the last ten scheduled nights' reports
  # through the Actions API, then runs tools/qa/ga_pack_health.py, which writes the job summary:
  # CI-E2E-006 (wall-clock, first shard start to last shard end, over 2,700 s) and CI-E2E-007
  # (an unowned or overdue `@flaky` Playwright test), the flake report and, on Mondays, the shard
  # map (never committed). No job here gets the pack's 45 minutes as a timeout.
  ga-pack-health:
    name: e2e-nightly-ga-pack-health
    needs: e2e
    if: ${{ always() }}
    # Not enforcing until S6 accepts the pack as the GA reference; S6 flips it to enforcing in its
    # own PR, and from then a red ga-pack-health is a red nightly (C-9.2).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    permissions:
      contents: read
      actions: read # this run's jobs and artifacts, and past nightly runs' artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches with git

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch this run's jobs and shard reports, and the last ten scheduled nights' reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ga="$RUNNER_TEMP/ga"
          mkdir -p "$ga/current" "$ga/history"
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[]' > "$ga/jobs.jsonl"
          gh run download "$GITHUB_RUN_ID" --pattern 'e2e-*-report*' --dir "$ga/current" \
            || echo "::warning::no shard report in this run"
          ids=$(gh run list --workflow e2e-nightly.yml --event schedule --status completed \
            --limit 11 --json databaseId --jq '.[].databaseId')
          n=0
          for id in $ids; do
            [[ "$id" =~ ^[0-9]+$ && "$id" != "$GITHUB_RUN_ID" ]] || continue
            [ "$n" -lt 10 ] || break
            n=$((n + 1))
            gh run download "$id" --pattern 'e2e-*-report*' --dir "$ga/history/$id" \
              || echo "run $id has no shard report (older than the upload, or expired)"
          done

      - name: GA pack health (CI-E2E-006, CI-E2E-007, flake report, Monday shard map)
        run: |
          ga="$RUNNER_TEMP/ga"
          python -m tools.qa.ga_pack_health --jobs "$ga/jobs.jsonl" --current "$ga/current" \
            --history "$ga/history" --today "$(date -u +%F)"
