name: _job-contract

# E03-T06: contract conformance lane (ADR-0013 pipeline shape "[contract] OpenAPI/WS
# schema conformance + protocol codec round-trip", binding rule 3).
#
# Runs three conformance surfaces:
#   1. OpenAPI structural validity + server-route drift
#      (services/api/tests/contract/test_openapi_conformance.py, CI-CON-001).
#   2. WS schema / protocol codec round-trip (packages/protocol's own vitest
#      suite: ws-schema-drift.test.ts, runtime-binary.test.ts,
#      generated-guard.test.ts) plus the generated-models contract suite
#      (services/api/tests/contract/test_generate_protocol_models.py).
#   3. Schemathesis fuzz on /v1 (CONSTITUTION §9 check 6) — deferred until a
#      real /v1 route exists to fuzz (R0 has none beyond health/metrics);
#      tracked as a follow-up once E04+ lands the first REST route, so this
#      step is a documented placeholder rather than a silent no-op.
#
# CI-CON-001 (route/field drift) is raised by
# candleviewer/api/contract_conformance.py; WS/codec drift codes are owned
# by E02-T09 (ws-schema-drift.test.ts) and E03-T05 (the `gates` job's `gen` step, CI-GEN-*).

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  CV_CI_ALLOWED_HOSTS: ""

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (services/api contract suite)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen (fails if pyproject.toml drifted from uv.lock)
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: OpenAPI structural validity + server-route drift (CI-CON-001)
        working-directory: services/api
        # tests/contract's perf budgets run here on purpose (and in py-perf): see ON_PURPOSE in
        # scripts/tests/test_workflow_pytest_markers.py.
        run: uv run pytest tests/contract -m "not integration and not fuzz and not harness and not flaky" --no-cov

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: WS schema conformance + protocol codec round-trip (packages/protocol)
        run: pnpm --filter @candleviewer/protocol test

      - name: ws_message_schemas gate (E17-T01, 23-ws-protocol.md 16.5)
        # Offline: bundle freshness, generated-constants freshness, meta-validation,
        # $ref closure and every section 12 example frame. Prints schema/example counts.
        # Also runs the E17-T05 blocking gate error_registry_single_source.
        run: make contracts

      - name: Schemathesis fuzz on /v1 (deferred — no /v1 route exists yet)
        run: |
          echo "No REST route beyond /healthz, /readyz, /metrics exists in R0 (services/api/candleviewer/app.py)."
          echo "Schemathesis fuzz on /v1 activates once the first /v1 route lands; tracked in the owning epic's ticket, not skipped silently."
