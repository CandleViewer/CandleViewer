name: release

# #3099 (the #2341 ruling's release contract; docs/plan/07-release-and-prr.md §3-§4, ADR-0013
# "release tag -> changelog -> Electron installers (signed) -> release checklist + PRR gate").
# Releases are cut from `main` only and roll forward. A merged release-prep PR
# (`chore(infra-devops): prepare release X.Y.Z`, CHANGELOG.md + version.txt only) is the
# candidate C; this run is the only creator of `v*` tags:
#
#   classify -> verify -> e2e (_job-e2e.yml at C) + sbom -> tag-draft -> build -> sign-attach
#
# - classify: a push to main touching CHANGELOG.md or version.txt names its one candidate
#   (`prepare_release.py --classify` over the push's first-parent commits); none ends the run
#   green, two or more is CI-REL-005. A dispatch from main gives C (`candidate`, 40 lowercase
#   hex), with `dry_run` (default true) and the owner's 1.0.0 declaration (C-15.9). In every
#   mode, dry run included, C must be an ancestor of origin/main (CI-REL-005 otherwise) before
#   classify runs; classify then runs over C's own first-parent change (C^..C; C alone for a
#   root commit) and refuses it with CI-REL-005 unless it names exactly C, so a dispatch can only
#   re-run a release candidate on main. A refused dispatch fails classify, and every later job
#   (verify, e2e, sbom, build) needs classify's success and a non-empty candidate.
# - verify: `prepare_release.py --verify` (identity, tag history, version, completeness, C
#   reachable from origin/main) and C GitHub-verified (04 §12.3); CI-REL-005 / CI-REL-002.
# - e2e: _job-e2e.yml checked out at C (C-9.1 #8, C-15.8), e2e-electron included.
# - sbom: three CycloneDX SBOMs at C (SR-133), generated by syft (`syft-version` set on each
#   step), validated (CI-REL-006), diffed against the previous release's. Read-only. Inputs:
#   `api` describes the services/api source tree, resolved through its uv.lock; `web` describes
#   the web app's `pnpm deploy --prod` closure (its production dependencies); `desktop`
#   describes the desktop app's full `pnpm deploy` build closure (a superset of the AppImage's
#   contents: it lists build tools too). None is generated from the AppImage itself.
# - tag-draft: re-verifies, then tags vV at C (annotated, REST, never moved), finds or creates
#   the `[Release]: vV checklist` issue, drafts the release from the V section, attaches the
#   SBOMs and posts their diff to the checklist issue.
# - build: builds web + desktop at C, runs the electron-hardening gate on those dists, packages
#   the Linux AppImage and uploads it as a run artefact; no installer is CI-REL-003. It holds
#   `contents: read` only.
# - sign-attach: checks out no repository code and runs no build; it downloads the installer
#   and the three SBOMs, signs and verifies each with keyless cosign (identity release.yml on
#   refs/heads/main; one `.sigstore.json` bundle per file), re-checks the release is still a
#   draft and attaches them with their bundles. It alone holds `id-token: write`.
#
# A dry run verifies (reporting without failing), runs the e2e gate and the SBOMs, and skips
# build and every write job. Nothing is created before verify, e2e and the SBOMs pass. The run never
# pushes a branch and never moves or deletes a tag; every write is idempotent, so a re-run on C
# creates no second tag, issue, release or comment and replaces a draft's assets (--clobber).
# A published release is immutable (C-15.7): the draft step refuses it (CI-REL-005) and the
# sign-attach upload re-checks it is still a draft, so a re-dispatch on a shipped candidate
# replaces nothing. A refused candidate in a dry run still has the e2e gate and
# the SBOMs run at C (read-only token), by design: the dry run reports what the gate finds.
# Publication stays manual behind the PRR gate (CI-REL-004). Inputs and computed values reach
# scripts only through env. Out of scope: the PRR itself, Windows/macOS installers and their
# signing secrets (owner item), prod deploy (07 §4.4).

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md, version.txt]
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate commit on main (40 lowercase hex)"
        type: string
        required: true
      dry_run:
        description: "true: verify (report only), e2e gate and SBOMs; create nothing"
        type: choice
        options: ["true", "false"]
        default: "true"
      RELEASE_ALLOW_1_0_0:
        description: "Declare the first 1.0.0 (an owner act, C-15.9)"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.dispatch.outputs.candidate || steps.classify.outputs.candidate }}
      dry_run: ${{ steps.inputs.outputs.dry_run }}
      allow_1_0_0: ${{ steps.inputs.outputs.allow_1_0_0 }}
    steps:
      - name: Refuse a ref other than main and check the dispatch inputs (SR-137)
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_CANDIDATE: ${{ inputs.candidate }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_ALLOW: ${{ inputs.RELEASE_ALLOW_1_0_0 }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::CI-REL-005: the release run runs only from refs/heads/main"
            exit 1
          fi
          if [ "$EVENT" != "workflow_dispatch" ]; then
            { echo "dry_run=false"; echo "allow_1_0_0=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$IN_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::CI-REL-005: candidate must be a full commit sha (40 lowercase hex)"
            exit 1
          fi
          for value in "$IN_DRY_RUN" "$IN_ALLOW"; do
            case "$value" in
              true | false) ;;
              *) echo "::error::CI-REL-005: dry_run and RELEASE_ALLOW_1_0_0 take true or false"; exit 1 ;;
            esac
          done
          {
            echo "requested=$IN_CANDIDATE"
            echo "dry_run=$IN_DRY_RUN"
            echo "allow_1_0_0=$IN_ALLOW"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Name the push's one release candidate (none ends the run; two is CI-REL-005)
        id: classify
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          rc=0
          python tools/ci/prepare_release.py --classify --rev "$AFTER" --before "$BEFORE" \
            > "$RUNNER_TEMP/classify.out" || rc=$?
          cat "$RUNNER_TEMP/classify.out"
          [ "$rc" -eq 0 ] || exit "$rc"
          grep -E '^candidate=([0-9a-f]{40})?$' "$RUNNER_TEMP/classify.out" >> "$GITHUB_OUTPUT"

      # The checkout above (fetch-depth 0) fetches every branch, so origin/main is its full history.
      - name: Classify the dispatched candidate's own change (CI-REL-005 unless on main and named)
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED: ${{ steps.inputs.outputs.requested }}
        run: |
          set -euo pipefail
          # Every mode, dry run included: only a commit on main's line is ever a candidate.
          if [ -z "$REQUESTED" ] || ! git merge-base --is-ancestor "$REQUESTED" origin/main; then
            echo "::error::CI-REL-005: $REQUESTED is not an ancestor of origin/main; a dispatch" \
              "runs only on a commit of main"
            exit 1
          fi
          before=()
          if parent="$(git rev-parse -q --verify "$REQUESTED^1")"; then
            before=(--before "$parent")
          fi
          rc=0
          python tools/ci/prepare_release.py --classify --rev "$REQUESTED" "${before[@]}" \
            > "$RUNNER_TEMP/classify.out" || rc=$?
          cat "$RUNNER_TEMP/classify.out"
          [ "$rc" -eq 0 ] || exit "$rc"
          found="$(grep -E '^candidate=([0-9a-f]{40})?$' "$RUNNER_TEMP/classify.out" || true)"
          if [ -z "$REQUESTED" ] || [ "$found" != "candidate=$REQUESTED" ]; then
            echo "::error::CI-REL-005: classify does not name $REQUESTED as the candidate of its" \
              "own change (got '${found:-nothing}'): a dispatch re-runs only a prep merge"
            exit 1
          fi
          printf '%s\n' "$found" >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: classify
    if: needs.classify.result == 'success' && needs.classify.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # No concurrency group: verify writes nothing, and a dry run (which skips both write jobs)
    # must never enter release-<C>, where its pending job could cancel a real run's pending one.
    outputs:
      version: ${{ steps.decide.outputs.version }}
      verified: ${{ steps.decide.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify the candidate (identity, tag history, version, completeness, provenance)
        id: contract
        env:
          CANDIDATE: ${{ needs.classify.outputs.candidate }}
          ALLOW_1_0_0: ${{ needs.classify.outputs.allow_1_0_0 }}
        run: |
          set -euo pipefail
          args=(--verify --rev "$CANDIDATE" --main-ref origin/main --section-out "$RUNNER_TEMP/section.md")
          if [ "$ALLOW_1_0_0" = "true" ]; then args+=(--allow-1-0-0); fi
          rc=0
          python tools/ci/prepare_release.py "${args[@]}" > "$RUNNER_TEMP/verify.out" || rc=$?
          cat "$RUNNER_TEMP/verify.out"
          grep -E '^version=[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/verify.out" >> "$GITHUB_OUTPUT" || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: The candidate is GitHub-verified (04 §12.3)
        id: github
        env:
          CANDIDATE: ${{ needs.classify.outputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          python tools/ci/release_run.py verified --candidate "$CANDIDATE" > "$RUNNER_TEMP/github.out" \
            || rc=$?
          cat "$RUNNER_TEMP/github.out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Decide (a dry run reports a refusal without failing; nothing is created either way)
        id: decide
        env:
          CONTRACT_RC: ${{ steps.contract.outputs.rc }}
          GITHUB_RC: ${{ steps.github.outputs.rc }}
          VERSION: ${{ steps.contract.outputs.version }}
          DRY_RUN: ${{ needs.classify.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$CONTRACT_RC" = "0" ] && [ "$GITHUB_RC" = "0" ] && [ -n "$VERSION" ]; then
            { echo "version=$VERSION"; echo "verified=true"; } >> "$GITHUB_OUTPUT"
            echo "Candidate verified as v$VERSION."
            exit 0
          fi
          echo "verified=false" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::CI-REL-005: dry run: this candidate would be refused (findings above)"
            exit 0
          fi
          echo "::error::CI-REL-005: the candidate is refused (findings above); nothing is created"
          exit 1

  e2e:
    name: e2e
    needs: [classify, verify]
    if: needs.classify.result == 'success' && needs.classify.outputs.candidate != ''
    permissions:
      contents: read
    uses: ./.github/workflows/_job-e2e.yml
    with:
      ref: ${{ needs.classify.outputs.candidate }}
      electron: true

  sbom:
    name: sbom
    needs: [classify, verify]
    if: needs.classify.result == 'success' && needs.classify.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm deploy` writes each app's own dependency closure and lockfile (the web app's
      # production dependencies; the desktop app declares none, so its build closure).
      - name: Stage the web and desktop apps' dependency closures
        run: |
          set -euo pipefail
          pnpm --filter @candleviewer/web deploy --prod "$RUNNER_TEMP/sbom-src/web"
          pnpm --filter @candleviewer/desktop deploy "$RUNNER_TEMP/sbom-src/desktop"

      # syft-version is the release the pinned sbom-action v0.24.3 defaults to, set explicitly so
      # the generator is recorded in the workflow; bump it with the action pin.
      - name: Backend SBOM (services/api source tree with its uv.lock, SR-133)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: services/api
          format: cyclonedx-json
          syft-version: v1.54.0
          output-file: sbom-api.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Web app SBOM (its pnpm deploy --prod closure, SR-133)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom-src/web
          format: cyclonedx-json
          syft-version: v1.54.0
          output-file: sbom-web.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Desktop app SBOM (its full pnpm deploy build closure, SR-133)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom-src/desktop
          format: cyclonedx-json
          syft-version: v1.54.0
          output-file: sbom-desktop.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate the three SBOMs (CI-REL-006 names a missing, empty or invalid one)
        run: |
          set -euo pipefail
          failed=0
          for artefact in api web desktop; do
            python tools/ci/validate_sbom.py --sbom "sbom-$artefact.cdx.json" --artefact "$artefact" \
              || failed=1
          done
          exit "$failed"

      - name: Find the previous release (the nearest final tag before this version)
        id: previous
        env:
          CANDIDATE: ${{ needs.classify.outputs.candidate }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          exclude=()
          if [ -n "$VERSION" ]; then exclude=(--exclude "v$VERSION"); fi
          python tools/ci/release_run.py previous-tag --rev "$CANDIDATE" "${exclude[@]}" \
            > "$RUNNER_TEMP/previous.out"
          cat "$RUNNER_TEMP/previous.out"
          grep -E '^previous=(v[0-9]+\.[0-9]+\.[0-9]+)?$' "$RUNNER_TEMP/previous.out" >> "$GITHUB_OUTPUT"

      - name: Download the previous release's SBOMs (no previous release, no baseline)
        if: steps.previous.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sbom-*.cdx.json' --dir "$RUNNER_TEMP/previous" \
            || echo "::warning::no SBOM assets on release $PREVIOUS: the diff has no baseline"

      - name: Diff each SBOM against the previous release's (review aid, posted on the checklist)
        env:
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          set -euo pipefail
          {
            echo "## SBOM diff vs ${PREVIOUS:-no previous release} (SR-133)"
            echo
            for artefact in api web desktop; do
              python tools/ci/sbom_diff.py --current "sbom-$artefact.cdx.json" \
                --previous "$RUNNER_TEMP/previous/sbom-$artefact.cdx.json" \
                --heading "### $artefact"
            done
          } > sbom-diff.md
          cat sbom-diff.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sboms
          path: |
            sbom-api.cdx.json
            sbom-web.cdx.json
            sbom-desktop.cdx.json
            sbom-diff.md
          if-no-files-found: error
          retention-days: 7

  tag-draft:
    name: tag-draft
    needs: [classify, verify, e2e, sbom]
    if: needs.classify.outputs.dry_run == 'false' && needs.verify.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    concurrency:
      group: release-${{ needs.classify.outputs.candidate }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.reverify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Re-verify the candidate right before tagging (its V section is the release body)
        id: reverify
        env:
          CANDIDATE: ${{ needs.classify.outputs.candidate }}
          ALLOW_1_0_0: ${{ needs.classify.outputs.allow_1_0_0 }}
          VERIFIED: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          args=(--verify --rev "$CANDIDATE" --main-ref origin/main --section-out "$RUNNER_TEMP/section.md")
          if [ "$ALLOW_1_0_0" = "true" ]; then args+=(--allow-1-0-0); fi
          rc=0
          python tools/ci/prepare_release.py "${args[@]}" > "$RUNNER_TEMP/verify.out" || rc=$?
          cat "$RUNNER_TEMP/verify.out"
          [ "$rc" -eq 0 ] || exit "$rc"
          version="$(grep -E '^version=[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/verify.out" | cut -d= -f2)"
          if [ "$version" != "$VERIFIED" ]; then
            echo "::error::CI-REL-005: re-verify found v$version, verify found v$VERIFIED"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag vV at the candidate (annotated; a no-op when there, never moved)
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.classify.outputs.candidate }}
          VERSION: ${{ steps.reverify.outputs.version }}
        run: python tools/ci/release_run.py tag --candidate "$CANDIDATE" --version "$VERSION"

      - name: Find or create the release-checklist issue (CI-REL-004)
        id: checklist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.reverify.outputs.version }}
        run: |
          set -euo pipefail
          python tools/ci/release_run.py checklist --version "$VERSION" > "$RUNNER_TEMP/checklist.out"
          cat "$RUNNER_TEMP/checklist.out"
          grep -E '^issue=[0-9]+$' "$RUNNER_TEMP/checklist.out" >> "$GITHUB_OUTPUT"

      - name: Draft the release from the V section (publication stays manual, CI-REL-004)
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.classify.outputs.candidate }}
          VERSION: ${{ steps.reverify.outputs.version }}
        run: >-
          python tools/ci/release_run.py draft --candidate "$CANDIDATE" --version "$VERSION"
          --notes-file "$RUNNER_TEMP/section.md"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sboms
          path: sboms

      - name: Attach the SBOMs and their diff to the draft (re-runs replace them)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.reverify.outputs.version }}
        run: >-
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber
          sboms/sbom-api.cdx.json sboms/sbom-web.cdx.json sboms/sbom-desktop.cdx.json
          sboms/sbom-diff.md

      - name: Post the SBOM diff on the checklist issue (one comment, edited on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.checklist.outputs.issue }}
          VERSION: ${{ steps.reverify.outputs.version }}
        run: >-
          python tools/ci/release_run.py comment --issue "$ISSUE" --version "$VERSION"
          --body-file sboms/sbom-diff.md

  build:
    name: build
    needs: [classify, tag-draft]
    if: >-
      needs.classify.result == 'success' && needs.classify.outputs.candidate != ''
      && needs.classify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds the candidate's tree and installs its dependencies: read-only, no signing identity.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.candidate }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron ships no postinstall: the SR-138 runner fetches its binary (#1819).
      - name: Fetch the Electron binary (SR-138 allowlist runner)
        run: node tools/ci/run-allowed-postinstall.mjs

      - name: Build the workspace packages apps/web depends on
        run: pnpm --filter "@candleviewer/web^..." run build

      - name: "Guard: the packages apps/web imports are built (fails fast, CI-BUILD-001)"
        run: node tools/ci/check_built_exports.mjs packages/ui packages/chart-engine packages/protocol

      - name: Build the web and desktop dists the installer packages (#3518)
        run: pnpm --filter @candleviewer/web --filter @candleviewer/desktop build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # #3518: the gate scans exactly the dists build:installer packages, as _job-js.yml's build
      # job runs it on its own build.
      - name: Electron-hardening gate on these dists, right before packaging (SR-110..SR-119)
        run: |
          set -euo pipefail
          xvfb-run -a node apps/desktop/scripts/collect-hardening-facts.mjs hardening-facts.json
          python tools/ci/electron_hardening_gate.py --desktop-dist apps/desktop/dist \
            --web-dist apps/web/dist --builder-config apps/desktop/electron-builder.yml \
            --facts hardening-facts.json --require-runtime

      # R0 ships the Linux AppImage only (owner item: Windows/macOS runners and their signing).
      - name: Package the installer (build:installer, Linux AppImage, no publishing)
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.tag-draft.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('path').dirname(require.resolve('electron/package.json'))")"
          pnpm run build:installer --linux AppImage --publish never \
            -c.electronDist="$pkg/dist" -c.extraMetadata.version="$VERSION"

      - name: The builder produced the installer (none is CI-REL-003)
        run: |
          set -euo pipefail
          shopt -s nullglob
          artefacts=(apps/desktop/release/*.AppImage)
          if [ "${#artefacts[@]}" -eq 0 ]; then
            echo "::error::CI-REL-003: no installer in apps/desktop/release; nothing is signed or attached"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  sign-attach:
    name: sign-attach
    needs: [classify, sbom, tag-draft, build]
    if: needs.classify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with a signing identity: no repository checkout, no dependency install, no
    # build; it signs the artefacts the read-only jobs produced and attaches them to the draft.
    permissions:
      contents: write
      id-token: write # keyless cosign signing (SR-137, as main.yml signs its image)
    concurrency:
      group: release-${{ needs.classify.outputs.candidate }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer
          path: installer

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sboms
          path: sboms

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the installer and the SBOMs (keyless cosign; CI-REL-003)
        run: |
          set -euo pipefail
          shopt -s nullglob
          artefacts=(installer/*.AppImage)
          if [ "${#artefacts[@]}" -eq 0 ]; then
            echo "::error::CI-REL-003: no installer in the build artefact; nothing is signed or attached"
            exit 1
          fi
          sboms=(sboms/sbom-api.cdx.json sboms/sbom-web.cdx.json sboms/sbom-desktop.cdx.json)
          for f in "${sboms[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::CI-REL-006: $f is missing or empty; nothing is signed or attached"
              exit 1
            fi
          done
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          for f in "${artefacts[@]}" "${sboms[@]}"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done

      - name: Attach the signed installer and SBOMs to the draft (re-runs replace; never a published one)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag-draft.outputs.version }}
        run: |
          set -euo pipefail
          draft="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "::error::CI-REL-005: release v$VERSION is published; its assets are immutable (C-15.7)"
            exit 1
          fi
          shopt -s nullglob
          files=(installer/*.AppImage installer/*.AppImage.sigstore.json)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::CI-REL-003: the installer or its signature bundle is missing"
            exit 1
          fi
          for artefact in api web desktop; do
            for f in "sboms/sbom-$artefact.cdx.json" "sboms/sbom-$artefact.cdx.json.sigstore.json"; do
              if [ ! -s "$f" ]; then
                echo "::error::CI-REL-006: $f is missing; the SBOMs are attached with their bundles"
                exit 1
              fi
              files+=("$f")
            done
          done
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
