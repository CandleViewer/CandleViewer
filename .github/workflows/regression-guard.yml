name: regression-guard

# E49-T01: regression guard (runs non-required until a C-16 amendment lists it in C-9.1). A PR that closes a Bug issue must change a test
# file, or the issue carries p3-cosmetic-exempt with a stated reason (§11.3).
# Runs on pull_request (read-only token); checks out the base-trusted merge ref only
# to run repository tooling - no secrets beyond the read-only GITHUB_TOKEN.

on:
  pull_request:
    # #3751: the guard reads the PR's files and body (its `Closes #N` lines) and each closed
    # issue's own labels, never the PR's labels, so a PR label event changes nothing it reads.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

# #3751: each body edit or push replaces the PR's previous run instead of queueing behind it.
concurrency:
  group: regression-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: Guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m tools.triage.run guard --number "${{ github.event.pull_request.number }}"
