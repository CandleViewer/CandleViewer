name: _job-engine-bench

# E03-T14 (ADR-0013 binding rule 4, Amendment 7): the required `engine-bench` lane (C-9.1 #16).
# Chart-engine benchmarks B1-B5 and B9, the median of 5 repetitions, against the stored baseline,
# a regression above 5 % failing the job. The check name stays `engine-bench` (the caller job in
# pr.yml); nothing here renames it.
#
# HARD PRECONDITION (security): before a runner is registered or CV_GPU_BENCH_RUNNER is set, the
# runner sits in an ORGANISATION runner group with a workflow allow-list (it is not attached to the
# repository directly), or behind K01's host pre-job check. E03-K01 marks plan-tier allow-list
# support UNVERIFIED, so confirm it first. Without runner-side admission control any workflow able
# to name the label could run on the host; this file's event policy alone is not enough.
#
# Where it runs (docs/plan/spikes/E03-K01.md section 5, policy P4):
#  * gpu      the self-hosted GPU runner named by the repository variable CV_GPU_BENCH_RUNNER (a
#             JSON label array), ONLY for merge_group, schedule and workflow_dispatch on main. The
#             regression gate is enforced (--enforce, CI-BEN-001). The runner's isolation (O1:
#             ephemeral, non-root, no host mounts, read-only root, no secrets, egress allow-list) is
#             enforced by its host, not by this file.
#  * fallback GitHub-hosted ubuntu-latest, headless Chromium on SwiftShader. This is the ACTIVE path
#             until the owner registers a runner, and always the path for pull_request events (forks
#             included). It records the comparison and fails only on a run that did not finish.
#             Software-GL numbers are never reference-hardware evidence.
# The route job (tools/ci/gpu_runner_health.py) decides by event policy and the variable, holds no
# secret (a lane gets none, ADR-0013 rule 6), prints the reason (CI-BEN-004 none registered) and
# never pretends a GPU exists. The fallback is taken only when the variable is unset or malformed
# (a malformed one also alerts) or the event policy says so; with a valid variable set a busy,
# offline or missing runner QUEUES the job. Runner health is the hourly gpu-runner-health.yml's
# job (CI-BEN-003, including 3 consecutive busy checks); the owner re-routes by unsetting the
# variable. The matrix driver's
# Chromium arm takes its flag set from BENCH_MODE (E11-T06 PR-2, ruling 6583339161): the gpu route
# passes --flagset hardware-gl (ANGLE on the host GL driver, GPU rasterization), the fallback keeps
# the K01 pinned software-GL set (pinned-k01); both live in bench/matrix/matrix-lib.mjs
# (CHROMIUM_FLAGSETS). Runbook: docs/ci-runbook.md (CI-BEN-001..004). The cheap wall-clock budgets
# run in both modes.
#
# E11-T06 PR-2 (#449, rulings 6578234464): the REAL engine's scenarios (B1, B2, B5, B6, B9 x 5;
# stubs B3, B4, B7, B8) run on whichever route the route job chose; this file adds no runs-on.
# Pull requests and the fallback record; only the gpu route passes --enforce (5 % on frame time,
# draw calls and memory, plus 26 section 13's absolute gates, B6's worker CPU among them, which
# SwiftShader would trip by itself). Baselines: one file per runner class in
# packages/chart-engine/bench/engine/baselines/, behind the PENDING.md switch, which fails closed
# once any baseline file exists (bench/engine/baseline-select.mjs); ci-compare.mjs's
# not-like-for-like rule applies inside a class. B10's 30-minute soak runs nightly on the schedule
# route below. engine-bench-comment.yml (workflow_run) posts the numbers; not a required name.

on:
  workflow_call: {}
  # E11-T06 PR-2 (ruling BQ-05): the nightly B10 soak, on the schedule route (gpu when a runner is
  # registered, else the hosted fallback, recorded). Not a required name: nothing waits on it.
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  route:
    name: engine-bench-route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      runs_on: ${{ steps.route.outputs.runs_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Choose the runner (GPU only on merge_group, schedule and dispatch on main)
        id: route
        env:
          CV_GPU_BENCH_RUNNER: ${{ vars.CV_GPU_BENCH_RUNNER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -I tools/ci/gpu_runner_health.py route

  bench:
    name: engine-bench-run
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    # timeout-minutes starts only once a runner picks the job up: a queued self-hosted job waits up to
    # 24 h or the queue's check timeout (docs/ci-runbook.md CI-BEN-003). No concurrency group here: GitHub
    # keeps one pending job per group and cancels older ones, which would drop merge-queue entries; the
    # self-hosted runner runs one job at a time itself.
    # The nightly adds B10's 30-minute soak to the per-PR work.
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 45 }}
    env:
      BENCH_MODE: ${{ needs.route.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/ci/run-allowed-postinstall.mjs
      - name: Wall-clock perf budgets (vitest perf project, no coverage)
        run: pnpm --filter @candleviewer/chart-engine test:perf
      - name: CVWB decode perf budgets, 23 section 16.3 (E17-T02, no coverage)
        run: pnpm --filter @candleviewer/protocol test:perf
      - name: Rule-graph adapter budgets, 200 nodes (E37-T01, no coverage)
        run: pnpm --filter @candleviewer/rule-graph test:perf
      # A GPU host ships its browser and system libraries (its image is the owner's); the hosted
      # fallback installs the lockfile's Chromium as perf-engine-matrix.yml does.
      - name: Install the lockfile's Playwright Chromium (hosted fallback only)
        if: ${{ needs.route.outputs.mode != 'gpu' }}
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium
      # E11-T06 PR-2: hardware GL on the gpu route only; the hosted fallback stays on SwiftShader.
      - name: Choose the Chromium flag set (hardware GL on the gpu route, software GL otherwise)
        run: |
          flagset=pinned-k01
          if [ "$BENCH_MODE" = "gpu" ]; then flagset=hardware-gl; fi
          echo "CHROMIUM_FLAGSET=$flagset" >> "$GITHUB_ENV"
      # continue-on-error: the harness exits 1 on a run error; the compare step re-reads the report
      # and fails the job then (CI-BEN-002), after the summary is written and the artefact kept.
      - name: Run the matrix, 5 repetitions (C-9.1 #16), headless Chromium
        continue-on-error: true
        working-directory: packages/chart-engine
        run: >-
          node bench/matrix/run-matrix.mjs --runtime chromium --reps 5 --flagset "$CHROMIUM_FLAGSET"
          --scenarios B1,B2,B3,B4,B5,B9 --out-dir "$RUNNER_TEMP/matrix"
      - name: Compare with the committed baseline (enforced on the GPU runner, recorded on the fallback)
        working-directory: packages/chart-engine
        run: |
          enforce=()
          if [ "$BENCH_MODE" = "gpu" ]; then enforce=(--enforce); fi
          node bench/matrix/ci-compare.mjs --runtime chromium --report-dir "$RUNNER_TEMP/matrix" \
            --baseline bench/matrix/baselines/chromium-ubuntu-latest.json \
            --summary "$GITHUB_STEP_SUMMARY" "${enforce[@]}"
      # E11-T06 PR-2: the real-engine scenarios. The baseline is picked first so a stale pending
      # switch fails the run before any minute is spent.
      - name: Pick the real-engine baseline for this runner class (pending switch, fails closed)
        id: engine-baseline
        working-directory: packages/chart-engine
        run: |
          enforce=()
          if [ "$BENCH_MODE" = "gpu" ]; then enforce=(--enforce); fi
          node bench/engine/baseline-select.mjs --dir bench/engine/baselines --mode "$BENCH_MODE" \
            --output "$GITHUB_OUTPUT" "${enforce[@]}"
      - name: Build the engine, dist/bench-engine.js included
        run: pnpm --filter @candleviewer/chart-engine build
      # The harness exits 1 on a run error; its code is kept and the compare step fails the job
      # with it after the summary is written. This PR adds no continue-on-error (the only one on
      # this job is #5414's matrix step above).
      - name: Run the real-engine scenarios, 5 repetitions (C-9.1 #16), headless Chromium
        id: engine-run
        working-directory: packages/chart-engine
        run: |
          rc=0
          node bench/matrix/run-matrix.mjs --page engine --runtime chromium --reps 5 \
            --flagset "$CHROMIUM_FLAGSET" --out-dir "$RUNNER_TEMP/engine" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Compare the real-engine scenarios (enforced on the GPU runner only, recorded otherwise)
        working-directory: packages/chart-engine
        env:
          ENGINE_BASELINE: ${{ steps.engine-baseline.outputs.baseline }}
          ENGINE_RC: ${{ steps.engine-run.outputs.rc }}
        run: |
          mkdir -p "$RUNNER_TEMP/engine-numbers"
          args=(--runtime chromium --report-dir "$RUNNER_TEMP/engine" --summary "$GITHUB_STEP_SUMMARY"
            --json "$RUNNER_TEMP/engine-numbers/numbers.json")
          if [ -n "$ENGINE_BASELINE" ]; then args+=(--baseline "$ENGINE_BASELINE"); fi
          # --enforce on the GPU lane alone (B6's worker CPU gate is recorded on SwiftShader).
          if [ "$BENCH_MODE" = "gpu" ]; then args+=(--enforce); fi
          node bench/matrix/ci-compare.mjs "${args[@]}"
          if [ "$ENGINE_RC" != "0" ]; then
            echo "::error title=engine-bench::CI-BEN-002: the real-engine harness exited $ENGINE_RC"
            exit 1
          fi
      # B10 nightly only (ruling BQ-05): its absolute gate (growth <= 5 %) is enforced on the gpu
      # route; it has no relative baseline. It runs even when the per-PR set failed above.
      - name: B10 soak, 30 minutes (nightly schedule only)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        working-directory: packages/chart-engine
        run: |
          rc=0
          node bench/matrix/run-matrix.mjs --page engine --runtime chromium --scenarios B10 \
            --flagset "$CHROMIUM_FLAGSET" --out-dir "$RUNNER_TEMP/engine-soak" || rc=$?
          enforce=()
          if [ "$BENCH_MODE" = "gpu" ]; then enforce=(--enforce); fi
          node bench/matrix/ci-compare.mjs --runtime chromium --report-dir "$RUNNER_TEMP/engine-soak" \
            --summary "$GITHUB_STEP_SUMMARY" "${enforce[@]}"
          if [ "$rc" != "0" ]; then
            echo "::error title=engine-bench::CI-BEN-002: the B10 soak harness exited $rc"
            exit 1
          fi
      - name: Upload the real-engine reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-bench-engine
          path: |
            ${{ runner.temp }}/engine/
            ${{ runner.temp }}/engine-soak/
          if-no-files-found: warn
          retention-days: 30
      # The comment job's only input: validated again there, never trusted as text.
      - name: Upload the real-engine numbers (engine-bench-comment.yml)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-bench-numbers
          path: ${{ runner.temp }}/engine-numbers/numbers.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the matrix report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-bench-matrix
          path: ${{ runner.temp }}/matrix/
          if-no-files-found: warn
          retention-days: 30
