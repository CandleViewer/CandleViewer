# benchmarks B1-B10 on the pinned self-hosted GPU runner, >10% regression
# gate against the stored baseline) per ADR-0013 binding rule 4.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  engine-bench-stub:
    name: engine-bench (stub — see E03-T14)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install -g corepack@latest && corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/ci/run-allowed-postinstall.mjs
      - name: Wall-clock perf budgets (vitest perf project, no coverage)
        run: pnpm --filter @candleviewer/chart-engine test:perf
      - name: CVWB decode perf budgets, 23 section 16.3 (E17-T02, no coverage)
        run: pnpm --filter @candleviewer/protocol test:perf
      - name: Placeholder (E03-T14 fills in GPU benchmark run + baseline diff)
        run: echo "engine-bench lane stub — implemented by E03-T14"
