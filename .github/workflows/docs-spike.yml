# E48-K01 (#1328) docs-toolchain spike: scaffold a 20-page fixture per candidate,
# install deps over the network, then build inside `docker run --network=none`.
# Opt-in via the `run-docs-spike` label (or manual dispatch). Not a required check.
name: docs-spike

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

# #3751: a push or a relabel replaces the PR's previous run; a dispatched run is never cancelled.
concurrency:
  group: docs-spike-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-toolchain-spike:
    name: docs-toolchain-spike
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-docs-spike') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure docs candidates (offline builds)
        run: python3 docs/plan/spikes/E48-K01-harness/measure.py

      - name: Upload docs spike report (E48-K01)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-spike-report
          path: build/reports/docs-spike.json
          if-no-files-found: error
