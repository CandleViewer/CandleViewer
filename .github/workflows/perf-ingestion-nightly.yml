name: perf-ingestion-nightly
# E08-T06: ingestion soak (30-minute canary) + 5x burst regression. Recorded-not-gating
# in R0 (30-release-roadmap 4.4): runs nightly, never on PRs. Synthetic feed only - no
# network egress to the exchange (C-13.5). The 24 h demo soak is a manual run (exception #1778 A).
# E08-Q04: + the seven-scenario perf pack (bench/ingestion) vs bench/baselines/e08 (WARN > 10 %,
# FAIL > per-metric band, only against a same-machine-profile, non-warn-only baseline: the
# committed baselines are laptop numbers, so this only WARNs until a CI-runner baseline is
# recorded). Full profile: on a dispatch with profile=full (24 h soak + k6), rest_k6 weekly.
# #399 D2-G4: the pack's soak_bars is the soak with the bars path at its cap, bar builders and the
# WS series store at 32 specs x 1 000 bars a symbol (budget #8). Its smoke runs in both pack
# steps below: 28 s each on the laptop that recorded its baseline, where soak_steady's takes 7 s
# (the whole job took 75 s on 19 Oct, before soak_bars). Its full run is 24 h of scenario time
# on the virtual clock.
# #399 R4: a full dispatch can name one `scenario` (default all), so the 24 h soak_bars runs alone,
# in about 8-10 h on the bench runner (inferred from its 2.7 h on the laptop), instead of the whole
# ~35 h pack; a name that is malformed or has no scenario file fails the check step, never the
# pack, so it files no pack issue. Python output is unbuffered and the runner
# rewrites its reports after every scenario, so a cancelled or timed-out pack keeps its log and the
# reports of the scenarios that finished (the upload below runs on a cancel too).
# A red signal comments on its open issue, or opens one (_nightly-issue.yml, #1849). No
# workflow-level concurrency group (#3449): the report job has a per-signal group instead.
# #2825: the weekly cron (Sun 05:17Z) runs only perf-pack-full, scenario rest_k6 (about 15 min,
# so a 90-minute timeout). k6 is v2.3.0, fetched and checked as perf-ws-load.yml does, and sends
# no usage report; its summary export, a refused run's too, is kept in the artifact as
# bench/reports/rest_k6-k6-summary.json (CV_BENCH_K6_EXPORT). A guard job, bench-free (on
# ubuntu-latest, so it never queues behind a soak), lets the pack start only while no other
# perf-pack-full, perf-bars-memdiag.yml leg or perf-ws-load.yml ws-load is queued or running, so
# the weekly run joins the cv-bench-01 group it shares with the leg only while that group is idle:
# a group keeps one pending run and replaces the older one (perf-ws-load.yml's header). Busy: a
# scheduled run skips the pack with a notice (green, no issue), a dispatch fails. Any API error
# fails it, a 404 too: all three are on main; so does a job count that is not a number. A re-run
# skips the pack, as its all-clear may be stale: dispatch again. The weekly run gates Budget #13's
# per-route p95s as a dispatch does (#2523): a route over 150 ms fails the pack and files its
# issue, as a refused k6 run, an app that never started or any other failed check does. The
# first read (klines_cold_first) is reported, never gated.
# #2848: a dispatch with profile=auth runs E09-Q05's k6 auth profile (tests/load/k6/auth.js, job
# auth-k6) alone (no soak), never on a schedule or a PR, and no required check reads it (C-9.2).
# It boots the API on this runner as dast-admin-nightly.yml does (keyless testnet, real storage,
# loopback) with CV_AUTH_PERF_ENABLED, seeds one Owner per VU with a TOTP method made per run,
# and fails on the script's thresholds. Its numbers are not the reference host's (#2105).
on:
  schedule:
    - cron: "37 3 * * *"
    - cron: "17 5 * * 0" # #2825: weekly, perf-pack-full's rest_k6 alone
  workflow_dispatch:
    inputs:
      profile:
        description: "E08-Q04 pack profile (smoke = scaled nightly; full = 24 h soak + k6 10 min); auth = E09-Q05 k6 auth profile"
        type: choice
        options: [smoke, full, auth]
        default: smoke
      scenario:
        description: "Full profile only: one scenario of bench/ingestion/config.py (e.g. soak_bars), or all"
        type: string
        default: all
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1" # every print reaches the log as it happens, also when a run is cancelled
jobs:
  ingestion-soak:
    # the weekly cron is perf-pack-full's alone (#2825); a profile=auth dispatch runs auth-k6 alone
    if: github.event.schedule != '17 5 * * 0' && inputs.profile != 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CV_ENV: test
    outputs:
      soak-regressed: ${{ steps.sync.outcome == 'success' && (steps.soak.outcome == 'failure' || steps.burst.outcome == 'failure') }}
      pack-regressed: ${{ steps.sync.outcome == 'success' && (steps.pack.outcome == 'failure' || steps.pack_tests.outcome == 'failure') }}
      report: ${{ steps.handoff.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - id: sync
        run: uv sync --project services/api
      - name: Soak canary (1800 s virtual, 3 symbols; fails with growth curve on >5 % RSS)
        id: soak
        working-directory: services/api
        run: uv run python bench/ingestion_soak.py soak --duration-s 1800 --out ingestion-soak.json
      - name: Burst (5x for 60 s; never-drop, backpressure, recovery window)
        id: burst
        working-directory: services/api
        run: uv run python bench/ingestion_soak.py burst --burst-s 60 --out ingestion-burst.json
      - name: E08-Q04 harness self-tests + scenario smokes (harness marker)
        id: pack_tests
        if: always() && steps.sync.outcome == 'success'
        working-directory: services/api
        run: uv run pytest tests/unit/bench -m "harness and not flaky" -q -p no:randomly --no-cov
      - name: E08-Q04 perf pack (seven scenarios, smoke profile) + regression gate
        id: pack
        if: always() && steps.sync.outcome == 'success'
        working-directory: services/api
        env:
          CV_BENCH_MACHINE_PROFILE: ci-ubuntu-latest
        run: uv run python -m bench.ingestion.runner all --profile smoke --out-dir bench/reports
      - name: Hand the gate diff to the issue job
        id: handoff
        if: failure()
        env:
          REPORT: services/api/bench/reports/gate-diff.md
        run: |
          set -euo pipefail
          eof=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          { echo "report<<$eof"; head -c 60000 "$REPORT" 2>/dev/null || echo "(no report produced)"
            echo; echo "$eof"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ingestion-soak-results
          path: |
            services/api/ingestion-soak.json
            services/api/ingestion-burst.json
            services/api/bench/reports/
          if-no-files-found: ignore

  bench-free:
    if: (github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || github.event.schedule == '17 5 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # lists the runs and jobs of the workflows that use the bench runner
    outputs:
      free: ${{ steps.guard.outputs.free }}
    steps:
      - name: Start the full pack only while no other job holds the bench runner
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          busy=""
          for held in perf-ingestion-nightly.yml:perf-pack-full perf-bars-memdiag.yml:leg perf-ws-load.yml:ws-load; do
            wf=${held%%:*} job=${held#*:} n=0
            for status in queued in_progress; do # queued first: a run that starts in between is seen
              ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?status=${status}&per_page=50" --paginate --jq '.workflow_runs[].id')
              for id in $ids; do
                [ "$id" != "$GITHUB_RUN_ID" ] || continue # this run: its own perf-pack-full waits for this job
                c=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" --jq "[.jobs[] | select(.name == \"${job}\" and (.status == \"in_progress\" or .status == \"queued\"))] | length")
                [[ "$c" =~ ^[0-9]+$ ]] || { echo "::error::refusing to start: the job count of ${wf} run ${id} is not a number, so the bench runner's state is unknown" >&2; exit 1; } # an empty or odd count fails closed, never reads as 0
                n=$((n + c))
              done
            done
            [ "$n" -eq 0 ] || busy="${busy:+$busy, }${wf} (job ${job})"
          done
          [ -n "$busy" ] || { echo "free=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT" = schedule ]; then # the busy rule (#2825): a schedule steps aside
            echo "::notice::the bench runner is busy (${busy}): this week's rest_k6 run is skipped"
          else # and a dispatch fails, as perf-ws-load's guard does
            echo "::error::refusing to start: the bench runner is busy: ${busy}; dispatch again when it has finished" >&2
            exit 1
          fi

  perf-pack-full:
    # E08-Q04 full profile: 24 h 1x soak (3 symbols) + 10-symbol aggregate + burst + k6 REST,
    # and soak_bars: 24 h of scenario time, about 3 h on the laptop that recorded its baseline.
    # GitHub-hosted jobs cap at 6 h, so this targets the self-hosted bench runner (E04 bench
    # environment), on bench-free's all-clear (#2825).
    needs: bench-free
    if: needs.bench-free.outputs.free == 'true' && github.run_attempt == 1
    runs-on: [self-hosted, bench]
    # shared with perf-bars-memdiag.yml's leg: one soak at a time on cv-bench-01 (#399). A pack
    # dispatched while a leg is queued would replace that leg (one pending run per group), so
    # bench-free fails that dispatch first; a run that skips this job may still (unverified):
    # any run without bench-free's all-clear, and a re-run
    concurrency:
      group: cv-bench-01
      cancel-in-progress: false
    # 24 h soak + 6 h soak_bars + 1 h aggregate + 30 m latency + rest/burst; weekly rest_k6 ~15 min
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 2100 }}
    env:
      CV_ENV: test
      CV_BENCH_MACHINE_PROFILE: bench-runner
      SCENARIO: ${{ github.event_name == 'schedule' && 'rest_k6' || inputs.scenario }}
      K6_VERSION: v2.3.0
      # sha256 of k6-v2.3.0-linux-amd64.tar.gz, as perf-ws-load.yml pins it
      K6_SHA256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
      K6_NO_USAGE_REPORT: "true"
      K6_AUTO_EXTENSION_RESOLUTION: "false"
    outputs:
      failed: ${{ steps.pack.outcome == 'failure' }}
      report: ${{ steps.handoff.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the pinned k6 (sha256 verified twice)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/k6"
          mkdir -p "$dir"
          cd "$dir"
          tarball="k6-${K6_VERSION}-linux-amd64.tar.gz"
          gh release download "$K6_VERSION" -R grafana/k6 -p "$tarball" -p "k6-${K6_VERSION}-checksums.txt" --clobber
          echo "${K6_SHA256}  ${tarball}" | sha256sum -c -
          grep " ${tarball}\$" "k6-${K6_VERSION}-checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
          ./k6 version | grep -F "k6 ${K6_VERSION} "
          echo "$dir" >> "$GITHUB_PATH"
      - id: sync
        run: uv sync --project services/api
      - name: Check the scenario name (its own step, so a refused name files no pack issue)
        id: scenario
        run: |
          export LC_ALL=C # [a-z] is ASCII only in the C locale
          [[ "$SCENARIO" =~ ^[a-z][a-z0-9_]{0,63}$ ]] || { echo "scenario must be all or a scenario name" >&2; exit 2; }
          [[ "$SCENARIO" == all || -f "services/api/bench/ingestion/scenarios/$SCENARIO.json" ]] || { echo "no scenario named $SCENARIO" >&2; exit 2; }
          echo "scenario: $SCENARIO"
      - name: E08-Q04 perf pack, full profile, the scenario checked above
        id: pack
        working-directory: services/api
        env:
          CV_BENCH_K6_EXPORT: bench/reports/rest_k6-k6-summary.json # k6's own summary, kept
        run: uv run python -m bench.ingestion.runner "$SCENARIO" --profile full --out-dir bench/reports
      - name: Hand the gate diff to the issue job
        id: handoff
        if: failure()
        env:
          REPORT: services/api/bench/reports/gate-diff.md
        run: |
          set -euo pipefail
          eof=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          { echo "report<<$eof"; head -c 60000 "$REPORT" 2>/dev/null || echo "(no report produced)"
            echo; echo "$eof"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e08-perf-pack-full
          path: services/api/bench/reports/
          if-no-files-found: ignore

  auth-k6:
    # #2848: dispatch with profile=auth only. Every credential is made here, per run, masked and
    # never echoed; no repository secret is read and the target is loopback.
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: http://127.0.0.1:8000
      PERF_USERS: "10" # one Owner per VU: the script needs 10
      K6_VERSION: v2.3.0
      # sha256 of k6-v2.3.0-linux-amd64.tar.gz, as perf-ws-load.yml pins it
      K6_SHA256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
      K6_NO_USAGE_REPORT: "true"
      K6_AUTO_EXTENSION_RESOLUTION: "false"
      # Compose checks every service's variables on each command; these stores never start here.
      GF_SECURITY_ADMIN_PASSWORD: unused-ci
      MINIO_ROOT_PASSWORD: unused-ci
      CV_ALERT_PAGE_WEBHOOK_URL: http://127.0.0.1:1/unused
      CV_ALERT_TICKET_WEBHOOK_URL: http://127.0.0.1:1/unused
      CV_ALERT_DEADMAN_URL: http://127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes or fetches
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the pinned k6 (sha256 verified twice)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/k6"
          mkdir -p "$dir"
          cd "$dir"
          tarball="k6-${K6_VERSION}-linux-amd64.tar.gz"
          gh release download "$K6_VERSION" -R grafana/k6 -p "$tarball" -p "k6-${K6_VERSION}-checksums.txt" --clobber
          echo "${K6_SHA256}  ${tarball}" | sha256sum -c -
          grep " ${tarball}\$" "k6-${K6_VERSION}-checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
          ./k6 version | grep -F "k6 ${K6_VERSION} "
          echo "$dir" >> "$GITHUB_PATH"
      - name: Make this run's synthetic credentials (masked, never echoed)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/cv" "$RUNNER_TEMP/cv-lane"
          secret() { v=$(openssl rand -hex 32); echo "::add-mask::$v"; echo "$1=$v" >> "$GITHUB_ENV"; }
          for name in POSTGRES_PASSWORD CV_AUTH_PEPPER CV_AUTH_TOTP_KEY_HEX \
            CV_AUTH_RECOVERY_HMAC_KEY_HEX CV_AUTH_CSRF_KEY_HEX CV_PERF_PASSWORD; do secret "$name"; done
          # The audit lane key, in a directory of its own (as dast-admin-nightly.yml makes it).
          (umask 277 && openssl rand -hex 32 > "$RUNNER_TEMP/cv-lane/lane.key")
      - name: Start Postgres and QuestDB (the compose data stores, loopback only)
        run: docker compose -f infra/compose/docker-compose.yml --profile core up -d --wait postgres questdb
      - name: Migrate, then seed one Owner per VU, each with a fresh TOTP method (testnet)
        working-directory: services/api
        env:
          CV_ENVIRONMENT: testnet
        run: |
          set -euo pipefail
          umask 077
          export CV_PG_DSN="postgresql+asyncpg://cv:${POSTGRES_PASSWORD}@127.0.0.1:5432/candleviewer"
          uv sync --frozen
          uv run --frozen alembic upgrade head
          suffix=$(openssl rand -hex 4)
          for i in $(seq "$PERF_USERS"); do
            CV_SEED_USERNAME="perf-$suffix-$i" CV_SEED_PASSWORD="$CV_PERF_PASSWORD" \
              uv run --frozen python scripts/seed_fixture_user.py --totp-secret-out "$RUNNER_TEMP/cv/perf-$i.totp"
            echo "::add-mask::$(cat "$RUNNER_TEMP/cv/perf-$i.totp")"
          done
          python3 - "$RUNNER_TEMP/cv" "$suffix" "$PERF_USERS" > "$RUNNER_TEMP/cv/users.json" <<'PY'
          import json, pathlib, sys
          d, suffix, n = pathlib.Path(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          print(json.dumps([{"identifier": f"perf-{suffix}-{i}",
                             "totp_seed": (d / f"perf-{i}.totp").read_text().strip()}
                            for i in range(1, n + 1)]))
          PY
      - name: Start the API (testnet, real storage backend, auth perf instrumentation, loopback)
        working-directory: services/api
        env:
          CV_ENVIRONMENT: testnet
          CV_STORAGE_BACKEND: real
          CV_FEED: synthetic
          CV_AUTH_PERF_ENABLED: "true" # #2097: refused unless testnet with no exchange key
          CV_QUESTDB_PG: 127.0.0.1:8812
          CV_QUESTDB_ILP: 127.0.0.1:9009
          CV_BIND_HOST: 127.0.0.1
          CV_BIND_PORT: "8000"
          CV_METRICS_BIND: 127.0.0.1:9108
        run: |
          set -euo pipefail
          export CV_PG_DSN="postgresql+asyncpg://cv:${POSTGRES_PASSWORD}@127.0.0.1:5432/candleviewer"
          export CV_AUDIT_LANE_KEY_FILE="$RUNNER_TEMP/cv-lane/lane.key"
          export CV_AUDIT_WAL_PATH="$RUNNER_TEMP/cv/audit/audit.wal"
          export CV_PARQUET_ROOT="$RUNNER_TEMP/cv/data/parquet" CV_BACKUP_ROOT="$RUNNER_TEMP/cv/data/backups"
          mkdir -p -m 700 "$RUNNER_TEMP/cv/audit" "$RUNNER_TEMP/cv/data" "$CV_PARQUET_ROOT" "$CV_BACKUP_ROOT"
          nohup uv run --frozen python -m candleviewer.server > "$RUNNER_TEMP/cv/api.log" 2>&1 &
          api=$!
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null "$BASE_URL/healthz"; then exit 0; fi
            kill -0 "$api" 2>/dev/null || break # it exited: stop waiting
            sleep 2
          done
          echo "::error title=auth-k6::the API did not answer /healthz; the last of its log follows"
          tail -n 200 "$RUNNER_TEMP/cv/api.log"
          exit 1
      - name: E09-Q05 k6 auth profile (its thresholds decide the step)
        env:
          CV_PERF_USERS_FILE: ${{ runner.temp }}/cv/users.json
          K6_HOST_CLASS: hosted # the step-up p95 is reported, not judged, off #2105's host
        run: k6 run --summary-export "$RUNNER_TEMP/k6-auth-summary.json" tests/load/k6/auth.js
      - name: Report the step-up p95 beside its reference-host budget
        if: always()
        run: |
          summary="$RUNNER_TEMP/k6-auth-summary.json"
          [ -f "$summary" ] || exit 0
          p95=$(jq -r '.metrics["http_req_duration{scenario:stepup_burst,endpoint:step_up}"]["p(95)"] // "n/a"' "$summary")
          echo "::notice title=step-up p95 (hosted, informational)::${p95} ms; the 400 ms budget is judged on the reference host (#2105)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e09-auth-k6-summary
          path: ${{ runner.temp }}/k6-auth-summary.json # metrics only: no body, token or seed
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --profile core down -v || true

  ingestion-soak-issue:
    needs: ingestion-soak
    if: ${{ always() && needs.ingestion-soak.outputs.soak-regressed == 'true' }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-issue.yml
    with:
      signal: perf-ingestion-soak
      title-prefix: "perf: ingestion nightly soak/burst regression"
      labels: perf,area/ingestion
      body: "perf-ingestion-nightly failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Artifact: ingestion-soak-results."

  perf-pack-issue:
    needs: ingestion-soak
    if: ${{ always() && needs.ingestion-soak.outputs.pack-regressed == 'true' }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-issue.yml
    with:
      signal: perf-e08-q04-pack
      title-prefix: "perf: E08-Q04 ingestion perf pack regression"
      labels: perf,area/ingestion,type/bug
      body: |
        E08-Q04 perf pack failed (budget breach or regression vs bench/baselines/e08).
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (artifact: ingestion-soak-results).
        Baselines were not modified by this run.

        ${{ needs.ingestion-soak.outputs.report }}

  perf-pack-full-issue:
    needs: perf-pack-full
    if: ${{ always() && needs.perf-pack-full.outputs.failed == 'true' }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-issue.yml
    with:
      signal: perf-e08-q04-full
      title-prefix: "perf: E08-Q04 full perf pack failed"
      labels: perf,area/ingestion,type/bug
      body: |
        E08-Q04 full-profile perf pack failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        ${{ needs.perf-pack-full.outputs.report }}
