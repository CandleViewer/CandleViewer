name: a11y-nightly

# E47-T02: full accessibility sweep (every manifest route) off the PR path.
# Budget 20 min (AC); same collectors and gate logic as the per-PR job.
# A red scheduled run comments on the one tracker issue that the repository variable
# CV_A11Y_NIGHTLY_TRACKER_ISSUE names, or opens a P1 issue while the variable is unset, as
# e2e-nightly.yml and storybook-nightly.yml do (#5151: this lane was red for days unreported).
# Only the `report` job can write; it runs no checkout and no action.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sweep:
    name: a11y-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A11Y_SWEEP: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: corepack enable && corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile
      # vite resolves `@candleviewer/ui/theme.css` and the token CSS to packages/ui's built files,
      # and this job runs pnpm directly, so turbo's `^build` does not build them first (#3272).
      - name: Build the workspace packages apps/web depends on
        run: pnpm --filter "@candleviewer/web^..." run build
      - name: "Guard: the packages apps/web imports are built (fails fast, CI-BUILD-001)"
        run: node tools/ci/check_built_exports.mjs packages/ui packages/chart-engine packages/protocol
      - run: pnpm --filter @candleviewer/web run build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Collect and evaluate (axe, keyboard, flash; trees are PR-only baselines)
        working-directory: apps/web
        run: |
          date +%s > "$RUNNER_TEMP/a11y-start"
          npx playwright test -c e2e/playwright.a11y.config.ts
          cd ../..
          set +e
          for g in "axe reports/a11y/axe.json" "keyboard reports/a11y/keyboard.json" "flash reports/a11y/flash.json"; do
            set -- $g
            python -m tools.a11y.gates $g | tee -a "$GITHUB_STEP_SUMMARY"
            [ "${PIPESTATUS[0]}" -ne 0 ] && fail=1
          done
          python -m tools.a11y.gates flash reports/a11y/flash-canvas.json | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${PIPESTATUS[0]}" -ne 0 ] && fail=1
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/a11y-start") ))
          python -m tools.a11y.gates budget "$elapsed" --limit 1200 | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${PIPESTATUS[0]}" -ne 0 ] && fail=1
          exit ${fail:-0}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11y-sweep-reports
          path: reports/a11y/
          retention-days: 14

  report:
    name: a11y-nightly-report
    needs: sweep
    # always(), not !cancelled(): a job that hits its timeout ends `cancelled` and must still be
    # reported (as in e2e-nightly.yml). A manual run is watched by whoever started it.
    if: ${{ always() && github.event_name == 'schedule' && needs.sweep.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report the red nightly on the tracker issue, or open one (C-9.2)
        # Only the runner's preinstalled gh CLI runs beside the write token; values reach the
        # script through env. TRACKER_ISSUE has no default: unset, it opens a P1. A set value must
        # be an issue number of this repository, or the job fails and files nothing.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.sweep.result }}
          TRACKER_ISSUE: ${{ vars.CV_A11Y_NIGHTLY_TRACKER_ISSUE }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="a11y-nightly (the full accessibility sweep, E47-T02) ended $RESULT on main at"
          body+=" $GITHUB_SHA, and a red nightly blocks the next release (C-9.2). Run: $run_url."
          body+=" Artifact: a11y-sweep-reports. Triage: docs/ci-runbook.md section 2 (nightly"
          body+=" accessibility sweep)."
          if [ -z "$TRACKER_ISSUE" ]; then
            gh issue create --title "a11y: nightly accessibility sweep failed ($(date -u +%F))" \
              --label qa --label area/frontend-platform --label priority/p1 \
              --body "$body"
          elif [[ "$TRACKER_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            gh issue comment "$TRACKER_ISSUE" --body "$body"
          else
            echo "::error title=a11y-nightly-report::CV_A11Y_NIGHTLY_TRACKER_ISSUE is set but is" \
              "not an issue number, so nothing was filed. Set it to a positive integer or delete" \
              "it (docs/ci-runbook.md section 2)."
            exit 1
          fi
