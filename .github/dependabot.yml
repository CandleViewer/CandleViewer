version: 2
# Dependency-freeze flow: docs/plan/35-dependency-freeze-policy.md §2.1 (E43-T05, Refs #1234).
# Every bump changes security/freeze-manifest.sha256, which Dependabot cannot regenerate, so
# bumps are GROUPED (one PR per ecosystem per week) and labelled `dependencies`; the
# read-only-scans CI job then publishes the regenerated manifest as a proposal for the reviewer.
# Majors on pinned-runtime-sensitive packages are ignored until the runtime moves (§2.1.3).
updates:
  # SR-132/SR-134: keep pinned GitHub Actions SHAs current. Dependabot opens
  # a PR bumping `uses: owner/repo@<sha> # vX.Y.Z` to the latest release;
  # tools/ci/check_action_pins.py still requires the new reference be a full
  # commit SHA, and .github/actions-pins.md must be updated in the same PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "area/infra-devops"
      - "security"
      - "security-review" # workflow edits are a security path (AGENTS.md §8)
      - "sla/7d" # SR-134
    commit-message:
      prefix: "chore(infra-devops)"

  # E03-T07: SCA coverage (CONSTITUTION §9 #11) for pip, npm and Docker base
  # images, mirroring the pip-audit / npm-audit / trivy CI scans above.
  # E09-X03: covers the auth dependency set (argon2-cffi Argon2 binding, pyotp/TOTP,
  # cryptography envelope encryption, starlette cookie/session middleware). Those
  # bumps land in their own `crypto` group (separate PR, never batched with the
  # rest) so the security reviewer sees them in isolation; Dependabot labels are
  # per-ecosystem, so the group name — not a label — is the marker.
  - package-ecosystem: "pip"
    directory: "/services/api"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      crypto:
        patterns: ["argon2-cffi", "cryptography", "pyotp", "starlette", "itsdangerous"]
      python:
        patterns: ["*"]
        exclude-patterns: ["argon2-cffi", "cryptography", "pyotp", "starlette", "itsdangerous"]
    labels:
      - "dependencies"
      - "area/backend-platform"
      - "security"
      - "sla/48h" # SR-134: backend carries the order path / key handling
    commit-message:
      prefix: "chore(backend-platform)"
    ignore:
      # ADR-0016 / C-2.19: exact pin, moved only by its own PR with the research gate green.
      - dependency-name: "xstate-statemachine"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "area/frontend-platform"
      - "security"
      - "sla/7d" # SR-134
    commit-message:
      prefix: "chore(frontend-platform)"
    ignore:
      # Majors are sequenced manually via #1819 (Node 22 floor first, #1778 F); remove once step 1 of #1819 lands.
      # Version-update ignores do not suppress Dependabot *security* updates - advisory-driven
      # PRs (including majors) still open; this covers size-limit/@size-limit/* (Node 22) too.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pnpm is pinned via `packageManager` + corepack in every workflow (pnpm@12.5.1).
      - dependency-name: "pnpm"

  - package-ecosystem: "docker"
    directory: "/infra/images"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "area/infra-devops"
      - "security"
      - "sla/7d" # SR-134
    commit-message:
      prefix: "chore(infra-devops)"
    ignore:
      # The backend targets Python 3.12: services/api/.python-version, the mypy/Ruff/Black
      # targets in services/api/pyproject.toml and the python:3.12-slim pin in
      # infra/images/PINS.md (AGENTS.md §5.2 sets 3.12 as the floor). #3314 (3.12 -> 3.14) was
      # declined; #3430 added this entry. A runtime move needs its own ticket + ADR, which
      # removes this entry; none is open yet. Patch and digest updates of the 3.12 line still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
