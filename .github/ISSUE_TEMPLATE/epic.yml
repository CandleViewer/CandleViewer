name: Epic
description: A body of work delivering a coherent capability, spans multiple sprints
title: "[Epic]: "
labels: ["type/epic"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, session tokens, passwords, or real account/user identifiers into
        this issue. Found a vulnerability? Do not file it here — see `SECURITY.md`.
  - type: textarea
    id: problem-value
    attributes:
      label: Problem statement & value
      description: Why this Epic exists, who benefits. One paragraph minimum.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: Explicit In scope / Out of scope bullets.
    validations:
      required: true
  - type: textarea
    id: research-links
    attributes:
      label: Linked research
      description: >-
        Link `docs/research/digests/*` or `24-owner-decisions.md` items, if any exist yet.
    validations:
      required: false
  - type: textarea
    id: architecture-impact
    attributes:
      label: Architecture impact
      description: >-
        Which C4 components / `24-internal-schemas.md` domains does this touch? (Architect
        review itself is verified at Ready via the Refinement ceremony, not here.)
    validations:
      required: true
  - type: dropdown
    id: touches-security-surface
    attributes:
      label: Touches security-sensitive surface?
      description: >-
        Auth, keys, OMS, fan-out, or money movement — triggers a STRIDE kickoff (verified at
        Ready).
      options:
        - "No"
        - "Unsure"
        - "Yes"
    validations:
      required: true
  - type: dropdown
    id: has-user-facing-screens
    attributes:
      label: Has user-facing screens?
      description: >-
        If Yes, a design Epic/tickets must exist ≥2 sprints ahead, or a waiver is recorded
        (waiver/2-sprint check verified at Ready).
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: dropdown
    id: sizing
    attributes:
      label: Rough sizing
      description: T-shirt size for roadmap placement.
      options:
        - "XS — extra small"
        - "S — small"
        - "M — medium"
        - "L — large"
        - "XL — extra large"
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies (blocked_by)
      description: Other Epic keys this depends on, comma-separated.
    validations:
      required: false
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Named engineer/lead for decomposition (not a team name).
    validations:
      required: true
