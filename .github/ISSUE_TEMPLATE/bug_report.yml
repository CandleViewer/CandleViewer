name: Bug Report
description: Report a defect against previously Done work
title: "[Bug]: "
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, session tokens, passwords, or real account/user identifiers into
        this issue. Found a vulnerability? Do not file it here — see `SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: >-
        Exact steps + environment (dev/staging/prod) + symbol/account context if relevant.
        Never paste real account ids or keys — redact them.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Severity
      description: >-
        Definitions (03-testing-strategy.md §11.3, authoritative). P0: data loss, wrong order
        execution/sizing, missing native SL, security breach, crash blocking core trading (triage 2h).
        P1: major feature broken with workaround, or chaos scenario mishandled (1 business day).
        P2: partially broken, non-blocking, cosmetic-but-confusing, or a11y AA violation (3 business days).
        P3: cosmetic or wording (1 sprint). No bug closes without a regression test.
      options:
        - "priority/p0-critical — drop everything"
        - "priority/p1-high — major breakage, a workaround exists"
        - "priority/p2-normal — partly broken, not blocking"
        - "priority/p3-low — cosmetic or wording"
    validations:
      required: true
  - type: textarea
    id: root-cause-hypothesis
    attributes:
      label: Root cause hypothesis
      description: >-
        Or write "needs investigation" — if that investigation is itself nontrivial, file a
        Spike instead.
    validations:
      required: true
  - type: dropdown
    id: test-layer
    attributes:
      label: Test layer that should have caught it
      options:
        [
          unit,
          property,
          integration,
          contract,
          e2e,
          a11y,
          chaos,
          performance,
          none - needs new layer,
        ]
    validations:
      required: true
  - type: input
    id: regression-origin
    attributes:
      label: Originating Story/Epic
      description: Key of the originating Story/Epic (e.g. E10-S03).
    validations:
      required: true
  - type: input
    id: exemption
    attributes:
      label: Cosmetic exemption reason
      description: Only for P3 cosmetic/documentation bugs labelled p3-cosmetic-exempt; otherwise leave blank.
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dev - Demo
        - dev - Live
        - staging - Demo
        - staging - Live
        - prod - Demo
        - prod - Live
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Symbol and account context
      description: Symbol and (redacted) account/role context, or "n/a".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: >-
        Paste any relevant logs, stack traces, or screenshots. Redact tokens/keys before
        pasting.
      render: shell
    validations:
      required: false
