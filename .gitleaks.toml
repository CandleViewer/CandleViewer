# gitleaks configuration (E03-T07 security lane, SR-13x secrets scanning).
# Extends the default ruleset; only *narrows* where the default demonstrably
# false-positives on this repository. Never allowlist source code.
title = "CandleViewer gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Known non-secrets"
# NB: `regexes` are matched against the *secret* gitleaks extracted, not the
# whole line.
# 1) Planning/contract docs redact every example credential with the literal
#    word REDACTED (docs/plan/22-api-openapi.yaml, 23-ws-protocol.md ...).
# 2) docs/research/xstate/** are third-party-library battle-test artefacts:
#    the "secrets" there are dummy strings used to *test* log redaction.
#    Research is not shipped code (docs/design/README.md, C-1.3).
paths = [
  '''docs/research/xstate/.*''',
  # packages/fixtures ships its own secret scanner; these tests feed it fake
  # keys ("sk-abcdef1234567890") on purpose.
  '''packages/fixtures/test/.*\.test\.mjs''',
  '''docs/plan/backlog/all-tickets\.json''',   # generated from E*.json (covered there)
  # E04-T01: redaction-matrix unit/integration tests plant synthetic
  # "CANARY*" secrets to assert they never survive the redaction filter.
  # These are not real credentials — they exist solely to be redacted.
  '''services/api/tests/unit/observability/test_redaction\.py''',
  '''services/api/tests/unit/observability/test_redaction_filter\.py''',
  '''services/api/tests/integration/observability/test_request_logging_no_secret_leak\.py''',
  # E43-T06: synthetic canary exercising every secret escape path.
  '''services/api/tests/unit/observability/test_secret_escape_paths\.py''',
  # E05 threat model prose mentions "API key labels"; documentation, no credential.
  '''docs/plan/threat-models/E05-design-system\.md''',
  '''scripts/tests/test_check_secrets_hygiene\.py''',
  # E11-D07: public screen-reader vendor reserved-key fixture; its `keys` field names chords
  # ("SHIFT+SEMICOLON"), not credentials. Data only, never source.
  '''docs/design/_tools/e11_d07_sr_reserved_keys\.json''',
]
regexes = [
  '''REDACTED''',
  '''<[^>]*example placeholder>''',
  # ticket prose "config keys: `oms.algo.max_children=450`" — settings names, not secrets
  '''^oms\.[a-z0-9_.]+=[a-z0-9_.]+$''',
]

# E08-X03: Bybit-specific secret shapes the default gitleaks ruleset does
# not know about — API key, HMAC signature and the X-BAPI-* auth headers.
# These extend (never replace) the default pack and feed both the CI
# gitleaks job and the fixture pre-commit check (packages/fixtures/scripts/verify.mjs).
[[rules]]
id = "bybit-api-key"
description = "Bybit v5 API key/secret field"
regex = '''(?i)"(api[_-]?key|api[_-]?secret)"\s*:\s*"[A-Za-z0-9]{16,}"'''
tags = ["key", "bybit"]

[[rules]]
id = "bybit-hmac-signature"
description = "Bybit v5 request HMAC signature (hex-encoded)"
regex = '''(?i)"sign(ature)?"\s*:\s*"[A-Fa-f0-9]{32,}"'''
tags = ["signature", "bybit"]

[[rules]]
id = "bybit-bapi-header"
description = "Bybit v5 X-BAPI-* authentication header with a live-looking value"
regex = '''(?i)X-BAPI-(API-KEY|SIGN)\s*[:=]\s*["']?[A-Za-z0-9]{16,}'''
tags = ["header", "bybit"]


# E09-X03: CandleViewer's own auth token shapes (SR-012, SR-022, SR-122).
[[rules]]
id = "cv-session-token"
description = "CandleViewer session token (cvs_ + 43+ url-safe chars)"
regex = '''\bcvs_[A-Za-z0-9_-]{43,}\b'''
tags = ["auth", "session"]

[[rules]]
id = "cv-refresh-token"
description = "CandleViewer refresh token (cvr_ + 43+ url-safe chars)"
regex = '''\bcvr_[A-Za-z0-9_-]{43,}\b'''
tags = ["auth", "refresh"]

[[rules]]
id = "cv-invite-token"
description = "CandleViewer invite token (cvi_ + 43+ url-safe chars)"
regex = '''\bcvi_[A-Za-z0-9_-]{43,}\b'''
tags = ["auth", "invite"]

[[rules]]
id = "cv-recovery-code"
description = "CandleViewer MFA recovery code (xxxxx-xxxxx base32 groups) assigned to a recovery field"
# The match spans the whole list/assignment so every code, not just the first,
# is inside the finding (and redacted).
regex = '''(?i)recovery[_-]?codes?["']?\s*[:=]\s*["'\[(]*[A-Z2-7]{5}-[A-Z2-7]{5}(?:["']?\s*,\s*["']?[A-Z2-7]{5}-[A-Z2-7]{5})*'''
tags = ["auth", "recovery"]

[[rules]]
id = "cv-totp-secret"
description = "TOTP shared secret (base32, 16+ chars) assigned to a totp secret field"
regex = '''(?i)totp[_-]?secret["']?\s*[:=]\s*["']?[A-Z2-7]{16,}'''
tags = ["auth", "totp"]
