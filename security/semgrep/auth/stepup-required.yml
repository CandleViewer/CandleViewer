rules:
  - id: stepup-required
    languages: [python]
    severity: ERROR
    message: >-
      SR-025: this route performs a step-up-gated action but has no
      require_step_up dependency. Add dependencies=[Depends(require_step_up(...))],
      a Depends(require_step_up(...)) parameter, an awaited
      require_elevation_for(...) call in the handler, or, for a no-grace grant
      the handler names (backups), a require_bound_elevation(...) result whose
      refusal it returns at once (if not isinstance(spent, SpentGrant): return
      spent). A comment or unused import does not count.
    metadata:
      sr: SR-025
    patterns:
      - pattern-either:
          - pattern: |
              @$R.$M($P, ...)
              async def $F(...):
                  ...
          - pattern: |
              @$R.$M($P, ...)
              def $F(...):
                  ...
      - metavariable-regex:
          metavariable: $M
          regex: "^(get|post|put|patch|delete|api_route)$"
      # $P may be a literal, a constant name, an f-string or an expression:
      # the regex runs on its source text. #2110 (BQ-220): a user's own password change,
      # `PUT /auth/password`, is not in SR-025's list and is not step-up gated (the re-verified
      # current password is SR-028's proof); only the whole literal "/auth/password" is exempt (anchored both ends), never a
      # longer, prefixed or dotted path.
      - metavariable-regex:
          metavariable: $P
          regex: "(?i)^(?!.*reset-preview)(?![\"']/auth/password[\"']$).*(mfa/reset|api-keys|api_keys|kill-switch|kill_switch|/roles|roles_path|recovery-codes/regenerate|revoke-all|revoke_all|/password|password_path|backups/[{][^}]*[}]/(download|restore)(?![/A-Za-z0-9_{])).*$"
      # Real dependency in the decorator.
      - pattern-not: |
          @$R.$M(..., dependencies=[..., Depends(require_step_up(...)), ...], ...)
          async def $F(...):
              ...
      - pattern-not: |
          @$R.$M(..., dependencies=[..., Depends(require_step_up(...)), ...], ...)
          def $F(...):
              ...
      # Real dependency parameter.
      - pattern-not: |
          @$R.$M(...)
          async def $F(..., $D = Depends(require_step_up(...)), ...):
              ...
      - pattern-not: |
          @$R.$M(...)
          async def $F(..., $D: $T = Depends(require_step_up(...)), ...):
              ...
      # Real call in the body.
      - pattern-not: |
          @$R.$M(...)
          async def $F(...):
              ...
              $G = await require_elevation_for(...)
              ...
      - pattern-not: |
          @$R.$M(...)
          async def $F(...):
              ...
              await require_elevation_for(...)
              ...
      - pattern-not: |
          @$R.$M(...)
          async def $F(...):
              ...
              await require_step_up(...)
              ...
      # E42-T05 BK-10 (BK-1 security F2, SR-BK10B-02): the no-grace grant a backups handler
      # spends and names counts only when its refusal is returned at once, as the response.
      - pattern-not: |
          @$R.$M(...)
          async def $F(...):
              ...
              $G = await require_bound_elevation(...)
              if not isinstance($G, SpentGrant):
                  return $G
              ...
    paths:
      exclude:
        - "**/tests/**"
