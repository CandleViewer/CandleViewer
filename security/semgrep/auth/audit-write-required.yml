rules:
  - id: audit-write-required
    languages: [python]
    severity: ERROR
    message: >-
      C-2.9 / SR-112: a mutating route handler contains no audit call
      (_audit(...), audit_*(...) or writer.emit(...)). Every state-changing
      auth/account action writes an append-only audit record.
    metadata:
      sr: SR-112
    patterns:
      - pattern-either:
          - pattern: |
              @$R.$M(...)
              async def $F(...):
                  ...
          - pattern: |
              @$R.$M(...)
              def $F(...):
                  ...
      - metavariable-regex:
          metavariable: $M
          regex: "^(post|put|patch|delete)$"
      - pattern-not-regex: "(_audit\\(|audit_\\w+\\(|\\.emit\\()"
      # Not C-2.9 actions by decision (#357 item 11, #402 D20): these exact routes only, so a new
      # mutating route in the same router is still flagged. Drawings: 403s go through enforce()
      # (audited) and a foreign drawing id on a single PUT/DELETE is audited as rbac.denied;
      # batch target_unavailable/id_unavailable probes (R3, #433) and a foreign layout_id probe
      # are NOT audited. Workspaces: D18 audits foreign-id probes as rbac.denied.
      # REVISIT when E40 exposes drawings.alert_id and when the 3.8.5 hotkey routes land: this
      # rule cannot see new behaviour inside an approved handler.
      - pattern-not: |
          @$R.post("=~/^/(drawings|drawings/batch|workspaces|workspaces/[{]workspaceId[}]/layouts)$/", ...)
          async def $F(...):
              ...
      - pattern-not: |
          @$R.put("=~/^/(drawings/[{]drawingId[}]|workspaces/[{]workspaceId[}]|workspaces/[{]workspaceId[}]/layouts/[{]layoutId[}])$/", ...)
          async def $F(...):
              ...
      - pattern-not: |
          @$R.delete("=~/^/(drawings/[{]drawingId[}]|workspaces/[{]workspaceId[}]|workspaces/[{]workspaceId[}]/layouts/[{]layoutId[}])$/", ...)
          async def $F(...):
              ...
    paths:
      exclude:
        - "**/tests/**"
        # Allowlist (Security-owned, widening needs Security review). Two classes:
        # (a) audited below the handler, not inline: rules.py, rules_crud.py, step_up.py;
        # (b) not an audited account action: telemetry.py, plus the exact-route list above.
        - "**/api/rules.py"        # validate is non-mutating; compile audits in rules/service.py
        - "**/api/rules_crud.py"   # every mutation goes through rules/service.py (audited)
        - "**/api/step_up.py"      # step-up grant/fail audited by the B16 plugin (ACTION_REQUEST)
        - "**/api/telemetry.py"    # frontend telemetry sink, not an audited account action

  - id: audit-write-required-route-scope
    languages: [python]
    severity: ERROR
    message: >-
      C-2.9: this route is on the audit-write-required UI-state list, which covers only
      api/drawings.py and api/workspaces.py. Elsewhere (e.g. under APIRouter(prefix=...)) it is a
      different endpoint: add an audit call or get it classified.
    metadata:
      sr: SR-112
    pattern-either:
      - pattern: |
          @$R.post("=~/^/(drawings|drawings/batch|workspaces|workspaces/[{]workspaceId[}]/layouts)$/", ...)
          async def $F(...):
              ...
      - pattern: |
          @$R.put("=~/^/(drawings/[{]drawingId[}]|workspaces/[{]workspaceId[}]|workspaces/[{]workspaceId[}]/layouts/[{]layoutId[}])$/", ...)
          async def $F(...):
              ...
      - pattern: |
          @$R.delete("=~/^/(drawings/[{]drawingId[}]|workspaces/[{]workspaceId[}]|workspaces/[{]workspaceId[}]/layouts/[{]layoutId[}])$/", ...)
          async def $F(...):
              ...
    paths:
      exclude:
        - "**/tests/**"
        - "**/api/drawings.py"
        - "**/api/workspaces.py"
