    approver: "basiltt" # approval = the orchestrator's merge under the owner's delegation; ratification listed on #2701
    expires: "2026-11-20"
    ticket: "https://github.com/basiltt/CandleViewer/issues/1819"
  - id: "GHSA-w5hq-g745-h8pq"
    tool: npm-audit
    severity: MEDIUM
    reason: "uuid 9.0.1 under Storybook addon-actions (packages/ui, dev-only); fixed only in 11.1.1, two majors on, and addon-actions 8.6 (latest 8.x) still needs ^9. The flaw is in v3/v5/v6 with a caller buffer; addon-actions calls only v4()"
    approver: "basiltt" # approval = the orchestrator's merge under the owner's delegation; ratification listed on #2701
    expires: "2026-11-20"
    ticket: "https://github.com/basiltt/CandleViewer/issues/1819"
