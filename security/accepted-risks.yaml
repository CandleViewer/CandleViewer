    reason: "tauri 2.1.1 in the E06-T01 bench harness (packages/chart-engine/bench/matrix/tauri: spike-only, no CI workflow builds it, bundling is off, nothing ships); fixed in 2.11.1, a pin bump that needs cargo and a harness re-run. The advisory concerns which pages may use the app's IPC: the harness grants its one window no capabilities (empty permission list), defines no commands or plugins, keeps withGlobalTauri off and loads only the runner's loopback page"
    approver: "basiltt" # approval = the orchestrator's merge under the owner's delegation; ratification listed on #2701
