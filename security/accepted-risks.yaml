# Accepted-risk register (E03-T07).
#
# Every entry documents a *time-boxed* exception to an otherwise-blocking
# finding from the security lane (`.github/workflows/_job-security.yml`,
# `tools/ci/security_gate.py`). An accepted risk without an `expires` date is
# not accepted — it is forgotten — so `expires` is mandatory and enforced:
# `security_gate.py` fails the build with CI-SEC-004 ("accepted risk expired")
# the moment `expires` is on or before the run date, even though the entry
# still exists in this file.
#
# Schema per entry (all fields required unless noted):
#   id:        str   — the tool's own finding id (GHSA-...., CVE-...., a
#                       CodeQL/Semgrep rule id + location hash, a licence
#                       exception key "license:<package>@<version>", etc.)
#                       Must match exactly what the normalised tool output in
#                       security_gate.py reports as `finding_id`.
#                       An entry matches on id and tool only, never on the
#                       package: an npm-audit entry (a GHSA id) covers that
#                       advisory on every module pnpm reports it for (e.g.
#                       GHSA-82fw-gwwq-j7x9 on vitest and @vitest/mocker),
#                       a module that starts reporting it later included.
#                       No `package` scope: it could not tell a dev path from
#                       a runtime path of the same module (#3558).
#   tool:      str   — one of: codeql, semgrep, bandit, pip-audit, npm-audit,
#                       dependabot, gitleaks, license-scan, trivy. `dependabot`
#                       records the decision on an open Dependabot alert that
#                       no scanner here reports. No gate reads such an entry
#                       until the alert gate (C-9.1 #11, #3558) lands, so only
#                       check_accepted_risk_expiry.py acts on it, on its date.
#   severity:  str   — CRITICAL | HIGH | MEDIUM | LOW, exactly (any other
#                       value is CI-SEC-005): the highest severity the entry
#                       accepts, as security_gate.py scores the finding; a
#                       finding above it blocks (CI-SEC-001, #3558). pip-audit
#                       usually reports no severity, so the gate scores such a
#                       finding HIGH and its entry needs HIGH.
#   reason:    str   — why this is accepted now (not "will fix later")
#   approver:  str   — GitHub handle; MUST be security or the owner per
#                       SR-135/SR-136 approval rule (CI-SEC-003 licence path)
#   expires:   str   — ISO 8601 date (YYYY-MM-DD). Exclusive: the entry stops
#                       protecting on this date (fails from `expires` onward).
#   ticket:    str   — tracking issue for the real fix (04-security-program.md §16.2)
#
# gitleaks findings and Critical severity CANNOT be accepted here (§12.1: any
# gitleaks finding blocks unconditionally; Critical is never exception-able
# per the R0 threshold in 30-release-roadmap.md §4.4) — security_gate.py
# rejects any entry with tool: gitleaks or severity: CRITICAL at load time.

entries:
  # psycopg 3 (PostgreSQL driver) is LGPL-3.0 — used as an unmodified,
  # dynamically-linked library from a self-hosted service that is never
  # distributed to third parties; LGPL obligations (source of the library on
  # request) are trivially met and no CandleViewer code is derived from it.
  # SR-136 still requires an explicit security + owner acceptance for LGPL;
  # the owner delegated Sprint-01 acceptances to the orchestrator (2026-09-25).
  - id: "license:psycopg@3.3.6"
    tool: license-scan
    severity: LOW
    reason: "LGPL-3.0 DB driver, dynamically linked, unmodified, not redistributed; SR-136 LGPL path"
    approver: "basiltt"
    expires: "2027-03-25"
    ticket: "https://github.com/basiltt/CandleViewer/issues/108"
  - id: "license:psycopg-binary@3.3.6"
    tool: license-scan
    severity: LOW
    reason: "LGPL-3.0 DB driver (binary wheel of psycopg), same basis as psycopg"
    approver: "basiltt"
    expires: "2027-03-25"
    ticket: "https://github.com/basiltt/CandleViewer/issues/108"
  # E07-T02 bootstrap-owner migration (0002_rbac_seed) prints a one-time
  # random password to stdout only, gated behind two operator-set env vars
  # (CV_BOOTSTRAP_OWNER_EMAIL and CV_BOOTSTRAP_OWNER_CONFIRM=1) so a routine
  # `alembic upgrade head` never emits it; the first login forces a password
  # change and MFA enrollment (Sec.10.2). CodeQL's clear-text-logging rule
  # cannot distinguish this gated, intentional operator handoff from an
  # unconditional secret leak. Sprint-01 owner-delegated acceptance
  # (2026-09-25); follow-up to replace the print with a structured,
  # redaction-aware bootstrap channel is out of this ticket's scope.
  - id: "py/clear-text-logging-sensitive-data:services/api/candleviewer/migrations/versions/0002_rbac_seed.py:146"
    tool: codeql
    severity: HIGH
    reason: "Gated one-time bootstrap-owner password print to stdout only, never a routine-upgrade path; forced change+MFA on first login"
    approver: "basiltt"
    expires: "2027-03-25"
    ticket: "https://github.com/basiltt/CandleViewer/issues/1551"
  # #3540 (first accepted under #1978): re-keyed from line 59, stale since #2612 added an
  # import above it. Pull request scans are diff-informed and never re-report an unchanged
  # line, so only a full scan (the merge queue) showed it. Triaged a false positive by
  # construction (orchestrator ruling); scripts/tests/test_security_gate.py now pins every
  # line-keyed codeql entry to the code it accepts. Expires with its twin (mfa_service.py:68)
  # at the GA cut, about five months after triage and the latest date the freeze test allows.
  - id: "py/weak-sensitive-data-hashing:services/api/candleviewer/auth/login_service.py:60"
    tool: codeql
    severity: HIGH
    reason: "False positive by construction: the SHA-256 digest is the lookup key for an opaque 256-bit random MFA challenge token (secrets.token_urlsafe(32)), not a password, so a slow KDF adds nothing. Re-check if the token source or the hashed value changes"
    approver: "basiltt" # approval = the orchestrator's merge under the owner's delegation; ratification listed on #2701
    expires: "2027-03-25"
    ticket: "https://github.com/basiltt/CandleViewer/issues/3540"
  - id: "py/weak-sensitive-data-hashing:services/api/candleviewer/auth/mfa_service.py:68"
    tool: codeql
    severity: HIGH
    reason: "Random 256-bit bearer mfa_token hashed with SHA-256 as a storage lookup key (high-entropy input, not a password; slow KDFs are inappropriate); CodeQL's password-hashing heuristic keys on the token name. Standing owner-delegated acceptance (run log 2026-09-25, #1778)"
    approver: "basiltt"
    expires: "2027-03-25"
    ticket: "https://github.com/basiltt/CandleViewer/issues/1978"
  # E43-T05-B1: EX-05 (http-cache-semantics) was cleared by a pnpm override to 4.3.0 (#1857) and
  # removed. EX-06 (braces) has no patched release upstream (2026-10-03); dev/build-time only
  # (lint-staged), not shipped in the runtime.
  # Approval is the owner CODEOWNER security-review of PR #1745; the entries
  # take effect only when the owner merges it (C-12.3). Not self-approved.
  - id: "GHSA-vfj7-8cjw-p6xm"
    tool: npm-audit
    severity: HIGH
    reason: "EX-06: braces@3.0.3 - no patched version exists upstream as of 2026-10-03; dev/build-time only via lint-staged > micromatch. Re-check: re-run pnpm audit at each freeze; remove when a patched version ships"
    approver: "basiltt" # approval = owner CODEOWNER security-review merge of PR #1745
    expires: "2026-12-31"
    ticket: "https://github.com/basiltt/CandleViewer/issues/1737"
  # #3558: the Medium and Low advisories left on main after #3494 (policy 35 §8.4) and the
  # open Dependabot alerts. 30-release-roadmap.md §4.4 R0 wants a dated entry per Medium. No
  # pnpm advisory has a fix short of a major upgrade; tauri's (2.11.1) is in its installed major
  # but needs cargo and a harness re-run. Each is accepted for one release cycle, past C-12.3's
  # 30 days for the six Mediums and past the next release (R0, cut 2026-10-22) for the esbuild
  # Low: that deviation is exception EX-09 (04-security-program.md §16.2), for the owner to
  # ratify on #2701. They expire when S09 starts, so the re-decision comes before the R1 cut,
  # not on it.
  # The gates block from High only and never read these entries (re-scored High or above, a
  # pnpm finding outgrows its entry and blocks; no gate reads the tauri one until the alert
  # gate lands), so check_accepted_risk_expiry.py enforces their dates.
  - id: "GHSA-wrjc-x8rr-h8h6"
    tool: npm-audit
    severity: MEDIUM
    reason: "react-router 6.30.6 ships in apps/web; fixed only in 7.18.0, a major. apps/web renders no <Link> and navigates only to its own route paths; nothing reads the login `next` parameter yet: re-decide before anything does"
    approver: "basiltt" # approval = the orchestrator's merge under the owner's delegation; ratification listed on #2701
    expires: "2026-11-20"
    ticket: "https://github.com/basiltt/CandleViewer/issues/1819"
  - id: "GHSA-337j-9hxr-rhxg"
    tool: npm-audit
    severity: MEDIUM
    reason: "react-router 6.30.6 ships in apps/web; fixed only in 7.18.0, a major. The flaw is in server-side-rendering hydration; apps/web renders in the browser only and sets no hydration data"
    approver: "basiltt" # approval = the orchestrator's merge under the owner's delegation; ratification listed on #2701
    expires: "2026-11-20"
    ticket: "https://github.com/basiltt/CandleViewer/issues/1819"
