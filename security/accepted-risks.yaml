    tool: codeql
    severity: HIGH
    reason: "False positive by construction: the test's expected-MAC helper computes the venue's keyed request MAC (HMAC-SHA256) over fixed test vectors; the API secret is an HMAC key, not a stored password — the production signer is secrets/signing.py::mac_hex"
