  # E07-T02 bootstrap-owner migration (0002_rbac_seed) prints a one-time
  # random password to stdout only, gated behind two operator-set env vars
  # (CV_BOOTSTRAP_OWNER_EMAIL and CV_BOOTSTRAP_OWNER_CONFIRM=1) so a routine
  # `alembic upgrade head` never emits it; the first login forces a password
  # change and MFA enrollment (Sec.10.2). CodeQL's clear-text-logging rule
  # cannot distinguish this gated, intentional operator handoff from an
  # unconditional secret leak. Sprint-01 owner-delegated acceptance
  # (2026-09-25); follow-up to replace the print with a structured,
  # redaction-aware bootstrap channel is out of this ticket's scope.
  - id: "py/clear-text-logging-sensitive-data:services/api/candleviewer/migrations/versions/0002_rbac_seed.py:146"
    tool: codeql
    severity: HIGH
    reason: "Gated one-time bootstrap-owner password print to stdout only, never a routine-upgrade path; forced change+MFA on first login"
    approver: "basiltt"
    expires: "2027-03-25"
    ticket: "https://github.com/CandleViewer/CandleViewer/issues/1551"
  # #3540 (first accepted under #1978): re-keyed from line 59, stale since #2612 added an
  # import above it. Pull request scans are diff-informed and never re-report an unchanged
  # line, so only a full scan (the merge queue) showed it. Triaged a false positive by
  # construction (orchestrator ruling); scripts/tests/test_security_gate.py now pins every
  # line-keyed codeql entry to the code it accepts. Expires with its twin (mfa_service.py:93)
  # at the GA cut, about five months after triage and the latest date the freeze test allows.
  # #4540 re-keyed it from line 75 to 94 (the placeholder-user constants above it), and #4648
  # from 94 to 106 (the failed sign-in floor's imports and constant above it), then to 108 (the
  # floor's default now read from settings), then to 126 (#4663: the sign-in verification bound's
  # imports and constants above it), then to 123 (#4664: the minimum-time hold moved to its own
  # module); the hashed value and its token source are unchanged, so the triage stands.
  - id: "py/weak-sensitive-data-hashing:services/api/candleviewer/auth/login_service.py:123"
    tool: codeql
    severity: HIGH
    reason: "False positive by construction: the SHA-256 digest is the lookup key for an opaque 256-bit random MFA challenge token (secrets.token_urlsafe(32)), not a password, so a slow KDF adds nothing. Re-check if the token source or the hashed value changes"
    approver: "basiltt" # approval = the orchestrator's merge under the owner's delegation; ratification listed on #2701
    expires: "2027-03-25"
    ticket: "https://github.com/CandleViewer/CandleViewer/issues/3540"
