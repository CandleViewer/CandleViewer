# E16-X02 (#494): the Owner's purge refusals for dast-admin-nightly.yml's phase A. Fixed, not
# drawn from matrix.yaml (which allows the Owner): the synthetic Owner signs in with password and
# TOTP and so holds no `recorder` step-up, and the purge handler refuses it after RBAC and the
# owner-only check, before reading the body: 403 `step_up_required` and a `retention.purge` denied
# record naming the request (security/zap/check_admin_denials.py). No request carries an
# Idempotency-Key: were the Owner ever elevated, the purge would answer 400, never 202.
# security/zap/admin_requests.py gives each request its own request id per run.
requests:
  - operation: POST /admin/recorder/purge
    expected: 403
    action: retention.purge
    json: { symbol: BTCUSDT, confirm_symbol: BTCUSDT, reason: zap owner purge refusal probe }
  - operation: POST /admin/recorder/purge
    expected: 403
    action: retention.purge
    json:
      symbol: BTCUSDT
      confirm_symbol: BTCUSDT
      reason: zap owner purge refusal probe, pinned
      include_pinned: true
