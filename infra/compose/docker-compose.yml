# infra/compose/docker-compose.yml — E02-T08 base stack.
#
# Image digests are REAL registry manifest digests (index digests for multi-arch tags), resolved
# and verified by tools/ci/resolve_image_digests.py (re-run it to refresh, `--check` in CI);
# ledger in infra/images/PINS.md. minio: minio/minio:RELEASE.2024-09-13T20-26-02Z is no longer
# served anonymously (#1586), so the same-date release is taken from bitnamilegacy/minio:2024.9.13.
networks:
  cv-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

secrets:
  # Webhook URLs are secret files supplied at start from the operator's env; never committed.
  alert_page_webhook_url:
    environment: CV_ALERT_PAGE_WEBHOOK_URL
  alert_ticket_webhook_url:
    environment: CV_ALERT_TICKET_WEBHOOK_URL
  alert_deadman_url:
    environment: CV_ALERT_DEADMAN_URL

volumes:
  cv-postgres-data:
  cv-questdb-data:
  cv-grafana-data:
  cv-alertmanager-data:
  cv-alertmanager-config:
  cv-minio-data:

# Base stack: no host port bindings live here except the loopback-explicit
# ones required by acceptance criteria 3 (B2, docs/plan/20-architecture.md
# Sec.2.2). docker-compose.dev.yml / docker-compose.vps.yml layer on top via
# `docker compose -f docker-compose.yml -f docker-compose.<env>.yml`.
services:
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-candleviewer}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cv} -d $${POSTGRES_DB:-candleviewer}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cv-internal]

  questdb:
    image: questdb/questdb:8.1.1@sha256:82ef61a3919f4014e2aae1216f2803288b176a54c197d0933863bdc8c04a2e03
    profiles: ["core"]
    ports:
      - "127.0.0.1:${QUESTDB_PG_PORT:-8812}:8812"
      - "127.0.0.1:${QUESTDB_ILP_PORT:-9009}:9009"
      - "127.0.0.1:${QUESTDB_HTTP_PORT:-9000}:9000"
    volumes:
      - cv-questdb-data:/var/lib/questdb
    # The final stage of questdb/questdb:8.1.1 is debian:bookworm-slim with no curl/wget
    # (only the runtime tarball, gosu and the entrypoint are copied in), so a curl-based
    # probe exits 127 forever and the service never leaves `unhealthy` (#276, run 36954315443).
    # Probe with bash's /dev/tcp instead: run a trivial SQL query via /exec and require a 200,
    # which only happens once the SQL engine (not merely the listener) is serving.
    # `$$status` is compose-escaped to `$status`; the request line is a printf argument so the
    # `%20` in the URL is never parsed as a format directive.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf '%s\r\nHost: 127.0.0.1\r\n\r\n' 'GET /exec?query=select%20count()%20from%20long_sequence(1) HTTP/1.0' >&3
          && read -r status <&3
          && case "$$status" in *' 200 '*) exit 0;; esac; exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [cv-internal]

  api:
    build:
      context: ../..
      dockerfile: infra/images/Dockerfile.api
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      questdb:
        condition: service_healthy
    environment:
      CV_ENVIRONMENT: ${CV_ENVIRONMENT:-demo}
      CV_FEED: ${CV_FEED:-synthetic}
      # The api's fixed private IP on cv-internal (never the wildcard, C-12.9); the host publish
      # below stays on 127.0.0.1 only.
      CV_BIND_HOST: 172.28.0.10
      CV_BIND_PORT: "8000"
      # /metrics refuses public binds; bind the api's fixed private IP so prometheus can scrape it.
      CV_METRICS_BIND: 172.28.0.10:9108
      CV_PG_DSN: ${CV_PG_DSN:-postgresql+asyncpg://cv:CHANGE_ME@postgres:5432/candleviewer}
      CV_QUESTDB_ILP: questdb:9009
      CV_QUESTDB_PG: questdb:8812
      CV_GIT_SHA: ${CV_GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:${CV_BIND_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://%s:%s/healthz' % (os.environ['CV_BIND_HOST'], os.environ['CV_BIND_PORT']), timeout=2).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      cv-internal:
        ipv4_address: 172.28.0.10

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    profiles: ["obs"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts:/etc/prometheus/alerts:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cv-internal]

  # Renders alertmanager.yml with CV_ALERT_QUIET_HOURS (render_config.py; unit-tested) into a
  # shared volume, then exits. Fails fast on a malformed window so Alertmanager never starts with it.
  alertmanager-config:
    image: python:3.12.7-alpine3.20@sha256:5049c050bdc68575a10bcb1885baa0689b6c15152d8a56a7e399fb49f783bf98
    profiles: ["obs"]
    environment:
      CV_ALERT_QUIET_HOURS: ${CV_ALERT_QUIET_HOURS:-22:00-07:00}
    command:
      ["python", "/src/render_config.py", "/src/alertmanager.yml", "/rendered/alertmanager.yml"]
    volumes:
      - ../alertmanager:/src:ro
      - cv-alertmanager-config:/rendered
    network_mode: none
    # One-shot: healthy once the rendered config exists (alertmanager waits on successful exit).
    healthcheck:
      test: ["CMD", "test", "-s", "/rendered/alertmanager.yml"]
      interval: 2s
      timeout: 2s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: ["obs"]
    # Private bind only. Webhook URLs are secret files injected at start, never in the repo.
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    command:
      ["--config.file=/etc/alertmanager/rendered/alertmanager.yml", "--storage.path=/alertmanager"]
    secrets: [alert_page_webhook_url, alert_ticket_webhook_url, alert_deadman_url]
    volumes:
      - cv-alertmanager-config:/etc/alertmanager/rendered:ro
      - ../alertmanager/templates:/etc/alertmanager/templates:ro
      - cv-alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cv-internal]

  # Receives alert-drill pushes (cv_synthetic_alert); scraped by Prometheus. Digest = multi-arch index
  # digest from https://hub.docker.com/v2/repositories/prom/pushgateway/tags/v1.9.0 (verified 2026-10-02).
  pushgateway:
    image: prom/pushgateway:v1.9.0@sha256:98a458415f8f5afcfd45622d289a0aa67063563bec0f90d598ebc76783571936
    profiles: ["obs"]
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cv-internal]

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    profiles: ["obs"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set in infra/compose/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - cv-grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cv-internal]

  minio:
    image: bitnamilegacy/minio:2024.9.13@sha256:8a92f71856f4b4b5755fa6afe4e7f9d0db7e18c889318f6772cb342d9b13470d
    profiles: ["cold"]
    environment:
      MINIO_CONSOLE_PORT_NUMBER: "9003"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cvminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/compose/.env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9003"
    volumes:
      - cv-minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cv-internal]
