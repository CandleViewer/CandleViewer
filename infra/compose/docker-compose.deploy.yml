# infra/compose/docker-compose.deploy.yml — the dev and staging deploys' overlay (E03-T09, #4249).
#
# tools/ci/deploy_dev.py applies this file last, over the base file only, and runs compose with
# `--no-build`: the api service, and the migrate one-shot that api waits for (#4014), run the image
# the deploy has just verified with cosign, by digest. deploy_dev.py supplies both variables, in
# compose's environment and in .env, and compose refuses to start while either is unset or empty.
# Not for local development: use docker-compose.dev.yml. infra/scripts/lint_compose.py checks this
# file: only the api and migrate services, each with its image pinned by these two variables and a
# pull policy, and the api with a read-only root filesystem (migrate's comes from the base file).
services:
  api:
    image: "${CV_API_IMAGE_REF:?set by tools/ci/deploy_dev.py}@${CV_IMAGE_DIGEST:?set by tools/ci/deploy_dev.py}"
    pull_policy: always
    read_only: true
  migrate:
    image: "${CV_API_IMAGE_REF:?set by tools/ci/deploy_dev.py}@${CV_IMAGE_DIGEST:?set by tools/ci/deploy_dev.py}"
    pull_policy: always
