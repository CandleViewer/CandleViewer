# infra/compose/docker-compose.dev.yml — dev override.
#
# Hot reload for `api` (bind-mount source, uvicorn --reload) and the
# synthetic feed as the hard default (no Bybit credentials needed). Applied
# with: `docker compose -f infra/compose/docker-compose.yml
# -f infra/compose/docker-compose.dev.yml --profile core --profile obs up -d`
# (or via the root `infra/docker-compose.dev.yml` pointer / `make up`).
services:
  api:
    build:
      target: builder
    entrypoint:
      - python
      - -m
      - candleviewer.server
      - --reload
    environment:
      CV_FEED: synthetic
      # SR-042 (#2090): the Vite dev server and `vite preview` origins, so login and every
      # browser write work in a default dev stack. Dev override only: the base file and
      # production leave CV_ALLOWED_ORIGINS empty (fail closed) until an operator sets it.
      CV_ALLOWED_ORIGINS: ${CV_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173}
    volumes:
      - ../../services/api/candleviewer:/app/candleviewer:ro
    read_only: false
