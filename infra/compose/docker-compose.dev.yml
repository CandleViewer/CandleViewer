# infra/compose/docker-compose.dev.yml — dev override.
#
# Hot reload for `api` (bind-mount source, uvicorn --reload) and the
# synthetic feed as the hard default (no Bybit credentials needed). Applied
# with: `docker compose -f infra/compose/docker-compose.yml
# -f infra/compose/docker-compose.dev.yml --profile core --profile obs up -d`
# (or via the root `infra/docker-compose.dev.yml` pointer / `make up`).
services:
  api:
    build:
      target: builder
    entrypoint:
      - python
      - -m
      - candleviewer.server
      - --reload
    environment:
      CV_FEED: synthetic
    volumes:
      - ../../services/api/candleviewer:/app/candleviewer:ro
    read_only: false
