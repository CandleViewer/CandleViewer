# E27-T04 (#837): account health and key-age alerts. Two severities only (ADR-0014 s6); runbooks
# in docs/plan/07-release-and-prr.md section 9. Series: metrics_catalogue.py, every state, reason
# and result bound at start by account_health_wiring.py, so `increase()` sees the first event.
# Per state, never per account (SR-125's allow-list): the runbooks find the account in the logs.
# Tests: promtool cases generated by infra/alertmanager/gen_promtool_tests.py, and
# services/api/tests/unit/observability/test_account_alert_rules.py. The page and the tickets have
# components of their own: the page-over-ticket inhibit rule never lets one hide the other.
groups:
  - name: accounts
    interval: 30s
    rules:
      - alert: AccountDown
        # US-ACCT-010: an account went down, no private-WS or REST success for 30 s after it was up
        # (`no_success`), and the page holds while it stays down. One that never connected since
        # boot reads `never_connected` and does not page: every monitored account does until the
        # private WS (#848) and the wallet read (E29) land. #3731 tracks the alert on an account
        # that stays never connected once they have. The counter arm catches a down that recovered
        # between two scrapes. A condition page: its [RESOLVED] means no account is down now and
        # none went down in the last 5 minutes. A restart reads every account as never connected,
        # so a page open across one resolves; the runbook says what to check, and #3731 tracks it.
        expr: >-
          max by (env) (cv_account_health_state{state="down",reason="no_success"}) > 0
          or sum by (env) (increase(cv_account_health_transitions_total{state="down"}[5m])) > 0
        for: 0m
        labels:
          severity: page
          component: account_health
        annotations:
          summary: "An exchange account went down after it was up"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-accountdown"
      - alert: KeyRotationWarn
        # US-ACCT-005: a key entered its warning window (CV_KEY_ROTATION_WARN_DAYS before the
        # rotation is due); the key-age job counts each key once as it enters. Nothing is disabled.
        # Tickets muted 22:00-07:00 UTC are never sent if they resolve inside it, so this is held
        # 9 h 30 m as the any-event tickets are (ws_gateway.yml header, its two preconditions).
        expr: sum by (env) (increase(cv_key_rotation_notices_total{state="warn"}[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: key_rotation
        annotations:
          summary: "An API key entered its rotation warning window"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyrotationwarn"
      - alert: KeyRotationOverdue
        # US-ACCT-005: a key is older than CV_KEY_ROTATION_POLICY_DAYS. The job counts each overdue
        # key once a day, so this fires again every day while one is. A key is never disabled for
        # its age: trading stays on. Held as the ticket above.
        expr: sum by (env) (increase(cv_key_rotation_notices_total{state="overdue"}[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: key_rotation
        annotations:
          summary: "An API key is overdue for rotation (never auto-disabled)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyrotationoverdue"
