# E04-T05: two severities only (page|ticket) - ADR-0014 s6, 20-architecture s12.5.
# Every rule needs annotations.runbook_url (CI: infra/alertmanager/check_alert_rules.py).
groups:
  - name: system-ticket
    interval: 30s
    rules:
      - alert: PublicWsDown
        expr: min by (socket) (ws_connection_state{socket="public"}) == 0
        for: 1m
        labels:
          severity: ticket
          component: ingestion
        annotations:
          summary: "Public WS connection down over 60 s"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-publicwsdown"
      - alert: BookResyncHigh
        expr: sum(rate(book_resync_total[5m])) * 60 > 5
        for: 5m
        labels:
          severity: ticket
          component: book
        annotations:
          summary: "Order-book resync rate above 5 per minute"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-bookresynchigh"
      - alert: EventLoopLagHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(event_loop_lag_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: ticket
          component: runtime
        annotations:
          summary: "Event-loop lag p99 above 100 ms"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-eventlooplaghigh"
      - alert: DiskHigh
        expr: disk_used_ratio > 0.8 and disk_used_ratio <= 0.95
        for: 5m
        labels:
          severity: ticket
          component: storage
        annotations:
          summary: "Disk usage above 80 percent"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-diskhigh"
      - alert: RuleAutodisarm
        expr: increase(rule_autodisarm_total[15m]) > 0
        for: 0m
        labels:
          severity: ticket
          component: rules
        annotations:
          summary: "A rule was auto-disarmed"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-ruleautodisarm"
      - alert: EnvMismatchAttempt
        expr: increase(env_mismatch_attempts_total[15m]) > 0
        for: 0m
        labels:
          severity: ticket
          component: oms
        annotations:
          summary: "Demo/live mismatch attempt blocked"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-envmismatchattempt"
      - alert: CredentialExpiryApproaching
        expr: min(credential_expiry_days) < 14
        for: 10m
        labels:
          severity: ticket
          component: secrets
        annotations:
          summary: "Credential or certificate expiry within 14 days"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-credentialexpiryapproaching"
      - alert: KeySelfCheckFailed
        # #836 (C-2.8, C-12.2, SR-032): a stored key fails a rule (a refused right, a whitelist that
        # is not the egress IP, SR-033, or any other), one alert per rule: order entry is read-only,
        # the account disarmed. A ticket by ruling: page promotion pending owner approval (#2701).
        expr: max by (env, rule) (cv_keys_failing_policy) > 0
        for: 0m
        labels:
          severity: ticket
          component: key_selfcheck
        annotations:
          summary: "A stored API key fails its self-check: order entry is read-only"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyselfcheckfailed"
      - alert: KeySelfCheckLatched
        # #836 (SR-E27-18, ADR-0009 item 4): the job latched order entry read-only (a key past its
        # window, keys it could not check, or a failure since fixed), a state gauge held until the
        # restart. A ticket by ruling: page promotion pending owner approval (#2701).
        expr: >-
          max by (env) (cv_key_selfcheck_latch_state) > 0
          unless on (env) max by (env) (cv_keys_failing_policy) > 0
        for: 0m
        labels:
          severity: ticket
          component: key_selfcheck
        annotations:
          summary: "The stored-key self-check holds order entry read-only until a restart"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyselfchecklatched"
      - alert: KeySelfCheckRunMissed
        # #836 (SR-E27-18): a run not begun within the interval plus 15 min; a stopped job counts
        # one each interval (at most 1 h), so 2 h holds it. Ends 2 h after the last increment, a
        # restart or not. A ticket by ruling: page promotion pending owner approval (#2701).
        expr: sum by (env) (increase(cv_key_selfcheck_missed_runs_total[2h])) > 0
        for: 0m
        labels:
          severity: ticket
          component: key_selfcheck
        annotations:
          summary: "A stored-key self-check run is overdue: the job may have stopped"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyselfchecklatched"
      - alert: KeyExpiringWithin14Days
        # #836 (SR-034): the soonest `expiredAt` of a stored key (+Inf for none) is under 14 days
        # away. One ticket per band, so each of the 14, 7 and 1 day lines raises a new one.
        expr: >-
          min by (env) (cv_key_soonest_expiry_seconds) < 14 * 86400
          and min by (env) (cv_key_soonest_expiry_seconds) >= 7 * 86400
        for: 10m
        labels:
          severity: ticket
          component: key_expiry
        annotations:
          summary: "A stored API key expires within 14 days (SR-034)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyexpiring"
      - alert: KeyExpiringWithin7Days
        expr: >-
          min by (env) (cv_key_soonest_expiry_seconds) < 7 * 86400
          and min by (env) (cv_key_soonest_expiry_seconds) >= 86400
        for: 10m
        labels:
          severity: ticket
          component: key_expiry
        annotations:
          summary: "A stored API key expires within 7 days (SR-034)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyexpiring"
      - alert: KeyExpiringWithin1Day
        # Above 0: 0 is the gauge before a watchdog sets it (none on the fake backend); a lapsed
        # key fails `key_expired` at its next check, which raises KeySelfCheckFailed.
        expr: >-
          min by (env) (cv_key_soonest_expiry_seconds) < 86400
          and min by (env) (cv_key_soonest_expiry_seconds) > 0
        for: 10m
        labels:
          severity: ticket
          component: key_expiry
        annotations:
          summary: "A stored API key expires within 1 day (SR-034)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-keyexpiring"
      - alert: AuthLoginFailureSpike
        expr: sum(increase(auth_login_failures_total[10m])) > 10
        for: 0m
        labels:
          severity: ticket
          component: auth
        annotations:
          summary: "Failed-login spike"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authloginfailurespike"
      - alert: AuthLockouts
        expr: increase(auth_lockouts_total[10m]) > 0
        for: 0m
        labels:
          severity: ticket
          component: auth
        annotations:
          summary: "Account lockout occurred"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authlockouts"
      - alert: AuthDisabledUserSessionRevoked
        # #3029 (SR-029, SR-125): a live session of a disabled or deleted user that no disable
        # revoked, found and revoked on use: the counter moves once per revoked row. A ticket, not
        # a page: the session is already revoked and the request refused (07-release-and-prr.md
        # section 9: a page is act now). Alertmanager mutes tickets 22:00-07:00 UTC and never
        # sends one that fires and resolves inside it, so the rule is held firing for 9 h 30 m,
        # as the WS any-event tickets are (ws_gateway.yml header, with its two preconditions).
        # The series has no user label; the log line `auth.disabled_user_session_revoked` names
        # the session and the user.
        expr: sum by (env) (increase(auth_disabled_user_sessions_revoked_total[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: auth
        annotations:
          summary: "A session outlived its user's disable and was revoked on use"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authdisabledusersessionrevoked"
      - alert: AuthRevocationLatencyHigh
        # #3415 (SR-029, E09-S03): the p99 revoke-to-close latency over 15 minutes is above 5 s,
        # a bucket edge, so the line is decided exactly. One observation per revocation that
        # attempted a close (ws/revocation.py) and one per disable's per-user close
        # (ws/permissions.py), each up to its last close initiated (sealed) or failed; the
        # socket's own close is not measured. Under 100 in the window, one slow one fires it.
        # No revocation in the window: every bucket's rate is 0 and the quantile is NaN, which
        # never fires. A ticket: the sockets are sealed (or the failure logged) by then, and REST
        # refuses the session already.
        # Held 9 h 30 m past its window as AuthDisabledUserSessionRevoked is (quiet hours).
        expr: histogram_quantile(0.99, sum by (env, le) (rate(auth_revocation_latency_seconds_bucket[15m]))) > 5
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: auth
        annotations:
          summary: "A session revocation took more than 5 s to seal its sockets (SR-029)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authrevocationlatencyhigh"
      - alert: AuthzDeniedSpike
        expr: sum(increase(authz_denied_total[10m])) > 20
        for: 0m
        labels:
          severity: ticket
          component: auth
        annotations:
          summary: "Permission-check failure spike"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authzdeniedspike"
      - alert: AuthAuditOutcomeLost
        # #2914: any outcome audit record lost after the action was taken. Component `auth_audit`,
        # shared only with the page `AuthAuditOutcomesLostBurst`, not `auth` (see that rule).
        expr: sum by (env) (increase(auth_audit_outcome_lost_total[15m])) > 0
        for: 0m
        labels:
          severity: ticket
          component: auth_audit
        annotations:
          summary: "An audit outcome record was lost after the action was taken (C-2.9)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authauditoutcomelost"
      - alert: CredentialVerificationFailures
        expr: increase(credential_verification_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
          component: secrets
        annotations:
          summary: "Exchange credential verification failed"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-credentialverificationfailures"
      - alert: OmsRateRejects
        expr: increase(oms_rate_reject_total[10m]) > 0
        for: 0m
        labels:
          severity: ticket
          component: oms
        annotations:
          summary: "Rate-limit rejections in OMS"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omsraterejects"
      - alert: EgressIpChanged
        expr: increase(egress_ip_changes_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
          component: network
        annotations:
          summary: "Egress IP changed"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-egressipchanged"
      - alert: AlertmanagerNotificationsFailed
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 0m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Alertmanager failed to deliver notifications"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-alertmanagernotificationsfailed"
      - alert: AuthBreakGlassStateReadFailing
        # #2496 review (SR-125, detection health): cv-api could not read the break-glass state
        # from Postgres. A failed read keeps the last value of auth_break_glass_unresolved_events
        # and auth_break_glass_attempts (0 in a fresh process), so their pages stay silent and the
        # absent() guards cannot see it: the series exist. Counted per statement, two a minute, so
        # a Postgres restart of a couple of minutes (PostgresDown's page) stays below the threshold;
        # 10 in 15 minutes is a reader that failed for five minutes, or one statement for ten. A
        # ticket under the `alerting` component: a page for a component hides that component's
        # tickets, and the two break-glass pages have components of their own.
        expr: sum by (env) (increase(auth_break_glass_state_read_failures_total[15m])) >= 10
        for: 0m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "The break-glass state cannot be read: its pages are blind"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authbreakglassstatereadfailing"
      - alert: UserLifecycleStepFailed
        # #965 R7: a step of the user disable cascade after its commit (socket close, session
        # sweep, B16 revoke, rule scope refresh, rule disarm, invite revoke) failed, or the
        # closing record of a disable that did not commit could not be written. Counted, logged
        # at error (`users.disable.step`) and never rolled back. A ticket, not a page: the
        # committed transaction already disabled the user and revoked their sessions and grants,
        # and the permission readers refuse a user who is not active (O5). E42-T09 (#2649): or
        # the live-socket push of a committed role change failed (`roles_push`, logged
        # `users.update.step`): the new roles hold for every new request, but the user's open
        # sockets may keep their earlier permissions. The grants push has its own ticket below.
        # Held past the quiet-hours mute as the WS any-event tickets are
        # (ws_gateway.yml header, with its two preconditions); every series is bound at import
        # (admin/lifecycle_metrics.py), so the first failure after a restart is an increase.
        expr: >-
          sum by (env) (increase(cv_user_lifecycle_steps_total{step!="grants_push",outcome="failed"}[15m]))
          > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: user_lifecycle
        annotations:
          summary: "A step of a user disable failed and is not retried"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-userlifecyclestepfailed"
      - alert: UserGrantsPushFailed
        # #2648 R7: a committed grant change was not pushed to the user's live sockets: the push
        # raised (`failed`), or the request stopped waiting for it after 2 s (`timeout`, AC3;
        # the push goes on and is counted again when it ends). Logged as `account access push`.
        # Held as the ticket above.
        expr: >-
          sum by (env) (increase(cv_user_lifecycle_steps_total{step="grants_push",outcome=~"failed|timeout"}[15m]))
          > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: user_lifecycle
        annotations:
          summary: "A grant change was not pushed to the user's live sockets in time"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-usergrantspushfailed"
      - alert: UserDisableFailed
        # #965 R7: a disable failed in its store (`result` `error`, no refusal): no step ran, though
        # a commit that raised may have landed. Held as the two above; their guard covers it too.
        expr: >-
          sum by (env) (increase(cv_user_lifecycle_total{action="disable",result="error"}[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: user_lifecycle
        annotations:
          summary: "A user disable failed in its store; none of its steps ran"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-userdisablefailed"
      - alert: BackupLastSuccessStale
        # #966 (E42-T05 BK-5, Q16): a backup kind's last success is over 26 h old for a daily kind,
        # or over 8 days for config_bundle. The API computes the age at scrape (BackupFreshness),
        # so it keeps growing while nothing succeeds, and a kind still stale when the 22:00-07:00
        # UTC ticket mute ends is sent then. A kind that never succeeded has no sample and never
        # fires, and the series is served only once a backup engine records runs
        # (BACKUPS_CATALOGUED, #3319). No absent() guard until that engine declares its scheduled
        # kinds: today a guard would stand for good. The thresholds assume daily runs (weekly for
        # config_bundle) ending within 2 h of their slot; admin/backups/limits.py allows a 24 h
        # run, so #3319 derives them again from measured durations. A ticket by ruling READY-27:
        # page promotion pending owner approval (#2701). Its own component, so no page inhibits it.
        expr: >-
          cv_backup_last_success_age_seconds{kind!="config_bundle"} > 26*3600
          or cv_backup_last_success_age_seconds{kind="config_bundle"} > 8*86400
        for: 15m
        labels:
          severity: ticket
          component: backup
        annotations:
          summary: "A backup kind has not succeeded for over 26 h (a daily kind) or 8 days (config_bundle)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-backuplastsuccessstale"
      - alert: RollOffStreamUnlisted
        # #3794: a nightly roll-off listed no closed day for a stream whose hot table holds aged
        # partitions, so that stream sits outside retention (deltas did, by their hour names).
        # The run increments once per stream; the 25 h window spans the nightly cadence.
        expr: sum by (env, stream) (increase(recorder_rolloff_streams_unlisted_total[25h])) > 0
        for: 0m
        labels:
          severity: ticket
          component: recorder
        annotations:
          summary: "Roll-off listed no closed day for a stream whose hot table holds aged partitions"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-rolloffstreamunlisted"
      # --- Journal-first audit lane (ADR-0037, #3009 S4a). Series: audit/metrics.py, read at the
      # scrape. Each rule is a ticket: ADR-0037 lists seven as pages, which only the Owner grants
      # (#2701), so each of those says so; a ticket is muted 22:00-07:00 UTC, so an event rule
      # holds with `keep_firing_for: 9h30m` (ws_gateway.yml header). Component `audit_lane`, or
      # `audit_sink` for the writer, so PostgresDown's inhibition (component `audit`) hides none.
      - alert: AuditSinkRefusing
        # page promotion pending owner approval (#2701; ADR-0037 lists it as a page)
        # A record a caller waited on was refused by the audit writer: its action failed closed.
        expr: sum by (env) (increase(cv_audit_writer_refused_total[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: audit_sink
        annotations:
          summary: "The audit sink refused a record its caller waited on: an audited action failed"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditsinkrefusing"
      - alert: AuditLaneBacklogAged
        # page promotion pending owner approval (#2701; ADR-0037 lists it as a page)
        # The oldest unconfirmed lane unit waited over 10 minutes: the sink is not taking them.
        expr: max by (env) (cv_audit_lane_oldest_age_seconds) > 600
        for: 0m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "Audit lane records have waited over 10 minutes for the audit sink"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlanebacklogaged"
      - alert: AuditLaneRefusing
        # page promotion pending owner approval (#2701; ADR-0037 lists it as a page)
        # The lane is stopped, or refused records (`held` is AuditLaneDrainHeld's): each fell back.
        expr: >-
          max by (env) (cv_audit_lane_state{state="stopped"}) > 0
          or sum by (env) (increase(cv_audit_lane_refused_total{reason!="held"}[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "The audit lane refuses records; they fall back to the audit sink"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlanerefusing"
      - alert: AuditLaneDrainHeld
        # page promotion pending owner approval (#2701; ADR-0037 lists it as a page)
        # The lane holds (review L6: the state, so a hold on a quiet lane alerts too).
        expr: max by (env) (cv_audit_lane_state{state="held"}) > 0
        for: 0m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "The audit lane holds: every lane record falls back to the audit sink"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlanerefusing"
      - alert: AuditLaneAnomaly
        # page promotion pending owner approval (#2701; ADR-0037 lists it as a page)
        # A critical `audit.lane_anomaly` row: lane material that was not authentic or in sequence.
        expr: sum by (env) (increase(cv_audit_lane_anomalies_total{reason!="torn_tail"}[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "The audit lane recorded a critical anomaly (tampering or damage)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlaneanomaly"
      - alert: AuditLaneTornTail
        # A torn tail alone is a ticket (ADR-0037): an append a crash cut short, a warning row.
        expr: sum by (env) (increase(cv_audit_lane_anomalies_total{reason="torn_tail"}[15m])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "The audit lane found a torn tail (an append cut short by a crash)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlaneanomaly"
      - alert: AuditLaneQuarantineGrowing
        # A ticket (ADR-0037): `quarantine/` grew, evidence kept for good with its PII (Q8).
        expr: max by (env) (delta(cv_audit_lane_quarantine_bytes[1h])) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "The audit lane's quarantine grew"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlaneanomaly"
      - alert: AuditLaneSeqRegressed
        # page promotion pending owner approval (#2701; ADR-0037 lists it as a page)
        # The head `seq` went down, across a restart gap of up to a day: a rollback or a lost lane.
        expr: max by (env) (resets(cv_audit_lane_last_seq[1d])) > 0
        for: 0m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "The audit lane's head went back: frames were rolled back or deleted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlaneseqregressed"
      - alert: AuditLaneCreated
        # page promotion pending owner approval (#2701; ADR-0037 lists it as a page)
        # A process wrote frame 1 of a new lane: the first boot, or a lane that was lost. The count
        # is set before the first scrape, so the rule reads it, not an increase, for 15 minutes.
        expr: >-
          max by (env) (max_over_time(cv_audit_lane_created_total[15m])) > 0
          unless on (env) max by (env) (max_over_time(cv_audit_lane_created_total[15m] offset 15m)) > 0
        for: 0m
        keep_firing_for: 9h30m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "A new audit lane was created (expected once, at the first boot)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlaneseqregressed"
      - alert: AuditLaneBootOvershoot
        # A boot wrote its rows past a lane cap (the lane was full at a restart). Set before the
        # first scrape, so read, not increased; a crash loop that dies first leaves its log lines.
        expr: max by (env) (max_over_time(cv_audit_lane_boot_overshoot_frames_total[1h])) > 0
        for: 0m
        labels:
          severity: ticket
          component: audit_lane
        annotations:
          summary: "cv-api booted with the audit lane past a cap"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditlanerefusing"
