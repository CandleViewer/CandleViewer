# E04-T05: two severities only (page|ticket) - ADR-0014 s6, 20-architecture s12.5.
# Every rule needs annotations.runbook_url (CI: infra/alertmanager/check_alert_rules.py).
groups:
  - name: metric-absent-guards
    interval: 30s
    rules:
      - alert: ExpectedMetricMissingNakedPositionAlertsTotal
        expr: absent(naked_position_alerts_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric naked_position_alerts_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingOmsUnknownOrders
        expr: absent(oms_unknown_orders)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric oms_unknown_orders is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingOmsPositionReadingOwedAgeSeconds
        expr: absent(oms_position_reading_owed_age_seconds)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric oms_position_reading_owed_age_seconds is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingCvKekDegradedState
        expr: absent(cv_kek_degraded_state)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_kek_degraded_state is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #889 S6b-2: the audit export signing key's page reads this gauge, bound at 0 from import.
      - alert: ExpectedMetricMissingCvAuditSigningKeyUnavailableState
        expr: absent(cv_audit_signing_key_unavailable_state)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_audit_signing_key_unavailable_state is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #889 S6b-2: the boot-step ticket's counter, both `step` values bound at 0 from import.
      - alert: ExpectedMetricMissingCvAuditSigningKeyBootFailuresTotal
        expr: absent(cv_audit_signing_key_boot_failures_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_audit_signing_key_boot_failures_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #836: the key self-check alerts' series. The first appears with a run, so its guard stands
      # where no self-check is wired (the fake backend: dev until #3180); the others are bound at 0.
      - alert: ExpectedMetricMissingCvKeysFailingPolicy
        expr: absent(cv_keys_failing_policy)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_keys_failing_policy is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingCvKeySelfcheckLatchState
        expr: absent(cv_key_selfcheck_latch_state)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_key_selfcheck_latch_state is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingCvKeySelfcheckMissedRunsTotal
        expr: absent(cv_key_selfcheck_missed_runs_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_key_selfcheck_missed_runs_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #2496: the series behind the NetBindingUnsafe and AuthRecoveryCodeUsed pages. The mesh
      # gauge went unscraped for its whole life before #2496; a page on it could never fire.
      - alert: ExpectedMetricMissingNetBindingSafe
        expr: absent(net_binding_safe)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric net_binding_safe is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingAuthRecoveryCodesUsedTotal
        expr: absent(auth_recovery_codes_used_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_recovery_codes_used_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #3029: the series behind the AuthDisabledUserSessionRevoked ticket. It reads 0 from process
      # start (auth/metrics.py binds it at import), so this stays quiet on a healthy idle system;
      # it fires only if the series is unscraped.
      - alert: ExpectedMetricMissingAuthDisabledUserSessionsRevokedTotal
        expr: absent(auth_disabled_user_sessions_revoked_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_disabled_user_sessions_revoked_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #3415: the series behind the AuthRevocationLatencyHigh ticket. Its buckets read 0 from
      # process start (auth/metrics.py declares it unlabelled), so this fires only if unscraped.
      - alert: ExpectedMetricMissingAuthRevocationLatencySecondsBucket
        expr: absent(auth_revocation_latency_seconds_bucket)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_revocation_latency_seconds_bucket is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #3635: the series behind the WsRevocationCloseFailed ticket. The counter is unlabelled and
      # declared at import (ws/revocation.py), so it reads 0 from process start (auth/metrics.py
      # serves it, in AUTH_EXPORTED_NAMES); this fires only if the series is unscraped.
      - alert: ExpectedMetricMissingWsSessionRevocationCloseFailuresTotal
        expr: absent(ws_session_revocation_close_failures_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric ws_session_revocation_close_failures_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #2111: the series behind the AuditVerifyNotPassing page. It reads 0 from boot while no
      # verify runner is wired, so this stays quiet then; it fires only if the series is unscraped.
      - alert: ExpectedMetricMissingCvAuditVerifyLastOkTimestampSeconds
        expr: absent(cv_audit_verify_last_ok_timestamp_seconds)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_audit_verify_last_ok_timestamp_seconds is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #2496 item 3: the series behind the AuthBreakGlassUsed page. A gauge exists from import,
      # so an absent series means the auth series are not served, not that nothing happened.
      - alert: ExpectedMetricMissingAuthBreakGlassUnresolvedEvents
        expr: absent(auth_break_glass_unresolved_events)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_break_glass_unresolved_events is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #2496 review: the series behind the AuthBreakGlassAttempted page (same reasoning).
      - alert: ExpectedMetricMissingAuthBreakGlassAttempts
        expr: absent(auth_break_glass_attempts)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_break_glass_attempts is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #4479 C2: the series behind the AuthOwnerBootstrapped page (same reasoning).
      - alert: ExpectedMetricMissingAuthOwnerBootstraps
        expr: absent(auth_owner_bootstraps)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_owner_bootstraps is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingHealthComponentState
        expr: absent(health_component_state)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric health_component_state is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingBuildInfo
        expr: absent(build_info)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric build_info is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingDiskUsedRatio
        expr: absent(disk_used_ratio)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric disk_used_ratio is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingAuditChainVerificationFailuresTotal
        expr: absent(audit_chain_verification_failures_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric audit_chain_verification_failures_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #2904: AuditBreakHaltEngaged reads this gauge, served from import (0) and set by the halt.
      - alert: ExpectedMetricMissingCvAuditBreakHaltState
        expr: absent(cv_audit_break_halt_state)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric cv_audit_break_halt_state is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      # #2914: read by the AuthAuditOutcomesLostBurst page; bound at import, so always present.
      - alert: ExpectedMetricMissingAuthAuditOutcomeLostTotal
        expr: absent(auth_audit_outcome_lost_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_audit_outcome_lost_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingWsConnectionState
        expr: absent(ws_connection_state)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric ws_connection_state is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingBookResyncTotal
        expr: absent(book_resync_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric book_resync_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingEventLoopLagSecondsBucket
        expr: absent(event_loop_lag_seconds_bucket)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric event_loop_lag_seconds_bucket is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingRuleAutodisarmTotal
        expr: absent(rule_autodisarm_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric rule_autodisarm_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingAuthLoginFailuresTotal
        expr: absent(auth_login_failures_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_login_failures_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingAuthLockoutsTotal
        expr: absent(auth_lockouts_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_lockouts_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingAuthLoginFailureFloorMissedTotal
        expr: absent(auth_login_failure_floor_missed_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_login_failure_floor_missed_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingAuthLoginVerifyRefusedTotal
        expr: absent(auth_login_verify_refused_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric auth_login_verify_refused_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingAuthzDeniedTotal
        expr: absent(authz_denied_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric authz_denied_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingCredentialVerificationFailuresTotal
        expr: absent(credential_verification_failures_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric credential_verification_failures_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingOmsRateRejectTotal
        expr: absent(oms_rate_reject_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric oms_rate_reject_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingEgressIpChangesTotal
        expr: absent(egress_ip_changes_total)
