      - alert: ExpectedMetricMissingWsConnectionState
        expr: absent(ws_connection_state)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric ws_connection_state is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingBookResyncTotal
        expr: absent(book_resync_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric book_resync_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingEventLoopLagSecondsBucket
        expr: absent(event_loop_lag_seconds_bucket)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric event_loop_lag_seconds_bucket is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingRuleAutodisarmTotal
        expr: absent(rule_autodisarm_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric rule_autodisarm_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingEnvMismatchAttemptsTotal
        expr: absent(env_mismatch_attempts_total)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric env_mismatch_attempts_total is not emitted"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-expectedmetricmissing"
      - alert: ExpectedMetricMissingCredentialExpiryDays
        expr: absent(credential_expiry_days)
        for: 15m
        labels:
          severity: ticket
          component: alerting
        annotations:
          summary: "Expected metric credential_expiry_days is not emitted"
