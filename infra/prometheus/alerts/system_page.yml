# E04-T05: two severities only (page|ticket) - ADR-0014 s6, 20-architecture s12.5.
# Every rule needs annotations.runbook_url (CI: infra/alertmanager/check_alert_rules.py).
groups:
  - name: system-page
    interval: 30s
    rules:
      - alert: NakedPositionDetected
        # E29-T08 #916 BQ-4: an event page (`resolves: window`, #2931). The stuck-order detector
        # counts the series once per episode of an open position with no exchange-side stop past
        # CV_NATIVE_SL_DEADLINE_MS (3 s), read-only and alert-only: it never attaches or flattens
        # (C-2.6, C-2.21); reconciliation counts each stop it repairs (24 Sec.8.5 step 5). The page
        # clears when its 5 minute window moves on, not when the position is protected, so its
        # receiver sends no [RESOLVED] (infra/alertmanager/alertmanager.yml). A first sample
        # already above 0, with none 5 minutes before, counts too (#916 PR B's security look, N1):
        # increase() has nothing before it, so a detection ahead of the first scrape would page
        # nowhere here. Safe for a counter bound at 0 when its runtime is composed; a gap of more
        # than 5 minutes in the scrapes of a process whose count is above 0 pages once more, a
        # false alarm on the safe side.
        expr: >-
          increase(naked_position_alerts_total[5m]) > 0
          or (naked_position_alerts_total unless naked_position_alerts_total offset 5m) > 0
        for: 0m
        labels:
          severity: page
          component: oms
          resolves: window
        annotations:
          summary: "A position was detected without a native stop-loss"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-nakedpositiondetected"
      - alert: OmsUnknownOrders
        # ADR-0006 rule 3; E29-T08 #916 BQ-7: every reason but `already_terminal` (a cancel the
        # venue answered 110001, 24 Sec.8.6), which OmsUnknownOrdersAlreadyTerminal tickets once one
        # is held 5 minutes. Each reason's child is bound at 0, so the series exists with no order
        # there (ExpectedMetricMissingOmsUnknownOrders). A condition page.
        expr: sum by (env) (oms_unknown_orders{reason!="already_terminal"}) > 0
        for: 1m
        labels:
          severity: page
          component: oms
        annotations:
          summary: "OMS holds orders in an unknown state"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omsunknownorders"
      - alert: OmsPositionReadingOwed
        # E29-T05 (20 Sec.12.5, 24 Sec.8.12): a position reading owed to protection for a minute
        # (C-2.6): not handed on, held as dated ahead of the store's clock, or evicted from that
        # hold. The private-stream consumer's gauge, read at each scrape; at 120 s the `oms` check
        # of /readyz is degraded too. A condition page: it resolves once the reading is handed on.
        expr: oms_position_reading_owed_age_seconds >= 60
        for: 0m
        labels:
          severity: page
          component: oms
        annotations:
          summary: "A position reading has been owed to protection for a minute or more"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omspositionreadingowed"
      # --- E29-T08 (#916): the OMS pages the ticket owns (BQ-1, BQ-8, BQ-12). A page that can stand
      # for days takes a component of its own, as BQ-8 rules for the untracked page: a page hides
      # the tickets of its component (alertmanager.yml), so no `oms` ticket waits behind it. A page
      # that ends with its window keeps `oms`. A page over a counter's window is an event page
      # (`resolves: window`): its window moving on says nothing about the cause.
      - alert: OmsUntrackedOrders
        # BQ-8 (approved under the delegation, the observability contract's Owner approval):
        # exchange orders reconciliation recorded `untracked` and never manages (S9, SR-E29-12,
        # SR-E27-19), as each account's last pass counted them; unconditional, `for` included. A
        # resting manual order can hold it for days (24 Sec.8.10), hence `oms_untracked`. A
        # condition page.
        expr: max by (env) (oms_untracked_orders) > 0
        for: 0m
        labels:
          severity: page
          component: oms_untracked
        annotations:
          summary: "Exchange orders are untracked: the OMS records them and never manages them"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omsuntrackedorders"
      - alert: OmsStaleAccounts
        # BQ-1 (#914's ruling, BQ-11: it pages above 0): an account refused order entry with
        # `account_stale` (24 Sec.8.5), its job locked stale (B19 stale_lockout: 2 minutes of failed
        # fetches, or a refused snapshot) until the Owner resolves it, or not opened. PROPOSED (no
        # ruling sets them): the 1m hold, since each start marks every account stale until its job
        # opens (oms/reconcile_job.py ReconcileJobs.start), and `oms_stale`, since a lock stands
        # until the Owner acts. A condition page.
        expr: max by (env) (oms_stale_accounts) > 0
        for: 1m
        labels:
          severity: page
          component: oms_stale
        annotations:
          summary: "An account is stale: its order entry is refused until the Owner resolves it"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omsstaleaccounts"
      - alert: OmsClockHaltTripped
        # BQ-12 item 1 (20 Sec.12.1 "page > 0"; 24 Sec.8.6's distinct alert for a 10002): a 10002
        # that reached an order tripped the clock halt, which refuses every order request until a
        # measurement taken after the trip clears it. Bound at 0 with the halt, so the first trip is
        # an increase. PROPOSED: the 15 minute window, and the event class.
        expr: sum by (env) (increase(oms_clock_halt_trips_total[15m])) > 0
        for: 0m
        labels:
          severity: page
          component: oms
          resolves: window
        annotations:
          summary: "Order entry was halted on clock drift (a 10002 reached an order)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omsclockhalttripped"
      - alert: OmsSubmitFailing
        # BQ-12 item 2 (E29-T04's promise, 20 Sec.12.1): order requests refused for the order store
        # (`store_unavailable`), the audit sink (`audit_unavailable`) or a fault (`internal_error`),
        # at least one in each 5 minutes, held 5 minutes: order entry failing, not one refusal (a
        # fault is logged and paged where it happens). A `code` child is bound at its first refusal,
        # so its first sample, with none 5 minutes before, counts too, as BybitRowsRefusedAccount
        # reads its first one; `absent()` would stand on a healthy process, so no guard watches it
        # (`lazy-series` in tests/qa/e04_q02_alert_guard_baseline.json). One refusal never pages:
        # its first-sample arm ends as the hold would end. Two refusals 40 s or more apart within 5
        # minutes page, and closer pairs may (with 10 s scrapes and 30 s evaluation, a pair 30 s
        # apart pages in two of three alignments): the second keeps the 5 minute increase above 0
        # past the hold the first began, so a blip of the store or the audit sink that refuses two
        # orders pages (a case pins the aligned 30 s pair: refusals at 5:00 and 5:30 page at 10
        # minutes, ended at 11; Prometheus 3's left-open windows would need it re-derived).
        # PROPOSED, kept by the orchestrator's ruling on #916 PR B's code look (m2): that reading of
        # 20 Sec.12.1's "> 0 for 5 min", the 5 minute window, and the event class (no refusal for 5
        # minutes may only mean no order was tried). Its owner, the E04 alert owner
        # (docs/plan/observability-contract.md), may re-tune it with its runbook (07 Sec.9).
        expr: >-
          sum by (env) (increase(oms_submit_rejected_total{code=~"store_unavailable|audit_unavailable|internal_error"}[5m])) > 0
          or sum by (env) (oms_submit_rejected_total{code=~"store_unavailable|audit_unavailable|internal_error"}
          unless oms_submit_rejected_total{code=~"store_unavailable|audit_unavailable|internal_error"} offset 5m) > 0
        for: 5m
        labels:
          severity: page
          component: oms
          resolves: window
        annotations:
          summary: "Order entry is failing: requests refused for the store, the audit sink or a fault for 5 minutes"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omssubmitfailing"
      - alert: OmsNativeStopBackstop
        # BQ-12 item 2 (E29-T04's promise, 20 Sec.12.1 "page > 0"; C-2.6): an entry reached the
        # order facade without a native stop and the start() backstop refused it at VALIDATE,
        # nothing sent: a caller defect, logged at ERROR. Bound at 0 with the facade. PROPOSED: the
        # 15 minute window, and the event class (the window moving on does not fix the caller).
        expr: sum by (env) (increase(oms_native_stop_backstop_total[15m])) > 0
        for: 0m
        labels:
          severity: page
          component: oms
          resolves: window
        annotations:
          summary: "An entry without a native stop-loss reached the order facade and was refused"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omsnativestopbackstop"
      - alert: PostgresDown
        # #5174: the API's own Postgres probe (health_wiring.py: SELECT 1 each second), 3 = down.
        # `build_info` supplies `env`, so the PostgresDown inhibit rule (equal: [env]) can match.
        # Blind while the API is down: ApiDown covers that (its runbook says to check Postgres).
        expr: >-
          max by (env) (
            health_component_state{component="postgres"}
            * on (job, instance) group_left (env) build_info
          ) == 3
        for: 1m
        labels:
          severity: page
          component: postgres
        annotations:
          summary: "Postgres is down"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-postgresdown"
      - alert: PostgresDegraded
        # #5174: the same probe reading 1 (degraded) is a probe timeout (1.5 s): a black-holed
        # database answers nothing. Held for 5 minutes it is a timeout streak, so the DB is unusable
        # for trading; a brief DEGRADED stays silent.
        expr: >-
          max by (env) (
            health_component_state{component="postgres"}
            * on (job, instance) group_left (env) build_info
          ) == 1
        for: 5m
        labels:
          severity: page
          component: postgres
        annotations:
          summary: "Postgres is not answering (probe timing out)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-postgresdegraded"
      - alert: ApiDown
        # #5174 (NQ-2): Prometheus cannot scrape cv-api (process down, hung, its metrics bind gone),
        # or the job is missing from prometheus.yml. Every page that reads its series is blind then.
        expr: up{job="candleviewer-api"} == 0 or absent(up{job="candleviewer-api"})
        for: 3m
        labels:
          severity: page
          component: api
        annotations:
          summary: "cv-api cannot be scraped: every page that reads its series is blind"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-apidown"
      - alert: DiskCritical
        expr: disk_used_ratio > 0.95
        for: 2m
        labels:
          severity: page
          component: storage
        annotations:
          summary: "Disk usage above 95 percent"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-diskcritical"
      - alert: AuditChainVerificationFailed
        # #2931: an event page. A failed verification run raises the counter and this clears 10
        # minutes later whether or not the chain was repaired (the break is found again at every
        # start-up and nightly run), so a [RESOLVED] would read as repaired: `resolves: window`
        # routes it to the receiver that sends none (infra/alertmanager/alertmanager.yml).
        expr: increase(audit_chain_verification_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: page
          component: audit
          resolves: window
        annotations:
          summary: "Audit chain verification failed"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditchainverificationfailed"
      - alert: AuditVerifyNotPassing
        # #2111: no verify run passed for 26 h (the daily run + 2 h: a deadline up to 5400 s; a
        # longer one needs 24 h + deadline + 30 min, see 24-internal-schemas.md section 15.4).
        # The gauge pages within one process, the counter across restarts. #2966: in `live`, a
        # gauge that reads 0 pages at once. The job sets the gauge to its start time as it starts,
        # before the first scrape, so 0 means no runner is wired (the API runs on the fake backend,
        # or the wiring regressed) and nothing checks the audit chain. Other environments may run
        # the fake backend: there 0 stays quiet. Its own component, so this page, which can
        # stand for days, inhibits none of the audit tickets.
        expr: >-
          time() - max by (env) (cv_audit_verify_last_ok_timestamp_seconds > 0) > 26 * 3600
          or (sum by (env) (increase(cv_audit_verify_runs_total{result!="ok"}[26h])) > 0
          unless sum by (env) (increase(cv_audit_verify_runs_total{result="ok"}[26h])) > 0)
          or max by (env) (cv_audit_verify_last_ok_timestamp_seconds{env="live"}) == 0
        for: 0m
        labels:
          severity: page
          component: audit_verify
        annotations:
          summary: "Audit chain verification is not passing: no run passed for 26 hours, or no runner is wired in live"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditverifynotpassing"
      - alert: AuditBreakHaltEngaged
        # #2904: order entry is halted after a verified audit-chain break (04 section 8.1
        # "Enforced posture"), or the API could not read the halt records (fail closed). A
        # condition page: it stands until the Owner acknowledges the break, and its [RESOLVED]
        # means order entry resumed. Its own component, so AuditChainVerificationFailed's window
        # and this page never inhibit each other.
        expr: max by (env) (cv_audit_break_halt_state) == 1
        for: 1m
        labels:
          severity: page
          component: audit_break_halt
        annotations:
          summary: "Order entry halted after an audit-chain break: the Owner must acknowledge it"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditbreakhaltengaged"
      - alert: KekUnavailable
        # A state gauge, not increase(): the failure happens at boot before the first scrape,
        # and the latch lasts for the life of the process (E27-T02 review).
        expr: max by (env) (cv_kek_degraded_state) == 1
        for: 0m
        labels:
          severity: page
          component: secrets
        annotations:
          summary: "KEK unavailable: credential broker degraded, trading disabled"
          runbook_url: "docs/ops/runbooks/kek-custody.md#alert-kekunavailable"
      - alert: AuditSigningKeyUnavailable
        # #889 S6b-2 (ADR-0039 decision 2): the audit export signing key cannot be used with the
        # KEK up, so export alone is refused and trading is not. A state gauge, as KekUnavailable
        # is: boot sets it before the first scrape, or a signature that finds the key unusable sets
        # it mid-process (S6b-3), and it holds for the life of the process. Its
        # own component, as NetBindingUnsafe's is: it may stand for days (ADR-0039 Q4), and a page
        # hides its component's tickets, so no `secrets` ticket is hidden behind it.
        expr: max by (env) (cv_audit_signing_key_unavailable_state) == 1
        for: 0m
        labels:
          severity: page
          component: audit_signing
        annotations:
          summary: "Audit export signing key unavailable: export refused, trading unaffected"
          runbook_url: "docs/ops/runbooks/kek-custody.md#alert-auditsigningkeyunavailable"
      - alert: AuthKeyringUnavailable
        # #2152 (ADR-0009 Amendment 4, BQ-14): the environment's auth keyring cannot be used with
        # the KEK up, so the MFA operations answer 503 auth_unavailable and trading is not
        # latched. A state gauge, as AuditSigningKeyUnavailable's: boot sets it before the first
        # scrape and it holds for the life of the process. Its own component, so no `secrets`
        # ticket is hidden behind it; with the KEK down KekUnavailable pages instead.
        expr: max by (env) (cv_auth_keyring_unavailable_state) == 1
        for: 0m
        labels:
          severity: page
          component: auth_keyring
        annotations:
          summary: "Auth keyring unavailable: MFA answers 503, trading unaffected"
          runbook_url: "docs/ops/runbooks/kek-custody.md#alert-authkeyringunavailable"
      - alert: NetBindingUnsafe
        # #2496 (E09-T04: fires as soon as the gauge goes to 0). The mesh guard found a public or
        # off-mesh listener, or could not check, and tripped the read-only gate: no new orders.
        # Its own component, so this page inhibits no other component's ticket.
        expr: min by (env) (net_binding_safe) == 0
        for: 0m
        labels:
          severity: page
          component: net
        annotations:
          summary: "Mesh binding guard tripped: order placement is read-only"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-netbindingunsafe"
      - alert: AuthRecoveryCodeUsed
        # #2496 (SR-022: each use "alerts the Owner"): any accepted recovery code. It fires for
        # 15 minutes after a use, so it pages: a muted ticket that resolves inside quiet hours
        # is never notified. Its own component, so this page inhibits none of the auth tickets.
        # The series has no user label; the auth.recovery_code_used audit row names the user.
        # #2931: an event page. It clears when that window moves on, not when anyone acts, so a
        # [RESOLVED] would read as handled: `resolves: window` routes it to the receiver that
        # sends none (infra/alertmanager/alertmanager.yml).
        expr: sum by (env) (increase(auth_recovery_codes_used_total[15m])) > 0
        for: 0m
        labels:
          severity: page
          component: auth_recovery
          resolves: window
        annotations:
          summary: "A recovery code was used: confirm it was the account holder"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authrecoverycodeused"
      - alert: AuthBreakGlassUsed
        # #2496 item 3 (SR-023): an offline break-glass reset left a critical `break_glass_used`
        # system event that nobody has resolved. A gauge of how many are unresolved, not a counter
        # of the records the boot fold-in moves: the CLI flushes its records to audit_log, so a use
        # folds nothing in, and the fold-in runs before the first scrape, so such a counter could
        # never show an increase(). The CLI runs only while cv-api is stopped, so the page first
        # appears at the restart after it; max_over_time keeps it through any later restart or
        # scrape gap shorter than the window. No user label (the audit rows say who and when), and
        # a component of its own, so it inhibits no auth ticket.
        # #2931: an event page. It also ends when cv-api has been down for the window, which a
        # [RESOLVED] would report as handled while the event is unresolved.
        expr: max by (env) (max_over_time(auth_break_glass_unresolved_events[15m])) >= 1
        for: 0m
        labels:
          severity: page
          component: auth_break_glass
          resolves: window
        annotations:
          summary: "Break-glass recovery was used on this host: review the audit log"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authbreakglassused"
      - alert: AuthBreakGlassAttempted
        # #2496 review (SR-023; the E09 threat model routes "alert on any break-glass invocation"
        # to E09-X03): a CLI run that changed nothing (refused: not an Owner, no KEK proof, no
        # terminal, cv-api running, a wrong phrase) or was cut short leaves audit rows and no
        # `break_glass_used` event, so AuthBreakGlassUsed never sees it. The gauge counts the
        # `auth.break_glass_attempt` rows, one per run whatever its outcome, and only rises. A
        # completed reset raises it too, so it pages together with AuthBreakGlassUsed.
        # Read as a rise against what Prometheus held before the last 15 minutes, not as an
        # increase(): the CLI runs only while cv-api is stopped, so the first scrape after the
        # restart already holds the new count and an increase() window has nothing before it.
        # The page ends 15 minutes after the first scrape that shows the rise (that scrape is
        # then in the right-hand window), so one run is one page, and runs less than 15 minutes
        # apart share it. It needs a sample from before the run: with no sample in the 7 days
        # before the last 15 minutes (a Prometheus with no history of the series, or a refused
        # run after cv-api was stopped for more than a week) it sees no rise, which is also why
        # it never pages on old runs at rollout. No user label (the audit rows say who and when);
        # a component of its own.
        # #2931: an event page, so no [RESOLVED] message follows the window.
        expr: max by (env) (max_over_time(auth_break_glass_attempts[15m])) > max by (env) (max_over_time(auth_break_glass_attempts[7d] offset 15m))
        for: 0m
        labels:
          severity: page
          component: auth_break_glass_attempt
          resolves: window
        annotations:
          summary: "A break-glass run was recorded on this host: review the audit log"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authbreakglassattempted"
      - alert: AuthOwnerBootstrapped
        # #4479 C2 (SR-023, threat model U46): a first Owner was made through the offline
        # bootstrap invite. The gauge counts the CRITICAL `users.owner_bootstrapped` rows, one per
        # grant, written ahead in the grant's own transaction: it only rises and is read at boot
        # and every refresh, as auth_break_glass_attempts is. PR-B's `auth`/`owner_bootstrapped`
        # system event and its gauge auth_owner_bootstrap_events are not the source: the event
        # resolves at the redeemer's first MFA sign-in, a thief's too, and the gauge resets on a
        # restart. It pages on a rise against the maximum of the 7 days before the last 15
        # minutes, as AuthBreakGlassAttempted does, or on a count above 0 with no sample there at
        # all: a Prometheus that first scrapes cv-api after the redemption has nothing to compare
        # with, and the grant still pages. That second arm also pages once on a bootstrapped
        # database for a Prometheus that lost its history, or a cv-api down for more than 7 days:
        # a false alarm on the safe side. Either way the page ends 15 minutes after the first
        # scrape that shows the count. No user label (the audit rows say who and from where); a
        # component of its own.
        # #2931: an event page, so no [RESOLVED] message follows the window.
        expr: max by (env) (max_over_time(auth_owner_bootstraps[15m])) > max by (env) (max_over_time(auth_owner_bootstraps[7d] offset 15m)) or (max by (env) (max_over_time(auth_owner_bootstraps[15m])) > 0 unless max by (env) (max_over_time(auth_owner_bootstraps[7d] offset 15m)))
        for: 0m
        labels:
          severity: page
          component: auth_owner_bootstrap
          resolves: window
        annotations:
          summary: "A first Owner was bootstrapped on this host: review the audit log"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authownerbootstrapped"
      - alert: AuthAuditOutcomesLostBurst
        # #2914 (04-security-program.md section 8.3 rule 2): more than 5 outcome audit records lost
        # in 15 minutes, so the audit sink is failing while sessions are still being revoked. Its
        # own component, shared only with the ticket `AuthAuditOutcomeLost`: a page inhibits the
        # tickets of its own component, and under `auth` it would hide the lockout, step-up and
        # CSRF tickets while the sink fails (a test pins it).
        # #2931: an event page. It clears when that window moves on, not when the sink is repaired:
        # a sink that still refuses records fails every sign-out at its write-ahead record, which
        # no counter sees, so the count stops rising and the page clears with the sink down. A
        # [RESOLVED] would read as recovered: `resolves: window` routes it to the receiver that
        # sends none (infra/alertmanager/alertmanager.yml).
        expr: sum by (env) (increase(auth_audit_outcome_lost_total[15m])) > 5
        for: 0m
        labels:
          severity: page
          component: auth_audit
          resolves: window
        annotations:
          summary: "More than 5 audit outcome records lost in 15 min: the audit sink is failing (C-2.9)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authauditoutcomelost"
      - alert: SyntheticAlert
        expr: cv_synthetic_alert == 1
        for: 1m
        labels:
          severity: page
          component: alerting
        annotations:
          summary: "Synthetic drill alert (alert-drill)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-syntheticalert"
