# E04-T05: two severities only (page|ticket) - ADR-0014 s6, 20-architecture s12.5.
# Every rule needs annotations.runbook_url (CI: infra/alertmanager/check_alert_rules.py).
groups:
  - name: system-page
    interval: 30s
    rules:
      - alert: NakedPositionDetected
        # #2931: not classified as an event page (`resolves: window`) yet: that depends on how the
        # E32 watchdog counts this series. See EVENT_TYPE_PAGES in
        # infra/alertmanager/tests/test_alerting_config.py.
        expr: increase(naked_position_alerts_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          component: oms
        annotations:
          summary: "A position was detected without a native stop-loss"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-nakedpositiondetected"
      - alert: OmsUnknownOrders
        expr: oms_unknown_orders > 0
        for: 1m
        labels:
          severity: page
          component: oms
        annotations:
          summary: "OMS holds orders in an unknown state"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-omsunknownorders"
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: page
          component: postgres
        annotations:
          summary: "Postgres is down"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-postgresdown"
      - alert: ClockDriftBlockingTrading
        expr: abs(bybit_clock_drift_ms) > 1500
        for: 1m
        labels:
          severity: page
          component: clock
        annotations:
          summary: "Clock drift is blocking order entry"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-clockdriftblockingtrading"
      - alert: DiskCritical
        expr: disk_used_ratio > 0.95
        for: 2m
        labels:
          severity: page
          component: storage
        annotations:
          summary: "Disk usage above 95 percent"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-diskcritical"
      - alert: AuditChainVerificationFailed
        # #2931: an event page. A failed verification run raises the counter and this clears 10
        # minutes later whether or not the chain was repaired (the break is found again at every
        # start-up and nightly run), so a [RESOLVED] would read as repaired: `resolves: window`
        # routes it to the receiver that sends none (infra/alertmanager/alertmanager.yml).
        expr: increase(audit_chain_verification_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: page
          component: audit
          resolves: window
        annotations:
          summary: "Audit chain verification failed"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-auditchainverificationfailed"
      - alert: KekUnavailable
        # A state gauge, not increase(): the failure happens at boot before the first scrape,
        # and the latch lasts for the life of the process (E27-T02 review).
        expr: max by (env) (cv_kek_degraded_state) == 1
        for: 0m
        labels:
          severity: page
          component: secrets
        annotations:
          summary: "KEK unavailable: credential broker degraded, trading disabled"
          runbook_url: "docs/ops/runbooks/kek-custody.md#alert-kekunavailable"
      - alert: NetBindingUnsafe
        # #2496 (E09-T04: fires as soon as the gauge goes to 0). The mesh guard found a public or
        # off-mesh listener, or could not check, and tripped the read-only gate: no new orders.
        # Its own component, so this page inhibits no other component's ticket.
        expr: min by (env) (net_binding_safe) == 0
        for: 0m
        labels:
          severity: page
          component: net
        annotations:
          summary: "Mesh binding guard tripped: order placement is read-only"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-netbindingunsafe"
      - alert: AuthRecoveryCodeUsed
        # #2496 (SR-022: each use "alerts the Owner"): any accepted recovery code. It fires for
        # 15 minutes after a use, so it pages: a muted ticket that resolves inside quiet hours
        # is never notified. Its own component, so this page inhibits none of the auth tickets.
        # The series has no user label; the auth.recovery_code_used audit row names the user.
        # #2931: an event page. It clears when that window moves on, not when anyone acts, so a
        # [RESOLVED] would read as handled: `resolves: window` routes it to the receiver that
        # sends none (infra/alertmanager/alertmanager.yml).
        expr: sum by (env) (increase(auth_recovery_codes_used_total[15m])) > 0
        for: 0m
        labels:
          severity: page
          component: auth_recovery
          resolves: window
        annotations:
          summary: "A recovery code was used: confirm it was the account holder"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authrecoverycodeused"
      - alert: AuthBreakGlassUsed
        # #2496 item 3 (SR-023): an offline break-glass reset left a critical `break_glass_used`
        # system event that nobody has resolved. A gauge of how many are unresolved, not a counter
        # of the records the boot fold-in moves: the CLI flushes its records to audit_log, so a use
        # folds nothing in, and the fold-in runs before the first scrape, so such a counter could
        # never show an increase(). The CLI runs only while cv-api is stopped, so the page first
        # appears at the restart after it; max_over_time keeps it through any later restart or
        # scrape gap shorter than the window. No user label (the audit rows say who and when), and
        # a component of its own, so it inhibits no auth ticket.
        # #2931: an event page. It also ends when cv-api has been down for the window, which a
        # [RESOLVED] would report as handled while the event is unresolved.
        expr: max by (env) (max_over_time(auth_break_glass_unresolved_events[15m])) >= 1
        for: 0m
        labels:
          severity: page
          component: auth_break_glass
          resolves: window
        annotations:
          summary: "Break-glass recovery was used on this host: review the audit log"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authbreakglassused"
      - alert: AuthBreakGlassAttempted
        # #2496 review (SR-023; the E09 threat model routes "alert on any break-glass invocation"
        # to E09-X03): a CLI run that changed nothing (refused: not an Owner, no KEK proof, no
        # terminal, cv-api running, a wrong phrase) or was cut short leaves audit rows and no
        # `break_glass_used` event, so AuthBreakGlassUsed never sees it. The gauge counts the
        # `auth.break_glass_attempt` rows, one per run whatever its outcome, and only rises. A
        # completed reset raises it too, so it pages together with AuthBreakGlassUsed.
        # Read as a rise against what Prometheus held before the last 15 minutes, not as an
        # increase(): the CLI runs only while cv-api is stopped, so the first scrape after the
        # restart already holds the new count and an increase() window has nothing before it.
        # The page ends 15 minutes after the first scrape that shows the rise (that scrape is
        # then in the right-hand window), so one run is one page, and runs less than 15 minutes
        # apart share it. It needs a sample from before the run: a Prometheus with no history of
        # the series (a new one) sees no rise, which is also why it never pages on old runs at
        # rollout. No user label (the audit rows say who and when); a component of its own.
        # #2931: an event page, so no [RESOLVED] message follows the window.
        expr: max by (env) (max_over_time(auth_break_glass_attempts[15m])) > max by (env) (max_over_time(auth_break_glass_attempts[7d] offset 15m))
        for: 0m
        labels:
          severity: page
          component: auth_break_glass_attempt
          resolves: window
        annotations:
          summary: "A break-glass run was recorded on this host: review the audit log"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-authbreakglassattempted"
      - alert: SyntheticAlert
        expr: cv_synthetic_alert == 1
        for: 1m
        labels:
          severity: page
          component: alerting
        annotations:
          summary: "Synthetic drill alert (alert-drill)"
          runbook_url: "docs/plan/07-release-and-prr.md#alert-syntheticalert"
