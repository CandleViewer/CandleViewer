# promtool test rules (E04-T05). Generated by infra/alertmanager/gen_promtool_tests.py.
rule_files:
- ../alerts/system_page.yml
- ../alerts/system_ticket.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: naked_position_alerts_total
    values: 0+0x10 1+0x10
  alert_rule_test:
  - eval_time: 15m
    alertname: NakedPositionDetected
    exp_alerts:
    - exp_labels:
        severity: page
        component: oms
      exp_annotations:
        summary: A position was detected without a native stop-loss
        runbook_url: docs/plan/07-release-and-prr.md#alert-nakedpositiondetected
- interval: 1m
  input_series:
  - series: naked_position_alerts_total
    values: 0+0x20
  alert_rule_test:
  - eval_time: 15m
    alertname: NakedPositionDetected
    exp_alerts: []
- interval: 1m
  input_series:
  - series: oms_unknown_orders
    values: 0 2+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: OmsUnknownOrders
    exp_alerts:
    - exp_labels:
        severity: page
        component: oms
      exp_annotations:
        summary: OMS holds orders in an unknown state
        runbook_url: docs/plan/07-release-and-prr.md#alert-omsunknownorders
- interval: 1m
  input_series:
  - series: oms_unknown_orders
    values: 0+0x12
  alert_rule_test:
  - eval_time: 5m
    alertname: OmsUnknownOrders
    exp_alerts: []
- interval: 1m
  input_series:
  - series: pg_up
    values: 0+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: PostgresDown
    exp_alerts:
    - exp_labels:
        severity: page
        component: postgres
      exp_annotations:
        summary: Postgres is down
        runbook_url: docs/plan/07-release-and-prr.md#alert-postgresdown
- interval: 1m
  input_series:
  - series: pg_up
    values: 1+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: PostgresDown
    exp_alerts: []
- interval: 1m
