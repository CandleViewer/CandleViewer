# promtool test rules (E04-T05). Generated by infra/alertmanager/gen_promtool_tests.py.
rule_files:
- ../alerts/system_page.yml
- ../alerts/system_ticket.yml
- ../alerts/accounts.yml
evaluation_interval: 1m
