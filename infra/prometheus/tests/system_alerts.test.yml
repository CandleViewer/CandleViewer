- interval: 1m
  input_series:
  - series: naked_position_alerts_total
    values: 0+0x10 1+0x10
  alert_rule_test:
  - eval_time: 15m
    alertname: NakedPositionDetected
    exp_alerts:
    - exp_labels:
        severity: page
        component: oms
      exp_annotations:
        summary: A position was detected without a native stop-loss
        runbook_url: docs/plan/07-release-and-prr.md#alert-nakedpositiondetected
- interval: 1m
