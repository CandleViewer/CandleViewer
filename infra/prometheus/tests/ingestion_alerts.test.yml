              description: 'The measured offset to Bybit server time has exceeded 500 ms (E08-S07 acceptance criterion "Drift alarm"). Trading is not blocked yet. See docs/plan/runbooks/clock-sync.md.'
  # BybitClockDriftWarning upper edge: 2000 ms is still warning-level (`<= 2000`) ...
  - interval: 1m
    input_series:
      - series: 'exchange_clock_drift_ms{env="demo"}'
        values: "2000+0x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: BybitClockDriftWarning
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              component: "clock"
              env: "demo"
            exp_annotations:
              runbook_url: "docs/plan/07-release-and-prr.md#alert-bybitclockdriftwarning"
              summary: "Bybit clock offset drift is warning-level (2000 ms)"
              description: 'The measured offset to Bybit server time has exceeded 500 ms (E08-S07 acceptance criterion "Drift alarm"). Trading is not blocked yet. See docs/plan/runbooks/clock-sync.md.'
  # ... and 2001 ms is the critical band, so the warning goes silent.
  - interval: 1m
    input_series:
      - series: 'exchange_clock_drift_ms{env="demo"}'
        values: "2001+0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: BybitClockDriftWarning
        exp_alerts: []
  # --- BybitClockDriftCritical: 2000 ms is not above the line (`> 2000`).
  - interval: 1m
    input_series:
      - series: 'exchange_clock_drift_ms{env="demo"}'
        values: "2000+0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: BybitClockDriftCritical
        exp_alerts: []
  # BybitClockDriftCritical: 2001 ms pages after `for: 1m` (pending at 0 m, firing at 1 m); a negative offset counts by magnitude.
  - interval: 1m
    input_series:
      - series: 'exchange_clock_drift_ms{env="demo"}'
        values: "-2001+0x30"
    alert_rule_test:
      - eval_time: 0m
        alertname: BybitClockDriftCritical
        exp_alerts: []
      - eval_time: 1m
        alertname: BybitClockDriftCritical
        exp_alerts:
          - exp_labels:
              severity: "page"
              component: "clock"
              env: "demo"
            exp_annotations:
              runbook_url: "docs/plan/07-release-and-prr.md#alert-bybitclockdriftcritical"
              summary: "Bybit clock offset drift is critical (2001 ms)"
              description: "The measured offset exceeds the hard threshold (2000 ms, recv_window/2 per docs/plan/24-internal-schemas.md §14.3). assert_healthy() now raises ClockDriftError; E29 must refuse to place orders. See docs/plan/runbooks/clock-sync.md."
