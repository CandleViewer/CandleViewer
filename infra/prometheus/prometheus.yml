global:
  scrape_interval: 10s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: candleviewer-api
    metrics_path: /metrics
    # api binds its fixed private compose IP (see infra/compose/docker-compose.yml); public binds are refused
    static_configs:
      - targets: ["172.28.0.10:9108"]
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
