rules:
  - id: python-print
    languages: [python]
    severity: ERROR
    message: A print call.
    pattern: print(...)
  - id: bash-echo
    languages: [bash]
    severity: ERROR
    message: An echo command.
    pattern: echo ...
  - id: workflow-run-echo
    languages: [yaml]
    severity: ERROR
    message: An echo command in a run script.
    patterns:
      - pattern: "run: $SCRIPT"
      - metavariable-pattern:
          metavariable: $SCRIPT
          language: bash
          pattern: echo ...
